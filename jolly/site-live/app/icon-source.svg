<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- JIVO Mark 4 — the live production planner. Deep olive-green ground (JIVO), the amber oil drop the
       Mark series shares, a bold 4 cut into the drop. The mark before it was the same drop on near-black. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#0b3b22"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#g)"/>
  <path d="M 128 44 C 160 86 194 120 194 154 A 66 66 0 1 1 62 154 C 62 120 96 86 128 44 Z" fill="url(#d)"/>
  <text x="128" y="190" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="900" font-size="112" fill="#0b3b22">4</text>
</svg>
