# JIVO Utilities Register — the recurring-obligation calendar.
#
# This file is the BACKBONE of the utilities chase board. It is the one thing
# SAP does not know: which connections exist, when each bills, when each is due,
# and which budget it belongs to.
#
# Captured from a scan of the Accounts master sheet (see meta.source_document).
# BILL DAY / DUE DAY are DAYS OF THE MONTH, not dates — every row recurs monthly.
#
# `vendor`  = the SAP vendor CardCode a booked bill lands on (JIVO_OIL_HANADB).
# `match`   = how confidently a SAP posting can be tied back to THIS connection:
#               sole      -> this vendor card serves only this connection. Certain.
#               shared    -> the card serves several rows here. A posting must be
#                            disambiguated by amount history + date window, and the
#                            result is a GUESS the operator confirms.
#               reimbursed-> booked to a person's imprest card, not the utility's.
#               unmapped  -> no vendor card identified yet.
