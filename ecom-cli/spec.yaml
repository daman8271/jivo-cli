name: jivo-ecom
description: "JIVO e-commerce & quick-commerce analytics CLI (ecom.jivo.in) \u2014 read-only dashboards,\
  \ master data, notifications, and per-platform metrics across Amazon, Blinkit, Zepto, Swiggy, BigBasket,\
  \ Flipkart, Citymall, JioMart, Zomato"
version: 0.1.0
base_url: https://ecom.jivo.in
health_check_path: /api/auth/me
auth:
  type: bearer_token
  header: Authorization
  format: Bearer {token}
  env_vars:
  - JIVO_ECOM_TOKEN
config:
  format: toml
  path: ~/.config/jivo-ecom-pp-cli/config.toml
resources:
  account:
    description: 'Authenticated account: current user and permissions'
    endpoints:
      me:
        method: GET
        path: /api/auth/me
        description: Show the authenticated user (profile, groups, platforms, permissions)
        response:
          type: object
      permissions:
        method: GET
        path: /api/auth/permissions
        description: List the permission modules granted to the current user
        response:
          type: object
  dashboard:
    description: Top-level analytics dashboards aggregated across all platforms
    endpoints:
      latest-month:
        method: GET
        path: /api/dashboard/latest-month
        description: Latest data month/year available, with source metadata
        response:
          type: object
      top-skus:
        method: GET
        path: /api/dashboard/top-skus
        description: Top-selling SKUs with top risers and fallers
        params:
        - name: platform
          type: string
          description: 'Filter to a single platform slug (default: all)'
          enum:
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart
          - flipkart_grocery
          - jiomart
          - swiggy
          - zepto
          - zomato
        - name: month
          type: int
          description: 'Month number 1-12 (default: latest)'
        - name: year
          type: int
          description: 'Four-digit year (default: latest)'
        response:
          type: object
      category-breakdown:
        method: GET
        path: /api/dashboard/category-breakdown
        description: Premium vs commodity category breakdown
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
          enum:
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart
          - flipkart_grocery
          - jiomart
          - swiggy
          - zepto
          - zomato
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      category-litres:
        method: GET
        path: /api/dashboard/category-litres
        description: Category sales measured in litres
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      category-platform-breakdown:
        method: GET
        path: /api/dashboard/category-platform-breakdown
        description: Category breakdown split by platform
        params:
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      category-sku-breakdown:
        method: GET
        path: /api/dashboard/category-sku-breakdown
        description: SKU-level breakdown within a category (requires --platform)
        params:
        - name: platform
          type: string
          required: true
          description: Platform slug (required by this endpoint)
          enum:
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart
          - flipkart_grocery
          - jiomart
          - swiggy
          - zepto
          - zomato
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      category-trend:
        method: GET
        path: /api/dashboard/category-trend
        description: Category sales trend over time
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        response:
          type: object
      state-sales:
        method: GET
        path: /api/dashboard/state-sales
        description: State-wise sales with mapped/unmapped coverage
        params:
        - name: metric
          type: string
          description: Metric to report (e.g. units, value)
        - name: mode
          type: string
          description: Aggregation mode
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      state-sales-detail:
        method: GET
        path: /api/dashboard/state-sales/detail
        description: Detailed state-wise sales rows
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      fulfilment-health:
        method: GET
        path: /api/dashboard/fulfilment-health
        description: Fulfilment health summary by platform
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: window
          type: string
          description: Time window for the health check
        response:
          type: object
      inventory-charts:
        method: GET
        path: /api/dashboard/inventory-charts
        description: Inventory chart series
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        response:
          type: object
      primary-po-litres:
        method: GET
        path: /api/dashboard/primary-po-litres
        description: Primary purchase-order volume in litres
        params:
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      secondary-yoy-growth:
        method: GET
        path: /api/dashboard/secondary-yoy-growth
        description: Secondary sales year-over-year growth
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        response:
          type: object
      expiry-alerts:
        method: GET
        path: /api/dashboard/expiry-alerts/{platform}
        description: Expiry alerts for a single platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
          enum:
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart
          - flipkart_grocery
          - jiomart
          - swiggy
          - zepto
          - zomato
        response:
          type: object
      platform-expiry-alerts:
        method: GET
        path: /api/dashboard/platform-expiry-alerts
        description: Expiry alerts aggregated across platforms
        response:
          type: object
      lead-time-report:
        method: GET
        path: /api/dashboard/lead-time-report
        description: Distributor lead-time report (rows, slabs, grand total)
        response:
          type: object
      realise-overview:
        method: GET
        path: /api/dashboard/realise-overview
        description: 'Realise dashboard: overview (net realisation analytics)'
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: source
          type: string
          description: Data source
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      realise-breakdown:
        method: GET
        path: /api/dashboard/realise-breakdown
        description: 'Realise dashboard: breakdown (net realisation analytics)'
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: source
          type: string
          description: Data source
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      realise-trend:
        method: GET
        path: /api/dashboard/realise-trend
        description: 'Realise dashboard: trend (net realisation analytics)'
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: source
          type: string
          description: Data source
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      realise-waterfall:
        method: GET
        path: /api/dashboard/realise-waterfall
        description: 'Realise dashboard: waterfall (net realisation analytics)'
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: source
          type: string
          description: Data source
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      state-sales-detail-cities:
        method: GET
        path: /api/dashboard/state-sales/detail/cities
        description: State-sales detail drilled to cities
        params:
        - name: state
          type: string
          required: true
          description: State name
        - name: metric
          type: string
          description: Metric (units/value)
        - name: dimension
          type: string
          description: Dimension
        - name: platform
          type: string
          description: Platform slug
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      state-sales-detail-city-skus:
        method: GET
        path: /api/dashboard/state-sales/detail/city-skus
        description: State-sales detail drilled to city SKUs
        params:
        - name: state
          type: string
          required: true
          description: State name
        - name: city
          type: string
          required: true
          description: City name
        - name: metric
          type: string
          description: Metric
        - name: platform
          type: string
          description: Platform slug
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      state-sales-detail-options:
        method: GET
        path: /api/dashboard/state-sales/detail/options
        description: Filter options (skus, cities) for state-sales detail
        params:
        - name: platform
          type: string
          description: Platform slug
        - name: state
          type: string
          description: State name
        response:
          type: object
      state-sales-export:
        method: GET
        path: /api/dashboard/state-sales/export
        description: Export state-wise sales (file/CSV payload)
        params:
        - name: platform
          type: string
          description: Platform slug
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      expiry-alerts-pos:
        method: GET
        path: /api/dashboard/platform-expiry-alerts/{platform}/pos
        description: Purchase orders behind a platform expiry alert
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
          enum: &id001
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart
          - flipkart_grocery
          - jiomart
          - swiggy
          - zepto
          - zomato
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      expiry-alerts-po-items:
        method: GET
        path: /api/dashboard/platform-expiry-alerts/{platform}/pos/{po}/items
        description: Line items for a PO behind an expiry alert
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
          enum: *id001
        - name: po
          type: string
          required: true
          positional: true
          description: Purchase-order number
        response:
          type: object
  tables:
    description: Dynamic data-table browser over the underlying warehouse tables
    endpoints:
      counts:
        method: GET
        path: /api/dashboard/table-counts
        description: Row counts for every available data table
        response:
          type: object
      count:
        method: GET
        path: /api/dashboard/table-count/{table}
        description: Row count for a single table
        params:
        - name: table
          type: string
          required: true
          positional: true
          description: Table name (see 'tables counts')
        response:
          type: object
      columns:
        method: GET
        path: /api/dashboard/table-columns/{table}
        description: Column definitions for a table
        params:
        - name: table
          type: string
          required: true
          positional: true
          description: Table name
        response:
          type: object
      data:
        method: GET
        path: /api/dashboard/table-data/{table}
        description: Paginated rows for a table (server-shaped payload)
        params:
        - name: table
          type: string
          required: true
          positional: true
          description: Table name
        - name: page
          type: int
          description: Page number
        - name: page_size
          flag_name: page-size
          type: int
          description: Rows per page
        response:
          type: object
      distinct:
        method: GET
        path: /api/dashboard/table-distinct/{table}/{column}
        description: Distinct values for a column in a table
        params:
        - name: table
          type: string
          required: true
          positional: true
          description: Table name
        - name: column
          type: string
          required: true
          positional: true
          description: Column name
        response:
          type: object
  master:
    description: 'Master data: product catalogue and fulfilment centres'
    endpoints:
      products:
        method: GET
        path: /api/master/products
        description: List master products (paginated)
        params:
        - name: page
          type: int
          description: Page number
        - name: page_size
          flag_name: page-size
          type: int
          description: Rows per page
        - name: search
          type: string
          description: Free-text search filter
        response:
          type: object
        response_path: results
      fcs:
        method: GET
        path: /api/master/fcs
        description: List fulfilment centres (paginated)
        params:
        - name: page
          type: int
          description: Page number
        - name: page_size
          flag_name: page-size
          type: int
          description: Rows per page
        response:
          type: object
        response_path: results
  notifications:
    description: Read-only notifications with unread count
    endpoints:
      list:
        method: GET
        path: /api/notifications
        description: List notifications with unread count
        response:
          type: object
      get:
        method: GET
        path: /api/notifications/{id}
        description: Get a single notification by id
        params:
        - name: id
          type: string
          required: true
          positional: true
          description: Notification id
        response:
          type: object
      inventory-doh:
        method: GET
        path: /api/notifications/inventory-doh/{id}
        description: Inventory days-of-health detail for a notification id
        params:
        - name: id
          type: string
          required: true
          positional: true
          description: Inventory/DOH notification id
        response:
          type: object
  platform:
    description: Per-platform dashboards (Amazon, Blinkit, Zepto, Swiggy, BigBasket, Flipkart, Citymall,
      JioMart, Zomato)
    endpoints:
      stats:
        method: GET
        path: /api/platform/{platform}/stats
        description: Headline stats for a platform (inventory, sells, open POs, active trucks)
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
          enum:
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart
          - flipkart_grocery
          - jiomart
          - swiggy
          - zepto
          - zomato
        response:
          type: object
      primary:
        method: GET
        path: /api/platform/{platform}/primary-dashboard
        description: Primary (sell-in / PO) dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      secondary:
        method: GET
        path: /api/platform/{platform}/sec-dashboard
        description: Secondary (sell-out) dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      secondary-years:
        method: GET
        path: /api/platform/{platform}/sec-dashboard-years
        description: Years available for the secondary dashboard
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      secondary-monthly:
        method: GET
        path: /api/platform/{platform}/sec-monthly-dashboard
        description: Monthly secondary-sales dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      ads:
        method: GET
        path: /api/platform/{platform}/ads-dashboard
        description: Advertising performance dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      price:
        method: GET
        path: /api/platform/{platform}/price-dashboard
        description: Pricing dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      drr:
        method: GET
        path: /api/platform/{platform}/drr-dashboard
        description: Daily run-rate (DRR) dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      comparison:
        method: GET
        path: /api/platform/{platform}/comparison-dashboard
        description: Comparison dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      coupon:
        method: GET
        path: /api/platform/{platform}/coupon-dashboard
        description: Coupon performance dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      marketplace:
        method: GET
        path: /api/platform/{platform}/mp-dashboard
        description: Marketplace dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      pendency:
        method: GET
        path: /api/platform/{platform}/pendency-dashboard
        description: Order pendency dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      region-doh:
        method: GET
        path: /api/platform/{platform}/region-doh-dashboard
        description: Region-wise days-of-health dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      soh-doh:
        method: GET
        path: /api/platform/{platform}/soh-doh-dashboard
        description: Stock-on-hand / days-of-health dashboard for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      month-on-month-sale:
        method: GET
        path: /api/platform/{platform}/month-on-month-sale
        description: Month-on-month sales for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      pos:
        method: GET
        path: /api/platform/{platform}/pos
        description: Purchase orders for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      inventory-match:
        method: GET
        path: /api/platform/{platform}/inventory-match
        description: Inventory reconciliation/match for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      month-targets:
        method: GET
        path: /api/platform/{platform}/month-targets
        description: Secondary monthly targets for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      primary-month-targets:
        method: GET
        path: /api/platform/{platform}/primary-month-targets
        description: Primary monthly targets for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
        response:
          type: object
      ads-summary:
        method: GET
        path: /api/platform/ads-summary
        description: Cross-platform advertising summary
        response:
          type: object
      meta:
        method: GET
        path: /api/platform/meta
        description: Platform metadata (slugs, labels, config)
