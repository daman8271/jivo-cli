          description: "array of sub-category names; period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: item
          type: string
          description: "array of item names; period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        response:
          type: object
      state-sales-detail-cities:
        method: GET
        path: /api/dashboard/state-sales/detail/cities
        description: State-sales detail drilled to cities
        params:
