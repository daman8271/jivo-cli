      overall-pendency:
        method: GET
        path: /api/platform/overall-pendency
        description: "Group-level open-PO pendency across ALL EIGHT platforms at once, including amazon which the per-platform `pendency` route refuses. Volume figures match `platform pendency` exactly. TRAP 1: pending_value here is GST-INCLUSIVE while the order_value that `platform pendency` reports is pre-tax. The ratio is NOT a constant: 91 of 95 SKUs are 1.05x (5% GST), but aerated beverages are 1.40x (28% GST + 12% cess) - bigbasket LEMON 750ML, TONIC WATER 200ML, WATER PEACH 750ML and swiggy SODA LEMON 750 ML today. Dividing a beverage pending_value by 1.05 overstates it by 33%. Never convert between the two; call the endpoint you need. TRAP 2: `open_units` means ORDERED, not open; it equals pending_units on every q-commerce platform, which hides the error, and is 26% higher on amazon. TRAP 3: there is no `error` key on this response - it is absent, not null, so do not branch on it. min_po_date/max_po_date are DD-MM-YYYY (not ISO) and are nullable (citymall). `max_date` was null in every response observed."
        params:
        - name: platforms
          type: string
          description: "Comma-separated slugs from the response's own available_platforms[].slug. Omit for all eight. TRAP: this is NOT the 10-slug list on `account me` - flipkart and jiomart are rejected with HTTP 400 [\"Unknown platform(s): flipkart.\"]. Error bodies on this endpoint are bare JSON arrays of strings, not {detail:...}."
          required: false
          enum:
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart_grocery
          - swiggy
          - zepto
          - zomato
        - name: item_head
          type: string
          description: "Item head filter. Server-named enum: ALL | PREMIUM | COMMODITY | OTHER. ALL is the default and may be omitted."
          required: false
        - name: group_by
          type: string
          description: "Row grain: item | category | sub_category. Default item."
          required: false
        response:
          type: object
