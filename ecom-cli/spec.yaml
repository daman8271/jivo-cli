          type: object
      primary-summary:
        method: GET
        path: /api/platform/primary-summary
        description: Primary sell-in summary across platforms
        params:
        - name: month
          type: int
          description: Month number 1-12
        - name: year
          type: int
          description: Four-digit year
        response:
          type: object
      primary-summary-version:
        method: GET
        path: /api/platform/primary-summary-version
        description: Data version stamp for the primary summary
        response:
          type: object
      call-center-targets:
        method: GET
        path: /api/platform/call-center-targets
        description: Call-center secondary targets (premium/commodity)
        params:
        - name: month
          type: int
          required: true
          description: Month number 1-12
        - name: year
