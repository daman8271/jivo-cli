  reports:
    description: "Report views: Amazon PO, appointment, and raw report tables"
    endpoints:
      amazon-po:
        method: GET
        path: /api/reports/amazon-po
        description: Amazon PO report
        params:
        - name: page
          type: object
          description: Page number
        - name: page_size
          type: object
          description: Rows per page
        - name: po_number
          type: string
          description: PO number string
        - name: asin
          type: string
          description: ASIN; options come from filter-options.asins; server-driven option list - call /api/reports/amazon-po/filter-options first
        - name: fulfillment_center
          type: string
          description: FC code; options from filter-options.fulfillment_centers; server-driven option list
        - name: month
          type: integer
          description: month; options from filter-options.months; server-driven option list
        - name: year
          type: integer
          description: year; options from filter-options.years; server-driven option list
        - name: channel
          type: string
          description: uppercase; staticOptions in the source - this IS the full set
          enum:
          - CORE
          - FRESH
          - NOW
        - name: po_status
          type: string
          description: options from filter-options.po_statuses; server-driven option list
        - name: item_status
          type: string
          description: options from filter-options.item_statuses; server-driven option list
        - name: item_head
          type: string
          description: uppercase; staticOptions in the source
          enum:
          - PREMIUM
          - COMMODITY
          - OTHER
        - name: sort_by
          type: string
          description: column name; sortBy is attached to a view definition; only expiry_date is written literally
          enum:
          - expiry_date
        - name: helper
          type: string
          enum:
          - INCLUDE
        - name: status_exact
          type: string
          enum:
          - confirmed
