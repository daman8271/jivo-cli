      amazon-po-sku-pendency-summary:
        method: GET
        path: /api/reports/amazon-po/sku-pendency/summary
        description: "Totals for the Amazon Shipment-Planner open book: lines, requested/accepted/received/remaining units and litres, fill rate. Takes NO parameters - fulfillment_center and channel are accepted and then silently ignored (byte-identical bodies). TRAP 1: this summary's `open_units` equals the row report's `remaining_qty`, NOT its `open_qty` - same word, different metric. TRAP 2: `totals` here is unfiltered; the row report's `totals` is filter-scoped, so only the bare call is comparable to it. `total` carries 40 keys (including order_ltrs, accepted_ltrs, delivered_ltrs); `delivery_shortfall_ltrs` exactly duplicates `remaining_ltrs`. 5 of 11 by_fc rows and the \"-\" channel row null out fill_rate_pct, cancel_rate_pct, invoiced_share_pct, uninvoiced_share_pct and short_invoice_rate_pct; only acceptance_rate_pct never nulls."
        response:
          type: object
