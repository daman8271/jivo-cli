        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: source
          type: string
          description: Data source
        - name: month
          type: object
          description: Month number 1-12
        - name: year
          type: object
          description: Four-digit year
        - name: item_head
          type: string
          description: item-head key; omitted when blank
        - name: category
          type: string
          description: category name; omitted when blank
        response:
          type: object
      realise-trend:
        method: GET
        path: /api/dashboard/realise-trend
        description: "Realise dashboard: trend (net realisation analytics)"
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: source
          type: string
          description: Data source
        - name: month
          type: object
          description: Month number 1-12
        - name: year
          type: object
          description: Four-digit year
        - name: item_head
          type: string
          description: item-head key; omitted when blank
        - name: category
          type: string
          description: category name; omitted when blank
        - name: months
          type: integer
          description: integer (12 observed)
        response:
          type: object
      realise-waterfall:
        method: GET
        path: /api/dashboard/realise-waterfall
        description: "Realise dashboard: waterfall (net realisation analytics)"
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: source
          type: string
          description: Data source
        - name: month
          type: object
          description: Month number 1-12
        - name: year
          type: object
          description: Four-digit year
        - name: item_head
          type: string
          description: item-head key; omitted when blank; waterfall has no call site in the downloaded chunks; params inferred from the shared H/U objects in the same screen
        - name: category
          type: string
          description: category name; omitted when blank; waterfall has no call site in the downloaded chunks; params inferred from the shared H/U objects in the same screen
        response:
          type: object
      secondary-yoy-growth:
        method: GET
        path: /api/dashboard/secondary-yoy-growth
        description: Secondary sales year-over-year growth
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: year
          type: integer
          description: 4-digit year
        - name: month
          type: integer
          description: month number
        response:
          type: object
      state-sales:
        method: GET
        path: /api/dashboard/state-sales
        description: State-wise sales with mapped/unmapped coverage
        params:
        - name: metric
          type: string
          description: Metric to report (e.g. units, value)
          required: true
          enum:
          - litres
          - value
          - units
        - name: mode
          type: string
          description: Aggregation mode
        - name: platform
          type: string
          description: Filter to a single platform slug
          enum:
          - amazon
          - flipkart
          - swiggy
          - blinkit
          - zepto
          - bigbasket
        - name: month
          type: object
          description: Month number 1-12
        - name: year
          type: object
          description: Four-digit year
        - name: item_head
          type: string
          description: uppercase; `all` is NOT sent - the key is omitted instead
          enum:
          - PREMIUM
          - COMMODITY
          - OTHER
        - name: months
          type: integer
          description: "array of month numbers, repeated as month=1&month=2 by the URL builder; period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: from_month
          type: string
          description: "month number (range mode); period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: from_year
          type: string
          description: "4-digit year (range mode); period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: to_month
          type: string
          description: "month number (range mode); period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: to_year
          type: string
          description: "4-digit year (range mode); period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: brand
          type: string
          description: "array of brand names; period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: category
          type: string
          description: "array of category names; period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: sub_category
          type: string
          description: "array of sub-category names; period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: item
