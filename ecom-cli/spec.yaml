      month-targets-dashboard:
        method: GET
        path: /api/platform/month-targets/dashboard
        description: Secondary month-targets dashboard across platforms
        params:
        - name: month
          type: int
          required: true
          description: Month number 1-12
        - name: year
          type: int
          required: true
          description: Four-digit year
        response:
          type: object
      primary-month-targets-dashboard:
        method: GET
        path: /api/platform/primary-month-targets/dashboard
        description: Primary month-targets dashboard across platforms
        params:
        - name: month
          type: int
          required: true
          description: Month number 1-12
        - name: year
          type: int
          required: true
          description: Four-digit year
        response:
          type: object
      ads-total-sales:
        method: GET
        path: /api/platform/{platform}/ads-total-sales
        description: Ads total-sales for a platform
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
          enum: *id001
        response:
          type: object
      mp-dashboard-version:
        method: GET
        path: /api/platform/{platform}/mp-dashboard-version
        description: Data version stamp for a platform marketplace dashboard
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
          enum: *id001
        response:
          type: object
      landing-rate:
        method: GET
        path: /api/platform/{platform}/landing-rate
        description: Monthly landing rate (blinkit/zepto/swiggy/bigbasket/flipkart_grocery only)
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
          enum: *id001
        - name: page
          type: int
          description: Page number
        - name: page_size
          type: int
          description: Rows per page
          flag_name: page-size
        response:
          type: object
        response_path: data
      landing-rate-skus:
        method: GET
        path: /api/platform/{platform}/landing-rate/skus
        description: Landing-rate SKUs (blinkit/zepto/swiggy/bigbasket/flipkart_grocery only)
        params:
        - name: platform
          type: string
          required: true
          positional: true
          description: Platform slug
          enum: *id001
        response:
          type: object
