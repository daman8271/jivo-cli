name: jivo-ecom
description: JIVO e-commerce & quick-commerce analytics CLI (ecom.jivo.in) - read-only dashboards, master data, notifications, SAP mirror, Amazon PO reporting and per-platform metrics across Amazon, Blinkit, Zepto, Swiggy, BigBasket, Flipkart, Citymall, JioMart, Zomato
version: 0.2.1
base_url: https://ecom.jivo.in
health_check_path: /api/auth/me
auth:
  type: bearer_token
  header: Authorization
  format: Bearer {token}
  env_vars:
  - JIVO_ECOM_TOKEN
config:
  format: toml
  path: ~/.config/jivo-ecom-pp-cli/config.toml
resources:
  account:
    description: "Authenticated account: current user, permissions and feature flags"
    endpoints:
      feature-flags:
        method: GET
        path: /api/auth/feature-flags
        description: Feature flags (getFeatureFlags)
        response:
          type: object
      me:
        method: GET
        path: /api/auth/me
        description: Show the authenticated user (profile, groups, platforms, permissions)
        response:
          type: object
      permissions:
        method: GET
        path: /api/auth/permissions
        description: List the permission modules granted to the current user
        response:
          type: object
  chatbot:
    description: Read-only access to the ecom app's built-in assistant (health + conversation history)
    endpoints:
      conversation:
        method: GET
        path: /api/chatbot/conversations/{id}
        description: Get a chatbot conversation (with messages) by id
        params:
        - name: id
          type: string
          description: Conversation id
          required: true
        - name: conversation_id
          type: string
          description: conversation id from /api/chatbot/conversations
          required: true
        response:
          type: object
      conversations:
        method: GET
        path: /api/chatbot/conversations
        description: List chatbot conversations
        response:
          type: array
      health:
        method: GET
        path: /api/chatbot/health
        description: Chatbot service health
        response:
          type: object
  dashboard:
    description: Top-level analytics dashboards aggregated across all platforms
    endpoints:
      category-breakdown:
        method: GET
        path: /api/dashboard/category-breakdown
        description: Premium vs commodity category breakdown
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
          enum:
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart
          - flipkart_grocery
          - jiomart
          - swiggy
          - zepto
          - zomato
        - name: month
          type: object
          description: Month number 1-12
          required: true
        - name: year
          type: object
          description: Four-digit year
          required: true
        - name: source
          type: string
          enum:
          - primary
          - secondary
        response:
          type: object
      category-litres:
        method: GET
        path: /api/dashboard/category-litres
        description: Category sales measured in litres
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: month
          type: object
          description: Month number 1-12
        - name: year
          type: object
          description: Four-digit year
        response:
          type: object
      category-platform-breakdown:
        method: GET
        path: /api/dashboard/category-platform-breakdown
        description: "Category breakdown split by platform Server requires: name is required."
        params:
        - name: month
          type: object
          description: Month number 1-12
          required: true
        - name: year
          type: object
          description: Four-digit year
          required: true
        - name: source
          type: string
          enum:
          - primary
          - secondary
        - name: head
          type: string
          description: category / item-head key taken from the clicked row (e?.head); values come from a previously fetched breakdown row - NOT a fixed set; no literal member observed
        - name: dimension
          type: string
          description: dimension key taken from the clicked row (e?.dimension); values come from a previously fetched breakdown row - NOT a fixed set; no literal member observed
        - name: name
          type: string
          description: row name taken from the clicked row (e?.name); values come from a previously fetched breakdown row - NOT a fixed set; no literal member observed
        response:
          type: object
      category-sku-breakdown:
        method: GET
        path: /api/dashboard/category-sku-breakdown
        description: "SKU-level breakdown within a category (requires --platform) Server requires: name is required."
        params:
        - name: platform
          type: string
          description: Platform slug (required by this endpoint)
          required: true
          enum:
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart
          - flipkart_grocery
          - jiomart
          - swiggy
          - zepto
          - zomato
        - name: month
          type: object
          description: Month number 1-12
        - name: year
          type: object
          description: Four-digit year
        response:
          type: object
      category-trend:
        method: GET
        path: /api/dashboard/category-trend
        description: Category sales trend over time
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: source
          type: string
          enum:
          - primary
          - secondary
        - name: month
          type: integer
          description: month number 1-12
          required: true
        - name: year
          type: integer
          description: 4-digit year
          required: true
        - name: months
          type: integer
          description: integer count of trailing months (6 observed)
        response:
          type: object
      expiry-alerts:
        method: GET
        path: /api/dashboard/expiry-alerts/{table}
        description: "Expiry alerts for one reporting table. NOTE: the path segment is a TABLE name (see `tables counts`), not a platform slug - passing a platform returns 200 with an empty list, which is a false negative."
        params:
        - name: table
          type: string
          description: Reporting-schema table name, case-sensitive. The valid set is the key list of `dashboard table-counts`, which is the server's own allowlist - anything else returns 400 "Table not allowed".
          required: true
          enum:
          - all_platform_inventory
          - amazon_ads
          - amazon_coupon
          - amazon_inventory
          - amazon_mp
          - amazon_price_data
          - amazon_sec_city
          - amazon_sec_daily
          - amazon_sec_daily_master_view
          - amazon_sec_range
          - amazon_sec_range_margins
          - amazon_sec_range_master_view
          - bigbasketSec
          - bigbasket_ads
          - bigbasket_inventory
          - bigbasket_sec_range
          - blinkitSec
          - blinkit_ads
          - blinkit_brandfund
          - blinkit_inventory
          - citymallSec
          - citymall_inventory
          - fk_grocery
          - flipkartSec
          - flipkart_ads
          - flipkart_grocery_master
          - flipkart_secondary_all
          - jiomartSec
          - jiomart_inventory
          - master_po
          - prim_master_po
          - swiggySec
          - swiggy_ads
          - swiggy_brandfund
          - swiggy_inventory
          - test_master_po
          - total_po
          - total_po_zbs
          - zeptoSec
          - zepto_ads
          - zepto_brandfund
          - zepto_inventory
          - zomatoSec
          - zomato_inventory
        response:
          type: object
      expiry-alerts-po-items:
        method: GET
        path: /api/dashboard/platform-expiry-alerts/{platform}/pos/{po}/items
        description: Line items for a PO behind an expiry alert
        params:
        - name: platform
          type: string
          description: Platform slug
          required: true
          enum:
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart
          - flipkart_grocery
          - jiomart
          - swiggy
          - zepto
          - zomato
        - name: po
          type: string
          description: Purchase-order number
          required: true
        - name: po_number
          type: string
          description: PO number, URL-encoded (encodeURIComponent in the template); the encodeURIComponent proves PO numbers contain characters needing escaping
          required: true
        response:
          type: object
      expiry-alerts-pos:
        method: GET
        path: /api/dashboard/platform-expiry-alerts/{platform}/pos
        description: Purchase orders behind a platform expiry alert
        params:
        - name: platform
          type: string
          description: Platform slug
          required: true
          enum:
          - amazon
          - bigbasket
          - blinkit
          - citymall
          - flipkart
          - flipkart_grocery
          - jiomart
          - swiggy
          - zepto
          - zomato
        - name: month
          type: object
          description: Month number 1-12
        - name: year
          type: object
          description: Four-digit year
        response:
          type: object
      fulfilment-health:
        method: GET
        path: /api/dashboard/fulfilment-health
        description: Fulfilment health summary by platform
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: window
          type: string
          description: Time window for the health check
        response:
          type: object
      inventory-charts:
        method: GET
        path: /api/dashboard/inventory-charts
        description: Inventory chart series
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        response:
          type: object
      latest-month:
        method: GET
        path: /api/dashboard/latest-month
        description: Latest data month/year available, with source metadata
        response:
          type: object
      lead-time-report:
        method: GET
        path: /api/dashboard/lead-time-report
        description: Distributor lead-time report (rows, slabs, grand total)
        params:
        - name: platform
          type: string
          description: platform slug
        - name: month
          type: integer
        - name: year
          type: integer
        - name: item_head
          type: string
        response:
          type: object
      penetration-report:
        method: GET
        path: /api/dashboard/penetration-report
        description: Penetration report (get)
        params:
        - name: month
          type: integer
          description: month number
        - name: year
          type: integer
          description: 4-digit year
        - name: page
          type: integer
          description: 0-based integer
        - name: page_size
          type: integer
          description: integer; 1e5 used for export
        - name: platform
          type: string
          description: array of platform slugs
        - name: item_head
          type: string
          description: array of item-head keys
        - name: category
          type: string
          description: array of category names
        - name: sub_category
          type: string
          description: array of sub-category names
        - name: status
          type: string
          description: keys read off the status-ranking map n={live:3,selling:2,stocked:1,inactive:0}; the filter chips use the same keys, but I did not see the chip array itself
          enum:
          - live
          - selling
          - stocked
          - inactive
        - name: search
          type: string
          description: free text
        - name: group_by
          type: string
          description: A===`city`?...:A===`sku`?...; empty means no grouping
          enum:
          - city
          - sku
        - name: sort
          type: string
          description: column key from the table header
        - name: dir
          type: string
          description: both literals present in the chunk; I did not isolate the toggle that writes them
          enum:
          - asc
          - desc
        - name: nocache
          type: string
          description: "{...F,nocache:1} on the force-refresh path"
          enum:
          - 1
        response:
          type: object
      penetration-report-options:
        method: GET
        path: /api/dashboard/penetration-report/options
        description: Penetration report options (getOptions)
        response:
          type: object
      platform-expiry-alerts:
        method: GET
        path: /api/dashboard/platform-expiry-alerts
        description: Expiry alerts aggregated across platforms
        response:
          type: object
      primary-po-litres:
        method: GET
        path: /api/dashboard/primary-po-litres
        description: Primary purchase-order volume in litres
        params:
        - name: month
          type: object
          description: Month number 1-12
        - name: year
          type: object
          description: Four-digit year
        response:
          type: object
      realise-breakdown:
        method: GET
        path: /api/dashboard/realise-breakdown
        description: "Realise dashboard: breakdown (net realisation analytics)"
        params:
        - name: platform
          type: string
          description: Filter to a single platform slug
        - name: source
          type: string
          description: Data source
        - name: month
          type: object
          description: Month number 1-12
        - name: year
          type: object
          description: Four-digit year
        - name: item_head
          type: string
          description: item-head key; omitted when blank
        - name: category
          type: string
          description: category name; omitted when blank
        - name: group_by
          type: string
          enum:
          - category
          - sub_category
        response:
          type: object
      realise-overview:
        method: GET
