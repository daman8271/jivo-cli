        - name: brand
          type: string
          description: "array of brand names; period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: category
          type: string
          description: "array of category names; period keys are mutually exclusive: {month,year} OR {months[],year} OR {from_month,from_year,to_month,to_year}"
        - name: sub_category
