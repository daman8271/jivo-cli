      gate-person-dashboard:
        method: GET
        path: /person-gatein/dashboard/
        description: 'Security supervisor''s live board: how many visitors and labours are inside the plant right now, today''s entries/exits, gate-wise headcount, and the last 10 entries.'
        response:
          type: object
        params:
        - name: from_date
          type: string
          description: 'VERIFIED to work — but it only changes the `range` block, never `current` or `today`. Omitted, `range` equals `today`. date (YYYY-MM-DD)'
        - name: to_date
          type: string
          description: 'Inclusive end of the `range` window. Live check: from_date=2026-07-01&to_date=2026-07-31 returned range={total_entries:75, visitors:75, labours:0, exits:74} vs today={1,1,0,1}. date (YYYY-MM-DD)'
      entries:
        method: GET
        path: /person-gatein/entries/
        description: 'The full gate register — every visitor and labour entry ever recorded, with entry/exit time, gate, purpose, vehicle and status.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'VERIFIED exact-match filter (IN=0, OUT=284, CANCELLED=3, total 287). NOT validated — status=BOGUS silently returns count 0 rather than a 400, so a typo looks like ''no data''. enum: IN | OUT | CANCELLED'
        - name: person_type
          type: integer
          description: 'VERIFIED (1 -> 286 rows, 2 -> 1 row). It is the numeric PersonType PK, NOT the word ''visitor''. Fetch /person-gatein/person-types/ to confirm the ids before trusting the constant. 1 = visitor, 2 = labour'
        - name: gate_in
