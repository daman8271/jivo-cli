  returnable-items:
    description: 'This is JIVO''s RGP/NRGP gate-pass book — the register of material that leaves the factory gate and is meant to come back. A department raises a pass for a pump, motor, mould shaft, cutter, cooler, or'
    endpoints:
      dashboard:
        method: GET
        path: /returnable-items/dashboard/
        description: 'One-glance returnable summary — how many passes sit in each state, how many are outstanding, and how old the outstanding ones are.'
        response:
          type: object
      options:
        method: GET
        path: /returnable-items/options/
        description: 'The dropdown vocabulary for this module — the exact status, purpose, out-condition and return-condition codes with their human labels.'
        response:
          type: object
      report:
        method: GET
        path: /returnable-items/reports/
        description: 'Flat gate-pass register for export — one row per pass with the dates that matter, filterable by status and by the date it was raised.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'Same 8 values as the list endpoint. HONOURED — verified live: status=OUT cut count from 40 to 5. enum'
        - name: date_from
          type: string
          description: 'HONOURED — verified live: date_from=2026-07-31 cut count from 40 to 5. Filters on the date the pass was RAISED (created_at), not on expected_return_date or gate_out_at. date YYYY-MM-DD'
        - name: date_to
          type: string
          description: 'HONOURED — verified live: date_to=2026-07-31 gave 39 of 40, excluding exactly the one pass created on 2026-08-01. date YYYY-MM-DD'
      attachments:
        method: GET
        path: /returnable-items/returnable-attachments/
        description: 'Delivery challans and photos attached to gate passes, with a direct file URL for each.'
        response:
          type: array
        params:
        - name: gate_pass
          type: integer
          description: 'Filter to one gate pass. Verified live: gate_pass=49 returned its one CHALLAN image.'
      gatepass-items:
        method: GET
        path: /returnable-items/returnable-gatepass-items/
        description: 'Line-item register across all gate passes — every physical thing sent out, with quantity out, quantity returned and what is still pending.'
        response:
          type: array
        params:
        - name: gate_pass
          type: integer
          description: 'Filter to one gate pass. Verified live: gate_pass=49 returned exactly that pass''s single line.'
      gatepass-item:
        method: GET
        path: /returnable-items/returnable-gatepass-items/{id}/
        description: 'Show one gate-pass line item by its own id. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Line-item PK, not the gate-pass id. Verified live on id 1 (FA0000183 BOSCH CUTTER). (path segment)'
      gatepasses:
        method: GET
        path: /returnable-items/returnable-gatepasses/
        description: 'List returnable/non-returnable gate passes — material sent out of the gate for repair, exchange or job work, and whether it has come back.'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'DRAFT | PENDING_APPROVAL | PENDING_GATE_OUT | OUT | PARTIALLY_RETURNED | RETURNED | CLOSED | CANCELLED. Verified live: status=OUT narrowed 40 rows to 5. NEVER send the UI''s sentinel value ALL — the frontend strips it before the request. enum'
        - name: purpose
          type: string
          description: 'REPAIR | EXCHANGE | CALIBRATION | JOB_WORK | WARRANTY_CLAIM | TESTING | DEMO_TRIAL | OTHER. Verified live: purpose=REPAIR narrowed 40 to 14. Same ALL caveat. enum'
        - name: is_returnable
          type: boolean
          description: 'true = RGP series only, false = NRGP series only. Verified live: is_returnable=false returned the 16 NRGP passes.'
        - name: overdue
          type: boolean
          description: 'Verified live but USELESS today: overdue=true returns 0 rows even though passes are 6 days past their expected_return_date, because it filters on the stale stored is_overdue flag. See gotchas.'
        - name: q
          type: string
          description: 'Free-text search over pass no, party, item name and serial number (UI placeholder text). Verified live: q=Manoj returned 3 passes, matching both party_name ''Manoj electrical'' and driver_name ''Manoj''.'
      pending-approval:
        method: GET
        path: /returnable-items/returnable-gatepasses/pending-approval/
        description: 'The approver''s inbox — gate passes submitted by a department and waiting for sign-off before they may go to the gate.'
        response:
          type: array
      pending-gate-in:
        method: GET
        path: /returnable-items/returnable-gatepasses/pending-gate-in/
        description: 'The inbound guard''s list — material that is still out with an outside party and has not been logged back in.'
        response:
          type: array
      pending-gate-out:
        method: GET
        path: /returnable-items/returnable-gatepasses/pending-gate-out/
        description: 'The outbound guard''s release queue — approved gate passes whose material has not yet physically left the gate.'
        response:
          type: array
      gatepass:
        method: GET
        path: /returnable-items/returnable-gatepasses/{id}/
        description: 'Show one gate pass in full — party, department, dates, approvals, vehicle/driver, every line item, every return event and every attachment. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Numeric primary key from the list endpoint''s id field — NOT the pass_no. Verified live on ids 11, 22 and 49 in JIVO_OIL. (path segment)'
      timeline:
        method: GET
        path: /returnable-items/returnable-gatepasses/{id}/timeline/
        description: 'The audit trail of one gate pass — who submitted, approved, released it at the gate, logged the return, and when. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Gate-pass PK. Verified live on id 49: 3 rows — SUBMITTED, APPROVED, GATE_OUT. (path segment)'
      return-events:
        method: GET
        path: /returnable-items/returnable-return-events/
        description: 'Every time material came back through the gate — when, on which vehicle, verified by whom, and in what condition each item arrived.'
        response:
          type: array
        params:
        - name: gate_pass
          type: integer
          description: 'Filter to one gate pass. Verified live: gate_pass=11 returned its single R1 event.'
      sap-items:
        method: GET
        path: /returnable-items/sap-items/
        description: 'Look up a SAP item by name or code to put on a gate pass — returns item code, name and unit of measure. Required: search.'
        response:
          type: array
        params:
        - name: search
          type: string
          required: true
          description: 'EFFECTIVELY REQUIRED but not enforced: with no search the endpoint returns 200 and an empty array rather than a 400, which reads as ''no SAP items exist''. Verified live: search=BOSCH on JIVO_OIL returned FA0000183 BOSCH CUTTER.'
        - name: limit
          type: integer
          description: 'Row cap; the UI passes 50 by default. Verified live that the param is accepted (limit=5 alongside search=BOSCH), though the result set was too small to prove it truncates.'
  sap:
    description: 'This corner of the factory app answers one question: can we actually build what SAP says we are going to build, and what do we have to buy to close the gap. The "SAP Material Plan" screen (web route /'
    endpoints:
      plan-dashboard-details:
        method: GET
        path: /sap/plan-dashboard/details/
        description: 'Same open production orders as the summary but with every BOM component line nested — required, issued, remaining, stock on hand/committed/on-order, shortfall and per-component stock status.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'planned | released. Verified server-side (OIL 201 -> 164 for released).'
        - name: due_date_from
          type: string
          description: 'YYYY-MM-DD'
        - name: due_date_to
          type: string
          description: 'YYYY-MM-DD'
        - name: warehouse
          type: string
          description: 'UPPERCASE SAP warehouse code'
        - name: sku
          type: string
          description: 'UPPERCASE SAP item code; verified warehouse=BH-PF&sku=FG0000030 -> 7 orders / 49 lines'
        - name: show_shortfall_only
          type: boolean
          description: 'Send as true. VERIFIED effective here: OIL 201 orders/1127 lines -> 141 orders/417 lines. (Unlike on the summary endpoint, where it is a no-op.)'
      plan-dashboard-procurement:
        method: GET
        path: /sap/plan-dashboard/procurement/
        description: 'Shortfall rolled up by component across all open production orders, with a suggested purchase quantity and the production orders that need it — the buy list.'
        response:
          type: object
        params:
        - name: show_shortfall_only
          type: boolean
          description: 'Send as true. VERIFIED effective: OIL 191 components -> 59 (exactly the components_with_shortfall count). The most useful flag on this command.'
        - name: status
          type: string
          description: 'planned | released — accepted by the shared filter (inferred: I verified status on summary and details, not on procurement).'
        - name: due_date_from
          type: string
          description: 'YYYY-MM-DD'
        - name: due_date_to
          type: string
          description: 'YYYY-MM-DD'
        - name: warehouse
          type: string
          description: 'UPPERCASE SAP warehouse code'
        - name: sku
          type: string
          description: 'UPPERCASE SAP finished-good item code — filters by the parent order''s SKU, not by the component'
      plan-dashboard-sku:
        method: GET
        path: /sap/plan-dashboard/sku/{prod_order_entry}/
        description: 'Full BOM component breakdown for ONE open production order — required vs issued vs remaining, available stock and shortfall per component. Required: prod_order_entry.'
        response:
          type: object
        params:
        - name: prod_order_entry
          type: integer
          required: true
          description: 'PATH parameter. This is the SAP production order DocEntry (e.g. 751), taken from prod_order_entry in the summary/details payload. Despite the path saying ''sku'', it is NOT a SKU code — passing FG0000030 will not resolve.'
      plan-dashboard-summary:
        method: GET
        path: /sap/plan-dashboard/summary/
        description: 'One row per open SAP production order: planned vs completed qty, due date, warehouse and how many of its BOM components are short — the ''which orders are at risk'' view.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'Enum, lowercase: planned | released. VERIFIED server-side (OIL 201 rows -> 37 with status=planned, matching the local count). The web UI does NOT send this (it filters client-side and strips status from its query key), so it is undocumented but real.'
        - name: due_date_from
          type: string
          description: 'YYYY-MM-DD, inclusive lower bound on due_date. Verified (OIL 201 -> 17 for 2026-07-01..2026-08-31).'
        - name: due_date_to
          type: string
          description: 'YYYY-MM-DD, inclusive upper bound on due_date.'
        - name: warehouse
          type: string
          description: 'SAP warehouse code, e.g. BH-PF. Must be UPPERCASE — the UI trims+uppercases before sending. Verified (OIL 201 -> 143 for BH-PF). Codes come from `po warehouses`.'
        - name: sku
          type: string
          description: 'SAP finished-good item code, e.g. FG0000030. Must be UPPERCASE. Verified (OIL 201 -> 7).'
  vehicle-management:
    description: 'This is the factory''s transport master file plus the gate''s vehicle-entry log. Three master lists sit under it — Vehicles (registration number, type, capacity, owning transporter), Transporters (conta'
    endpoints:
      transporters:
        method: GET
