  grpo:
    description: 'GRPO = "Goods Receipt PO" — the step where material that has physically arrived at a JIVO plant gets booked into SAP as a purchase receipt. It has two completely separate halves that share the /grpo/'
    endpoints:
      all-entries:
        method: GET
        path: /grpo/all-entries/
        description: 'Every raw-material gate entry visible to GRPO — including trucks still at the gate or sitting with QC — with supplier, PO numbers and per-item accepted/rejected quantity.'
        response:
          type: object
        params:
        - name: phase
          type: string
          description: 'enum GATE | QC | DONE | CANCELLED (from the server docstring; UI exposes ALL/GATE/QC/DONE). Omit for all phases. Filters `results` only — the `counts` block always reflects the unfiltered month scope.'
        - name: year
          type: integer
          description: 'e.g. 2026. UI pairs it with month; omitting BOTH returns all-time (verified: 573 unfiltered vs 142 for 2026-07 on OIL). int'
        - name: month
          type: integer
          description: '1-12 int'
        - name: search
          type: string
          description: 'free text over entry no / supplier / PO / status (UI placeholder ''Search entry, supplier, PO, status…''); verified: search=GE-2026-9760 returns exactly 1'
        - name: page
          type: integer
          description: '1-based int'
        - name: page_size
          type: integer
          description: 'UI default 25; server HARD-CAPS at 100 — asking 500 returns 100 int'
      history:
        method: GET
        path: /grpo/history/
        description: 'Log of every material GRPO posting ATTEMPT — posted, failed or saved-as-draft — with the SAP document number or the verbatim SAP error.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'enum DRAFT | PENDING | POSTED | FAILED | PARTIALLY_POSTED (from status.constants-BWw2RNtv.js; all five verified live on OIL: 0/0/208/19/0)'
        - name: vehicle_entry_id
          type: integer
          description: 'documented in the server''s own OPTIONS docstring: ''GET /api/grpo/history/?vehicle_entry_id=123''; verified returns just that entry''s attempts int'
        - name: year
          type: integer
          description: 'omit year+month for all-time (227 vs 62 for 2026-07 on OIL) int'
        - name: month
          type: integer
          description: '1-12 int'
        - name: search
          type: string
          description: 'free text over entry / PO / SAP doc no / status; verified'
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'capped at 100 int'
      history-detail:
        method: GET
        path: /grpo/history/{posting_id}/
        description: 'GET /grpo/history/{posting_id}/'
        response:
          type: object
      inspection-report:
        method: GET
        path: /grpo/inspection-report/{arrival_slip_id}/
        description: 'The full QC inspection report behind a receipt — chemist and QA-manager decisions, parameter results, accept/reject verdict and its attachments. Required: arrival_slip_id.'
        response:
          type: object
        params:
        - name: arrival_slip_id
          type: integer
          required: true
          description: 'path segment; the `arrival_slip_id` on an item inside /grpo/all-entries/ or /grpo/preview/. NOT the inspection id and NOT the vehicle entry id. int'
      pending:
        method: GET
        path: /grpo/pending/
        description: 'Gate entries that have cleared QC and are waiting to be posted to SAP — the actual GRPO work queue, grouped by supplier so several POs can be merged into one receipt.'
        response:
          type: object
        params:
        - name: year
          type: integer
          description: 'omit year+month for all-time (327 vs 97 for 2026-07 on OIL) int'
        - name: month
          type: integer
          description: '1-12 int'
        - name: search
          type: string
          description: 'verified: search=<entry_no> narrows to 1'
        - name: page
          type: integer
          description: 'int'
        - name: page_size
