          description: 'observed value INVOICE (the UI sends document_type:''INVOICE'' in gate-out mode)'
        - name: all_companies
          type: integer
          description: 'send 1. VERIFIED live: a MART-headed 3-day query went from 7 rows (all JIVO_MART) to 30 rows (BEV 18 / MART 7 / OIL 5). This is the only clean way to see one truck''s whole load.'
        - name: page
          type: integer
          description: '1-based. Sending page SWITCHES the response from a bare array to an envelope.'
        - name: page_size
          type: integer
          description: 'UI default 25'
      sales-dispatch-documents:
        method: GET
