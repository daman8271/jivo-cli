        - name: entry_id
          type: integer
          required: true
          description: 'Vehicle-entry id from /vehicle-management/vehicle-entries/?entry_type=DAILY_NEED. (path)'
  dashboards:
    description: 'This is the factory app''s read-only reporting corner — the five "management dashboard" screens the plant and purchase teams open when they want to know what stock is sitting where, how old it is, what'
    endpoints:
      inventory-age-filter-options:
        method: GET
        path: /dashboards/inventory-age/filter-options/
        description: 'The company''s own list of item groups, sub-groups, warehouses and varieties — the authoritative pick-list for every other filter in this group.'
        response:
          type: object
      inventory-age-report:
        method: GET
        path: /dashboards/inventory-age/report/
        description: 'Every item sitting in stock with how many days it has been there, its litres and its stock value, plus a per-warehouse rollup.'
        response:
          type: object
        params:
        - name: item_group
          type: string
          description: 'Item group NAME (e.g. ''PACKAGING MATERIAL''), not the numeric code. Verified: 1,445 of OIL''s 2,418 rows.'
        - name: search
          type: string
          description: 'Item code or name; upper-cased by the UI. Verified: search=TIN returned 132 rows on OIL.'
        - name: min_age
          type: integer
          description: 'INCLUSIVE lower bound — min_age=90 returned rows whose smallest days_age was exactly 90. UI offers 0 (All Ages), 30, 60, 90, 180, 365; 0 is omitted rather than sent. int (days)'
        - name: warehouse
          type: string
          description: 'SERVER-SIDE and working, though the UI filters this client-side. SINGLE VALUE ONLY — verified: ''BH-PM'' gives 222 rows, ''BH-PM,BH-FG'' gives 0 (treated as one literal), and repeating warehouse= twice silently keeps only the LAST value.'
        - name: sub_group
          type: string
          description: 'Single value; same last-wins behaviour. Verified: sub_group=TIN → 63 rows on OIL.'
        - name: variety
          type: string
          description: 'Single value; same last-wins behaviour. Verified: variety=OLIVE → 95 rows, variety=POMACE → 138 on OIL.'
      sales-planning-requirement-analysis:
        method: GET
        path: /dashboards/sales-planning-requirement/analysis/
        description: 'Self-documentation for the sales-plan report: which SAP procedure feeds it, what each column means, where it is cached and when the scheduler reruns it.'
        response:
          type: object
      sales-planning-requirement-report:
        method: GET
        path: /dashboards/sales-planning-requirement/report/
        description: 'Monthly forecast demand vs stock in hand, minimum stock and open POs — the net shortage per item for the current planning month.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'Server-enforced enum: all | shortage | po_covered. Anything else returns 400 ''"x" is not a valid choice.'' Verified on OIL: all=294, shortage=266, po_covered=28.'
        - name: search
          type: string
          description: 'Item code, item name or forecast name. Verified: search=MUSTARD → 36 of 294 on OIL.'
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'Default 50, max 200. int'
      sales-planning-requirement-status:
        method: GET
        path: /dashboards/sales-planning-requirement/status/
        description: 'When the sales-plan report was last rebuilt from SAP, by whom, how long it took and whether it succeeded.'
        response:
          type: object
      stock:
        method: GET
        path: /dashboards/stock/
        description: 'On-hand stock vs its minimum-stock benchmark, per item per warehouse, flagged healthy / low / critical.'
        response:
          type: object
        params:
        - name: search
          type: string
          description: 'Matches item code, item name or warehouse. The UI upper-cases it before sending; verified live that ''PM0000531'' returns 58 rows (one per warehouse).'
        - name: item_group
          type: string
          description: 'Item group NAME, not the code — e.g. ''PACKAGING MATERIAL''. Verified: narrows OIL from 127,065 to 49,460 rows. Empty string means all groups.'
        - name: warehouse
          type: string
          description: 'Comma-separated warehouse codes (CSV works here). When 2+ are given the API AGGREGATES the item across them and returns warehouse=''2 warehouses'' with warehouse_count=2 — use the item-warehouses endpoint to split it back out.'
        - name: status
          type: string
          description: 'CSV. Allowed values, quoted from the API''s own 400: critical, healthy, low, unset. ''all'' is a UI-only sentinel and is REJECTED. ''none'' appears in responses but is not a filter value.'
        - name: movement_status
          type: string
          description: 'CSV. recent | slow. ''recent'' = consumed lately, ''slow'' = Slow Moving.'
        - name: sort_by
          type: string
          description: 'item_code | item_name | warehouse | on_hand | min_stock | health_ratio. UI default is health_ratio.'
        - name: sort_dir
          type: string
          description: 'asc | desc. UI default asc (worst health first).'
        - name: page
          type: integer
          description: '1-based. int'
        - name: page_size
          type: integer
          description: 'Default 50, maximum 200. int'
      stock-as-of:
        method: GET
        path: /dashboards/stock/as-of/
        description: 'The same stock-vs-benchmark view reconstructed as it stood on a chosen past date. Required: as_of_date.'
        response:
          type: object
        params:
        - name: as_of_date
          type: string
          required: true
          description: 'Hard requirement. Without it: 400 {"detail":"Invalid query parameters.","errors":{"as_of_date":["This field is required."]}}. Verified live with 2026-08-03 and 2026-07-31. (date, YYYY-MM-DD)'
        - name: search
          type: string
        - name: item_group
          type: string
          description: 'Group NAME, same as the live view.'
        - name: warehouse
          type: string
          description: 'CSV. Verified: warehouse=BH-PM narrows OIL to 2,269 items.'
        - name: status
          type: string
          description: 'CSV; critical|healthy|low|unset. Verified live on this path (status=critical returned 78 items).'
        - name: movement_status
          type: string
          description: 'recent|slow. Accepted by the shared query builder; inferred from the client, not separately proven on this path.'
        - name: sort_by
          type: string
          description: 'Verified live on this path (sort_by=on_hand&sort_dir=desc).'
        - name: sort_dir
          type: string
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'max 200 int'
      stock-benchmark-item-warehouses:
        method: GET
        path: /dashboards/stock/{item_code}/warehouses/
        description: 'Per-warehouse breakdown of one item''s on-hand vs benchmark — un-aggregates a row the list view merged. Required: item_code, warehouse.'
        response:
          type: object
        params:
        - name: item_code
          type: string
          required: true
          description: 'SAP item code, e.g. PM0000015. Taken from a row of the stock list. (path)'
        - name: warehouse
          type: string
          required: true
          description: 'Genuinely required — 400 {"detail":"Invalid query parameters.","errors":{"warehouse":["This field is required."]}} without it. Verified live: PM0000015 with warehouse=BH-PM,BH-FP returned both warehouse rows on JIVO_OIL, and RM0000022 with warehouse=BH-GR returned one row on JIVO_MART. (query, CSV)'
  dispatch:
    description: 'The dispatch domain follows a SAP sales invoice from the moment it becomes a "dispatch bill" to the moment the truck clears the gate and the transporter gets paid. /dispatch-plans/ is the planning hal'
    endpoints:
      bilty-grpo-history:
        method: GET
        path: /dispatch/bilty-grpo/history/
        description: 'Every transporter bilty that has been posted (or failed to post) to SAP as a service GRPO, with the SAP document number and the freight lines.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'DRAFT | PENDING | POSTED | FAILED | PARTIALLY_POSTED (from the bundle''s GRPO status constant). The history page''s tabs expose All / Pending / Posted / Failed. Verified live: status=POSTED -> 35, status=FAILED -> 0 on JIVO_OIL. enum'
        - name: year
          type: integer
          description: 'Verified live: year=2026&month=6 narrowed 35 to 32. Unlike /pending/, history does NOT appear to default to the current month (a bare call returned all 35, spanning June). int'
        - name: month
          type: integer
          description: 'int 1-12'
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'capped at 100; UI uses 25 int'
        - name: search
          type: string
          description: 'UI placeholder: ''Search bilty, bill, vehicle, transporter, SAP…''. Verified live: search=45430 -> 1 row.'
      bilty-grpo-options:
        method: GET
        path: /dispatch/bilty-grpo/options/
        description: 'The SAP master-data pick-lists used when booking a bilty as a service GRPO — branches, tax codes, G/L accounts, SAC codes, locations, varieties, projects, sub-accounts and expense codes.'
        response:
          type: object
      bilty-grpo-pending:
        method: GET
        path: /dispatch/bilty-grpo/pending/
        description: 'Booked dispatch vehicle bookings that still need their transporter bilty posted to SAP as a service GRPO — the freight-booking to-do list.'
        response:
          type: object
        params:
        - name: year
          type: integer
          description: 'See the month trap below — always send year and month together and explicitly. int'
        - name: month
          type: integer
          description: '*** TRAP: omitting year/month does NOT mean ''all pending''. Verified live and reproduced three times on JIVO_OIL: no params -> count 12, identical to year=2026&month=8 (the current month); year=2026&month=7 -> count 157. The server silently applies the current year/month. Worse, the filter is NOT a filter on dispatch_date — the month=8 result contained rows dated 2026-06-18 and 2026-07-14 — so I could NOT determine which date column it keys off. Treat the unfiltered count as ''this month'', never as the backlog. int 1-12'
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'capped at 100 int'
        - name: search
          type: string
          description: 'UI placeholder: ''Search bill, vehicle, transporter, driver, state, bilty, GSTIN…'''
      open-bilties:
        method: GET
        path: /dispatch/open-bilties/
        description: 'Bilties whose service GRPO is posted in SAP but which have not yet been rolled into a transporter A/P invoice — the freight payables waiting to be billed.'
        response:
          type: array
      transporter-invoices-history:
        method: GET
        path: /dispatch/transporter-invoices/history/
        description: 'Transporter A/P invoices submitted or posted to SAP from bilty GRPOs.'
        response:
          type: array
  dispatch-plans:
    description: 'The dispatch domain follows a SAP sales invoice from the moment it becomes a "dispatch bill" to the moment the truck clears the gate and the transporter gets paid. /dispatch-plans/ is the planning hal'
    endpoints:
      bills:
        method: GET
        path: /dispatch-plans/bills/
        description: 'SAP sales invoices in a date window with the factory''s dispatch-planning overlay (vehicle, transporter, driver, bilty, freight, planned dispatch date) attached to each one. Required: date_from, date_to.'
        response:
          type: object
        params:
        - name: date_from
          type: string
          required: true
          description: 'A bare GET returns 400 {"detail":"Invalid query parameters.","errors":{"date_from":["This field is required."],"date_to":["This field is required."]}} (YYYY-MM-DD)'
        - name: date_to
          type: string
          required: true
          description: 'Inclusive. The UI defaults to the last month. (YYYY-MM-DD)'
        - name: booking_status
          type: string
          description: 'PENDING | BOOKED | DISPATCHED | CANCELLED. The UI''s ''All'' option omits the param entirely — do not send the literal ''all''. Verified live: booking_status=BOOKED narrowed 4 rows to 1. enum'
        - name: search
          type: string
          description: 'Matches bill number / party / vehicle. Verified live: search=626080104 returned exactly that bill.'
        - name: branch
          type: string
          description: 'Server accepted both branch=2 and branch=FACTORY without error, but the test window held only one branch so which form filters is UNVERIFIED. Branch ids/names come from /dispatch/bilty-grpo/options/ (branches[]). or int'
        - name: limit
          type: integer
          description: 'TRAP: caps the rows AND the meta totals are recomputed on the capped set. Verified live: unlimited meta.total_bills=4, with limit=1 meta.total_bills=1. Never use it to sample and then quote meta. int'
        - name: exclude_jivo_mart_transfer
          type: boolean
          description: 'Drops Oil->Jivo Mart intercompany stock-transfer bills. The UI ticks this ON by default (''Show Jivo Mart bills'' unchecked); the SERVER default is OFF. Verified live: 4 bills without it, 1 with it. bool (''true'')'
        - name: by_dispatch_date
          type: boolean
          description: 'Applies date_from/date_to to the PLANNED dispatch date instead of the SAP invoice date. Verified live: same window gave 4 rows normally, 26 rows with this flag (rows with July doc_dates appear). bool (''true'')'
        - name: all_companies
          type: boolean
          description: 'Cross-company sweep. Verified live: 4 rows (Oil only) -> 13 rows spanning JIVO_OIL, JIVO_MART, JIVO_BEVERAGES, and company_code is populated on each row only in this mode (null otherwise). bool (''1'')'
        - name: selected_only
          type: boolean
          description: 'Only bills ticked for planning (is_selected). Verified live: 1 of 4. bool (''true'')'
      dispatch-plans-bill-by-number:
        method: GET
        path: /dispatch-plans/bills/by-number/{bill_number}/
        description: 'Look up one dispatch bill by its SAP invoice number, with its planning overlay and its line items. Required: bill_number.'
        response:
          type: object
        params:
        - name: bill_number
          type: string
          required: true
          description: 'The SAP invoice number, e.g. 626080104. The UI only fires this once the typed value is >= 6 digits and all-numeric. (path)'
      dispatch-fulfilment-bills:
        method: GET
        path: /dispatch-plans/dashboard/bills/
        description: 'Bill-by-bill fulfilment list — what was billed versus what actually went out the gate, with the fulfilment rate, gatepass number and the individual gate-out events per invoice.'
        response:
          type: object
        params:
        - name: from
          type: string
          description: 'Optional server-side (a bare GET returned all 1921 bills). (YYYY-MM-DD)'
        - name: to
          type: string
          description: 'see from (YYYY-MM-DD)'
        - name: status
          type: string
          description: 'PENDING | BOOKED | DISPATCHED | CANCELLED. The UI''s ''All'' tab sends an empty string / omits it. Verified live: status=BOOKED gave count 18, all rows BOOKED. status_counts stays window-wide and is unaffected by this filter — that is intended (it feeds the tab badges), not a bug. enum'
        - name: search
          type: string
          description: 'UI placeholder ''Search invoice / customer…''. Verified live: search=626078398 gave count 1.'
        - name: limit
          type: integer
          description: 'Default 50; the UI page size is 25. int'
        - name: offset
          type: integer
          description: 'Real offset pagination, unlike /dispatch-plans/bills/. int'
      dispatch-fulfilment-summary:
        method: GET
        path: /dispatch-plans/dashboard/summary/
        description: 'Dispatch fulfilment headline for a date range — value/weight/litres/trucks dispatched, open backlog by booking status, a daily trend line and the top 50 customers by dispatched value.'
        response:
          type: object
        params:
        - name: from
          type: string
          description: 'Optional server-side; omitting both gave from=2026-05-06 to=2026-08-03 on 2026-08-03, i.e. a ~90-day trailing default. The client always sends both. (YYYY-MM-DD)'
        - name: to
          type: string
          description: 'see from (YYYY-MM-DD)'
      pipeline:
        method: GET
        path: /dispatch-plans/pipeline/
        description: 'Live dispatch board — every vehicle currently in the dispatch flow, bucketed into the 10 pipeline stages from ''Booked'' through ''Docked'' to ''Dispatched''.'
        response:
          type: object
        params:
        - name: date_from
          type: string
          description: 'Optional server-side. Verified live: omitting both dates gave meta {date_from: 2026-07-31, date_to: 2026-08-17} on 2026-08-03, i.e. the server applies the same default window as the UI — today-3 days to today+14 days. It is a FORWARD-looking window, so it will not show last month. (YYYY-MM-DD)'
        - name: date_to
          type: string
          description: 'see date_from (YYYY-MM-DD)'
        - name: search
          type: string
          description: 'UI placeholder: ''Vehicle, invoice, transporter, driver, customer'''
        - name: stage
          type: string
          description: 'One of BOOKED | EMPTY_IN | READY_TO_DOCK | DOCKED | PHOTO_ATTACHED | READY_FOR_GATEPASS | GATEPASS_PRINTED | PRINT_COMMITTED | DISPATCHED | REJECTED. Verified live: stage=DOCKED returned 4 cards, all DOCKED. Operator meanings from the bundle: BOOKED=''not entered'', EMPTY_IN=''pending at gate'', READY_TO_DOCK=''pending at dock'', DOCKED=''docked at dock'', PHOTO_ATTACHED=''photo attached at dock'', READY_FOR_GATEPASS=''ready for gatepass at dock'', GATEPASS_PRINTED=''gatepass printed at dock'', PRINT_COMMITTED=''pending at sales dispatch out'', DISPATCHED=''dispatched at sales dispatch out'', REJECTED=''rejected / cancelled''. enum'
        - name: stages
          type: string
          description: 'Multiple stages in one call, e.g. stages=DOCKED,PHOTO_ATTACHED. Read in the bundle''s param builder; not individually re-verified live. (comma-joined)'
        - name: all_companies
          type: boolean
          description: 'Verified live: JIVO_OIL alone meta.total=26, with all_companies=1 meta.total=90. bool (''1'')'
  docking-admin:
    description: 'The dispatch domain follows a SAP sales invoice from the moment it becomes a "dispatch bill" to the moment the truck clears the gate and the transporter gets paid. /dispatch-plans/ is the planning hal'
    endpoints:
      partial-scan-requests:
        method: GET
        path: /docking-admin/partial-scan-requests/
