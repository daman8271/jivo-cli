        response:
          type: object
        params:
        - name: document_type
          type: string
          required: true
          description: 'path param, first segment — observed values INVOICE, STOCK_TRANSFER'
        - name: doc_entry
          type: integer
          required: true
          description: 'path param, second segment — SAP DocEntry'
      sales-dispatch-pending-bookings:
        method: GET
        path: /gate-core/sales-dispatch/pending-bookings/
        description: 'Bills booked to a truck but not yet docked — loads that are planned and still waiting to enter the dispatch flow.'
