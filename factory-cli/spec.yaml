          description: 'path param — sales-dispatch id'
      unit-choices:
        method: GET
        path: /gate-core/unit-choices/
        description: 'The units of measure the gate apps offer — use it to resolve or validate a unit id.'
        response:
          type: array
      sales-dispatch-expected-vehicles:
        method: GET
        path: '/gate-core/sales-dispatch/expected-vehicles/'
        description: 'The gate''s forward view for outbound dispatch: which vehicles are booked to arrive and have not been gated in yet. Live 200 on all three companies; empty today.'
        response:
          type: object
      dispatch-tracking-bills:
        method: GET
        path: '/gate-core/dispatch-tracking/{arrival_id}/bills/'
        description: 'Invoices/bills attached to a dispatch-tracking arrival. The id is the `arrival` field on a row of the shipped `gate-core dispatch-tracking` list - NOT `arrival_no`, which is the human-readable ARV-YYYYMMDD-NNNN string.'
        response:
          type: object
        params:
        - name: arrival_id
          type: string
          description: 'Arrival id - the `arrival` field on a `gate-core dispatch-tracking` row'
          required: true
      sales-dispatch-by-vehicle-entry:
        method: GET
        path: '/gate-core/sales-dispatch/by-vehicle-entry/{vehicle_entry_id}/'
        description: 'Resolves a gate vehicle entry to its outbound docking record. Returns HTTP 404 {"detail":"Docking entry not found for this vehicle entry."} when the vehicle entry has no docking record - that is the handler''s own answer, not a routing error.'
        response:
          type: object
        params:
        - name: vehicle_entry_id
          type: string
          description: 'Vehicle entry id from `vehicle-management vehicle-entries`'
