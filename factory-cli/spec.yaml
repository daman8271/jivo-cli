        - name: to_date
          type: string
          description: 'YYYY-MM-DD'
        - name: search
          type: string
          description: 'VERIFIED live: ?search=708260106 -> 1 row (matches doc_num)'
        - name: document_type
          type: string
          description: 'observed values INVOICE and STOCK_TRANSFER. VERIFIED live: a 7-row window filtered to 6 with document_type=INVOICE (the 7th was a STOCK_TRANSFER).'
        - name: all_companies
          type: integer
          description: '1 — the dashboard sends it alongside the other filters'
      sales-dispatch-document:
        method: GET
        path: /gate-core/sales-dispatch/documents/{document_type}/{doc_entry}/
