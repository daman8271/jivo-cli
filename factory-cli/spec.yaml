  blowing:
    description: 'The blowing module tracks JIVO''s own PET bottle-making: a blow-moulding machine heats plastic "preforms" (test-tube-shaped blanks bought from a supplier) and blows them into finished bottles. Operator'
    endpoints:
      audit:
        method: GET
        path: /blowing/audit/
        description: 'Who changed a blowing master and what they changed — field-by-field old/new, with the user''s email and timestamp. Required: entity_type, entity_id.'
        response:
          type: object
        params:
        - name: entity_type
          type: string
          required: true
          description: 'verified live: "machine" and "preform_spec". These are the only two the app ever sends — do not guess others.'
        - name: entity_id
          type: integer
          required: true
          description: 'the id of that master row, in that company'
      breakdown-categories:
        method: GET
        path: /blowing/breakdown-categories/
        description: 'The pick-list of reasons a blowing machine stopped — Machine, PM Short, RM Short, Labour Short.'
        response:
          type: array
        params:
        - name: is_active
          type: boolean
          description: 'verified live on JIVO_OIL (sent as the string "true"/"false")'
      buy-prices:
        method: GET
        path: /blowing/buy-prices/
        description: 'What a supplier charges for the finished bottle — buy price plus freight, duties, carrying and QA allowance, giving the landed cost per bottle used in make-vs-buy.'
        response:
          type: array
        params:
        - name: is_active
          type: boolean
          description: 'verified live (sent as the string "true"/"false")'
        - name: preform_spec_id
          type: integer
          description: 'verified live on JIVO_OIL with spec 8'
      cost-rates:
        method: GET
        path: /blowing/cost-rates/
        description: 'The Cost Master — one rate per cost category (operator, labour, electricity, packing, scrap credit, industry benchmark), company-wide or overridden per machine.'
        response:
          type: array
        params:
        - name: scope
          type: string
          description: 'only "global" is ever sent by the app; verified live and returns the 7 company-wide rates. Do NOT invent other values.'
        - name: machine_id
          type: integer
          description: 'verified live on JIVO_OIL machine 2 — returned [] because that machine has no override'
      machines:
        method: GET
        path: /blowing/machines/
        description: 'Blow-moulding machines — name, number of heads, linked SAP warehouse and depreciation per day.'
        response:
          type: array
        params:
        - name: is_active
          type: boolean
          description: 'verified live on JIVO_OIL (sent as the string "true"/"false")'
      preform-specs:
        method: GET
        path: /blowing/preform-specs/
        description: 'The bottle sizes we blow — preform make and gram weight, preforms per box, preform rate per bottle, SAP item, and the cost/reject standards runs are measured against.'
        response:
          type: array
        params:
        - name: is_active
          type: boolean
          description: 'verified live on JIVO_OIL (sent as the string "true"/"false")'
      rate-configs:
        method: GET
        path: /blowing/rate-configs/
        description: 'The older dated rate sheet — operator, labour, electricity, scrap, packing, maintenance, overhead and QA rates effective from a date.'
        response:
          type: array
        params:
        - name: is_active
          type: boolean
          description: 'verified live on JIVO_OIL (sent as the string "true"/"false")'
      report-daily:
        method: GET
        path: /blowing/reports/daily/
        description: 'One day''s blowing output and cost, totalled and split by machine and by bottle size. Required: date.'
        response:
          type: object
        params:
        - name: date
          type: string
          required: true
          description: '400 {"detail":"Query param ''date'' is required (YYYY-MM-DD)."} if missing (YYYY-MM-DD)'
      make-vs-buy:
        method: GET
        path: /blowing/reports/make-vs-buy/
        description: 'Per bottle size over a date range: what it cost us to blow vs what the supplier charges landed, with breakeven volume, period savings and a MAKE/BUY verdict. Required: date_from, date_to.'
        response:
          type: object
        params:
        - name: date_from
          type: string
          required: true
          description: '400 {"detail":"Query params ''date_from'' and ''date_to'' are required."} if missing (YYYY-MM-DD)'
        - name: date_to
          type: string
          required: true
          description: '(YYYY-MM-DD)'
        - name: preform_spec_id
          type: integer
          description: 'present in the app''s client (getMakeVsBuy 3rd arg); narrows to one bottle size. Read in the bundle, not exercised live.'
      report-monthly:
        method: GET
        path: /blowing/reports/monthly/
        description: 'A month of blowing — totals plus a day-by-day table of production, rejection, electricity units, net cost and ₹/bottle. Required: year, month.'
        response:
          type: object
        params:
        - name: year
          type: integer
          required: true
          description: '400 {"detail":"Query params ''year'' and ''month'' are required."} if missing'
        - name: month
          type: integer
          required: true
          description: '1-12'
      variances:
        method: GET
        path: /blowing/reports/variances/
        description: 'Actual vs standard per run over a date range — make cost/bottle, reject % and electricity units/bottle, flagged when they breach the target. Required: date_from, date_to.'
        response:
          type: object
        params:
        - name: date_from
          type: string
          required: true
          description: '400 {"detail":"Query params ''date_from'' and ''date_to'' are required."} if missing (YYYY-MM-DD)'
        - name: date_to
          type: string
          required: true
          description: '(YYYY-MM-DD)'
      runs:
        method: GET
        path: /blowing/runs/
        description: 'List blowing production runs — one machine and one bottle size for one day: date and run number, machine, preform make and gram, preforms consumed, bottles counted off the machine, rejection %, manpower, net cost and ₹/bottle, plus three separate statuses: the stored status, the live status the shop floor sees, and whether the warehouse has approved the preform issue.'
        response:
          type: array
        params:
        - name: date_from
          type: string
          description: 'inclusive; verified live on JIVO_OIL (YYYY-MM-DD)'
        - name: date_to
          type: string
          description: 'inclusive; verified live on JIVO_OIL (YYYY-MM-DD)'
        - name: machine_id
          type: integer
          description: 'id from /blowing/machines/; verified live'
      run:
        method: GET
        path: /blowing/runs/{id}/
        description: 'One run in full — production readings, manpower, the running/breakdown timeline, and the complete costing with every cost line. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'run id from /blowing/runs/ — never run_number (path)'
      sap-items:
        method: GET
        path: /blowing/sap/items/
        description: 'Search SAP''s item master from inside blowing, to link a preform spec to its real SAP item code.'
        response:
          type: array
        params:
        - name: search
          type: string
          description: 'matches code or name; the app only fires it at 2+ characters'
        - name: kind
          type: string
          description: 'ONLY "preform" observed (verified live on JIVO_OIL: returns the 7 PM preform items). A bottle variant is plausible — the run object carries sap_bottle_item_code — but I did NOT test it, per the no-guessing rule.'
  company:
    description: 'company'
    endpoints:
      companies:
        method: GET
