        response:
          type: object
        params:
        - name: status
          type: string
          required: true
          description: 'Live-observed values: DRAFT, IN_PROGRESS, COMPLETED, CANCELLED, QC_PENDING, QC_COMPLETED, QC_AWAITING_QAM, ARRIVAL_SLIP_REJECTED. Omitting it returns 400 {"detail":"status query parameter is required"} — this is the FIRST error you hit here enum'
        - name: entry_type
          type: string
          required: true
          description: 'same 8 values as vehicle-entries; also required — the 400 cascade is status, then entry_type, then from_date, then to_date enum'
        - name: from_date
          type: string
          required: true
          description: 'required despite the July spec marking it optional — verified live date YYYY-MM-DD'
        - name: to_date
          type: string
          required: true
          description: 'required despite the July spec marking it optional — verified live date YYYY-MM-DD'
      vehicle-types:
        method: GET
        path: /vehicle-management/vehicle-types/
        description: 'The fixed list of vehicle categories used across the plant (Truck, Car, Bike, Cycle, Eco Van, Courier, By Hand).'
        response:
          type: array
      vehicles:
        method: GET
        path: /vehicle-management/vehicles/
        description: 'Every vehicle registered with the factory — registration number, type, capacity in tonnes and which transporter owns it.'
        response:
          type: array
      vehicles-names:
        method: GET
        path: /vehicle-management/vehicles/names/
        description: 'Slim id + registration-number list of all vehicles, for pickers and lookups.'
        response:
          type: array
