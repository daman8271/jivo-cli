          type: array
        params:
        - name: status
          type: string
          description: 'enum DRAFT | SUBMITTED | REJECTED (from ARRIVAL_SLIP_STATUS in status.constants). Filter CONFIRMED working live on JIVO_OIL: unfiltered 1141 = SUBMITTED 1074 + DRAFT 40 + REJECTED 27.'
