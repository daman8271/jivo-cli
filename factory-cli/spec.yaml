          required: true
          description: 'path param — sales-dispatch id'
      sales-dispatch-barcode-scans:
        method: GET
        path: /gate-core/sales-dispatch/{id}/barcode-scans/
        description: 'Whether a dispatch has been matched to a barcode scanning session, and how many boxes it covers. Required: id.'
        response:
          type: object
        params:
        - name: id
