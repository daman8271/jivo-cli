  non-moving-rm:
    description: 'This is the factory app''s read-only reporting corner — the five "management dashboard" screens the plant and purchase teams open when they want to know what stock is sitting where, how old it is, what'
    endpoints:
      item-groups:
        method: GET
        path: /non-moving-rm/item-groups/
        description: 'Item-group code/name list used by the Non-Moving screen''s Material Type dropdown.'
        response:
          type: object
      report:
        method: GET
        path: /non-moving-rm/report/
        description: 'Dead and slow-moving stock — items whose last movement is older than N days, with quantity, value at risk and consumption ratio. Required: age, item_group.'
        response:
          type: object
        params:
        - name: age
          type: integer
          required: true
          description: 'Hard requirement — 400 {"detail":"Invalid query parameters.","errors":{"age":["This field is required."]}} without it. Filter is STRICT greater-than: age=45 returned rows whose minimum days_since_last_movement was 46. UI buttons are 0 (All Stock), 15, 30, 45 (default), 90, 180, 365. int (days)'
        - name: item_group
          type: integer
          required: true
          description: 'Nominally optional but REQUIRED IN PRACTICE. Omit it and the API returns zero rows with meta.item_group=0 — it does NOT mean ''all groups''. Verified live on JIVO_OIL: age=0 alone → 0 rows; age=0&item_group=105 → 540 rows. The UI hides this by always defaulting to the Packaging-Material group code. int (group code)'
  notifications:
    description: 'The "platform" group is the plumbing the rest of the factory app sits on: who you are, who else exists, what the app tells people, and the one hand-off point with JIVO''s separate order system. /accoun'
    endpoints:
      detail:
        method: GET
        path: /notifications/{id}/
        description: 'One alert in full — its title and message, what it points at (the gate entry, inspection or dispatch it came from), whether it has been read, and the extra data the app uses to deep-link it.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Notification id from the feed (path segment).'
      list:
        method: GET
        path: /notifications/
        description: 'Read the alert feed for this company — gate entries, QC decisions, GRPO/FG postings, dispatch bookings, indents and returnables — newest first, optionally only unread or only read.'
        response:
          type: object
        params:
        - name: is_read
          type: boolean
          description: 'true = only read, false = only unread. Omit for all. The UI''s All/Unread/Read tabs are exactly this. bool'
        - name: limit
          type: integer
          description: 'page size; UI uses 20. Alias of page_size. int'
        - name: offset
          type: integer
          description: 'row offset; UI pages with offset = page_index * 20. Alias of page. int'
        - name: page
          type: integer
          description: '1-based page number; sets offset. Verified live: page=2&page_size=3 → offset 3. int'
        - name: page_size
          type: integer
          description: 'rows per page; sets limit. int'
      preferences:
        method: GET
        path: /notifications/preferences/
        description: 'Which alert types this account is subscribed to — 65 named events (Gate Entry Created, QC Inspection Submitted, Weighment Recorded…) each with an on/off flag.'
        response:
          type: array
      unread-count:
        method: GET
        path: /notifications/unread-count/
        description: 'How many unread alerts this account has in this company — the number on the bell badge.'
        response:
          type: object
  oms:
    description: 'The "platform" group is the plumbing the rest of the factory app sits on: who you are, who else exists, what the app tells people, and the one hand-off point with JIVO''s separate order system. /accoun'
    endpoints:
      invoices:
        method: GET
        path: /oms/invoices/
        description: 'The invoice-approval queue for one warehouse: invoices raised in OMS waiting to be checked against physical stock and batches before they post to SAP. Required: whs.'
        response:
          type: object
        params:
        - name: whs
          type: string
          required: true
          description: 'SAP warehouse code, e.g. BH-PF. REQUIRED — without it 400 {"whs":["This field is required."]}. Valid values are the warehouse_code values from GET /po/warehouses/ (31 codes live). Never invent a code.'
        - name: status
          type: string
          description: 'PENDING | APPROVED | EDITED | REJECTED (the UI''s own filter set; its tabs show PENDING/APPROVED/REJECTED and hide EDITED). Omit for all statuses. A row can also carry ERROR, POSTED_TO_SAP or CL_RAISED — those appear in the display map but are not offered as filters, so do not advertise them as filter values.'
      pending-count:
        method: GET
        path: /oms/invoices/pending-count/
        description: 'How many OMS invoices are waiting on this warehouse (the badge next to Invoice Approval), split pending vs edited. Required: whs.'
        response:
          type: object
        params:
        - name: whs
          type: string
          required: true
          description: 'SAP warehouse code. REQUIRED — without it 400 {"detail":"whs (warehouse) is required"} (note: a DIFFERENT error envelope from the list endpoint''s field-level one). Values from GET /po/warehouses/.'
      invoice-audit:
        method: GET
        path: /oms/invoices/{id}/audit/
        description: 'The factory-side decision trail on one OMS invoice — who approved or rejected it here, and when. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path segment; invoice id from the queue listing int'
      invoice-history:
        method: GET
        path: /oms/invoices/{id}/history/
        description: 'Every version of one OMS invoice as it moved through approval — who submitted it, the status at that point, and the full SAP payload snapshot. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path segment; invoice id from the queue listing int'
  order-processing:
    description: 'Order Processing is the factory app''s mirror of OMS sales orders and the planning engine sitting on top of it. It pulls orders out of the OMS database on a schedule, checks each line against SAP stock, and works out what must be produced, which raw/packing materials fall short after exploding the BOM, and what has to be bought. Nothing here posts to SAP: it mirrors, checks and plans, and every production/procurement row is a planning record a human still has to act on. It also flags order lines it cannot trust — no warehouse, no item code, zero quantity, or a quantity that disagrees with cases x pack size — because those lines can never reach a stock answer.'
    endpoints:
      dashboard:
        method: GET
        path: /order-processing/dashboard/
        description: 'One screen of counts for the whole OMS-to-production pipeline: how many orders are mirrored and how they split by state, how many are ready to fulfil, open production and procurement requirements, materials short, flagged lines, and the last order-pull run.'
        response:
          type: object
      line-issues:
        method: GET
        path: /order-processing/line-issues/
        description: 'Order lines the engine will not trust, one flag at a time — no warehouse to check stock against, a quantity that disagrees with cases x pack size, no item code, or no quantity — with how many orders those lines block and the worst-affected items.'
        response:
          type: object
        params:
        - name: issue
          type: string
          description: 'Which flag to list. NO_WAREHOUSE (the app''s default), QTY_DISAGREES, NO_ITEM_CODE, ZERO_QTY, or `any` for all flagged lines.'
      materials:
        method: GET
        path: /order-processing/materials/
        description: 'The material requirement worked out by exploding the BOM of everything that must be produced: per item and warehouse, how much is needed in total, what SAP shows on hand, what is already committed, what is on order, and the net shortfall.'
        response:
          type: array
        params:
        - name: short_only
          type: boolean
          description: 'Keep only the shortfalls. The app sends the literal string ''true'' and omits the param entirely otherwise; sending short_only=false was never observed.'
      order:
        method: GET
        path: /order-processing/orders/{id}/
        description: 'One mirrored order in full — customer, branch, PO number, ship-to, value, free-of-charge flag, SAP push status and OMS timestamps, plus every line with item, quantity, pack size, cases, litres, price, warehouse and any flags raised against it.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Path param — the factory app''s own order id (the `id` field in the orders list), NOT oms_order_id.'
      order-timeline:
        method: GET
        path: /order-processing/orders/{id}/timeline/
        description: 'The history recorded against one order since it was mirrored — each event with its timestamp, what happened, the state it moved from and to, any error, plus the stock checks run on it.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Path param — the factory app''s own order id (the `id` field in the orders list), NOT oms_order_id.'
      orders:
        method: GET
        path: /order-processing/orders/
        description: 'The mirrored OMS sales orders — one row per order with customer, branch, delivery date, value, line count, how many of its lines are flagged, whether it was pushed to SAP, and where it sits in the stock-check pipeline. Read-only copy; the app itself says ''Mirrored from OMS. Read-only here.'''
        response:
          type: object
        params:
        - name: state
          type: string
          description: 'Pipeline state. Values the app offers: RECEIVED (mirrored, stock never checked), STOCK_CHECKED (checked, unresolved), PRODUCTION_REQUIRED (needs production), READY_FOR_FULFILLMENT (ready). The app''s badge map also knows PARTIALLY_AVAILABLE and CANCELLED. Omit for all.'
        - name: issue
          type: string
          description: 'Keep only orders carrying a flagged line. NO_WAREHOUSE is the only value wired to a button in the app; the flag vocabulary is shared with line-issues (NO_WAREHOUSE, QTY_DISAGREES, NO_ITEM_CODE, ZERO_QTY) but only NO_WAREHOUSE was observed at a call site.'
        - name: search
          type: string
          description: 'Free text. The app''s own placeholder is ''Order, customer or item code''.'
        - name: page
          type: integer
          description: '1-based page number. 2281 orders at page_size 50 = 46 pages.'
      procurement:
        method: GET
        path: /order-processing/procurement/
        description: 'The buy list — materials the plan says must be purchased, with how much to buy, how much is already on order, the date it is needed by and the request''s status. Planning records only; no SAP purchase order is raised from here.'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'Filter keyword; the app always sends ''open''. A bare call returned the same 37 rows the dashboard counts as procurement.open, so no param behaves like open.'
      production:
        method: GET
        path: /order-processing/production/
        description: 'What has to be manufactured to cover order shortfalls — per item and warehouse, the quantity, the date it is needed, the orders and shortfalls driving it, and the BOM components with how short each one is.'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'Filter keyword; the app always sends ''open''. A bare call returned the same 14 rows the dashboard counts as production.open, so no param behaves like open.'
      sync-status:
        method: GET
        path: /order-processing/sync/
        description: 'Whether the OMS database can be reached right now, plus the log of order-pull runs — orders seen, created and updated, lines written, issues found, the slice of OMS time each run covered, and any error.'
        response:
          type: object
  person-gatein:
    description: 'This is the factory''s people register at the gate — who walked into the plant, when, through which gate, why, and whether they have walked back out. It covers two kinds of person: **visitors** (outsid'
    endpoints:
      contractors:
        method: GET
        path: /person-gatein/contractors/
        description: 'The labour-contractor master — contractor name, contact person, mobile and contract expiry date.'
