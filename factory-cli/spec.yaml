        response:
          type: array
        params:
        - name: channel
          type: string
          description: 'FLIPKART|AMAZON. Honoured: FLIPKART=22 rows, AMAZON=1 row, unfiltered=23.'
      batch:
        method: GET
        path: /marketplace/batches/{id}/
        description: 'One uploaded order sheet in full — filename, who uploaded it, its status, how many file rows became how many orders and tracking IDs, and the parser''s tally including any orders merged in from an earlier sheet. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Batch id from the batches list, e.g. 51. Path segment, not a query param.'
      batch-issuance-csv:
        method: GET
