  quality-control:
    description: 'Quality Control is the QA department''s own workflow inside the factory app, and it holds three separate flows plus its own master data. (1) Raw-material inspection: when a truck''s material reaches QA'
    endpoints:
      arrival-slips:
        method: GET
        path: /quality-control/arrival-slips/
        description: 'List QA arrival slips — the intake record raised against each PO item when material reaches QA at gate-in.'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'enum DRAFT | SUBMITTED | REJECTED (from ARRIVAL_SLIP_STATUS in status.constants). Filter CONFIRMED working live on JIVO_OIL: unfiltered 1141 = SUBMITTED 1074 + DRAFT 40 + REJECTED 27.'
      qc-arrival-slip-get:
        method: GET
        path: /quality-control/arrival-slips/{id}/
        description: 'Show one QA arrival slip in full, including its COA/COQ attachment URLs. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'arrival slip id, from the arrival-slips list or from an inspection row''s arrival_slip_id. Company-scoped.'
      inspections:
        method: GET
        path: /quality-control/inspections/
        description: 'List every raw-material QC inspection with its workflow stage and both sign-off decisions.'
        response:
          type: array
        params:
        - name: from_date
          type: string
          description: 'CONFIRMED working: from_date=2026-08-01&to_date=2026-08-03 narrowed OIL from 1101 rows to 12. (YYYY-MM-DD)'
        - name: to_date
          type: string
          description: 'use with from_date (YYYY-MM-DD)'
      inspections-actionable:
        method: GET
        path: /quality-control/inspections/actionable/
        description: 'Everything the QA team must act on right now — pending plus draft plus anything awaiting a decision.'
        response:
          type: array
        params:
        - name: from_date
          type: string
          description: '(YYYY-MM-DD)'
        - name: to_date
          type: string
          description: '(YYYY-MM-DD)'
      inspections-awaiting-chemist:
        method: GET
        path: /quality-control/inspections/awaiting-chemist/
        description: 'Submitted inspections waiting on the QA Chemist''s verdict (workflow stage SUBMITTED).'
        response:
          type: array
        params:
        - name: from_date
          type: string
          description: '(YYYY-MM-DD)'
        - name: to_date
          type: string
          description: '(YYYY-MM-DD)'
      inspections-awaiting-qam:
        method: GET
        path: /quality-control/inspections/awaiting-qam/
        description: 'Chemist-approved inspections waiting on the QA Manager''s verdict (stage QA_CHEMIST_APPROVED).'
        response:
          type: array
        params:
        - name: from_date
          type: string
          description: '(YYYY-MM-DD)'
        - name: to_date
          type: string
          description: '(YYYY-MM-DD)'
      inspections-completed:
        method: GET
        path: /quality-control/inspections/completed/
        description: 'Fully signed-off inspections; filter by final verdict to get accepted lots or on-hold lots.'
        response:
          type: array
        params:
        - name: final_status
          type: string
          description: 'enum ACCEPTED | HOLD | REJECTED | PENDING. CONFIRMED working: ?final_status=ACCEPTED -> 1044 rows all ACCEPTED; ?final_status=HOLD -> 0 rows; unfiltered -> 1062.'
        - name: from_date
          type: string
          description: '(YYYY-MM-DD)'
        - name: to_date
          type: string
          description: '(YYYY-MM-DD)'
      inspections-counts:
