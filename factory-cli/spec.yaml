        - name: from_date
          type: string
          description: '*** SILENTLY IGNORED — DO NOT PUBLISH AS A FLAG. *** The SPA sends it (All Entries page has a date-range picker) but the backend drops it. Verified: ?from_date=2026-08-01 returned all 287 rows with min entry_time 2026-02-19. date (YYYY-MM-DD)'
        - name: to_date
          type: string
          description: '*** SILENTLY IGNORED. *** Verified: ?to_date=2026-02-20 returned all 287 rows with max entry_time 2026-08-03. Date narrowing must be done client-side on entry_time. date (YYYY-MM-DD)'
      gate-person-search:
        method: GET
