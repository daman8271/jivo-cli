# GENERATED for the Printing Press — jivo-factory v0.4.0
# Re-scraped and live-verified 2026-08-03. READ-ONLY: GET endpoints only,
# and only those cleared of side effects (see patch 0007 / correction C-0007).
name: jivo-factory
description: 'JIVO factory management CLI (ji.jivo.in / factory.jivo.in) — read-only access across JIVO_MART, JIVO_OIL and JIVO_BEVERAGES via --company: gate, vehicles, quality control, GRPO, barcode traceability, dispatch, production, WMS, maintenance, marketplace fulfilment, bottle blowing, labour and dashboards'
version: 0.4.0
base_url: https://factory.jivo.in/api/v1
health_check_path: /accounts/me/
category: developer-tools
required_headers:
- name: Company-Code
  value: JIVO_MART
auth:
  type: bearer_token
  header: Authorization
  format: Bearer {token}
  env_vars:
  - JIVO_FACTORY_TOKEN
config:
  format: toml
  path: ~/.config/jivo-factory-pp-cli/config.toml
resources:
  accounts:
    description: 'The "platform" group is the plumbing the rest of the factory app sits on: who you are, who else exists, what the app tells people, and the one hand-off point with JIVO''s separate order system. /accoun'
    endpoints:
      departments:
        method: GET
        path: /accounts/departments/
        description: 'List the factory''s department master (IT, Ecom, Account, Store, Dock, Quality, Fire, production(oil), …) used by attendance, labour-count and gate-in forms.'
        response:
          type: array
      me:
        method: GET
        path: /accounts/me/
        description: 'Show the signed-in account: name, employee code, the companies it can switch to, and its full permission list.'
        response:
          type: object
      users:
        method: GET
        path: /accounts/users/
        description: 'List every factory app user (name, email, employee code, active/staff flags) — the notification-recipient picker.'
        response:
          type: array
  activity-center:
    description: 'The activity feed behind the app''s home screen — what each user did today and what the whole plant did today, used to see who is actually working in the system rather than to audit records.'
    endpoints:
      my-today:
        method: GET
        path: /activity-center/me/today/
        description: 'Your own daily job sheet: every routine job the system expects of you today (approve a work order, start a run, log a gate entry…), grouped by how often it is due, with how many you have done, how many are still open, and how long the oldest untouched one has been waiting.'
        response:
          type: object
        params:
        - name: date
          type: string
          description: 'YYYY-MM-DD. Omit for today. Viewing an earlier day needs the activity_center.can_view_activity_reports permission (the UI disables the back arrow without it), so a past-date call may 403 on an ordinary account.'
      team-today:
        method: GET
        path: /activity-center/users/today/
        description: 'The whole team''s day on one board — every user, how many of their expected daily jobs they have done, how many records they created, when they first and last touched the system, and which modules they worked in.'
        response:
          type: object
        params:
        - name: date
          type: string
          description: 'YYYY-MM-DD. Omit for today. Past dates need activity_center.can_view_activity_reports.'
  attendance:
    description: 'This group covers three small, separate parts of the gate operation. (1) **Attendance** is the manual attendance register — the app''s own subtitle is "Manual attendance register — used when the punchi'
    endpoints:
      attendance-employees:
        method: GET
        path: /attendance/employees/
        description: 'List the employee master used by the manual attendance register (code, name, department, active flag).'
        response:
          type: array
        params:
        - name: search
          type: string
          description: 'Free-text. The UI filters client-side on name, employee_code and department_name, so expect the server filter to cover roughly the same fields. Accepted live (200).'
        - name: department
          type: integer
          description: 'Department id from /accounts/departments/.'
        - name: is_active
          type: boolean
          description: 'The client does String(bool) — send is_active=true, not True/1. Verified accepted live. sent as the lowercase string ''true''/''false'''
      attendance-records:
        method: GET
        path: /attendance/records/
        description: 'List manual attendance marks (IN/OUT punches with photo proof) for a date or date range.'
        response:
          type: array
        params:
        - name: date
          type: string
          description: 'Single day. What the UI dashboard always sends; defaults to today in the UI, but the server applies no default — omitting every filter returns the whole table. (YYYY-MM-DD)'
        - name: date_from
          type: string
          description: 'Start of range, inclusive. Verified accepted live. (YYYY-MM-DD)'
        - name: date_to
          type: string
          description: 'End of range, inclusive. (YYYY-MM-DD)'
        - name: employee
          type: integer
          description: 'Employee id from /attendance/employees/ (NOT the employee_code string).'
        - name: department
          type: integer
          description: 'Department id from /accounts/departments/ (1=IT, 2=Ecom, 3=Account, 4=Store, 5=Others, 6=Mess, 8=production, 9=production(oil), 10=production(beverages), 11=store RM-PM, 12=Warehouse Beverage, 13=Warehouse Gupta). Not a name.'
        - name: direction
          type: string
          description: 'The React client never sends this on the list, but the server''s own export docstring names direction as a shared list filter and it is accepted live (200). Enum values come from the DRF OPTIONS choices block: IN (display ''In''), OUT (display ''Out''). enum: IN | OUT'
      attendance-export:
        method: GET
        path: /attendance/records/export/
        description: 'Download an Excel (.xlsx) sheet of manual attendance marks for a date range.'
        response:
          type: object
        params:
        - name: date_from
          type: string
          description: 'Optional per the server''s own docstring, though the UI dialog forces both dates and rejects from > to. (YYYY-MM-DD)'
        - name: date_to
          type: string
          description: 'Optional server-side. (YYYY-MM-DD)'
        - name: employee
          type: integer
          description: 'Employee id.'
        - name: department
          type: integer
          description: 'Department id from /accounts/departments/.'
        - name: direction
          type: string
          description: 'Named explicitly in the server docstring for this endpoint. enum: IN | OUT'
  barcode:
    description: 'This is JIVO''s carton-level traceability system — the barcode that gets stuck on every box coming off a filling line, and everything that happens to that box afterwards. A production run generates BOX'
    endpoints:
      activity:
        method: GET
        path: /barcode/activity/
        description: 'The full barcode event feed — every label print, pallet move, dispatch scan and branch-transfer scan, newest first, with who did it and when.'
        response:
          type: object
        params:
        - name: kind
          type: string
          description: 'Event type. Values from the app''s own dropdown: LABEL_PRINT, PALLET_MOVEMENT, DISPATCH_SCAN, BST_SCAN, BST_RECEIVE. Read out of the bundle, not counter-verified against a live count.'
        - name: search
          type: string
          description: 'Free text, matched against the event title/detail. UI-sourced, not counter-verified.'
        - name: date_from
          type: string
          description: 'YYYY-MM-DD. UI-sourced, not counter-verified.'
        - name: date_to
          type: string
          description: 'YYYY-MM-DD. UI-sourced, not counter-verified.'
        - name: page
          type: integer
          description: '1-based page number.'
        - name: page_size
          type: integer
          description: 'Rows per page; the app sends 25. The server''s default when omitted was not observed — always send it.'
      activity-recent:
        method: GET
        path: /barcode/activity/recent/
        description: 'The last handful of barcode events — the live ''what just happened on the floor'' strip from the barcode dashboard.'
        response:
          type: object
        params:
        - name: limit
          type: integer
          description: 'How many events to return. A bare call returned exactly 15 in all three companies, so the server default is 15; the app also sends 15.'
      boxes:
        method: GET
        path: /barcode/boxes/
        description: 'List carton barcodes — item, batch, qty, pallet, warehouse and status for every box.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'opt-in; presence of page OR page_size switches on the DRF envelope int'
        - name: page_size
          type: integer
          description: 'without it you get a bare array HARD-CAPPED AT 500 rows int'
        - name: status
          type: string
          description: 'verified live. UI dropdown: ACTIVE, PARTIAL, DISMANTLED, VOID'
        - name: search
          type: string
          description: 'verified live — matches box_barcode (search=BOX-20260803-RP-0001 -> count 1)'
        - name: warehouse
          type: string
          description: 'verified live (warehouse=BH-JM -> 253 of 100314); warehouse codes are SAP codes seen in payloads, e.g. BH-JM, BH-PF, GP-FG, DL-FG'
        - name: unpalletized
          type: string
          description: 'verified live; UI sends the string "true" — boxes not on any pallet (264 in MART)'
      box:
        method: GET
        path: /barcode/boxes/{id}/
        description: 'One carton in full — including its embedded movement history (create, pallet in/out, warehouse moves). Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param, the numeric box id (not the barcode); 404 {"error":"Box <id> not found."} for an unknown id or the wrong company int'
      box-history:
        method: GET
        path: /barcode/boxes/{id}/history/
        description: 'Dead endpoint — always returns an empty list, in both this study and the last. The movement history you want is the `movements` list inside `barcode box`. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param, numeric box id int'
      dispatch-reports:
        method: GET
        path: /barcode/dispatch/reports/
        description: 'Dispatch summary per bill — expected vs dispatched vs pending quantity and boxes, and SAP sync state.'
        response:
          type: array
        params:
        - name: from_date
          type: string
          description: 'YYYY-MM-DD, verified live'
        - name: to_date
          type: string
          description: 'YYYY-MM-DD, verified live'
        - name: bill_number
          type: string
          description: 'UI-sourced'
        - name: customer
          type: string
          description: 'verified live (customer=CUSTA000048 -> 35 of 57); matches the customer code'
        - name: status
          type: string
          description: 'verified live. ACTIVE, PARTIAL, COMPLETED, CLOSED, CANCELLED (UI dropdown); DRAFT also appears in live rows'
        - name: material_code
          type: string
          description: 'UI-sourced'
        - name: pallet_barcode
          type: string
          description: 'UI-sourced'
        - name: box_barcode
          type: string
          description: 'UI-sourced'
      dispatch-reports-boxes:
        method: GET
        path: /barcode/dispatch/reports/boxes/
        description: 'Box-level dispatch report — every carton, its pallet, its bill and whether it has shipped.'
        response:
          type: array
        params:
        - name: from_date
          type: string
          description: 'YYYY-MM-DD'
        - name: to_date
          type: string
        - name: bill_number
          type: string
        - name: customer
          type: string
        - name: status
          type: string
        - name: material_code
          type: string
          description: 'verified live'
        - name: pallet_barcode
          type: string
        - name: box_barcode
          type: string
          description: 'verified live -> exactly 1 row'
      dispatch-reports-pallets:
        method: GET
        path: /barcode/dispatch/reports/pallets/
        description: 'Pallet-level dispatch report — boxes on each pallet, how many shipped, how many remain.'
        response:
          type: array
        params:
        - name: from_date
          type: string
        - name: to_date
          type: string
        - name: bill_number
          type: string
        - name: customer
          type: string
        - name: status
          type: string
        - name: material_code
          type: string
        - name: pallet_barcode
          type: string
          description: 'verified live -> exactly 1 row'
        - name: box_barcode
          type: string
      dispatch-reports-rejected-scans:
        method: GET
        path: /barcode/dispatch/reports/rejected-scans/
        description: 'Scans the system refused during dispatch — the barcode, the reason and the code, per bill and operator.'
        response:
          type: array
        params:
        - name: from_date
          type: string
          description: 'verified live (single-day range -> 51 rows)'
        - name: to_date
          type: string
          description: 'verified live'
        - name: bill_number
          type: string
        - name: customer
          type: string
        - name: status
          type: string
        - name: material_code
          type: string
        - name: pallet_barcode
          type: string
        - name: box_barcode
          type: string
      dispatch-report-detail:
        method: GET
        path: /barcode/dispatch/reports/{id}/
        description: 'Full dispatch report for one session — header, bill lines, the units scanned against each, and every scan. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param — the SESSION id, not a report id int'
      dispatch-sessions:
        method: GET
        path: /barcode/dispatch/sessions/
        description: 'All dispatch sessions — one per SAP bill being loaded, with expected vs scanned vs pending quantity and SAP sync state.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'ESSENTIAL — the unpaginated response is 4.5 MB on MART and TIMED OUT on OIL during the bulk survey int'
        - name: status
          type: string
          description: 'verified live (status=COMPLETED -> 2). Values seen in live rows + the reports filter: DRAFT, ACTIVE, PARTIAL, COMPLETED, CLOSED, CANCELLED'
        - name: search
          type: string
          description: 'verified live — matches bill_number (search=706260740 -> 1)'
      dispatch-sessions-active:
        method: GET
        path: /barcode/dispatch/sessions/active/
        description: 'Dispatch sessions still open on the floor — loading in progress or not yet started.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'same 4 MB / timeout risk as the base list int'
        - name: status
          type: string
          description: 'INFERRED — same viewset as the base list, not separately verified on this sub-path'
        - name: search
          type: string
          description: 'INFERRED, same reason'
      dispatch-sessions-closed:
        method: GET
        path: /barcode/dispatch/sessions/closed/
        description: 'Dispatch sessions a supervisor force-closed short of the full bill quantity.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'int'
      dispatch-sessions-completed:
        method: GET
        path: /barcode/dispatch/sessions/completed/
        description: 'Dispatch sessions where every bill line has been scanned out.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'OIL''s unpaginated response is 7.8 MB for 44 rows int'
      dispatch-sessions-from-bill:
        method: GET
        path: /barcode/dispatch/sessions/from-bill/
        description: 'GET /barcode/dispatch/sessions/from-bill/'
        response:
          type: array
      dispatch-session:
        method: GET
        path: /barcode/dispatch/sessions/{id}/
        description: 'One dispatch session in full — bill header, lines, scanned units and counters. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param. Wrong company -> 404 {"code":"SESSION_NOT_FOUND","error":"Dispatch session not found."} int'
      dispatch-sap-sync-logs:
        method: GET
        path: /barcode/dispatch/sessions/{id}/sap-sync-logs/
        description: 'SAP posting attempts for one dispatch session — what was sent and what came back. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param, session id int'
      dispatch-scan-logs:
        method: GET
        path: /barcode/dispatch/sessions/{id}/scan-logs/
        description: 'Every scan attempt in one dispatch session, accepted and rejected, with the exact message the scanner showed. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param, session id int'
      dispatch-settings:
        method: GET
        path: /barcode/dispatch/settings/
        description: 'The dispatch rulebook for this company — whether part-loads are allowed, whether a box can be pulled off a pallet, whether items must be scanned in order, and whether a supervisor can close or override a load.'
        response:
          type: object
      intercompany-dashboard:
        method: GET
        path: /barcode/intercompany/dashboard/
        description: 'Today''s intercompany movement plus lifetime totals per route and the latest transfers.'
        response:
          type: object
      intercompany-trace:
        method: GET
        path: /barcode/intercompany/trace/
        description: 'Follow one barcode across companies — where it is now, who made it, and its transfer history. Required: search.'
        response:
          type: object
        params:
        - name: search
          type: string
          required: true
          description: 'REQUIRED. Without it: HTTP 400 {"error": "Search value is required."} (verbatim). UI placeholder: "Barcode, batch, item code, or transfer number"'
      intercompany-transfers:
        method: GET
        path: /barcode/intercompany/transfers/
        description: 'Stock physically moved between JIVO companies by barcode scan — with every box on each transfer.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'STRONGLY recommended — the unpaginated response is 3.7 MB because every transfer embeds its full `lines` array int'
        - name: search
          type: string
          description: 'verified live — matches transfer_number (-> count 1)'
      intercompany-transfer:
        method: GET
        path: /barcode/intercompany/transfers/{id}/
        description: 'One intercompany transfer with its full barcode line list. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param int'
      intercompany-warehouses:
        method: GET
        path: /barcode/intercompany/warehouses/
        description: 'The warehouses a chosen JIVO company can receive intercompany stock into — the ''receive into warehouse'' picklist. Required: company_code.'
        response:
          type: array
        params:
        - name: company_code
          type: string
          required: true
          description: 'REQUIRED — a bare call returns HTTP 400 in all three companies. The parameter name is taken verbatim from the app''s own call (params:{company_code}); the 400 body itself was not captured. Values are the JIVO company codes: JIVO_OIL, JIVO_MART, JIVO_BEVERAGES.'
      items-oitm:
        method: GET
        path: /barcode/items/oitm/
        description: 'SAP item master as the barcode module sees it — UoM, batch flags and pieces-per-box for label generation.'
        response:
          type: array
        params:
        - name: search
          type: string
          description: 'verified live — matches item_code and item_name; a no-match search returns []'
        - name: limit
          type: integer
          description: 'verified live. Default 100. SERVER-CAPPED AT 200 — limit=201 and limit=1000 both return 200 rows in MART and OIL, while BEVERAGES returns 98 (its true total) int'
      item-detail:
        method: GET
        path: /barcode/items/oitm/detail/
        description: 'Item group lookup for one SAP item code — used to decide which label template applies. Required: item_code.'
        response:
          type: object
        params:
        - name: item_code
          type: string
          required: true
          description: 'REQUIRED. Without it: HTTP 400 {"error": "item_code is required."} (verbatim)'
      lookup:
        method: GET
        path: /barcode/lookup/{barcode}/
        description: 'Resolve any scanned barcode to what it actually is — box, pallet or unknown. Required: barcode.'
        response:
          type: object
        params:
        - name: barcode
          type: string
          required: true
          description: 'path param, URL-encoded by the client (encodeURIComponent). e.g. BOX-20260803-RP-0001'
      loose:
        method: GET
        path: /barcode/loose/
        description: 'Loose stock — part-used cartons booked out with a reason, and what they were later repacked into.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'without it, bare array capped at 500 int'
        - name: status
          type: string
          description: 'verified live. UI: ACTIVE, REPACKED, CONSUMED'
        - name: reason
          type: string
          description: 'verified live. UI: REPACK, SAMPLE, DAMAGED, RETURN, OTHER'
        - name: search
          type: string
          description: 'UI-sourced (LooseStockPage), not separately verified'
      loose-item:
        method: GET
        path: /barcode/loose/{id}/
        description: 'One loose-stock record — source box/pallet, reason and repack destination. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param int'
      loose-summary:
        method: GET
        path: /barcode/loose/summary/
        description: 'Loose stock rolled up per item — how many single bottles of each product are sitting opened and available to repack, and which batches they span.'
        response:
          type: array
        params:
        - name: search
          type: string
          description: 'Free text over the item; the only param the app ever sends here.'
      pallets:
        method: GET
        path: /barcode/pallets/
        description: 'List pallets — item, batch, box counts (total/available/dispatched), warehouse and status.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'without it, bare array capped at 500 int'
        - name: status
          type: string
          description: 'verified live. UI dropdown offers ACTIVE, CLEARED, SPLIT, VOID — but live rows also carry PARTIAL and DISPATCHED, so do NOT restrict the enum to the dropdown'
        - name: search
          type: string
          description: 'verified live — matches pallet_id and item_code (status=ACTIVE&search=FG0000384 -> 12)'
      pallet:
        method: GET
        path: /barcode/pallets/{id}/
        description: 'One pallet in full, with the list of boxes currently sitting on it. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param, numeric pallet id (not the PLT- code) int'
      pallet-history:
        method: GET
        path: /barcode/pallets/{id}/history/
        description: 'Dead endpoint — always returns an empty list, in both this study and the last. The movement history you want is the `movements` list inside `barcode pallet`. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param, numeric pallet id int'
      print-history:
        method: GET
        path: /barcode/print/history/
        description: 'Label print audit trail — every original print and reprint, with printer, operator and reprint reason.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'without it, bare array capped at 500 — and OIL has 329,931 rows int'
        - name: label_type
          type: string
          description: 'verified live. BOX | PALLET'
        - name: print_type
          type: string
          description: 'verified live. ORIGINAL | REPRINT'
        - name: search
          type: string
          description: 'UI-sourced (PrintHistoryPage), not separately verified'
      production-release-oil:
        method: GET
        path: /barcode/production-release-oil/
        description: 'Oil production orders released for labelling — planned quantity converted to box count, box size and litres.'
        response:
          type: array
        params:
        - name: limit
          type: integer
          description: 'verified live (limit=3 -> 3 rows). Default 100 int'
      scan-history:
        method: GET
        path: /barcode/scan/history/
        description: 'Every barcode scan the factory has made — type, entity, result, operator and device.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'without it, bare array capped at 500 of ~80,700 int'
        - name: scan_type
          type: string
          description: 'verified live (scan_type=SHIP -> 80,711 of 80,733). Values OBSERVED in live data / the bundle: SHIP, LOOKUP, BOX, PALLET, UNKNOWN. Not an exhaustive enum — do not guess others'
        - name: entity_type
          type: string
          description: 'verified live (entity_type=BOX -> 80,402). Observed: BOX, PALLET'
        - name: scan_result
          type: string
          description: 'verified live (scan_result=SUCCESS -> 72,495). Observed: SUCCESS'
      verify-requests:
        method: GET
        path: /barcode/verify-requests/
        description: 'Queue of pallet re-count requests raised when a pallet''s contents are disputed.'
        response:
          type: array
        params:
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'int'
        - name: status
          type: string
          description: 'verified live (status=CANCELLED -> 1 of 2). UI badge map: OPEN, IN_PROGRESS, RESOLVED, CANCELLED'
      verify-request:
