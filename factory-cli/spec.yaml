          description: 'YYYY-MM-DD'
        - name: to_date
          type: string
          description: 'YYYY-MM-DD'
        - name: search
          type: string
          description: 'same filter object as sales-dispatch'
        - name: document_type
          type: string
          description: 'INVOICE'
        - name: all_companies
          type: integer
          description: '1. VERIFIED live: a MART-headed call with all_companies=1 returned 2 JIVO_BEVERAGES bookings.'
      sales-dispatch-reports:
        method: GET
        path: /gate-core/sales-dispatch/reports/
        description: 'Gate-out control report — dispatch counts bucketed by stage (waiting inside, missing photo, gatepass pending, printed-not-committed, ready, dispatched, rejected) with the full rows behind each bucket.'
        response:
          type: object
        params:
        - name: from_date
          type: string
          description: 'YYYY-MM-DD — VERIFIED live, a 3-day window gave counts.total 6 instead of 142'
        - name: to_date
          type: string
          description: 'YYYY-MM-DD'
        - name: search
          type: string
          description: 'inferred — same generic query-string serializer as the other salesDispatch calls; not confirmed against data'
        - name: document_type
          type: string
          description: 'inferred, same serializer'
        - name: all_companies
          type: integer
          description: 'inferred, same serializer'
      sales-dispatch-detail:
        method: GET
        path: /gate-core/sales-dispatch/{id}/
        description: 'One dispatch in full — every SAP document, line item, attachment and box scan on it. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'path param — sales-dispatch id'
      sales-dispatch-attachments:
        method: GET
        path: /gate-core/sales-dispatch/{id}/attachments/
        description: 'Documents photographed or uploaded against a dispatch — e-way bill, bilty, truck photo. Required: id.'
        response:
          type: object
        params:
        - name: id
