          required: true
          description: 'path param — sales-dispatch id'
      sales-dispatch-box-scans:
        method: GET
        path: /gate-core/sales-dispatch/{id}/box-scans/
        description: 'Every carton barcode scanned onto a dispatch — the box-level proof of what physically went on the truck. Required: id.'
