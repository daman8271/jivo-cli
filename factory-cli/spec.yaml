          description: 'ONLY "preform" observed (verified live on JIVO_OIL: returns the 7 PM preform items). A bottle variant is plausible — the run object carries sap_bottle_item_code — but I did NOT test it, per the no-guessing rule.'
  company:
    description: 'company'
    endpoints:
      companies:
        method: GET
        path: /company/companies/
        description: 'GET /company/companies/'
        response:
          type: object
  construction-gatein:
    description: 'These five prefixes are the "what came in the gate" flows, split by what kind of material arrived: raw material / packing material against a purchase order, daily-needs (canteen food and consumables),'
    endpoints:
      construction-categories:
        method: GET
        path: /construction-gatein/gate-entries/construction/categories/
        description: 'List the material categories a construction gate entry can be filed under (civil/building work).'
        response:
          type: array
      construction-entry:
        method: GET
        path: /construction-gatein/gate-entries/{entry_id}/construction/
        description: 'Read the construction material detail recorded against one gate entry — project, work order, contractor, what was brought in. Required: entry_id.'
        response:
          type: object
        params:
        - name: entry_id
          type: integer
          required: true
          description: 'The VEHICLE ENTRY id (gate entry id) from /vehicle-management/vehicle-entries/?entry_type=CONSTRUCTION — NOT the id in this response, which is the construction detail row''s own id. (path)'
  daily-needs-gatein:
    description: 'These five prefixes are the "what came in the gate" flows, split by what kind of material arrived: raw material / packing material against a purchase order, daily-needs (canteen food and consumables),'
    endpoints:
      gate-entries-daily-need-categories:
        method: GET
        path: /daily-needs-gatein/gate-entries/daily-need/categories/
        description: 'List the daily-needs categories (canteen food / routine consumables) a gate entry can be filed under.'
        response:
          type: array
      daily-need-entry:
        method: GET
        path: /daily-needs-gatein/gate-entries/{entry_id}/daily-need/
        description: 'Read the daily-needs consumables detail on one gate entry — supplier, bill/challan, line items and receiving department. Required: entry_id.'
        response:
          type: object
