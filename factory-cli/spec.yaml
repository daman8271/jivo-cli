  returnable-items:
    description: 'This is JIVO''s RGP/NRGP gate-pass book — the register of material that leaves the factory gate and is meant to come back. A department raises a pass for a pump, motor, mould shaft, cutter, cooler, or'
    endpoints:
      attachment:
        method: GET
        path: /returnable-items/returnable-attachments/{id}/
        description: 'One attachment on a gate pass — its file link, whether it is a delivery challan or a photo, its caption, and who uploaded it when.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Attachment id from the attachments list (path segment). Not the gate-pass id.'
      dashboard:
        method: GET
        path: /returnable-items/dashboard/
        description: 'Say plainly: outstanding_value read 0 on Oil despite 7 outstanding passes, because gate-pass lines carry estimated_value null — it is not populated and must not be quoted as the value of material outside the gate. The usable outstanding number is the pending-gate-in list (7 passes on Oil), aged on expected_return_date.'
        response:
          type: object
      options:
        method: GET
        path: /returnable-items/options/
        description: 'The dropdown vocabulary for this module — the exact status, purpose, out-condition and return-condition codes with their human labels.'
        response:
          type: object
      report:
        method: GET
        path: /returnable-items/reports/
        description: 'Flat gate-pass register for export — one row per pass with the dates that matter, filterable by status and by the date it was raised.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'Same 8 values as the list endpoint. HONOURED — verified live: status=OUT cut count from 40 to 5. enum'
        - name: date_from
          type: string
          description: 'HONOURED — verified live: date_from=2026-07-31 cut count from 40 to 5. Filters on the date the pass was RAISED (created_at), not on expected_return_date or gate_out_at. date YYYY-MM-DD'
        - name: date_to
          type: string
          description: 'HONOURED — verified live: date_to=2026-07-31 gave 39 of 40, excluding exactly the one pass created on 2026-08-01. date YYYY-MM-DD'
      attachments:
        method: GET
        path: /returnable-items/returnable-attachments/
        description: 'Delivery challans and photos attached to gate passes, with a direct file URL for each.'
        response:
          type: array
        params:
        - name: gate_pass
          type: integer
          description: 'Filter to one gate pass. Verified live: gate_pass=49 returned its one CHALLAN image.'
      gatepass-items:
        method: GET
        path: /returnable-items/returnable-gatepass-items/
        description: 'Line-item register across all gate passes — every physical thing sent out, with quantity out, quantity returned and what is still pending.'
        response:
          type: array
        params:
        - name: gate_pass
          type: integer
          description: 'Filter to one gate pass. Verified live: gate_pass=49 returned exactly that pass''s single line.'
      gatepass-item:
        method: GET
        path: /returnable-items/returnable-gatepass-items/{id}/
        description: 'Show one gate-pass line item by its own id. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Line-item PK, not the gate-pass id. Verified live on id 1 (FA0000183 BOSCH CUTTER). (path segment)'
      gatepasses:
        method: GET
        path: /returnable-items/returnable-gatepasses/
        description: 'List returnable/non-returnable gate passes — material sent out of the gate for repair, exchange or job work, and whether it has come back.'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'DRAFT | PENDING_APPROVAL | PENDING_GATE_OUT | OUT | PARTIALLY_RETURNED | RETURNED | CLOSED | CANCELLED. Verified live: status=OUT narrowed 40 rows to 5. NEVER send the UI''s sentinel value ALL — the frontend strips it before the request. enum'
        - name: purpose
          type: string
          description: 'REPAIR | EXCHANGE | CALIBRATION | JOB_WORK | WARRANTY_CLAIM | TESTING | DEMO_TRIAL | OTHER. Verified live: purpose=REPAIR narrowed 40 to 14. Same ALL caveat. enum'
        - name: is_returnable
          type: boolean
          description: 'true = RGP series only, false = NRGP series only. Verified live: is_returnable=false returned the 16 NRGP passes.'
        - name: overdue
          type: boolean
          description: 'Verified live but USELESS today: overdue=true returns 0 rows even though passes are 6 days past their expected_return_date, because it filters on the stale stored is_overdue flag. See gotchas.'
        - name: q
          type: string
          description: 'Free-text search over pass no, party, item name and serial number (UI placeholder text). Verified live: q=Manoj returned 3 passes, matching both party_name ''Manoj electrical'' and driver_name ''Manoj''.'
      pending-approval:
        method: GET
        path: /returnable-items/returnable-gatepasses/pending-approval/
        description: 'The approver''s inbox — gate passes submitted by a department and waiting for sign-off before they may go to the gate.'
        response:
          type: array
      pending-gate-in:
        method: GET
        path: /returnable-items/returnable-gatepasses/pending-gate-in/
        description: 'The inbound guard''s list — material that is still out with an outside party and has not been logged back in.'
        response:
          type: array
      pending-gate-out:
        method: GET
        path: /returnable-items/returnable-gatepasses/pending-gate-out/
        description: 'The outbound guard''s release queue — approved gate passes whose material has not yet physically left the gate.'
        response:
          type: array
      gatepass:
        method: GET
        path: /returnable-items/returnable-gatepasses/{id}/
        description: 'Show one gate pass in full — party, department, dates, approvals, vehicle/driver, every line item, every return event and every attachment. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Numeric primary key from the list endpoint''s id field — NOT the pass_no. Verified live on ids 11, 22 and 49 in JIVO_OIL. (path segment)'
      timeline:
        method: GET
        path: /returnable-items/returnable-gatepasses/{id}/timeline/
        description: 'The audit trail of one gate pass — who submitted, approved, released it at the gate, logged the return, and when. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Gate-pass PK. Verified live on id 49: 3 rows — SUBMITTED, APPROVED, GATE_OUT. (path segment)'
      return-events:
        method: GET
        path: /returnable-items/returnable-return-events/
        description: 'Every time material came back through the gate — when, on which vehicle, verified by whom, and in what condition each item arrived.'
        response:
          type: array
        params:
        - name: gate_pass
          type: integer
          description: 'Filter to one gate pass. Verified live: gate_pass=11 returned its single R1 event.'
      sap-items:
        method: GET
        path: /returnable-items/sap-items/
        description: 'Look up a SAP item by name or code to put on a gate pass — returns item code, name and unit of measure. Required: search.'
        response:
          type: array
        params:
        - name: search
          type: string
          required: true
          description: 'EFFECTIVELY REQUIRED but not enforced: with no search the endpoint returns 200 and an empty array rather than a 400, which reads as ''no SAP items exist''. Verified live: search=BOSCH on JIVO_OIL returned FA0000183 BOSCH CUTTER.'
        - name: limit
          type: integer
          description: 'Row cap; the UI passes 50 by default. Verified live that the param is accepted (limit=5 alongside search=BOSCH), though the result set was too small to prove it truncates.'
  sap:
    description: 'This corner of the factory app answers one question: can we actually build what SAP says we are going to build, and what do we have to buy to close the gap. The "SAP Material Plan" screen (web route /'
    endpoints:
      plan-dashboard-details:
        method: GET
        path: /sap/plan-dashboard/details/
        description: 'Same open production orders as the summary but with every BOM component line nested — required, issued, remaining, stock on hand/committed/on-order, shortfall and per-component stock status.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'planned | released. Verified server-side (OIL 201 -> 164 for released).'
        - name: due_date_from
          type: string
          description: 'YYYY-MM-DD'
        - name: due_date_to
          type: string
          description: 'YYYY-MM-DD'
        - name: warehouse
          type: string
          description: 'UPPERCASE SAP warehouse code'
        - name: sku
          type: string
          description: 'UPPERCASE SAP item code; verified warehouse=BH-PF&sku=FG0000030 -> 7 orders / 49 lines'
        - name: show_shortfall_only
          type: boolean
          description: 'Send as true. VERIFIED effective here: OIL 201 orders/1127 lines -> 141 orders/417 lines. (Unlike on the summary endpoint, where it is a no-op.)'
      plan-dashboard-procurement:
        method: GET
        path: /sap/plan-dashboard/procurement/
        description: 'Shortfall rolled up by component across all open production orders, with a suggested purchase quantity and the production orders that need it — the buy list.'
        response:
          type: object
        params:
        - name: show_shortfall_only
          type: boolean
          description: 'Send as true. VERIFIED effective: OIL 191 components -> 59 (exactly the components_with_shortfall count). The most useful flag on this command.'
        - name: status
          type: string
          description: 'planned | released — accepted by the shared filter (inferred: I verified status on summary and details, not on procurement).'
        - name: due_date_from
          type: string
          description: 'YYYY-MM-DD'
        - name: due_date_to
          type: string
          description: 'YYYY-MM-DD'
        - name: warehouse
          type: string
          description: 'UPPERCASE SAP warehouse code'
        - name: sku
          type: string
          description: 'UPPERCASE SAP finished-good item code — filters by the parent order''s SKU, not by the component'
      plan-dashboard-sku:
        method: GET
        path: /sap/plan-dashboard/sku/{prod_order_entry}/
        description: 'Full BOM component breakdown for ONE open production order — required vs issued vs remaining, available stock and shortfall per component. Required: prod_order_entry.'
        response:
          type: object
        params:
        - name: prod_order_entry
          type: integer
          required: true
          description: 'PATH parameter. This is the SAP production order DocEntry (e.g. 751), taken from prod_order_entry in the summary/details payload. Despite the path saying ''sku'', it is NOT a SKU code — passing FG0000030 will not resolve.'
      plan-dashboard-summary:
        method: GET
        path: /sap/plan-dashboard/summary/
        description: 'One row per open SAP production order: planned vs completed qty, due date, warehouse and how many of its BOM components are short — the ''which orders are at risk'' view.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'Enum, lowercase: planned | released. VERIFIED server-side (OIL 201 rows -> 37 with status=planned, matching the local count). The web UI does NOT send this (it filters client-side and strips status from its query key), so it is undocumented but real.'
        - name: due_date_from
          type: string
          description: 'YYYY-MM-DD, inclusive lower bound on due_date. Verified (OIL 201 -> 17 for 2026-07-01..2026-08-31).'
        - name: due_date_to
          type: string
          description: 'YYYY-MM-DD, inclusive upper bound on due_date.'
        - name: warehouse
          type: string
          description: 'SAP warehouse code, e.g. BH-PF. Must be UPPERCASE — the UI trims+uppercases before sending. Verified (OIL 201 -> 143 for BH-PF). Codes come from `po warehouses`.'
        - name: sku
          type: string
          description: 'SAP finished-good item code, e.g. FG0000030. Must be UPPERCASE. Verified (OIL 201 -> 7).'
  supply-chain:
    description: '"Smart Supply Chain" is the factory app''s buy-and-build planner — it answers "what must we order today so the plant doesn''t run dry, and can the lines actually run the plan?" It has three layers. (1) The Daily Run grades every enrolled finished-good material RED/AMBER/GREEN/UNKNOWN on days-of-stock-cover against how long the supplier takes, gets reviewed, published to the buyer and HODs, and then collects the buyer''s verdict after each phone call (real shortage / wrong data / already handled) — the Weekly Review scores whether those alarms were worth raising. (2) The Planning dashboard turns a SAP sales forecast into a procurement list plus a machine-hours capacity check plus a stock-buffer policy check. (3) The Live Trail is a live read straight out of SAP''s open order book, stock, work orders and BOMs, working out what to produce tomorrow, what to buy, and which department is holding up each order. CRITICAL CONTEXT: as of the 2026-08-11 probe the whole module is unconfigured in all three companies — no monitored SKUs, no lead times, no machines, no SKU-to-machine mappings, no reference workbook ever uploaded. Most endpoints therefore return empty or zero, and the ones that look healthy (capacity "feasible: true", floors "0 divergent") are green only because nothing was checked.'
    endpoints:
      alarms-preview:
        method: GET
        path: /supply-chain/alarms/preview/
        description: 'Dry run of the morning shortage alarm: which departments would be notified and how many people would receive it — without sending anything.'
        response:
          type: object
      capacity:
        method: GET
        path: /supply-chain/capacity/
        description: 'Machine-by-machine check of whether the filling lines have enough usable hours to run the current plan, including changeover time, plus the SKUs that have no machine or output rate on file at all.'
        response:
          type: object
      dashboard:
        method: GET
        path: /supply-chain/dashboard/
        description: 'The morning planning board for one SAP sales forecast: every material that must be ordered and the date it had to be ordered by, whether each filling line has the hours to run the plan, and whether the stock buffers we keep match the policy floor.'
        response:
          type: object
        params:
        - name: forecast_id
          type: string
          description: 'Which SAP sales forecast to plan against (the same forecasts the Sales Planning vs Requirement dashboard lists). Omit for the current/default forecast — the SPA omits the param entirely rather than sending an empty value.'
      floor-convention:
        method: GET
        path: /supply-chain/floor-convention/
        description: 'A diagnostic that works out, from SAP''s own numbers, whether the stock buffer is meant to be ADDED to the requirement or SUBTRACTED from it — the two readings of the written procedure give different order quantities.'
        response:
          type: object
      floors:
        method: GET
        path: /supply-chain/floors/
        description: 'Compares the minimum stock actually set in SAP against the buffer the policy says we should keep (a percentage of recent sales), item by item, and flags the ones that differ.'
        response:
          type: object
      live-trail:
        method: GET
        path: /supply-chain/live-trail/
        description: 'A live read straight out of SAP: every open sales order line, what stock and work-in-progress already covers it, what must still be produced tomorrow, which bought-in components that will eat, what has to be purchased, and which department is holding up each order.'
        response:
          type: object
        params:
        - name: scope
          type: string
          description: 'EXTERNAL (the app''s default — real customer demand only, intercompany lines excluded) or ALL (includes intercompany). The app always sends one of the two explicitly.'
      monitored-skus:
        method: GET
        path: /supply-chain/monitored-skus/
        description: 'The finished goods enrolled in the daily run — the list that decides which materials get checked for shortages at all.'
        response:
          type: array
      parameters:
        method: GET
        path: /supply-chain/parameters/
        description: 'The tuning knobs behind the daily run: which percentile of past deliveries counts as a supplier''s lead time, how many deliveries before that is trusted, how close to the lead time turns a material amber, and how many red rows in one run means the data is not believable.'
        response:
          type: object
      policy:
        method: GET
        path: /supply-chain/policy/
        description: 'The company''s supply-chain planning rules: how big a stock buffer to keep and measured against what, how many days ahead counts as urgent, and whether shortages are netted against open POs, rounded up to supplier minimums, and charged for changeover time.'
        response:
          type: object
      procurement:
        method: GET
        path: /supply-chain/procurement/
        description: 'Every material the current plan is short of: what is on hand, what is already on open purchase orders, how much to order, the supplier''s lead time, and the last date the order can be placed without running dry.'
        response:
          type: object
      reference-imports:
        method: GET
        path: /supply-chain/reference/imports/
        description: 'The history of reference workbooks that have been uploaded — who loaded what and when, and how many lead times, machines and SKU mappings each file brought in.'
        response:
          type: array
      reference-lead-times:
        method: GET
        path: /supply-chain/reference/lead-times/
        description: 'The supplier lead times Procurement typed into the reference workbook — how many days each material takes to arrive once ordered.'
        response:
          type: array
      reference-machines:
        method: GET
        path: /supply-chain/reference/machines/
        description: 'The filling and packing machines the capacity check plans against, with the hours each one can actually run.'
        response:
          type: array
      reference-sku-machines:
        method: GET
        path: /supply-chain/reference/sku-machines/
        description: 'Which machine each finished-good SKU can be run on and how fast — the mapping that turns a production plan into machine hours.'
        response:
          type: array
      run-latest:
        method: GET
        path: /supply-chain/runs/latest/
        description: 'The most recent daily shortage run in full: every monitored material graded order-today / getting-close / fine / cannot-judge, the arithmetic behind each grade, the data problems that stopped it judging some of them, and how many red rows the buyer has since given a verdict on.'
        response:
          type: object
      runs:
        method: GET
        path: /supply-chain/runs/
        description: 'Every daily shortage run that has been built for this company — the date it covers, how far through review it got, and how many materials came out red.'
        response:
          type: array
      weekly:
        method: GET
        path: /supply-chain/weekly/
        description: 'Was raising the alarm worth it? Counts the buyer''s verdicts on red materials week by week — how many turned out to be real shortages, how many were bad data, how many were already handled — and says in plain words what to do about it.'
        response:
          type: object
        params:
        - name: weeks
          type: integer
          description: 'How many weeks back to score. The app defaults to 4 and offers 2, 4 and 8. The from/to dates in the response are derived from this — you cannot pass arbitrary dates.'
  vehicle-management:
    description: 'This is the factory''s transport master file plus the gate''s vehicle-entry log. Three master lists sit under it — Vehicles (registration number, type, capacity, owning transporter), Transporters (conta'
    endpoints:
      transporter:
        method: GET
        path: /vehicle-management/transporters/{id}/
        description: 'One transport company''s record — name, contact person, mobile, GSTIN and when it was added.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Transporter id from the transporters or transporters-names command (path segment).'
      transporters:
        method: GET
        path: /vehicle-management/transporters/
        description: 'All transport companies on file, with contact person, mobile and GSTIN.'
        response:
          type: array
      transporters-names:
        method: GET
        path: /vehicle-management/transporters/names/
        description: 'Slim id + name list of transporters, for pickers.'
        response:
          type: array
      vehicle:
        method: GET
        path: /vehicle-management/vehicles/{id}/
        description: 'One vehicle''s record — registration number, category, capacity in tonnes and the transporter that owns it.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'Numeric vehicle id from the vehicles or vehicles-names command (path segment). NOT the registration number — the by-number route is a different endpoint.'
      vehicle-entries:
        method: GET
        path: /vehicle-management/vehicle-entries/
        description: 'The gate log: every vehicle that entered the plant for one movement type in a date window, with vehicle, driver, status and supplier. Required: entry_type, from_date, to_date.'
        response:
          type: object
        params:
        - name: entry_type
          type: string
          required: true
          description: 'EXACTLY ONE value per call. Live-accepted: RAW_MATERIAL, SALES_DISPATCH, DAILY_NEED, MAINTENANCE, CONSTRUCTION, FIXED_ASSET, JOB_WORK, EMPTY_VEHICLE. Omitting it returns 400 {"detail":"entry_type query parameter is required"} enum'
        - name: from_date
          type: string
          required: true
          description: 'inclusive; omitting returns 400 {"detail":"from_date query parameter is required"} date YYYY-MM-DD'
        - name: to_date
          type: string
          required: true
          description: 'inclusive; omitting returns 400 {"detail":"to_date query parameter is required"} date YYYY-MM-DD'
      vehicle-entries-count:
        method: GET
        path: /vehicle-management/vehicle-entries/count/
        description: 'How many gate entries of one movement type sit in each status over a date window — the ''how many trucks are still waiting on QC'' number. Required: entry_type, from_date, to_date.'
        response:
          type: object
        params:
        - name: entry_type
          type: string
          required: true
          description: 'same 8 values; required, 400 {"detail":"entry_type query parameter is required"} if missing enum'
        - name: from_date
          type: string
          required: true
          description: 'required date YYYY-MM-DD'
        - name: to_date
          type: string
          required: true
          description: 'required date YYYY-MM-DD'
      vehicle-entries-list-by-status:
        method: GET
        path: /vehicle-management/vehicle-entries/list-by-status/
        description: 'The same gate log, but filtered to one status — the only way to actually filter entries by status. Required: status, entry_type, from_date, to_date.'
        response:
          type: object
        params:
        - name: status
          type: string
          required: true
          description: 'Live-observed values: DRAFT, IN_PROGRESS, COMPLETED, CANCELLED, QC_PENDING, QC_COMPLETED, QC_AWAITING_QAM, ARRIVAL_SLIP_REJECTED. Omitting it returns 400 {"detail":"status query parameter is required"} — this is the FIRST error you hit here enum'
        - name: entry_type
          type: string
          required: true
          description: 'same 8 values as vehicle-entries; also required — the 400 cascade is status, then entry_type, then from_date, then to_date enum'
        - name: from_date
          type: string
          required: true
          description: 'required despite the July spec marking it optional — verified live date YYYY-MM-DD'
        - name: to_date
          type: string
          required: true
          description: 'required despite the July spec marking it optional — verified live date YYYY-MM-DD'
      vehicle-types:
        method: GET
        path: /vehicle-management/vehicle-types/
        description: 'The fixed list of vehicle categories used across the plant (Truck, Car, Bike, Cycle, Eco Van, Courier, By Hand).'
        response:
          type: array
      vehicles:
        method: GET
        path: /vehicle-management/vehicles/
        description: 'Every vehicle registered with the factory — registration number, type, capacity in tonnes and which transporter owns it.'
        response:
          type: array
      vehicles-names:
        method: GET
        path: /vehicle-management/vehicles/names/
        description: 'Slim id + registration-number list of all vehicles, for pickers and lookups.'
        response:
          type: array
      vehicle-entry:
        method: GET
        path: '/vehicle-management/vehicle-entries/{id}/'
        description: 'The detail behind a row of the shipped `vehicle-management vehicle-entries` list. TRAP: that list REQUIRES entry_type, from_date and to_date - a bare call returns HTTP 400 {"detail":"entry_type query parameter is required"}, then {"detail":"from_date query parameter is required"}. Observed entry_type values, from the app''s own enum: RAW_MATERIAL, DAILY_NEED, MAINTENANCE, CONSTRUCTION, FIXED_ASSET, EMPTY_VEHICLE, BST_IN, BST_RETURN, JOB_WORK.'
        response:
          type: object
        params:
        - name: id
          type: string
          description: 'Vehicle entry id from `vehicle-management vehicle-entries`'
          required: true
      vehicle-history-by-number:
        method: GET
        path: '/vehicle-management/vehicles/by-number/{vehicle_number}/history/'
        description: 'Keyed on the registration plate rather than an internal id - the one place in this API where a business string is the key. The app URL-encodes the number before sending it.'
        response:
          type: object
        params:
        - name: vehicle_number
          type: string
          description: 'Registration number, e.g. DL01LAA3980 - read it off a `vehicle-management vehicle-entries` row'
          required: true

  warehouse:
    description: 'The warehouse module is the factory floor''s stock-handling desk — its own landing page calls it "Material requests, finished goods, branch transfers, and goods receipts". Three live workflows sit unde'
    endpoints:
      bom-requests:
        method: GET
        path: /warehouse/bom-requests/
        description: 'Material requests raised by production against a run — what the line asked for, what the warehouse approved, and whether the materials have actually been issued.'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'VERIFIED server-side: ?status=PARTIALLY_APPROVED on JIVO_OIL returned 77 of 95 rows. Enum read from the UI''s status dropdown. The UI sends no status param at all for ''All Statuses''. enum: PENDING | APPROVED | PARTIALLY_APPROVED | REJECTED'
        - name: production_run_id
          type: integer
          description: 'VERIFIED: ?production_run_id=141 on JIVO_OIL returned the 1 matching request.'
      bom-request-get:
        method: GET
        path: /warehouse/bom-requests/{id}/
        description: 'One material request with every requested line, the stock available in each warehouse, and what was approved versus issued. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'id from bom-requests (path)'
      bst-list:
        method: GET
        path: /warehouse/bst/
        description: 'Branch stock transfers dispatched FROM this company — every outgoing BST with route, SAP doc, boxes scanned, vehicle, driver and status.'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'VERIFIED server-side filter. Enum from the UI: DRAFT, SCANNING, DISPATCHED, AWAITING_GATE_OUT, GATED_OUT, IN_TRANSIT, AWAITING_GATE_IN, GATED_IN, ARRIVED, RECEIVING, RECEIVED, PARTIALLY_RECEIVED, CLOSED, CANCELLED. Live proof: JIVO_OIL 167 rows unfiltered -> 115 rows with ?status=RECEIVED, all 115 RECEIVED.'
        - name: from_date
          type: string
          description: 'VERIFIED. JIVO_OIL 167 rows -> 13 with from_date=2026-08-01&to_date=2026-08-03. (YYYY-MM-DD)'
        - name: to_date
          type: string
          description: 'VERIFIED, used as a pair with from_date. (YYYY-MM-DD)'
      bst-gate-inwards:
        method: GET
        path: /warehouse/bst/gate/expected-inwards/
        description: 'Security gate''s inbound list — branch transfers the gate should expect to arrive.'
        response:
          type: array
        params:
        - name: from_date
          type: string
          description: 'INFERRED, not proven: the endpoint returned an empty array in all three companies, so a date filter could not be shown to work. The app''s own service method calls it with NO params at all. (YYYY-MM-DD)'
        - name: to_date
          type: string
          description: 'INFERRED, same caveat (YYYY-MM-DD)'
      bst-gate-outwards:
        method: GET
        path: /warehouse/bst/gate/expected-outwards/
        description: 'Security gate''s outbound list — branch transfers the gate should expect to leave, so it can match vehicle and driver before letting the truck out.'
        response:
          type: array
        params:
        - name: from_date
          type: string
          description: 'VERIFIED. JIVO_OIL 129 rows -> 2 with from_date=to_date=2026-08-03. (YYYY-MM-DD)'
        - name: to_date
          type: string
          description: 'VERIFIED (YYYY-MM-DD)'
      bst-incoming:
        method: GET
        path: /warehouse/bst/incoming/
        description: 'Branch stock transfers heading INTO this company from another branch or company — the receiving desk''s worklist.'
        response:
          type: array
        params:
        - name: from_date
          type: string
          description: 'VERIFIED. JIVO_OIL 98 rows -> 4 with from_date=2026-08-01&to_date=2026-08-03. (YYYY-MM-DD)'
        - name: to_date
          type: string
          description: 'VERIFIED, paired with from_date. (YYYY-MM-DD)'
      bst-incoming-get:
        method: GET
        path: /warehouse/bst/incoming/{id}/
        description: 'One inbound branch transfer in full, including short-shipment detail and the partial-transfer approval record. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'id from bst-incoming (path)'
      bst-partial-transfers:
        method: GET
        path: /warehouse/bst/partial-transfers/
        description: 'Short-shipment approval queue — where a receiving branch scanned fewer boxes than the SAP document promised and a supervisor must approve or reject the difference.'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'Enum from the UI filter: PENDING (the badge component calls it with status=PENDING) and '''' for All. APPROVED observed in a live JIVO_OIL payload; REJECTED inferred from the reject action. Returned 200 with 0 rows for ?status=PENDING on JIVO_OIL, so the filter is accepted but its effect was not provable against data.'
      bst-sap-transfers:
        method: GET
        path: /warehouse/bst/sap-transfers/
        description: 'SAP stock-transfer and sales-invoice documents available to build a branch transfer from — the pick-list the ''New BST'' screen searches.'
        response:
          type: array
        params:
        - name: search
          type: string
          description: 'VERIFIED server-side. ?search=826676539 on JIVO_OIL narrowed 50 rows to the 1 matching doc_num. The UI only calls this endpoint once the operator has typed something.'
        - name: document_type
          type: string
          description: 'Enum read directly from the New-BST screen. Omitted, the endpoint behaves as STOCK_TRANSFER. enum: STOCK_TRANSFER | INVOICE'
      bst-sap-transfer-get:
        method: GET
        path: /warehouse/bst/sap-transfers/{doc_entry}/
        description: 'One SAP stock-transfer or invoice document with its lines and cartons-per-box maths, as the BST screen sees it. Required: doc_entry.'
        response:
          type: object
        params:
        - name: doc_entry
          type: integer
          required: true
          description: 'SAP DocEntry taken from bst-sap-transfers or from a BST''s sap_doc_entry. Company-scoped — see notes. (path)'
        - name: document_type
          type: string
          description: 'VERIFIED both branches live. Omitted, the server defaults to STOCK_TRANSFER, so an invoice DocEntry read without this param will either miss or return the wrong document. enum: STOCK_TRANSFER | INVOICE'
      bst-get:
        method: GET
        path: /warehouse/bst/{id}/
        description: 'One branch stock transfer in full — its SAP source docs, line items, box scans, scan progress and any partial-transfer request. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'The internal BST id from bst-list / bst-incoming. NOT the entry_no and NOT a SAP DocEntry. (path)'
      fg-receipts:
        method: GET
        path: /warehouse/fg-receipts/
        description: 'Finished goods coming off production runs — good versus rejected quantity, which warehouse they went into, and whether the receipt reached SAP.'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'VERIFIED accepted: ?status=RECEIVED on JIVO_OIL returned the 3 rows, all RECEIVED. Enum read from the UI''s status dropdown. enum: PENDING | RECEIVED | SAP_POSTED | FAILED'
        - name: production_run_id
          type: integer
          description: 'INFERRED from the app''s query hook (getFGReceipts({status, production_run_id})); not separately proven live.'
      fg-receipt-get:
        method: GET
        path: /warehouse/fg-receipts/{id}/
        description: 'One finished-goods receipt, including the SAP posting result or the SAP error text if the post failed. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'id from fg-receipts (path)'
      wms-item-groups:
        method: GET
        path: /warehouse/wms/item-groups/
        description: 'The company''s SAP item-group master (FINISHED, RAW MATERIAL, PACKAGING MATERIAL, …) with its numeric group codes.'
        response:
          type: object
      wms-warehouses:
        method: GET
        path: /warehouse/wms/warehouses/
        description: 'The company''s SAP warehouse master — every warehouse code and name, as the app''s warehouse dropdowns see it.'
        response:
          type: object
  wms:
    description: 'The warehouse module is the factory floor''s stock-handling desk — its own landing page calls it "Material requests, finished goods, branch transfers, and goods receipts". Three live workflows sit unde'
    endpoints:
      wms-cell-purposes:
        method: GET
        path: /wms/cellPurposes/
        description: 'What each kind of grid cell is for — fork-lift path, storage, staging and so on, with its map colour.'
        response:
          type: object
        params:
        - name: limit
          type: integer
        - name: offset
          type: integer
      wms-inventory:
        method: GET
        path: /wms/inventory/
        description: 'What is physically sitting in the WMS today, box by box, with unit of measure and weight/volume where known.'
        response:
          type: object
        params:
        - name: warehouseId
          type: string
          description: '(UUID)'
        - name: locationId
          type: string
          description: '(UUID)'
        - name: limit
          type: integer
        - name: offset
          type: integer
      wms-locations:
        method: GET
        path: /wms/locations/
        description: 'Every physical rack cell in the WMS grid — its code, row/column/level, type, purpose and whether it is active.'
        response:
          type: object
        params:
        - name: warehouseId
          type: string
          description: 'From the bundle''s list()/listPage(); pass only an id observed in wms-warehouses. Not separately proven live. (UUID)'
        - name: limit
          type: integer
          description: 'Switches to the {results,count} envelope'
        - name: offset
          type: integer
        - name: order
          type: string
          description: 'Present in the bundle''s listPage(); accepted values not established — do not expose until observed.'
      wms-materials:
        method: GET
        path: /wms/materials/
        description: 'Material definitions used by the WMS location material-rules.'
        response:
          type: object
        params:
        - name: limit
          type: integer
        - name: offset
          type: integer
      wms-movements:
        method: GET
        path: /wms/movements/
        description: 'WMS movement log — every putaway, pick and transfer performed on the floor, with the item, box count and who did it.'
        response:
          type: object
        params:
        - name: warehouseId
          type: string
          description: '(UUID)'
        - name: limit
          type: integer
        - name: offset
          type: integer
      wms-pallets:
        method: GET
        path: /wms/pallets/
        description: 'Pallets tracked on the WMS floor — which item and how many boxes are on each, and where it is standing.'
        response:
          type: object
        params:
        - name: warehouseId
          type: string
          description: '(UUID)'
        - name: locationId
          type: string
          description: 'From the bundle''s listPage(); pass only ids observed in wms-locations. (UUID)'
        - name: limit
          type: integer
        - name: offset
          type: integer
      wms-templates:
        method: GET
        path: /wms/templates/
        description: 'Saved warehouse-grid layout templates used by the WMS designer screen.'
        response:
          type: object
        params:
        - name: limit
          type: integer
        - name: offset
          type: integer
      wms-warehouses:
        method: GET
        path: /wms/warehouses/
        description: 'Physical WMS warehouses — the rack-grid definitions (rows x columns x levels) the floor app maps pallets onto. Different thing from the SAP warehouse master.'
        response:
          type: object
        params:
        - name: limit
          type: integer
          description: 'Switches the response to a {results,count} envelope — see pagination.'
        - name: offset
          type: integer
          description: 'Only meaningful together with limit.'
      wms-zones:
        method: GET
        path: /wms/zones/
        description: 'Named zones a warehouse grid is divided into.'
        response:
          type: object
        params:
        - name: warehouseId
          type: string
          description: '(UUID)'
        - name: limit
          type: integer
        - name: offset
          type: integer
      wms-get:
        method: GET
        path: /wms/{collection}/{id}/
        description: 'Fetch one WMS record by its UUID from any of the collections above. Required: collection, id.'
        response:
          type: object
        params:
        - name: collection
          type: string
          required: true
          description: 'Exact list read from the bundle''s collection constant. ''settings'' is deliberately excluded — see excluded_writes / gotchas. enum: warehouses | zones | cellPurposes | locations | materials | pallets | inventory | movements | templates'
        - name: id
          type: string
          required: true
          description: 'Only ever an id observed in the matching list response. (UUID, path)'
