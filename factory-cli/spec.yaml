        response:
          type: array
        params:
        - name: search
          type: string
          description: '*** SILENTLY IGNORED — DO NOT PUBLISH AS A FLAG. *** The SPA sends it. Verified: /visitors/ returns 197 rows and /visitors/?search=Yogesh returns the same 197 rows starting with the same row. Filter client-side.'
      entry:
