          required: true
          description: 'Mandatory. Omitting it returns HTTP 400 {"error":"Search query ''q'' is required"} — the {"error": ...} envelope style. Verified live with q=Yogesh -> 1 hit.'
      gate-person-inside:
        method: GET
        path: /person-gatein/entry/inside/
        description: 'Who is inside the plant right now — the live ''currently inside'' list security reads at shift handover.'
        response:
          type: array
      gates:
        method: GET
        path: /person-gatein/gates/
        description: 'The gate master — which physical gates people can be checked in and out through.'
        response:
          type: array
      labours:
        method: GET
        path: /person-gatein/labours/
        description: 'The contract-labour master — every registered labourer, their contractor, skill and work-permit expiry.'
        response:
          type: array
        params:
        - name: search
          type: string
          description: '*** SILENTLY IGNORED. *** Verified: ?search=ABC returned all 3 labours unchanged.'
        - name: contractor
          type: integer
          description: '*** SILENTLY IGNORED — DO NOT PUBLISH AS A FLAG. *** Verified: ?contractor=2 returned labours belonging to contractors 2 AND 3. To get one contractor''s gang, use /person-gatein/contractor/{id}/labours-status/ instead, or filter client-side on the `contractor` field. (Contractor PK)'
      gate-labour:
        method: GET
        path: /person-gatein/labours/{id}/
        description: 'One labourer''s master record — contractor, skill, permit validity and whether they are still active. Required: id.'
