  po:
    description: 'This corner of the factory app answers one question: can we actually build what SAP says we are going to build, and what do we have to buy to close the gap. The "SAP Material Plan" screen (web route /'
    endpoints:
      open-pos:
        method: GET
        path: /po/open-pos/
        description: 'Open (not fully received) SAP purchase orders for one supplier, with every line''s ordered / received / remaining quantity and rate. Required: supplier_code.'
        response:
          type: object
        params:
        - name: supplier_code
          type: string
          required: true
          description: 'REQUIRED. Without it: HTTP 400 {"detail":"supplier_code is required"} on all three companies. SAP vendor code, e.g. VENDA000933 — get valid codes from `po vendors`. There is NO way to list all open POs across suppliers; the vendor is mandatory.'
      open-po-items:
        method: GET
        path: /po/open-pos/{po_number}/items/
        description: 'Look up ONE open purchase order by its PO number and return its header plus every line''s remaining quantity — what the gate uses to confirm an arriving truck''s PO. Required: po_number.'
        response:
          type: object
        params:
        - name: po_number
          type: string
          required: true
          description: 'PATH parameter and URL-encoded by the app. This is the human PO number (e.g. 220726110), NOT the doc_entry field also present in the payload. The UI demands the complete number — there is no partial/prefix search.'
      vendors:
        method: GET
        path: /po/vendors/
        description: 'SAP vendor master for the selected company — code and name only, used to pick a supplier before looking up open POs.'
        response:
          type: array
      warehouses:
        method: GET
        path: /po/warehouses/
        description: 'SAP warehouse codes and names for the selected company — the source of valid --warehouse values elsewhere in this domain.'
        response:
          type: array
  production-execution:
    description: 'This is the factory''s shop-floor execution system (MES) for the Bhakharpur plant — it is where a production run is born, tracked minute by minute, and costed. An operator sets up master data once (lin'
    endpoints:
      breakdown-categories:
        method: GET
        path: /production-execution/breakdown-categories/
        description: 'List the reason categories a line stoppage can be booked to (Machine, PM Short, RM Short, Labour, Other).'
        response:
          type: array
      checklist-templates:
        method: GET
        path: /production-execution/checklist-templates/
