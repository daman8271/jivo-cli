      bst-out-by-vehicle-entry:
        method: GET
        path: '/gate-core/bst-outs/by-vehicle-entry/{vehicle_entry_id}/'
        description: 'Resolves a gate vehicle entry to its active BST-out. Returns HTTP 404 {"detail":"Active BST out entry not found"} when there is none - the handler''s own answer, not a routing error.'
        response:
          type: object
        params:
        - name: vehicle_entry_id
          type: string
          description: 'Vehicle entry id from `vehicle-management vehicle-entries`'
          required: true
      job-work-by-vehicle-entry:
        method: GET
        path: '/gate-core/job-work/by-vehicle-entry/{vehicle_entry_id}/'
        description: 'Resolves a gate vehicle entry to its active job-work entry. Returns HTTP 404 {"detail":"Active job work entry not found"} when there is none - the handler''s own answer, not a routing error.'
        response:
          type: object
        params:
        - name: vehicle_entry_id
          type: string
          description: 'Vehicle entry id from `vehicle-management vehicle-entries`'
          required: true
      bst-in-by-vehicle-entry:
        method: GET
        path: '/gate-core/bst-ins/by-vehicle-entry/{vehicle_entry_id}/'
        description: 'Returns the handler''s own JSON 404 {"detail":"Active BST in entry not found"} when there is none - the view answering, not a routing error.'
        response:
          type: object
        params:
        - name: vehicle_entry_id
          type: string
          description: 'Vehicle entry id from `vehicle-management vehicle-entries`'
          required: true
      bst-return-by-vehicle-entry:
        method: GET
        path: '/gate-core/bst-returns/by-vehicle-entry/{vehicle_entry_id}/'
        description: 'Returns the handler''s own JSON 404 {"detail":"Active BST return entry not found"} when there is none.'
        response:
          type: object
        params:
        - name: vehicle_entry_id
          type: string
          description: 'Vehicle entry id from `vehicle-management vehicle-entries`'
          required: true

  goods-return:
    description: 'Goods Return handles stock coming BACK from customers into the plant. Someone raises a return entry against the paperwork the customer is returning on (an invoice, a debit note, or plain letter-pad), lists the items and their condition, records the vehicle and when it is expected, and submits it. The gate then marks the vehicle in when it actually shows up, and the warehouse confirms receipt into one of a handful of dedicated goods-return warehouses (BH-GR, DL-GR, PB-RG…) — which is the step that posts the return into SAP. Larger returns need an approval before that happens. The whole module is brand new and absent from the shipped CLI; at probe time it was live and routed in all three companies but had no entries in any of them yet, so only the warehouse picklist returned rows.'
    endpoints:
      gate-expected:
        method: GET
        path: /goods-return/gate/expected/
        description: 'Customer return vehicles the gate is still waiting for — the arrivals list a guard works from, showing the customer, driver, vehicle number and expected time, before marking each vehicle in.'
        response:
          type: array
      list:
        method: GET
        path: /goods-return/
        description: 'Customer goods returns coming back to the plant — one row per return entry: which customer, what paperwork it is returning against, the vehicle, how many item lines, when it is expected, and how far it has got (draft, awaiting arrival, arrived, posted, cancelled).'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'Keep only entries at one stage. Exact values: DRAFT, AWAITING_ARRIVAL, ARRIVED, POSTED, CANCELLED. Omit for all.'
        - name: approval
          type: string
          description: 'Set to PENDING to see only returns waiting for someone to approve them. This is the approvals queue.'
        - name: all_companies
          type: boolean
          description: 'Look across Oil, Mart and Beverages at once instead of just the company you are signed in to.'
      warehouses:
        method: GET
        path: /goods-return/warehouses/
        description: 'The warehouses a customer return is allowed to be booked into when it is received — code and name only, e.g. DL-GR / Mayapuri GR. This is the picklist behind the ''Confirm Receipt'' step.'
        response:
          type: array
  grpo:
    description: 'GRPO = "Goods Receipt PO" — the step where material that has physically arrived at a JIVO plant gets booked into SAP as a purchase receipt. It has two completely separate halves that share the /grpo/'
    endpoints:
      all-entries:
        method: GET
        path: /grpo/all-entries/
        description: 'Every raw-material gate entry visible to GRPO — including trucks still at the gate or sitting with QC — with supplier, PO numbers and per-item accepted/rejected quantity.'
        response:
          type: object
        params:
        - name: phase
          type: string
          description: 'enum GATE | QC | DONE | CANCELLED (from the server docstring; UI exposes ALL/GATE/QC/DONE). Omit for all phases. Filters `results` only — the `counts` block always reflects the unfiltered month scope.'
        - name: year
          type: integer
          description: 'e.g. 2026. UI pairs it with month; omitting BOTH returns all-time (verified: 573 unfiltered vs 142 for 2026-07 on OIL). int'
        - name: month
          type: integer
          description: '1-12 int'
        - name: search
          type: string
          description: 'free text over entry no / supplier / PO / status (UI placeholder ''Search entry, supplier, PO, status…''); verified: search=GE-2026-9760 returns exactly 1'
        - name: page
          type: integer
          description: '1-based int'
        - name: page_size
          type: integer
          description: 'UI default 25; server HARD-CAPS at 100 — asking 500 returns 100 int'
      fg-all-entries:
        method: GET
        path: /grpo/fg/all-entries/
        description: 'Every finished-goods gate entry on the GRPO board — bought-in finished product still at the gate, with QC, or cleared — the finished-goods twin of the material GRPO board.'
        response:
          type: object
        params:
        - name: phase
          type: string
          description: 'INFERRED, not exercised: GATE | QC | DONE, by symmetry with /grpo/all-entries/ and because the response carries the same counts block {ALL, GATE, QC, DONE}.'
        - name: search
          type: string
          description: 'INFERRED, not exercised: free text over entry / supplier / PO (the sibling /grpo/fg/pending/ takes `search` at the app''s own call site).'
        - name: page
          type: integer
          description: '1-based; the response envelope carries page/total_pages/next/previous.'
        - name: page_size
          type: integer
          description: 'Server default 25 observed. Cap not tested here; the material siblings cap at 100.'
      fg-history:
        method: GET
        path: /grpo/fg/history/
        description: 'Log of finished-goods GRPO posting attempts to SAP — the finished-goods twin of the material posting log — currently holding no rows in any company.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'INFERRED, not exercised: DRAFT | PENDING | POSTED | FAILED | PARTIALLY_POSTED, the shared GRPO status constant used by /grpo/history/.'
        - name: search
          type: string
          description: 'INFERRED, not exercised, by symmetry with /grpo/history/.'
        - name: page
          type: integer
          description: '1-based; envelope carries page/total_pages/next/previous.'
        - name: page_size
          type: integer
          description: 'Server default 25 observed.'
      fg-pending:
        method: GET
        path: /grpo/fg/pending/
        description: 'The finished-goods posting queue — completed finished-goods gate entries waiting to be booked into SAP as a goods receipt against their purchase order.'
        response:
          type: object
        params:
        - name: search
          type: string
          description: 'Free text over entry / supplier / PO — passed by the app''s own Finished Goods GRPO screen (placeholder ''Search entry / supplier / PO…''), debounced 300 ms.'
        - name: page
          type: integer
          description: '1-based; envelope carries page/total_pages/next/previous.'
        - name: page_size
          type: integer
          description: 'Server default 25 observed.'
      fg-summary:
        method: GET
        path: /grpo/fg/summary/
        description: 'Finished-goods GRPO dashboard totals for one company — entries and POs waiting to be posted, a QC accepted/rejected quantity, and posted / failed / partially-posted posting counts.'
        response:
          type: object
      history:
        method: GET
        path: /grpo/history/
        description: 'Log of every material GRPO posting ATTEMPT — posted, failed or saved-as-draft — with the SAP document number or the verbatim SAP error.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'enum DRAFT | PENDING | POSTED | FAILED | PARTIALLY_POSTED (from status.constants-BWw2RNtv.js; all five verified live on OIL: 0/0/208/19/0)'
        - name: vehicle_entry_id
          type: integer
          description: 'documented in the server''s own OPTIONS docstring: ''GET /api/grpo/history/?vehicle_entry_id=123''; verified returns just that entry''s attempts int'
        - name: year
          type: integer
          description: 'omit year+month for all-time (227 vs 62 for 2026-07 on OIL) int'
        - name: month
          type: integer
          description: '1-12 int'
        - name: search
          type: string
          description: 'free text over entry / PO / SAP doc no / status; verified'
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'capped at 100 int'
      history-detail:
        method: GET
        path: /grpo/{posting_id}/
        description: 'One material GRPO posting attempt in full — the PO lines and quantities that were sent, the SAP document it became or the SAP error it hit, who posted it and when, and its attachments.'
        response:
          type: object
      inspection-report:
        method: GET
        path: /grpo/inspection-report/{arrival_slip_id}/
        description: 'The full QC inspection report behind a receipt — chemist and QA-manager decisions, parameter results, accept/reject verdict and its attachments. Required: arrival_slip_id.'
        response:
          type: object
        params:
        - name: arrival_slip_id
          type: integer
          required: true
          description: 'path segment; the `arrival_slip_id` on an item inside /grpo/all-entries/ or /grpo/preview/. NOT the inspection id and NOT the vehicle entry id. int'
      pending:
        method: GET
        path: /grpo/pending/
        description: 'Gate entries that have cleared QC and are waiting to be posted to SAP — the actual GRPO work queue, grouped by supplier so several POs can be merged into one receipt.'
        response:
          type: object
        params:
        - name: year
          type: integer
          description: 'omit year+month for all-time (327 vs 97 for 2026-07 on OIL) int'
        - name: month
          type: integer
          description: '1-12 int'
        - name: search
          type: string
          description: 'verified: search=<entry_no> narrows to 1'
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'capped at 100 int'
      preview:
        method: GET
        path: /grpo/preview/{vehicle_entry_id}/
        description: 'Everything needed to post a gate entry to SAP — PO lines, QC status, accepted quantity, price, tax code, warehouse and GL account — read-only, before anyone posts. Required: vehicle_entry_id.'
        response:
          type: object
        params:
        - name: vehicle_entry_id
          type: integer
          required: true
          description: 'path segment; the `vehicle_entry_id` from /grpo/pending/ or /grpo/all-entries/ (NOT a posting id) int'
      service-history:
        method: GET
        path: /grpo/service/history/
        description: 'Log of transport-freight (bilty) GRPO postings to SAP — which bilty was booked against which transporter for how much, its SAP document number, and the cost allocation it was booked under: SAC code, location, branch delivery point, sub-account, product variety and litres carried.'
        response:
          type: object
        params:
        - name: status
          type: string
          description: 'enum DRAFT | PENDING | POSTED | FAILED | PARTIALLY_POSTED (same GRPO status constant; the Service History UI exposes only Pending/Posted/Failed)'
        - name: dispatch_plan_id
          type: integer
          description: 'documented in the server''s OPTIONS docstring: ''GET /api/grpo/service/history/?dispatch_plan_id=123''; verified live int'
        - name: year
          type: integer
          description: 'by POSTING date. Does NOT default to the current month (verified: no params = 35 all-time on OIL, year=2026&month=6 = 32) — the opposite of service-pending. int'
        - name: month
          type: integer
          description: '1-12 int'
        - name: search
          type: string
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'capped at 100 int'
      service-history-detail:
        method: GET
        path: /grpo/service/{posting_id}/
        description: 'One freight (bilty) GRPO posting in full — the transporter and bilty booked, the amount and cost allocation, the SAP document number or SAP error, and the attached bilty/invoice documents.'
        response:
          type: object
      service-options:
        method: GET
        path: /grpo/service/options/
        description: 'The SAP master lists a freight booking has to pick from — branches, tax codes, GL accounts, SAC codes, locations, varieties, projects, sub-accounts and expense codes.'
        response:
          type: object
      service-pending:
        method: GET
        path: /grpo/service/pending/
        description: 'The freight-booking backlog — dispatch plans whose transporter bilty has not yet been booked into SAP as a service purchase, including vehicles that have not left the plant yet.'
        response:
          type: object
        params:
        - name: year
          type: integer
          description: 'CRITICAL: unlike every other list here, this one DEFAULTS TO THE CURRENT MONTH. Verified on JIVO_OIL 2026-08-03: no params = 12 rows, year=2026&month=7 = 157 rows. int'
        - name: month
          type: integer
          description: '1-12 int'
        - name: search
          type: string
          description: 'server docstring: ''search over bill no / bilty / vehicle / driver / transporter / entry'''
        - name: page
          type: integer
          description: 'int'
        - name: page_size
          type: integer
          description: 'capped at 100 int'
      summary:
        method: GET
        path: /grpo/summary/
        description: 'Material GRPO dashboard totals for one company — how many gate entries and POs are waiting to be posted, the posted / failed / partially-posted attempt counts, and a QC accepted/rejected quantity that is a raw sum across mixed units (pieces, kg, MT) and is therefore not a tonnage.'
        response:
          type: object
      attachments:
        method: GET
        path: /grpo/{posting_id}/attachments/
        description: 'Documents attached to a material GRPO posting (supplier invoice, weighment slip) and whether each one made it into SAP. Required: posting_id.'
        response:
          type: object
        params:
        - name: posting_id
          type: integer
          required: true
          description: 'path segment; the `id` of a /grpo/history/ row int'
      fg-preview:
        method: GET
        path: '/grpo/fg/preview/{vehicle_entry_id}/'
        description: 'TRAP: keyed on VEHICLE_ENTRY_ID, not on a GRPO id - the app''s route names the segment :vehicleEntryId. Distinct from the shipped `grpo preview`, which covers raw material.'
        response:
          type: object
        params:
        - name: vehicle_entry_id
          type: string
          description: 'Vehicle entry id from `vehicle-management vehicle-entries`'
          required: true

  labour-count:
    description: 'This domain covers how JIVO''s factory counts contract ("casual") labour on and off the site each day. Two separate Django apps live here and they solve the same problem twice. `labour_gate` (paths und'
    endpoints:
      gate-board:
        method: GET
        path: /labour-count/gate/board/
        description: 'The gate''s verification board for a shift — every submitted/verified department sheet with its headcount, how many have been marked out and the variance. Required: work_date, shift.'
        response:
          type: object
        params:
        - name: work_date
          type: string
          required: true
          description: 'Required. Sending work_date alone still returns 400 — shift is required too. (YYYY-MM-DD)'
        - name: shift
          type: string
          required: true
          description: 'Required and validated. Missing/invalid gives HTTP 400 {"detail":"work_date and a valid shift are required."} — verified live. Only DAY and NIGHT are observed in the UI; do not probe other values. enum: DAY | NIGHT'
        - name: department
          type: integer
          description: 'Department id filter. Verified live.'
        - name: contractor
          type: integer
          description: 'Contractor id filter (matches a contractor appearing in the sheet''s items). Verified live.'
      sheet-history:
        method: GET
        path: /labour-count/sheet/history/
        description: 'List of daily labour-count sheets a department filed — date, shift, headcount, workflow status and gate variance.'
        response:
          type: object
        params:
        - name: department
          type: integer
          description: 'Department id. Verified live (department=1 narrowed 3 sheets to 1).'
        - name: shift
          type: string
          description: 'Uppercase, exactly these two values (from the UI shift toggle). Verified live with NIGHT. enum: DAY | NIGHT'
        - name: from
          type: string
          description: 'Inclusive lower bound on work_date. Verified live. (YYYY-MM-DD)'
        - name: to
          type: string
          description: 'Inclusive upper bound on work_date. Verified live. (YYYY-MM-DD)'
  labour-gate:
    description: 'This domain covers how JIVO''s factory counts contract ("casual") labour on and off the site each day. Two separate Django apps live here and they solve the same problem twice. `labour_gate` (paths und'
    endpoints:
      gate-day:
        method: GET
        path: /labour-gate/
        description: 'Every contractor''s labour in/out tally at the gate for one date — how many came in, how many have left, how many are still inside. Required: date.'
        response:
          type: object
        params:
        - name: date
          type: string
          required: true
          description: 'Hard requirement. Omitting it returns HTTP 400 {"detail":"A valid ?date=YYYY-MM-DD is required."} — verified live. (YYYY-MM-DD)'
      gate-entry-audit:
        method: GET
        path: /labour-gate/{id}/audit/
        description: 'Full who/what/when audit trail for one gate labour entry — every in, edit, mark-out, undo, delete and restore. Required: id.'
        response:
          type: object
        params:
        - name: id
          type: integer
          required: true
          description: 'A LabourGateEntry id. Get it from the `id` field of `gate-day`; do not guess one — ids are per-company and a foreign id returns 404. (path)'
  maintenance:
    description: 'The `/maintenance/` group is the factory''s plant-engineering system — everything that keeps machines running and the site safe. It covers six workflows that share one asset register: (1) **Assets** —'
    endpoints:
      alerts:
        method: GET
        path: /maintenance/alerts/
        description: 'Live maintenance alert feed — PM due, breakdown escalation, low critical spare, AMC/warranty expiry.'
        response:
          type: object
      asset-categories:
        method: GET
        path: /maintenance/asset-categories/
        description: 'Asset category master (e.g. ''Filling machines''), with how many assets sit in each.'
        response:
          type: array
        params:
        - name: is_active
          type: boolean
          description: 'bool'
      asset-departments:
        method: GET
        path: /maintenance/asset-departments/
        description: 'Maintenance''s own department master (separate from the HR/org department list), with asset counts.'
        response:
