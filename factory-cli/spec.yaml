          type: array
        params:
        - name: status
          type: string
          description: 'PENDING | APPROVED | REJECTED; omit the param entirely for ''All''. The app''s default tab is PENDING and a red badge counts pending ones. enum'
      scan-skip-requests:
        method: GET
        path: /docking-admin/scan-skip-requests/
        description: 'Requests from the dock to dispatch a vehicle WITHOUT barcode scanning (old barcodes, loose cartons, drums), and whether a supervisor approved them.'
        response:
          type: array
        params:
        - name: status
          type: string
          description: 'PENDING | APPROVED | REJECTED. The UI''s ''All'' tab sends NO param — do not send status=ALL. Default view in the app is PENDING. Verified live: status=PENDING on JIVO_OIL returned []. enum'
  driver-management:
    description: 'This is the factory''s transport master file plus the gate''s vehicle-entry log. Three master lists sit under it — Vehicles (registration number, type, capacity, owning transporter), Transporters (conta'
    endpoints:
      drivers:
        method: GET
        path: /driver-management/drivers/
        description: 'All drivers on file — mobile, driving licence, ID proof and photo.'
        response:
          type: array
      drivers-names:
        method: GET
        path: /driver-management/drivers/names/
        description: 'Slim id + name list of drivers, for pickers.'
