        description: 'All transport companies on file, with contact person, mobile and GSTIN.'
        response:
          type: array
      transporters-names:
        method: GET
        path: /vehicle-management/transporters/names/
        description: 'Slim id + name list of transporters, for pickers.'
        response:
          type: array
      vehicle-entries:
        method: GET
        path: /vehicle-management/vehicle-entries/
        description: 'The gate log: every vehicle that entered the plant for one movement type in a date window, with vehicle, driver, status and supplier. Required: entry_type, from_date, to_date.'
        response:
          type: object
        params:
        - name: entry_type
          type: string
          required: true
          description: 'EXACTLY ONE value per call. Live-accepted: RAW_MATERIAL, SALES_DISPATCH, DAILY_NEED, MAINTENANCE, CONSTRUCTION, FIXED_ASSET, JOB_WORK, EMPTY_VEHICLE. Omitting it returns 400 {"detail":"entry_type query parameter is required"} enum'
        - name: from_date
          type: string
          required: true
          description: 'inclusive; omitting returns 400 {"detail":"from_date query parameter is required"} date YYYY-MM-DD'
        - name: to_date
          type: string
          required: true
          description: 'inclusive; omitting returns 400 {"detail":"to_date query parameter is required"} date YYYY-MM-DD'
      vehicle-entries-count:
        method: GET
        path: /vehicle-management/vehicle-entries/count/
        description: 'How many gate entries of one movement type sit in each status over a date window — the ''how many trucks are still waiting on QC'' number. Required: entry_type, from_date, to_date.'
        response:
          type: object
        params:
        - name: entry_type
          type: string
          required: true
          description: 'same 8 values; required, 400 {"detail":"entry_type query parameter is required"} if missing enum'
        - name: from_date
          type: string
          required: true
          description: 'required date YYYY-MM-DD'
        - name: to_date
          type: string
          required: true
          description: 'required date YYYY-MM-DD'
      vehicle-entries-list-by-status:
        method: GET
        path: /vehicle-management/vehicle-entries/list-by-status/
