      sales-dispatch-gatepass-prints:
        method: GET
        path: /gate-core/sales-dispatch/{id}/gatepass/prints/
        description: 'Print history for a dispatch''s gatepass — who printed which copy, when, and any reprint reason. Required: id.'
        response:
          type: object
        params:
