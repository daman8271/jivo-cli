/* ══ 4. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** A titled card with an optional provenance line on the right. */
function card(id, title, src) {
  const c = h('<section class="card"' + (id ? ' id="' + esc(id) + '"' : '') + '></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + esc(src) + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** A sub-heading inside a card. Global `h3` has margin 0, so it carries its own. */
function sub(id, text) {
  return h('<h3 id="' + esc(id) + '" style="margin:22px 0 8px;font-size:14.5px;' +
    'color:var(--sage)">' + esc(text) + '</h3>');
}

/** A block of prose. Text is escaped; `C-00xx` inside it becomes a link. */
function prose(html) { return h('<div class="prose">' + html + '</div>'); }

/** One escaped paragraph, with correction codes linked. */
function p(text) { return '<p>' + codes(esc(text)) + '</p>'; }

/** Turn `C-0019` inside already-escaped prose into a link to its anchor. */
function codes(escaped) {
  return String(escaped).replace(/\bC-\d{4}\b/g, function (code) {
    return BY_ID[code]
      ? '<a class="cvcode" href="#' + code + '">' + code + '</a>'
      : code;
  });
}

/** A `C-0019` chip that links to this page's anchor for it. */
function cv(code) {
  return '<a class="cvcode" href="#' + esc(code) + '">' + esc(code) + '</a>';
}

/** A monospace equation block. Already-escaped HTML in, styled box out. */
function formula(lines) {
  return h('<div class="formula">' + lines.map(esc).join('<br>') + '</div>');
}

/** The one-line caption under a chart or a table. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }


/** Manifest KPI value, accepting both `{value}` and the short `{v}` shape. */
function kpi(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  if (!k) return null;
  const v = (k.value !== undefined) ? k.value : k.v;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/** The whole KPI record, for its label and its check. */
function kpiRec(m, co, id) {
  return (m && m.kpis && m.kpis[co]) ? (m.kpis[co][id] || null) : null;
}

/* ── 5.3 why a naive ageing is wrong ─────────────────────────────────────── */

  c.appendChild(prose(
    p('SAP shows ₹180.69 Cr of open customer invoices in the Oil book. That is not what ' +
      'customers owe.') +
    p('₹71.83 Cr of it is money already banked, or credit notes already raised, that was ' +
      'never matched against the individual invoice — so the invoice still reads ' +
      'DocStatus = ‘O’ long after the cash arrived. Another ₹101 Cr is JIVO’s own ' +
      'branch, intercompany and staff accounts, which are not trade at all. The real ' +
      'external trade receivable is ₹7.43 Cr.') +
    p('The same failure runs on the payables side: bills get settled by manual journal ' +
      'entries and on-account vendor payments that were never internally reconciled, so ' +
      'OPCH.DocStatus stays open too. OCRD.Balance is the ground truth for what a party ' +
      'actually owes or is owed, not the document status (C-0019).')
  ));

  c.appendChild(waterfall([
    { label: 'What SAP calls open', value: WORKED.rawOpen, kind: 'base' },
    { label: 'Banked or credited, never matched', value: WORKED.unmatched, kind: 'sub' },
    { label: 'Credit-adjusted receivable', value: WORKED.adjusted, kind: 'total' },
    { label: 'JIVO’s own accounts', value: WORKED.ownAccounts, kind: 'sub' },
    { label: 'Real external trade receivable', value: WORKED.trade, kind: 'total' }
  ], {
    title: 'Oil customer book, ' + WORKED.measured + ' — ₹180.69 Cr of “open” invoices taken apart',
    unit: 'INR',
    table: true,
    tableNote: 'Quoted from ' + WORKED.source + '. The README rounds the third step to ' +
               '“another ₹101 Cr”; the exact arithmetic between ₹108.86 Cr and ₹7.43 Cr is ' +
               '₹101.43 Cr, and the chart draws the arithmetic.'
  }));
  c.appendChild(cap(
    'Read top to bottom. Each bar starts where the one above it ended, so the two ' +
    'grey checkpoint rows are running balances, not new figures. “JIVO’s own accounts” ' +
    'is the branch, intercompany and staff cards together. ' +
    'Source: ' + esc(WORKED.source) + ', measured ' + esc(WORKED.measured) + ' on ' +
    esc(WORKED.book) + '. It is a worked example with a date on it, not a live figure — ' +
    'this build’s equivalent is directly below.'
  ));

  c.appendChild(sub('naive-ageing-live', 'The same steps in this build'));
  c.appendChild(panelLiveLadder(m, co, ca));

  c.appendChild(sub('naive-ageing-scale', 'How big the distortion is, per book'));
  c.appendChild(prose(
    p('“Roughly 3×” is the whole-book figure, and it is an average of six very different ' +
      'numbers. C-0019 measured all six live on 2026-08-21 — open documents against ' +
      'ledger balances, both sides, all three books.')
  ));
  const c19 = C19_TABLE.map(function (r) {
    return {
      BOOK: r.BOOK, SIDE: r.SIDE,
      OPEN_DOCS_CR: r.OPEN_DOCS_CR,
      LEDGER_CR: r.LEDGER_CR,
      TIMES: (r.OPEN_DOCS_CR / r.LEDGER_CR).toFixed(2) + '×'
    };
  });
  c.appendChild(table(c19, {
    labels: {
      BOOK: 'Book', SIDE: 'Side',
      OPEN_DOCS_CR: 'SAP says open', LEDGER_CR: 'The ledger says', TIMES: 'Overstated by'
    },
    units: { BOOK: 'text', SIDE: 'text', OPEN_DOCS_CR: 'INR', LEDGER_CR: 'INR', TIMES: 'text' },
    page: false,
    caption: 'Open documents against ledger balances, per book and side',
    note: 'Quoted from correction C-0019, measured 2026-08-21. Both money columns are named ' +
          '_CR and are therefore in crores; the last column is a ratio this page computes ' +
          'from the two beside it, not a figure C-0019 states.'
  }));
  c.appendChild(prose(
    p('Worst is Mart payables at 7.5×; mildest is Beverages receivables at 1.3×, which is ' +
      'C-0019’s own summary of its own numbers. The README’s “roughly 3×” sits in the middle ' +
      'of that range — it is a whole-book figure, not a figure for any one book or side, and ' +
      'quoting it as though it applied everywhere understates Mart badly. On a single trade ' +
      'headline the distortion is larger still, because the group cards come out as well as ' +
      'the unmatched credit.') +
    p('So the method every ageing on this board uses is: take the party ledger balance as ' +
      'the real exposure, derive the unapplied credit as the sum of open documents minus ' +
      'that balance, consume it oldest-due-first, and bucket only what is left. Branch and ' +
      'intercompany accounts are flagged and kept, never silently dropped and never ' +
      'silently counted as trade.') +
    p('Two honest weaknesses in that method, stated because they change how you read a ' +
      'bucket chart. Oldest-due-first is an assumption: the ledger proves the total credit, ' +
      'but which bills it settled is inferred, so where a genuinely unpaid old bill sits ' +
      'behind newer settled ones the bucket split shifts newer than reality. And the total ' +
      'is right in every case — it is only the split across buckets that carries the ' +
      'assumption.')
  ));
  return c;
}

/** The live ladder for the current book, from the customer-ageing summary. */
function panelLiveLadder(m, co, ca) {
  const rows = (ca && Array.isArray(ca.summary)) ? ca.summary : [];
  const by = {};
  rows.forEach(function (r) { if (r && r.KIND) by[String(r.KIND)] = r; });
  const tot = by.ZZ_TOTAL, trade = by.TRADE;

  if (!tot || !trade) {
    return empty({
      what: 'The live version of this ladder could not be built for ' + companyLabel(co) + '.',
      why: 'It is read from the customer-ageing summary rows KIND = ZZ_TOTAL and KIND = TRADE, ' +
           'and this build did not publish both of them for this book. The worked example ' +
           'above is unaffected — it is quoted from ' + WORKED.source + ', not computed here.',
      href: hrefSection('customer-ageing', co),
      hrefLabel: 'Open the receivables section'
    });
  }

  const nonTradeRows = ['BRANCH', 'INTERCO', 'STAFF'].filter(function (k) { return by[k]; });
  const nonTrade = nonTradeRows.reduce(function (a, k) {
    return a + Number(scale(by[k].EFF_OPEN_INR, 'EFF_OPEN_INR') || 0);
  }, 0);

  const raw = Number(scale(tot.RAW_OPEN_INR, 'RAW_OPEN_INR'));
  const unmatched = Number(scale(tot.UNAPPLIED_CREDIT_INR, 'UNAPPLIED_CREDIT_INR'));
  const adjusted = Number(scale(tot.EFF_OPEN_INR, 'EFF_OPEN_INR'));
  const tradeEff = Number(scale(trade.EFF_OPEN_INR, 'EFF_OPEN_INR'));

  const host = document.createElement('div');
  const ladder = [
    ['What SAP calls open, whole customer book', raw, 'RAW_OPEN_INR on the ZZ_TOTAL row', null],
    ['Less: banked or credited, never matched', -unmatched, 'UNAPPLIED_CREDIT_INR on the ZZ_TOTAL row', null],
    ['Credit-adjusted receivable', adjusted, 'EFF_OPEN_INR on the ZZ_TOTAL row', 'ar-book-open-total'],
    ['Less: JIVO’s own accounts (' + nonTradeRows.join(' + ') + ')', -nonTrade,
      'EFF_OPEN_INR summed over ' + nonTradeRows.length + ' non-trade rows', 'ar-nontrade-open'],
    ['Real external trade receivable', tradeEff, 'EFF_OPEN_INR on the TRADE row', 'ar-trade-open']
  ];

  const tbl = h('<table class="terms"></table>');
  const tb = document.createElement('tbody');
  ladder.forEach(function (row, i) {
    const isTotal = (i === 2 || i === 4);
    const tr = document.createElement('tr');
    tr.className = isTotal ? 'is-total' : '';
    const link = row[3]
      ? '<a href="' + esc(hrefDerivation(row[3], co)) + '">' + esc(row[3]) + '</a>'
      : '<span class="faint">summary row</span>';
    tr.innerHTML =
      '<td class="lab">' + esc(row[0]) +
        '<span class="why">' + esc(row[2]) + '</span></td>' +
      '<td class="amt' + (row[1] < 0 ? ' neg' : '') + '">' + esc(inr(row[1])) + '</td>' +
      '<td class="src">' + link + '</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  const scroller = h('<div class="tablewrap is-open" style="overflow-x:auto;max-width:100%"></div>');
  scroller.appendChild(tbl);
  host.appendChild(scroller);

  const share = kpi(m, co, 'ar-sap-overstatement-share');
  host.appendChild(cap(
    'Live from data/customer-ageing.' + esc(co) + '.json, ' + esc(companyLabel(co)) +
    ', position ' + esc((ca && ca.as_of) || (m && m.as_of) || 'unknown') + '. ' +
    (share === null
      ? 'The published overstatement share is not computed for this book.'
      : 'On this book ' + esc(share.toFixed(2)) + '% of what SAP calls open A/R is not ' +
        'really owed (KPI <a href="' + esc(hrefDerivation('ar-sap-overstatement-share', co)) +
        '">ar-sap-overstatement-share</a>).') +
    ' Switch the company in the masthead to see another book.'
  ));
  return host;
}

/** One correction, with the anchor every other page links to. */
function correctionCard(r) {
  const c = h('<section class="card" id="' + esc(r.id) + '"></section>');

  const supersededBy = SUPERSEDED_BY[r.id];
  const chips = [];
  chips.push('<span class="pill ' + (r.status === 'active' ? 'ok' : 'dead') + '">' +
    esc(r.status || 'unknown') + '</span>');
  if (r.severity) {
    chips.push('<span class="pill ' + (r.severity === 'high' ? 'bad' : 'warn') + '">' +
      esc(r.severity) + '</span>');
  }
  if (r.area) chips.push('<span class="pill info">' + esc(r.area) + '</span>');

  c.appendChild(h(
    '<div class="card-head">' +
      '<h2><span class="cvcode">' + esc(r.id) + '</span> ' + esc(r.title) + '</h2>' +
      '<div class="src">' + esc(r.date) + ' · ' + esc(r.author || 'author not recorded') + '</div>' +
    '</div>'
  ));
  c.appendChild(h('<div class="toolbar">' + chips.join(' ') + '</div>'));

  /* the rule — the only part that reaches every session, so it leads */
  c.appendChild(h('<div class="excl"><h3>The rule</h3><div>' + codes(esc(r.rule)) + '</div></div>'));

  /* wrong / right, side by side above 820px, stacked on a phone */
  const split = h('<div class="split"></div>');
  split.appendChild(h(
    '<div class="caveat"><div style="font-size:12px;font-weight:700;letter-spacing:.04em;' +
    'text-transform:uppercase;margin-bottom:6px">What was got wrong</div><div>' +
    codes(esc(r.wrong)) + '</div></div>'
  ));
  split.appendChild(h(
    '<div class="excl"><h3>What is actually true</h3><div>' + codes(esc(r.right)) + '</div></div>'
  ));
  c.appendChild(split);

  /* evidence — long, technical, and folded away by default */
  if (r.evidence) {
    const d = h('<details></details>');
    d.appendChild(h('<summary>Evidence — the query or measurement behind it</summary>'));
    // .sqlbox code is `white-space:pre; width:max-content` because it normally
    // holds numbered SQL. Half of these evidence blocks are prose, and prose
    // that needs 4,000px of horizontal scrolling is unreadable — so wrap.
    d.appendChild(h('<div class="sqlbox"><pre><code style="white-space:pre-wrap;' +
      'width:auto;overflow-wrap:anywhere">' + esc(r.evidence) + '</code></pre></div>'));
    c.appendChild(d);
  }

  const meta = [];
  if (r.supersedes) meta.push('Supersedes ' + cv(r.supersedes.trim()) + '.');
  if (supersededBy) {
    meta.push('Superseded by ' + cv(supersededBy) +
      ' — read that one for the current rule; this record explains why it exists.');
  }
  const tags = String(r.tags || '').replace(/^\[|\]$/g, '').trim();
  if (tags) meta.push('Tags: ' + esc(tags) + '.');
  meta.push('Record: <code>harness/corrections/</code>, id <code>' + esc(r.id) + '</code>.');
  c.appendChild(h('<p class="tnote">' + meta.join(' ') + '</p>'));
  return c;
}

  Object.keys(kpis).forEach(function (book) {
    perCo[book] = { ok: 0, bad: 0, gap: 0 };
    Object.keys(kpis[book]).forEach(function (id) {
      const ch = kpis[book][id] ? kpis[book][id].check : null;
      if (!ch) { tally.none++; perCo[book].gap++; if (book === co && !example.gap) example.gap = id; return; }
      if (ch.ok === true) { tally.ok++; perCo[book].ok++; if (book === co && !example.ok) example.ok = id; }
      else if (ch.ok === false) { tally.bad++; perCo[book].bad++; if (book === co && !example.bad) example.bad = id; }
      else { tally.gap++; perCo[book].gap++; if (book === co && !example.gap) example.gap = id; }

function panelReadOnly() {
  const c = card('read-only', 'Read-only by construction',
    'CLAUDE.md RULE 0 · hana-sql');

  c.appendChild(prose(
    p('The pipeline behind this board issues no write of any kind to SAP. Not a document, ' +
      'not a master record, not a journal entry, not a draft. This is not a promise about ' +
      'intent — there is no write path to call.') +
    p('Every query goes through hana-sql, which layers its guard:')
  ));

  const layers = [
    { LAYER: 'Statement must start SELECT or WITH', WHAT: 'Anything else is refused before it is sent.' },
    { LAYER: 'Exactly one statement', WHAT: 'A “;” anywhere but as the final character is refused, so a read cannot smuggle a writing statement after it.' },
    { LAYER: '33 banned keywords, anywhere', WHAT: 'Refused anywhere in the masked token stream, not just in first position.' },
    { LAYER: 'HANA READ ONLY transaction', WHAT: 'Every statement runs inside one, and it is always rolled back. There is no Commit call in the package, and an AST test walks the source to keep it that way.' }
  ];
  c.appendChild(table(layers, {
    labels: { LAYER: 'Layer', WHAT: 'What it stops' },
    units: { LAYER: 'text', WHAT: 'text' },
    page: false,
    caption: 'The hana-sql read-only guard'
  }));

  c.appendChild(h('<div class="formula">' + BANNED.map(esc).join(' ') + '</div>'));
  c.appendChild(cap(
    'The thirty-three, verbatim from hana-sql/README.md. The list is curated, not ' +
    '“every keyword”: UPDATE anywhere also catches SELECT … FOR UPDATE, which takes real ' +
    'locks on production rows; INTO catches both SELECT … INTO and EXPORT … INTO; and ' +
    'NEXTVAL is a write dressed as a SELECT, since advancing a sequence changes persistent ' +
    'state that no rollback undoes.'
  ));

  c.appendChild(h('<div class="caveat"><b>How well the last layer is actually proven — ' +
    'read this before relying on it.</b><div style="margin-top:5px">' + esc(
      'hana-sql’s own README says so plainly: HANA accepts “set transaction read only” — ' +
      'BeginTx succeeds — but it resolves object names before applying the access mode, so a ' +
      'probe against a non-existent table returns the same error with or without it, and on ' +
      'HANA 2.00.059 SYS.M_TRANSACTIONS exposes no ACCESS_MODE column. There is no read-only ' +
      'way to confirm the mode took effect, and proving it any other way would mean sending a ' +
      'real write at a real table. The first three layers are load-bearing on their own; a ' +
      'dedicated SELECT-only HANA user is the only thing that would make this a ' +
      'database-enforced guarantee.'
    ) + '</div></div>'));

  c.appendChild(prose(
    p('The scope of that guarantee is this board and its pipeline. It is not a claim about ' +
      'the whole toolkit: the sapb1 command-line tool can write to SAP when an operator asks ' +
      'it to, under RULE 0, and that is a separate, deliberately-gated path. Nothing on this ' +
      'board reaches it.')
  ));
  return c;
}

/** Build an index of a party file by CardCode, preferring the row with a balance. */
function indexParties(list) {
  const idx = {};
  (list || []).forEach(function (r) {
    if (!r || !r.card) return;
    const prev = idx[r.card];
    if (!prev || (prev.balance === null || prev.balance === undefined)) idx[r.card] = r;
  });
  return idx;
}

/** Highlight the anchor the reader arrived at — this page is linked to by anchor. */
let _lit = null;
let _settle = null;
function litTarget() {
  let id = '';
  try { id = decodeURIComponent(String(window.location.hash || '').replace(/^#/, '')); }
  catch (e) { id = ''; }
  if (_settle) { clearInterval(_settle); _settle = null; }
  if (_lit) { _lit.style.boxShadow = ''; _lit = null; }
  const stale = document.getElementById('cvmiss');
  if (stale && stale.parentNode) stale.parentNode.removeChild(stale);
  if (!id) return;
  const t = document.getElementById(id);
  if (!t) { missingCode(id); return; }

  // A ring, not a flash: somebody followed a link to C-0019 out of a meeting and
  // needs to see WHICH record they landed on among twenty-three that look alike.
  t.style.boxShadow = '0 0 0 2px var(--brand)';
  _lit = t;

  const go = function () {
    const b = t.getBoundingClientRect();
    if (b.top < 0 || b.top > window.innerHeight * 0.5) {
      try { t.scrollIntoView({ block: 'start' }); } catch (e) { t.scrollIntoView(); }
    }
  };
  go();

  // board.css puts `content-visibility:auto` on table rows, so tables ABOVE the
  // anchor gain height as they enter the viewport and slide the anchor out from
  // under the reader. Correct it for about a second — and stop the moment the
  // reader scrolls themselves, because fighting a scroll is worse than drifting.
  let mine = window.scrollY, tries = 0;
  _settle = setInterval(function () {
    if (Math.abs(window.scrollY - mine) > 40 || ++tries > 4) {
      clearInterval(_settle); _settle = null; return;
    }
    go();
    mine = window.scrollY;
  }, 250);
}

/**
 * Somebody followed a caveat link to a code this page does not hold. Say so.
 * Only `C-nnnn` corrections live here; section-local trap codes (`B-BROADCAST`,
 * `P-FIFO`, `TRN-TOPN`) are explained on the page that uses them, and a silent
 * jump to the top of a 23-record reference reads as "the record was deleted".
 */
function missingCode(id) {
  if (!/^[A-Z][A-Z0-9-]{2,}$/.test(id)) return;      // an ordinary section anchor
  const main = document.getElementById('main');
  if (!main) return;
  const box = h('<div class="caveat" id="cvmiss"><b>There is no record here for ' +
    esc(id) + '.</b> <span>This page holds the ' + CORRECTIONS.length +
    ' global corrections, C-0001 to C-' +
    esc(CORRECTIONS[CORRECTIONS.length - 1].id.slice(2)) +
    '. A section-local trap code is explained on the page that uses it, not here — ' +
    'go back and open the caveat from there.</span></div>');
  main.insertBefore(box, main.firstChild);
  try { box.scrollIntoView({ block: 'start' }); } catch (e) { /* fine */ }
}

async function render() {
  const main = document.getElementById('main');
  if (!main) return;
  const co = company();

  const m = await manifest();
  const ca = await slice('customer-ageing', co).catch(function () { return null; });

  /* Names for all 23 cards means all three party files. They are small
     (a few hundred KB in total, cached by core.js) and there is no other way to
     name a card in a book you are not currently looking at. A book that fails
     to load degrades to "codes without names", never to a wrong name. */
  const books = ['oil', 'mart', 'bev'];
  const partyLists = await Promise.all(books.map(function (b) {
    return parties(b).catch(function () { return null; });
  }));
  const partyByCo = {};
  books.forEach(function (b, i) {
    partyByCo[b] = partyLists[i] ? indexParties(partyLists[i]) : null;
  });

  const frag = document.createDocumentFragment();
  frag.appendChild(crumb([
    { label: 'Board', href: hrefSection('index.html', co) },
    { label: 'Methodology' }
  ]));
  frag.appendChild(panelIntro(m));
  frag.appendChild(panelDefinitions());
  frag.appendChild(panelNaiveAgeing(m, co, ca));
  frag.appendChild(panelCorrections());
