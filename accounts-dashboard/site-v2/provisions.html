<script type="module">
/* ────────────────────────────────────────────────────────────────────────────
   provisions.html — the Provisions & Accruals Register.

   One summary row = one postable liability G/L account. The page exists to hold
   three things in front of the reader that a naive version of it gets wrong:

     1. the headline is GROSS. OUTSTANDING_CR_L is floored at zero per account,
        so Oil's ₹5.99 Cr "still provided for" hides ₹1.37 Cr of accounts that
        sit in DEBIT. The net register position is ₹4.62 Cr, and both are shown.
     2. v1 renders that over-reversal as String(dr.length) — the COUNT, 8 —
        beside tiles that are all money. Here it is the AMOUNT, with the count
        beside it as a count.
     3. "older than a year" is mostly not neglect: 95.3% of Oil's ₹1.60 Cr is
        the 2024-09-30 SAP go-live opening balance, and that is said wherever
        the figure appears.

   Every money column in this section is LAKHS — including the four whose names
   contain _CR but do not END in it (OUTSTANDING_CR_L, CREATED_CR_L,
   NET_DR_MINUS_CR_L, PROV_MEMO_CR_L). core.scale() anchors its match to the end
   of the name; nothing here ever multiplies by hand.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */
import {
  shell, crumb, kpiRow, table, empty, note,
  manifest, slice, derivations, company, companyLabel,
  money, num, scale, ago, esc,
  hrefGL, hrefDerivation, hrefSection, hrefCaveat,
  onRefresh
} from './assets/core.js';
import { waterfall, stackedBars, pareto, scatter, donut, hbars, meter, sparkline }
  from './assets/charts.js';

/* ══ 1. section constants — straight out of specs/provisions.json ═════════ */

const SECTION  = 'provisions';
const SQL_FILE = 'sql/provisions.sql';
const GOLIVE   = '2024-09-30';

/** The ONLY additive bucket set. CROSSED_YEAREND_L and MIGRATED_OPENING_L are
 *  re-cuts of the same residual and never belong in this list (P-RECUT-BUCKETS). */
const AGE_KEYS = ['AGE_0_30_L', 'AGE_31_90_L', 'AGE_91_365_L', 'AGE_365P_L'];

/** How an account entered the register, in words rather than a sort key. */

  OLDEST_OPEN_DATE:     ['Oldest un-consumed credit',   'date', 'Reference date of the oldest credit line the FIFO has not consumed. Blank when nothing is standing. It is not “when the provision was made” — it is the oldest credit this method happens to leave un-consumed.'],
  OLDEST_OPEN_DAYS:     ['Age of the oldest',           'days', 'As-of date minus that date. 691 days on Oil’s go-live accounts is the migration date showing through, not 691 days of neglect.'],

  MANUAL_JE_PCT:        ['Posted by hand',              'pct',  'Percent of the account’s total movement (Debit + Credit) posted on TransType 30 — a manual journal entry rather than a document. Blank when the account has no movement at all. A control indicator, not a money figure.'],

  NEVER_REVERSED:       ['Reversal history',            'text', "'Y' when the account has lifetime credits and zero lifetime debits. It reads 'N' for an account that has never been posted at all, which is true but misleading — it is not a “has been reversed” flag."],
  DEBIT_BALANCE_FLAG:   ['Which side it sits on',       'text', "'Y' when Debit − Credit exceeds ₹1. It marks a liability account sitting in debit."],
  AS_OF:                ['As of',                       'date', 'The cut-off date the whole row was computed to. Every journal line dated on or before it is included. Not a point-in-time snapshot of SAP: it is today’s ledger, filtered by date.'],
  COMPANY_SCHEMA:       ['Book',                        'text', 'The HANA schema the row came from. Constant within a slice; it is here only to prove a slice was not cross-loaded.']
};

/** Money columns the table totals. All are lakhs; table() lifts them with scale(). */
const TOTAL_COLS = [
  'OUTSTANDING_CR_L', 'DEBIT_BAL_L', 'NET_DR_MINUS_CR_L', 'OACT_CURRTOTAL_L',
  'CREATED_CR_L', 'REVERSED_DR_L', 'CREATED_FYTD_L', 'REVERSED_FYTD_L',
  'AGE_0_30_L', 'AGE_31_90_L', 'AGE_91_365_L', 'AGE_365P_L',
  'CROSSED_YEAREND_L', 'MIGRATED_OPENING_L', 'PROV_MEMO_CR_L', 'N_LINES'
];

/** specs/provisions.json → traps[]. The whole list, verbatim. */
const TRAPS = [

/** The row sets the chip bar offers. */
const VIEWS = [
  { key:'ALL',      label:'Every account in the register', test:() => true },
  { key:'CARRYING', label:'Carrying a balance',            test:r => n(r.OUTSTANDING_CR_L) > 0 },

/* ══ 2. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** A number, or 0 — for tests and sums only, never for display. */
function n(v) { const x = Number(v); return isFinite(x) ? x : 0; }

/** `Rs 22.68 Cr` in the spec’s prose → `₹22.68 Cr` on the page. */
function rupee(s) { return String(s).replace(/\bRs\s(?=[\d,])/g, '₹').replace(/(\d)x\b/g, '$1×'); }

/** Sum one column over rows, lifted to rupees by its unit suffix first (§4). */
function total(rows, col) {
  let t = 0;
  for (const r of rows) {
    const v = Number(scale(r[col], col));
    if (isFinite(v)) t += v;
  }
  return t;
}

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }

/** A share, or the honest word — never a confident 0.0%. */
function share(part, whole) {
  if (!whole || !isFinite(whole) || !isFinite(part)) return null;
  return (100 * part / whole);
}
function pctTxt(v) { return v === null || v === undefined || !isFinite(v) ? 'not computed' : Number(v).toFixed(1) + '%'; }

/** Manifest KPI value, accepting both `{value}` and the short `{v}` shape. */
function manifestValue(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  if (!k) return undefined;                          // the build knows no such KPI
  const v = (k.value !== undefined) ? k.value : k.v;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/** A `<a class="cvcode">C-0019</a>` linked to the JIVO-wide correction record. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}
/** A section-local caveat code, linked to its own anchor on this page. */
function pv(code) {
  return '<a class="cvcode" href="#' + esc(code) + '">' + esc(code) + '</a>';
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + src + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a chart: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/**
 * Draw a chart, or say plainly that it could not be drawn.
 *
 * A chart that throws must not take the rest of the register down with it, and
 * it must not fail silently either: the reader gets a named failure where the
 * picture would have been, and the figures the chart was drawing are printed in
 * the KPI tiles and the table regardless.
 */
function safeChart(make, what) {
  try {
    const el = make();
    if (el) return el;
    return empty({ what: what + ' could not be drawn.', why: 'The chart function returned nothing.' });
  } catch (e) {
    try { console.warn('[provisions] chart failed:', what, e); } catch (e2) { /* ignore */ }
    return empty({
      what: what + ' could not be drawn.',
      why: 'The chart threw while rendering: ' + ((e && e.message) ? e.message : String(e)) +
           '. Every figure it would have shown is in the tiles above and in the register below — ' +
           'this is a drawing failure, not a missing number.'
    });
  }
}

/** Read the page’s own URL state: which rows, which extra filters, which sort. */
function urlState() {
  let p;
  try { p = new URLSearchParams(window.location.search); } catch (e) { p = new URLSearchParams(); }
  const view = String(p.get('view') || '').toUpperCase();
  /* The section’s own drill-downs write `filter=DAYS_SINCE_LAST_POST>=90&OUTSTANDING_CR_L>0`,
     which a query string splits into one `filter` and one bare key. Both shapes are read. */
  const clauses = [];
  String(p.get('filter') || '').split(/[,;]/).forEach(function (s) { if (s.trim()) clauses.push(s.trim()); });
  try {
    p.forEach(function (val, key) {
      if (/^[A-Z][A-Z0-9_]*\s*(>=|<=|>|<|=)/.test(key)) clauses.push(key + (val ? val : ''));
    });
  } catch (e) { /* an older URLSearchParams without forEach: the `filter` form still works */ }
  return {
    view: VIEWS.some(v => v.key === view) ? view : 'ALL',
    clauses: clauses,
    sort: p.get('sort') || '',
    dir: p.get('dir') === 'asc' ? 'asc' : 'desc'
  };
}

/** Rewrite one query parameter in place and re-render. No navigation. */
function setParam(name, value) {
  try {
    const url = new URL(window.location.href);
    if (value === null || value === '') url.searchParams.delete(name);
    else url.searchParams.set(name, value);
    window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
  } catch (e) { /* a browser without URL still re-renders below */ }
  render();
}

/** Drop every row filter the URL carries and re-render. */
function clearClauses() {
  try {
    const url = new URL(window.location.href);
    url.searchParams.delete('filter');
    const kill = [];
    url.searchParams.forEach(function (v, k) { if (/^[A-Z][A-Z0-9_]*\s*(>=|<=|>|<|=)/.test(k)) kill.push(k); });
    kill.forEach(function (k) { url.searchParams.delete(k); });
    window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
  } catch (e) { /* still re-renders */ }
  render();
}

/**
 * `COL>0`, `COL>=90`, `COL=Y` — the row predicates this section’s drill-downs
 * hand over. Money columns compare in their own unit (lakhs), which is what the
 * drill-down URLs are written in.
 */
function parseClause(src) {
  const m = /^\s*([A-Z][A-Z0-9_]*)\s*(>=|<=|>|<|=)\s*(.+?)\s*$/.exec(String(src || ''));
  if (!m) return null;
  const col = m[1], op = m[2], raw = m[3];
  if (!(col in COLS)) return null;
  const asNum = Number(raw);
  const numeric = raw !== '' && isFinite(asNum);
  const f = function (r) {
    const v = r[col];
    if (numeric) {
      const x = Number(v);
      if (!isFinite(x)) return false;
      return op === '>' ? x > asNum : op === '<' ? x < asNum : op === '>=' ? x >= asNum
           : op === '<=' ? x <= asNum : x === asNum;
    }
    return String(v == null ? '' : v).toUpperCase() === String(raw).toUpperCase();
  };
  if (numeric) {
    const word = op === '>=' ? 'at least' : op === '<=' ? 'at most'
               : op === '>' ? 'above' : op === '<' ? 'below' : 'exactly';
    f.label = COLS[col][0] + ' ' + word + ' ' + raw;
  } else if (col === 'DEBIT_BALANCE_FLAG' && String(raw).toUpperCase() === 'Y') {
    f.label = 'accounts sitting in debit';
  } else if (col === 'NEVER_REVERSED' && String(raw).toUpperCase() === 'Y') {
    f.label = 'accounts never once reversed';
  } else {
    f.label = 'accounts where ' + COLS[col][0] + ' is ' + raw;
  }
  return f;
}

/* ══ 3. the KPIs, recomputed from the rows this page is showing ══════════ */

/**
 * Every figure on this page is derived from the published summary rows, with
 * the spec’s own formula, so the headline and the table below it can never
 * disagree. The build’s stored KPI is then compared against it and any gap is
 * printed — see `divergences()`. That is deliberate: on the build read while
 * this page was written, six of the sixteen provisions KPIs were either absent
 * or stored in the wrong unit, and a page that simply echoed the manifest would
 * have printed “23154000.00%” for the concentration figure.
 */
function computeKpis(rows) {
  const carrying   = rows.filter(r => n(r.OUTSTANDING_CR_L) > 0);
  const debitRows  = rows.filter(r => r.DEBIT_BALANCE_FLAG === 'Y');
  const standing   = total(rows, 'OUTSTANDING_CR_L');
  const over       = total(rows, 'DEBIT_BAL_L');
  const created    = total(rows, 'CREATED_CR_L');
  const reversed   = total(rows, 'REVERSED_DR_L');
  const crFytd     = total(rows, 'CREATED_FYTD_L');
  const drFytd     = total(rows, 'REVERSED_FYTD_L');
  const aged365    = total(rows, 'AGE_365P_L');
  const migrated   = total(rows, 'MIGRATED_OPENING_L');

  /* per-account netting, not two book totals: it catches an account whose two
     columns disagree instead of hiding it inside a subtraction (spec recipe). */
  const aged365ExMig = rows.reduce(function (t, r) {
    return t + Math.max(0, Number(scale(r.AGE_365P_L, 'AGE_365P_L')) - Number(scale(r.MIGRATED_OPENING_L, 'MIGRATED_OPENING_L')));
  }, 0);

  const quiet = carrying.filter(r => r.DAYS_SINCE_LAST_POST != null && n(r.DAYS_SINCE_LAST_POST) >= 90);

  /* balance-weighted, with the no-movement accounts dropped rather than read
     as 0% (P-NULL-MANUAL-PCT). */
  const weighed = carrying.filter(r => r.MANUAL_JE_PCT !== null && r.MANUAL_JE_PCT !== undefined);
  const wTotal  = weighed.reduce((t, r) => t + n(r.OUTSTANDING_CR_L), 0);
  const manual  = wTotal > 0
    ? weighed.reduce((t, r) => t + n(r.OUTSTANDING_CR_L) * n(r.MANUAL_JE_PCT), 0) / wTotal
    : null;
  /* the same reading weighted the other way — if the two sit far apart, one big
     account is driving it. That is the honest half of a weak check. */
  const cWeighed = rows.filter(r => r.MANUAL_JE_PCT !== null && r.MANUAL_JE_PCT !== undefined && n(r.CREATED_CR_L) > 0);
  const cTotal   = cWeighed.reduce((t, r) => t + n(r.CREATED_CR_L), 0);
  const manualByCreated = cTotal > 0
    ? cWeighed.reduce((t, r) => t + n(r.CREATED_CR_L) * n(r.MANUAL_JE_PCT), 0) / cTotal
    : null;

  const oldestDays = carrying.reduce(function (best, r) {
    const d = r.OLDEST_OPEN_DAYS;
    if (d === null || d === undefined || !isFinite(Number(d))) return best;
    return best === null ? Number(d) : Math.max(best, Number(d));
  }, null);

  const biggest = carrying.slice().sort((a, b) => n(b.OUTSTANDING_CR_L) - n(a.OUTSTANDING_CR_L))[0] || null;
  const top1 = biggest ? total([biggest], 'OUTSTANDING_CR_L') : null;

  return {
    rows: rows, carrying: carrying, debitRows: debitRows, quiet: quiet, biggest: biggest,
    manualExcluded: carrying.length - weighed.length,
    manualByCreated: manualByCreated,
    createdLife: created, reversedLife: reversed,
    v: {
      'prov-standing':              standing,
      'prov-net-position':          -total(rows, 'NET_DR_MINUS_CR_L'),
      'prov-over-reversed':         over,
      'prov-over-reversed-count':   debitRows.length,
      'prov-aged-365p':             aged365,
      'prov-migrated-opening':      migrated,
      'prov-aged-365p-ex-migrated': aged365ExMig,
      'prov-never-reversed':        total(rows.filter(r => r.NEVER_REVERSED === 'Y'), 'OUTSTANDING_CR_L'),
      'prov-created-fytd':          crFytd,
      'prov-reversed-fytd':         drFytd,
      'prov-net-fytd':              crFytd - drFytd,
      'prov-dormant-standing':      total(quiet, 'OUTSTANDING_CR_L'),
      'prov-manual-je-share':       manual,
      'prov-accounts-carrying':     carrying.length,
      'prov-oldest-days':           oldestDays,
      'prov-top1-share':            (top1 !== null && standing > 0) ? (100 * top1 / standing) : null
    }
  };
}

/** Units, for comparing this page’s figure with the build’s stored one. */
const KPI_UNIT = {
  'prov-standing':'INR', 'prov-net-position':'INR', 'prov-over-reversed':'INR',
  'prov-over-reversed-count':'count', 'prov-aged-365p':'INR', 'prov-migrated-opening':'INR',
  'prov-aged-365p-ex-migrated':'INR', 'prov-never-reversed':'INR', 'prov-created-fytd':'INR',
  'prov-reversed-fytd':'INR', 'prov-net-fytd':'INR', 'prov-dormant-standing':'INR',
  'prov-manual-je-share':'pct', 'prov-accounts-carrying':'count', 'prov-oldest-days':'days',
  'prov-top1-share':'pct'
};
const KPI_LABEL = {
  'prov-standing':'Still provided for', 'prov-net-position':'Net position of the register',
  'prov-over-reversed':'Over-reversed (debit balances)', 'prov-over-reversed-count':'Accounts sitting in debit',
  'prov-aged-365p':'Standing more than a year', 'prov-migrated-opening':'Of that, the go-live opening balance',
  'prov-aged-365p-ex-migrated':'Genuinely old, excluding the migration', 'prov-never-reversed':'Never once reversed',
  'prov-created-fytd':'Provided this financial year', 'prov-reversed-fytd':'Reversed or utilised this financial year',
  'prov-net-fytd':'Net movement this financial year', 'prov-dormant-standing':'Standing on accounts nobody has touched in 90 days',
  'prov-manual-je-share':'Share of provision movement posted by hand', 'prov-accounts-carrying':'Accounts carrying a balance',
  'prov-oldest-days':'Oldest un-reversed provision', 'prov-top1-share':'Share held by the single largest account'
};

/**
 * Where the build’s stored KPI and this page’s recomputation part company.
 * Tolerance follows the section’s own rounding: every `_L` column is rounded to
 * two decimals of a lakh, so ₹1,000 × row count is the floor of what any route
 * can agree to. Exact equality would false-alarm (trap 9).
 */
function divergences(m, co, K, rowCount) {
  const out = [];
  Object.keys(KPI_UNIT).forEach(function (id) {
    const mine = K.v[id];
    const theirs = manifestValue(m, co, id);
    if (theirs === undefined) { out.push({ id: id, kind: 'absent', mine: mine }); return; }
    if (theirs === null) { out.push({ id: id, kind: 'null', mine: mine }); return; }
    if (mine === null || mine === undefined) return;
    const unit = KPI_UNIT[id];
    const tol = unit === 'INR' ? Math.max(1000, 1000 * rowCount) : unit === 'pct' ? 0.1 : 0;
    if (Math.abs(Number(mine) - Number(theirs)) > tol) {
      out.push({ id: id, kind: 'differs', mine: mine, theirs: theirs, tol: tol });
    }
  });
  return out;
}

/** Format a KPI value the way its unit wants it, for the divergence list. */
function fmtUnit(v, unit) {
  if (v === null || v === undefined || !isFinite(Number(v))) return 'not computed';
  if (unit === 'INR') return inr(Number(v));
  if (unit === 'pct') return Number(v).toFixed(2) + '%';
  if (unit === 'days') return num(v) + ' days';
  return num(v);
}

          esc(inr(V['prov-standing'])) + ' base. ' + pv('P-RECUT-BUCKETS') +

          ' <b>And the ageing is this board’s model, not SAP’s</b>: SAP’s internal reconciliation is ' +
          'switched off on every one of these lines, so debits are made to consume the oldest credits ' +
          'first. ' + pv('P-FIFO')
        ));
      } else {
        c.appendChild(empty({
          what: 'No account in this book is carrying a balance to age.',
          why: 'Every account’s credit balance is nil, so there is no residual for the buckets to hold. ' +
               'That is a measured nil at this as-of date, not a failed computation.'
        }));
      }
      add(c);
    }

    /* ── 4.6 concentration ──────────────────────────────────────────────── */
    {
      const c = card('How few accounts hold the provision', 'OUTSTANDING_CR_L, accounts carrying a balance');
      if (K.carrying.length) {
        c.appendChild(safeChart(() => pareto(K.carrying.map(r => ({
          label: r.ACCT_NAME || r.ACCT_CODE, value: total([r], 'OUTSTANDING_CR_L'), ACCT_CODE: r.ACCT_CODE
        })), {
          title: 'Ranked by what is still standing, with the running share',
          top: 10,
          href: it => (it && it.src && it.src.ACCT_CODE) ? hrefGL(it.src.ACCT_CODE, co) : null
        }), 'The concentration chart'));
        const top3 = K.carrying.slice().sort((a, b) => n(b.OUTSTANDING_CR_L) - n(a.OUTSTANDING_CR_L)).slice(0, 3);
        c.appendChild(cap(
          'Bars are each account’s share of what is still standing; the line is the running total. ' +
          '<b>' + esc(K.biggest ? K.biggest.ACCT_NAME : '') + '</b> alone is ' +
          esc(pctTxt(V['prov-top1-share'])) + ' of it, and the top three are ' +
          esc(pctTxt(share(total(top3, 'OUTSTANDING_CR_L'), V['prov-standing']))) + '. ' +
          'Reviewing three accounts reviews most of this number — and it also means the book-level ' +
          'figure moves whenever one of them moves. ' + pv('P-CONCENTRATION') +
          ' Only the ' + num(K.carrying.length) + ' accounts that carry a balance are plotted; the ' +
          'other ' + num(rows.length - K.carrying.length) + ' published rows are nil.'
        ));
      } else {
        c.appendChild(empty({
          what: 'Nothing to rank.',
          why: 'No account in this book carries a standing balance at this as-of date.'
        }));
      }
      add(c);
    }

    /* ── 4.7 age against size ───────────────────────────────────────────── */
    {
      const c = card('Age against size — the big old ones', 'OLDEST_OPEN_DAYS × OUTSTANDING_CR_L');
      const pts = K.carrying
        .filter(r => r.OLDEST_OPEN_DAYS !== null && r.OLDEST_OPEN_DAYS !== undefined)
        .map(function (r) {
          const golive = n(r.MIGRATED_OPENING_L) > 0;
          return {
            x: Number(r.OLDEST_OPEN_DAYS),
            y: total([r], 'OUTSTANDING_CR_L'),
            label: r.ACCT_NAME || r.ACCT_CODE,
            group: golive ? 'Go-live opening (' + GOLIVE + ')' : familyLabel(r.FAMILY),
            ACCT_CODE: r.ACCT_CODE
          };
        });
      const dropped = K.carrying.length - pts.length;
      const golivePts = pts.filter(p => /^Go-live/.test(p.group));
      const goliveN = golivePts.length;
      const goliveDays = goliveN ? Math.max.apply(null, golivePts.map(p => p.x)) : null;
      if (pts.length) {
        c.appendChild(safeChart(() => scatter(pts, {
          title: 'One dot per account still carrying a balance',
          xLabel: 'age of the oldest un-consumed credit (days)',
          yLabel: 'still standing',
          href: p => {
            const code = (p && p.ACCT_CODE) || (p && p.src && p.src.ACCT_CODE);
            return code ? hrefGL(code, co) : null;
          }
        }), 'The age-against-size chart'));
        c.appendChild(cap(
          'The top-right quadrant is the review queue: large, and standing a long time. ' +
          (goliveN
            ? '<b>The ' + num(goliveN) + ' account' + (goliveN === 1 ? '' : 's') + ' dated ' + GOLIVE +
              ' are drawn as their own series on purpose.</b> They are the SAP go-live opening balance ' +
              'carried into the new book, so the ' + esc(num(goliveDays)) +
              ' days on the oldest of them is the migration date showing through, not ' +
              esc(num(goliveDays)) + ' days of neglect. Ignore them and what is genuinely old here is ' +
              esc(inr(V['prov-aged-365p-ex-migrated'])) + '. '
            : 'No account in this book carries a go-live opening balance, so every age on this chart ' +
              'is an ordinary posting date. ') +
          'The other dots are coloured by how the account entered the register. ' +
          (dropped > 0
            ? num(dropped) + ' account' + (dropped === 1 ? ' has' : 's have') + ' no un-consumed credit date and ' +
              'are left out rather than drawn at zero days. '
            : '') +
          pv('P-MIGRATION') + ' ' + pv('P-FIFO')
        ));
      } else {
        c.appendChild(empty({
          what: 'Nothing to plot.',
          why: 'No account in this book is both carrying a balance and carrying a dated un-consumed credit.'
        }));
      }
      add(c);
    }

    /* ── 4.8 what family the standing balance really sits in ────────────── */
    {
      const c = card('Where the standing balance actually sits', 'FAMILY × OUTSTANDING_CR_L');
      const fams = {};
      rows.forEach(function (r) {
        const key = r.FAMILY == null ? 'UNCLASSIFIED' : String(r.FAMILY);
        if (!fams[key]) fams[key] = { key: key, value: 0, n: 0, carrying: 0 };
        fams[key].value += total([r], 'OUTSTANDING_CR_L');
        fams[key].n += 1;
        if (n(r.OUTSTANDING_CR_L) > 0) fams[key].carrying += 1;
      });
      const present = Object.keys(fams).map(k => fams[k]);
      const live = present.filter(f => f.value > 0).sort((a, b) => b.value - a.value);
      const missing = ['A_PROVISIONS', 'B_EXPENSES_PAYABLE', 'C_OTHER_BY_MEMO'].filter(k => !fams[k]);
      const nilFam = present.filter(f => f.value === 0);
      if (live.length) {
        c.appendChild(safeChart(() => donut(live.map(f => ({ label: familyLabel(f.key) + ' (' + f.carrying + ')', value: f.value })), {
          title: 'The standing balance by how the account entered the register',
          centerLabel: 'still standing'
        }), 'The family split'));
        const biggestFam = live[0];
        c.appendChild(cap(
          'It answers the question the section’s name invites: <i>is this really provisions?</i> ' +
          'The largest share, <b>' + esc(inr(biggestFam.value)) + '</b>, sits in ' +
          '<b>' + esc(familyLabel(biggestFam.key)) + '</b>' +
          (biggestFam.key === 'B_EXPENSES_PAYABLE'
            ? ' — accounts named “…PAYABLE” that are month-end accruals in everything but name, which ' +
              'is exactly why they belong in a provisions register.'
            : '.') +
          ' Families are found by walking the account hierarchy, never by reading an account-code prefix. ' +
          (missing.length
            ? ' <b>' + esc(companyLabel(co)) + ' has no account at all in the ' +
              missing.map(k => '“' + esc(familyLabel(k)) + '”').join(' or ') + ' famil' +
              (missing.length === 1 ? 'y' : 'ies') + '</b>, so that slice is absent rather than drawn ' +
              'at zero — the memo rule that admits an off-piste account needs ₹5 L of memo-tagged ' +
              'credit AND a quarter of the account’s total credit, and it is a fixed gate, not one ' +
              'scaled to the size of the book. '
            : ' ') +
          (nilFam.length
            ? num(nilFam.length) + ' further famil' + (nilFam.length === 1 ? 'y is' : 'ies are') +
              ' present in this book but carr' + (nilFam.length === 1 ? 'ies' : 'y') +
              ' nothing standing today. '
            : '') +
          pv('P-DORMANT-ROWS')
        ));
      } else {
        c.appendChild(empty({
          what: 'No family carries a standing balance in this book.',
          why: 'Every register account is nil at this as-of date. That is measured, not missing.'
        }));
      }
      add(c);
    }

    /* ── 4.9 the diverging view: credit standing against debit balances ── */
    {
      const c = card('Credit standing against debit balances, account by account',
                     'OUTSTANDING_CR_L right · DEBIT_BAL_L left');
      const debitBars = K.debitRows.slice()
        .sort((a, b) => n(b.DEBIT_BAL_L) - n(a.DEBIT_BAL_L))
        .map(r => ({ name: r.ACCT_CODE + ' ' + r.ACCT_NAME, value: -total([r], 'DEBIT_BAL_L'), ACCT_CODE: r.ACCT_CODE }));
      const creditBars = K.carrying.slice()
        .sort((a, b) => n(b.OUTSTANDING_CR_L) - n(a.OUTSTANDING_CR_L))
        .slice(0, 12)
        .map(r => ({ name: r.ACCT_CODE + ' ' + r.ACCT_NAME, value: total([r], 'OUTSTANDING_CR_L'), ACCT_CODE: r.ACCT_CODE }));
      const bars = creditBars.concat(debitBars);
      if (bars.length) {
        c.appendChild(safeChart(() => hbars(bars, {
          title: 'Credit balances (right) and the accounts sitting in debit (left)',
          sort: false, top: bars.length,
          href: it => (it && it.src && it.src.ACCT_CODE) ? hrefGL(it.src.ACCT_CODE, co) : null
        }), 'The credit-against-debit chart'));
        const worst = K.debitRows.slice().sort((a, b) => n(b.DEBIT_BAL_L) - n(a.DEBIT_BAL_L))[0] || null;
        c.appendChild(cap(
          '<b>This is the only chart on the board that shows the two sides of a liability account ' +
          'at once,</b> and it is the one that makes the over-reversal legible. ' +
          (worst
            ? 'The largest is <b>' + esc(worst.ACCT_CODE + ' ' + worst.ACCT_NAME) + '</b> at ' +
              esc(inr(total([worst], 'DEBIT_BAL_L'))) + ' in <i>debit</i>' +
              (/SALARY|FREIGHT/i.test(String(worst.ACCT_NAME)) && K.carrying.some(r => /SALARY|FREIGHT/i.test(String(r.ACCT_NAME)))
                ? ' — sitting next to earlier months of the same accrual that are still in credit, ' +
                  'which is the shape of “this month was paid before it was accrued”. It is worth an ' +
                  'Accounts look rather than a chart caption.'
                : '. It is worth an Accounts look rather than a chart caption.')
            : '') +
          ' Bars to the left of the rule are debit balances shown as negatives; bars to the right are ' +
          'credit balances. ' +
          (K.carrying.length > creditBars.length
            ? 'The ' + num(K.carrying.length - creditBars.length) + ' smallest credit balances are left out to keep the chart readable; every one of them is in the table below. '
            : '') +
          pv('P-V1-COUNT-ONLY')
        ));
      } else {
        c.appendChild(empty({
          what: 'No account in this book is on either side.',
          why: 'Nothing is standing and nothing is over-reversed at this as-of date.'
        }));
      }
      add(c);
    }

    /* ── 4.10 the control reading, and the trend ────────────────────────── */
    {
      const c = card('How this book posts its provisions', 'MANUAL_JE_PCT · TransType 30');
      if (V['prov-manual-je-share'] !== null) {
        c.appendChild(safeChart(() => meter(V['prov-manual-je-share'], 100, {
          unit: 'pct',
          title: 'Provision movement posted by hand, weighted by the balance each account still carries',
          label: 'posted as a manual journal entry', maxLabel: 'of all movement',
          warnAt: 0.6, badAt: 0.9, invert: true
        }), 'The hand-posted meter'));
        c.appendChild(cap(
          '<b>' + esc(pctTxt(V['prov-manual-je-share'])) + '</b> of the movement on the accounts that ' +
          'still carry a balance was posted as a manual journal entry rather than through a document. ' +
          'This is a control reading, not money. ' +
          (K.manualByCreated !== null
            ? 'Weighted the other way — by lifetime credits instead of by the balance carried — it reads ' +
              esc(pctTxt(K.manualByCreated)) + '; the two sitting close together means no single large ' +
              'account is driving the figure. '
            : '') +
          '<b>Its cross-check is weak and is stated as weak</b>: no second column in this section ' +
          'records where a posting came from, so there is no independent route inside the data. What ' +
          'can be checked is that every reading is between 0 and 100, that it is blank only where an ' +
          'account has no movement at all, and that it does not jump between builds. ' +
          (K.manualExcluded > 0
            ? num(K.manualExcluded) + ' account' + (K.manualExcluded === 1 ? '' : 's') + ' carrying a ' +
              'balance had no movement to measure and ' + (K.manualExcluded === 1 ? 'was' : 'were') +
              ' dropped from the weighting rather than counted as 0%. '
            : '') +
          pv('P-WEAK-CHECK') + ' ' + pv('P-NULL-MANUAL-PCT')
        ));
      } else {
        c.appendChild(empty({
          what: 'No posting activity to measure.',
          why: 'Every account carrying a balance in this book has a blank hand-posted share, which ' +
               'happens only when the account has no movement at all. Blank is not 0% — reading it as ' +
               '0% would claim the book is fully document-driven.'
        }));
      }
      c.appendChild(await trendPanel(co, V['prov-standing']));
      add(c);
    }

    /* ── 4.11 the second route, from a different SAP table ──────────────── */
    add(crossCheckCard(rows, co, K, asOf, m));

    /* ── 4.12 where this page and the stored build differ ───────────────── */
    add(divergenceCard(m, co, K, rows.length));
  }

  /* ── 4.13 the table ──────────────────────────────────────────────────── */
  add(tableCard(rows, co, K, st));

  /* ── 4.14 how to read this ───────────────────────────────────────────── */
  add(howToRead());

  /* ── 4.15 the query ──────────────────────────────────────────────────── */
  add(await sqlCard(der, co));

  paintFoot(m, co, asOf, rows.length);
}

/* ══ 5. pieces ═══════════════════════════════════════════════════════════ */

/** "Still provided for, over time", from history.jsonl. Empty until it has two points. */
async function trendPanel(co, current) {
  let pts = [];
  try {
    const r = await fetch('data/history.jsonl', { cache: 'no-cache' });
    if (r.ok) {
      const seen = {};
      String(await r.text()).split('\n').forEach(function (line) {
        if (!line.trim()) return;
        let o;
        try { o = JSON.parse(line); } catch (e) { return; }
        const v = o && o.kpis && o.kpis[co] ? o.kpis[co]['prov-standing'] : null;
        if (v === null || v === undefined || !isFinite(Number(v))) return;
        const t = String(o.t || '');
        if (seen[t]) return;                       // the log repeats a build per section
        seen[t] = true;
        pts.push({ t: t, v: Number(v) });
      });
    }
  } catch (e) { pts = []; }

  pts.sort((a, b) => String(a.t).localeCompare(String(b.t)));

  const host = document.createElement('div');
  if (pts.length < 2) {
    host.appendChild(empty({
      what: 'No history to draw yet.',
      why: 'The trend needs two builds that both recorded this figure for ' + companyLabel(co) +
           '; history.jsonl currently has ' + num(pts.length) + '. A provision register should ' +
           'breathe with the month-end cycle, and a flat line through a month end is itself the ' +
           'finding — but neither can be said from a single point.'
    }));
    return host;
  }

  host.appendChild(safeChart(() => sparkline(pts.map(p => ({ x: String(p.t).slice(0, 16).replace('T', ' '), y: p.v })), {
    unit: 'INR', height: 56, table: true, extremes: true,
    title: 'Still provided for, build by build'
  }), 'The trend'));
  const first = pts[0], last = pts[pts.length - 1];
  const spanSameDay = String(first.t).slice(0, 10) === String(last.t).slice(0, 10);
  host.appendChild(cap(
    'Every recorded build of this figure for ' + esc(companyLabel(co)) + ': ' + num(pts.length) +
    ' point' + (pts.length === 1 ? '' : 's') + ', from ' + esc(inr(first.v)) + ' to ' +
    esc(inr(last.v)) + '. ' +
    (spanSameDay
      ? '<b>All of them are from the same day</b> (' + esc(String(first.t).slice(0, 10)) + '), so this ' +
        'is the difference between two builds of the same book, not a movement in the provision. ' +
        'It becomes a trend once the history spans a month end.'
      : 'The line spans ' + esc(String(first.t).slice(0, 10)) + ' to ' + esc(String(last.t).slice(0, 10)) + '.')
  ));
  return host;
}

/** SAP’s own stored balance, re-derived without touching a single journal line. */
function crossCheckCard(rows, co, K, asOf, m) {
  const c = card('The same figure from a different SAP table', 'OACT.CurrTotal, no journal line read');
  const curCr = rows.reduce(function (t, r) {
    const v = Number(scale(r.OACT_CURRTOTAL_L, 'OACT_CURRTOTAL_L'));
    return isFinite(v) ? t + Math.max(0, -v) : t;
  }, 0);
  const curDr = rows.reduce(function (t, r) {
    const v = Number(scale(r.OACT_CURRTOTAL_L, 'OACT_CURRTOTAL_L'));
    return isFinite(v) ? t + Math.max(0, v) : t;
  }, 0);

  /* CurrTotal is a LIFETIME balance. It answers the as-of question only when the
     as-of IS today, and only because no register account carries a future-dated
     line. At any other as-of the check is not applicable — it is not red. */
  let today = null;
  try { today = new Date().toISOString().slice(0, 10); } catch (e) { today = null; }
  const applicable = !!(asOf && today && asOf === today);
  const tol = Math.max(1000, 1000 * rows.length);
  const gapCr = Math.abs(curCr - K.v['prov-standing']);
  const gapDr = Math.abs(curDr - K.v['prov-over-reversed']);

  const mk = h('<div class="minikpis"></div>');
  [
    ['Credit side of SAP’s stored balance', curCr, 'Sum of every negative <code>OACT.CurrTotal</code> in the register, sign flipped. This route reads no journal line, runs no FIFO and no CTE.'],
    ['Debit side of SAP’s stored balance', curDr, 'Sum of every positive <code>OACT.CurrTotal</code> — the accounts sitting in debit, from the same stored figure.']
  ].forEach(function (x) {
    mk.appendChild(h(
      '<div class="mk"><div class="lab">' + esc(x[0]) + '</div>' +
      '<div class="val">' + esc(inr(x[1])) + '</div>' +
      '<div class="sub">' + x[2] + '</div></div>'
    ));
  });
  c.appendChild(mk);

  if (!applicable) {
    c.appendChild(empty({
      what: 'This cross-check is not applicable at this as-of date.',
      why: 'OACT.CurrTotal is a LIFETIME balance that SAP cannot rewind. It matches the as-of figure ' +
           'only when the as-of date is today' +
           (asOf ? ' — this build is dated ' + asOf + (today ? ' and today is ' + today : '') : '') +
           '. A disagreement here would be legitimate, not a defect, so it is reported as “not ' +
           'applicable” rather than as a failure.'
    }));
  } else {
    c.appendChild(cap(
      (gapCr <= tol && gapDr <= tol
        ? '<b>Both sides reproduce to within the rounding floor.</b> '
        : '<b>The two routes do not agree.</b> ') +
      'The headline built from ' + num(rows.length) + ' accounts’ worth of journal lines is ' +
      esc(inr(K.v['prov-standing'])) + '; SAP’s own stored trial-balance figure for the same accounts ' +
      'is ' + esc(inr(curCr)) + ' — a gap of ' + esc(money(gapCr) || '₹0') + '. On the debit side ' +
      esc(inr(K.v['prov-over-reversed'])) + ' against ' + esc(inr(curDr)) + '. ' +
      '<b>The tolerance is not zero and cannot be.</b> Every money column in this section is rounded ' +
      'to two decimals of a lakh, which is ₹1,000 of granularity per row, so the honest bar is ' +
      esc(money(tol) || '') + ' across ' + num(rows.length) + ' rows. Demanding exact equality here ' +
      'would raise a false alarm on every build.'
    ));
  }
  return c;
}

/** Where the build’s stored KPI and this page’s recomputation part company. */
function divergenceCard(m, co, K, rowCount) {
  const gaps = divergences(m, co, K, rowCount);
  if (!gaps.length) return null;
  const c = card('Where this page and the stored build differ', 'manifest.kpis.' + co + '.prov-*');
  c.appendChild(h(
    '<p class="blurb">Every figure above is recomputed here, from the same rows the table below ' +
    'shows, using the formula in the section spec — so the headline and the table can never ' +
    'disagree with each other. The build also stores its own value for each of them in the ' +
    'manifest. Where the two part company, both are printed rather than one quietly winning.</p>'
  ));
  const ol = h('<div class="prose"><ul></ul></div>');
  const list = ol.querySelector('ul');
  gaps.forEach(function (g) {
    const unit = KPI_UNIT[g.id];
    const label = KPI_LABEL[g.id] || g.id;
    let txt;
    if (g.kind === 'absent') {
      txt = '<b>' + esc(label) + '</b> — this build’s manifest carries no entry at all for <code>' +
            esc(g.id) + '</code>. This page shows ' + esc(fmtUnit(g.mine, unit)) + ', derived from the rows.';
    } else if (g.kind === 'null') {
      txt = '<b>' + esc(label) + '</b> — the build stored no value for <code>' + esc(g.id) +
            '</code> (its check dot is amber for the same reason). This page shows ' +
            esc(fmtUnit(g.mine, unit)) + ', derived from the rows.';
    } else {
      txt = '<b>' + esc(label) + '</b> — this page derives ' + esc(fmtUnit(g.mine, unit)) +
            '; the build stored ' + esc(fmtUnit(g.theirs, unit)) + ' for <code>' + esc(g.id) +
            '</code>. The gap is wider than the ' + esc(fmtUnit(g.tol, unit)) +
            ' this section’s rounding can explain, so it is a real difference between two routes, ' +
            'not a rounding artefact.';
    }
    list.appendChild(h('<li>' + txt + '</li>'));
  });
  c.appendChild(ol);
  c.appendChild(cap(
    'A gap here is not a claim that the build is wrong and this page is right. It is the same ' +
    'discipline as the check dot: <b>two routes disagree, go and look</b>. Each KPI label above links ' +
    'to its derivation, which carries the formula, the terms and the exact lines of SQL behind it.'
  ));
  return c;
}

/** The register itself, one row per G/L account. */
function tableCard(rows, co, K, st) {
  const c = card('Every account in the register',
                 SECTION + '.' + co + '.json · ' + num(rows.length) + ' rows · summary only, no detail slice');

  /* chips: which rows */
  const chips = h('<div class="chips" role="group" aria-label="Which accounts to show"></div>');
  VIEWS.forEach(function (v) {
    const set = rows.filter(v.test);
    if (!set.length) return;
    const on = st.view === v.key;
    const b = h('<button type="button" class="chip" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      esc(v.label) + ' <span class="n">' + num(set.length) + '</span></button>');
    b.title = v.label + ': ' + num(set.length) + ' account' + (set.length === 1 ? '' : 's') + ', ' +
              inr(total(set, 'OUTSTANDING_CR_L')) + ' still standing';
    b.addEventListener('click', function () { setParam('view', v.key); });
    chips.appendChild(b);
  });
  const bar = h('<div class="toolbar"></div>');
  bar.appendChild(chips);
  c.appendChild(bar);

  const view = VIEWS.find(v => v.key === st.view) || VIEWS[0];
  let shown = rows.filter(view.test);

  const clauses = st.clauses.map(parseClause).filter(Boolean);
  if (clauses.length) {
    clauses.forEach(function (f) { shown = shown.filter(f); });
    const pill = h('<div class="toolbar"><span class="pill info">only ' +
      esc(clauses.map(f => f.label).join(' and ')) + '</span> ' +
      '<button type="button" class="btn sm">clear this filter</button></div>');
    pill.querySelector('button').addEventListener('click', clearClauses);
    c.appendChild(pill);
  }

  /* display rows: the flags become sentences, the null dates become words, and
     the family becomes the phrase it means. Money and counts are untouched. */
  const display = shown.map(function (r) {
    const o = {};
    Object.keys(COLS).forEach(function (k) { o[k] = r[k]; });
    o.FAMILY = familyLabel(r.FAMILY);
    o.PARENT_NAME = r.PARENT_NAME || 'no parent (root-level account)';
    o.NEVER_REVERSED = (n(r.N_LINES) === 0)
      ? 'never posted at all'
      : (r.NEVER_REVERSED === 'Y' ? 'never reversed' : 'has been reversed');
    o.DEBIT_BALANCE_FLAG = (r.DEBIT_BALANCE_FLAG === 'Y')
      ? 'in debit — over-reversed'
      : (n(r.OUTSTANDING_CR_L) > 0 ? 'in credit — still provided' : 'nil balance');
    o.FIRST_POST = r.FIRST_POST || 'never posted';
    o.LAST_POST  = r.LAST_POST  || 'never posted';
    o.OLDEST_OPEN_DATE = r.OLDEST_OPEN_DATE || 'nothing standing';
    return o;
  });

  const cols = Object.keys(COLS);
  const labels = {}, units = {};
  cols.forEach(function (k) { labels[k] = COLS[k][0]; units[k] = COLS[k][1]; });

  const sortCol = (st.sort && cols.indexOf(st.sort) >= 0) ? st.sort : 'OUTSTANDING_CR_L';
  c.appendChild(table(display, {
    co: co,
    cols: cols,
    labels: labels,
    units: units,
    links: {
      ACCT_CODE: 'gl',
      ACCT_NAME: function (v, r, cc) { return r.ACCT_CODE ? hrefGL(r.ACCT_CODE, cc) : null; }
    },
    sort: (st.dir === 'asc' ? '' : '-') + sortCol,
    filter: 'Find an account by name, code or head…',
    facets: ['FAMILY'],
    total: TOTAL_COLS,
    empty: {
      what: 'No account matches this cut.',
      why: 'The chips and filters above narrow a real, non-empty register — nothing matched this ' +
           'combination. That is not a nil provision; widen the filter to see the rows that exist.'
    },
    caption: 'Provisions register — one row per postable liability G/L account'
  }));

  c.appendChild(cap(
    '<b>The totals row adds up only the rows currently in view</b>, and each column is lifted out of ' +
    'lakhs before it is summed. With every row shown, “Still standing” comes to ' +
    esc(inr(K.v['prov-standing'])) + ' and “Over-reversed” to ' + esc(inr(K.v['prov-over-reversed'])) +
    '. <b>Do not add “Carried over the year end” or “Go-live opening balance” to the four ageing ' +
    'buckets</b> — they re-cut the same money the buckets already hold. ' + pv('P-RECUT-BUCKETS') +
    ' Two columns are flags written out in words rather than left as Y/N: “Reversal history” reads ' +
    '<i>never posted at all</i> where the account has no journal line, because the raw flag says N ' +
    'there and that reads as “has been reversed” when it means the opposite ' + pv('P-NEVER-REVERSED-FLAG') +
    '. Blank dates are printed as <i>never posted</i> or <i>nothing standing</i>, never as a date or ' +
    'a zero ' + pv('P-NULL-DATES') + '. ' + num(rows.length - K.carrying.length) + ' of the ' +
    num(rows.length) + ' rows carry nothing at all: dormant provision heads are published on purpose ' +
    'so an unused head is visibly unused, which is why counting rows overstates activity ' +
    pv('P-DORMANT-ROWS') + '. <b>There is no drill below this table.</b> The section has summary rows ' +
    'only — no journal-line slice exists — so an account page can show these thirty columns and its ' +
    'trend, and nothing finer ' + pv('P-NO-DETAIL') + '.'
  ));

  /* what every column actually means — the spec's own wording, not a guess */
  const gloss = h('<details><summary class="btn sm">What each column means</summary></details>');
  const gbody = h('<div class="prose" style="margin-top:12px"><dl></dl></div>');
  const gdl = gbody.querySelector('dl');
  cols.forEach(function (k) {
    gdl.appendChild(h('<dt>' + esc(COLS[k][0]) +
      ' <code class="mono">' + esc(k) + '</code></dt>'));
    gdl.appendChild(h('<dd>' + esc(COLS[k][2]) + '</dd>'));
  });
  gloss.appendChild(gbody);
  c.appendChild(gloss);
  return c;
}

/** Every measured way the obvious reading of this data goes wrong. */
function howToRead() {
  const c = card('How to read this', 'every way a naive version of this page goes wrong');
  c.appendChild(h(
    '<p class="blurb">These are not caveats in the small-print sense. Each one is a specific, ' +
    'measured way that the obvious reading of this register produces a wrong number, found by ' +
    'attacking the query against live SAP. The rupee figures inside them are the measurements taken ' +
    'the day each trap was found; the books move, so read them as the size of the problem, not as ' +
    'today’s balance — today’s balance is in the tiles at the top of this page.</p>'
  ));
  const ol = h('<div class="prose"><ol></ol></div>');
  const list = ol.querySelector('ol');
  TRAPS.forEach(function (t) { list.appendChild(h('<li>' + esc(rupee(t)) + '</li>')); });
  c.appendChild(ol);

  c.appendChild(h('<h3>The codes used above</h3>'));
  const dl = h('<div class="prose"><dl></dl></div>');
  const defs = dl.querySelector('dl');
  CAVEATS.forEach(function (p) {
    defs.appendChild(h('<dt id="' + esc(p[0]) + '"><code class="mono">' + esc(p[0]) + '</code></dt>'));
    defs.appendChild(h('<dd>' + esc(p[1]) + '</dd>'));
  });
  c.appendChild(dl);

  c.appendChild(h(
    '<p class="tnote"><b>The JIVO-wide corrections mostly do not bite here, and that is worth saying ' +
    'out loud.</b> This is a G/L account register: it has no CardCode, no DocEntry and no document ' +
    'status, so ' + cv('C-0019') + ' (document status is unreliable), ' + cv('C-0021') +
    ' (CANCELED is three-valued) and ' + cv('C-0005') + ' (the 23 intercompany cards) have nothing to ' +
    'act on. What does bite is the temptation to add this section to payables: ' +
    '<b>“total liabilities = payables + provisions” is not a supported sum</b>. A handful of internal ' +
    'clearing accounts here are fed by vendor cards that also appear in vendor ageing. The measured ' +
    'overlap is small — ₹29,897 on Oil, ₹500 on Beverages — but it is not zero, and the two sections ' +
    'are built on different grains.</p>'
  ));
  c.appendChild(note(SECTION));
  return c;
}

/**
 * The query itself, behind a disclosure. Tries the published file first (it
 * ships beside the notes), then falls back to the excerpt every derivation
 * record carries, so the panel is never empty on a deploy that ships only
 * `site-v2/`. The index is consulted first: a fetch-and-fail would log a
 * console 404 the page cannot suppress.
 */
async function sqlCard(der, co) {
  const c = card('The query behind this page', SQL_FILE);
  const box = h('<details><summary class="btn sm">Show the SQL</summary></details>');
  box.style.margin = '0';
  const body = h('<div style="margin-top:12px"></div>');
  box.appendChild(body);
  c.appendChild(box);
  c.appendChild(h(
    '<p class="tnote">Read-only, and reviewed adversarially before it was allowed near the board. ' +
    'Money columns leave the query in plain rupees and are divided into lakhs by the column suffix, ' +
    'not by the query. This file is not edited by the dashboard (CONTRACT §0.6): changing one of ' +
    'these queries silently changes the books.</p>'
  ));

  let text = null, from = null;
  try {
    const idx = await fetch('sql/_index.json', { cache: 'no-cache' })
      .then(r => (r.ok ? r.json() : null)).catch(() => null);
    if (!Array.isArray(idx) || idx.indexOf(SECTION) >= 0) {
      const r = await fetch(SQL_FILE, { cache: 'no-cache' });
      if (r.ok) { text = await r.text(); from = 'the full query, ' + SQL_FILE; }
    }
  } catch (e) { /* fall back below */ }

  if (!text) {
    const d = der && (der['prov-standing'] || der['prov-net-position']);
    if (d && d.sql && d.sql.text) {
      text = d.sql.text;
      from = 'the excerpt carried in the derivation record' +
             (Array.isArray(d.sql.lines) ? ' (lines ' + d.sql.lines[0] + '–' + d.sql.lines[1] + ')' : '');
    }
  }

  if (!text) {
    body.appendChild(empty({
      what: 'The query text is not published with this build.',
      why: 'It is not listed in sql/_index.json beside the site, and no derivation record carried an ' +
           'excerpt. The file itself is in the repo at ' + SQL_FILE + '.'
    }));
    return c;
  }

  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const html = lines.map(function (ln, i) {
    return '<span class="ln">' + (i + 1) + '</span>' + esc(ln);
  }).join('\n');
  body.appendChild(h('<div class="sqlbox"><pre><code>' + html + '</code></pre></div>'));
  body.appendChild(h('<div class="sqlfoot"><span>' + esc(from) + '</span><span>' +
    num(lines.length) + ' lines</span><span>reads OACT · OJDT · JDT1, nothing else</span></div>'));
  return c;
}

/** The page footer: where the numbers came from, and how old they are. */
function paintFoot(m, co, asOf, rowCount) {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
      '<div><b>Section</b> — provisions, one row per postable liability G/L account' +
        (rowCount ? ' (' + num(rowCount) + ' in this book)' : '') + ', from <code>OACT</code> (the ' +
        'chart of accounts and its stored balance), <code>JDT1</code> (every journal line — the only ' +
        'source of money here) and <code>OJDT</code> (the header memo, used only by the memo rule). ' +
        'No <code>OINV</code>, no <code>OPCH</code>, no <code>OCRD</code>.</div>' +
      '<div><b>Book</b> — ' + esc(companyLabel(co)) + '. Figures from one company are not comparable ' +
        'with another’s, and this section must never be added to payables: different grain, and a ' +
        'small measured overlap through the internal clearing accounts.</div>' +
      '<div><b>Freshness</b> — ' + (asOf ? 'as of ' + esc(asOf) + '. ' : '') +
        (gen ? 'Built ' + esc(ago(gen)) + ' (' + esc(gen) + '). ' : 'Build time unknown. ') +
        'The page re-reads the manifest every minute and redraws itself when the build moves.</div>' +
      '<div><b>Read-only</b> — this board issues no write to SAP, ever (CONTRACT §0.2).</div>' +
    '</div>' +
    '<p><a href="' + esc(hrefSection('methodology.html', co)) + '">Methodology and the corrections</a> · ' +
    '<a href="' + esc(hrefDerivation('prov-standing', co)) + '">How the headline is derived</a> · ' +
    '<a href="' + esc(hrefDerivation('prov-net-position', co)) + '">How the net position is derived</a> · ' +
    '<a href="' + esc(hrefSection('health', co)) + '">Build health</a></p>';
}

shell({
  title: 'Provisions',
  subtitle: 'What was provided, what has been reversed, and what is still standing',
  section: SECTION
});

render().catch(function (e) {
  const main = document.getElementById('main');
  if (main) {
    main.innerHTML = '';
    main.appendChild(empty({
      what: 'This page could not be rendered.',
      why: 'The data files loaded but the page failed while drawing them: ' +
           ((e && e.message) ? e.message : String(e)) +
           '. No figure on screen should be trusted until this is fixed.'
    }));
  }
  try { console.error('[provisions]', e); } catch (e2) { /* ignore */ }
});

onRefresh(render);
</script>
