/* ────────────────────────────────────────────────────────────────────────────
   receivables.html — the Customer Ageing section.

   Two corrections hold the page up and both are printed on it, not filed in a
   repo. C-0019: at JIVO an invoice keeps DocStatus='O' long after the money
   landed, because receipts go on account and settlements are posted as journal
   entries — so every figure here is aged from OCRD.Balance, not from the
   document status. C-0005: intercompany is 23 named group CardCodes, and they
   are RETAINED and flagged here, never silently dropped.

   The section's own landmine is structural: the summary array holds FIVE rows,
   and the fifth (KIND == 'ZZ_TOTAL') is the roll-up of the other four. Adding
   all five double-counts the book to the paisa — a clean +100.00% that reads
   like a data error and is not. The page demonstrates that arithmetic rather
   than warning about it.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */

  shell, crumb, kpiRow, table, empty, note,
  manifest, slice, derivations, company, companyLabel,
  money, moneyFull, num, scale, ago, esc,
  hrefParty, hrefDerivation, hrefSection, hrefCaveat,
  onRefresh

import { waterfall, stackedBars, pareto, treemap, donut, scatter, hbars, meter }
  from './assets/charts.js';

/* ══ 1. section constants — straight out of specs/customer-ageing.json ════ */

/* ══ 2. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** `Rs 7.35 Cr` in the spec's prose → `₹7.35 Cr` on the page. */
function rupee(s) { return String(s).replace(/\bRs\s(?=[\d,])/g, '₹').replace(/(\d)x\b/g, '$1×'); }

/** Sum one column over rows, lifted to rupees by its unit suffix first (§4). */
function total(rows, col) {
  let t = 0;
  for (const r of rows || []) {
    const v = Number(scale(r[col], col));
    if (isFinite(v)) t += v;
  }
  return t;
}

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }

/** Manifest KPI value, accepting both `{value}` and the short-keyed `{v}` shape. */
function kpi(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  if (!k) return null;
  const v = (k.value !== undefined) ? k.value : k.v;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/**
 * A percentage KPI — but only if the build published something that can BE a
 * percentage. On 2026-08-22 the build served Mart's `ar-overdue-60p-share` as
 * 3014261.42, which is that book's overdue RUPEES, not its share; rendering it
 * verbatim gives "3014261.42%". Anything outside 0–100 is refused here and
 * named in a panel instead of being printed as a figure.
 * @returns {number|null}
 */
function pctKpi(m, co, id) {
  const v = kpi(m, co, id);
  if (v === null) return null;
  return (v >= -0.01 && v <= 100.01) ? v : null;
}

/** The figure a percentage KPI was refused FOR, so the page can say what it saw. */
function pctRejected(m, co, id) {
  const v = kpi(m, co, id);
  return (v === null || (v >= -0.01 && v <= 100.01)) ? null : v;
}

/** A share worked out from the section's own columns. Null, never a zero. */
function shareOf(part, whole) {
  const p = Number(part), w = Number(whole);
  return (isFinite(p) && isFinite(w) && w !== 0) ? 100 * p / w : null;
}

/** A `<a class="cvcode">C-0019</a>` linked to methodology.html. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + src + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a chart: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/**
 * charts.js hands an `href` callback the ORIGINAL item object (`item.src` in
 * its internals is already unwrapped for us). Accept both shapes so the links
 * survive either reading.
 */
function cardOf(o) {
  if (!o) return null;
  return o.CARD_CODE || (o.src && o.src.CARD_CODE) || null;
}
function stepKey(s) {
  if (!s) return null;
  return s.k || (s.src && s.src.k) || null;
}

/** Read the page's own URL state: which cards, which extra filter, which sort. */
function urlState() {
  let p;
  try { p = new URLSearchParams(window.location.search); } catch (e) { p = new URLSearchParams(); }
  const kind = String(p.get('kind') || '').toUpperCase();
  let filter = p.get('filter') || '';
  if (!filter && p.get('bucket') === 'B0_NOTDUE') filter = 'B0_NOTDUE>0';
  if (!filter && p.get('min') === '1') filter = 'ADJ_OVERDUE_60PLUS>0';
  if (!filter && p.get('flag') === 'MIGRATED') filter = 'MIGRATED_OPEN>0';
  if (!filter && p.get('carrying') === '1') filter = 'ADJ_OPEN>0';
  return {
    kind: KIND_SETS.some(k => k.key === kind) ? kind : 'TRADE',
    filter: filter,
    sort: p.get('sort') || '',
    dir: p.get('dir') || 'desc'
  };
}

/** Rewrite one query parameter in place and re-render. No navigation. */
function setParam(name, value) {
  try {
    const url = new URL(window.location.href);
    if (value === null || value === '') url.searchParams.delete(name);
    else url.searchParams.set(name, value);
    window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
  } catch (e) { /* a browser without URL still re-renders below */ }
  render();
}

/** `COL>0` style row predicates, as the section's drill-downs hand them over. */
function parseFilter(src) {
  const m = /^\s*([A-Z0-9_]+)\s*(>=|<=|>|<|=)\s*(-?[\d.]+)\s*$/.exec(String(src || ''));
  if (!m) return null;
  const col = m[1], op = m[2], n = Number(m[3]);
  if (!(col in COLS)) return null;
  const f = function (r) {
    const v = Number(scale(r[col], col));
    if (!isFinite(v)) return false;
    return op === '>' ? v > n : op === '<' ? v < n : op === '>=' ? v >= n
         : op === '<=' ? v <= n : v === n;
  };
  f.label = COLS[col][0] + ' ' + op.replace('>=', 'at least ').replace('<=', 'at most ') + ' ' + n;
  return f;
}

/* ══ 3. render ═══════════════════════════════════════════════════════════ */

async function render() {
  const co = company();
  const main = document.getElementById('main');
  const [m, d, der] = await Promise.all([
    manifest(), slice(SECTION, co), derivations(co)
  ]);
  const summary = d.summary || [];
  const detail  = d.detail  || [];
  const asOf = d.as_of || (m && m.as_of) || null;

  main.innerHTML = '';
  const add = n => { if (n) main.appendChild(n); return n; };

  add(crumb([
    { label: 'Board', href: hrefSection('index.html', co) },
    { label: 'Receivables' }
  ]));

  add(h(
    '<div class="pagehead">' +
      '<div class="ctx">Customer ageing <span class="sep">·</span> OINV · OCRD · ORCT · ORIN' +
        (asOf ? ' <span class="sep">·</span> as of ' + esc(asOf) : '') + '</div>' +
      '<h1>What customers really owe JIVO</h1>' +
      '<p class="lede">Aged on the invoice’s due date, after the cash already banked and the credit ' +
      'notes already raised have been netted off the oldest invoices first, and after JIVO’s own ' +
      'branch, sister-company and staff accounts have been lifted out of “debtors”. SAP’s own A/R ' +
      'ageing report does neither, which is why its number is an order of magnitude larger on two ' +
      'of the three books.</p>' +
    '</div>'
  ));

  /* -- the section could not be read: say so, never print a zero ---------- */
  if (d.error || !summary.length) {
    add(empty({
      what: 'SAP returned no customer accounts for this book.',
      why: 'HANA’s GROUPING SETS emits no grand-total row over empty input, so an empty book is ' +
           'zero rows — not a roll-up row of zeros. All three books have always returned five ' +
           'rows, so nothing here means a broken build, and it is certainly not a nil receivable.' +
           (d.error ? ' Reader’s error: ' + d.error : ''),
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, null);
    return;
  }

  /* -- the five rows, keyed. TOT is the roll-up; never the sum of the rest -- */
  const byKind = {};
  summary.forEach(function (r) { if (r && r.KIND) byKind[String(r.KIND)] = r; });
  const TOT   = byKind[TOTAL_KIND] || null;
  const TRADE = byKind.TRADE || null;
  const present = KINDS.filter(k => byKind[k]);
  const missing = KINDS.filter(k => !byKind[k]);

  if (!TOT) {
    add(empty({
      what: 'The roll-up row is missing — book totals are not computed.',
      why: 'The KIND rows are here but the GROUPING SETS () row (KIND = “ZZ_TOTAL”) is not. The ' +
           'page will NOT sum the four kinds into a headline: the roll-up is absent only when the ' +
           'query’s shape changed, and silently substituting a sum would hide that.',
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
  }

  const st = urlState();
  const dTrade   = detail.filter(r => r.ACCT_KIND === 'TRADE');
  const dOwed    = dTrade.filter(r => Number(r.ADJ_OPEN) > 0);
  const dAdvance = dTrade.filter(r => Number(r.CUSTOMER_ADVANCE) > 0);
  const R0 = detail.length ? detail[0] : null;         // CO_* live here, once

  /* ── 3.1 headline KPIs ───────────────────────────────────────────────── */
  const tradeOpen = kpi(m, co, 'ar-trade-open');
  const rawOpen   = kpi(m, co, 'ar-trade-raw-open');
  const overdue   = kpi(m, co, 'ar-trade-overdue-60p');
  const migrated  = kpi(m, co, 'ar-migrated-open');
  const advRaw    = kpi(m, co, 'ar-trade-advances-held');
  const advShown  = (advRaw === null) ? null : Math.abs(advRaw);
  const advDetail = total(dAdvance, 'CUSTOMER_ADVANCE');

  /* the two share KPIs, each with the figure this section's own columns give */
  const od60Share    = pctKpi(m, co, 'ar-overdue-60p-share');
  const od60ShareBad = pctRejected(m, co, 'ar-overdue-60p-share');
  const od60ShareOwn = TRADE ? shareOf(TRADE.OD60P_INR, TRADE.EFF_OPEN_INR) : null;
  const sapShare     = pctKpi(m, co, 'ar-sap-overstatement-share');
  const sapShareBad  = pctRejected(m, co, 'ar-sap-overstatement-share');
  const sapShareOwn  = TRADE ? shareOf(TRADE.UNAPPLIED_CREDIT_INR, TRADE.RAW_OPEN_INR) : null;

  add(kpiRow([
    { id:'ar-trade-open', label:'Customers owe JIVO', value:tradeOpen, unit:'INR',
      corr: rawOpen, sub:'is what SAP’s open invoices add up to', tone:'bad',
      title:'Credit-adjusted and capped at the ledger debit: the ledger’s word, not the document status’.' },
    { id:'ar-trade-overdue-60p', label:'Of that, more than 60 days overdue', value:overdue, unit:'INR', tone:'bad',
      sub:'a LOWER BOUND — the bucket split assumes oldest-invoice-first' },
    { id:'ar-overdue-60p-share', label:'Share already 61 d + overdue', value:od60Share, unit:'pct' },
    { id:'ar-sap-overstatement-share', label:'Of SAP’s open A/R, not really owed', value:sapShare, unit:'pct',
      tone:'warn', sub:'already banked, or credited, and never matched to the invoice' },
    { id:'ar-trade-eff-customers', label:'Customers actually carrying it', value:kpi(m, co, 'ar-trade-eff-customers'), unit:'count',
      sub: 'of ' + num(dTrade.length) + ' trade cards on file' },
    { id:'ar-trade-advances-held', label:'Customer money JIVO is holding', value:advShown, unit:'INR', tone:'warn',
      sub:'their cash, sitting against no invoice',
      title:'Shown POSITIVE. The summary column stores this money negative (JIVO’s sign convention); the per-customer column stores it positive.' }
  ]));

  [['ar-overdue-60p-share', 'Share already 61 d + overdue', od60ShareBad, od60ShareOwn,
    'the 61-days-and-over buckets ÷ the credit-adjusted trade receivable (OD60P_INR ÷ EFF_OPEN_INR)'],
   ['ar-sap-overstatement-share', 'Of SAP’s open A/R, not really owed', sapShareBad, sapShareOwn,
    'the unmatched credit ÷ what SAP calls open (UNAPPLIED_CREDIT_INR ÷ RAW_OPEN_INR)']
  ].forEach(function (x) {
    const id = x[0], label = x[1], bad = x[2], own = x[3], how = x[4];
    if (bad === null) return;
    add(empty({
      what: '“' + label + '” is not printed for this book — the build published it as a rupee figure.',
      why: 'The KPI ' + id + ' is declared a percentage and carries ' + moneyFull(bad) + ' — that is ' +
           (Math.abs(bad - (Number(TRADE && TRADE.OD60P_INR) || NaN)) < 1
             ? 'this book’s overdue AMOUNT, not its share'
             : 'not a share of anything') +
           ', and rendering it verbatim would put “' + Number(bad).toFixed(2) + '%” on the board. ' +
           'Nothing is shown in its place at the top of the page. ' +
           (own === null
             ? 'This section’s own columns cannot produce the share either.'
             : 'Worked out here from this section’s own columns instead — ' + how + ' — it is ' +
               own.toFixed(2) + '%. That figure is computed on this page, is not the published KPI, ' +
               'and carries no cross-check.'),
      href: hrefDerivation(id, co),
      hrefLabel: 'See what the build recorded'
    }));
  });

  if (advRaw !== null && advRaw < 0) {
    add(empty({
      what: 'The advances figure is published with the opposite sign for this book.',
      why: 'The build’s KPI carries ' + moneyFull(advRaw) + ' — the summary’s own negative ledger-credit ' +
           'sign — where the other books publish it positive. This page shows the money held as a ' +
           'POSITIVE figure, which is what the per-customer column says: ' + inr(advDetail) + ' across ' +
           num(dAdvance.length) + ' trade cards. The two routes agree on the amount and disagree on the ' +
           'sign, which is why the cross-check dot beside it is red.',
      href: hrefDerivation('ar-trade-advances-held', co),
      hrefLabel: 'See both routes'
    }));
  }

  add(h(
    '<div class="caveat">' +
      '<b>Two corrections hold this page up.</b> ' + cv('C-0019') +
      ' — at JIVO an invoice keeps <code>DocStatus = O</code> long after the money landed, because ' +
      'receipts are posted on account and settlements are posted as journal entries that nobody ' +
      'matches back to the document. A naive ageing overstates the book 1.3× to 7.5×. Every figure ' +
      'here is therefore aged from the customer’s <b>ledger balance</b> (<code>OCRD.Balance</code>), ' +
      'not from the document status. ' + cv('C-0005') +
      ' — intercompany is <b>23 named group CardCodes</b>, not one. They are lifted out of the trade ' +
      'headline but <b>retained and named</b> on this page, never silently dropped. ' +
      '<b>And the section’s own landmine:</b> the summary is five rows, the fifth being the roll-up ' +
      'of the other four — adding all five double-counts the book exactly.' +
    '</div>'
  ));

  /* ── 3.2 THE headline chart: the correction, drawn ───────────────────── */
  {
    const c = card('From what SAP calls open to what customers really owe',
      'RAW_OPEN_INR → EFF_OPEN_INR, five rows');

    if (!TOT || !TRADE) {
      c.appendChild(empty({
        what: 'The waterfall needs both the roll-up row and the trade row.',
        why: (!TOT ? 'The roll-up row (KIND = “ZZ_TOTAL”) is absent. ' : '') +
             (!TRADE ? 'The TRADE row is absent. ' : '') +
             'Neither is reconstructed from the others — that is exactly the substitution this ' +
             'section’s first trap warns about.'
      }));
    } else {
      const steps = [
        { label:'Open A/R invoices, as SAP reports them', value:TOT.RAW_OPEN_INR, kind:'base' },
        { label:'Banked or credited, never matched to the invoice', value:TOT.UNAPPLIED_CREDIT_INR, kind:'sub' },
        { label:'Credit-adjusted receivable, whole book', value:TOT.EFF_OPEN_INR, kind:'total', k:'ar-book-open-total' }
      ];
      KINDS.filter(k => k !== 'TRADE').forEach(function (k) {
        const row = byKind[k];
        if (!row || !(Number(row.EFF_OPEN_INR) > 0)) return;
        steps.push({ label:'Less ' + KIND_LABEL[k], value:row.EFF_OPEN_INR, kind:'sub', k:'ar-nontrade-open' });
      });
      steps.push({ label:'Owed by customers outside JIVO', value:TRADE.EFF_OPEN_INR, kind:'total', k:'ar-trade-open' });

      c.appendChild(waterfall(steps, {
        title: 'Whole customer book → outside customers, ' + companyLabel(co),
        href: s => stepKey(s) ? hrefDerivation(stepKey(s), co) : null
      }));

      const nonTrade = KINDS.filter(k => k !== 'TRADE' && byKind[k])
                            .map(k => ({ k: k, v: Number(byKind[k].EFF_OPEN_INR) || 0 }))
                            .filter(x => x.v > 0);
      const nonTradeSum = nonTrade.reduce((a, b) => a + b.v, 0);
      c.appendChild(cap(
        'Read it as one sentence. SAP’s open A/R invoices come to <b>' + esc(inr(TOT.RAW_OPEN_INR)) +
        '</b> (<code>RAW_OPEN_INR</code> on the roll-up row). <b>' + esc(inr(TOT.UNAPPLIED_CREDIT_INR)) +
        '</b> of that is money JIVO has already got — cash banked on account, or a credit note ' +
        'raised — that SAP never knocked off a specific invoice, so the invoice stayed “open”. ' +
        'That leaves <b>' + esc(inr(TOT.EFF_OPEN_INR)) + '</b> genuinely outstanding across every ' +
        'customer card in the book. ' +
        '<b>The deductions that follow are a different kind of thing from the first one.</b> The ' +
        'first is money that has already been received: it is in the bank, and nobody has to go and ' +
        'get it. What follows is money still genuinely outstanding — but owed by parts of JIVO ' +
        'itself: ' +
        nonTrade.map(x => esc(inr(x.v)) + ' by ' + esc(KIND_PHRASE[x.k])).join(', ') +
        '. Collecting that moves money between JIVO’s own pockets and changes nothing the group ' +
        'owns; it nets to zero the moment the three books are consolidated. ' +
        'Netting ' + esc(inr(nonTradeSum)) + ' of it out leaves <b>' + esc(inr(TRADE.EFF_OPEN_INR)) +
        '</b> owed by customers outside the group — the only figure a collections call should work from.'
      ));

      /* the same correction as one ratio, because the waterfall's first bar is
         off the top of the page on two of the three books */
      const rawT = Number(TRADE.RAW_OPEN_INR) || 0, effT = Number(TRADE.EFF_OPEN_INR) || 0;
      if (rawT > 0) {
        c.appendChild(meter(effT, rawT, {
          title: 'How much of SAP’s open trade A/R is real',
          label: 'really owed', maxLabel: 'open per SAP',
          warnAt: 0.5, badAt: 0.25, invert: false
        }));
        c.appendChild(cap(
          'The same correction as one fraction, on the trade book alone: <b>' +
          esc((100 * effT / rawT).toFixed(1)) + '%</b> of what SAP flags open is genuinely ' +
          'outstanding — a factor of <b>' + esc((rawT / effT).toFixed(1)) + '×</b> between the ' +
          'report and the ledger. This is the number that says how far a raw SAP A/R report can be ' +
          'trusted in this book, and it differs enormously between the three.'
        ));
      } else {
        c.appendChild(empty({
          what: 'The share of SAP’s open A/R that is real cannot be shown.',
          why: 'The trade row reports no open invoices at all, so there is no denominator to take a ' +
               'share of. That is not a 0% — it is an absent measurement.'
        }));
      }
    }
    add(c);
  }

  /* ── 3.3 the landmine, demonstrated rather than warned about ─────────── */
  {
    const c = card('Why this section’s summary must never be added up', 'GROUPING SETS · KIND · ZZ_TOTAL');
    const rows = summary.map(function (r) {
      return { KIND: String(r.KIND), v: Number(scale(r.EFF_OPEN_INR, 'EFF_OPEN_INR')) || 0 };
    });
    const allFive = rows.reduce((a, b) => a + b.v, 0);
    const fourSum = rows.filter(r => r.KIND !== TOTAL_KIND).reduce((a, b) => a + b.v, 0);
    const grid = h('<div class="minikpis"></div>');
    rows.forEach(function (r) {
      grid.appendChild(h(
        '<div class="mk"><div class="lab">' + esc(r.KIND === TOTAL_KIND ? 'ZZ_TOTAL — the roll-up' : (KIND_LABEL[r.KIND] || r.KIND)) + '</div>' +
        '<div class="val">' + esc(inr(r.v)) + '</div>' +
        '<div class="sub">' + esc(r.KIND === TOTAL_KIND
          ? 'the same book as the four rows above it, counted once more'
          : 'component row, KIND = ' + r.KIND) + '</div></div>'
      ));
    });
    c.appendChild(grid);
    c.appendChild(cap(
      'Five rows in one array. The four component kinds add to <b>' + esc(inr(fourSum)) +
      '</b>; the roll-up row says <b>' + esc(inr(TOT ? TOT.EFF_OPEN_INR : null)) +
      '</b> — that agreement, to the paisa, is the section’s own reconciliation test. ' +
      'Adding <i>all five</i> gives <b>' + esc(inr(allFive)) + '</b>' +
      (TOT && Number(TOT.EFF_OPEN_INR) ?
        ', which is <b>' + esc((100 * allFive / Number(TOT.EFF_OPEN_INR)).toFixed(2)) +
        '%</b> of the book — exactly twice' : '') +
      '. It reads like a data error and it is not: it is the same money counted once as its kind ' +
      'and once again in the total. Every consumer of this file must filter on <code>KIND</code>.' +
      (missing.length
        ? ' <b>Note:</b> this book has no row at all for ' + missing.map(k => esc(KIND_PHRASE[k])).join(' and none for ') +
          ' — all four kinds existed in all three books when the section was verified, so an ' +
          'absent kind means the classification changed and is worth a look.'
        : '')
    ));
    add(c);
  }

  /* ── 3.4 ageing posture, by kind ─────────────────────────────────────── */
  {
    const c = card('Where the money sits, by age', 'NOTDUE_INR … D365P_INR, by KIND');
    const bars = present.map(function (k) {
      const r = byKind[k];
      const o = { KIND: KIND_LABEL[k] };
      let t = 0;
      SUM_BUCKETS.forEach(function (b) {
        o[b] = Number(scale(r[b], b)) || 0;
        t += o[b];
      });
      return t > 0 ? o : null;
    }).filter(Boolean);

    if (bars.length) {
      c.appendChild(stackedBars(bars, {
        labelKey: 'KIND', sort: false, keys: SUM_BUCKETS,
        title: 'Credit-adjusted receivable by ageing bucket'
      }));
      const share = (od60Share !== null) ? od60Share : od60ShareOwn;
      const shareIsOurs = (od60Share === null && od60ShareOwn !== null);
      const fullyOverdue = present.filter(function (k) {
        const r = byKind[k];
        return Number(r.EFF_OPEN_INR) > 0 && Number(r.NOTDUE_INR) === 0;
      });
      c.appendChild(cap(
        'One bar per kind of account, split across the seven buckets on the invoice’s <b>due date</b>. ' +
        'Not-due is brand green because it is a <i>state</i>, not the first step of the ramp; the ramp ' +
        'itself runs cool → hot with age. ' +
        (share === null ? '' :
          '<b>' + esc(Number(share).toFixed(1)) + '%</b> of what outside customers owe ' +
          esc(companyLabel(co)) + ' is already more than 60 days past due' +
          (shareIsOurs ? ' (worked out on this page — the build’s own share figure for this book is ' +
                         'not a percentage, see the panel above)' : '') + '. ') +
        (fullyOverdue.length
          ? 'Nothing at all sits in the not-due bucket for <b>' +
            esc(fullyOverdue.map(k => KIND_PHRASE[k]).join(', ')) + '</b> — that is real, not a ' +
            'missing segment: those balances are 100% past due. '
          : '') +
        '<b>Every overdue figure here is a lower bound.</b> The total is a measurement — it is the same ' +
        'to the paisa however the credit is allocated — but the split across buckets is an assumption. ' +
        'Consume the credit newest-invoice-first instead of oldest-first and Mart’s 60-day-plus figure ' +
        'moves 28×, Oil’s 1.18× and Beverages’ 1.01×.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No ageing buckets to draw.',
        why: 'Every bucket column is zero on every kind in this book. Check the build before reading ' +
             'that as “nothing is overdue” — the ledger debit above says money is outstanding.'
      }));
    }
    add(c);
  }

  /* ── 3.5 whose money is in "debtors" ─────────────────────────────────── */
  {
    const c = card('Whose money is in “debtors”', 'EFF_OPEN_INR by KIND, roll-up excluded');
    const slices = present.map(k => ({
      label: KIND_LABEL[k] + ' (' + num(byKind[k].N_EFF_CUSTOMERS) + ')',
      value: Number(scale(byKind[k].EFF_OPEN_INR, 'EFF_OPEN_INR')) || 0,
      kind: k
    })).filter(s => s.value > 0);

    if (slices.length) {
      c.appendChild(donut(slices, {
        title: 'The whole customer book, by kind of account',
        centerLabel: 'debtors'
      }));
      const nonTrade = kpi(m, co, 'ar-nontrade-open');
      const book = TOT ? Number(TOT.EFF_OPEN_INR) : null;
      const ownShare = (nonTrade !== null && book) ? 100 * nonTrade / book : null;
      c.appendChild(cap(
        (ownShare === null ? '' :
          '<b>' + esc(ownShare.toFixed(1)) + '% of this book’s “debtors” is JIVO’s own money</b> — ' +
          esc(inr(nonTrade)) + ' across its GST branches, its sister companies and its employees’ ' +
          'imprest accounts. ') +
        'The roll-up row is excluded from the ring, or the chart would show the book twice. ' +
        'This is the fastest way to stop somebody quoting the whole-book figure as a receivable: ' +
        'the branches are JIVO’s own state registrations, and the intercompany slice is one JIVO ' +
        'company owing another — real money, moved between pockets of the same group, and it ' +
        'nets to nothing when the three books are consolidated.'
      ));
    } else {
      c.appendChild(empty({
        what: 'Nothing outstanding on any kind of account.',
        why: 'Every kind’s credit-adjusted balance is zero. That has never been true of any of the ' +
             'three books — check the build rather than reading it as a clean ledger.'
      }));
    }
    add(c);
  }

  /* ── 3.6 concentration ───────────────────────────────────────────────── */
  {
    const c = card('How few customers this really is', 'ADJ_OPEN, outside customers only');
    if (!detail.length) {
      c.appendChild(detailMissing(d, co));
    } else if (dOwed.length) {
      c.appendChild(pareto(dOwed.map(r => ({
        label: r.CARD_NAME || r.CARD_CODE, value: Number(r.ADJ_OPEN), CARD_CODE: r.CARD_CODE
      })), {
        title: 'Ranked by what is really owed, with the running share',
        top: 10,
        href: it => cardOf(it) ? hrefParty(cardOf(it), co) : null
      }));
      const ranked = dOwed.slice().sort((a, b) => b.ADJ_OPEN - a.ADJ_OPEN);
      const bookT = total(dOwed, 'ADJ_OPEN');
      const topShare = pctKpi(m, co, 'ar-top-customer-share');
      let need80 = 0, run = 0;
      for (const r of ranked) { run += Number(r.ADJ_OPEN) || 0; need80++; if (bookT && run >= 0.8 * bookT) break; }
      c.appendChild(cap(
        'Bars are each customer’s share of the outside receivable; the line is the running total. ' +
        '<b>' + esc(num(need80)) + ' card' + (need80 === 1 ? '' : 's') + ' reach' + (need80 === 1 ? 'es' : '') +
        ' 80% of this book</b>' +
        (topShare === null ? '' :
          ', and the largest single customer — ' + esc(ranked[0].CARD_NAME || ranked[0].CARD_CODE) +
          ' — is ' + esc(Number(topShare).toFixed(1)) + '% of it on its own') +
        '. Collections here is a short list of phone calls, not a campaign across ' +
        num(dTrade.length) + ' customer cards. Only the ' + num(dOwed.length) +
        ' trade cards that still carry money are ranked: the ' + num(dTrade.length - dOwed.length) +
        ' others are on file because of a balance, an unmatched receipt or an open credit note.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No outside customer is carrying a receivable in this book.',
        why: 'Every trade card’s credit-adjusted balance is zero or an advance held. Read that ' +
             'against the ledger debit above before believing it.'
      }));
    }
    add(c);
  }

  /* ── 3.7 the collection list ─────────────────────────────────────────── */
  {
    const c = card('The collection list — more than 60 days overdue', 'ADJ_OVERDUE_60PLUS');
    if (!detail.length) {
      c.appendChild(detailMissing(d, co));
    } else {
      const late = dTrade.filter(r => Number(r.ADJ_OVERDUE_60PLUS) > 0)
                         .sort((a, b) => b.ADJ_OVERDUE_60PLUS - a.ADJ_OVERDUE_60PLUS);
      if (late.length) {
        c.appendChild(hbars(late.map(r => ({
          name: r.CARD_NAME || r.CARD_CODE, value: Number(r.ADJ_OVERDUE_60PLUS), CARD_CODE: r.CARD_CODE
        })), {
          title: 'Top overdue balances, 61 days and over', top: 12, color: '--age5',
          href: it => cardOf(it) ? hrefParty(cardOf(it), co) : null
        }));
        const freeSample = late.filter(r => /FREE\s*SAMPLE/i.test(String(r.CARD_NAME || '')));
        c.appendChild(cap(
          'This is the panel an operator prints. ' + num(late.length) + ' outside customers carry ' +
          'something more than 60 days past due, worth ' + esc(inr(total(late, 'ADJ_OVERDUE_60PLUS'))) +
          ' in all. <b>The ranking is FIFO-dependent</b>: the ledger proves how much credit each ' +
          'customer has, but WHICH invoices it settled is inferred, oldest due date first. The ' +
          'amount owed is exact; how old it is, is a lower bound. ' +
          (freeSample.length
            ? '<b>One name needs a footnote.</b> <code>' + esc(freeSample[0].CARD_CODE) + '</code> ' +
              esc(freeSample[0].CARD_NAME) + ' carries ' + esc(inr(freeSample[0].ADJ_OVERDUE_60PLUS)) +
              ' over 60 days and is scored TRADE — nothing in its group or its name marks it internal. ' +
              'It is almost certainly not collectable and has never been checked with Accounts.'
            : '')
        ));
      } else {
        c.appendChild(empty({
          what: 'Nothing outside the group is more than 60 days overdue in this book.',
          why: 'A real, healthy zero — every trade card’s outstanding balance sits in the not-due, ' +
               '1–30 or 31–60 bucket. Keep the FIFO caveat in mind: a different allocation of the ' +
               'same ledger credit could push some of it past 60 days.',
          href: hrefDerivation('ar-trade-overdue-60p', co),
          hrefLabel: 'See how the buckets are built'
        }));
      }
    }
    add(c);
  }

  /* ── 3.8 big and old ─────────────────────────────────────────────────── */
  {
    const c = card('Age against size — what to chase first', 'DAYS_OLDEST × ADJ_OPEN');
    if (!detail.length) {
      c.appendChild(detailMissing(d, co));
    } else {
      const pts = dOwed.filter(r => r.DAYS_OLDEST !== null && r.DAYS_OLDEST !== undefined)
                       .map(r => ({
                         x: Number(r.DAYS_OLDEST), y: Number(r.ADJ_OPEN),
                         label: r.CARD_NAME || r.CARD_CODE,
                         group: r.CUSTOMER_GROUP || '(no group)',
                         CARD_CODE: r.CARD_CODE
                       }));
      const dropped = dOwed.length - pts.length;
      if (pts.length) {
        c.appendChild(scatter(pts, {
          title: 'One dot per outside customer still carrying money',
          xLabel: 'age of the oldest item STILL OWED (days)',
          yLabel: 'really outstanding',
          href: p => cardOf(p) ? hrefParty(cardOf(p), co) : null
        }));
        const oldest = pts.slice().sort((a, b) => b.x - a.x)[0];
        const biggest = pts.slice().sort((a, b) => b.y - a.y)[0];
        c.appendChild(cap(
          'The top-right quadrant is the work queue: large and long overdue. Big-and-old separates ' +
          'instantly from big-and-current, which a sorted table cannot do in one look — here <b>' +
          esc(oldest.label) + '</b> sits at ' + num(oldest.x) + ' days with ' + esc(inr(oldest.y)) +
          ' outstanding, while <b>' + esc(biggest.label) + '</b> is the largest at ' + esc(inr(biggest.y)) +
          ' and ' + num(biggest.x) + ' days. <b>The x-axis is POST-credit</b> — it is the oldest ' +
          'invoice that still carries money after the ledger credit was consumed, not the oldest open ' +
          'document, and it jumps forward the moment a receipt is matched. It therefore means something ' +
          'different from the identically-named column on the payables page, which reports the raw ' +
          'oldest bill; do not compare the two. ' +
          (dropped > 0
            ? num(dropped) + ' card' + (dropped === 1 ? '' : 's') + ' owed money with no dated open ' +
              'item at all — left out rather than drawn at zero days.'
            : '')
        ));
      } else {
        c.appendChild(empty({
          what: 'Nothing to plot.',
          why: 'No outside customer in this book is both carrying a balance and has a dated open ' +
               'invoice behind it. Cards with nothing outstanding carry a NULL date by design and ' +
               'are never drawn at zero days, which would read as “due today”.'
        }));
      }
    }
    add(c);
  }

  /* ── 3.9 the cause: cash banked and never matched ────────────────────── */
  {
    const c = card('Where the unmatched cash is sitting', 'UNAPPLIED_RCPT — the cause, not the effect');
    if (!detail.length) {
      c.appendChild(detailMissing(d, co));
    } else {
      const raw = dTrade.filter(r => Number(r.UNAPPLIED_RCPT) !== 0);
      const clamped = raw.filter(r => Number(r.UNAPPLIED_RCPT) > 0);
      const negatives = raw.filter(r => Number(r.UNAPPLIED_RCPT) < 0);
      if (clamped.length) {
        c.appendChild(treemap(clamped.map(r => ({
          label: r.CARD_NAME || r.CARD_CODE, value: Number(r.UNAPPLIED_RCPT), CARD_CODE: r.CARD_CODE
        })), {
          title: 'Customer receipts banked and never knocked off an invoice',
          color: 'single', top: 20,
          href: it => cardOf(it) ? hrefParty(cardOf(it), co) : null
        }));
        const ranked = clamped.slice().sort((a, b) => b.UNAPPLIED_RCPT - a.UNAPPLIED_RCPT);
        const drawn = ranked.slice(0, 20);
        const allCash = total(clamped, 'UNAPPLIED_RCPT');
        c.appendChild(cap(
          'Area is money, one tile per customer account. <b>' + esc(inr(allCash)) + ' of customer ' +
          'receipts across ' + num(clamped.length) + ' trade cards are in JIVO’s bank and matched to ' +
          'no invoice.</b> This is the operational <i>cause</i> of everything above: the invoices ' +
          'those receipts should have closed are the ones still reading <code>DocStatus = O</code>. ' +
          'It is also a backlog somebody can actually clear, account by account — which the ' +
          'equivalent ' + num(raw.length) + '-row table does not make obvious. ' +
          (clamped.length > drawn.length && allCash
            ? 'The ' + num(drawn.length) + ' largest accounts are drawn; they are ' +
              esc((100 * total(drawn, 'UNAPPLIED_RCPT') / allCash).toFixed(1)) + '% of the backlog, ' +
              'and the remaining ' + num(clamped.length - drawn.length) + ' cards are in the table ' +
              'below the chart. '
            : '') +
          '<b>Never subtract this from the receivable.</b> It is already inside the ledger balance the ' +
          'headline is capped at; subtracting it would produce a large negative receivable out of ' +
          'entirely correct data. ' +
          (negatives.length
            ? 'Cell areas cannot be negative, so ' + num(negatives.length) + ' card' +
              (negatives.length === 1 ? '' : 's') + ' with a rounding-paisa negative (' +
              esc(negatives.map(r => r.CARD_CODE).join(', ')) + ', ' +
              esc(moneyFull(total(negatives, 'UNAPPLIED_RCPT'))) + ') ' +
              (negatives.length === 1 ? 'is' : 'are') + ' left out of the picture and kept in the ' +
              'totals below.'
            : 'No card in this book carries a negative unmatched receipt, so nothing had to be clamped.')
        ));
      } else {
        c.appendChild(empty({
          what: 'No unmatched customer receipts on the trade cards in this book.',
          why: 'Every receipt SAP holds against an outside customer here has been matched to a ' +
               'document. That is the healthy state — and it is why this book’s raw-open figure and ' +
               'its real receivable sit closer together than the others.'
        }));
      }
    }
    add(c);
  }

  /* ── 3.10 intercompany, retained and named (C-0005) ──────────────────── */
  {
    const c = card('JIVO’s own accounts, named', 'C-0005 · retained and flagged, never dropped');
    if (!detail.length) {
      c.appendChild(detailMissing(d, co));
    } else {
      const byCard = {};
      detail.forEach(function (r) { byCard[String(r.CARD_CODE)] = r; });
      const named = (C0005[co] || []);
      const own = detail.filter(r => r.ACCT_KIND === 'BRANCH' || r.ACCT_KIND === 'INTERCO')
                        .sort((a, b) => b.ADJ_OPEN - a.ADJ_OPEN);

      if (own.length) {
        c.appendChild(table(own, {
          co: co,
          cols: ['CARD_CODE','CARD_NAME','CUSTOMER_GROUP','ACCT_KIND','OCRD_BALANCE','ADJ_OPEN','ADJ_OVERDUE_60PLUS'],
          labels: { CARD_CODE:COLS.CARD_CODE[0], CARD_NAME:COLS.CARD_NAME[0], CUSTOMER_GROUP:COLS.CUSTOMER_GROUP[0],
                    ACCT_KIND:COLS.ACCT_KIND[0], OCRD_BALANCE:COLS.OCRD_BALANCE[0],
                    ADJ_OPEN:COLS.ADJ_OPEN[0], ADJ_OVERDUE_60PLUS:COLS.ADJ_OVERDUE_60PLUS[0] },
          units:  { CARD_CODE:'code', CARD_NAME:'text', CUSTOMER_GROUP:'text', ACCT_KIND:'text',
                    OCRD_BALANCE:'INR', ADJ_OPEN:'INR', ADJ_OVERDUE_60PLUS:'INR' },
          links:  { CARD_CODE:'party', CARD_NAME:{ kind:'party', card:'CARD_CODE' } },
          sort: '-ADJ_OPEN', page: false, dense: true,
          total: ['OCRD_BALANCE','ADJ_OPEN','ADJ_OVERDUE_60PLUS'],
          caption: 'Branch and intercompany customer cards in this book'
        }));
      }

      const missingNamed = named.filter(cc => !byCard[cc]);
      const namedTrade   = named.filter(cc => byCard[cc] && byCard[cc].ACCT_KIND === 'TRADE');
      c.appendChild(cap(
        'C-0005 names <b>' + num(named.length) + ' related-party card' + (named.length === 1 ? '' : 's') +
        '</b> in this book (23 across the three). Every one of them that carries anything is above, ' +
        'flagged by <code>Kind</code> and lifted out of the trade headline — <b>and kept</b>, because ' +
        'the amount JIVO owes itself is a real number somebody has to reconcile at consolidation. ' +
        (missingNamed.length
          ? num(missingNamed.length) + ' named card' + (missingNamed.length === 1 ? '' : 's') + ' (' +
            esc(missingNamed.join(', ')) + ') ' + (missingNamed.length === 1 ? 'does' : 'do') +
            ' not appear at all: the section only keeps cards with an open invoice, a non-zero ' +
            'balance, an unmatched receipt or an open credit note, so an absent card is a card with ' +
            'nothing on it — not a card that was dropped. '
          : '') +
        (namedTrade.length
          ? '<b>' + esc(namedTrade.join(', ')) + '</b> ' + (namedTrade.length === 1 ? 'is' : 'are') +
            ' named by the correction but scored TRADE by this query’s name-and-group rule — read ' +
            'that as a classification gap, not as an outside customer. '
          : '') +
        'The rule is a heuristic, not a register: a group name containing BRANCH, or a card name ' +
        'starting JIVO. Oil’s <code>CUSTA000242</code> AKAL INFORMATION SYSTEMS reads TRADE here and ' +
        'INTERCO in both the payables and open-items queries — the one disagreement across 229 shared ' +
        'Oil cards, left unfixed deliberately because changing it in one file would break the ' +
        'summary-to-detail tie in the others.'
      ));
    }
    add(c);
  }

  /* ── 3.11 the broadcast company columns ──────────────────────────────── */
  {
    const c = card('The whole-book totals carried on every row', 'broadcast CO_* columns, read off one row');
    if (!R0) {
      c.appendChild(detailMissing(d, co));
    } else {
      const mk = h('<div class="minikpis"></div>');
      let shown = 0;
      CO_EXTRA.forEach(function (x) {
        const col = x[0], label = x[1], why = x[2];
        const v = R0[col];
        if (v === null || v === undefined || isNaN(Number(v))) return;
        shown++;
        mk.appendChild(h(
          '<div class="mk"><div class="lab">' + esc(label) + '</div>' +
          '<div class="val">' + esc(inr(Number(scale(v, col)))) + '</div>' +
          '<div class="sub">' + esc(why) + ' <code class="mono">' + esc(col) + '</code></div></div>'
        ));
      });
      if (shown) {
        c.appendChild(mk);
        c.appendChild(cap(
          'Raw source columns, not derived figures — each is read off a single row, and any row will do. ' +
          '<b>The eleven <code>CO_*</code> columns are company totals that the query’s window ' +
          'functions repeat, identically, on every one of the ' + num(detail.length) + ' rows.</b> ' +
          'Summing one down the table multiplies the company by the row count — ' +
          '<code>CO_ADJ_OPEN_TRADE</code> added up over this book would come to ' +
          esc(inr(Number(R0.CO_ADJ_OPEN_TRADE) * detail.length)) + ' instead of ' +
          esc(inr(R0.CO_ADJ_OPEN_TRADE)) + '. That is why they are not in the table below.'
        ));
      } else {
        c.appendChild(empty({
          what: 'The broadcast company columns are not in this build.',
          why: 'No CO_* column survived on the first detail row, so the whole-book totals cannot be ' +
               'read off it. The per-kind figures above come from the summary file and are unaffected.'
        }));
      }
    }
    add(c);
  }

  /* ── 3.12 whole-book KPIs + diagnostics ──────────────────────────────── */
  {
    const c = card('The whole book, and the diagnostics', 'every figure links to its derivation');

    c.appendChild(kpiRow([
      { id:'ar-book-open-total', label:'Credit-adjusted receivable, whole book', value:kpi(m, co, 'ar-book-open-total'), unit:'INR',
        sub:'outside customers plus JIVO’s own accounts' },
      { id:'ar-nontrade-open', label:'JIVO’s own accounts sitting in “debtors”', value:kpi(m, co, 'ar-nontrade-open'), unit:'INR',
        sub:'branches, sister companies and staff — flagged and kept' },
      { id:'ar-trade-ledger-debit', label:'Trade ledger debit — the ground truth', value:kpi(m, co, 'ar-trade-ledger-debit'), unit:'INR',
        sub:'Σ of every positive trade balance; the headline is capped at this' },
      { id:'ar-trade-unbacked-debit', label:'Owed, but no open invoice carries it', value:kpi(m, co, 'ar-trade-unbacked-debit'), unit:'INR',
        sub:'cannot be aged — the headline understates the debit book by this much', tone:'warn' }
    ]));

    c.appendChild(kpiRow([
      { id:'ar-trade-raw-open', label:'What SAP calls open, on trade customers', value:rawOpen, unit:'INR',
        sub:'the wrong number, kept visible on purpose', tone:'bad' },
      { id:'ar-trade-credit-applied', label:'Banked or credited, never matched to an invoice', value:kpi(m, co, 'ar-trade-credit-applied'), unit:'INR',
        sub:'the gap between document status and the general ledger' },
      { id:'ar-trade-notdue', label:'Not yet due', value:kpi(m, co, 'ar-trade-notdue'), unit:'INR',
        sub:'within terms, including due today' },
      { id:'ar-migrated-open', label:'Pre-SAP opening balances still open', value:(migrated === 0 ? null : migrated), unit:'INR',
        sub:'invoices dated 2024-09-30, the day Oil’s books were loaded' }
    ]));

    if (migrated === 0) {
      c.appendChild(empty({
        what: companyLabel(co) + ' never carried its A/R opening balances in as invoices.',
        why: 'There is nothing to migrate, so the go-live figure is a TRUE zero and is not printed as ' +
             '“₹0”, which would read as “the go-live invoices are all settled”. Only Oil loaded its ' +
             'openings as invoices, on 2024-09-30 — and its 365-day-plus bucket is 96.6% those ' +
             'openings, carrying their original 2017–2020 due dates. That is inherited history, not ' +
             'debt that rotted since go-live.',
        href: hrefDerivation('ar-migrated-open', co),
        hrefLabel: 'See how this is measured'
      }));
    }

    c.appendChild(kpiRow([
      { id:'ar-unapplied-receipts', label:'Customer cash never matched — diagnostic, NEVER subtract', value:kpi(m, co, 'ar-unapplied-receipts'), unit:'INR',
        sub:'already inside the ledger balance', tone:'warn' },
      { id:'ar-open-credit-notes', label:'Open sales credit notes — diagnostic, NEVER subtract', value:kpi(m, co, 'ar-open-credit-notes'), unit:'INR',
        sub:'also already inside the ledger balance', tone:'warn' },
      { id:'ar-trade-eff-invoices', label:'Invoices actually carrying the receivable', value:kpi(m, co, 'ar-trade-eff-invoices'), unit:'count',
        corr: kpi(m, co, 'ar-trade-sap-open-invoices'), sub:'invoices SAP still flags open' },
      { id:'ar-oldest-item-days', label:'Age of the oldest item still owed', value:kpi(m, co, 'ar-oldest-item-days'), unit:'days' }
    ]));

    /* ar-oldest-item-days is published without a value on all three books.
       Say so, and give the figure the per-customer rows do support. */
    if (kpi(m, co, 'ar-oldest-item-days') === null) {
      const aged = dOwed.filter(r => r.DAYS_OLDEST !== null && r.DAYS_OLDEST !== undefined);
      const oldest = aged.slice().sort((a, b) => Number(b.DAYS_OLDEST) - Number(a.DAYS_OLDEST))[0];
      c.appendChild(empty({
        what: 'This build published no value for the oldest item still owed.',
        why: 'The KPI carries a cross-check but no figure, so nothing is printed for it above rather ' +
             'than a zero or a dash that would read like “nothing is old”. ' +
             (oldest
               ? 'Computed on this page from the per-customer rows instead — not from the summary, and ' +
                 'not a substitute for the KPI: the oldest trade item still carrying money is ' +
                 num(oldest.DAYS_OLDEST) + ' days past due (' + esc(oldest.OLDEST_DUE || 'date not given') +
                 '), on ' + esc(oldest.CARD_NAME || oldest.CARD_CODE) + ', worth ' +
                 (money(oldest.ADJ_OPEN) || 'an amount that did not compute') + '.'
               : 'The per-customer rows carry no dated open item either, so the page has nothing to ' +
                 'offer in its place.') +
             (TRADE && TRADE.OLDEST_OPEN_DUE
               ? ' The summary’s own oldest due date for the trade book is ' + esc(TRADE.OLDEST_OPEN_DUE) + '.'
               : ''),
        href: hrefDerivation('ar-oldest-item-days', co),
        hrefLabel: 'See how it is meant to be measured'
      }));
    }

    c.appendChild(cap(
      'The dot beside each label is the cross-check: green means a second, independent route ' +
      'reproduced the figure, amber means no second route ran, red means the two disagree — and a ' +
      'red dot never hides the number. Hover it for both routes and the gap between them. ' +
      '<b>The struck-through counts are SAP’s uncorrected ones.</b> Pairing them with the corrected ' +
      'money re-commits the very error this section fixes: dividing the trade book by every invoice ' +
      'SAP flags open, rather than by the ones that actually carry it, understates the average ' +
      'invoice roughly ninefold on Oil.'
    ));
    add(c);
  }

  /* ── 3.13 the table ──────────────────────────────────────────────────── */
  {
    const c = card('Every customer card', SECTION + '.' + co + '.json · ' + num(detail.length) + ' rows');

    if (!detail.length) {
      c.appendChild(detailMissing(d, co));
      add(c);
    } else {
      const chips = h('<div class="chips" role="group" aria-label="Which cards to show"></div>');
      KIND_SETS.forEach(function (k) {
        const set = detail.filter(k.test);
        if (!set.length) return;
        const on = st.kind === k.key;
        const b = h('<button type="button" class="chip" aria-pressed="' + (on ? 'true' : 'false') + '">' +
          esc(k.label) + ' <span class="n">' + num(set.length) + '</span></button>');
        b.title = k.label + ': ' + num(set.length) + ' cards, ' + inr(total(set, 'ADJ_OPEN')) + ' really outstanding';
        b.addEventListener('click', function () { setParam('kind', k.key); });
        chips.appendChild(b);
      });
      const bar = h('<div class="toolbar"></div>');
      bar.appendChild(chips);
      c.appendChild(bar);

      const set = KIND_SETS.find(k => k.key === st.kind) || KIND_SETS[1];
      let shown = detail.filter(set.test);

      const extra = parseFilter(st.filter);
      if (extra) {
        shown = shown.filter(extra);
        const pill = h('<div class="toolbar"><span class="pill info">only ' + esc(extra.label) +
          '</span> <button type="button" class="btn sm">clear this filter</button></div>');
        pill.querySelector('button').addEventListener('click', function () {
          try {
            const url = new URL(window.location.href);
            ['filter','bucket','min','flag','carrying'].forEach(p => url.searchParams.delete(p));
            window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
          } catch (e) { /* still re-renders */ }
          render();
        });
        c.appendChild(pill);
      }

      const cols = Object.keys(COLS);
      const labels = {}, units = {};
      cols.forEach(function (k) { labels[k] = COLS[k][0]; units[k] = COLS[k][1]; });

      const sortCol = (st.sort && cols.indexOf(st.sort) >= 0) ? st.sort : 'ADJ_OPEN';
      c.appendChild(table(shown, {
        co: co,
        cols: cols,
        labels: labels,
        units: units,
        links: {
          CARD_CODE: 'party',
          CARD_NAME: { kind:'party', card:'CARD_CODE' }
        },
        sort: (st.dir === 'asc' ? '' : '-') + sortCol,
        filter: 'Find a customer by name, code or group…',
        facets: ['ACCT_KIND','CUSTOMER_GROUP'],
        total: ['OCRD_BALANCE','RECEIVABLE','CUSTOMER_ADVANCE','RAW_OPEN','CREDIT_APPLIED','ADJ_OPEN',
                'UNBACKED_CREDIT','MIGRATED_OPEN','BACKDATED_DUE_OPEN','ADJ_OVERDUE_60PLUS',
                'B0_NOTDUE','B1_1_30','B2_31_60','B3_61_90','B4_91_180','B5_181_365','B6_365PLUS',
                'UNAPPLIED_RCPT','OPEN_CN','N_OPEN_INV','N_UNAPPLIED_RCPT','N_OPEN_CN'],
        empty: {
          what: 'No card matches this cut.',
          why: 'The chips above filter a real, non-empty table — nothing matched this combination. ' +
               'That is not a zero receivable; widen the filter to see the rows that exist.'
        },
        caption: 'Customer ageing — one row per customer card'
      }));

      const effCust = kpi(m, co, 'ar-trade-eff-customers');
      const zeroButBilled = dTrade.filter(r => Number(r.ADJ_OPEN) === 0 && Number(r.N_OPEN_INV) > 0);
      c.appendChild(cap(
        '<b>The totals row adds up only the rows currently in view.</b> With every card shown it comes ' +
        'to ' + esc(inr(total(detail, 'ADJ_OPEN'))) + ' really outstanding — but ' +
        esc(inr(total(detail.filter(r => r.ACCT_KIND !== 'TRADE'), 'ADJ_OPEN'))) + ' of that is JIVO’s ' +
        'own money, which is why the page opens on outside customers. Sign convention on the ledger ' +
        'balance is JIVO’s: <b>positive means the customer owes JIVO</b>; negative means JIVO is ' +
        'holding their cash — and the advance column reports that same money positive, so never add ' +
        'the two. ' + num(zeroButBilled.length) + ' outside-customer cards still show open invoices in ' +
        'SAP while carrying nothing: the ledger credit absorbed them. ' +
        (effCust !== null && dOwed.length !== effCust
          ? '<b>' + num(effCust) + ' cards are counted as carrying the receivable while ' + num(dOwed.length) +
            ' rows here show a figure above zero</b> — the difference is sub-paise dust that is non-zero ' +
            'in SQL and rounds to 0.00 at two decimal places. Assert the money, never the headcount. '
          : '') +
        'Invoice-level drill-down is not in this section — it aggregates to the customer — so an ' +
        'individual invoice has to come from <a href="' +
        esc(hrefSection('open-item-list', co, { doctype:'AR_INV' })) + '">open items</a>, which caps ' +
        'how many it lists per document type.'
      ));
      add(c);
    }
  }

  /* ── 3.14 how to read this ───────────────────────────────────────────── */
  {
    const c = card('How to read this', 'every way a naive version of this page goes wrong');
    c.appendChild(h(
      '<p class="blurb">These are not caveats in the small-print sense. Each one is a specific, ' +
      'measured way that the obvious reading of this data produces a wrong number, found by ' +
      'attacking the query against live SAP.</p>'
    ));
    const ol = h('<div class="prose"><ol></ol></div>');
    const list = ol.querySelector('ol');
    TRAPS.forEach(function (t) { list.appendChild(h('<li>' + esc(rupee(t)) + '</li>')); });
    c.appendChild(ol);
    c.appendChild(h(
      '<p class="tnote">The corrections behind them: ' +
      ['C-0019','C-0005','C-0020','C-0021','C-0023'].map(cv).join(' ') +
      ' — each links to the full record on the methodology page.</p>'
    ));
    c.appendChild(note(SECTION));
    c.appendChild(note(SECTION + '-detail'));
    add(c);
  }

  /* ── 3.15 the SQL ────────────────────────────────────────────────────── */
  add(await sqlCard(der, co));

  paintFoot(m, co, asOf);
}

/** The per-customer file did not build: say which panel is affected, and why. */
function detailMissing(d, co) {
  return empty({
    what: 'The per-customer rows did not build for this book.',
    why: 'The five KIND roll-up rows are here, so the totals above are sound — but this panel needs ' +
         'one row per customer and the detail array is empty. The four KIND rows are NOT plotted in ' +
         'its place: they are not customers.' + (d && d.error ? ' Reader’s error: ' + d.error : ''),
    href: hrefSection('health', co),
    hrefLabel: 'Check the build’s health'
  });
}

/**
 * The queries themselves, behind a disclosure. Both files are consulted through
 * `sql/_index.json` FIRST: a fetch-and-fail logs a console 404 the page cannot
 * suppress, and the browser gate counts console errors as failures.
 */
async function sqlCard(der, co) {
  const c = card('The queries behind this page', SQL_FILES.map(f => f[0]).join(' · '));
  const host = h('<div></div>');
  c.appendChild(host);
  c.appendChild(h(
    '<p class="tnote">Read-only, and reviewed adversarially before either was allowed near the board. ' +
    'The section is two queries: one aggregates to the four account kinds plus the GROUPING SETS ' +
    'roll-up, the other to one row per customer card. Money columns are plain rupees — the display ' +
    'divides by a lakh or a crore, the query never does. Neither file is edited by the dashboard ' +
    '(CONTRACT §0.6): changing one of these silently changes the books.</p>'
  ));

  let have = null;
  try {
    const r = await fetch('sql/_index.json', { cache: 'no-cache' });
    if (r.ok) have = await r.json();
  } catch (e) { /* no index published — fall back to the derivation excerpt */ }

  let drew = 0;
  for (const pair of SQL_FILES) {
    const file = pair[0], what = pair[1];
    const id = file.replace(/^sql\//, '').replace(/\.sql$/, '');
    if (Array.isArray(have) && have.indexOf(id) === -1) continue;
    let text = null;
    try {
      const r = await fetch(file, { cache: 'no-cache' });
      if (r.ok) text = await r.text();
    } catch (e) { /* fall through to the excerpt below */ }
    if (!text) continue;
    host.appendChild(sqlBox(file + ' — ' + what, text, file));
    drew++;
  }

  if (!drew) {
    const dv = der && (der['ar-trade-open'] || der['ar-book-open-total']);
    if (dv && dv.sql && dv.sql.text) {
      host.appendChild(sqlBox(
        'the excerpt carried in the derivation record' +
        (Array.isArray(dv.sql.lines) ? ' (lines ' + dv.sql.lines[0] + '–' + dv.sql.lines[1] + ')' : ''),
        dv.sql.text, dv.sql.file || SQL_FILES[0][0]));
    } else {
      host.appendChild(empty({
        what: 'The query text is not published with this build.',
        why: 'Neither SQL file is listed in sql/_index.json and no derivation record carried an ' +
             'excerpt. The files themselves are in the repo at ' + SQL_FILES.map(f => f[0]).join(' and ') + '.'
      }));
    }
  }
  return c;
}

/** One collapsed, line-numbered SQL file. */
function sqlBox(title, text, file) {
  const box = h('<details class="sqlbox-host"><summary class="btn sm">Show ' + esc(title) + '</summary></details>');
  box.style.margin = '0 0 10px';
  const body = h('<div style="margin-top:12px"></div>');
  box.appendChild(body);
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const html = lines.map(function (ln, i) {
    return '<span class="ln">' + (i + 1) + '</span>' + esc(ln);
  }).join('\n');
  body.appendChild(h('<div class="sqlbox"><pre><code>' + html + '</code></pre></div>'));
  body.appendChild(h('<div class="sqlfoot"><span>' + esc(file) + '</span><span>' +
    num(lines.length) + ' lines</span><span>reads OINV · OCRD · OCRG · ORCT · ORIN</span></div>'));
  return box;
}

/** The page footer: where the numbers came from, and how old they are. */
function paintFoot(m, co, asOf) {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
      '<div><b>Section</b> — customer-ageing, five roll-up rows plus one row per customer card, ' +
        'from <code>OINV</code> (A/R invoices), <code>OCRD</code>/<code>OCRG</code> (customer master ' +
        'and groups), <code>ORCT</code> (receipts) and <code>ORIN</code> (credit notes). The last two ' +
        'are diagnostics and are never netted off.</div>' +
      '<div><b>Book</b> — ' + esc(companyLabel(co)) + '. Figures from one company are not comparable ' +
        'with another’s, and adding the three together double counts JIVO’s inter-book trading — ' +
        'each book carries the others as customers.</div>' +
      '<div><b>Freshness</b> — ' + (asOf ? 'as of ' + esc(asOf) + '. ' : '') +
        (gen ? 'Built ' + esc(ago(gen)) + ' (' + esc(gen) + '). ' : 'Build time unknown. ') +
        'A back-dated as-of is not a point-in-time A/R: SAP keeps no per-date balance history, so an ' +
        'older cut-off ages today’s open items against an older calendar.</div>' +
      '<div><b>Read-only</b> — this board issues no write to SAP, ever (CONTRACT §0.2).</div>' +
    '</div>' +
    '<p><a href="' + esc(hrefSection('methodology.html', co)) + '">Methodology and the corrections</a> · ' +
    '<a href="' + esc(hrefDerivation('ar-trade-open', co)) + '">How the headline is derived</a> · ' +
    '<a href="' + esc(hrefSection('open-item-list', co, { doctype:'AR_INV' })) + '">Open A/R documents</a> · ' +
    '<a href="' + esc(hrefSection('payables', co)) + '">The other side: what JIVO owes</a> · ' +
    '<a href="' + esc(hrefSection('health', co)) + '">Build health</a></p>';
}

shell({

render().catch(function (e) {
  const main = document.getElementById('main');

    main.appendChild(empty({

  try { console.error('[receivables]', e); } catch (e2) { /* ignore */ }
});

onRefresh(render);
