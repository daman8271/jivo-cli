/* ────────────────────────────────────────────────────────────────────────────
   cash-sale.html — the Cash Sale section.

   This section is FACETED: eight different cuts are stacked in one result set
   and identified by SECTION / SORT_KEY / ROW_KEY. Rows from different SECTIONs
   are different views of the same money — or, for the tender and G/L cuts, of
   entirely different money. The page therefore never sums the slice; every
   figure names the block it came from.

   Three things this page exists to hold in front of the reader:
     1. CASH IS THE TENDER, NOT THE CUSTOMER. Invoices (INV_*), receipts
        (TXN_CNT / CASH_TENDER_INR) and the ledger (GL_*) are three separate
        populations. v1 showed only the first and Mart read "Cash sales ₹0"
        while collecting ₹1.42 Cr of physical cash.
     2. "OPEN" IS NOT "OWED". Cash-sale invoices never close in SAP. v1
        published Beverages' ₹43.67 L of open residue as "still unpaid" for an
        account that is ₹10.86 L in CREDIT.
     3. EVERY MONEY FIGURE GOES THROUGH core.money(). v1 shipped 128 money
        cells as raw float noise (1358792.4106999983) because cash-sale.sql was
        the only query in the pipeline with no ROUND(). No raw Number is ever
        printed here.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */

  "FOUR KPIs are DERIVED — their `live` value is NOT agg(column) and a page that renders the named column raw will publish the wrong number: cash-sale-ar-control-gl-net = GL_DEBIT_INR − GL_CREDIT_INR (raw column gives Oil ₹35,92,328 instead of ₹8,901.14); cash-till-gl-net = Σ GL_DEBIT_INR − Σ GL_CREDIT_INR (raw gives Oil ₹1,48,81,804 instead of −₹10,11,604); cash-sale-open-overstatement = OPEN_INR − LEDGER_BAL_INR; cash-sale-avg-ticket = INV_GROSS_INR ÷ INV_CNT; and cash-sale-card-count is COUNT(rows), not a sum of ROW_KEY. Read `formula`, never `column` alone. Every other KPI is agg(column) over row_filter and verified as such."
];

/**
 * The section's KPI registry. `calc` re-derives the figure ON THIS PAGE from
 * the published rows, following the spec's own formula — four of these are
 * DERIVED and a page that renders the named column raw publishes the wrong
 * number (trap 26). The manifest's published value is compared against this
 * in the agreement panel, never silently preferred.
 */
const KPIS = [
  { id:'cash-sale-turnover-net', label:'Cash sales, net of GST', unit:'INR',
    from:'9_TOTAL A · TURNOVER_NET_INR', calc:v => val(v.A,'TURNOVER_NET_INR') },
  { id:'cash-sale-gross', label:'Cash sales, gross of GST', unit:'INR',
    from:'9_TOTAL A · INV_GROSS_INR', calc:v => val(v.A,'INV_GROSS_INR') },
  { id:'cash-sale-invoice-count', label:'Cash-sale invoices', unit:'count',
    from:'9_TOTAL A · INV_CNT', calc:v => val(v.A,'INV_CNT') },
  { id:'cash-sale-returns', label:'Returns against cash sales', unit:'INR',
    from:'9_TOTAL A · CN_GROSS_INR', calc:v => val(v.A,'CN_GROSS_INR') },
  { id:'cash-sale-avg-ticket', label:'Average cash-sale invoice', unit:'INR',
    from:'DERIVED · INV_GROSS_INR ÷ INV_CNT', derived:true,
    calc:v => { const g = val(v.A,'INV_GROSS_INR'), n = val(v.A,'INV_CNT');
                return (g === null || !n) ? null : g / n; } },
  { id:'cash-sale-ledger-balance', label:'What the cash-sale accounts actually owe', unit:'INR',
    from:'9_TOTAL A · LEDGER_BAL_INR', calc:v => val(v.A,'LEDGER_BAL_INR') },
  { id:'cash-sale-open-diagnostic', label:'Invoices SAP still calls open (diagnostic)', unit:'INR',
    from:'9_TOTAL A · OPEN_INR', calc:v => val(v.A,'OPEN_INR') },
  { id:'cash-sale-unapplied-receipts', label:'Money in, never applied to an invoice', unit:'INR',
    from:'9_TOTAL A · UNAPPLIED_RCT_INR', calc:v => val(v.A,'UNAPPLIED_RCT_INR') },
  { id:'cash-sale-open-overstatement', label:'Overstatement if you read “open” as a receivable', unit:'INR',
    from:'DERIVED · OPEN_INR − LEDGER_BAL_INR', derived:true,
    calc:v => { const o = val(v.A,'OPEN_INR'), l = val(v.A,'LEDGER_BAL_INR');
                return (o === null || l === null) ? null : o - l; } },
  { id:'cash-sale-migrated-openings', label:'Go-live opening balances (not sales)', unit:'INR',
    from:'9_TOTAL B · INV_GROSS_INR', calc:v => val(v.B,'INV_GROSS_INR') },
  { id:'cash-sale-card-count', label:'Accounts that define “cash sale” here', unit:'count',
    from:'DERIVED · COUNT of 1_SCOPE rows', derived:true,
    calc:v => v.scope.length },
  { id:'cash-tender-external', label:'Physical cash tendered by customers', unit:'INR',
    from:'9_TOTAL C · CASH_TENDER_INR', calc:v => val(v.C,'CASH_TENDER_INR') },
  { id:'cash-tender-receipt-count', label:'Customer receipts carrying cash', unit:'count',
    from:'9_TOTAL C · TXN_CNT', calc:v => val(v.C,'TXN_CNT') },
  { id:'cash-tender-group', label:'Cash tendered by JIVO group / branch cards', unit:'INR',
    from:'9_TOTAL D · CASH_TENDER_INR', calc:v => val(v.D,'CASH_TENDER_INR') },
  { id:'cash-sale-ar-control-gl-net', label:'Net movement on 1101014 Sundry Debtors Cash Sale', unit:'INR',
    from:'DERIVED · 7_GL_CASH 1101014 debits − credits', derived:true,
    calc:v => glNet(v.ctrl) },
  { id:'cash-till-gl-in', label:'Cash into the tills (all time, G/L)', unit:'INR',
    from:'7_GL_CASH CASH TILL · Σ GL_DEBIT_INR', calc:v => v.tills.length ? total(v.tills,'GL_DEBIT_INR') : null },
  { id:'cash-till-gl-out', label:'Cash out of the tills (all time, G/L)', unit:'INR',
    from:'7_GL_CASH CASH TILL · Σ GL_CREDIT_INR', calc:v => v.tills.length ? total(v.tills,'GL_CREDIT_INR') : null },
  { id:'cash-till-gl-net', label:'Cash still sitting in the tills', unit:'INR',
    from:'DERIVED · Σ debits − Σ credits over the three tills', derived:true,
    calc:v => v.tills.length ? total(v.tills,'GL_DEBIT_INR') - total(v.tills,'GL_CREDIT_INR') : null }
];

/* ══ 2. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** `Rs 43.12 L` in the spec's prose → `₹43.12 L` on the page. */
function rupee(s) {
  return String(s).replace(/\bRs\s(?=[\d,])/g, '₹').replace(/(\d)x\b/g, '$1×');
}

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }

/**
 * The same figure to the paisa, Indian-grouped — for deltas, tolerances and
 * reconciliations, where "₹0.03 out" and "exact" are different answers and
 * `money()`'s rounding would print both as ₹0. Still a formatted string:
 * no raw Number is ever printed on this page.
 */
function exact(v) {
  if (v === null || v === undefined || v === '' || isNaN(v)) return 'not computed';
  const n = Number(v);
  const p = Math.abs(n).toFixed(2).split('.');
  return (n < 0 ? '\u2212' : '') + '\u20B9' + inGroup(p[0]) + '.' + p[1];
}

/** A count, or the honest word. */
function cnt(v) { return (v === null || v === undefined || isNaN(v)) ? 'not computed' : num(v); }

/** One cell value, lifted to rupees by its column's unit suffix (CONTRACT §4).
 *  Returns null — never 0 — when the cell is missing, so a nil can be told
 *  apart from a zero everywhere downstream. */
function val(r, col) {
  if (!r) return null;
  const raw = r[col];
  if (raw === null || raw === undefined || raw === '') return null;
  const n = Number(scale(raw, col));
  return isFinite(n) ? n : null;
}

/** Sum one column over rows, scaled first. Rows with a nil cell contribute 0;
 *  an empty row set returns 0, so callers must check `.length` themselves. */
function total(rows, col) {
  let t = 0;
  for (const r of rows) { const v = val(r, col); if (v !== null) t += v; }
  return t;
}

/** Net G/L position of one 7_GL_CASH row: debits − credits (trap 26). */
function glNet(r) {
  if (!r) return null;
  const d = val(r,'GL_DEBIT_INR'), c = val(r,'GL_CREDIT_INR');
  if (d === null && c === null) return null;
  return (d || 0) - (c || 0);
}

/** Manifest KPI entry, accepting both `{value}` and the short `{v}` shape. */
function pub(m, co, id) {
  const k = (m && m.kpis && m.kpis[co]) ? m.kpis[co][id] : null;
  if (!k) return { value:null, ok:undefined, alt:null, delta:null, method:null, missing:true };
  const raw = (k.value !== undefined) ? k.value : k.v;
  const c = k.check || {};
  return {
    value: (raw === null || raw === undefined || isNaN(Number(raw))) ? null : Number(raw),
    ok: c.ok, alt: (c.alt_value === undefined ? null : c.alt_value),
    delta: (c.delta_pct === undefined ? null : c.delta_pct),
    method: c.method || null, missing:false
  };
}

/** The three check states, in words. `null` is a GAP, never a failure. */
function checkWord(ok) {
  return ok === true ? 'corroborated by a second route'
       : ok === false ? 'the two routes DISAGREE'
       : 'single route — not corroborated';
}

/**
 * When the published KPI file disagrees with this page on the A/R control
 * account, say so in the tile — and say what the gap IS, arithmetically, when
 * it happens to be the journal-line count. Stated as an identity that can be
 * checked on this page, not as a guess about the pipeline.
 */
function ctrlPubNote(m, co, K, ctrl) {
  const mine = K['cash-sale-ar-control-gl-net'];
  const p = pub(m, co, 'cash-sale-ar-control-gl-net');
  if (mine === null || p.value === null || Math.abs(p.value - mine) <= TOL) return '';
  const lines = val(ctrl, 'TXN_CNT');
  const gap = p.value - mine;
  return '; the published KPI file carries ' + inr(p.value) + ' for this id' +
         ((lines !== null && Math.abs(gap - lines) <= TOL)
           ? ' — exactly ' + num(lines) + ' more, which is this account\u2019s journal-line count'
           : ' — a gap of ' + exact(gap)) +
         '. The figure shown is debits minus credits.';
}

/** A `C-0019` chip linked to the methodology page. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + src + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a chart: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/** A row of small raw-column tiles. */
function minis(items) {
  const g = h('<div class="minikpis"></div>');
  items.forEach(function (it) {
    if (!it) return;
    g.appendChild(h(
      '<div class="mk"' + (it.title ? ' title="' + esc(it.title) + '"' : '') + '>' +
        '<div class="lab">' + esc(it.lab) + '</div>' +
        '<div class="val">' + (it.href ? '<a href="' + esc(it.href) + '">' + esc(it.val) + '</a>' : esc(it.val)) + '</div>' +
        (it.sub ? '<div class="sub">' + it.sub + '</div>' : '') +
      '</div>'
    ));
  });
  return g;
}

/* -- faceted-slice accessors --------------------------------------------- */

const sec        = (rows, s) => rows.filter(r => r.SECTION === s);
const isOpening  = r => /\|MIGRATED_OPENING$/.test(String(r.SORT_KEY || '')) ||
                        /\(opening\)$/.test(String(r.ROW_KEY || ''));
const realMonths = rows => sec(rows, '2_MONTH').filter(r => !isOpening(r));

/** The ONE row of a 9_TOTAL population. By SORT_KEY, never by position: the
 *  four rows are four different populations and rows[0] is not "the total". */
function totalRow(rows, key) {
  const hit = rows.filter(r => r.SECTION === '9_TOTAL' && r.SORT_KEY === key);
  return hit.length ? hit[0] : null;
}

/** Month keys, in order, filling every gap between the first and the last so
 *  a chart drawn on an index axis still reads as real time. The months that
 *  had to be filled come back separately — they are "no document", not "₹0". */
function monthSpine(keys) {
  const have = keys.slice().filter(Boolean).sort();
  if (!have.length) return { spine:[], filled:[] };
  const parse = k => { const p = String(k).split('-'); return [Number(p[0]), Number(p[1])]; };
  let [y, mo] = parse(have[0]);
  const [ey, em] = parse(have[have.length - 1]);
  const spine = [], set = new Set(have), filled = [];
  let guard = 0;
  while ((y < ey || (y === ey && mo <= em)) && guard++ < 600) {
    const k = String(y) + '-' + (mo < 10 ? '0' : '') + String(mo);
    spine.push(k);
    if (!set.has(k)) filled.push(k);
    mo++; if (mo > 12) { mo = 1; y++; }
  }
  return { spine, filled };
}

/** Read the page's own URL state: which cut the table shows. */
function urlState(present) {
  let p;
  try { p = new URLSearchParams(window.location.search); } catch (e) { p = new URLSearchParams(); }
  const want = String(p.get('facet') || '').toUpperCase();
  const ok = present.indexOf(want) >= 0;
  return { facet: ok ? want : (present.indexOf('9_TOTAL') >= 0 ? '9_TOTAL' : (present[0] || '')) };
}

/** Rewrite one query parameter in place and re-render. No navigation. */
function setParam(name, value) {
  try {
    const url = new URL(window.location.href);
    if (value === null || value === '') url.searchParams.delete(name);
    else url.searchParams.set(name, value);
    window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
  } catch (e) { /* a browser without URL still re-renders below */ }
  render();
}

/* ══ 3. render ═══════════════════════════════════════════════════════════ */

async function render() {
  const co = company();
  const main = document.getElementById('main');
  const [m, d, der] = await Promise.all([manifest(), slice(SECTION, co), derivations(co)]);
  const rows = d.summary || [];
  const asOf = d.as_of || (m && m.as_of) || null;

  main.innerHTML = '';
  const add = n => { if (n) main.appendChild(n); return n; };

  add(crumb([
    { label:'Board', href:hrefSection('index.html', co) },
    { label:'Cash Sale' }
  ]));

  add(h(
    '<div class="pagehead">' +
      '<div class="ctx">Cash sale <span class="sep">·</span> OINV · ORIN · ORCT · OCRD · JDT1 · OACT' +
        (asOf ? ' <span class="sep">·</span> as of ' + esc(asOf) : '') + '</div>' +
      '<h1>Sold for cash, and cash collected — two different numbers</h1>' +
      '<p class="lede">What JIVO sold over the counter on its cash-sale customer cards, what those ' +
      'counter accounts actually owe today, and — kept deliberately apart — how much physical cash ' +
      'customers handed over against ordinary credit sales. Adding those together is the single ' +
      'most common way to get this section wrong.</p>' +
    '</div>'
  ));

  /* -- the section could not be read: say so, never print a zero ---------- */
  const secMeta = (m && m.sections && m.sections[SECTION]) || null;
  if (d.error || !rows.length || (secMeta && secMeta.status === 'error')) {
    add(empty({
      what: 'The cash-sale section could not be read for ' + companyLabel(co) + '.',
      why: 'This is not a zero and not an empty book: all three books return rows (oil 76, mart 31, ' +
           'bev 64) on a healthy build.' +
           (d.error ? ' Reader’s error: ' + d.error : '') +
           ((secMeta && secMeta.error) ? ' Pipeline error: ' + secMeta.error : '') +
           ((m && m.generated_at) ? ' Build stamp: ' + m.generated_at + '.' : ''),
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, asOf);
    return;
  }

  /* -- the eight cuts, pulled apart once -------------------------------- */
  const A = totalRow(rows, 'A'), B = totalRow(rows, 'B');
  const C = totalRow(rows, 'C'), D = totalRow(rows, 'D');
  const scope    = sec(rows, '1_SCOPE');
  const months   = realMonths(rows);
  const openings = sec(rows, '2_MONTH').filter(isOpening);
  const branches = sec(rows, '3_BRANCH');
  const whs      = sec(rows, '4_WAREHOUSE');
  const custs    = sec(rows, '5_CUSTOMER');
  const tender   = sec(rows, '6_TENDER_MONTH');
  const gl       = sec(rows, '7_GL_CASH');
  const tills    = gl.filter(r => String(r.ROW_NOTE || '').trim() === 'CASH TILL');
  const ctrl     = gl.filter(r => String(r.ROW_NOTE || '').trim() === 'AR CONTROL' &&
                                  String(r.ROW_KEY) === '1101014')[0] || null;
  const V = { A, B, C, D, scope, months, branches, whs, custs, tender, gl, tills, ctrl };

  const K = {};                                     // page-computed KPI values
  KPIS.forEach(function (k) {
    let v = null;
    try { v = k.calc(V); } catch (e) { v = null; }
    K[k.id] = (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
  });

  const hasRegister = (val(A,'INV_CNT') || 0) > 0;
  const missing = ['A','B','C','D'].filter(x => !totalRow(rows, x));

  /* a partial build: name the missing population rather than reading 0 ---- */
  if (missing.length) {
    add(empty({
      what: 'This build is missing ' + missing.length + ' of the four total rows (' +
            missing.map(x => '9_TOTAL ' + x).join(', ') + ').',
      why: 'Every headline on this page is read from one named 9_TOTAL row by its SORT_KEY. A ' +
           'missing row is not a zero, and the page will not fall back to another row of the ' +
           'group — the four rows are four different populations.',
      href: hrefSection('health', co), hrefLabel:'Check the build’s health'
    }));
  }

  /* ── 3.1 the three grains, said once, at the top ─────────────────────── */
  add(h(
    '<div class="caveat">' +
      '<b>Cash is the tender, not the customer — this page holds three separate populations.</b> ' +
      '<b>The invoice side</b> (<code>INV_CNT</code>, <code>INV_GROSS_INR</code>, ' +
      '<code>INV_NET_INR</code>) is the cash-sale register: sales billed to the counter cards. ' +
      '<b>The receipt side</b> (<code>TXN_CNT</code>, <code>CASH_TENDER_INR</code>) is physical ' +
      'cash handed over on customer receipts — overwhelmingly against ordinary CREDIT sales, ' +
      'collected by route salesmen. <b>The ledger side</b> (<code>GL_DEBIT_INR</code>, ' +
      '<code>GL_CREDIT_INR</code>) is journal movement on the cash tills and the A/R control ' +
      'account. They answer three different questions, they are never added together, and every ' +
      'block below says which one it is measuring. ' + cv('C-0019') + ' ' + cv('C-0021') + ' ' +
      cv('C-0005') +
    '</div>'
  ));

  /* ── 3.2 the register headline ───────────────────────────────────────── */
  {
    const c = card('The cash-sale register', '9_TOTAL A · one named row, never a sum of the table');
    const avgPub = pub(m, co, 'cash-sale-avg-ticket');
    c.appendChild(kpiRow([
      { id:'cash-sale-turnover-net', label:'Cash sales, net of GST', value:K['cash-sale-turnover-net'], unit:'INR',
        sub:'invoices net of GST, minus returns — the settled JIVO turnover definition' },
      { id:'cash-sale-gross', label:'The same sales, gross of GST', value:K['cash-sale-gross'], unit:'INR',
        sub:'OINV.DocTotal, tax inclusive' },
      { id:'cash-sale-invoice-count', label:'Cash-sale invoices', value:K['cash-sale-invoice-count'], unit:'count',
        sub:'excluding cancelled, and excluding the go-live openings' },
      { id:'cash-sale-avg-ticket', label:'Average cash-sale invoice', value:K['cash-sale-avg-ticket'], unit:'INR',
        tone: (K['cash-sale-avg-ticket'] !== null && K['cash-sale-avg-ticket'] > 10000) ? 'warn' : undefined,
        sub:'computed here as gross ÷ invoices' +
            (avgPub.value !== null && K['cash-sale-avg-ticket'] !== null &&
             Math.abs(avgPub.value - K['cash-sale-avg-ticket']) > TOL
               ? '; the published KPI file carries ' + inr(avgPub.value) + ' for this id — the invoice value, not the average'
               : '') },
      { id:'cash-sale-returns', label:'Returns against cash sales', value:K['cash-sale-returns'], unit:'INR',
        sub:(val(A,'CN_CNT') === null ? '' : cnt(val(A,'CN_CNT')) + ' credit note' + (val(A,'CN_CNT') === 1 ? '' : 's') + ', gross of GST') },
      { id:'cash-sale-card-count', label:'Accounts that define “cash sale” here', value:K['cash-sale-card-count'], unit:'count',
        sub:'counted on this page from the scope cut — the KPI file publishes no value for it' }
    ]));

    if (!hasRegister) {
      c.appendChild(empty({
        what: companyLabel(co) + ' books no cash-sale documents at all. The ₹0 above is a VERIFIED ZERO, not a failure and not an unknown.',
        why: cnt(K['cash-sale-card-count']) + ' cash-sale cards exist in this book and carry nil balances, ' +
             'account 1101014 SUNDRY DEBTORS CASH SALE exists with zero journal lines, and the register ' +
             'total row is a real numeric zero rather than the row of NULLs an earlier build emitted. ' +
             'This book does handle cash — ' + inr(K['cash-tender-external']) + ' of it, tendered on ' +
             cnt(K['cash-tender-receipt-count']) + ' customer receipts — but that is the receipt side, further down this page.',
        href: '#tender', hrefLabel:'Go to the cash actually collected'
      }));
    }
    add(c);
  }

  /* ── 3.3 the definition, drawn ───────────────────────────────────────── */
  {
    const c = card('How the cash-sale figure is built', 'OINV.DocTotal → less GST → less returns');
    const gross = K['cash-sale-gross'], net = val(A,'INV_NET_INR'),
          cnNet = val(A,'CN_NET_INR'), turn = K['cash-sale-turnover-net'];
    if (hasRegister && gross !== null && net !== null && turn !== null) {
      const gst = gross - net;
      c.appendChild(waterfall([
        { label:'Invoices, gross of GST', value:gross, kind:'base', k:'cash-sale-gross' },
        { label:'GST inside those invoices', value:gst, kind:'sub' },
        { label:'Credit notes (returns), net of GST', value:(cnNet || 0), kind:'sub', k:'cash-sale-returns' },
        { label:'Cash sales, net of GST', value:turn, kind:'total', k:'cash-sale-turnover-net' }
      ], {
        title:'The turnover definition, ' + companyLabel(co),
        format: money,
        href: s => { const o = (s && s.src) || s; return (o && o.k) ? hrefDerivation(o.k, co) : null; }
      }));
      const chain = gross - gst - (cnNet || 0);
      const tie = Math.abs(chain - turn) <= TOL;
      c.appendChild(cap(
        'Read as one sentence: <b>' + esc(inr(gross)) + '</b> was invoiced to the counter cards, ' +
        '<b>' + esc(inr(gst)) + '</b> of that is GST that was never JIVO’s money (an implied rate of ' +
        '<b>' + esc(pct(gst, net)) + '</b> on the net base), and <b>' + esc(inr(cnNet || 0)) +
        '</b> came back as credit notes. That leaves <b>' + esc(inr(turn)) + '</b> of turnover on ' +
        'the settled JIVO definition — invoices net of GST, minus returns, cancelled documents out. ' +
        '<b>' + (tie ? 'The chain ties to the published total' : 'The chain does NOT tie to the published total') +
        '</b> (' + esc(exact(chain)) + ' against ' + esc(exact(turn)) + ', a gap of ' +
        esc(exact(Math.abs(chain - turn))) + '; the tolerance is ' + esc(exact(TOL)) +
        ' because every row is rounded to 2 dp on its own while the total rounds the unrounded sum).'
      ));
      if (K['cash-sale-migrated-openings'] !== null && K['cash-sale-migrated-openings'] > 0) {
        c.appendChild(h(
          '<div class="caveat"><b>And the step that is deliberately NOT in that chain.</b> ' +
          esc(inr(K['cash-sale-migrated-openings'])) + ' on ' + esc(cnt(val(B,'INV_CNT'))) +
          ' documents dated exactly 2024-09-30 — the day this book went live — sits in its own total ' +
          'row as opening balances, not sales. It is <b>bigger than the answer above</b>, which is ' +
          'why it is carried as a visible exclusion rather than dropped silently. ' +
          (B && B.ROW_NOTE ? esc(rupee(B.ROW_NOTE)) : '') + ' The test is DocDate = 2024-09-30 exactly; ' +
          'a genuine cash sale ever back-dated to that day would be misfiled into it, and SAP carries ' +
          'no flag that could tell them apart.</div>'
        ));
        c.appendChild(kpiRow([
          { id:'cash-sale-migrated-openings', label:'Go-live opening balances, excluded from every figure above',
            value:K['cash-sale-migrated-openings'], unit:'INR', tone:'warn',
            sub:'9_TOTAL B — carried as its own population so the exclusion is visible, never netted into the register' }
        ]));
      } else if (B) {
        c.appendChild(empty({
          what: companyLabel(co) + ' never carried its opening balances in as cash-sale invoices.',
          why: 'Only Oil loaded openings that way, on its 2024-09-30 go-live day. A true zero here is ' +
               'printed as this sentence rather than as “₹0”, which would read as “the go-live openings ' +
               'are all settled”.',
          href: hrefDerivation('cash-sale-migrated-openings', co), hrefLabel:'See how this is measured'
        }));
      }
    } else {
      c.appendChild(empty({
        what: companyLabel(co) + ' books no cash-sale invoices, so there is nothing to break down.',
        why: 'There is no gross, no GST and no returns to walk down — an absent register, not a zero ' +
             'chain. The cash this book DOES handle is on the receipt side, below.',
        href:'#tender', hrefLabel:'Go to the cash actually collected'
      }));
    }
    add(c);
  }

  /* ── 3.4 open is not owed ────────────────────────────────────────────── */
  {
    const c = card('“Open” is not “owed”', '9_TOTAL A · OPEN_INR vs UNAPPLIED_RCT_INR vs LEDGER_BAL_INR');
    const open = K['cash-sale-open-diagnostic'], un = K['cash-sale-unapplied-receipts'],
          led = K['cash-sale-ledger-balance'], over = K['cash-sale-open-overstatement'];

    c.appendChild(kpiRow([
      { id:'cash-sale-ledger-balance', label:'What these accounts actually owe', value:led, unit:'INR',
        tone:(led !== null && led < 0) ? 'info' : undefined,
        sub:'OCRD.Balance. Positive = they owe JIVO; negative = JIVO is holding their money' },
      { id:'cash-sale-open-diagnostic', label:'Invoices SAP still calls open — diagnostic, NOT a receivable', value:open, unit:'INR',
        tone:'warn', sub:(val(A,'OPEN_CNT') === null ? '' : cnt(val(A,'OPEN_CNT')) + ' invoices still flagged DocStatus = O') },
      { id:'cash-sale-unapplied-receipts', label:'Money in from these accounts, never applied to an invoice', value:un, unit:'INR',
        sub:'already inside the ledger balance — never subtract it' },
      { id:'cash-sale-open-overstatement', label:'Overstatement if you read “open” as a receivable', value:over, unit:'INR',
        tone:'bad', sub:'the money a naive reading of DocStatus invents' }
    ]));

    if (hasRegister && open !== null && led !== null) {
      c.appendChild(hbars([
        { name:'SAP-open invoice residue (diagnostic)', value:open, color:'--c3' },
        { name:'Receipts received, never applied', value:(un === null ? 0 : un), color:'--c5' },
        { name:'Actually owed per the ledger', value:led, color:'--c1' }
      ], {
        title:'Three measures on one scale — they do NOT net',
        sort:false, top:3, format: money
      }));
      const ratio = (led > 0) ? (open / led) : null;
      c.appendChild(cap(
        'Deliberately three bars and not a waterfall: these do not net, and chaining them would be ' +
        'the exact double-count the query forbids. Cash-sale invoices never close, because settlement ' +
        'arrives as a lump on-account receipt that nobody ever applies to a specific invoice — ' +
        'SAP’s internal matching flag is zero on <b>100%</b> of the 1101014 journal lines. So the ' +
        'residue keeps growing while the money is already in. ' +
        (led < 0
          ? '<b>The sign is what matters here.</b> This book reads ' + esc(inr(open)) + ' “open” while the ' +
            'cards are ' + esc(inr(Math.abs(led))) + ' in <b>CREDIT</b> — JIVO is holding their money, ' +
            'not chasing it. A red “still unpaid” tile built on the open column, which is what v1 shipped, ' +
            'publishes a receivable that does not exist.'
          : '<b>' + esc(inr(open)) + ' “open” against ' + esc(inr(led)) + ' actually owed' +
            (ratio ? ' — ' + esc(ratio.toFixed(0)) + '×' : '') + '.</b> The open column is a diagnostic ' +
            'about SAP’s document status, not a collection target.') +
        ' ' + cv('C-0019') + ' ' + cv('C-0023')
      ));

      /* the identity that must NOT hold — a regression guard, on the page */
      if (un !== null) {
        const guard = open - un;
        const ties = Math.abs(guard - led) <= 1.0;
        c.appendChild(h(
          '<p class="tnote"><b>The arithmetic that must never start working.</b> ' +
          'Open minus unapplied receipts is ' + esc(exact(guard)) + ', against a real ledger balance of ' +
          esc(exact(led)) + ' — ' + (ties
            ? '<b>and those two now agree, which is a defect</b>: the receipt is already inside ' +
              'OCRD.Balance, so a build where they tie has started netting it off twice.'
            : 'a gap of ' + esc(exact(Math.abs(guard - led))) + '. They are <b>meant</b> to disagree: ' +
              'the receipt is already inside OCRD.Balance, so subtracting it would double-count. If a ' +
              'future build makes them tie, somebody has started doing exactly that.') +
          '</p>'
        ));
      }
      c.appendChild(h(
        '<p class="tnote">A cash-settled invoice can still read open — the same defect the receivables ' +
        'section is built around. The complete, per-card bill list for these cards is on ' +
        '<a href="' + esc(hrefSection('customer-ageing', co)) + '">receivables</a>; do not try to ' +
        'cross-check them against <a href="' + esc(hrefSection('open-item-list', co)) + '">open items</a>, ' +
        'which keeps only items over ₹10,000 and then caps the list.</p>'
      ));
    } else if (!hasRegister) {
      c.appendChild(empty({
        what: 'No cash-sale invoice exists in this book, so nothing can read “open”.',
        why: 'All three measures are a true zero on a book with no register: no invoices to leave open, ' +
             'no receipts against them, no balance on the cards. That is the verified-zero case, not a gap.'
      }));
    }
    add(c);
  }

  /* ── 3.5 the register month by month ─────────────────────────────────── */
  {
    const c = card('Cash sales by month', '2_MONTH · trading months only, openings held back');
    if (months.length) {
      const keys = months.map(r => String(r.ROW_KEY));
      const sp = monthSpine(keys);
      const by = {}; months.forEach(r => { by[String(r.ROW_KEY)] = r; });
      const pts = sp.spine.map(k => ({ x:k, y: by[k] ? (val(by[k],'TURNOVER_NET_INR') || 0) : 0 }));
      c.appendChild(lineArea([{ name:'Cash sales, net of GST', points:pts }], {
        title:'Turnover on the counter cards, by document month',
        format: money, height:220,
        note: sp.filled.length
          ? sp.filled.length + ' month' + (sp.filled.length === 1 ? '' : 's') + ' in this span carry no cash-sale document at all (' +
            sp.filled.slice(0, 8).join(', ') + (sp.filled.length > 8 ? ', …' : '') +
            '). They are drawn on the axis to keep the time scale honest — that is “no document”, not “₹0 of sales”.'
          : undefined
      }));
      const last = months[months.length - 1], first = months[0];
      const peak = months.slice().sort((a,b) => (val(b,'TURNOVER_NET_INR')||0) - (val(a,'TURNOVER_NET_INR')||0))[0];
      c.appendChild(cap(
        'The register runs from <b>' + esc(String(first.ROW_KEY)) + '</b> to <b>' + esc(String(last.ROW_KEY)) +
        '</b>, biggest month <b>' + esc(String(peak.ROW_KEY)) + '</b> at ' + esc(inr(val(peak,'TURNOVER_NET_INR'))) +
        ' on ' + esc(cnt(val(peak,'INV_CNT'))) + ' invoices. ' +
        (sp.filled.length
          ? '<b>The gaps are the point.</b> This cut is not zero-filled by the query: a month with no row had ' +
            'no document. Ranked bars would hide both the holes and the fact that the register stops.'
          : 'Every month between the first and the last carries at least one document, so the line has no gaps to explain.') +
        (months.some(r => (val(r,'TURNOVER_NET_INR') || 0) < 0)
          ? ' One or more months are <b>negative</b>: a month holding only credit notes has negative turnover, which is legitimate and is never clipped to zero here.'
          : '')
      ));
    } else {
      c.appendChild(empty({
        what: companyLabel(co) + ' books no cash-sale invoices, so there is nothing to break down by month.',
        why: 'The month cut is absent from this book entirely — it is not a flat zero line. This book did ' +
             'collect ' + inr(K['cash-tender-external']) + ' of physical cash, which is the receipt side, below.',
        href:'#tender', hrefLabel:'Go to the cash actually collected'
      }));
    }
    add(c);
  }

  /* ── 3.6 the two cash numbers, on one axis ───────────────────────────── */
  {
    const c = card('Two different cash numbers, same axis', '2_MONTH turnover vs 6_TENDER_MONTH cash');
    if (tender.length) {
      const sp = monthSpine(months.map(r => String(r.ROW_KEY)).concat(tender.map(r => String(r.ROW_KEY))));
      const mReg = {}, mTen = {};
      months.forEach(r => { mReg[String(r.ROW_KEY)] = val(r,'TURNOVER_NET_INR') || 0; });
      tender.forEach(r => { mTen[String(r.ROW_KEY)] = val(r,'CASH_TENDER_INR') || 0; });
      c.appendChild(lineArea([
        { name:'Cash-sale register (invoices)', points: sp.spine.map(k => ({ x:k, y: mReg[k] || 0 })) },
        { name:'Physical cash tendered (receipts)', points: sp.spine.map(k => ({ x:k, y: mTen[k] || 0 })) }
      ], { title:'The register against the till, month by month', format: money, height:230 }));
      const tenTot = K['cash-tender-external'], regTot = K['cash-sale-turnover-net'];
      c.appendChild(cap(
        'Two lines, one axis, and they are <b>not the same money</b>. The register line is what was ' +
        'invoiced to the counter cards' + (hasRegister ? ' — ' + esc(inr(regTot)) + ' all told' :
          ', which in this book is flat zero for every month shown') + '. The tender line is physical cash ' +
        'handed over on ordinary customer receipts — ' + esc(inr(tenTot)) + ' across ' +
        esc(cnt(K['cash-tender-receipt-count'])) + ' receipts, mostly route collections against credit sales. ' +
        'Anyone who sees this once stops adding the two totals together.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No cash was tendered on any customer receipt in this book.',
        why: 'The tender cut carries no months at all. On a healthy build every book has some — read this ' +
             'as a build to check rather than as a cashless book.'
      }));
    }
    add(c);
  }

  /* ── 3.7 the receipt side ────────────────────────────────────────────── */
  {
    const c = card('The cash actually collected', '9_TOTAL C and D · ORCT.CashSum, a different population');
    c.id = 'tender';
    c.appendChild(kpiRow([
      { id:'cash-tender-external', label:'Physical cash tendered by customers', value:K['cash-tender-external'], unit:'INR',
        sub:'cash on ordinary customer receipts — NOT the cash-sale register' },
      { id:'cash-tender-receipt-count', label:'Receipts carrying cash', value:K['cash-tender-receipt-count'], unit:'count',
        sub:'a count of receipts, not a count of rupees' },
      { id:'cash-tender-group', label:'Cash from JIVO group / branch cards', value:K['cash-tender-group'], unit:'INR',
        tone:'warn',
        sub:((val(D,'TXN_CNT') || 0) > 0 && !(val(D,'CASH_TENDER_INR') || 0)
              ? cnt(val(D,'TXN_CNT')) + ' receipts flagged as carrying cash, together below ₹0.01 — dust, not “no group cash”'
              : 'not trade — flagged and kept out of the figure beside it, never silently folded in') }
    ]));

    /* D with receipts but no money, and dust months — never a bare zero */
    const dTxn = val(D,'TXN_CNT'), dCash = val(D,'CASH_TENDER_INR');
    if (dTxn !== null && dTxn > 0 && (dCash === null || dCash === 0)) {
      c.appendChild(empty({
        what: cnt(dTxn) + ' receipt' + (dTxn === 1 ? '' : 's') + ' from group or branch cards are flagged as carrying cash, totalling below ₹0.01.',
        why: 'The count and the money disagree because the tender cut counts any receipt with a positive ' +
             'CashSum, sub-paise float residue included. It is neither “₹0 of group cash” nor “no group ' +
             'cash” — it is a receipt that carries dust.'
      }));
    } else if (dTxn === 0 || dCash === 0) {
      c.appendChild(empty({
        what:'No group or branch card tendered cash in this book.',
        why:'The classifier that splits trade from group cash ran and found nothing on the group side — ' +
            'an empty slice, not an unmeasured one. The codes it bars are per book on purpose: ' +
            'CUSTA001099 is a group card in Oil and an ordinary customer in Beverages, and a flat list ' +
            'would move real trade cash into this row.',
        href: hrefDerivation('cash-tender-group', co), hrefLabel:'See how this is measured'
      }));
    }

    const dust = tender.filter(r => (val(r,'TXN_CNT') || 0) > 0 && !(val(r,'CASH_TENDER_INR') || 0));
    if (dust.length) {
      const n = dust.reduce((a, r) => a + (val(r,'TXN_CNT') || 0), 0);
      c.appendChild(h(
        '<p class="tnote"><b>' + esc(cnt(n)) + ' of ' + esc(cnt(K['cash-tender-receipt-count'])) +
        ' receipts (' + esc(pct(n, K['cash-tender-receipt-count'])) + ') carry no money at all.</b> ' +
        esc(dust.map(r => String(r.ROW_KEY) + ' (' + num(val(r,'TXN_CNT')) + ')').join(', ')) +
        ' — months with receipts flagged as cash whose total rounds below ₹0.01. On the chart above ' +
        'those months sit on the axis; that is “receipts with dust”, not “no receipts”.</p>'
      ));
    }

    /* C vs D — a true partition of one population, so a ring is honest */
    const cCash = K['cash-tender-external'], gCash = K['cash-tender-group'];
    if (cCash !== null && gCash !== null && gCash > 0) {
      c.appendChild(donut([
        { label:'External customers (trade)', value:cCash },
        { label:'JIVO group / branch cards', value:gCash }
      ], { title:'Cash tendered, split by who paid it', centerLabel:'cash in', format: money }));
      c.appendChild(cap(
        'The only split on this page a ring is allowed to draw: C and D partition one population of ' +
        'receipts, so the two really are parts of one whole. <b>' + esc(pct(gCash, cCash + gCash)) +
        '</b> of the cash tendered came from JIVO’s own group or branch cards — real cash, but not trade, ' +
        'and it is quantified here instead of being dropped. The four 9_TOTAL rows could never be drawn ' +
        'this way: they are four different populations, not four slices of one.'
      ));
    }

    /* the share this page CANNOT compute, said plainly */
    c.appendChild(empty({
      what: 'This page cannot show cash as a share of all sales.',
      why: 'The section carries the cash-sale register, the cash tendered on receipts and the till ' +
           'movement — it does not carry the book’s total turnover or its credit sales, so any ' +
           '“cash vs credit %” would have to be invented. The split that IS a real partition of one ' +
           'population is the trade-vs-group one above.',
      href: hrefSection('index.html', co), hrefLabel:'The board, where the turnover sections live'
    }));
    add(c);
  }

  /* ── 3.8 the cash ledger and the coverage check ──────────────────────── */
  {
    const c = card('The cash ledger', '7_GL_CASH · all-time JDT1 movement, every TransType');
    const tin = K['cash-till-gl-in'], tout = K['cash-till-gl-out'], tnet = K['cash-till-gl-net'];

    c.appendChild(kpiRow([
      { id:'cash-till-gl-in', label:'Cash into the tills (all time)', value:tin, unit:'INR',
        sub:(tills.length ? cnt(tills.length) + ' till accounts under the CASH IN HAND parent' : '') },
      { id:'cash-till-gl-out', label:'Cash out of the tills (all time)', value:tout, unit:'INR' },
      { id:'cash-till-gl-net', label:'Cash still sitting in the tills, per the books', value:tnet, unit:'INR',
        tone:(tnet !== null && tnet < 0) ? 'bad' : undefined,
        sub:'debits minus credits — derived here; the debit column alone is not a position' },
      { id:'cash-sale-ar-control-gl-net', label:'Net movement on 1101014 Sundry Debtors Cash Sale', value:K['cash-sale-ar-control-gl-net'], unit:'INR',
        sub:(val(ctrl,'TXN_CNT') === 0
              ? 'the account exists in this book and carries ZERO journal lines — “exists, never posted to”, not ₹0 of movement'
              : 'debits minus credits on the A/R control account, derived here' + ctrlPubNote(m, co, K, ctrl)) }
    ]));

    if (tills.length) {
      c.appendChild(minis(tills.map(function (r) {
        const n = glNet(r), txn = val(r,'TXN_CNT');
        return {
          lab: String(r.ROW_KEY) + ' ' + String(r.ROW_LABEL || ''),
          val: (txn === 0 ? 'never posted to' : inr(n)),
          href: hrefGL(r.ROW_KEY, co),
          sub: (txn === 0
            ? 'The account exists in this book and carries <b>zero</b> journal lines. That is “exists, never used”, not “₹0 of movement”.'
            : esc(cnt(txn)) + ' journal lines · in ' + esc(inr(val(r,'GL_DEBIT_INR'))) + ' · out ' + esc(inr(val(r,'GL_CREDIT_INR')))),
          title: MEANING.NET_INR
        };
      })));
    }

    if (tnet !== null && tnet < 0) {
      const worst = tills.slice().sort((a,b) => (glNet(a) || 0) - (glNet(b) || 0))[0];
      c.appendChild(h(
        '<div class="caveat"><b>A till cannot hold negative cash — this one does, and it is real.</b> ' +
        'The three cash accounts in this book have paid out ' + esc(inr(Math.abs(tnet))) +
        ' more than they have taken in, all time' +
        (worst ? ', led by <code>' + esc(String(worst.ROW_KEY)) + '</code> ' + esc(String(worst.ROW_LABEL || '')) +
                 ' at ' + esc(inr(glNet(worst))) : '') + '. This is not a query artefact: the ' +
        '<a href="' + esc(hrefSection('bank-accounts', co, { category:'CASH_IN_HAND' })) + '">banks section</a> ' +
        'reads the same three accounts from the account-master side and reports the same position. ' +
        'Present it as a flagged G/L position for whoever owns the till — never as “cash in hand”, ' +
        'because no physical cash box can be short of itself. ' +
        '<a href="' + esc(hrefGL((worst && worst.ROW_KEY) || '1105001', co)) + '">Open the account’s postings</a>.' +
        '</div>'
      ));
    }

    /* coverage meter: how much of the till movement the receipt route explains */
    const cd = ((K['cash-tender-external'] || 0) + (K['cash-tender-group'] || 0));
    if (tin !== null && tin > 0) {
      c.appendChild(meter(cd, tin, {
        title:'How much of the till debits the receipt route explains',
        label:'cash on customer receipts (C + D)', maxLabel:'all till debits',
        warnAt:0.6, badAt:0.3, format: money
      }));
      c.appendChild(cap(
        '<b>' + esc(pct(cd, tin)) + '</b> of every rupee ever debited to the tills is explained by the ' +
        'customer-receipt route this page measures. The rest is not missing money and not a failed check: ' +
        'till-to-till transfers, storno reversals of cancelled payments, cancelled receipts and vendor ' +
        'cash refunds all debit a till and none of them is a customer paying cash. A green tick claiming ' +
        '“verified” would be dishonest at this coverage — the meter says how much of the ledger the route ' +
        'actually accounts for, and the uncovered ' + esc(inr(tin - cd)) + ' is named rather than hidden.'
      ));
    } else {
      c.appendChild(empty({
        what:'The coverage of the till movement cannot be shown.',
        why:'The three till accounts report no debits at all in this book, so there is no denominator to ' +
            'take a share of. That is an absent measurement, not 0% coverage.'
      }));
    }

    /* the 1101014 tie-out, and the cards that sit on other control accounts */
    const on14 = scope.filter(r => /ctrl\s*1101014/i.test(String(r.ROW_NOTE || '')));
    const off14 = scope.filter(r => !/ctrl\s*1101014/i.test(String(r.ROW_NOTE || '')));
    const glCtrl = K['cash-sale-ar-control-gl-net'];
    if (glCtrl !== null && on14.length) {
      const cards14 = total(on14, 'LEDGER_BAL_INR');
      const tie = Math.abs(glCtrl - cards14) <= TOL;
      c.appendChild(h(
        '<p class="tnote"><b>The control-account tie-out.</b> Journal movement on 1101014 nets to ' +
        esc(exact(glCtrl)) + '; the ' + esc(cnt(on14.length)) + ' scope cards whose control account IS ' +
        '1101014 carry ' + esc(exact(cards14)) + ' of ledger balance between them — two different ' +
        'tables, posting history against the master-data balance field, and <b>' +
        (tie ? 'they tie' : 'they do NOT tie') + '</b> (gap ' + esc(exact(Math.abs(glCtrl - cards14))) + '). ' +
        (off14.length
          ? esc(cnt(off14.length)) + ' cash-sale card' + (off14.length === 1 ? '' : 's') + ' post' +
            (off14.length === 1 ? 's' : '') + ' somewhere else (' +
            esc(off14.map(r => String(r.ROW_KEY)).join(', ')) + '), so this check covers the on-1101014 ' +
            'subset only, and the ' + esc(exact(Math.abs((K['cash-sale-ledger-balance'] || 0) - glCtrl))) +
            ' between it and the headline balance is exactly those cards — expected, not a break.'
          : 'Every cash-sale card in this book posts to 1101014, so the check covers the whole scope.') +
        '</p>'
      ));
    }
    add(c);
  }

  /* ── 3.9 concentration, behaviour and godowns ────────────────────────── */
  {
    const c = card('Which counter account, and which godown', '5_CUSTOMER · 4_WAREHOUSE');
    if (custs.length) {
      const pos = custs.filter(r => (val(r,'TURNOVER_NET_INR') || 0) > 0);
      if (pos.length) {
        c.appendChild(pareto(pos.map(r => ({
          label: r.ROW_LABEL || r.ROW_KEY, value: val(r,'TURNOVER_NET_INR'), ROW_KEY: r.ROW_KEY
        })), {
          title:'Cash sales by counter account, with the running share',
          top:10, format: money,
          href: it => { const o = (it && it.src) || it; return (o && o.ROW_KEY) ? hrefParty(o.ROW_KEY, co) : null; }
        }));
        const ranked = pos.slice().sort((a,b) => (val(b,'TURNOVER_NET_INR')||0) - (val(a,'TURNOVER_NET_INR')||0));
        const tot = total(pos, 'TURNOVER_NET_INR');
        c.appendChild(cap(
          'Bars are each counter account’s share; the line is the running total. <b>' +
          esc(String(ranked[0].ROW_LABEL || ranked[0].ROW_KEY)) + '</b> alone is ' +
          esc(pct(val(ranked[0],'TURNOVER_NET_INR'), tot)) + ' of the register. ' +
          (custs.length - pos.length > 0
            ? esc(cnt(custs.length - pos.length)) + ' account' + ((custs.length - pos.length) === 1 ? '' : 's') +
              ' with nil or negative turnover are left out of the ranking rather than clamped to zero — a ' +
              'card holding only credit notes has negative turnover and cannot be a bar. '
            : '') +
          'Names come from the customer master, never from the per-document snapshot: one of these cards ' +
          'has been renamed twice, and grouping on the snapshot name would split it into three.'
        ));
      }

      const bub = custs.filter(r => (val(r,'INV_CNT') || 0) > 0);
      if (bub.length > 1) {
        c.appendChild(scatter(bub.map(r => ({
          x: val(r,'INV_CNT'), y: val(r,'INV_GROSS_INR') / val(r,'INV_CNT'),
          label: String(r.ROW_LABEL || r.ROW_KEY), ROW_KEY: r.ROW_KEY
        })), {
          title:'Counter sale, or wholesale wearing a counter card?',
          xLabel:'invoices on the card', yLabel:'average invoice', xUnit:'n', format: money,
          href: p => (p && p.ROW_KEY) ? hrefParty(p.ROW_KEY, co) : null
        }));
        const odd = bub.filter(r => (val(r,'INV_GROSS_INR') / val(r,'INV_CNT')) > 10000);
        c.appendChild(cap(
          'One dot per counter account: how many invoices it wrote, against what the average one was worth. ' +
          'A counter belongs bottom-right — many invoices, each worth hundreds. ' +
          (odd.length
            ? '<b>' + esc(odd.map(r => String(r.ROW_LABEL || r.ROW_KEY)).join(', ')) + '</b> ' +
              (odd.length === 1 ? 'sits' : 'sit') + ' far above that band (' +
              esc(odd.map(r => inr(val(r,'INV_GROSS_INR') / val(r,'INV_CNT'))).join(', ')) +
              ' per invoice). No column in this data says “this card is not behaving like a counter” — ' +
              'the position on this chart does. It is an <b>open question for Accounts</b>, not a finding: ' +
              'the figures reconcile to the control account, so nothing here is wrong, but a distributor ' +
              'being billed through a counter card would look exactly like this.'
            : 'Every account in this book sits inside that band, so nothing here reads as wholesale ' +
              'billed through a counter card.')
        ));
      }
    } else {
      c.appendChild(empty({
        what: companyLabel(co) + ' books no cash-sale invoices, so there is no counter account to rank.',
        why: 'The customer cut is absent from this book entirely — three cash-sale cards exist, none of ' +
             'them has a document. The cash this book handles is on the receipt side, above.',
        href:'#tender', hrefLabel:'Go to the cash actually collected'
      }));
    }

    if (whs.length) {
      const pos = whs.filter(r => (val(r,'TURNOVER_NET_INR') || 0) > 0);
      const neg = whs.filter(r => (val(r,'TURNOVER_NET_INR') || 0) <= 0);
      if (pos.length) {
        c.appendChild(treemap(pos.map(r => ({
          label: String(r.ROW_LABEL || r.ROW_KEY), value: val(r,'TURNOVER_NET_INR')
        })), { title:'Which godown the counter sells out of', color:'cat', format: money }));
        c.appendChild(cap(
          'Area is money, so the long tail is visible without a scroll. This is a <b>bucket, not an ' +
          'apportionment</b>: a document touching more than one warehouse lands whole in the synthetic ' +
          '“(multi-warehouse)” row, so the cut totals correctly but no single godown figure is a true ' +
          'value split. ' +
          (neg.length
            ? 'Left out of the tiles because a treemap cannot draw them, and listed here instead: ' +
              esc(neg.map(r => String(r.ROW_LABEL || r.ROW_KEY) + ' ' + inr(val(r,'TURNOVER_NET_INR'))).join(' · ')) +
              ' — negative or nil buckets, which are legitimate (a bucket holding only credit notes) and are ' +
              'never clamped to zero.'
            : 'Every bucket in this book is positive, so none had to be listed beside the tiles.')
        ));
      }
    }
    add(c);
  }

  /* ── 3.10 does every breakdown tie to the total? ─────────────────────── */
  {
    const c = card('Does every breakdown tie to the total?',
      'each cut recomposed and compared with its named 9_TOTAL row');
    const checks = [];
    const push = function (what, basis, head, recomp, unit) {
      if (head === null || recomp === null) return;
      const delta = recomp - head;
      const ok = (unit === 'count') ? (Math.round(delta) === 0) : (Math.abs(delta) <= TOL);
      checks.push({
        CHECK: what, BASIS: basis,
        TOTAL: (unit === 'count') ? cnt(head) : exact(head),
        RECOMPOSED: (unit === 'count') ? cnt(recomp) : exact(recomp),
        DELTA: (unit === 'count') ? cnt(delta) : exact(delta),
        VERDICT: ok ? 'ties' : 'DOES NOT TIE'
      });
    };
    if (hasRegister) {
      push('Turnover, recomposed from the months', '2_MONTH (trading months only) vs 9_TOTAL A',
           K['cash-sale-turnover-net'], months.length ? total(months,'TURNOVER_NET_INR') : null, 'INR');
      push('Turnover, recomposed from the branches', '3_BRANCH vs 9_TOTAL A',
           K['cash-sale-turnover-net'], branches.length ? total(branches,'TURNOVER_NET_INR') : null, 'INR');
      push('Turnover, recomposed from the godowns', '4_WAREHOUSE (reaches the number through the document LINES) vs 9_TOTAL A',
           K['cash-sale-turnover-net'], whs.length ? total(whs,'TURNOVER_NET_INR') : null, 'INR');
      push('Turnover, recomposed from the counter accounts', '5_CUSTOMER vs 9_TOTAL A',
           K['cash-sale-turnover-net'], custs.length ? total(custs,'TURNOVER_NET_INR') : null, 'INR');
      push('Invoice count, recomposed from the counter accounts', '5_CUSTOMER vs 9_TOTAL A — counts cannot round, so this must be exact',
           K['cash-sale-invoice-count'], custs.length ? total(custs,'INV_CNT') : null, 'count');
      push('Every month, openings included', '2_MONTH in full vs 9_TOTAL A + B (gross)',
           (K['cash-sale-gross'] === null || K['cash-sale-migrated-openings'] === null) ? null
             : K['cash-sale-gross'] + K['cash-sale-migrated-openings'],
           sec(rows,'2_MONTH').length ? total(sec(rows,'2_MONTH'),'INV_GROSS_INR') : null, 'INR');
      push('Ledger balance, recomposed from the scope cards', '1_SCOPE vs 9_TOTAL A',
           K['cash-sale-ledger-balance'], scope.length ? total(scope,'LEDGER_BAL_INR') : null, 'INR');
      push('Unapplied receipts, recomposed from the scope cards', '1_SCOPE vs 9_TOTAL A',
           K['cash-sale-unapplied-receipts'], scope.length ? total(scope,'UNAPPLIED_RCT_INR') : null, 'INR');
    }
    push('Cash tendered, recomposed from the months', '6_TENDER_MONTH vs 9_TOTAL C',
         K['cash-tender-external'], tender.length ? total(tender,'CASH_TENDER_INR') : null, 'INR');
    push('Receipt count, recomposed from the months', '6_TENDER_MONTH vs 9_TOTAL C — exact',
         K['cash-tender-receipt-count'], tender.length ? total(tender,'TXN_CNT') : null, 'count');
    push('1101014 movement against the cards on it', '7_GL_CASH 1101014 net vs the 1_SCOPE cards whose control account is 1101014',
         K['cash-sale-ar-control-gl-net'],
         scope.filter(r => /ctrl\s*1101014/i.test(String(r.ROW_NOTE || ''))).length
           ? total(scope.filter(r => /ctrl\s*1101014/i.test(String(r.ROW_NOTE || ''))), 'LEDGER_BAL_INR') : null, 'INR');

    if (checks.length) {
      const bad = checks.filter(x => x.VERDICT !== 'ties').length;
      c.appendChild(table(checks, {
        co: co,
        cols:['CHECK','BASIS','TOTAL','RECOMPOSED','DELTA','VERDICT'],
        labels:{ CHECK:'What is checked', BASIS:'Against what', TOTAL:'Published total',
                 RECOMPOSED:'Recomposed here', DELTA:'Gap', VERDICT:'Verdict' },
        units:{ CHECK:'text', BASIS:'text', TOTAL:'text', RECOMPOSED:'text', DELTA:'text', VERDICT:'text' },
        page:false, filter:false,
        caption:'Every cut of this section, recomposed and compared with its named total row'
      }));
      c.appendChild(cap(
        (bad === 0
          ? '<b>All ' + esc(cnt(checks.length)) + ' checks tie.</b> '
          : '<b>' + esc(cnt(bad)) + ' of ' + esc(cnt(checks.length)) + ' checks DO NOT tie</b> — read the ' +
            'gap column before quoting any figure on this page. ') +
        'The money tolerance is ' + esc(exact(TOL)) + ' and counts must be exact. That asymmetry is ' +
        'deliberate: each row of this section is rounded to 2 dp on its own while the total row rounds ' +
        'the unrounded sum, so a recomposition can legitimately land a couple of paise out, but a count ' +
        'cannot round and any drift there would be a genuine fan-out. The godown recomposition is worth ' +
        'the most: it reaches the same number through the document line tables rather than the invoice ' +
        'headers, so agreeing there is a real second route, not the same arithmetic twice.'
      ));
    } else {
      c.appendChild(empty({
        what:'There is nothing to reconcile in this book.',
        why:'The register is empty, so no cut can be recomposed against it. The tender and ledger checks ' +
            'still ran where the rows exist — an absent check is not a passed one.'
      }));
    }
    add(c);
  }

  /* ── 3.11 the published KPI file against this page ───────────────────── */
  {
    const c = card('What the KPI file publishes, and what this page computes',
      'manifest.kpis.' + esc(co) + ' · 18 ids');
    const rowsK = KPIS.map(function (k) {
      const p = pub(m, co, k.id);
      const mine = K[k.id];
      const same = (p.value === null || mine === null) ? null
                 : (k.unit === 'count' ? Math.round(p.value) === Math.round(mine) : Math.abs(p.value - mine) <= TOL);
      return {
        KPI: k.id, WHAT: k.label,
        SOURCE: k.from + (k.derived ? ' (derived — not the raw column)' : ''),
        PUBLISHED: p.missing ? 'not in the manifest'
                 : (p.value === null ? 'not published'
                 : (k.unit === 'count' ? cnt(p.value) : inr(p.value))),
        THIS_PAGE: mine === null ? 'not computed' : (k.unit === 'count' ? cnt(mine) : inr(mine)),
        AGREE: same === null ? 'nothing to compare' : (same ? 'same figure' : 'DIFFERENT'),
        CHECK: checkWord(p.ok)
      };
    });
    const diff = rowsK.filter(r => r.AGREE === 'DIFFERENT');
    c.appendChild(table(rowsK, {
      co: co,
      cols:['KPI','WHAT','SOURCE','PUBLISHED','THIS_PAGE','AGREE','CHECK'],
      labels:{ KPI:'KPI id', WHAT:'What it measures', SOURCE:'Read from',
               PUBLISHED:'Published value', THIS_PAGE:'Computed on this page',
               AGREE:'Agreement', CHECK:'Second route' },
      units:{ KPI:'code', WHAT:'text', SOURCE:'text', PUBLISHED:'text', THIS_PAGE:'text', AGREE:'text', CHECK:'text' },
      links:{ KPI:'derivation' },
      page:false, filter:false,
      caption:'Every KPI this section publishes, beside the same figure recomputed from the published rows'
    }));
    c.appendChild(cap(
      '<b>Every headline on this page is the “computed here” column</b>, re-derived from the rows in ' +
      'this section using the spec’s own formula. The published column is what the build wrote into the ' +
      'KPI file. ' +
      (diff.length
        ? '<b>' + esc(cnt(diff.length)) + ' of the ' + esc(cnt(rowsK.length)) + ' disagree</b> (' +
          esc(diff.map(r => r.KPI).join(', ')) + '), and both figures are printed rather than one being ' +
          'quietly preferred. Four of these KPIs are DERIVED — an average, two differences and a count — ' +
          'so a build that publishes the named raw column instead publishes the wrong number. '
        : 'Every one of them agrees. ') +
      'The last column is the cross-check the build recorded, and its three states are not ' +
      'interchangeable: <b>corroborated</b> means a second, independent route reproduced the figure; ' +
      '<b>DISAGREE</b> means two routes genuinely differ and the number is still shown; <b>single route</b> ' +
      'means no second route exists — a gap, never agreement, and never rendered as a tick.'
    ));
    add(c);
  }

  /* ── 3.12 the tables, one per cut ────────────────────────────────────── */
  {
    const present = BLOCKS.map(b => b.key).filter(k => sec(rows, k).length);
    const st = urlState(present);
    const c = card('Every row, one cut at a time',
      SECTION + '.' + esc(co) + '.json · ' + num(rows.length) + ' rows across ' + num(present.length) + ' cuts');

    const chips = h('<div class="chips" role="group" aria-label="Which cut to show"></div>');
    BLOCKS.forEach(function (b) {
      const set = sec(rows, b.key);
      if (!set.length) return;
      const on = st.facet === b.key;
      const btn = h('<button type="button" class="chip" aria-pressed="' + (on ? 'true' : 'false') + '">' +
        esc(b.label) + ' <span class="n">' + num(set.length) + '</span></button>');
      btn.title = b.key + ' — ' + b.grain;
      btn.addEventListener('click', function () { setParam('facet', b.key); });
      chips.appendChild(btn);
    });
    const bar = h('<div class="toolbar"></div>');
    bar.appendChild(chips);
    c.appendChild(bar);

    const blk = BLOCKS.filter(b => b.key === st.facet)[0] || BLOCKS[0];
    let set = sec(rows, blk.key);
    if (blk.dropOpenings) set = set.filter(r => !isOpening(r));

    /* the two derived columns, added only where they mean something */
    if (blk.key === '5_CUSTOMER') {
      set = set.map(function (r) {
        const g = val(r,'INV_GROSS_INR'), n = val(r,'INV_CNT');
        const o = Object.assign({}, r);
        o.AVG_TICKET_INR = (g === null || !n) ? null : g / n;
        return o;
      });
    }
    if (blk.key === '7_GL_CASH') {
      set = set.map(function (r) { const o = Object.assign({}, r); o.NET_INR = glNet(r); return o; });
    }

    c.appendChild(h(
      '<p class="tnote"><b>Grain of this cut:</b> ' + esc(blk.grain) + '. ' + esc(rupee(blk.note)) + '</p>'
    ));

    const labels = {}, units = {};
    blk.cols.forEach(function (k) {
      labels[k] = LABEL[k] || k;
      units[k] = UNIT[k] || 'text';
    });

    c.appendChild(table(set, {
      co: co,
      cols: blk.cols,
      labels: labels,
      units: units,
      links: blk.links || {},
      total: blk.total,
      page: false,
      filter: (set.length > 12) ? 'Find a row…' : false,
      empty: {
        what:'This cut has no rows in ' + companyLabel(co) + '.',
        why:'The chip above would not exist if the cut were empty, so seeing this means the rows were ' +
            'filtered away after the chip was drawn.'
      },
      caption:'cash-sale ' + blk.key + ' — ' + blk.grain
    }));

    /* the plain-English meaning of every column in this cut, on the page */
    const dl = h('<details class="note-box"><summary>What each column in this cut means</summary></details>');
    const body = h('<div class="note-body tablewrap"><dl class="prose"></dl></div>');
    const dlist = body.querySelector('dl');
    blk.cols.forEach(function (k) {
      dlist.appendChild(h('<dt><b>' + esc(LABEL[k] || k) + '</b> <code>' + esc(k) + '</code></dt>'));
      dlist.appendChild(h('<dd>' + esc(rupee(MEANING[k] || 'No description published for this column.')) + '</dd>'));
    });
    dl.appendChild(body);
    c.appendChild(dl);

    if (blk.key === '2_MONTH' && openings.length) {
      c.appendChild(h(
        '<p class="tnote"><b>Held back from the table above:</b> ' + esc(cnt(openings.length)) +
        ' go-live opening row' + (openings.length === 1 ? '' : 's') + ' (' +
        esc(openings.map(r => String(r.ROW_KEY)).join(', ')) + ') worth ' +
        esc(inr(total(openings,'INV_GROSS_INR'))) + ' gross on ' + esc(cnt(total(openings,'INV_CNT'))) +
        ' documents. The totals row above therefore ties to the register headline; adding the openings ' +
        'back in would give ' + esc(inr((K['cash-sale-gross'] || 0) + (K['cash-sale-migrated-openings'] || 0))) +
        ' gross, which is not the register.</p>'
      ));
    }
    if (blk.key === '9_TOTAL') {
      c.appendChild(h(
        '<p class="tnote"><b>No totals row, on purpose.</b> These four rows are four different ' +
        'populations — invoices, openings, external cash receipts and group cash receipts. Adding them ' +
        'would produce a number that means nothing, and the same column carries invoices in one row and ' +
        'receipts in another.</p>'
      ));
    }
    if (blk.key === '7_GL_CASH') {
      const never = set.filter(r => val(r,'TXN_CNT') === 0);
      if (never.length) {
        c.appendChild(h(
          '<p class="tnote"><b>' + esc(never.map(r => String(r.ROW_KEY) + ' ' + String(r.ROW_LABEL || '')).join(', ')) +
          ' exist' + (never.length === 1 ? 's' : '') + ' in this book and ' +
          (never.length === 1 ? 'has' : 'have') + ' never been posted to.</b> The zeros on ' +
          (never.length === 1 ? 'that row' : 'those rows') + ' mean “no journal line has ever touched this ' +
          'account”, not “the movement nets to nothing”. The query joins the ledger loosely on purpose so ' +
          'an unused account still appears here instead of vanishing.</p>'
        ));
      }
      c.appendChild(h(
        '<p class="tnote"><b>No totals row here either.</b> Three of these accounts are cash tills and ' +
        'the fourth is the A/R control account — different things, and the transaction column counts ' +
        'journal lines here while it counts receipts in the tender cut. The till subtotal is in the ' +
        'cash-ledger panel above, where it is taken over the three CASH TILL rows only.</p>'
      ));
    }
    c.appendChild(h(
      '<p class="tnote">This section emits <b>no document-level rows at all</b>, so nothing here drills ' +
      'to an invoice or a receipt. The deepest drill available is the party ledger from a card code, and ' +
      'the G/L account from an account code — both linked in the tables above.</p>'
    ));
    add(c);
  }

  /* ── 3.13 how to read this ───────────────────────────────────────────── */
  {
    const c = card('How to read this', 'every way a naive version of this page goes wrong');
    c.appendChild(h(
      '<p class="blurb">These are not caveats in the small-print sense. Each one is a specific, measured ' +
      'way that the obvious reading of this data produces a wrong number — found by attacking the query ' +
      'against live SAP, and several of them were live defects on v1 of this board.</p>'
    ));
    // Some traps quote a 54-character column-list literal with no space in it.
    // Left alone it overflowed the page by 67px at 390px wide.
    const ol = h('<div class="prose"><ol style="overflow-wrap:anywhere;word-break:break-word"></ol></div>');
    const list = ol.querySelector('ol');
    TRAPS.forEach(function (t) { list.appendChild(h('<li>' + esc(rupee(t)) + '</li>')); });
    c.appendChild(ol);
    c.appendChild(h(
      '<p class="tnote">The corrections behind them: ' +
      ['C-0005','C-0019','C-0021','C-0023'].map(cv).join(' ') +
      ' — each links to the full record on the methodology page.</p>'
    ));
    c.appendChild(note(SECTION));
    add(c);
  }

  /* ── 3.14 the SQL ────────────────────────────────────────────────────── */
  add(await sqlCard(der, co));

  paintFoot(m, co, asOf);
}

/* ══ 4. pieces ═══════════════════════════════════════════════════════════ */

/**
 * The query itself, behind a disclosure. The index is asked FIRST: a
 * fetch-and-fail logs a console 404 the page cannot suppress, and the browser
 * gate counts console errors as failures. Falls back to the excerpt every
 * derivation record carries.
 */
async function sqlCard(der, co) {
  const c = card('The query behind this page', SQL_FILE);
  const box = h('<details class="sqlbox-host"><summary class="btn sm">Show the SQL</summary></details>');
  box.style.margin = '0';
  const body = h('<div style="margin-top:12px"></div>');
  box.appendChild(body);
  c.appendChild(box);
  c.appendChild(h(
    '<p class="tnote">Read-only, and reviewed adversarially before it was allowed near the board. Money ' +
    'columns are plain rupees — the display divides by a lakh or a crore, the query never does. This was ' +
    'the one query in the pipeline with no <code>ROUND()</code>, which is how 128 money cells came to be ' +
    'published as raw floating-point noise; the outer SELECT now rounds every money column in one place. ' +
    'This file is not edited by the dashboard (CONTRACT §0.6): changing one of these queries silently ' +
    'changes the books.</p>'
  ));

  let text = null, from = null;
  try {
    const idxRes = await fetch('sql/_index.json', { cache:'no-cache' });
    const idx = idxRes.ok ? await idxRes.json() : null;
    if (Array.isArray(idx) && idx.indexOf(SECTION) >= 0) {
      const r = await fetch(SQL_FILE, { cache:'no-cache' });
      if (r.ok) { text = await r.text(); from = 'the query as published with this build'; }
    }
  } catch (e) { /* fall through to the derivation excerpt */ }

  if (!text) {
    const ids = ['cash-sale-turnover-net','cash-sale-ledger-balance','cash-tender-external'];
    for (const id of ids) {
      const rec = der && der[id];
      if (rec && rec.sql && rec.sql.text) {
        text = rec.sql.text;
        from = 'the excerpt carried in the derivation record for ' + id +
               (Array.isArray(rec.sql.lines) ? ' (lines ' + rec.sql.lines[0] + '–' + rec.sql.lines[1] + ')' : '');
        break;
      }
    }
  }

  if (!text) {
    body.appendChild(empty({
      what:'The query text is not published with this build.',
      why:'The published copy was not listed in the query index and no derivation record carried an ' +
          'excerpt. The query itself is in the repo at pipeline/sql/cash-sale.sql.'
    }));
    return c;
  }

  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const html = lines.map(function (ln, i) {
    return '<span class="ln">' + (i + 1) + '</span>' + esc(ln);
  }).join('\n');
  body.appendChild(h('<div class="sqlbox"><pre><code>' + html + '</code></pre></div>'));
  body.appendChild(h('<div class="sqlfoot"><span>' + esc(from) + '</span><span>' +
    num(lines.length) + ' lines</span><span>reads OINV · ORIN · ORCT · OCRD · OCRG · OACT · OBPL · OWHS · INV1 · RIN1 · JDT1</span></div>'));
  return c;
}

/** The page footer: where the numbers came from, and how old they are. */

  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
      '<div><b>Section</b> — cash-sale, eight cuts stacked in one result set, from <code>OINV</code> and ' +
        '<code>ORIN</code> (the register), <code>ORCT</code> (cash tendered and unapplied receipts), ' +
        '<code>OCRD</code>/<code>OCRG</code> (the cards and their groups), <code>JDT1</code>/' +
        '<code>OACT</code> (the cash ledger), <code>OBPL</code>, <code>OWHS</code>, <code>INV1</code> ' +
        'and <code>RIN1</code> (branch and godown labels and buckets). ' +
        '<span class="faint">v1’s footer named <code>OCTG</code>; the query does not read it — payment ' +
        'terms were tested as the cash-sale marker and disproven.</span></div>' +
      '<div><b>Book</b> — ' + esc(companyLabel(co)) + '. Figures from one company are not comparable with ' +
        'another’s, and the three books define their own cash-sale card sets separately.</div>' +
      '<div><b>Grain</b> — one row per (cut, key). There is <b>no document-level detail</b> in this ' +
        'section at all, so nothing on this page drills to an invoice.</div>' +
      '<div><b>Freshness</b> — ' + (asOf ? 'as of ' + esc(asOf) + '. ' : '') +
        (gen ? 'Built ' + esc(ago(gen)) + ' (' + esc(gen) + '). ' : 'Build time unknown. ') +
        'The page re-reads the manifest every minute and redraws itself when the build moves.</div>' +
      '<div><b>Read-only</b> — this board issues no write to SAP, ever (CONTRACT §0.2).</div>' +
    '</div>' +
    '<p><a href="' + esc(hrefSection('methodology.html', co)) + '">Methodology and the corrections</a> · ' +
    '<a href="' + esc(hrefDerivation('cash-sale-turnover-net', co)) + '">How the headline is derived</a> · ' +
    '<a href="' + esc(hrefSection('customer-ageing', co)) + '">Receivables</a> · ' +
    '<a href="' + esc(hrefSection('bank-accounts', co, { category:'CASH_IN_HAND' })) + '">Cash and bank</a> · ' +
    '<a href="' + esc(hrefSection('health', co)) + '">Build health</a></p>';
}

/* ══ 5. boot ═════════════════════════════════════════════════════════════ */

shell({
  title: 'Cash Sale',
  subtitle: 'Sold for cash, and cash collected — two numbers that must never be added',

});

render().catch(function (e) {
  const main = document.getElementById('main');
  if (main) {
    main.innerHTML = '';
    main.appendChild(empty({
      what:'This page could not be rendered.',
      why:'The data files loaded but the page failed while drawing them: ' +
          ((e && e.message) ? e.message : String(e)) +
          '. No figure on screen should be trusted until this is fixed.'
