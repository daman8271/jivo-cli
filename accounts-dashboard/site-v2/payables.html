<script type="module">
/* ────────────────────────────────────────────────────────────────────────────
   payables.html — the Vendor Ageing section.

   One summary row = one vendor card. The whole page exists to hold one
   correction in front of the reader: SAP's A/P ageing report says JIVO Oil owes
   ₹310.71 Cr; the general ledger says ₹22.68 Cr is owed to actual outside
   suppliers. The waterfall draws the difference, and every trap that makes a
   naive reading of this table wrong is printed on the page, not filed in a repo.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */
import {
  shell, crumb, kpiRow, table, empty, note, checkDot,
  manifest, slice, derivations, company, companyLabel,
  money, num, scale, ago, esc,
  hrefParty, hrefDerivation, hrefSection, hrefCaveat, hrefDocument,
  onRefresh
} from './assets/core.js';
import { waterfall, stackedBars, pareto, treemap, donut, scatter, hbars }
  from './assets/charts.js';

/* ══ 1. section constants — straight out of specs/vendor-ageing.json ══════ */

const SECTION = 'vendor-ageing';

/* The query and the working note each ship twice: once inside `site-v2/` (so
   they survive a site-only deploy) and once in `pipeline/` in the repo. Try the
   published copy first, then the repo one, so serving the repo root works too.
   `ui.note()` already does the same for the working note. */
const SQL_FILE = 'sql/vendor-ageing.sql';
const SQL_SOURCES = [
  [SQL_FILE, 'the query as published with this build'],
  ['../pipeline/sql/vendor-ageing.sql', 'pipeline/sql/vendor-ageing.sql, read from the repo']
];

const BUCKETS = ['B0_NOTDUE','B1_1_30','B2_31_60','B3_61_90','B4_91_180','B5_181_365','B6_365PLUS'];

/** Plain-English header + the spec's `meaning`, for every per-row column. */
const COLS = {
  CARD_CODE:          ['Card',                    'code', "OCRD.CardCode, unique per row. VENDA* are supplier cards; ORGV* are employee imprest cards filed as vendors."],
  CARD_NAME:          ['Vendor',                  'text', "OCRD.CardName. Load-bearing, not cosmetic: the intercompany test reads this field, because two of the largest group payables sit in ordinary trading groups."],
  VENDOR_GROUP:       ['Spend group',             'text', "OCRG.GroupName, joined on both GroupCode and GroupType because customer and vendor groups share the code space. 'STAFF VENDOR' holds employee imprest cards."],
  ACCT_KIND:          ['Kind',                    'text', "TRADE / BRANCH / INTERCO only — there is NO STAFF value here. A name-and-group heuristic, not a register: BRANCH if the group name contains BRANCH, INTERCO if the card name contains JIVO or AKAL ROZGAR or AKAL INFO, else TRADE."],
  IS_EXCLUDED:        ['Flagged as JIVO’s own',   'count', "0 for TRADE, 1 for BRANCH/INTERCO. 'Excluded' means excluded from the trade headline — the row is still here and still inside every company total."],
  OCRD_BALANCE:       ['Ledger balance (SAP sign: − = JIVO owes)', 'INR', "MISLEADING NAME: this is the as-of ledger balance rebuilt from JDT1 (Debit − Credit per ShortName), NOT OCRD.Balance. At as-of = today the two agree to the rupee on all 5,174 vendor cards."],
  PAYABLE:            ['Owed per the ledger',      'INR', "GREATEST(0, −ledger balance). The ground truth for what JIVO owes this card. Mutually exclusive with the advance column."],
  VENDOR_ADVANCE:     ['Advance sitting with them','INR', "GREATEST(0, ledger balance). Money JIVO has already paid out that no bill has landed against."],
  N_OPEN_BILLS:       ['Open bills in SAP',        'count', "Count of A/P bills SAP still marks open, dated on or before the as-of date. Zero on the rows that are here only because of a ledger balance, an unmatched payment or an open credit note."],
  RAW_OPEN:           ['Open per SAP (wrong)',     'INR', "Sum of DocTotal − PaidToDate over those bills. What a naive A/P ageing would report. On Oil’s trade book it is 9.87× the truth."],
  CREDIT_APPLIED:     ['Credit netted off',        'INR', "Settlements the general ledger records that were never matched to a specific bill, consumed oldest-due-first."],
  ADJ_OPEN:           ['Really owed',              'INR', "The credit-adjusted payable = the seven ageing buckets added up = open per SAP − credit netted off. THE headline column."],
  UNBACKED_CREDIT:    ['Owed, no bill on file',    'INR', "The part of the ledger payable that no open bill explains, so it cannot be aged. Closes the identity buckets + this = owed per the ledger, exactly, on every row."],
  MIGRATED_OPEN:      ['From the go-live load',    'INR', "Still-open amount on bills dated exactly 2024-09-30, Oil’s go-live day. Structurally zero for Mart and Beverages — that is the true answer, not a bug."],
  BACKDATED_DUE_OPEN: ['Due before it was dated',  'INR', "Still-open amount on bills whose due date precedes their document date — keyed-in-late or opening-balance documents."],
  OLDEST_DUE:         ['Oldest bill due',          'date', "Earliest due date across the card’s OPEN bills, BEFORE credit is applied. Blank where there are no open bills. Not the date of the money still owed."],
  DAYS_OLDEST:        ['Days since that due date', 'days', "Days from that oldest due date to the as-of date. Pre-credit: a card can carry a big number here while owing nothing."],
  B0_NOTDUE:          ['Not due yet',              'INR', "Credit-adjusted amount on bills whose due date is on or after the as-of date."],
  B1_1_30:            ['1–30 d late',              'INR', "Credit-adjusted amount 1 to 30 days past its due date."],
  B2_31_60:           ['31–60 d late',             'INR', "Credit-adjusted amount 31 to 60 days past due."],
  B3_61_90:           ['61–90 d late',             'INR', "Credit-adjusted amount 61 to 90 days past due."],
  B4_91_180:          ['91–180 d late',            'INR', "Credit-adjusted amount 91 to 180 days past due."],
  B5_181_365:         ['181–365 d late',           'INR', "Credit-adjusted amount 181 to 365 days past due."],
  B6_365PLUS:         ['Over a year late',         'INR', "Credit-adjusted amount more than 365 days past due."],
  ADJ_OVERDUE_60PLUS: ['Overdue 61 d +',           'INR', "The four oldest buckets added up. The column name rounds to 60; the boundary is 61 days. It was deliberately not renamed because v1’s hero hardcodes the key."],
  N_UNAPPLIED_PAY:    ['Unmatched payments',       'count', "Count of supplier payments SAP never reconciled internally. Diagnostic only."],
  UNAPPLIED_PAY:      ['Unmatched payment value',  'INR', "Value of those payments. ALREADY inside the ledger balance — subtracting it double-counts."],
  N_OPEN_CN:          ['Open credit notes',        'count', "Count of open A/P credit notes. Diagnostic only."],
  OPEN_CN:            ['Open credit note value',   'INR', "Value of those credit notes. Also already inside the ledger balance."]
};

/** The company-wide broadcast columns that are NOT already a headline KPI. */
const CO_EXTRA = [
  ['CO_RAW_OPEN',            'Open A/P bills, whole book',   'What SAP calls open across every vendor card — the number this page spends its first chart correcting.'],
  ['CO_VENDOR_ADVANCE',      'Advances held, whole book',    'Every card whose ledger balance is a debit: JIVO’s money already out of the door.'],
  ['CO_OPEN_CN',             'Open A/P credit notes',        'Diagnostic. Already inside the ledger balance — never subtract it.'],
  ['CO_BACKDATED_DUE_OPEN',  'Due before they were dated',   'Bills whose due date precedes their document date: keyed in late, or opening balances.']
];

/** specs/vendor-ageing.json → traps[]. The whole list, verbatim. */
const TRAPS = [
  "CO_* columns are BROADCAST company totals repeated identically on every row (verified across all 644/88/164 rows). Summing CO_ADJ_OPEN_TRADE down Oil's table gives Rs 14,604 Cr instead of Rs 22.68 Cr. Read any CO_* off a single row; never aggregate it.",
  "Summing ADJ_OPEN over ALL rows gives Oil Rs 102.51 Cr, not Rs 22.68 Cr. 78% of Oil's aged book, 95% of Mart's and 36% of Bev's is JIVO's own branch and intercompany cards. The filter ACCT_KIND == 'TRADE' (or IS_EXCLUDED == 0) is mandatory on every trade figure.",
  "Row count is not party count. Oil has 635 TRADE cards but only 256 owe anything; 170 hold an advance and 154 rows of the whole book are nil on both sides. v1's KPI subtitle counts rows and overstates exposure ~2.5x.",
  "RAW_OPEN is not a payable. On Oil's trade book it is Rs 223.92 Cr against Rs 22.68 Cr = 9.87x. The '~3x' figure quoted in README.md and in the SQL header is the WHOLE-BOOK ratio (Oil 3.03x, Mart 7.52x, Bev 1.63x) and understates the distortion on the number the board actually shows.",
  "UNAPPLIED_PAY (OVPM.OpenBal) and OPEN_CN (open ORPC) are diagnostics and are ALREADY inside the ledger balance. Subtracting either double-counts. Oil's CO_UNAPPLIED_PAY is Rs 2,017.71 Cr against a Rs 103.20 Cr real payable, and 8,355 of Oil's 9,038 uncancelled supplier payments carry a non-zero OpenBal — at JIVO 'OpenBal' means never internally reconciled, not money still unspent.",
  "DAYS_OLDEST and OLDEST_DUE are PRE-CREDIT: the oldest open bill on the card, before the ledger credit was consumed against it. 226 Oil trade cards report a DAYS_OLDEST while owing Rs 0, and Oil's 3,189-day maximum (VENDA001047 BLESSING ADVERTISING) has its surviving Rs 26.26 L bucketed at 61-90 and 91-180 days, not 365+.",
  "ADJ_OVERDUE_60PLUS is B3+B4+B5+B6, i.e. 61 days and over — the name rounds to 60 and is wrong. Label it '61 d +'. It was deliberately not renamed because v1's hero hardcodes the key.",
  "There is no STAFF class in this section, unlike open-item-list. 82 Oil / 24 Mart / 22 Bev employee imprest cards (VENDOR_GROUP = 'STAFF VENDOR', CARD_CODE prefix ORGV) are scored TRADE here and STAFF there. The money is small but two ORGV cards sit inside Bev's top 10 payables, so a 'top external suppliers' chart will print employee names unless it filters them out.",
  "ACCT_KIND is a name-and-group heuristic, not a register: '%BRANCH%' in the group name, or JIVO / AKAL ROZGAR / AKAL INFO in the card name. A new group entity named otherwise scores TRADE. C-0005's 23 named intercompany CardCodes are all customer-side codes and do NOT cover the vendor side, so this section cannot be validated against that list.",
  "MIGRATED_OPEN is hardcoded to DocDate = 2024-09-30 (Oil's go-live). Returning 0 for Mart and Bev is the TRUE answer — Mart's A/P starts 2025-01-01, Bev's 2024-10-01, and neither carried its openings in as invoices. Generalising it to the first document date per book would relabel Bev's first ordinary trading day as a migration.",
  "Oldest-due-bill-first is an assumption. The ledger proves the total credit; WHICH bills it settled is inferred. The total is right in every case; where a genuinely-unpaid old bill sits behind newer settled ones, the bucket split shifts newer than reality.",
  "On any as-of that is not today the bucket split is approximate: OPCH.PaidToDate is a right-now field and cannot be rewound, so the total is correct but the bill side is today's and the unexplained part lands in UNBACKED_CREDIT (Oil: Rs 0.48 Cr at as-of=today, Rs 6.51 Cr at 2026-06-30, Rs 23.83 Cr at 2025-12-31). Read UNBACKED_CREDIT before trusting any past-dated bucket chart.",
  "PAYABLE and VENDOR_ADVANCE are mutually exclusive per card (0 cards carry both) and must never be netted into one 'position' across cards — that would let one supplier's advance cancel another's overdue bill.",
  "OCRD_BALANCE does not come from OCRD.Balance. It is the JDT1-derived as-of ledger balance (they agree to the rupee at as-of = today, on all 5,174 vendor cards). Its sign is SAP's, so NEGATIVE means JIVO owes — rendering it raw without saying so reads exactly backwards.",
  "This section has no bill-level detail slice: data.json's detail object is empty for all three companies. Bill-level drill-down has to come from the open-item-list section, which is capped per document type — only 21 of Oil's 256 owed trade cards, 1 of Mart's 31 and 56 of Bev's 75 have ALL their bills present there.",
  "Group totals are not eliminated. Adding oil + mart + bev double counts JIVO's inter-book trading — Mart's Rs 20.93 Cr owed to VENDA000001 JIVO WELLNESS is the mirror of an Oil receivable. Per-company is the figure that means something.",
  "A card can be in scope with zero open bills (155 Oil / 25 Mart / 31 Bev rows) purely because of a ledger balance, an unapplied payment or an open credit note. OLDEST_DUE and DAYS_OLDEST are NULL on exactly those rows — the only two nullable columns in the section. Sorting or charting on them must handle NULL, not coerce it to 0 (which would place them at 'due today')."
];

/** The card sets the chip bar offers. STAFF is a SUBSET of TRADE, by design. */
const KIND_SETS = [
  { key:'ALL',     label:'All cards',      test:() => true },
  { key:'TRADE',   label:'Outside suppliers', test:r => r.ACCT_KIND === 'TRADE' },
  { key:'GROUP',   label:'JIVO’s own',     test:r => r.ACCT_KIND !== 'TRADE' },
  { key:'BRANCH',  label:'Branches',       test:r => r.ACCT_KIND === 'BRANCH' },
  { key:'INTERCO', label:'Intercompany',   test:r => r.ACCT_KIND === 'INTERCO' },
  { key:'STAFF',   label:'Staff imprest',  test:r => isStaff(r) }
];

/* ══ 2. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** `Rs 22.68 Cr` in the spec's prose → `₹22.68 Cr` on the page. */
function rupee(s) { return String(s).replace(/\bRs\s(?=[\d,])/g, '₹').replace(/(\d)x\b/g, '$1×'); }

const isStaff = r => String(r.VENDOR_GROUP || '').toUpperCase() === 'STAFF VENDOR';

/** Sum one column over rows, lifted to rupees by its unit suffix first (§4). */
function total(rows, col) {
  let t = 0;
  for (const r of rows) {
    const v = Number(scale(r[col], col));
    if (isFinite(v)) t += v;
  }
  return t;
}

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }

/** Manifest KPI value, accepting both `{value}` and the live `{v}` shape. */
function kpi(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  if (!k) return null;
  const v = (k.value !== undefined) ? k.value : k.v;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/** A `<a class="cvcode">C-0019</a>` linked to methodology.html. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + src + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a chart: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/** Read the page's own URL state: which cards, which extra filter, which sort. */
function urlState() {
  let p;
  try { p = new URLSearchParams(window.location.search); } catch (e) { p = new URLSearchParams(); }
  const kind = String(p.get('kind') || '').toUpperCase();
  return {
    kind: KIND_SETS.some(k => k.key === kind) ? kind : 'TRADE',
    filter: p.get('filter') || (p.get('bucket') === '61plus' ? 'ADJ_OVERDUE_60PLUS>0' : ''),
    sort: p.get('sort') || '',
    dir: p.get('dir') || 'desc'
  };
}

/** Rewrite one query parameter in place and re-render. No navigation. */
function setParam(name, value) {
  try {
    const url = new URL(window.location.href);
    if (value === null || value === '') url.searchParams.delete(name);
    else url.searchParams.set(name, value);
    window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
  } catch (e) { /* a browser without URL still re-renders below */ }
  render();
}

/** `COL>0` style row predicates, as the section's drill-downs hand them over. */
function parseFilter(src) {
  const m = /^\s*([A-Z0-9_]+)\s*(>=|<=|>|<|=)\s*(-?[\d.]+)\s*$/.exec(String(src || ''));
  if (!m) return null;
  const col = m[1], op = m[2], n = Number(m[3]);
  if (!(col in COLS)) return null;
  const f = function (r) {
    const v = Number(scale(r[col], col));
    if (!isFinite(v)) return false;
    return op === '>' ? v > n : op === '<' ? v < n : op === '>=' ? v >= n
         : op === '<=' ? v <= n : v === n;
  };
  f.label = (COLS[col][0]) + ' ' + op.replace('>=','at least ').replace('<=','at most ') + ' ' + n;
  return f;
}

/* ══ 3. render ═══════════════════════════════════════════════════════════ */

async function render() {
  const co = company();
  const main = document.getElementById('main');
  const [m, d, der] = await Promise.all([
    manifest(), slice(SECTION, co), derivations(co)
  ]);
  const rows = d.summary || [];
  const asOf = d.as_of || (m && m.as_of) || null;

  main.innerHTML = '';
  const add = n => { if (n) main.appendChild(n); return n; };

  add(crumb([
    { label: 'Board', href: hrefSection('index.html', co) },
    { label: 'Payables' }
  ]));

  add(h(
    '<div class="pagehead">' +
      '<div class="ctx">Vendor ageing <span class="sep">·</span> OPCH · JDT1 · OCRD · OVPM · ORPC' +
        (asOf ? ' <span class="sep">·</span> as of ' + esc(asOf) : '') + '</div>' +
      '<h1>What JIVO owes its suppliers</h1>' +
      '<p class="lede">Aged on the bill’s due date, after the money the general ledger says was ' +
      'already paid has been netted off the oldest bills first. SAP’s own A/P ageing report does ' +
      'not do that, which is why its number is several times larger than this one.</p>' +
    '</div>'
  ));

  /* -- the section could not be read: say so, never print a zero ---------- */
  if (d.error || !rows.length) {
    add(empty({
      what: 'SAP returned no vendor cards for this book.',
      why: 'The query failed — this is not a zero payable. All three books have always ' +
           'returned rows, so an empty result here means a broken build.' +
           (d.error ? ' Reader’s error: ' + d.error : ''),
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, null);
    return;
  }

  const R0 = rows[0];                                   // CO_* live here, once
  const st = urlState();
  const trade    = rows.filter(r => r.ACCT_KIND === 'TRADE');
  const branch   = rows.filter(r => r.ACCT_KIND === 'BRANCH');
  const interco  = rows.filter(r => r.ACCT_KIND === 'INTERCO');
  const staff    = rows.filter(isStaff);
  const owed     = trade.filter(r => Number(r.ADJ_OPEN) > 0);
  const external = owed.filter(r => !isStaff(r));       // suppliers, not employees

  const creditAll  = total(rows, 'CREDIT_APPLIED');
  const branchOpen = total(branch, 'ADJ_OPEN');
  const intercoOpen = total(interco, 'ADJ_OPEN');
  const staffOwed  = total(staff.filter(r => Number(r.ADJ_OPEN) > 0), 'ADJ_OPEN');
  const zeroButBilled = trade.filter(r => Number(r.ADJ_OPEN) === 0 && Number(r.N_OPEN_BILLS) > 0);

  /* ── 3.1 headline KPIs ───────────────────────────────────────────────── */
  const tradeOpen  = kpi(m, co, 'ap-trade-open');
  const rawOpen    = kpi(m, co, 'ap-trade-raw-open');
  const overdue    = kpi(m, co, 'ap-trade-overdue-61p');
  const migrated   = kpi(m, co, 'ap-migrated-open');

  add(kpiRow([
    { id:'ap-trade-open', label:'JIVO owes outside suppliers', value:tradeOpen, unit:'INR',
      corr: rawOpen, sub:'is what SAP’s open bills add up to', tone:'bad',
      title:'Credit-adjusted: the ledger’s word, not the document status’.' },
    { id:'ap-trade-overdue-61p', label:'Of that, 61 days and over overdue', value:overdue, unit:'INR', tone:'bad' },
    { id:'ap-trade-overdue-share', label:'Share already 61 d + overdue', value:kpi(m, co, 'ap-trade-overdue-share'), unit:'pct' },
    { id:'ap-trade-vendors-owed', label:'Suppliers actually owed money', value:kpi(m, co, 'ap-trade-vendors-owed'), unit:'count',
      sub: 'of ' + num(trade.length) + ' trade cards on file' },
    { id:'ap-trade-advance', label:'Advances sitting with suppliers', value:kpi(m, co, 'ap-trade-advance'), unit:'INR',
      sub:'money already out of the door', tone:'warn' },
    { id:'ap-oldest-bill-days', label:'Oldest unpaid bill, by due date', value:kpi(m, co, 'ap-oldest-bill-days'), unit:'days',
      sub:'age BEFORE credit was applied — not the age of the money still owed' }
  ]));

  add(h(
    '<div class="caveat">' +
      '<b>Two corrections hold this page up.</b> ' + cv('C-0019') +
      ' — at JIVO a bill keeps <code>DocStatus = O</code> long after the money moved, because ' +
      'settlements are posted as journal entries and as on-account payments nobody reconciles. ' +
      'Every figure here is therefore aged from the party’s <b>ledger balance</b>, not from the ' +
      'document status. ' + cv('C-0020') +
      ' — intercompany vendors hide OUTSIDE the branch groups: Mart’s <code>VENDA000001</code> ' +
      '“JIVO WELLNESS” sits in group PURCHASE at −₹20.93 Cr and Oil’s <code>VENDA000483</code> ' +
      'in E-COMMERCE. Never segment on the spend group alone — the rows below carry a ' +
      '<code>Kind</code> the query worked out from the group <i>and</i> the card name.' +
    '</div>'
  ));

  /* ── 3.2 THE headline chart: the correction, drawn ───────────────────── */
  {
    const c = card('From what SAP calls open to what JIVO actually owes',
      'CO_RAW_OPEN → CO_ADJ_OPEN_TRADE');
    const steps = [
      { label:'Open A/P bills, as SAP reports them', value:R0.CO_RAW_OPEN, kind:'base' },
      { label:'Already settled in the ledger', value:creditAll, kind:'sub' },
      { label:'Credit-adjusted payable, whole book', value:R0.CO_ADJ_OPEN, kind:'total', k:'ap-book-open' },
      { label:'JIVO’s own branches', value:branchOpen, kind:'sub', k:'ap-group-open' }
    ];
    if (intercoOpen > 0) {
      steps.push({ label:'Group companies (intercompany)', value:intercoOpen, kind:'sub', k:'ap-group-open' });
    }
    steps.push({ label:'Owed to outside suppliers', value:R0.CO_ADJ_OPEN_TRADE, kind:'total', k:'ap-trade-open' });

    c.appendChild(waterfall(steps, {
      title: 'Whole book → outside suppliers, ' + esc(companyLabel(co)),
      href: s => { const o = (s && s.src) || s; return (o && o.k) ? hrefDerivation(o.k, co) : null; }
    }));
    c.appendChild(cap(
      'Read it as one sentence. SAP’s open A/P bills come to <b>' + esc(inr(R0.CO_RAW_OPEN)) +
      '</b> (raw column <code>CO_RAW_OPEN</code>). <b>' + esc(inr(creditAll)) +
      '</b> of that was already paid — the ledger proves the money left, no bill was ever matched to ' +
      'it, so the bill stayed “open” (the <code>CREDIT_APPLIED</code> column, summed). ' +
      'That leaves <b>' + esc(inr(R0.CO_ADJ_OPEN)) + '</b> genuinely outstanding. ' +
      '<b>The last two deductions are a different kind of thing from the first.</b> The first is ' +
      'money that is gone. These are money that is still owed — but owed by JIVO to JIVO: ' +
      esc(inr(branchOpen)) + ' to its own state GST branches' +
      (intercoOpen > 0 ? ' and ' + esc(inr(intercoOpen)) + ' to sister companies' : '') +
      '. Netting them out leaves <b>' + esc(inr(R0.CO_ADJ_OPEN_TRADE)) +
      '</b> owed to suppliers outside the group — the only figure a payment run should work from.'
    ));
    if (!interco.length) {
      c.appendChild(empty({
        what: companyLabel(co) + ' has no intercompany vendor card.',
        why: 'No card in this book is named for a JIVO or Akal group entity outside a branch group, ' +

  /* ── 3.3 the company-wide columns that are not a headline KPI ────────── */

  /* ── 3.4 ageing posture, by kind ─────────────────────────────────────── */
  {
    const c = card('Where the money sits, by age', 'B0_NOTDUE … B6_365PLUS');

/* ══ 4. pieces ═══════════════════════════════════════════════════════════ */

/** One stacked-bar row: a label plus the seven bucket sums. Null if empty. */
function bucketBar(label, rows) {
  if (!rows || !rows.length) return null;
  const o = { KIND: label + ' (' + rows.length + ')' };
  let t = 0;
  BUCKETS.forEach(function (b) { o[b] = total(rows, b); t += o[b]; });
  return t > 0 ? o : null;
}

/** Spend groups of a row set, by ADJ_OPEN, biggest first, positives only. */
function groupTotals(rows) {
  const by = new Map();
  rows.forEach(function (r) {
    const g = r.VENDOR_GROUP || '(no group)';
    const cur = by.get(g) || { name: g, value: 0, n: 0 };
    cur.value += Number(scale(r.ADJ_OPEN, 'ADJ_OPEN')) || 0;
    cur.n += 1;
    by.set(g, cur);
  });
  return Array.from(by.values()).filter(g => g.value > 0).sort((a, b) => b.value - a.value);
}

/**
 * The query itself, behind a disclosure. Tries the repo file first (it is
 * published beside the notes); falls back to the excerpt every derivation
 * record carries, so the panel is never empty on a deploy that ships only
 * `site-v2/`.
 */
async function sqlCard(der, co) {
  const c = card('The query behind this page', SQL_FILE);
  const box = h('<details class="sqlbox-host"><summary class="btn sm">Show the SQL</summary></details>');
  box.style.margin = '0';
  const body = h('<div style="margin-top:12px"></div>');
  box.appendChild(body);
  c.appendChild(box);
  c.appendChild(h(
    '<p class="tnote">Read-only, and reviewed adversarially before it was allowed near the board. ' +
    'Money columns are plain rupees — the display divides by a lakh or a crore, the query never does. ' +
    'This file is not edited by the dashboard (CONTRACT §0.6): changing one of these queries silently ' +
    'changes the books.</p>'
  ));

  let text = null, from = null;
  for (const src of SQL_SOURCES) {
    try {
      const r = await fetch(src[0], { cache: 'no-cache' });
      if (r.ok) { text = await r.text(); from = src[1]; break; }
    } catch (e) { /* try the next location */ }
  }

  if (!text) {
    const d = der && (der['ap-trade-open'] || der['ap-book-open']);
    if (d && d.sql && d.sql.text) {
      text = d.sql.text;
      from = 'the excerpt carried in the derivation record' +
             (Array.isArray(d.sql.lines) ? ' (lines ' + d.sql.lines[0] + '–' + d.sql.lines[1] + ')' : '');
    }
  }

  if (!text) {
    body.appendChild(empty({
      what: 'The query text is not published with this build.',
      why: 'Neither published copy of the file was reachable and no derivation record carried an ' +
           'excerpt. The query itself is in the repo at pipeline/sql/vendor-ageing.sql.'
    }));
    return c;
  }

  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const html = lines.map(function (ln, i) {
    return '<span class="ln">' + (i + 1) + '</span>' + esc(ln);
  }).join('\n');
  body.appendChild(h('<div class="sqlbox"><pre><code>' + html + '</code></pre></div>'));
  body.appendChild(h('<div class="sqlfoot"><span>' + esc(from) + '</span><span>' +
    num(lines.length) + ' lines</span><span>reads OPCH · JDT1 · OCRD · OCRG · OVPM · ORPC</span></div>'));
  return c;
}

/** The page footer: where the numbers came from, and how old they are. */
function paintFoot(m, co, asOf) {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
