/* ────────────────────────────────────────────────────────────────────────────
   grpo.html — Goods Receipt PO, and the GR/IR liability behind it.

   The question this page answers: what has come through JIVO's gate that no
   vendor bill has been booked against yet? That is a real liability the books
   do not carry as a payable — by definition no bill exists, so none of it
   appears in payables or in vendor ageing. It is ADDITIONAL supplier exposure.

   Two things make a naive version of this page wrong, and both are drawn on it
   rather than filed away:

     • The result set is FACETED. Seven scopes (TOTAL, CLASS, MONTH, BRANCH,
       VENDOR, VENDOR_UNBILLED, WAREHOUSE) are stacked in one array. Summing
       every row multiplies the book by roughly seven. Every total on this page
       comes from the single row where SCOPE = 'TOTAL' and GRP_KEY = 'ALL'.
     • The plain unbilled total is mostly JIVO owing itself. 64% of Beverages'
       figure is one internal stock-adjustment card and 92% of Mart's is a
       sister company. v1 shipped the headline with those included; this page
       leads on EXT_UNBILLED_GROSS and draws the deduction as a waterfall.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */

  "This is a TODAY dashboard (PDN1.LineStatus). LineStatus is a current-state flag with no history, so a historical --as-of run silently DROPS lines that were open then and have since been billed - measured at as-of 2026-05-31: Oil 143 docs / 67.69 L and Bev 165 / 8.81 L invisible. Never quote a month-end GR/IR provision from this section without saying so.",
  "INTERNAL_ADJ and INTERCOMPANY are detected by CARD NAME (CardName LIKE 'STOCK GOODS%' and LIKE '%JIVO%'). A differently-named internal adjustment card would be classed EXTERNAL and would inflate EXT_UNBILLED_GROSS - the very number the headline quotes. Unresolved; worth a jivo-correct if Accounts knows the real rule.",
  "GR/IR is NOT in the A/P ledger. By definition no vendor bill exists, so none of this appears in vendor-ageing / payables and it must never be reconciled against them. It is ADDITIONAL supplier exposure: Oil trade payable plus 6.48 Cr of GR/IR. A reader who assumes payables already covers it understates what JIVO owes.",
  "OLDEST_UB_DAYS on the TOTAL row is over ALL cards, not external only (OLDEST_UB_DAYS). It happens to be an external receipt in all three books today, so the two agree - do not rely on that. It is NULL, never 0, when a facet has nothing unbilled (Oil: 44 of 60 VENDOR rows, 24 of 32 WAREHOUSE rows, 6 of 24 MONTH rows).",
  "INV_SAMEDAY_PCT, INV_PAIR_DOCS, INV_SAMEDAY_DOCS and INV_LAG_* are NULL on every WAREHOUSE row by design - an invoice lag is a document property and a warehouse is a line attribute - and NULL wherever nothing was invoiced. Rendering NULL as 0% would report perfect failure where there is no measurement.",
  "PO_DOCNUMS and AP_INVOICE_DOCNUMS change TYPE with cardinality: int when there is exactly one, comma-separated string when there are several, null when none. A renderer calling .split(',') crashes on the int; a renderer formatting it as a number mangles the list.",
  "Ageing runs off the GRPO's own DocDate (OPDN.DocDate), which at JIVO is the gate-in date (C-0017) - not the A/P invoice date, which is a different date in the books (C-0022). Do not re-age this section on an invoice date to make it agree with a payables report.",
  "Detail is capped at 1000 rows per company and summary at 300 (ORDER BY open value DESC). Live today 456/47/285 and 185/93/151, so nothing is truncated - but a renderer must check the cap rather than assume, or a growing GR/IR problem will quietly stop appearing.",
  "The detail slice is a SEPARATE query, so summary and detail can disagree by up to a paisa per document from independent ROUNDing (verified live: Oil +0.07 across 456 documents, Mart +0.01, Bev +0.01). Any equality check needs a tolerance; a strict == will show a false red dot.",
  "This section is genuinely live and moves during the working day. Between two reads seven minutes apart while writing this spec, Mart's UNBILLED_GROSS went from 1.66 Cr to 1.97 Cr as new intercompany receipts landed. Every figure here is stamped to one snapshot; never mix figures read at different times."
];

/* ══ 2. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** `Rs 4.41 Cr` in the spec's prose → `₹4.41 Cr` on the page. */
function rupee(s) {
  return String(s).replace(/\bRs\s(?=[\d,])/g, '₹').replace(/(\d)x\b/g, '$1×');
}

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }

/** A count, or the honest word. */
function cnt(v) {
  return (v === null || v === undefined || isNaN(Number(v))) ? 'not computed' : num(Number(v));
}

/** Sum one column over rows, lifted to rupees by its unit suffix first (§4). */
function total(rows, col) {
  let t = 0;
  for (const r of (rows || [])) {
    const v = Number(scale(r[col], col));
    if (isFinite(v)) t += v;
  }
  return t;
}

/** Manifest KPI value, accepting both `{value}` and the short `{v}` shape. */
function kpi(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  if (!k) return null;
  const v = (k.value !== undefined) ? k.value : k.v;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/** A derivation record's own value — the second published route for a KPI. */
function derValue(der, id) {
  const d = der && der[id];
  if (!d) return null;
  const v = d.value;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/** A `<a class="cvcode">C-0021</a>` linked to methodology.html. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + src + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a chart: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/** Nil test that keeps 0 — a zero receipt count is data, a missing one is not. */
function nil(v) { return v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v)); }

/**
 * THE facet rule (spec trap 1). One stack of the result set, never the whole
 * array. `TOTAL` is the only stack with exactly one row, and its GRP_KEY is
 * 'ALL' — both tests, because a future stack could be named TOTAL_SOMETHING.
 */
function facet(rows, scope) {
  return (rows || []).filter(r => r && r.SCOPE === scope);
}
function totalRow(rows) {
  return (rows || []).find(r => r && r.SCOPE === 'TOTAL' && r.GRP_KEY === 'ALL') || null;
}

/** ISO date for the browser's today, to test the build's as-of against it. */
function todayISO() {
  const d = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/** Read the page's own URL state: which rows, which cut, which sort. */
function urlState() {
  let p;
  try { p = new URLSearchParams(window.location.search); } catch (e) { p = new URLSearchParams(); }
  const kind = String(p.get('kind') || '').toUpperCase();
  const pc   = String(p.get('party_class') || '').toUpperCase();
  const md   = Number(p.get('min_days'));
  return {
    kind:    KIND_SETS.some(k => k.key === kind) ? kind : 'ALL',
    pc:      (pc && pc in CLASS_LABEL) ? pc : '',
    minDays: isFinite(md) && md > 0 ? md : 0,
    zeroQty: p.get('zero_qty_only') === 'true' || p.get('zero_qty_only') === '1',
    partly:  p.get('partly') === 'true' || p.get('partly') === '1',
    facet:   String(p.get('facet') || '').toUpperCase(),
    sort:    p.get('sort') || '',
    dir:     p.get('dir') || 'desc'
  };
}

/** Rewrite one query parameter in place and re-render. No navigation. */
function setParam(name, value) {
  try {
    const url = new URL(window.location.href);
    if (value === null || value === '' || value === false) url.searchParams.delete(name);
    else url.searchParams.set(name, value);
    window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
  } catch (e) { /* a browser without URL still re-renders below */ }
  render();
}

/** A chip button that flips one URL parameter. */
function chip(label, on, n, title, onClick) {
  const b = h('<button type="button" class="chip" aria-pressed="' + (on ? 'true' : 'false') + '">' +
    esc(label) + (n === null || n === undefined ? '' : ' <span class="n">' + num(n) + '</span>') +
    '</button>');
  if (title) b.title = title;
  b.addEventListener('click', onClick);
  return b;
}

/** UPPER-cased branch name — the stored capitalisation drifts (Bev: FACTORY/Factory). */
function branchKey(r) { return String(r.BRANCH_NAME || '(no branch)').toUpperCase(); }

/** `{COL:[label,kind,meaning]}` → the `labels` map `table()` wants. */
function labelsFor(defs) {
  const o = {};
  Object.keys(defs).forEach(k => { o[k] = defs[k][0]; });
  return o;
}
/** `{COL:[label,kind,meaning]}` → the `units` map `table()` wants. */
function unitsFor(defs) {
  const o = {};
  Object.keys(defs).forEach(k => { o[k] = defs[k][1]; });
  return o;
}
/** The column glossary: what every header on the table below actually means. */
function glossary(defs, cols, title) {
  const box = h('<details class="note-box"><summary>' + esc(title) + '</summary></details>');
  const body = h('<div class="note-body prose" style="overflow-x:auto;max-width:100%"></div>');
  const dl = h('<dl></dl>');
  (cols || Object.keys(defs)).forEach(function (k) {
    if (!defs[k]) return;
    dl.appendChild(h('<dt><b>' + esc(defs[k][0]) + '</b> <code>' + esc(k) + '</code></dt>'));
    dl.appendChild(h('<dd>' + esc(rupee(defs[k][2])) + '</dd>'));
  });
  body.appendChild(dl);
  box.appendChild(body);
  return box;
}

/* ══ 3. render ═══════════════════════════════════════════════════════════ */

async function render() {
  const co   = company();
  const main = document.getElementById('main');
  const [m, d, der] = await Promise.all([
    manifest(), slice(SECTION, co), derivations(co)
  ]);
  const rows = d.summary || [];
  const det  = d.detail  || [];
  const asOf = d.as_of || (m && m.as_of) || null;
  const sec  = (m && m.sections && m.sections[SECTION]) || null;

  main.innerHTML = '';
  const add = n => { if (n) main.appendChild(n); return n; };

  add(crumb([
    { label: 'Board', href: hrefSection('index.html', co) },
    { label: 'Goods receipts' }
  ]));

  add(h(
    '<div class="pagehead">' +
      '<div class="ctx">GRPO <span class="sep">·</span> OPDN · PDN1 · OPCH · ORPD · OCRD · OCRG' +
        (asOf ? ' <span class="sep">·</span> as of ' + esc(asOf) : '') + '</div>' +
      '<h1>Goods in, no vendor bill</h1>' +
      '<p class="lede">Everything that has physically come through the gate that no supplier bill ' +
      'has been booked against yet — the GR/IR liability. It is aged from the receipt’s own date, ' +
      'which at JIVO is the gate-in date, and it appears nowhere in payables: by definition no bill ' +
      'exists, so this is exposure <b>on top of</b> what the A/P ledger shows.</p>' +
    '</div>'
  ));

  /* -- the section could not be read: say so, never print a zero ---------- */
  if (d.error || (sec && sec.status === 'error')) {
    add(empty({
      what: 'The goods-receipt query did not return for ' + companyLabel(co) + '.',
      why: 'This is not “nothing is unbilled” — it is unknown. ' +
           (d.error ? 'Reader’s error: ' + d.error + ' ' : '') +
           ((sec && sec.error) ? 'Build error: ' + sec.error : ''),
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, asOf, rows, det);
    return;
  }

  const T = totalRow(rows);
  if (!rows.length || !T) {
    add(empty({
      what: 'No goods receipts in this book.',
      why: 'A company with no live GRPO produces an empty result set, not a set of zeros — and the ' +
           'faceted TOTAL row is missing, so there is no total to read. All three books have always ' +
           'returned one. An empty result here means a broken build, not a clean gate.',
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, asOf, rows, det);
    return;
  }

  const st       = urlState();
  const classes  = facet(rows, 'CLASS');
  const months   = facet(rows, 'MONTH').slice().sort((a, b) => String(a.GRP_KEY).localeCompare(String(b.GRP_KEY)));
  const branches = facet(rows, 'BRANCH');
  const chaseFac = facet(rows, 'VENDOR_UNBILLED');
  const detUB    = det.filter(r => r.ROW_KIND === 'UNBILLED');
  const detCNB   = det.filter(r => r.ROW_KIND === 'CLOSED_NOBILL');

  /* The external twin arrived on 2026-08-21. An older build has no EXT_* column
     and must NOT silently fall back to the contaminated total (spec empty state 3). */
  const hasExt = !nil(T.EXT_UNBILLED_GROSS);

  /* -- freshness: a past-dated build understates GR/IR structurally ------- */
  if (asOf && asOf !== todayISO()) {
    add(h(
      '<div class="caveat">' +
        '<b>This build is dated ' + esc(asOf) + ', not today.</b> Open-ness here is ' +
        '<code>PDN1.LineStatus</code>, a right-now flag with no history, so a past-dated run silently ' +
        'drops lines that were open then and have since been billed. Measured at as-of 2026-05-31 that ' +
        'was 143 Oil receipts (₹67.69 L) and 165 Bev receipts (₹8.81 L) invisible. Every figure below ' +
        'is therefore a <b>lower bound</b> on the position at that date — never quote a month-end GR/IR ' +
        'provision from it without saying so.' +
      '</div>'
    ));
  }

  /* ── 3.1 headline KPIs ───────────────────────────────────────────────── */
  const extUnbilled = kpi(m, co, 'grpo-unbilled-external');
  const allUnbilled = kpi(m, co, 'grpo-unbilled-total');

  add(kpiRow([
    { id:'grpo-unbilled-external', label:'Goods in, no vendor bill (outside suppliers)',
      value: hasExt ? extUnbilled : null, unit:'INR', tone:'bad',
      corr: (hasExt && allUnbilled !== null && allUnbilled !== extUnbilled) ? allUnbilled : undefined,
      sub:'is the plain total, JIVO’s own cards included',
      title:'EXT_UNBILLED_GROSS on the single SCOPE=TOTAL row. Line-level PDN1.GTotal, live receipts only.' },
    { id:'grpo-unbilled-docs-external', label:'Outside receipts waiting for a bill',
      value: kpi(m, co, 'grpo-unbilled-docs-external'), unit:'count',
      sub:'of ' + cnt(T.GRPO_DOCS) + ' receipts this book has ever taken in' },
    { id:'grpo-ub-90plus-external', label:'Unbilled more than 90 days (outside suppliers)',
      value: kpi(m, co, 'grpo-ub-90plus-external'), unit:'INR', tone:'bad',
      sub:'past 90 days a missing bill is a problem, not a lag' },
    { id:'grpo-ub-90plus-docs-external', label:'Outside receipts unbilled over 90 days',
      value: kpi(m, co, 'grpo-ub-90plus-docs-external'), unit:'count',
      sub:'this is the call list', tone:'warn' },
    { id:'grpo-oldest-unbilled-days', label:'Oldest receipt still without a bill',
      value: kpi(m, co, 'grpo-oldest-unbilled-days'), unit:'days',
      sub: T.OLDEST_UB_DATE ? 'goods in on ' + esc(String(T.OLDEST_UB_DATE)) : undefined,
      tone:'warn' },
    { id:'grpo-unbilled-rate-pct', label:'Share of outside receipts still unbilled',
      value: kpi(m, co, 'grpo-unbilled-rate-pct'), unit:'pct',
      sub:'stock over lifetime flow — not a monthly rate' }
  ]));

  if (!hasExt) {
    add(empty({
      what: 'This build has no external-only figure.',
      why: 'The EXT_* columns arrived on 2026-08-21. This data was generated before that, so the ' +
           'outside-supplier twin cannot be computed — and the contaminated total is NOT shown in its ' +
           'place, because on Beverages that total is 64% one internal stock-adjustment card. The ' +
           'plain total, JIVO’s own cards included, is ' + inr(T.UNBILLED_GROSS) + '.',
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
  }

  if (nil(T.OLDEST_UB_DATE) || nil(T.OLDEST_UB_DAYS)) {
    add(empty({
      what: 'Nothing in this book is unbilled, so there is no oldest receipt.',
      why: 'OLDEST_UB_DAYS is NULL, not 0 — a zero here would read as “billed today”, which is the ' +
           'opposite of the truth. Read it against the unbilled total above before believing it.'
    }));
  }

  add(h(
    '<div class="caveat">' +
      '<b>Three corrections hold this page up.</b> ' + cv('C-0021') +
      ' — <code>OPDN.CANCELED</code> is three-valued: <code>N</code> live, <code>Y</code> the ' +
      'cancelled original, <code>C</code> SAP’s cancellation mirror, and <code>Y</code> and ' +
      '<code>C</code> carry identical totals. The query keeps only <code>N</code>, on the receipt ' +
      'and on every linked bill and return; a <code>&lt;&gt; &apos;Y&apos;</code> test would add ' +
      '₹94.63 Cr of phantom receipts to Oil. ' + cv('C-0005') + ' ' + cv('C-0020') +
      ' — the plain unbilled total is largely JIVO owing itself, and the sister-company card hides ' +
      'outside the branch groups, so the class is worked out from the group name <i>and</i> the card ' +
      'name. ' + cv('C-0017') + ' ' + cv('C-0022') +
      ' — the ageing clock is the receipt’s own <code>DocDate</code>, which at JIVO is the gate-in ' +
      'date. It is <b>not</b> the A/P invoice date: those two agree on only 51% of Oil pairs, 84% of ' +
      'Mart’s and 21% of Bev’s, so a bill date can never be used to infer when the goods arrived.' +
    '</div>'
  ));

  /* ── 3.2 THE headline chart: the correction, drawn ───────────────────── */
  {
    const c = card('From every unbilled receipt to what outside suppliers are actually owed',
      'UNBILLED_GROSS → EXT_UNBILLED_GROSS · CLASS facet');
    const byClass = {};
    classes.forEach(r => { byClass[r.GRP_KEY] = r; });

    const steps = [{ label:'Goods in, no bill — every card',
                     value: Number(T.UNBILLED_GROSS), kind:'base', k:'grpo-unbilled-total' }];
    ['BRANCH','INTERCOMPANY','INTERNAL_ADJ'].forEach(function (key) {
      const r = byClass[key];
      const v = r ? Number(scale(r.UNBILLED_GROSS, 'UNBILLED_GROSS')) : 0;
      if (v > 0) steps.push({ label: CLASS_LABEL[key], value: v, kind:'sub', k:'grpo-unbilled-internal' });
    });
    steps.push({ label:'Owed to outside suppliers', value: Number(T.EXT_UNBILLED_GROSS),
                 kind:'total', k:'grpo-unbilled-external' });

    if (hasExt && steps.length > 2) {
      c.appendChild(waterfall(steps, {
        title: 'Unbilled receipts → the GR/IR liability, ' + companyLabel(co),
        format: money,
        href: s => (s && s.src && s.src.k) ? hrefDerivation(s.src.k, co) : null
      }));
    } else if (hasExt) {
      c.appendChild(empty({
        what: 'Nothing came out of the total in ' + companyLabel(co) + '.',
        why: 'Every unbilled rupee in this book sits on an outside supplier’s card — there is no ' +
             'branch, sister-company or stock-adjustment unbilled value to deduct, so there is no ' +
             'waterfall to draw. The headline ' + inr(T.EXT_UNBILLED_GROSS) + ' and the plain total ' +
             inr(T.UNBILLED_GROSS) + ' are the same figure. That is an absence, not a rounding.'
      }));
    } else {
      c.appendChild(empty({
        what: 'The deduction cannot be drawn on this build.',
        why: 'Without the EXT_* columns there is no external twin to land on, and drawing the plain ' +
             'total alone would imply the whole of it is owed outside the group.'
      }));
    }

    const intFromClass = classes.filter(r => r.GRP_KEY !== 'EXTERNAL')
                                .reduce((a, r) => a + Number(scale(r.UNBILLED_GROSS, 'UNBILLED_GROSS') || 0), 0);
    const biggest = classes.filter(r => r.GRP_KEY !== 'EXTERNAL')
                           .slice().sort((a, b) => b.UNBILLED_GROSS - a.UNBILLED_GROSS)[0];
    const shareInt = Number(T.UNBILLED_GROSS) ? 100 * intFromClass / Number(T.UNBILLED_GROSS) : null;
    c.appendChild(cap(
      'Read it as one sentence. Every open receipt line with no live vendor bill against it adds up ' +
      'to <b>' + esc(inr(T.UNBILLED_GROSS)) + '</b>. ' +
      (shareInt === null ? '' :
        '<b>' + esc(shareInt.toFixed(1)) + '% of that is JIVO owing itself</b>' +
        (biggest ? ' — mostly ' + esc(CLASS_LABEL[biggest.GRP_KEY] || biggest.GRP_KEY).toLowerCase() +
                   ' at ' + esc(inr(Number(biggest.UNBILLED_GROSS))) : '') + ', ') +
      'and no outside bill will ever arrive for it: stock moving between JIVO’s own GST ' +
      'registrations, a sister company, or the internal stock-adjustment card. What is left, <b>' +
      esc(inr(T.EXT_UNBILLED_GROSS)) + '</b>, is the GR/IR money Accounts has to chase. ' +
      'v1 of this board shipped the headline with JIVO’s own cards <i>inside</i> it.'
    ));
    add(c);
  }

  /* ── 3.3 the class split, and the manifest’s own disagreement ────────── */
  {
    const c = card('Who the unbilled receipts are with', 'CLASS facet · 1 row per party class');
    if (classes.length > 1) {
      c.appendChild(stackedBars(classes.map(r => ({
        CLASS: (CLASS_LABEL[r.GRP_KEY] || r.GRP_KEY) + ' (' + num(r.UNBILLED_DOCS || 0) + ')',
        UB_0_30: Number(r.UB_0_30) || 0, UB_31_60: Number(r.UB_31_60) || 0,
        UB_61_90: Number(r.UB_61_90) || 0, UB_91_180: Number(r.UB_91_180) || 0,
        UB_181_365: Number(r.UB_181_365) || 0, UB_365PLUS: Number(r.UB_365PLUS) || 0
      })), {
        labelKey:'CLASS', keys: UB_BUCKETS, sort:false, format: money,
        title:'How old the unbilled receipts are, by who the party is'
      }));
      c.appendChild(cap(
        'One bar per party class, split across the six ageing bands on the receipt’s own date. ' +
        'This is the chart that separates ordinary flow from a real problem: goods arriving a few ' +
        'days ahead of the bill land in the first band and clear themselves, while anything past 90 ' +
        'days is a bill that never came. <b>The ramp runs cool → hot with age</b>, and every band ' +
        'prints its rupee value in the legend, so nothing here depends on colour. ' +
        'Across every card ' + esc(inr(Number(T.UB_90PLUS_GROSS))) + ' is past 90 days; on outside ' +
        'suppliers alone it is ' + esc(inr(Number(T.EXT_UB_90PLUS_GROSS))) + ' over ' +
        esc(cnt(T.EXT_UB_90PLUS_DOCS)) + ' receipts.'
      ));
    } else if (classes.length === 1) {
      c.appendChild(table(classes, {
        co: co, cols: ['GRP_LABEL'].concat(UB_BUCKETS).concat(['UNBILLED_GROSS','UNBILLED_DOCS']),
        labels: labelsFor(SUM_COLS), units: unitsFor(SUM_COLS), page: false,
        caption:'The one party class in this book'
      }));
      c.appendChild(cap(
        'Only one party class carries a receipt in this book, so this is a table and not a ' +
        'single-bar chart — a lone bar implies a comparison that does not exist.'
      ));
    } else {
      c.appendChild(empty({
        what: 'The class facet returned no rows.',
        why: 'CLASS is one of the seven stacks in this result set and it re-totals to the TOTAL row ' +
             'to the paisa, so its absence means the build is incomplete — not that nobody supplied ' +
             'anything.'
      }));
    }

    /* The internal figure: the manifest and the derivation record disagree here,
       and the disagreement is a build defect, not a movement in the books. */
    const intManifest = kpi(m, co, 'grpo-unbilled-internal');
    const intDerived  = classes.length
      ? classes.filter(r => r.GRP_KEY !== 'EXTERNAL')
               .reduce((a, r) => a + Number(scale(r.UNBILLED_GROSS, 'UNBILLED_GROSS') || 0), 0)
      : null;
    const intRecord = derValue(der, 'grpo-unbilled-internal');

    c.appendChild(kpiRow([
      { id:'grpo-unbilled-internal', label:'Of the unbilled, the part on JIVO’s own cards',
        value: intDerived, unit:'INR', tone:'warn',

    if (intManifest !== null && intDerived !== null && Math.abs(intManifest - intDerived) > 1) {
      c.appendChild(h(
        '<div class="caveat">' +
          '<b>The figure above is not the one in the build manifest, and that is deliberate.</b> ' +
          'The manifest publishes <code>grpo-unbilled-internal</code> as ' + esc(inr(intManifest)) +

          esc(inr(intRecord === null ? intDerived : intRecord)) + '; and adding up the class rows on ' +
          'this page gives ' + esc(inr(intDerived)) + '. <b>The page shows the last of the three</b>, ' +
          'because that is the spec’s own independent recipe for this KPI — every unbilled rupee on a ' +
          'card that is not <code>EXTERNAL</code> — and it is arithmetic anyone can repeat from the ' +
          'table below. The KPI’s formula is <code>UNBILLED_GROSS − EXT_UNBILLED_GROSS</code>: ' +
          esc(inr(Number(T.UNBILLED_GROSS))) + ' − ' + esc(inr(Number(T.EXT_UNBILLED_GROSS))) + '. ' +
          'On 2026-08-22 this same id was published as the whole unbilled total for a few hours, so ' +

  /* ── 3.4 the chain, and where it stops ───────────────────────────────── */
  {
    const c = card('Purchase order → goods in → vendor bill → payment: where the chain stops',
      'GRPO_DOCS = INVOICED_DOCS + NOINV_DOCS, exactly');

    const docs   = Number(T.GRPO_DOCS);
    const ubDocs = Number(T.UNBILLED_DOCS) || 0;
    const cnbDocs= Number(T.CLOSED_NOBILL_DOCS) || 0;
    const clean  = docs - ubDocs - cnbDocs;
    const extUb  = Number(T.EXT_UNBILLED_DOCS) || 0;
    const intUb  = ubDocs - extUb;
    const old90  = Number(T.EXT_UB_90PLUS_DOCS) || 0;
    const fresh  = extUb - old90;

    const links = [];
    if (clean  > 0) links.push({ source:'Goods receipts', target:'Billed, nothing outstanding', value: clean });
    if (ubDocs > 0) links.push({ source:'Goods receipts', target:'A line with no bill',          value: ubDocs });
    if (cnbDocs> 0) links.push({ source:'Goods receipts', target:'Closed, never billed',         value: cnbDocs });
    if (extUb  > 0) links.push({ source:'A line with no bill', target:'Outside suppliers (GR/IR)', value: extUb });
    if (intUb  > 0) links.push({ source:'A line with no bill', target:'JIVO’s own cards',          value: intUb });
    if (fresh  > 0) links.push({ source:'Outside suppliers (GR/IR)', target:'Within 90 days',      value: fresh });
    if (old90  > 0) links.push({ source:'Outside suppliers (GR/IR)', target:'Over 90 days — chase', value: old90 });

    if (links.length) {
      c.appendChild(flow(null, links, {
        title: 'Every receipt this book has taken in, by what happened next',
        unit: 'n', format: num, height: 300
      }));
      c.appendChild(cap(
        'Ribbon thickness is <b>documents, not rupees</b> — the point of this chart is how few of ' +
        'them go wrong. Of ' + esc(cnt(docs)) + ' receipts, ' + esc(cnt(clean)) + ' were billed and ' +
        'carry nothing outstanding; ' + esc(cnt(ubDocs)) + ' still have a line with no live bill ' +
        'against it and ' + esc(cnt(cnbDocs)) + ' were closed with the bill never booked at all. ' +
        'The first split is an exact identity in the query ' +
        '(<code>INVOICED_DOCS + NOINV_DOCS = GRPO_DOCS</code>, ' + esc(cnt(T.INVOICED_DOCS)) + ' + ' +
        esc(cnt(T.NOINV_DOCS)) + ' = ' + esc(cnt(docs)) + '); the two failure modes are the two row ' +
        'kinds of the chase list, which add up to it exactly. <b>Most receipts do get billed</b> — ' +
        'which is what stops the GR/IR figure being read as a scandal.'
      ));
    } else {
      c.appendChild(empty({
        what: 'The chain cannot be drawn.',
        why: 'Every stage of the receipt → bill chain came back at zero documents in this book, which ' +
             'has never been true of any of the three. Check the build before reading it as a clean gate.'
      }));
    }

    /* The two ends of the chain this section genuinely cannot see. */
    const poKnown = det.filter(r => !nil(r.PO_DOCNUMS)).length;
    c.appendChild(empty({
      what: 'The purchase-order end and the payment end are not in this section.',
      why: 'A purchase order is only visible here where the receipt names one: ' + num(poKnown) +
           ' of the ' + num(det.length) + ' documents on the chase list carry a PO number, the rest ' +
           'were received without one. There is no PO document count for the whole book in this ' +
           'query, so the first stage cannot be drawn honestly and is left out rather than invented. ' +
           'The payment end cannot exist by definition — no vendor bill has been booked, so nothing ' +
           'has been paid. Payment discipline lives in payables.',
      href: hrefSection('payables', co),
      hrefLabel: 'Open payables'
    }));
    add(c);
  }

  /* ── 3.5 the chase list, ranked ──────────────────────────────────────── */
  {
    const c = card('Which suppliers are holding the unbilled bills',
      'VENDOR_UNBILLED facet · top 60 by unbilled value');
    const items = chaseFac.map(r => ({
      label: String(r.GRP_LABEL || r.GRP_KEY),
      value: Number(scale(r.UNBILLED_GROSS, 'UNBILLED_GROSS')) || 0,
      CARD: r.GRP_KEY
    })).filter(i => i.value > 0);

    if (items.length) {
      c.appendChild(pareto(items, {
        title: 'Ranked by what is unbilled, with the running share',
        top: 12, format: money,
        href: it => (it && it.src && it.src.CARD) ? hrefParty(it.src.CARD, co) : null
      }));
      const sorted = items.slice().sort((a, b) => b.value - a.value);
      const sum = sorted.reduce((a, b) => a + b.value, 0);
      const t5  = sorted.slice(0, 5).reduce((a, b) => a + b.value, 0);
      const share = sum ? 100 * t5 / sum : null;
      c.appendChild(cap(
        'Bars are each card’s share of the unbilled value; the line is the running total. ' +
        (share === null ? '' : '<b>The top five names are ' + esc(share.toFixed(1)) +
          '% of it</b>, so this is five phone calls, not ' + esc(cnt(T.UNBILLED_DOCS)) +
          ' documents to read. ') +
        'Each name carries its class in square brackets — a bar labelled ' +
        '<code>[INTERCOMPANY]</code> or <code>[INTERNAL_ADJ]</code> is JIVO, and no call will ' +
        'produce a bill. <b>This facet is the top 60 by unbilled value and does not re-total</b>: ' +
        'on Oil it is ₹647.92 Cr short of the book’s receipt total, because it is ordered by what ' +
        'is unbilled and not by what was received. Never rebuild a company figure from it.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No vendor is holding an unbilled receipt in this book.',
        why: 'The query drops vendors with nothing unbilled, so an empty chase list means every ' +
             'receipt has a bill against it. Read that against the ' + inr(T.UNBILLED_GROSS) +
             ' unbilled total above — if the two disagree, the build is wrong, not the book.'
      }));
    }
    add(c);
  }

  /* ── 3.6 big and old ─────────────────────────────────────────────────── */
  {
    const c = card('Age against size — the big old ones', 'DAYS_OPEN × OPEN_GROSS · chase list');
    const pts = det.filter(r => !nil(r.DAYS_OPEN) && !nil(r.OPEN_GROSS))
                   .map(r => ({
                     x: Number(r.DAYS_OPEN),

    const dropped = det.length - pts.length;
    if (pts.length) {
      c.appendChild(scatter(pts, {

        xLabel: 'days since the goods arrived', yLabel: 'open value', format: money,

      }));

        'JIVO-internal outlier cannot be mistaken for a supplier one. The x-axis is days since the ' +

        (dropped > 0 ? ' ' + num(dropped) + ' rows carry no age or no open value and are left out ' +
          'rather than drawn at zero.' : '')
      ));
    } else {
      c.appendChild(empty({
        what: 'There is nothing to plot.',
        why: 'No document on the chase list carries both an age and an open value. With ' +
             cnt(T.UNBILLED_DOCS) + ' receipts reported unbilled in the summary, that is a ' +
             'disagreement between the two queries, not an empty book.'
      }));
    }
    add(c);
  }

  /* ── 3.7 the receipt rhythm ──────────────────────────────────────────── */
  {
    const c = card('Goods received by month, outside suppliers against the whole book',
      'MONTH facet · GRPO_GROSS and EXT_GRPO_GROSS');
    if (months.length > 1) {

        { name:'Every card', points: months.map(r => ({ x: r.GRP_KEY, y: Number(scale(r.GRPO_GROSS, 'GRPO_GROSS')) || 0 })) }
      ];

        series.push({ name:'Outside suppliers only',

      }
      c.appendChild(lineArea(series, {
        title:'Receipt value by month, ' + companyLabel(co), format: money, height: 240
      }));
      const quiet = months.filter(r => !(Number(r.GRPO_DOCS) > 0));
      const thin  = months.filter(r => Number(r.GRPO_DOCS) > 0 && Number(r.GRPO_DOCS) < 5);
      c.appendChild(cap(
        'This puts the GR/IR number in proportion: ' + esc(inr(T.EXT_UNBILLED_GROSS)) +
        ' unbilled against ' + esc(inr(T.EXT_GRPO_GROSS)) + ' received from outside suppliers over ' +
        esc(num(months.length)) + ' months, which is the ' +
        esc((kpi(m, co, 'grpo-unbilled-rate-pct') === null) ? 'share above' :

        ' on the headline row. <b>It is also the fastest way to spot a broken feeder.</b> A month ' +
        'whose receipts collapse to near nothing is usually a factory GRPO feed that stopped, which ' +
        'has happened at JIVO before. ' +
        (quiet.length ? '<b>' + esc(num(quiet.length)) + ' month(s) here carry no receipt at all.</b> '

                                     : 'Every month in range carries receipts. ')) +
        'The gap between the two lines is JIVO’s own stock movement — on Mart it is most of the book.'
      ));
    } else if (months.length === 1) {
      c.appendChild(empty({
        what: 'This book has receipts in only one month.',
        why: 'A single point is not a trend, so no line is drawn: ' + esc(String(months[0].GRP_KEY)) +
             ' carries ' + inr(Number(months[0].GRPO_GROSS)) + ' across ' +
             cnt(months[0].GRPO_DOCS) + ' receipts.'
      }));
    } else {
      c.appendChild(empty({

             'incomplete — not that nothing was ever received.'
      }));
    }
    add(c);
  }

  /* ── 3.8 is the bill booked on the day the goods arrive? ─────────────── */
  {
    const c = card('Is the bill booked on the day the goods arrive?',
      'BRANCH facet · INV_SAMEDAY_PCT and INV_LAG_AVG_DAYS');
    const measurable = branches.filter(r => Number(r.INV_PAIR_DOCS) > 0 && !nil(r.INV_SAMEDAY_PCT));
    const unmeasured = branches.filter(r => !(Number(r.INV_PAIR_DOCS) > 0) || nil(r.INV_SAMEDAY_PCT));

    if (measurable.length) {
      const grid = h('<div class="meters"></div>');
      grid.style.display = 'grid';
      grid.style.gap = '14px';
      grid.style.gridTemplateColumns = 'repeat(auto-fit,minmax(min(100%,280px),1fr))';
      measurable.slice()
        .sort((a, b) => Number(b.INV_PAIR_DOCS) - Number(a.INV_PAIR_DOCS))
        .forEach(function (r) {
          const cell = h('<div></div>');
          /* Counts, not the pre-divided percentage: the meter then prints its
             own share, and it lands on INV_SAMEDAY_PCT exactly (verified on
             every branch row in all three books). */
          cell.appendChild(meter(Number(r.INV_SAMEDAY_DOCS), Number(r.INV_PAIR_DOCS), {
            title: String(r.GRP_LABEL || r.GRP_KEY),
            label: 'billed on the day the goods arrived', maxLabel: 'receipts that were billed at all',
            unit: 'n', format: num, okAt: 0.8, warnAt: 0.5, badAt: 0.3
          }));
          cell.appendChild(h(
            '<p class="tnote">' + esc(cnt(r.INV_SAMEDAY_DOCS)) + ' of ' + esc(cnt(r.INV_PAIR_DOCS)) +
            ' billed receipts. Average wait ' +
            (nil(r.INV_LAG_AVG_DAYS) ? 'not computed' : esc(num(r.INV_LAG_AVG_DAYS)) + ' days') +
            ', median ' +
            (nil(r.INV_LAG_MED_DAYS) ? 'not computed' : esc(num(r.INV_LAG_MED_DAYS)) + ' days') +
            '. Unbilled here: ' + esc(inr(Number(r.UNBILLED_GROSS))) + '.</p>'
          ));
          grid.appendChild(cell);
        });
      c.appendChild(grid);
      c.appendChild(cap(
        'One meter per GST branch, against a 100% target. This is where the discipline problem ' +
        'actually lives — the company average, ' +
        esc((kpi(m, co, 'grpo-sameday-billing-pct') === null) ? 'not computed'
            : Number(kpi(m, co, 'grpo-sameday-billing-pct')).toFixed(2) + '%') +
        ', hides branches that are twice as good and half as good as each other. ' +
        '<b>Read the mean beside the median.</b> Oil’s average wait is 14 days and its median is 0: ' +
        'most bills land the same day and a long tail drags the mean. ' + cv('C-0022') +
        ' — “same day” means the first live A/P invoice carries the receipt’s own DocDate, and at ' +
        'JIVO that is the gate-in date, not the vendor’s invoice date.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No branch in this book has a bill lag to measure.',
        why: 'INV_SAMEDAY_PCT is NULL wherever nothing was invoiced. Rendering it as 0% would report ' +
             'perfect failure where there is no measurement at all.'
      }));
    }
    if (unmeasured.length) {
      c.appendChild(empty({
        what: num(unmeasured.length) + ' branch(es) have no lag to measure: ' +
              unmeasured.map(r => String(r.GRP_LABEL || r.GRP_KEY)).join(', ') + '.',
        why: 'INV_PAIR_DOCS is zero or NULL there — no receipt in that branch has ever fed a live ' +
             'A/P invoice, so there is no interval to average. A 0% meter would say the branch never ' +
             'bills on time; the truth is that nothing has been billed at all.'
      }));
    }
    add(c);
  }

  /* ── 3.9 branch × age ────────────────────────────────────────────────── */
  {
    const c = card('Where the unbilled value is stuck — branch against age',
      'chase list · SUM(OPEN_GROSS) by BRANCH_NAME × AGE_BUCKET');
    /* BRANCH_NAME's stored capitalisation drifts (Bev holds both FACTORY and
       Factory), so group case-insensitively or the same branch splits in two. */
    const keys = [], byBranch = {};
    detUB.forEach(function (r) {
      const k = branchKey(r);
      if (!byBranch[k]) { byBranch[k] = {}; keys.push(k); }
      const b = String(r.AGE_BUCKET || '(none)');
      byBranch[k][b] = (byBranch[k][b] || 0) + (Number(scale(r.OPEN_GROSS, 'OPEN_GROSS')) || 0);
    });
    const usedAges = AGE_ORDER.filter(a => keys.some(k => byBranch[k][a] > 0));

    if (keys.length && usedAges.length) {
      keys.sort((a, b) => {
        const s = k => usedAges.reduce((t, a2) => t + (byBranch[k][a2] || 0), 0);
        return s(b) - s(a);
      });
      c.appendChild(heatmap({
        rows: keys,
        cols: usedAges.map(a => a + ' d'),
        values: keys.map(k => usedAges.map(a => byBranch[k][a] || 0))
      }, {
        title:'Unbilled value by branch and age', format: money, cellH: 34
      }));
      c.appendChild(cap(
        'This crosses two facets the summary can only show one at a time, so a cell answers ' +
        '“<i>which branch is sitting on old unbilled receipts</i>” rather than “which branch is big”. ' +
        '<b>Warm cells on the right-hand columns are the audit findings.</b> It is built from the ' +
        'chase list rather than the summary, because the summary has no branch × age cross — and it ' +
        'covers live-liability rows only (<code>ROW_KIND = UNBILLED</code>), not the closed-never-billed ' +
        'ones, which are an audit item and not money owed.'
      ));
    } else {
      c.appendChild(empty({
        what: 'There is no branch-by-age grid to draw.',
        why: 'No live-liability row on the chase list carries both a branch and an age band. With ' +
             cnt(T.UNBILLED_DOCS) + ' receipts reported unbilled in the summary, that is a ' +
             'disagreement between the two queries rather than a clean book.'
      }));
    }
    add(c);
  }

  /* ── 3.10 the rest of the measured figures ───────────────────────────── */
  {
    const c = card('The whole book, and the two things that are not a liability',
      'every figure links to its derivation');
    c.appendChild(kpiRow([
      { id:'grpo-unbilled-total', label:'Goods in, no bill — every card, JIVO’s own included',
        value: allUnbilled, unit:'INR',
        sub:'the contaminated total; the headline above is the trade twin' },
      { id:'grpo-received-external', label:'Goods received from outside suppliers',
        value: kpi(m, co, 'grpo-received-external'), unit:'INR',
        sub:'lifetime, line-level PDN1.GTotal — header freight is not in it' },
      { id:'grpo-sameday-billing-pct', label:'Vendor bill booked on the day the goods arrived',
        value: kpi(m, co, 'grpo-sameday-billing-pct'), unit:'pct',
        sub: nil(T.INV_PAIR_DOCS) ? undefined : 'over ' + cnt(T.INV_PAIR_DOCS) + ' billed receipts' },
      { id:'grpo-inv-lag-avg-days', label:'Average wait from goods in to bill booked',
        value: kpi(m, co, 'grpo-inv-lag-avg-days'), unit:'days',
        sub: nil(T.INV_LAG_MED_DAYS) ? 'the median is not computed'
                                     : 'the median is ' + num(T.INV_LAG_MED_DAYS) + ' days' }
    ]));
    c.appendChild(kpiRow([
      { id:'grpo-closed-nobill-gross', label:'Receipts closed without a bill ever being booked',
        value: kpi(m, co, 'grpo-closed-nobill-gross'), unit:'INR', tone:'warn',
        sub:'an audit item, NOT owed — never added to the GR/IR figure' },
      { id:'grpo-ub-zeroqty-gross', label:'Unbilled service lines that will never clear themselves',
        value: kpi(m, co, 'grpo-ub-zeroqty-gross'), unit:'INR', tone:'warn',
        sub: nil(T.UB_ZEROQTY_LINES) ? 'already inside the unbilled total — never add it on top'
             : num(T.UB_ZEROQTY_LINES) + ' freight and expense lines, already inside the total above' }
    ]));
    c.appendChild(cap(
      '<b>Neither of the two amber figures is money owed, and neither belongs in the GR/IR number.</b> ' +
      'The first is receipts somebody closed while the bill never came — the goods are in, the ' +
      'liability was never recorded, and no line is open any more to record it against. The second is ' +
      'zero-quantity freight and expense lines: they never close by themselves because there is no ' +
      'quantity to consume, so a human has to close them, and their value is <i>already inside</i> ' +
      'the unbilled total above. Adding either on top double counts. ' +
      'The dot beside each label is the cross-check: green means a second independent route ' +
      'reproduced the figure, amber means no second route ran, red means the two disagree — and a ' +
      'red dot never hides the number. Hover it for both routes and the gap between them.'
    ));
    add(c);
  }

  /* ── 3.11 raw source columns that are not a KPI ──────────────────────── */
  {
    const c = card('The rest of the TOTAL row', 'raw columns, read off the single SCOPE=TOTAL row');
    const EXTRA = [
      ['GRPO_DOCS',           'Receipts taken in, ever'],
      ['GRPO_LINES',          'Lines on them'],
      ['GRPO_GROSS',          'Value received, every card'],
      ['GRPO_GST',            'GST on those receipts'],
      ['UNBILLED_LINES',      'Lines with no bill'],
      ['UNBILLED_NET',        'Unbilled, ex-GST'],
      ['UNBILLED_GST',        'GST not yet in the input-credit ledger'],

      ['CLOSED_NOBILL_DOCS',  'Closed with no bill'],

    ];

    EXTRA.forEach(function (x) {
      const col = x[0], label = x[1];
      const v = T[col];

    else c.appendChild(empty({

    }));
    c.appendChild(cap(
      'Raw source columns, not derived figures — every one is read off the <b>single</b> row where ' +
      '<code>SCOPE = &apos;TOTAL&apos;</code> and <code>GRP_KEY = &apos;ALL&apos;</code>. ' +
      '<b>Two of them are named almost the same and mean different things.</b> ' +
      '<code>NOINV_GROSS</code> is the full receipt value of documents with no bill anywhere; ' +
      '<code>UNBILLED_GROSS</code> counts only the offending <i>lines</i>. On Oil that is ' +
      '₹7.12 Cr against ₹6.48 Cr. They answer different questions and the names do not say so.'
    ));

    if (Number(T.RETURNED_DOCS) > 0) {
      c.appendChild(cap(
        'Return-linked receipts: <b>' + esc(cnt(T.RETURNED_DOCS)) + '</b> documents, ' +
        esc(cnt(T.RETURNED_LINES)) + ' lines, ' + esc(inr(Number(T.RETURNED_GROSS))) +
        ' — and that is the GRPO line’s value, not the return’s. It is near-empty by construction: ' +
        'more than 96% of JIVO’s goods returns are raised standalone with no link back to a receipt.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No goods return in this book can be traced back to a receipt.',
        why: 'That is not “nothing was returned”. More than 96% of JIVO’s goods returns are raised ' +
             'standalone (RPD1.BaseType = −1) with no link to the GRPO they came from, so this ' +
             'column cannot see them. The consequence matters: goods received, never billed and then ' +
             'returned standalone STAY in the GR/IR bucket above. Upper bound by vendor overlap: ' +
             '₹43.50 L on Oil, ₹0.83 L on Beverages.',
        href: hrefSection('goods-return', co),
        hrefLabel: 'Open goods returns'
      }));
    }
    add(c);
  }

  /* ── 3.12 the chase list ─────────────────────────────────────────────── */
  {
    const c = card('Every receipt still owing a bill',
      SECTION + '.' + co + '.json · detail · ' + num(det.length) + ' rows');

    if (!det.length) {
      c.appendChild(empty({
        what: 'The chase list could not be built.',
        why: 'The summary says ' + cnt(T.UNBILLED_DOCS) + ' receipts carry an unbilled line and ' +
             cnt(T.CLOSED_NOBILL_DOCS) + ' were closed without one, yet the detail query returned ' +
             'nothing. The two queries disagree — this is a build failure, not an empty book, and no ' +
             'empty table is shown beside a non-zero figure.',
        href: hrefSection('health', co),
        hrefLabel: 'Check the build’s health'
      }));
      add(c);
    } else {
      /* row-kind chips */
      const bar1 = h('<div class="toolbar"></div>');
      const chips1 = h('<div class="chips" role="group" aria-label="Which problem"></div>');
      KIND_SETS.forEach(function (k) {
        const set = det.filter(k.test);
        if (!set.length) return;
        chips1.appendChild(chip(k.label, st.kind === k.key, set.length,
          k.why + ' Worth ' + inr(total(set, 'OPEN_GROSS')) + '.',
          () => setParam('kind', k.key === 'ALL' ? '' : k.key)));
      });
      bar1.appendChild(chips1);
      c.appendChild(bar1);

      /* party-class chips */
      const present = [];
      det.forEach(r => { if (r.PARTY_CLASS && present.indexOf(r.PARTY_CLASS) < 0) present.push(r.PARTY_CLASS); });
      if (present.length > 1) {
        const bar2 = h('<div class="toolbar"></div>');
        const chips2 = h('<div class="chips" role="group" aria-label="Who the party is"></div>');
        chips2.appendChild(chip('Every party', st.pc === '', det.length,
          'No class filter.', () => setParam('party_class', '')));
        present.forEach(function (k) {
          const set = det.filter(r => r.PARTY_CLASS === k);
          chips2.appendChild(chip(CLASS_LABEL[k] || k, st.pc === k, set.length,
            (CLASS_WHY[k] || '') + ' Worth ' + inr(total(set, 'OPEN_GROSS')) + '.',
            () => setParam('party_class', st.pc === k ? '' : k)));
        });
        bar2.appendChild(chips2);
        c.appendChild(bar2);
      }

      /* the extra cuts the KPI drill-downs hand over */
      const extras = h('<div class="toolbar"></div>');
      const chips3 = h('<div class="chips" role="group" aria-label="Extra cuts"></div>');
      chips3.appendChild(chip('Older than 90 days', st.minDays === 91,
        det.filter(r => Number(r.DAYS_OPEN) > 90).length,
        'DAYS_OPEN over 90 — strictly greater, matching the SQL’s 91-180 boundary.',
        () => setParam('min_days', st.minDays === 91 ? '' : 91)));
      chips3.appendChild(chip('Zero-quantity lines only', st.zeroQty,
        det.filter(r => Number(r.NUM_ZEROQTY_UNBILLED_LINES) > 0).length,
        'Receipts carrying a freight or expense line that will never close by itself.',
        () => setParam('zero_qty_only', st.zeroQty ? '' : 'true')));
      chips3.appendChild(chip('Carries a live bill already', st.partly,
        det.filter(r => r.HAS_AP_INVOICE === 'Y').length,
        'HAS_AP_INVOICE is text “Y”/“N” and is NOT the unbilled test: a receipt can carry a live ' +
        'bill on one line and nothing on another, and it still belongs on this list.',
        () => setParam('partly', st.partly ? '' : 'true')));
      extras.appendChild(chips3);
      c.appendChild(extras);

      /* apply */
      const set = KIND_SETS.find(k => k.key === st.kind) || KIND_SETS[0];
      let shown = det.filter(set.test);
      const active = [];
      if (st.pc)      { shown = shown.filter(r => r.PARTY_CLASS === st.pc); active.push(CLASS_LABEL[st.pc] || st.pc); }
      if (st.minDays) { shown = shown.filter(r => Number(r.DAYS_OPEN) >= st.minDays); active.push('at least ' + st.minDays + ' days old'); }
      if (st.zeroQty) { shown = shown.filter(r => Number(r.NUM_ZEROQTY_UNBILLED_LINES) > 0); active.push('zero-quantity lines only'); }
      if (st.partly)  { shown = shown.filter(r => r.HAS_AP_INVOICE === 'Y'); active.push('already carries a live bill'); }
      if (active.length) {
        const pill = h('<div class="toolbar"><span class="pill info">' + esc(active.join(' · ')) +
          '</span> <button type="button" class="btn sm">clear these filters</button></div>');
        pill.querySelector('button').addEventListener('click', function () {
          try {
            const url = new URL(window.location.href);
            ['party_class','min_days','zero_qty_only','partly'].forEach(k => url.searchParams.delete(k));
            window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
          } catch (e) { /* still re-renders */ }
          render();
        });
        c.appendChild(pill);
      }

      const detCols = Object.keys(DET_COLS);
      const sortCol = (st.sort && detCols.indexOf(st.sort) >= 0) ? st.sort : 'OPEN_GROSS';
      c.appendChild(table(shown, {
        co: co,
        cols: detCols,
        labels: labelsFor(DET_COLS),
        units: unitsFor(DET_COLS),
        links: {
          CARD_CODE: 'party',
          CARD_NAME: { kind:'party', card:'CARD_CODE' },
          DOC_NUM:   (v, r, cc) => (nil(r.DOC_ENTRY) ? null : hrefDocument(OBJ_GRPO, r.DOC_ENTRY, cc)),
          DOC_ENTRY: (v, r, cc) => (nil(v) ? null : hrefDocument(OBJ_GRPO, v, cc))
        },
        sort: (st.dir === 'asc' ? '' : '-') + sortCol,
        filter: 'Find a receipt by vendor, number or the vendor’s own bill ref…',
        facets: ['AGE_BUCKET','PARTY_CLASS'],
        total: ['OPEN_NET','OPEN_GST','OPEN_GROSS','DOC_NET','DOC_GST','DOC_GROSS',
                'NUM_LINES','NUM_UNBILLED_LINES','NUM_ZEROQTY_UNBILLED_LINES','AP_INVOICE_COUNT'],
        empty: {
          what: 'No receipt matches this cut.',
          why: 'The chips above filter a real, non-empty chase list — nothing matched this ' +
               'combination. That is not a zero liability; widen the filter to see the rows that exist.'
        },
        caption: 'Goods receipts still owing a vendor bill — one row per receipt'
      }));

      c.appendChild(cap(
        '<b>The totals row adds up only the rows currently in view</b>, and the column to read is ' +
        '<code>Open value</code> — the offending lines, not the header. ' +
        '<b>Open value can exceed the header value, and that is correct.</b> On ' +
        esc(num(det.filter(r => Number(r.OPEN_GROSS) > Number(r.DOC_GROSS)).length)) + ' of these ' +
        esc(num(det.length)) + ' rows the SAP header carries <code>VatSum = 0</code> while the lines ' +
        'do carry tax, so the header figure is the net receipt. <code>DOC_*</code> reconciles to the ' +
        'SAP screen; <code>OPEN_*</code> is the number to chase. Never “fix” one to match the other. ' +
        '<b>Header status is display only</b> — ' +
        esc(num(detUB.filter(r => r.DOC_STATUS === 'C').length)) + ' row(s) here read ' +
        '<code>C</code> while still carrying an unbilled line, exactly as ' + cv('C-0019') +
        ' requires on the A/R side: open-ness is decided line by line. ' +
        'Purchase-order and bill numbers are shown as text on purpose: SAP hands them over as a ' +
        'number when there is one and as a comma-separated string when there are several, and ' +
        'formatting that as a figure mangles the list. They are <code>DocNum</code>s, not ' +
        '<code>DocEntry</code>s, so neither can be linked to its document from here.'
      ));

      c.appendChild(glossary(DET_COLS, detCols, 'What every column on this table means'));

      if (det.length >= 1000) {
        c.appendChild(empty({
          what: 'This chase list is truncated at the query cap of 1,000 rows.',
          why: 'The detail query is hard-capped and ordered by open value, so the smallest receipts ' +
               'are missing. Any total taken from this table is therefore a LOWER BOUND. The summary ' +
               'figures above are unaffected — they are aggregated in SQL before the cap applies.'
        }));
      }
      add(c);
    }
  }

  /* ── 3.13 the facet explorer ─────────────────────────────────────────── */
  {
    const c = card('The same book, cut seven ways', 'the faceted summary · ' + num(rows.length) + ' rows');
    c.appendChild(h(
      '<p class="blurb">This one result set stacks seven independent aggregates of the same company. ' +
      '<b>Adding every row together multiplies the book by about seven</b> — it is the single ' +
      'biggest mistake available on this page, and on a sibling section the same shape read as ' +
      '+300%. Pick one stack.</p>'
    ));
    const barF = h('<div class="toolbar"></div>');
    const chipsF = h('<div class="chips" role="group" aria-label="Which facet"></div>');
    const current = FACETS.some(f => f[0] === st.facet) ? st.facet : 'CLASS';
    FACETS.forEach(function (f) {
      const set = facet(rows, f[0]);
      if (!set.length) return;
      chipsF.appendChild(chip(f[1], current === f[0], set.length, f[2],
        () => setParam('facet', f[0])));
    });
    barF.appendChild(chipsF);
    c.appendChild(barF);

    const fRows = facet(rows, current);
    const meta = FACETS.find(f => f[0] === current);
    const sumCols = ['GRP_KEY','GRP_LABEL','GRPO_DOCS','GRPO_GROSS','UNBILLED_DOCS','UNBILLED_GROSS',
                     'EXT_UNBILLED_GROSS','UB_90PLUS_GROSS','OLDEST_UB_DAYS','CLOSED_NOBILL_GROSS',
                     'UB_ZEROQTY_GROSS','INVOICED_DOCS','NOINV_DOCS','INV_SAMEDAY_PCT',
                     'INV_LAG_AVG_DAYS','INV_LAG_MED_DAYS']
                    .filter(k => k in SUM_COLS);
    const reTotals = (current === 'CLASS' || current === 'MONTH' || current === 'BRANCH');
    c.appendChild(table(fRows, {
      co: co,
      cols: sumCols,
      labels: labelsFor(SUM_COLS),
      units: unitsFor(SUM_COLS),
      links: (current === 'VENDOR' || current === 'VENDOR_UNBILLED')
        ? { GRP_KEY: 'party', GRP_LABEL: { kind:'party', card:'GRP_KEY' } } : {},
      sort: '-UNBILLED_GROSS',
      filter: 'Find a row in this stack…',
      total: reTotals ? ['GRPO_DOCS','GRPO_GROSS','UNBILLED_DOCS','UNBILLED_GROSS',
                         'EXT_UNBILLED_GROSS','UB_90PLUS_GROSS','CLOSED_NOBILL_GROSS',
                         'UB_ZEROQTY_GROSS','INVOICED_DOCS','NOINV_DOCS'] : false,
      empty: { what:'This stack is empty in ' + companyLabel(co) + '.',
               why:'The query produced no rows for this facet in this book.' },
      caption: 'Summary facet: ' + (meta ? meta[1] : current)
    }));
    c.appendChild(cap(
      (meta ? '<b>' + esc(meta[1]) + '</b> — ' + esc(meta[2]) + ' ' : '') +
      (reTotals
        ? 'A totals row is shown because this stack genuinely re-totals to the whole book to the paisa.'
        : '<b>No totals row is shown, on purpose.</b> ' +
          (current === 'TOTAL'
            ? 'This stack is the whole book already.'
            : current === 'WAREHOUSE'
              ? 'Warehouse money re-totals, but its DOCUMENT counts do not — a receipt spanning two ' +
                'warehouses is counted once in each row (live: Oil sums to 10,668 against a book of ' +
                '10,663). A totals row would print a number that looks right and is not.'
              : 'This stack is the top 60 only. Re-totalling from it silently understates: on Oil the ' +
                'chase-list stack is ₹647.92 Cr short of the book’s receipt value, because it is ' +
                'ordered by unbilled value and not by what was received.')) +
      ' Percentages and lags are NULL wherever nothing was invoiced, and NULL on every warehouse row ' +
      'by design — an invoice lag is a property of a document, and a warehouse is a property of a line.'
    ));
    c.appendChild(glossary(SUM_COLS, sumCols, 'What every column on this table means'));

    if (rows.length >= 300) {
      c.appendChild(empty({
        what: 'The summary is truncated at the query cap of 300 rows.',
        why: 'One of the top-60 stacks has grown past its cap, so this explorer is not showing every ' +
             'row the book has. The TOTAL row and the re-totalling stacks are unaffected.'
      }));
    }
    add(c);
  }

  /* ── 3.14 how to read this ───────────────────────────────────────────── */
  {
    const c = card('How to read this', 'every way a naive version of this page goes wrong');
    c.appendChild(h(
      '<p class="blurb">These are not caveats in the small-print sense. Each one is a specific, ' +
      'measured way that the obvious reading of this data produces a wrong number, found by ' +
      'attacking the query against live SAP.</p>'
    ));
    const ol = h('<div class="prose"><ol></ol></div>');
    const list = ol.querySelector('ol');
    TRAPS.forEach(function (t) { list.appendChild(h('<li>' + esc(rupee(t)) + '</li>')); });
    c.appendChild(ol);
    c.appendChild(h(
      '<p class="tnote">The corrections behind them: ' +
      ['C-0001','C-0005','C-0017','C-0019','C-0020','C-0021','C-0022'].map(cv).join(' ') +
      ' — each links to the full record on the methodology page. ' + cv('C-0001') +
      ' is why <b>no quantity appears anywhere on this page</b>: receipt lines mix units of measure ' +
      '(oil in tonnes, packaging in single bottles) and <code>PDN1.OpenQty</code> is broken at JIVO — ' +
      'it still equals the ordered quantity on fully invoiced closed lines. There is no tonnage and ' +
      'no bottle count here, and one must not be added without a separate pass over the UoM ' +
      'conversion. Where a quantity does appear at JIVO it is in <b>pieces</b> — single bottles — ' +
      'and the “20 PCS” in an item name is carton configuration only.</p>'
    ));
    c.appendChild(h(
      '<p class="tnote"><b>What this section cannot answer.</b> Whether the GR/IR figure agrees with ' +
      'a general-ledger accrual balance is not checked — <code>JDT1</code>/<code>OJDT</code> were ' +
      'never opened for receipt journal entries, so this ages the <i>documents</i>, not the account. ' +
      'A partially drawn line is treated as fully billed (the bill test is an existence test), which ' +
      'makes the figure understate by about ₹1,732 across all three books — deliberately not fixed, ' +
      'because pro-rating it would need the unsafe unit conversion above.</p>'
    ));
    /* ui.js note() renders the working note's fenced code and pipe tables with
       no scroller of their own, so at 390px an OPEN disclosure pushes the whole
       page sideways (payables.html does the same — the browser gate never opens
       the details). assets/ belongs to another agent, so the scroller goes here. */
    const noteHost = h('<div style="overflow-x:auto;max-width:100%"></div>');
    noteHost.appendChild(note(SECTION));
    c.appendChild(noteHost);
    add(c);
  }

  /* ── 3.15 the SQL ────────────────────────────────────────────────────── */
  add(await sqlCard(der, co));

  paintFoot(m, co, asOf, rows, det);
}

/* ══ 4. pieces ═══════════════════════════════════════════════════════════ */

/**
 * The query itself, behind a disclosure. `site-v2/` is the deploy root, so
 * `../pipeline/sql/...` 404s in production; the build copies the queries to
 * `sql/`. The index is consulted BEFORE the fetch — a fetch-and-fail logs a
 * console 404 the page cannot suppress, and the browser gate counts console
 * errors as failures, so a benign 404 would drown a real one.
 */
async function sqlCard(der, co) {
  const c = card('The query behind this page', SQL_FILE);
  const box = h('<details class="sqlbox-host"><summary class="btn sm">Show the SQL</summary></details>');
  box.style.margin = '0';
  const body = h('<div style="margin-top:12px"></div>');
  box.appendChild(body);
  c.appendChild(box);
  c.appendChild(h(
    '<p class="tnote">Read-only, and reviewed adversarially before it was allowed near the board — ' +
    'eighteen attacks, four defects found and fixed. Money columns are plain rupees: no column in ' +
    'this section ends in <code>_L</code> or <code>_CR</code>, so the display divides by a lakh or a ' +
    'crore and the query never does. The chase list comes from a <b>second</b> file, ' +
    '<code>sql/grpo-detail.sql</code>, which aggregates per document rather than per line — that is ' +
    'why it is a genuine cross-check on the summary, and also why the two can differ by a paisa per ' +
    'document from independent rounding (live: Oil +₹0.07 across 456 documents). ' +
    'This file is not edited by the dashboard (CONTRACT §0.6): changing one of these queries ' +
    'silently changes the books.</p>'
  ));

  let text = null, from = null;
  try {
    const idx = await fetch(SQL_INDEX, { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null));
    if (Array.isArray(idx) && idx.indexOf(SECTION) >= 0) {
      const r = await fetch(SQL_FILE, { cache: 'no-cache' });
      if (r.ok) { text = await r.text(); from = 'the full query, ' + SQL_FILE; }
    }
  } catch (e) { /* not published beside the site — fall back below */ }

  if (!text) {
    const d = der && (der['grpo-unbilled-external'] || der['grpo-unbilled-total']);
    if (d && d.sql && d.sql.text) {
      text = d.sql.text;
      from = 'the excerpt carried in the derivation record' +
             (Array.isArray(d.sql.lines) ? ' (lines ' + d.sql.lines[0] + '–' + d.sql.lines[1] + ')' : '');
    }
  }

  if (!text) {
    body.appendChild(empty({
      what: 'The query text is not published with this build.',
      why: 'It is not listed in ' + SQL_INDEX + ', and no derivation record carried an excerpt. ' +
           'The file itself is in the repo at pipeline/' + SQL_FILE + '.'
    }));
    return c;
  }

  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const html = lines.map(function (ln, i) {
    return '<span class="ln">' + (i + 1) + '</span>' + esc(ln);
  }).join('\n');
  body.appendChild(h('<div class="sqlbox"><pre><code>' + html + '</code></pre></div>'));
  body.appendChild(h('<div class="sqlfoot"><span>' + esc(from) + '</span><span>' +
    num(lines.length) + ' lines</span><span>reads OPDN · PDN1 · OPCH · PCH1 · ORPD · RPD1 · OCRD · OCRG</span></div>'));
  return c;
}

/** The page footer: where the numbers came from, and how old they are. */
function paintFoot(m, co, asOf, rows, det) {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
      '<div><b>Section</b> — grpo, from <code>OPDN</code>/<code>PDN1</code> (the receipt and its ' +
        'lines) matched against <code>OPCH</code>/<code>PCH1</code> (A/P invoice) and ' +
        '<code>ORPD</code>/<code>RPD1</code> (goods return), with <code>OCRD</code>/<code>OCRG</code> ' +
        'for the vendor and its group. Live documents only — <code>CANCELED = &apos;N&apos;</code>.</div>' +
      '<div><b>Shape</b> — the summary is faceted: ' + num((rows || []).length) + ' rows stacked into ' +
        'seven aggregates of the same book, and every total on this page is read from the one row ' +
        'where <code>SCOPE = &apos;TOTAL&apos;</code>. The detail is a chase list of ' +
        num((det || []).length) + ' documents, not a register — a fully billed receipt is not in it.</div>' +
      '<div><b>Book</b> — ' + esc(companyLabel(co)) + '. Figures from one company are not comparable ' +
        'with another’s, and adding the three together double counts JIVO’s inter-book trading.</div>' +
      '<div><b>Freshness</b> — ' + (asOf ? 'as of ' + esc(asOf) + '. ' : '') +
        (gen ? 'Built ' + esc(ago(gen)) + ' (' + esc(gen) + '). ' : 'Build time unknown. ') +
        'This section moves during the working day — between two reads seven minutes apart while the ' +
        'spec was being written, Mart’s unbilled total went from ₹1.66 Cr to ₹1.97 Cr. Never mix ' +
        'figures read at different times. The page re-reads the manifest every minute and redraws ' +
        'itself when the build moves.</div>' +
      '<div><b>Read-only</b> — this board issues no write to SAP, ever (CONTRACT §0.2).</div>' +
    '</div>' +
    '<p><a href="' + esc(hrefSection('methodology.html', co)) + '">Methodology and the corrections</a> · ' +
    '<a href="' + esc(hrefDerivation('grpo-unbilled-external', co)) + '">How the headline is derived</a> · ' +
    '<a href="' + esc(hrefSection('payables', co)) + '">Payables (this liability is NOT in it)</a> · ' +
    '<a href="' + esc(hrefSection('goods-return', co)) + '">Goods returns</a> · ' +
    '<a href="' + esc(hrefSection('health', co)) + '">Build health</a></p>';
}

/* ══ 5. boot ═════════════════════════════════════════════════════════════ */

shell({
  title: 'Goods receipts',
  subtitle: 'Goods in with no vendor bill booked — the GR/IR liability',
  section: SECTION
});

render().catch(function (e) {
  const main = document.getElementById('main');
  if (main) {
    main.innerHTML = '';
    main.appendChild(empty({
      what: 'This page could not be rendered.',
      why: 'The data files loaded but the page failed while drawing them: ' +
           ((e && e.message) ? e.message : String(e)) +
           '. No figure on screen should be trusted until this is fixed.'
    }));
  }
  try { console.error('[grpo]', e); } catch (e2) { /* ignore */ }
});

onRefresh(render);
</script>
