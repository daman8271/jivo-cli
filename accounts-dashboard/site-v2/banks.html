<script type="module">
/* ────────────────────────────────────────────────────────────────────────────
   banks.html — the Bank & Cash Register, account by account.

   One summary row = one postable G/L account under one of the eight banking
   drawers of the chart of accounts. The page exists to hold two things in
   front of the reader that a naive rendering of this table gets wrong:

     1. the seven TOT_* columns are BROADCAST — the same company total repeated
        on every row. Summing one multiplies the company by the row count.
     2. "cash and bank" is not cash. JIVO keeps almost nothing in its current
        accounts and settles its bills from a cash-credit line, so the headline
        here is the NET bank position — deposits and cash less every rupee the
        banks have lent — and on Oil that number is negative.

   Account numbers never leave SAP in full: every digit inside an account name
   is x'd out in the query, and the number itself is 'xxxx' + the last four.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */
import {
  shell, crumb, kpiRow, table, empty, note,
  manifest, slice, derivations, company, companyLabel,
  money, num, scale, ago, esc,
  hrefDerivation, hrefSection, hrefCaveat, hrefBank,
  onRefresh
} from './assets/core.js';
import { waterfall, lineArea, donut, hbars, scatter, sparkline }
  from './assets/charts.js';

/* ══ 1. section constants — straight out of specs/bank-accounts.json ══════ */

const SECTION  = 'bank-accounts';
const SQL_FILE = 'sql/bank-accounts.sql';

/** col -> {label, unit, meaning}, verbatim from the spec's columns[]. */
const SPEC_COLS = {"COMPANY_SCHEMA": {"label": "Book","unit": "text","meaning": "HANA schema the row came from - JIVO_OIL_HANADB / JIVO_MART_HANADB / JIVO_BEVERAGES_HANADB. Constant within a slice; its only real use is proving a slice was not cross-loaded, and de-duplicating on it before reading a broadcast TOT_* column if the three slices are ever concatenated."},"AS_OF": {"label": "As of","unit": "date","meaning": "The cut-off the whole row was computed to. Every JDT1 line with RefDate <= this is in the balance. Not a snapshot of SAP as it stood that day: it is today's ledger filtered by date. Live 2026-08-22 in all three books."},"CATEGORY": {"label": "What kind of account","unit": "text","meaning": "One of eight, mapped from the PARENT drawer's name, never from the account code: CURRENT_ACCOUNT, PAYMENT_WALLET, CASH_IN_HAND, CASH_CREDIT_OD, FIXED_DEPOSIT, TERM_LOAN, VEHICLE_LOAN, CREDIT_CARD. Beverages has no CASH_CREDIT_OD, VEHICLE_LOAN or CREDIT_CARD row at all - those drawers exist but are empty."},"CATEGORY_KIND": {"label": "Family","unit": "text","meaning": "BANK (current accounts, wallets, CC/OD), CASH, DEPOSIT (FDR), BORROWING (term, vehicle, card). Note CASH_CREDIT_OD is KIND='BANK', not 'BORROWING', so any 'what do we owe' filter must say CATEGORY_KIND='BORROWING' OR CATEGORY='CASH_CREDIT_OD' - that exact pair appears in the SQL (lines 581, 626) and must be copied, not paraphrased."},"IS_CASH_AND_BANK": {"label": "In the cash-and-bank total","unit": "text","meaning": "'Y' for CURRENT_ACCOUNT, PAYMENT_WALLET, CASH_IN_HAND and CASH_CREDIT_OD - the four drawers TOT_CASH_AND_BANK_L sums. It includes the drawn overdraft, which is why that total is NEGATIVE for Oil. 20 'Y' rows in Oil, 20 in Mart, 13 in Bev."},"GL_ACCT_CODE": {"label": "G/L account","unit": "text","meaning": "OACT.AcctCode. Unique within a company and the drill key for gl-account.html. It is a chart-of-accounts code, NOT a bank account number - safe to display in full."},"GL_DRAWER": {"label": "Sits under","unit": "text","meaning": "OACT.AcctName of the parent drawer - the string the CATEGORY mapping is built from (sql lines 265-286). Names are used rather than codes so the query survives a renumbered chart; a renamed drawer would make CATEGORY NULL while this column kept the new name."},"GL_ACCT_LABEL_MASKED": {"label": "Account","unit": "text","meaning": "OACT.AcctName with EVERY digit replaced by 'x' ('INDIAN BANK-xxxxxxxxxx'), because the bank account number lives inside the account name. The raw name is never emitted anywhere in this section. It keeps whatever the account name carries, including JIVO unit tags - 'PUNJAB & SIND BANK TPT' is a unit tag, not part of the bank's name."},"BANK_CODE": {"label": "Bank code","unit": "text","meaning": "ODSC.BankCode, or DSC1's code when the house-bank row AGREES. NULL on 9 Oil / 11 Mart / 5 Bev rows (cash boxes, wallets, accrued-interest heads). Beverages' 1104102 shows 'INB' from the ODSC master even though its DSC1 row MISMATCHes - the DSC1 branch is suppressed there, the ODSC name and code are not."},"BANK_NAME": {"label": "Bank","unit": "text","meaning": "Canonical bank name from the ODSC master, else the leading words of the account name but ONLY if that name contains 'BANK'. NULL by design where the account is not bank-linked: cash boxes, 'FDR - ACCRUED INTEREST', and Oil's mis-filed 1103115 'R & D WHEAT GRASS' which hangs under the FDR drawer. NULL means 'not a bank', not 'unknown bank' - never fall back to the account label."},"BANK_NAME_SOURCE": {"label": "How the bank was identified","unit": "text","meaning": "ODSC_MASTER (Oil 61 / Mart 33 / Bev 13), GL_ACCT_NAME (3 / 3 / 2 - parsed out of the account name, weaker) or UNRESOLVED (6 / 8 / 3 - genuinely not bank-linked). Read it before trusting BANK_NAME in a grouping: a GL_ACCT_NAME value is whatever capitals the account name happened to start with."},"BRANCH": {"label": "Branch","unit": "text","meaning": "DSC1 BranchName/Branch, and ONLY when HOUSE_BANK_AGREES='AGREE'. That is 5 rows in Oil (SONEPAT, RAJOURI GARDEN) and ZERO in Mart and Beverages, because Mart has no joinable DSC1 row and Bev's single one mismatches. In a book with no house bank, hide the column rather than print 44 dashes."},"IS_HOUSE_BANK": {"label": "Has a house-bank row","unit": "text","meaning": "'Y' when a DSC1 row exists for this G/L account - it does NOT mean the row is correct. Bev 1104102 is 'Y' with HOUSE_BANK_AGREES='MISMATCH': its DSC1 row was copied from Oil's chart and names a different account. v1 renders a green 'house' pill off this column alone (site/index.html:1503), which is misleading on that one Bev row. Read HOUSE_BANK_AGREES."},"HOUSE_BANK_AGREES": {"label": "Does the house-bank row match","unit": "text","meaning": "AGREE = the DSC1 account digits and the digits inside the G/L account name overlap (Oil 5/5). MISMATCH = they do not, so the DSC1 branch and bank code are suppressed and the number falls back to the account name (Bev 1104102). UNKNOWN = the account name holds no digits to compare. NO_HOUSE_BANK_ROW = no DSC1 row at all (Oil 65, Mart 44, Bev 17). DSC1 is nearly empty and partly wrong; this column is what makes it safe to use."},"ACCT_NO_MASKED": {"label": "A/c no","unit": "text","meaning": "'xxxx' plus the last 4 digits, from DSC1 when the house-bank row agrees, otherwise from the digits embedded in the account name. NULL when the source string holds fewer than 4 digits - 9 Oil / 6 Mart / 5 Bev rows (cash boxes, wallets, 'HSBC BANK LAI', accrued-interest heads). NULL means the number is not in the books, not that the account has none, and it must never be back-filled with the G/L code."},"ACCT_NO_SOURCE": {"label": "Where the number came from","unit": "text","meaning": "DSC1_HOUSE_BANK (5 Oil only - the trustworthy source), GL_ACCT_NAME (56 / 38 / 13 - digits scraped out of the account name) or NONE. Where the name writes the number in hyphenated groups ('HSBC BANK A/C- 166-794941-511'), 'the last 4 as written' is the last 4 of the concatenated digits."},"ACCT_NO_NDIGITS": {"label": "Digits in the number","unit": "count","meaning": "How many digits the source string held, so a reader can see the true account-number length without seeing the number. 0 wherever ACCT_NO_MASKED is NULL. It is a length, not money and not an identifier."},"BALANCE_L": {"label": "Balance","unit": "INR","meaning": "LAKHS, SIGNED, SAP-native: SUM(Debit) - SUM(Credit) over lines with RefDate <= as_of. POSITIVE = DEBIT = money sitting with JIVO (or an over-repaid facility). NEGATIVE = CREDIT = JIVO owes (drawn facility, or a genuinely overdrawn account). Same convention as OCRD.Balance. Cancelled payments are deliberately NOT filtered here - the storno pair nets to exactly zero, so this stays equal to what SAP itself reports."},"CURRTOTAL_TODAY_L": {"label": "SAP's own balance","unit": "INR","meaning": "LAKHS, SIGNED. OACT.CurrTotal, SAP's stored trial-balance figure. LIFETIME - it is NOT filtered by as_of. It matches BALANCE_L exactly on all 132 rows today (max |diff| 0.00 L, and 8e-6 rupees on the raw check), which is what makes it a genuine second route; at any historical as_of it will legitimately differ and the cross-check must report 'not applicable'."},"BALANCE_SIGN": {"label": "Dr / Cr","unit": "text","meaning": "'DEBIT', 'CREDIT' or 'NIL', computed on the RUPEE balance (ROUND(BAL,2)), not on the rounded lakh column. So a row can read BALANCE_L = 0.00 and BALANCE_SIGN = 'DEBIT' - live: Mart 1105001 CASH SALE, which holds under Rs 1,000. Use this column, not the sign of BALANCE_L, whenever the answer turns on direction."},"FUNDS_AVAILABLE_L": {"label": "Available","unit": "INR","meaning": "LAKHS. MAX(0, BALANCE_L) - the debit side only. Per account this is fine; SUMMED OVER ALL ROWS IT IS NOT LIQUIDITY: Oil's 2,610.16 L is 1,491.19 L of over-repaid CC/OD facilities plus 1,113.33 L of fixed deposits, leaving 5.64 L actually on call. v1 labels this column 'available' in the account table (site/index.html:1499) - that is per-row correct and column-total misleading."},"AMOUNT_DRAWN_L": {"label": "Drawn","unit": "INR","meaning": "LAKHS. MAX(0, -BALANCE_L) - the credit side as a positive number. On a facility it is the borrowing; on an asset account it is an overdraw. Summed over ALL rows it is NOT borrowings (Oil 8,605.14 L against a true 8,594.50 L) because it sweeps in the overdrawn cash box and wallet."},"OVERDRAWN_FLAG": {"label": "Overdrawn","unit": "text","meaning": "'Y' only for an ASSET-side category (CURRENT_ACCOUNT, PAYMENT_WALLET, CASH_IN_HAND, FIXED_DEPOSIT) whose raw balance is below -Rs 100. A CC/OD or loan account in credit is borrowing and is deliberately NOT flagged. Live: Oil 2 (a cash till at -10.23 L and PayTM at -0.42 L), Mart 3 (including its main operating account 1104108 at -2.17 L), Bev 0. The threshold is in rupees, so an account between -Rs 100 and -Rs 500 is flagged while BALANCE_L still reads -0.00."},"EST_ANNUAL_INTEREST_L": {"label": "Estimated annual interest","unit": "INR","meaning": "LAKHS. AMOUNT_DRAWN_L x 0.0847 on facility rows, 0 elsewhere. 8.47% is an INPUT CONSTANT (sql line 255), not derived from the books, applied to TODAY's drawn balance. It is an inferred upper-bound run-rate - not an accrual, not a measured cost. Oil's 727.97 L compares with 463.37 L of interest actually debited to 5610001 over the same 12 months."},"RECEIPTS_IN_12M_L": {"label": "In, 12 m","unit": "INR","meaning": "LAKHS. SUM(JDT1.Debit) over the twelve calendar months ending with the month of as_of, EXCLUDING both halves of every storno pair. Read it physically: on a CC/OD or loan account a debit is a repayment, still money in."},"PAYMENTS_OUT_12M_L": {"label": "Out, 12 m","unit": "INR","meaning": "LAKHS. SUM(JDT1.Credit) over the same window, cancellations excluded. On a facility a credit is a drawdown or an interest charge. For Oil, 94.1% of it leaves from CC/OD accounts; for Mart, 87.6% of it goes to JIVO's own companies and branches."},"NET_12M_L": {"label": "Net, 12 m","unit": "INR","meaning": "LAKHS. Receipts less payments inside the window. Unaffected by the storno fix - a cancelled pair nets to zero, so only the gross sides moved. It is window movement, NOT the change in position since the book opened, and must not be added to OPENING_BAL_L."},"AVG_MONTHLY_OUT_L": {"label": "Average month out","unit": "INR","meaning": "LAKHS. PAYMENTS_OUT_12M_L divided by ACTIVE_MONTHS_12M, not by 12, so a seasonal account is not flattered by its idle months. The flip side: Oil 2201211 reads 1,500.00 L 'per month' off a single Rs 15 Cr term-loan repayment in one active month. It is not a run-rate and must never be annualised by x12."},"CANCELLED_GROSS_12M_L": {"label": "Cancelled churn removed","unit": "INR","meaning": "LAKHS. The debit side of every storno-paired line in the window - money that never moved, taken out of the gross movement columns and reported here rather than silently dropped. Debit side equals credit side per account. A row can carry churn while showing N_LINES_12M = 0 (live: Mart 1104107, 2.21 L on an account whose only 12-month traffic was a cancelled payment)."},"INTERCO_IN_12M_L": {"label": "In, from JIVO group","unit": "INR","meaning": "LAKHS. Receipts sitting in a transaction that also touched a JIVO group or branch party (OCRG.GroupName LIKE '%BRANCH%' OR OCRD.CardName LIKE '%JIVO%'). TRANSACTION-level attribution: a journal that touches a group party at all contributes its whole bank line, so this is an UPPER BOUND, never an allocation. Oil 16,531.11 L = 19.1% of receipts."},"INTERCO_OUT_12M_L": {"label": "Out, to JIVO group","unit": "INR","meaning": "LAKHS. Same test on the credit side. Mart 16,593.56 L = 87.6% of everything it pays out - its bank account is in effect a conduit, and reading PAYMENTS_OUT_12M_L for Mart as third-party spend overstates it about eightfold. Money is flagged, never dropped: it genuinely left the bank."},"N_LINES_12M": {"label": "Lines, 12 m","unit": "count","meaning": "Journal lines on the account inside the window, cancelled/reversed lines EXCLUDED. Posting volume, not transaction count and not payment count - one payment can post several lines. 0 does not mean nothing happened: see CANCELLED_GROSS_12M_L."},"ACTIVE_MONTHS_12M": {"label": "Active months","unit": "count","meaning": "Of the twelve slots, how many carried at least one non-cancelled line. Counted on lines rather than rows precisely so a month whose only traffic was a cancelled payment does not count as active. It is the denominator of AVG_MONTHLY_OUT_L."},"MANUAL_JE_LINE_PCT_12M": {"label": "Hand-keyed","unit": "pct","meaning": "Percent of the account's 12-month LINES posted on TransType '30' (manual journal entry) rather than through a payment document. A share of lines, NOT of value. NULL where there was no traffic at all (Oil 14 / Mart 33 / Bev 12 rows) - never read that as 0%. It reads 100.0 on accounts with a single line, so weight it by N_LINES_12M: line-weighted the books run 5.4% / 0.1% / 1.4% against unweighted means of 45.6% / 7.0% / 26.2%."},"FIRST_MOVE_DATE": {"label": "First movement","unit": "date","meaning": "MIN(JDT1.RefDate) over NON-cancelled lines. NULL when the account has never really moved. 2024-09-30 (Oil, Bev) or 2024-12-31 (Mart) means the account was opened by the migration entry itself."},"LAST_MOVE_DATE": {"label": "Last movement","unit": "date","meaning": "MAX(JDT1.RefDate) over NON-cancelled lines - deliberately storno-filtered, so a cancelled payment and its reversal cannot make a dead account look alive. NULL when never used."},"DAYS_SINCE_LAST_MOVE": {"label": "Days quiet","unit": "days","meaning": "as_of minus LAST_MOVE_DATE. NULL when never used, and must not be coerced to 0 (reads as 'moved today') or to a large number (which would win any MAX for the wrong reason). Oil's maximum on a balance-carrying account is 691 days - a deposit whose last movement is the go-live entry."},"DORMANT_90D_FLAG": {"label": "Dormant","unit": "text","meaning": "'Y' when the last real movement is 90+ days old OR the account has never moved at all. 44 Oil / 34 Mart / 14 Bev rows carry it, but only 24 / 1 / 1 carry a balance - and 21 of Oil's 24 are fixed deposits, which move once a year at interest posting (all last moved 2026-03-31). Dormancy on an FD is by design; ex-deposits the genuinely idle money is 1.34 L Oil, 1.42 L Mart, 0.00 L Bev."},"NEVER_USED_FLAG": {"label": "Never used","unit": "text","meaning": "'Y' when FIRST_MOVE_DATE is NULL. Because movement is storno-filtered, it means 'never REALLY moved', not 'never posted': Mart 1104107 reads 'Y' while carrying 2.21 L of cancelled payment churn in the last 12 months. Live 4 Oil / 33 Mart / 12 Bev, none of them carrying a balance today (measured)."},"BOOK_OPENING_DATE": {"label": "Book opens","unit": "date","meaning": "The earliest RefDate posted to ANY banking account in this book, gated by as_of - derived, never hardcoded to the 2024-09-30 go-live. Oil and Beverages open 2024-09-30; MART OPENS 2024-12-31, with nothing at all before it. A hardcoded go-live date returns 0 for every Mart account. NULL at an as_of before the book opened."},"OPENING_BAL_L": {"label": "Opening balance","unit": "INR","meaning": "LAKHS, SIGNED. What this account was given on BOOK_OPENING_DATE. Oil 30 accounts, net -2,352.98 L (the overdraft was already drawn at go-live: 2201101 alone opens at -3,426.82 L). Mart 3 accounts, +83.17 L. Beverages 0.00 across all 18 rows - a measured nil, not a gap. It is a starting position, not movement, and cannot be added to NET_12M_L."},"MONTHLY_IN_L_SERIES": {"label": "Monthly in","unit": "series","meaning": "A STRING, not a number: twelve 'YYYY-MM=<lakhs>' pairs joined by ';', always 12 slots, chronological, zero-filled - a missing month means zero, never unknown. Parse with split(';') then split('='). Never sum it as a column and never pass it to a unit scaler: the name contains '_L_' but ENDS in '_SERIES', so unit detection must anchor at the end of the name. The twelve values add back to RECEIPTS_IN_12M_L within 0.02 L per account."},"MONTHLY_OUT_L_SERIES": {"label": "Monthly out","unit": "series","meaning": "Same shape, credit side. Feeds the in/out lineArea chart. Adds back to PAYMENTS_OUT_12M_L within 0.02 L per account (HANA's CAST(double AS DECIMAL) truncates rather than rounds, so the SQL rounds inside the DECIMAL domain - twelve 2-dp values still cannot sum to a 2-dp total exactly)."},"MONTHLY_NET_L_SERIES": {"label": "Monthly net","unit": "series","meaning": "Same shape, signed net per month. The only column that shows the shape of the year rather than its total - Oil's outflow spikes to 13,896 L in 2026-07 against a 7,300 L median month."},"TOT_CASH_AND_BANK_L": {"label": "'Cash and bank' (broadcast)","unit": "INR","meaning": "LAKHS, BROADCAST - identical on every row of the company. Current accounts + wallets + cash + CASH_CREDIT_OD, i.e. a NET TREASURY position that includes the drawn overdraft. Oil -3,765.06 L: captioning this 'cash' would report minus Rs 37.65 Cr of cash. Never sum it across rows (x70 in Oil); never add it to the other TOT_* columns, which it already contains."},"TOT_BANK_CURRENT_L": {"label": "Current accounts (broadcast)","unit": "INR","meaning": "LAKHS, BROADCAST. SUM(BALANCE_L) over CATEGORY='CURRENT_ACCOUNT'. Oil 5.52 L - Rs 5.5 lakh of current-account money behind Rs 865 Cr of annual receipts, which is the whole story of this section."},"TOT_CASH_IN_HAND_L": {"label": "Cash in hand (broadcast)","unit": "INR","meaning": "LAKHS, BROADCAST. Oil is NEGATIVE (-10.12 L) because 1105001 CASH SALE sits at -10.23 L. A till in credit cannot physically happen - it is a booking or timing artefact and should be read as a control finding, not as cash."},"TOT_WALLET_L": {"label": "Wallets (broadcast)","unit": "INR","meaning": "LAKHS, BROADCAST. PAYTM and RAZORPAY float. Small and often slightly negative (Oil -0.42, Mart -0.73) because settlement lags the sale."},"TOT_CC_OD_NET_L": {"label": "Cash credit / OD, net (broadcast)","unit": "INR","meaning": "LAKHS, BROADCAST, SIGNED - NEGATIVE when drawn. NET across the drawer, so Oil's -3,760.04 L is 5,251.23 L drawn less 1,491.19 L on two facility accounts that happen to sit in debit. Despite the 'NET' and 'OD' tokens in the middle of the name, it ENDS in _L and is therefore lakhs."},"TOT_FIXED_DEPOSIT_L": {"label": "Fixed deposits (broadcast)","unit": "INR","meaning": "LAKHS, BROADCAST. Oil 1,113.34 L, Mart 0.00 (17 accounts, all nil - measured), Bev 1.08 L. Largely margin held against the credit line rather than free cash, and almost all of it is dormant by design."},"TOT_BORROWINGS_L": {"label": "Bank borrowings, gross (broadcast)","unit": "INR","meaning": "LAKHS, BROADCAST, POSITIVE. GROSS drawn across CC/OD + term + vehicle + card - negatives only, so facilities sitting in debit are invisible to it and net bank debt is lower (Oil 8,594.50 gross vs 7,103.31 net). BANK borrowings only: 2202000 UNSECURED LOAN (directors', subsidiary, NBFC - Oil ~2,330 L) is deliberately outside this register."}};

/** specs/bank-accounts.json -> traps[]. The whole list, verbatim. */
const TRAPS = [
  "BROADCAST COLUMNS. The seven TOT_* columns are company-level window totals (SUM(...) OVER (), sql lines 614-628) repeated IDENTICALLY on every row. Summing one across rows multiplies it by the row count: Oil's TOT_BORROWINGS_L summed over 70 rows gives 601,615 L = Rs 6,016 Cr against a true Rs 85.95 Cr. Every TOT_* KPI must use agg='first' on one row per company, and a concatenated multi-company array must be de-duplicated on COMPANY_SCHEMA first (site/index.html:1595 does exactly this).",
  "The seven TOT_* columns are NOT DISJOINT and must never be added together. TOT_CASH_AND_BANK_L already contains TOT_BANK_CURRENT_L + TOT_CASH_IN_HAND_L + TOT_WALLET_L + TOT_CC_OD_NET_L, and TOT_BORROWINGS_L (gross drawn) overlaps TOT_CC_OD_NET_L (net). Read ONE per question. The per-account columns, by contrast, ARE safe to sum: one row per G/L account, no fan-out, no faceting.",
  "'Cash and bank' is not cash. TOT_CASH_AND_BANK_L includes the drawn overdraft, so Oil's is -3,765.06 L = MINUS Rs 37.65 Cr. The hero card deliberately publishes 'Net bank position' = current + cash + wallets + deposits - abs(borrowings) instead, because JIVO holds almost nothing in current accounts and funds itself on cash credit: a cash-and-bank headline would read as liquidity the business does not have. Oil's real net position is -Rs 74.86 Cr. Keep that reasoning attached to the number wherever it is shown.",
  "Oil's liquid position is NEGATIVE: -5.02 L across current accounts, wallets and cash. Of that, cash in hand is -10.12 L because 1105001 CASH SALE sits at -10.23 L - a till in CREDIT, which cannot physically happen. Do not present it as 'cash held'; it is a control finding (OVERDRAWN_FLAG='Y'). Mart's main operating account 1104108 ICICI is likewise at -2.17 L with Rs 122 Cr flowing through it in the year.",
  "CANCELLED PAYMENTS WERE ONCE DOUBLE-COUNTED IN EVERY GROSS-MOVEMENT COLUMN. SAP posts a cancellation as the original PLUS a mirror-image reversal and marks BOTH rows cancelled (C-0021: CANCELED is three-valued N/Y/C, so a Canceled='Y' test is not enough on its own). Before the fix Oil's receipts read 101,144.62 L against a true 86,464.88 L - an inflation of Rs 146.80 Cr, +14.5%; Mart +20.5%, Bev +11.6%. The fix filters both halves via OJDT.StornoToTr, which is DOC-TYPE AGNOSTIC and so also catches reversed manual journal entries the ORCT/OVPM flag misses (4 extra lines Oil, 8 Mart, 0 Bev). Today's removal: Oil 14,940.37 L (14.7%), Mart 4,933.42 L (20.6%), Bev 299.07 L (11.6%), all carried in CANCELLED_GROSS_12M_L. Any comparison against an extract older than 2026-08-21 will differ by exactly this amount.",
  "BALANCE_L and OPENING_BAL_L deliberately do NOT filter cancellations, and that is correct: the storno pair nets to exactly zero per account, so the ledger still equals what SAP itself reports even at an as-of falling between an original payment and its later reversal. Applying the movement filter to the balance would break the tie to OACT.CurrTotal. Never 'fix' this asymmetry.",
  "MONTHLY_IN_L_SERIES / MONTHLY_OUT_L_SERIES / MONTHLY_NET_L_SERIES ARE STRINGS, NOT SCALARS - twelve 'YYYY-MM=<lakhs>' pairs joined by ';'. They feed a lineArea chart and are parsed, never summed and never passed to a unit scaler. Their names contain '_L_' but END in '_SERIES', so unit detection must anchor at the END of the column name; a scaler keyed on 'contains _L' would multiply a string by 1e5.",
  "EVERY money column is INR LAKHS and ENDS in _L (x1e5). Anchor unit detection to the END of the name: TOT_CC_OD_NET_L, MANUAL_JE_LINE_PCT_12M and MONTHLY_NET_L_SERIES all carry misleading tokens mid-name. A column ending _L is lakhs no matter what else is in it; a column not ending _L is not money, even if it contains '_L_'. Non-money columns: N_LINES_12M, ACTIVE_MONTHS_12M, DAYS_SINCE_LAST_MOVE, ACCT_NO_NDIGITS, MANUAL_JE_LINE_PCT_12M.",
  "SUMMING AMOUNT_DRAWN_L OVER ALL ROWS IS NOT BORROWINGS. Oil gives 8,605.14 L against a true 8,594.50 L: the extra 10.65 L is a cash till and a PayTM wallet sitting in credit. The correct predicate is the one the SQL uses at lines 581 and 626 - CATEGORY_KIND='BORROWING' OR CATEGORY='CASH_CREDIT_OD' - because CASH_CREDIT_OD is KIND='BANK', not 'BORROWING'.",
  "GROSS versus NET borrowings. TOT_BORROWINGS_L counts only the drawn (negative) side, so the two Oil facilities sitting in DEBIT - 2201105 HSBC +806.68 L and 1104107 ICICI +684.51 L, 1,491.19 L together - are invisible to it. Gross Rs 85.95 Cr, net Rs 71.03 Cr. Gross is the right reading for 'what the banks have lent us'; it is the wrong reading for 'what we would repay today'.",
  "SUMMING FUNDS_AVAILABLE_L ACROSS ROWS IS NOT LIQUIDITY. Oil's 2,610.16 L is 1,491.19 L of over-repaid CC/OD facilities (not cash) plus 1,113.33 L of fixed deposits (not on call), leaving 5.64 L. v1's per-row column label 'available' is fine; a column total under it would not be.",

  "THE ACCOUNT-CODE PREFIX LIES, and ActType/CashBox do not mark bank accounts. Oil's 1104106/07/08/10 carry 1104* ('BANK ACCOUNTS') codes but hang under BANK CASH CREDIT LOAN and come out CASH_CREDIT_OD; 1103114-17 carry 1103* (STOCKS) codes but hang under FDR; 2201104 and 2201402 hang under TERM LOAN. Every one of Oil's 70 banking accounts has ActType='N' and CashBox='N' - and so do ~984 other postable accounts. The universe is the parent drawer NAME through OACT.FatherNum, never LIKE '1104%' and never a flag.",

/* ══ 2. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** `Rs 85.95 Cr` in the spec's prose → `₹85.95 Cr` on the page. */
function rupee(s) {
  return String(s).replace(/\bRs\s(?=[\d,])/g, '₹').replace(/(\d)x\b/g, '$1×');
}

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }

/** A percentage, two decimals, or the honest word. */
function pc(v) {
  return (v === null || v === undefined || isNaN(Number(v))) ? 'not computed'
                                                             : Number(v).toFixed(2) + '%';
}

/** A `<a class="cvcode">C-0021</a>` linked to methodology.html. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + src + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a chart: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/** A row inside an `.excl` block: label, amount, and the reason underneath. */
function exclRow(lab, amt, why) {
  return h('<div class="excl-row"><div class="lab">' + esc(lab) + '</div>' +
           '<div class="amt">' + esc(amt) + '</div>' +
           '<div class="why">' + why + '</div></div>');
}

/**
 * Lift one cell to RUPEES by its column suffix (CONTRACT §4). The suffix match
 * is anchored at the END of the name, which is the whole point in this section:
 * `MONTHLY_NET_L_SERIES` contains `_L_` but is a STRING, and `TOT_CC_OD_NET_L`
 * carries `_OD_NET_` mid-name and is still lakhs.
 */
function rup(r, col) {
  const n = Number(scale(r[col], col));
  return isFinite(n) ? n : 0;
}

/** Sum one per-account column over rows, in rupees. Never valid for TOT_*. */
function totalCol(rows, col) {
  let t = 0;
  for (const r of rows) {
    const n = Number(scale(r[col], col));
    if (isFinite(n)) t += n;
  }
  return t;
}

/**
 * Read a BROADCAST company total off ONE row, in rupees. Every TOT_* column is
 * `SUM(...) OVER ()` repeated identically on all 70 / 44 / 18 rows; summing one
 * multiplies the company by the row count (trap 1).
 */
function one(R0, col) {
  const n = Number(scale(R0[col], col));
  return isFinite(n) ? n : null;
}

/**
 * A facility account. The predicate is the SQL's own (lines 581 and 626),
 * copied rather than paraphrased: CASH_CREDIT_OD is KIND='BANK', not
 * 'BORROWING', so `CATEGORY_KIND='BORROWING'` alone misses the overdraft.
 */
function isFacility(r) {
  return r.CATEGORY_KIND === 'BORROWING' || r.CATEGORY === 'CASH_CREDIT_OD';
}

/** Does this row carry a balance at all? Read the SIGN, not the rounded column. */
function carriesBalance(r) {
  return !!r.BALANCE_SIGN && r.BALANCE_SIGN !== 'NIL';
}

/** Manifest KPI value, accepting both `{value}` and the older short `{v}` shape. */
function regVal(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  if (!k) return null;
  const v = (k.value !== undefined) ? k.value : k.v;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/** Manifest KPI cross-check block, or null. */
function regCheck(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  return (k && k.check && typeof k.check === 'object') ? k.check : null;
}

/**
 * Parse a `_SERIES` column: twelve `YYYY-MM=<lakhs>` slots joined by ';'.
 * It is a STRING, never a scalar — it is parsed, never summed and never passed
 * to a unit scaler (traps 7 and 8). The lakh → rupee lift happens HERE, once.
 */
function parseSeries(s) {
  const out = [];
  String(s || '').split(';').forEach(function (part) {
    if (!part) return;
    const i = part.indexOf('=');
    if (i < 0) return;
    const month = part.slice(0, i).trim();
    const lakhs = Number(part.slice(i + 1));
    if (!month || !isFinite(lakhs)) return;
    out.push({ month: month, rupees: lakhs * 1e5 });
  });
  return out;
}

/** Every account's twelve slots, added up per month: {month, in, out, net}[]. */
function monthlyTotals(rows) {
  const by = new Map();
  const take = function (col, key) {
    rows.forEach(function (r) {
      parseSeries(r[col]).forEach(function (p) {
        const cur = by.get(p.month) || { month: p.month, in: 0, out: 0, net: 0 };
        cur[key] += p.rupees;
        by.set(p.month, cur);
      });
    });
  };
  take('MONTHLY_IN_L_SERIES', 'in');
  take('MONTHLY_OUT_L_SERIES', 'out');
  take('MONTHLY_NET_L_SERIES', 'net');
  return Array.from(by.values()).sort(function (a, b) { return a.month < b.month ? -1 : 1; });
}

/** `2026-07` → `Jul 26`, for an axis that has to fit at 390px. */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(ym) {
  const m = /^(\d{4})-(\d{2})$/.exec(String(ym || ''));
  if (!m) return String(ym || '');
  return MON[Number(m[2]) - 1] + ' ' + m[1].slice(2);
}

/* ══ 3. the figures — computed here, from the slice ══════════════════════ */

/**
 * Every KPI in the section, evaluated from the rows the page is holding.
 *
 * The board's registry is the other route, not this one: it is read back in
 * §3.12 and any material disagreement is printed there rather than buried. As
 * of this build the registry still stores the raw first COLUMN for four of the
 * twenty-one ids — `bank-facility-funded-share` comes back as ₹827 Cr under a
 * `pct` unit — so a page that rendered `manifest.value` blindly would print a
 * percentage in the billions.
 */
function figures(rows) {
  const R0 = rows[0];
  const facility = rows.filter(isFacility);

  const curr   = one(R0, 'TOT_BANK_CURRENT_L');
  const cash   = one(R0, 'TOT_CASH_IN_HAND_L');
  const wallet = one(R0, 'TOT_WALLET_L');
  const fd     = one(R0, 'TOT_FIXED_DEPOSIT_L');
  const borrow = one(R0, 'TOT_BORROWINGS_L');
  const ccod   = one(R0, 'TOT_CC_OD_NET_L');
  const cab    = one(R0, 'TOT_CASH_AND_BANK_L');

  const facDebit  = totalCol(facility, 'FUNDS_AVAILABLE_L');
  const payOut    = totalCol(rows, 'PAYMENTS_OUT_12M_L');
  const ccOut     = totalCol(rows.filter(function (r) { return r.CATEGORY === 'CASH_CREDIT_OD'; }),
                             'PAYMENTS_OUT_12M_L');
  const intercoOut = totalCol(rows, 'INTERCO_OUT_12M_L');
  const intercoIn  = totalCol(rows, 'INTERCO_IN_12M_L');
  const maxOut = rows.reduce(function (a, r) { return Math.max(a, rup(r, 'PAYMENTS_OUT_12M_L')); }, 0);

  /* MANUAL_JE_LINE_PCT_12M is a share of LINES and is NULL - not 0 - where the
     account had no traffic. Weight by lines; an unweighted mean is meaningless
     because a single-line account reads 100% (trap 23). */
  const withTraffic = rows.filter(function (r) {
    return r.MANUAL_JE_LINE_PCT_12M !== null && r.MANUAL_JE_LINE_PCT_12M !== undefined;
  });
  const lines = withTraffic.reduce(function (a, r) { return a + (Number(r.N_LINES_12M) || 0); }, 0);
  const manual = lines
    ? withTraffic.reduce(function (a, r) {
        return a + (Number(r.N_LINES_12M) || 0) * (Number(r.MANUAL_JE_LINE_PCT_12M) || 0);
      }, 0) / lines
    : null;

  const carrying  = rows.filter(carriesBalance);
  const dormant   = rows.filter(function (r) { return r.DORMANT_90D_FLAG === 'Y'; });
  const dormantOn = dormant.filter(carriesBalance);
  const dormantDeposits = dormantOn.filter(function (r) { return r.CATEGORY === 'FIXED_DEPOSIT'; });
  const neverUsed = rows.filter(function (r) { return r.NEVER_USED_FLAG === 'Y'; });
  const overdrawn = rows.filter(function (r) { return r.OVERDRAWN_FLAG === 'Y'; });

  const quietDays = carrying
    .filter(function (r) {
      return r.LAST_MOVE_DATE && r.DAYS_SINCE_LAST_MOVE !== null && r.DAYS_SINCE_LAST_MOVE !== undefined;
    })
    .map(function (r) { return Number(r.DAYS_SINCE_LAST_MOVE); })
    .filter(function (n) { return isFinite(n); });

  const nil = function (x) { return (x === null || x === undefined) ? null : x; };

  return {
    R0: R0, facility: facility, facDebit: facDebit,
    payOut: payOut, ccOut: ccOut, intercoOut: intercoOut, intercoIn: intercoIn,
    carrying: carrying, dormant: dormant, dormantOn: dormantOn,
    dormantDeposits: dormantDeposits, neverUsed: neverUsed, overdrawn: overdrawn,
    withTraffic: withTraffic, lines: lines,
    curr: curr, cash: cash, wallet: wallet, fd: fd, borrow: borrow, ccod: ccod, cab: cab,
    dormantExDeposits: totalCol(
      dormant.filter(function (r) { return r.CATEGORY !== 'FIXED_DEPOSIT'; }), 'FUNDS_AVAILABLE_L'),
    sumDrawnAllRows: totalCol(rows, 'AMOUNT_DRAWN_L'),
    sumFundsAllRows: totalCol(rows, 'FUNDS_AVAILABLE_L'),

    v: {
      /* position — every one of these is read off ONE row (trap 1) */
      'bank-net-position': (curr === null || cash === null || wallet === null ||
                            fd === null || borrow === null)
        ? null : (curr + cash + wallet + fd - Math.abs(borrow)),
      'bank-liquid-now': (curr === null || cash === null || wallet === null)
        ? null : (curr + cash + wallet),
      'bank-cash-and-bank-headline': nil(cab),
      'bank-fixed-deposits': nil(fd),
      'bank-borrowings-gross': nil(borrow),
      'bank-borrowings-net': borrow === null ? null : (borrow - facDebit),
      'bank-cc-od-drawn': ccod === null ? null : Math.abs(ccod),
      'bank-est-annual-interest': totalCol(facility, 'EST_ANNUAL_INTEREST_L'),

      /* movement — per-account columns, safe to sum */
      'bank-receipts-12m': totalCol(rows, 'RECEIPTS_IN_12M_L'),
      'bank-payments-12m': payOut,
      'bank-net-12m': totalCol(rows, 'NET_12M_L'),
      'bank-cancelled-churn-12m': totalCol(rows, 'CANCELLED_GROSS_12M_L'),
      'bank-interco-in-12m': intercoIn,
      'bank-interco-out-share': payOut ? 100 * intercoOut / payOut : null,
      'bank-facility-funded-share': payOut ? 100 * ccOut / payOut : null,
      'bank-top1-out-share': payOut ? 100 * maxOut / payOut : null,

      /* hygiene */
      'bank-dormant-money': totalCol(dormant, 'FUNDS_AVAILABLE_L'),
      'bank-dormant-accounts': dormantOn.length,
      'bank-overdrawn-amount': totalCol(overdrawn, 'AMOUNT_DRAWN_L'),
      'bank-manual-je-share': manual,
      'bank-oldest-quiet-days': quietDays.length ? Math.max.apply(null, quietDays) : null
    }
  };
}

/** Build one kpiRow item from the computed figure plus whatever the caller adds. */
function kitem(FIG, id, extra) {
  const meta = KPI[id] || {};
  const v = FIG.v[id];
  return Object.assign({
    id: id,
    label: meta.label || id,
    unit: meta.unit,
    value: (v === undefined ? null : v)
  }, extra || {});
}

/**
 * Where the page and the board's registry disagree about the same id.
 * Tolerance is deliberately loose on money: every `_L` column is rounded to
 * ₹1,000, and the window totals round after summing while a per-row sum rounds
 * first, so exact equality would false-alarm on every book (trap 25).
 */
function agrees(a, b, unit, rowCount) {
  if (a === null || a === undefined || b === null || b === undefined) return false;
  if (isNaN(Number(a)) || isNaN(Number(b))) return false;
  let tol;
  if (unit === 'INR') tol = Math.max(1000 * (rowCount + 1), Math.abs(Number(b)) * 0.005);
  else if (unit === 'pct') tol = Math.max(0.05, Math.abs(Number(b)) * 0.005);
  else tol = 0.5;
  return Math.abs(Number(a) - Number(b)) <= tol;
}

function disagreements(m, co, FIG) {
  const out = [];
  const n = FIG.carrying.length;
  Object.keys(KPI).forEach(function (id) {
    const mine = FIG.v[id];
    const reg  = regVal(m, co, id);
    const unit = KPI[id].unit;
    const chk  = regCheck(m, co, id);
    if (mine === null || mine === undefined || isNaN(Number(mine))) return;
    if (reg !== null && agrees(mine, reg, unit, n)) return;
    const altRaw = (chk && chk.alt_value !== undefined && chk.alt_value !== null &&
                    !isNaN(Number(chk.alt_value))) ? Number(chk.alt_value) : null;
    out.push({
      id: id, unit: unit, mine: mine, reg: reg, chk: chk, alt: altRaw,
      altAgrees: altRaw !== null && agrees(mine, altRaw, unit, n)
    });
  });
  return out;
}

/** Format a figure by its declared unit, for the disagreement table. */
function byUnit(v, unit) {
  if (v === null || v === undefined || isNaN(Number(v))) return 'not computed';
  if (unit === 'pct') return Number(v).toFixed(2) + '%';
  if (unit === 'count') return num(v);
  if (unit === 'days') return num(v) + ' days';
  return inr(Number(v));
}

        'That is what makes a negative net position expected rather than alarming: the business ' +
        'settles from the line and keeps almost nothing in the current accounts. ' +
        (missing.length
          ? 'This book has no ' +
            missing.map(function (x) { return esc(x.label.toLowerCase()); }).join(', ') +
            ' account at all — the drawer exists in the chart of accounts and is empty, so ' +
            'nothing is drawn for it rather than a zero slice. '
          : '') +
        'The predicate behind every facility figure on this page is the query’s own — ' +
        '<code>CATEGORY_KIND=\'BORROWING\' OR CATEGORY=\'CASH_CREDIT_OD\'</code> — because ' +
        'cash credit is filed under the BANK family, not the BORROWING one.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No payments left any banking account in this book in the last twelve months.',
        why: 'Every PAYMENTS_OUT_12M_L is zero after cancelled pairs were removed. Check the ' +
             'cancelled-churn column before reading that as a quiet year.'
      }));
    }
    add(c);
  }

  /* ── 4.7 third-party money against JIVO's own ────────────────────────── */
  {
    const c = card('Third-party money against JIVO’s own', 'INTERCO_OUT_12M_L · INTERCO_IN_12M_L');
    const third = Math.max(0, FIG.payOut - FIG.intercoOut);
    if (FIG.payOut > 0 && FIG.intercoOut > 0) {
      c.appendChild(donut([
        { label: 'To JIVO group and branches', value: FIG.intercoOut },
        { label: 'To everyone else', value: third }
      ], { title: 'Twelve months of payments out, by counterparty', centerLabel: 'paid out' }));
    } else if (FIG.payOut > 0) {
      c.appendChild(donut([{ label: 'To everyone else', value: FIG.payOut }],
        { title: 'Twelve months of payments out, by counterparty', centerLabel: 'paid out' }));
      c.appendChild(cap(
        '<b>One slice on purpose.</b> Not a single payment out of this book landed in a ' +
        'transaction that also touched a JIVO group or branch party — a measured nil, drawn as ' +
        'an absent slice rather than a zero one.'
      ));
    } else {
      c.appendChild(empty({
        what: 'Nothing left this book’s banking accounts in the window.',
        why: 'With no payments out there is no counterparty split to draw.'
      }));
    }
    c.appendChild(kpiRow([
      kitem(FIG, 'bank-interco-out-share', {
        tone: (FIG.v['bank-interco-out-share'] > 50) ? 'warn' : undefined,
        sub: 'an UPPER BOUND — attribution is at transaction level'
      }),
      kitem(FIG, 'bank-interco-in-12m', {
        sub: FIG.payOut && FIG.v['bank-receipts-12m']
          ? (100 * FIG.intercoIn / FIG.v['bank-receipts-12m']).toFixed(1) + '% of everything this book banks'
          : 'receipts sitting in a transaction that also touched a group party'
      })
    ]));
    c.appendChild(cap(
      '<b>Upper bound, never an allocation.</b> A journal that touches one JIVO group party ' +
      'contributes its WHOLE bank line, so this is the most it could be. The test is ' +
      '<code>OCRG.GroupName LIKE \'%BRANCH%\' OR OCRD.CardName LIKE \'%JIVO%\'</code>: the group ' +
      'test alone misses Mart’s largest payable, <code>VENDA000001</code> “JIVO WELLNESS PVT LTD”, ' +
      'which sits in an ordinary PURCHASE group. ' + cv('C-0005') + '’s 23 named intercompany ' +
      'CardCodes are book-specific and cannot be hardcoded across three schemas. ' +
      'Where the share is large the bank account is in effect a conduit, and reading payments-out ' +
      'as third-party spend overstates it several times over. The money is flagged, never dropped ' +
      '— it genuinely left the bank.'
    ));
    add(c);
  }

  /* ── 4.8 what each account holds, against what it owes ───────────────── */
  {
    const c = card('What each account holds, against what it owes', 'BALANCE_L, signed');
    const live = FIG.carrying.slice().sort(function (a, b) {
      return Math.abs(rup(b, 'BALANCE_L')) - Math.abs(rup(a, 'BALANCE_L'));
    });
    if (live.length) {
      c.appendChild(hbars(live.map(function (r) {
        return {
          name: (CAT_PLAIN[r.CATEGORY] || r.CATEGORY) + ' · ' + r.GL_ACCT_LABEL_MASKED,
          value: rup(r, 'BALANCE_L'),
          GL_ACCT_CODE: r.GL_ACCT_CODE
        };
      }), {
        title: 'Debit to the right, credit to the left — one row per account',
        top: 16, sort: true,
        href: function (it) {
          return (it && it.src && it.src.GL_ACCT_CODE) ? hrefBank(it.src.GL_ACCT_CODE, co) : null;
        }
      }));
      c.appendChild(cap(
        'Assets and liabilities are never charted on one axis, but they belong on one page: bars ' +
        'to the right are money sitting with JIVO, bars to the left are money the banks have lent ' +
        'or an account that has gone into credit. It is the only view that puts two accounts at ' +
        'the same bank pulling opposite ways side by side, and the only one where a cash till on ' +
        'the credit side reads as the control finding it is. ' +
        '<span class="faint">(charts.js ships no diverging-bar chart, so this is its signed ' +
        'ranked-bar equivalent; the disclosure under it carries every number.)</span> ' +
        num(rows.length - live.length) + ' of ' + num(rows.length) + ' accounts carry no balance ' +
        'at all and are not drawn.'
      ));
    } else {
      c.appendChild(empty({
        what: 'Every account in this book is nil.',
        why: 'No banking account carries a debit or a credit balance today. That has never been ' +
             'true of any of the three books — check the build before reading it as a clean sheet.'
      }));
    }
    add(c);
  }

  /* ── 4.9 quiet against carried ───────────────────────────────────────── */
  {
    const c = card('Quiet against carried — which balances are stranded',
      'DAYS_SINCE_LAST_MOVE × FUNDS_AVAILABLE_L');
    const pts = rows.filter(function (r) {
      return rup(r, 'FUNDS_AVAILABLE_L') > 0 &&
             r.LAST_MOVE_DATE && r.DAYS_SINCE_LAST_MOVE !== null && r.DAYS_SINCE_LAST_MOVE !== undefined;
    }).map(function (r) {
      return {
        x: Number(r.DAYS_SINCE_LAST_MOVE),
        y: rup(r, 'FUNDS_AVAILABLE_L'),
        label: r.GL_ACCT_LABEL_MASKED,
        group: CAT_PLAIN[r.CATEGORY] || r.CATEGORY,
        GL_ACCT_CODE: r.GL_ACCT_CODE
      };
    });
    const neverWithMoney = rows.filter(function (r) {
      return rup(r, 'FUNDS_AVAILABLE_L') > 0 && !r.LAST_MOVE_DATE;
    });
    if (pts.length) {
      c.appendChild(scatter(pts, {
        title: 'One dot per account holding a debit balance',
        xLabel: 'days since the last real posting',
        yLabel: 'debit balance',
        href: function (p) { return (p && p.GL_ACCT_CODE) ? hrefBank(p.GL_ACCT_CODE, co) : null; }
      }));
      c.appendChild(kpiRow([
        kitem(FIG, 'bank-dormant-money', {
          sub: FIG.dormantDeposits.length
            ? 'ex-deposits the genuinely idle figure is ' +
              (FIG.dormantExDeposits > 0 ? inr(FIG.dormantExDeposits) : 'nil')
            : 'debit balances only, so a dormant facility in credit cannot flatter it'
        }),
        kitem(FIG, 'bank-dormant-accounts', {
          sub: FIG.dormantDeposits.length
            ? FIG.dormantDeposits.length + ' of them ' +
              (FIG.dormantDeposits.length === 1 ? 'is a fixed deposit' : 'are fixed deposits') +
              ' — dormant by design'
            : 'counted on the rupee sign, not on the rounded balance column'
        }),
        kitem(FIG, 'bank-oldest-quiet-days', {
          sub: 'longest gap on an account that still carries a balance'
        })
      ]));
      /* how many of the dormant deposits share one last-movement date, and which:
         the spec says they all move together at the annual interest posting, and
         on Oil most do - but not all, so the sentence is built from the rows. */
      const depTally = new Map();
      FIG.dormantDeposits.forEach(function (r) {
        if (!r.LAST_MOVE_DATE) return;
        depTally.set(r.LAST_MOVE_DATE, (depTally.get(r.LAST_MOVE_DATE) || 0) + 1);
      });
      const depDates = Array.from(depTally.entries()).sort(function (a, b) { return b[1] - a[1]; });
      const depTop = depDates.length ? depDates[0] : null;
      c.appendChild(cap(
        'The top-right quadrant is what to ask about: large and stale. ' +
        (FIG.dormantDeposits.length
          ? '<b>A fixed deposit sitting still is not neglect.</b> ' + FIG.dormantDeposits.length +
            (FIG.dormantDeposits.length === 1 ? ' deposit, last moved on ' : ' deposits, ') +
            (depTop
              ? (FIG.dormantDeposits.length === 1
                  ? esc(depTop[0])
                  : depTop[1] + ' of them last moved on the same day, ' + esc(depTop[0]) +
                    (depDates.length > 1
                      ? ', and the rest on ' + (depDates.length - 1) + ' other date' +
                        (depDates.length === 2 ? '' : 's') : ''))
              : 'none of which has ever moved') +
            ' — an interest posting, not a decision. That is why the headline dormant figure of ' +
            esc(inr(FIG.v['bank-dormant-money'])) +
            ' collapses to <b>' +
            esc(FIG.dormantExDeposits > 0 ? inr(FIG.dormantExDeposits) : 'nil') +
            '</b> once deposits come out. '
          : '') +
        (neverWithMoney.length
          ? '<b>' + neverWithMoney.length + ' account' + (neverWithMoney.length === 1 ? '' : 's') +
            ' holding money has never moved at all</b> and has no age to plot — left out rather ' +
            'than drawn at zero days, which would read as “moved today”. '
          : 'Every account holding money has moved at least once, so none had to be left out for a ' +
            'missing date. ') +
        'A deposit’s dormancy is by design; a current account’s is a question.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No account in this book holds a debit balance to plot.',
        why: 'Either everything is nil or everything is in credit. Read it against the position ' +
             'figures above before treating it as a finding.'
      }));
    }
    add(c);
  }

  /* ── 4.10 cancelled churn, account by account ────────────────────────── */
  {
    const c = card('Cancelled churn that was taken out', 'CANCELLED_GROSS_12M_L');
    const churn = rows.filter(function (r) { return rup(r, 'CANCELLED_GROSS_12M_L') > 0; })
                      .sort(function (a, b) {
                        return rup(b, 'CANCELLED_GROSS_12M_L') - rup(a, 'CANCELLED_GROSS_12M_L');
                      });
    if (churn.length) {
      c.appendChild(hbars(churn.map(function (r) {
        return {
          name: r.GL_ACCT_LABEL_MASKED + (Number(r.N_LINES_12M) === 0 ? ' · no surviving line' : ''),
          value: rup(r, 'CANCELLED_GROSS_12M_L'),
          GL_ACCT_CODE: r.GL_ACCT_CODE
        };
      }), {
        title: 'Money that never moved, removed from both gross columns',
        top: 12, sort: true, color: '--c3',
        href: function (it) {
          return (it && it.src && it.src.GL_ACCT_CODE) ? hrefBank(it.src.GL_ACCT_CODE, co) : null;
        }
      }));
      const ghost = churn.filter(function (r) { return Number(r.N_LINES_12M) === 0; });
      c.appendChild(cap(
        'Without this chart the fix looks like a silent disappearance the next time someone ' +
        'compares against an older extract. The debit side of every storno-paired line is shown ' +
        'here rather than dropped; per account the debit and credit sides are equal. ' +
        (ghost.length
          ? '<b>' + ghost.length + ' account' + (ghost.length === 1 ? '' : 's') +
            ' carries churn with zero surviving lines</b> — the cleanest illustration that ' +
            '“never used” means never really moved, not never posted.'
          : 'Every account here also has surviving traffic.')
      ));
    } else {
      c.appendChild(empty({
        what: 'No cancelled payment touched a banking account in this book in the window.',
        why: 'A measured nil: the storno filter found no reversed pair to remove. It is not the ' +
             'filter failing — the same filter removes money in the other two books.'
      }));
    }
    add(c);
  }

  /* ── 4.11 the cost of the debt, and how the book is kept ─────────────── */
  {
    const c = card('What the debt costs, and how the book is kept',
      'EST_ANNUAL_INTEREST_L · MANUAL_JE_LINE_PCT_12M');
    c.appendChild(kpiRow([
      kitem(FIG, 'bank-est-annual-interest', {
        tone: FIG.v['bank-est-annual-interest'] ? 'warn' : 'ok',
        sub: FIG.v['bank-est-annual-interest']
          ? 'AN ESTIMATE: 8.47% applied to today’s drawn balance — not interest paid'
          : 'measured nil — nothing is drawn, so the estimate is nil too'
      }),
      kitem(FIG, 'bank-manual-je-share', {
        sub: 'a share of LINES, weighted by lines — never a share of value'
      })
    ]));
    if (FIG.v['bank-est-annual-interest']) {
      c.appendChild(cap(
        '<b>The interest figure is inferred, not measured.</b> 8.47% is an input constant handed ' +
        'to the query, not a rate derived from the books, and it is applied to <i>today’s</i> ' +
        'drawn balance — so it is an upper-bound run-rate, not an accrual and not comparable with ' +
        'the P&amp;L. On Oil it sits about <b>57% above the interest actually debited</b>: ' +
        '₹727.97 L estimated against ₹463.37 L posted to <code>5610001 INTEREST ON BANK LOAN</code> ' +
        'over the same twelve months (measured 2026-08-21, about 7.53% gross on an average drawn ' +
        '₹6,148.65 L). Some borrowing cost also sits elsewhere — TRADEPAY and term-loan interest ' +
        'payable heads — so neither figure is the whole cost of debt.'
      ));
    }
    c.appendChild(cap(
      'The hand-keyed share is line-weighted on purpose. Per account the column is the share of ' +
      'that account’s lines posted as a manual journal rather than through a payment document, ' +
      'and it reads 100% on any account with a single line — so an unweighted average of the ' +
      'column is meaningless (it comes out around 45.6% on Oil against 5.4% line-weighted). ' +
      num(rows.length - FIG.withTraffic.length) + ' of ' + num(rows.length) + ' accounts had no ' +
      'traffic at all in the window and carry NULL, not 0%; they are left out of the weighting ' +
      'rather than counted as clean. Only three transaction types ever touch these accounts: ' +
      'incoming payment, outgoing payment and manual journal — no invoice posts to a bank account ' +
      'directly.'
    ));
    add(c);
  }

  /* ── 4.12 net position over time ─────────────────────────────────────── */
  add(await historyCard(co));

  /* ── 4.13 where this page and the registry disagree ──────────────────── */
  {
    const gaps = disagreements(m, co, FIG);
    if (gaps.length) {
      const c = card('Where this page and the board’s registry disagree',
        'manifest.kpis.' + co + ' against the figures above');
      c.appendChild(h(
        '<p class="blurb">Every figure on this page is evaluated here, from the rows this page ' +
        'is holding, following the formula the section was specified with. The board’s KPI ' +
        'registry is a second route. Where the two differ the difference is printed rather than ' +
        'hidden — and where the registry itself carries an independent re-derivation, that third ' +
        'figure is shown too, because on this section it agrees with the page.</p>'
      ));
      const box = h('<div class="excl"><h3>' + gaps.length + ' of the section’s 21 figures differ</h3></div>');
      gaps.forEach(function (g) {
        const alt = (g.alt === null || g.alt === undefined) ? null : byUnit(g.alt, g.unit);
        box.appendChild(exclRow(
          (KPI[g.id] || {}).label || g.id,
          byUnit(g.mine, g.unit),
          'This page: <b>' + esc(byUnit(g.mine, g.unit)) + '</b> · registry: <b>' +
          esc(g.reg === null ? 'nothing stored' : byUnit(g.reg, g.unit)) + '</b>' +
          (alt ? ' · the registry’s own second route: <b>' + esc(alt) + '</b>' : '') +
          ' — <a href="' + esc(hrefDerivation(g.id, co)) + '">open the derivation</a>. ' +
          (g.reg === null
            ? (Number(g.mine) === 0
                ? 'The registry stores nothing here because no row in this book matched its ' +
                  'filter; the page states the measured nil rather than leaving the card blank.'
                : 'The registry has no figure for this id at all; the page computes it from the ' +
                  'rows rather than leaving the card blank.')
            : (g.unit === 'pct' && Math.abs(g.reg) > 100
                ? 'The registry’s stored figure is larger than 100%, so it is not a share at ' +
                  'all — it is the underlying column added up under a percent unit (and above a ' +
                  'million it is the raw numerator in rupees).'
                : g.altAgrees
                  ? 'The registry’s stored primary route reads one column of a formula that ' +
                    'spans several; its own second route reproduces the figure on this page.'
                  : 'The two routes evaluate this id differently and neither reproduces the ' +
                    'other. Open the derivation and judge it yourself before quoting either.'))
        ));
      });
      c.appendChild(box);
      c.appendChild(cap(
        'A red dot beside a figure above says exactly this: two routes disagree, go and look. ' +
        'It never hides the number. This card exists because the alternative — rendering ' +
        '<code>manifest.value</code> whatever it says — publishes “shares” larger than 100% and ' +
        'blanks where a figure was measured, and at one point published a ₹5.52 lakh “net bank ' +
        'position” for an Oil book that is ₹74.86 crore in the red. The registry is being fixed ' +
        'as this section is built, so this list shrinks between builds; it is generated from ' +
        'whatever the manifest says right now, never from a hardcoded list.'
      ));
      add(c);
    }
  }

  /* ── 4.14 the table ──────────────────────────────────────────────────── */
  add(accountTable(rows, co, FIG));

  /* ── 4.15 how to read this ───────────────────────────────────────────── */
  {
    const c = card('How to read this', 'every way a naive version of this page goes wrong');
    c.appendChild(h(
      '<p class="blurb">These are not caveats in the small-print sense. Each one is a specific, ' +
      'measured way that the obvious reading of this data produces a wrong number, found by ' +
      'attacking the query against live SAP.</p>'
    ));
    const ol = h('<div class="prose"><ol></ol></div>');
    const list = ol.querySelector('ol');
    TRAPS.forEach(function (t) { list.appendChild(h('<li>' + esc(rupee(t)) + '</li>')); });
    c.appendChild(ol);
    c.appendChild(h(
      '<p class="tnote">The corrections behind them: ' + ['C-0021', 'C-0005'].map(cv).join(' ') +
      ' — each links to the full record on the methodology page. This section is a G/L register, ' +
      'not a party or document register: there is no CardCode and no DocEntry in it, so the ' +
      'document half of the ageing corrections does not bite here.</p>'
    ));
    c.appendChild(note(SECTION));
    add(c);
  }

  /* ── 4.16 the SQL ────────────────────────────────────────────────────── */
  add(await sqlCard(der, co));

  paintFoot(m, co, asOf, FIG);
}

/* ══ 5. pieces ═══════════════════════════════════════════════════════════ */

/**
 * The account table. Raw Y/N flags are translated into sentences, the broadcast
 * TOT_* columns are kept out of it entirely (summing one is the section's worst
 * trap), and BRANCH is dropped in a book where DSC1 has no agreeing row rather
 * than printing a column of dashes.
 */
function accountTable(rows, co, FIG) {
  const c = card('Every banking account', SECTION + '.' + co + '.json · ' + num(rows.length) + ' rows');

  const haveBranch = rows.some(function (r) { return !!r.BRANCH; });

  const view = rows.map(function (r) {
    const days = (r.DAYS_SINCE_LAST_MOVE === null || r.DAYS_SINCE_LAST_MOVE === undefined)
      ? null : Number(r.DAYS_SINCE_LAST_MOVE);
    let activity;
    if (r.NEVER_USED_FLAG === 'Y') {
      activity = rup(r, 'CANCELLED_GROSS_12M_L') > 0
        ? 'never really moved (only cancelled traffic)' : 'never used';
    } else if (r.DORMANT_90D_FLAG === 'Y') {
      activity = 'quiet ' + (days === null ? 'a long time' : num(days) + ' d') +
                 (r.CATEGORY === 'FIXED_DEPOSIT' ? ' · deposit, by design' : '');
    } else {
      activity = days === null ? 'active' : 'active · last moved ' + num(days) + ' d ago';
    }

    const house = r.HOUSE_BANK_AGREES === 'AGREE' ? 'agrees with the account name'
      : r.HOUSE_BANK_AGREES === 'MISMATCH' ? 'row exists but DISAGREES — branch suppressed'
      : r.HOUSE_BANK_AGREES === 'UNKNOWN' ? 'row exists, no digits to compare'
      : 'no house-bank row';

    return Object.assign({}, r, {
      ACCOUNT_NUMBER: r.ACCT_NO_MASKED
        ? r.ACCT_NO_MASKED
        : 'not in the books (' + (Number(r.ACCT_NO_NDIGITS) || 0) + ' digits)',
      BANK_NAME: r.BANK_NAME || 'not bank-linked',
      DIRECTION: r.BALANCE_SIGN === 'DEBIT' ? 'money with JIVO'
               : r.BALANCE_SIGN === 'CREDIT' ? 'JIVO owes / drawn'
               : 'nil',
      ACTIVITY: activity,
      EXCEPTION: r.OVERDRAWN_FLAG === 'Y' ? 'asset account sitting in credit' : 'none',
      HOUSE_BANK: house,
      IS_CASH_AND_BANK: r.IS_CASH_AND_BANK === 'Y' ? 'yes — inside that total' : 'no',
      CATEGORY_PLAIN: CAT_PLAIN[r.CATEGORY] || r.CATEGORY
    });
  });

  const cols = ['GL_ACCT_CODE', 'GL_ACCT_LABEL_MASKED', 'CATEGORY', 'BANK_NAME', 'ACCOUNT_NUMBER']
    .concat(haveBranch ? ['BRANCH'] : [])
    .concat(['BALANCE_L', 'DIRECTION', 'CURRTOTAL_TODAY_L', 'FUNDS_AVAILABLE_L', 'AMOUNT_DRAWN_L',
             'OPENING_BAL_L', 'EST_ANNUAL_INTEREST_L',
             'RECEIPTS_IN_12M_L', 'PAYMENTS_OUT_12M_L', 'NET_12M_L', 'AVG_MONTHLY_OUT_L',
             'CANCELLED_GROSS_12M_L', 'INTERCO_IN_12M_L', 'INTERCO_OUT_12M_L',
             'N_LINES_12M', 'ACTIVE_MONTHS_12M', 'MANUAL_JE_LINE_PCT_12M',
             'FIRST_MOVE_DATE', 'LAST_MOVE_DATE', 'DAYS_SINCE_LAST_MOVE',
             'ACTIVITY', 'EXCEPTION', 'HOUSE_BANK', 'CATEGORY_KIND', 'IS_CASH_AND_BANK',
             'GL_DRAWER', 'BANK_CODE', 'BANK_NAME_SOURCE', 'ACCT_NO_SOURCE', 'ACCT_NO_NDIGITS']);

  const labels = {}, units = {};
  cols.forEach(function (k) {
    if (DERIVED_COLS[k]) { labels[k] = DERIVED_COLS[k][0]; return; }
    labels[k] = LABEL_OVERRIDE[k] || (SPEC_COLS[k] && SPEC_COLS[k].label) || k;
  });
  units.MANUAL_JE_LINE_PCT_12M = 'pct';   // ends _12M, so the suffix heuristic would call it a count
  units.ACCT_NO_NDIGITS = 'count';        // a length, not a duration and not money
  units.ACCOUNT_NUMBER = 'text';
  units.DIRECTION = 'text'; units.ACTIVITY = 'text'; units.EXCEPTION = 'text';
  units.HOUSE_BANK = 'text'; units.BANK_NAME = 'text'; units.IS_CASH_AND_BANK = 'text';

  const tbl = table(view, {
    co: co,
    cols: cols,
    labels: labels,
    units: units,
    links: {
      GL_ACCT_CODE: 'bank',
      GL_ACCT_LABEL_MASKED: function (v, r, company) { return hrefBank(r.GL_ACCT_CODE, company); }
    },
    sort: '-PAYMENTS_OUT_12M_L',
    filter: 'Find an account by name, bank, code or kind…',
    facets: ['CATEGORY'],
    total: ['BALANCE_L', 'CURRTOTAL_TODAY_L', 'FUNDS_AVAILABLE_L', 'AMOUNT_DRAWN_L',
            'OPENING_BAL_L', 'EST_ANNUAL_INTEREST_L', 'RECEIPTS_IN_12M_L', 'PAYMENTS_OUT_12M_L',
            'NET_12M_L', 'CANCELLED_GROSS_12M_L', 'INTERCO_IN_12M_L', 'INTERCO_OUT_12M_L',
            'N_LINES_12M'],
    empty: {
      what: 'No account matches this cut.',
      why: 'The chips above filter a real, non-empty table — nothing matched this combination. ' +
           'That is not an empty book; widen the filter to see the rows that exist.'
    },
    caption: 'Bank and cash register — one row per G/L account'
  });

  /* the spec's `meaning` for each column, on the header it belongs to */
  try {
    tbl.querySelectorAll('thead th[data-c]').forEach(function (th) {
      const k = th.getAttribute('data-c');
      const meaning = DERIVED_COLS[k] ? DERIVED_COLS[k][1] : (SPEC_COLS[k] && SPEC_COLS[k].meaning);
      if (meaning) th.title = k + ' — ' + meaning;
    });
  } catch (e) { /* an older browser keeps the default header tooltip */ }

  c.appendChild(h(
    '<p class="tnote"><b>The chips filter on the drawer the account hangs under.</b> ' +
    CAT_ORDER.map(function (k) {
      return '<code>' + esc(k) + '</code> ' + esc(CAT_PLAIN[k].toLowerCase());
    }).join(' · ') + '. The drawer is resolved through the parent account’s NAME, never through ' +
    'the account-code prefix — accounts numbered 1104* hang under cash credit and accounts ' +
    'numbered 1103* under FDR.</p>'
  ));
  c.appendChild(tbl);

  c.appendChild(cap(
    '<b>The totals row adds up only the rows in view, and two of its columns are not what they ' +
    'look like.</b> The debit-balance column totalling ' + esc(inr(FIG.sumFundsAllRows)) +
    ' is NOT liquidity — most of it is over-repaid facilities and fixed deposits, neither of ' +
    'which is money on call. The drawn column totalling ' + esc(inr(FIG.sumDrawnAllRows)) +
    ' is NOT borrowings either: it sweeps in every asset account that has gone into credit, ' +
    'which is why the borrowings figure at the top of the page (' + esc(inr(FIG.v['bank-borrowings-gross'])) +
    ') is the smaller, correct one. The seven broadcast <code>TOT_*</code> columns and the three ' +
    '<code>_SERIES</code> strings are deliberately not in this table at all — one would multiply ' +
    'the company by ' + num(rows.length) + ' if it were totalled, and the others are text.'
  ));
  c.appendChild(cap(
    'The account code is the chart-of-accounts code and is safe to show in full; it is not a bank ' +
    'account number. The account number column is masked to the last four digits, and where it ' +
    'reads “not in the books” the books genuinely hold fewer than four digits for that account — ' +
    'a cash box, a wallet, an accrued-interest head — not a redaction failure. ' +
    'Where a movement date or the days-quiet cell reads <code>n/c</code> the account has never ' +
    'really moved — the Activity column beside it says so in words, and a zero there would read ' +
    'as “moved today”. ' +
    (haveBranch
      ? 'Branch comes from the house-bank table and is present only where that row agrees with ' +
        'the account name.'
      : 'The branch column is hidden for this book: DSC1 carries no agreeing house-bank row for ' +
        'any of its accounts, so the column would be dashes all the way down.') +
    ' <b>There is no drill to individual journal lines from here</b> — this section has no detail ' +
    'rows at all. Whether a G/L position agrees with what the bank says is ' +
    '<a href="' + esc(hrefSection('bank-reco', co)) + '">bank reconciliation’s</a> job, not this ' +
    'register’s.'
  ));

  const glossary = h('<details class="sqlbox-host"><summary class="btn sm">What each column means</summary></details>');
  const gl = h('<div class="prose" style="margin-top:12px"><dl></dl></div>');
  const dl = gl.querySelector('dl');
  cols.forEach(function (k) {
    const meaning = DERIVED_COLS[k] ? DERIVED_COLS[k][1] : (SPEC_COLS[k] && SPEC_COLS[k].meaning);
    if (!meaning) return;
    dl.appendChild(h('<dt><b>' + esc(labels[k]) + '</b> <code>' + esc(k) + '</code></dt>'));
    dl.appendChild(h('<dd>' + esc(rupee(meaning)) + '</dd>'));
  });
  glossary.appendChild(gl);
  c.appendChild(glossary);

  return c;
}

/**
 * The net position over time, from `data/history.jsonl`. Points that share a
 * build timestamp are collapsed to the last one: a rebuild writes several lines
 * for the same instant, and drawing them as a series would invent a collapse
 * that never happened.
 */
async function historyCard(co) {
  const c = card('Net bank position over time', 'data/history.jsonl');
  let points = [];
  try {
    const r = await fetch('data/history.jsonl', { cache: 'no-cache' });
    if (r.ok) {
      const by = new Map();
      (await r.text()).split('\n').forEach(function (ln) {
        if (!ln.trim()) return;
        let o = null;
        try { o = JSON.parse(ln); } catch (e) { return; }
        const v = o && o.kpis && o.kpis[co] ? o.kpis[co]['bank-net-position'] : null;
        if (v === null || v === undefined || isNaN(Number(v))) return;
        by.set(String(o.t || ''), Number(v));
      });
      points = Array.from(by.entries()).sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
    }
  } catch (e) { points = []; }

  if (points.length < 2) {
    c.appendChild(empty({
      what: 'No history yet for this figure.',
      why: 'The trend needs at least two builds that both recorded a net bank position for ' +
           companyLabel(co) + '; this file carries ' + points.length + '. A single point drawn as ' +
           'a line would imply a direction that has not been measured. A treasury position funded ' +
           'on cash credit should breathe with the collection cycle — a monotonic slide would be ' +
           'the finding, and a flat line through a month end would mean the feed had stopped.'
    }));
    return c;
  }
  c.appendChild(sparkline(points.map(function (p) { return { x: p[0], y: p[1] }; }), {
    title: 'Net bank position, one point per build', table: true, extremes: true, height: 64
  }));
  c.appendChild(cap(
    'One point per build, not per day — the board rebuilds several times a day and the position ' +
    'only moves when SAP does. Builds that share a timestamp are collapsed to their last value.'
  ));
  return c;
}

/**
 * The query itself, behind a disclosure. `sql/_index.json` is asked first: a
 * fetch-and-fail logs a console 404 the page cannot suppress, and the browser
 * check counts console errors as failures (CONTRACT §2).
 */
async function sqlCard(der, co) {
  const c = card('The query behind this page', SQL_FILE);
  const box = h('<details class="sqlbox-host"><summary class="btn sm">Show the SQL</summary></details>');
  box.style.margin = '0';
  const body = h('<div style="margin-top:12px"></div>');
  box.appendChild(body);
  c.appendChild(box);
  c.appendChild(h(
    '<p class="tnote">Read-only, and reviewed adversarially before it was allowed near the board. ' +
    'Money columns are plain lakhs — the display multiplies by a lakh, the query never does. ' +
    'This file is not edited by the dashboard (CONTRACT §0.6): changing one of these queries ' +
    'silently changes the books.</p>'
  ));

  let text = null, from = null;
  try {
    const idx = await fetch('sql/_index.json', { cache: 'no-cache' });
    const have = idx.ok ? await idx.json() : null;
    if (Array.isArray(have) && have.indexOf(SECTION) >= 0) {
      const r = await fetch(SQL_FILE, { cache: 'no-cache' });
      if (r.ok) { text = await r.text(); from = 'the full query, ' + SQL_FILE; }
    }
  } catch (e) { /* fall back to the derivation excerpt below */ }

  if (!text) {
    const d = der && (der['bank-net-position'] || der['bank-borrowings-gross']);
    if (d && d.sql && d.sql.text) {
      text = d.sql.text;
      from = 'the excerpt carried in the derivation record' +
             (Array.isArray(d.sql.lines) ? ' (lines ' + d.sql.lines[0] + '–' + d.sql.lines[1] + ')' : '');
    }
  }

  if (!text) {
    body.appendChild(empty({
      what: 'The query text is not published with this build.',
      why: 'sql/_index.json does not list this section and no derivation record carried an ' +
           'excerpt. The file itself is in the repo at ' + SQL_FILE + '.'
    }));
    return c;
  }

  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const html = lines.map(function (ln, i) {
    return '<span class="ln">' + (i + 1) + '</span>' + esc(ln);
  }).join('\n');
  body.appendChild(h('<div class="sqlbox"><pre><code>' + html + '</code></pre></div>'));
  body.appendChild(h('<div class="sqlfoot"><span>' + esc(from) + '</span><span>' +
    num(lines.length) + ' lines</span><span>reads OACT · JDT1 · OJDT · ODSC · DSC1 · OCRD · OCRG</span></div>'));
  return c;
}

/** The page footer: where the numbers came from, and how old they are. */
function paintFoot(m, co, asOf, FIG) {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  const R0 = FIG && FIG.R0;
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
      '<div><b>Section</b> — bank-accounts, one row per postable G/L account under one of the ' +
        'eight banking drawers, resolved through <code>OACT.FatherNum</code> by the parent ' +
        'drawer’s NAME. The account-code prefix lies: accounts numbered 1104* hang under the ' +
        'cash-credit drawer and accounts numbered 1103* under FDR, and every one of them carries ' +
        '<code>ActType=\'N\'</code> and <code>CashBox=\'N\'</code>, so neither a code pattern nor ' +
        'a flag can find this universe.</div>' +
      '<div><b>Sources</b> — <code>OACT</code> (the chart of accounts), <code>JDT1</code>/' +
        '<code>OJDT</code> (the ledger and its cancellations), <code>ODSC</code>/<code>DSC1</code> ' +
        '(bank master and house banks), <code>OCRD</code>/<code>OCRG</code> (counterparties, for ' +
        'the intercompany test only). This section never touches <code>OBNK</code> — the bank ' +
        'statement side is <a href="' + esc(hrefSection('bank-reco', co)) + '">bank reco’s</a>.</div>' +
      (R0 && R0.BOOK_OPENING_DATE
        ? '<div><b>Book opens</b> — ' + esc(R0.BOOK_OPENING_DATE) + ', derived per book and never ' +
          'hardcoded to a group go-live date. Opening balances are a starting position and cannot ' +
          'be added to the twelve-month movement.</div>'
        : '<div><b>Book opens</b> — not derivable at this as-of: the book had not opened, so every ' +
          'opening balance is nil rather than zero.</div>') +
      '<div><b>Book</b> — ' + esc(companyLabel(co)) + '. These figures cannot be added to any ' +
        'other section: bank movement is not turnover, the intercompany columns overlap what the ' +
        'ageing sections flag, and “total liabilities = payables + provisions + borrowings” is ' +
        'not a supported sum.</div>' +
      '<div><b>Freshness</b> — ' + (asOf ? 'as of ' + esc(asOf) + '. ' : '') +
        (gen ? 'Built ' + esc(ago(gen)) + ' (' + esc(gen) + '). ' : 'Build time unknown. ') +
        'The page re-reads the manifest every minute and redraws itself when the build moves.</div>' +
      '<div><b>Masked</b> — account numbers live inside the account name in SAP, so the raw name ' +
        'never leaves the query: every digit is x’d out and the number is the last four only. ' +
        '<b>Read-only</b> — this board issues no write to SAP, ever (CONTRACT §0.2).</div>' +
    '</div>' +
    '<p><a href="' + esc(hrefSection('methodology.html', co)) + '">Methodology and the corrections</a> · ' +
    '<a href="' + esc(hrefDerivation('bank-net-position', co)) + '">How the headline is derived</a> · ' +
    '<a href="' + esc(hrefSection('bank-reco', co)) + '">Bank reconciliation</a> · ' +
    '<a href="' + esc(hrefSection('health', co)) + '">Build health</a></p>';
}

shell({

});

  const main = document.getElementById('main');

    }));
  }
  try { console.error('[banks]', e); } catch (e2) { /* ignore */ }
});

onRefresh(render);
