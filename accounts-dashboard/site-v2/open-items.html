/* ────────────────────────────────────────────────────────────────────────────
   open-items.html — the Open Item List section.

   One summary row = one OPEN SAP document, on both sides of the ledger. This is
   the document-level drill-down that sits behind customer-ageing (receivables)
   and vendor-ageing (payables), and it exists to hold two facts in front of the
   reader at once:

     1. THE LIST ON SCREEN IS A TOP-N SLICE, NOT A REGISTER. Oil publishes 2,168
        of 23,240 open documents. Anyone who totals the visible rows understates
        the book. The uncapped truth is carried in the broadcast DT_* and CO_*
        columns, read off ONE row — never summed down the table.
     2. "OPEN" IS NOT "UNPAID" (C-0019). The documents claim Oil is owed
        ~Rs 1,815 Cr net; the same parties' ledgers say Rs 12.89 Cr. The
        difference is a document backlog, not a receivable.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */
import {
  shell, crumb, kpiRow, table, empty, note,
  manifest, slice, derivations, company, companyLabel,
  money, moneyFull, num, pct, scale, ago, esc,

  onRefresh
} from './assets/core.js';
import { waterfall, stackedBars, pareto, donut, scatter, heatmap, meter, hbars }
  from './assets/charts.js';

/* ══ 1. section constants — straight out of specs/open-item-list.json ═════ */

const SECTION = 'open-item-list';

/* The query ships inside site-v2/ (CONTRACT §2). Ask the index first: a
   fetch-and-fail logs a console 404 the page cannot suppress, and
   pipeline/browser-check.sh counts console errors as failures. */
const SQL_FILE  = 'sql/open-item-list.sql';
const SQL_INDEX = 'sql/_index.json';

 *  three credits. `sgn` is the SGN column's value and is verified per row. */

  { key:'AP_CN',  label:'Vendor credit notes',    short:'Vendor CNs',     tbl:'ORPC', sgn: 1, side:'AP',

  { key:'AP_PMT', label:'Payments never applied', short:'Unapplied pmts', tbl:'OVPM', sgn: 1, side:'AP',

  { key:'AR_CN',  label:'Customer credit notes',  short:'Cust. CNs',      tbl:'ORIN', sgn:-1, side:'AR',

  { key:'AR_RCT', label:'Receipts never applied', short:'Unapplied rcpts',tbl:'ORCT', sgn:-1, side:'AR',

    kpi:'oi-ap-inv-open',    page:'vendor-ageing',
    plain:'billed by a supplier and not paid' }

const DT = {};
DOCTYPES.forEach(function (t) { DT[t.key] = t; });

/** AGE_BUCKET values, in ramp order. The digit prefix is for sorting only. */

/** ACCT_KIND — a total partition of the rows. */
const KINDS = [

  { key:'BRANCH',  label:'JIVO’s own branches' },

const RECON_LABEL = {

/**
 * Plain-English header, unit, and the spec's `meaning` verbatim (it becomes the

 */
const COLS = {
  DOCTYPE: ['Type', 'text',
    "Which SAP table the row came from and which money direction it is: AR_INV=OINV, AR_CN=ORIN, AR_RCT=ORCT, AP_INV=OPCH, AP_CN=ORPC, AP_PMT=OVPM. It names the DOCUMENT, not the party's ledger side — see SIDE. Six mutually exclusive values; never a total row."],
  SIDE: ['Ledger side', 'text',

    "Seven buckets cut on DAYS_OVERDUE, prefixed with a sort digit: 0_NOTDUE, 1_1-30, 2_31-60, 3_61-90, 4_91-180, 5_181-365, 6_365+. Strip the prefix for display; keep it for ordering. Re-derived in Python for every row and matched 100%."],

    "1 when DOC_DATE is exactly 2024-09-30, SAP's go-live. These are opening balances, not transactions. Live only in Oil (208 shown rows carrying Rs 1,971.63 Cr); Mart and Bev genuinely have no migration cohort — that is verified truth, not a missed date."],

    "1 when ACCT_KIND is BRANCH or INTERCO. The one-click 'this is not outside trade' flag. C-0005."]

/** The order the table shows them in. The broadcast columns are NOT here. */
const TABLE_COLS = [
  'DOCTYPE','SIDE','DOC_NUM','EXT_REF','CARD_CODE','CARD_NAME','ACCT_KIND','BP_GROUP','BPL_NAME',

  'SIZE_RANK','DT_SIZE_RANK','DOC_ENTRY','OBJ_TYPE','CARD_TYPE','SGN','IS_GROUP'
];

/** The only columns that may be added down the table (spec trap 1). */
const TOTAL_COLS = ['DOC_TOTAL','APPLIED','OPEN_AMT','SIGNED_OPEN'];

/** The broadcast company columns that are not already a headline KPI. */
const CO_EXTRA = [

/** specs/open-item-list.json → traps[]. The whole list, verbatim. */

/** URL parameters this page accepts, from its own chips and from other pages. */
const FILTER_DEFS = [
  { param:'doctype',  col:'DOCTYPE',     label:'document type',        up:true },
  { param:'card',     col:'CARD_CODE',   label:'party',                up:true },
  { param:'side',     col:'SIDE',        label:'ledger side',          up:true },
  { param:'kind',     col:'ACCT_KIND',   label:'kind of account',      up:true },
  { param:'group',    col:'IS_GROUP',    label:'JIVO’s own account' },
  { param:'bucket',   col:'AGE_BUCKET',  label:'age bucket' },
  { param:'recon',    col:'RECON_STATE', label:'reconciliation state', up:true },
  { param:'currency', col:'CURRENCY',    label:'currency',             up:true },
  { param:'migrated', col:'IS_MIGRATED', label:'go-live opening' },
  { param:'branch',   col:'BPL_NAME',    label:'GST branch',           up:true, upRow:true }
];

/* ══ 2. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** `Rs 22.68 Cr` in the spec's prose → `₹22.68 Cr` on the page. */
function rupee(s) { return String(s).replace(/\bRs\s(?=[\d,])/g, '₹').replace(/(\d)x\b/g, '$1×'); }

/** Sum one column over rows, lifted to rupees by its unit suffix first (§4). */
function total(rows, col) {
  let t = 0;
  for (const r of rows) {
    const v = Number(scale(r[col], col));
    if (isFinite(v)) t += v;
  }
  return t;
}

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }

/** Manifest KPI value, accepting both `{value}` and the live `{v}` shape. */
function kpi(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  if (!k) return null;
  const v = (k.value !== undefined) ? k.value : k.v;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/** A `<a class="cvcode">C-0019</a>` linked to methodology.html. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + src + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a chart: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/** One `.mk` stat tile — a raw source column, or a figure with no KPI id. */
function mk(label, value, why, tone) {
  return h(
    '<div class="mk"><div class="lab">' + esc(label) + '</div>' +
    '<div class="val' + (tone ? ' ' + tone : '') + '">' + esc(value) + '</div>' +
    (why ? '<div class="sub">' + why + '</div>' : '') + '</div>'
  );
}

/** Strip AGE_BUCKET's sort prefix for display; keep the raw key for filtering. */
function bucketLabel(key) {
  const b = BUCKETS.find(x => x.key === key);
  return b ? b.label : String(key || '').replace(/^\d_/, '');
}

/** Read the page's own URL state. */
function urlState() {
  let p;
  try { p = new URLSearchParams(window.location.search); } catch (e) { p = new URLSearchParams(); }
  const filters = [];
  FILTER_DEFS.forEach(function (def) {
    let raw = p.get(def.param);
    if (raw === null || raw === '') raw = p.get(def.col);
    if (raw === null || raw === '') return;
    raw = String(raw);
    const neg = raw.charAt(0) === '!';
    let want = neg ? raw.slice(1) : raw;
    if (def.up) want = want.toUpperCase();
    const test = function (r) {
      let v = r[def.col];
      v = (v === null || v === undefined) ? '' : String(v);
      if (def.up || def.upRow) v = v.toUpperCase();
      return neg ? v !== want : v === want;
    };
    filters.push({ def: def, raw: raw, neg: neg, want: want, test: test });
  });
  let sort = p.get('sort') || '';
  let dir = p.get('dir') || 'desc';
  const m = /^\s*([A-Za-z0-9_]+)\s+(asc|desc)\s*$/i.exec(sort);   // "DAYS_OVERDUE desc"
  if (m) { sort = m[1]; dir = m[2].toLowerCase(); }
  return { filters: filters, sort: sort, dir: dir };
}

/** Rewrite one query parameter in place and re-render. No navigation. */
function setParam(name, value, alt) {
  try {
    const url = new URL(window.location.href);
    if (alt) url.searchParams.delete(alt);
    if (value === null || value === '') url.searchParams.delete(name);
    else url.searchParams.set(name, value);
    window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
  } catch (e) { /* a browser without URL still re-renders below */ }
  render();
}

/** Human sentence for an active filter pill. */
function filterLabel(f) {
  const d = f.def;
  let v = f.want;
  if (d.col === 'DOCTYPE' && DT[v]) v = DT[v].label + ' (' + v + ')';
  else if (d.col === 'AGE_BUCKET') v = bucketLabel(f.raw);
  else if (d.col === 'IS_GROUP' || d.col === 'IS_MIGRATED') v = (v === '1' ? 'yes' : 'no');
  else if (d.col === 'RECON_STATE' && RECON_LABEL[v]) v = RECON_LABEL[v] + ' (' + v + ')';
  return d.label + (f.neg ? ' is not ' : ' = ') + v;
}

/* ══ 3. render ═══════════════════════════════════════════════════════════ */

async function render() {
  const co = company();
  const main = document.getElementById('main');
  const [m, d, der, ca, va] = await Promise.all([
    manifest(), slice(SECTION, co), derivations(co),
    slice('customer-ageing', co), slice('vendor-ageing', co)
  ]);
  const rows = d.summary || [];
  const asOf = d.as_of || (m && m.as_of) || null;

  main.innerHTML = '';
  const add = n => { if (n) main.appendChild(n); return n; };

  add(crumb([
    { label: 'Board', href: hrefSection('index.html', co) },
    { label: 'Open items' }
  ]));

  add(h(
    '<div class="pagehead">' +
      '<div class="ctx">Open item list <span class="sep">·</span> OINV · ORIN · ORCT · OPCH · ORPC · OVPM' +
        (asOf ? ' <span class="sep">·</span> as of ' + esc(asOf) : '') + '</div>' +
      '<h1>Every document SAP still calls open</h1>' +
      '<p class="lede">One row per open document on both sides of the ledger — customer invoices and ' +
      'credit notes, vendor bills and credit notes, and the receipts and payments nobody ever matched ' +
      'against them. It is the drill-down behind both ageings, and it is the page that shows how far ' +
      '“open” has drifted from “unpaid”.</p>' +
    '</div>'
  ));

  /* -- the section could not be read: say so, never print a zero ---------- */
  if (d.error || !rows.length) {
    add(empty({
      what: d.error
        ? 'The open item list could not be read for ' + companyLabel(co) + '.'
        : 'SAP returned no open documents in this book as at ' + (asOf || 'the build date') + '.',
      why: (d.error
        ? 'Reader’s error: ' + d.error + '. '
        : 'That state is reachable — an as-of date before the book opened returns a header and no rows — ' +
          'but all three books have carried thousands of open documents on every build so far. ') +
        'With no rows there is no summary[0] to read the broadcast company totals off, so every figure ' +
        'on this page is UNKNOWN, not zero. Nothing is printed as ₹0.',
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, asOf);
    return;
  }

  const R0 = rows[0];                                   // CO_* live here, once
  const st = urlState();

  /* -- per-doctype view: the FIRST row of each type carries its DT_* -------- */
  const byType = new Map();
  rows.forEach(function (r) {
    const k = r.DOCTYPE;
    if (!byType.has(k)) byType.set(k, { key: k, first: r, rows: [], shownOpen: 0 });
    const b = byType.get(k);
    b.rows.push(r);
    b.shownOpen += Number(scale(r.OPEN_AMT, 'OPEN_AMT')) || 0;
  });
  const missingTypes = DOCTYPES.filter(t => !byType.has(t.key));
  const dtOpen = function (key) {                       // UNCAPPED value, or null
    const b = byType.get(key);
    return b ? Number(b.first.DT_OPEN_ALL) : null;
  };
  const dtItems = function (key) {
    const b = byType.get(key);
    return b ? Number(b.first.DT_ITEMS_ALL) : null;
  };

  const shownOpen = total(rows, 'OPEN_AMT');
  const coOpenAll = Number(R0.CO_OPEN_ALL);
  const coItemsAll = Number(R0.CO_ITEMS_ALL);
  const byKind = {};
  KINDS.forEach(function (k) { byKind[k.key] = rows.filter(r => r.ACCT_KIND === k.key); });
  const groupRows = rows.filter(r => Number(r.IS_GROUP) === 1);
  const migRows = rows.filter(r => Number(r.IS_MIGRATED) === 1);
  const fxRows = rows.filter(r => r.CURRENCY && r.CURRENCY !== 'INR');
  const reconFull = rows.filter(r => r.RECON_STATE === 'FULL_PER_OITR');
  const reconPart = rows.filter(r => r.RECON_STATE === 'PARTIAL');
  const reconNone = rows.filter(r => r.RECON_STATE === 'NONE');
  const sideMismatch = rows.filter(r =>
    (r.SIDE === 'AR' && r.CARD_TYPE === 'S') || (r.SIDE === 'AP' && r.CARD_TYPE === 'C'));
  const crossSide = rows.filter(r =>
    (r.DOCTYPE === 'AR_RCT' && r.SIDE === 'AP') || (r.DOCTYPE === 'AP_PMT' && r.SIDE === 'AR'));

  /* ── 3.1 the headline: the claim, and what the ledgers say ───────────── */
  add(kpiRow([
    { id:'oi-face-value', label:'Face value of what SAP calls open', value:kpi(m, co, 'oi-face-value'), unit:'INR',
      sub:'NOT money owed — read the ledger figure beside it', tone:'bad',
      title:'CO_OPEN_ALL: every open document added up, unsigned and uncapped.' },
    { id:'oi-open-net', label:'What those documents claim, netted', value:kpi(m, co, 'oi-open-net'), unit:'INR',
      sub:'debits less credits, + = parties owe JIVO' },
    { id:'oi-ledger-net', label:'What the same parties’ ledgers actually net to', value:kpi(m, co, 'oi-ledger-net'), unit:'INR',
      sub:'OCRD.Balance over exactly those cards — the ground truth' },
    { id:'oi-stale-gap', label:'The gap SAP never closed', value:kpi(m, co, 'oi-stale-gap'), unit:'INR',
      sub:'documents left open after the money moved', tone:'bad' },
    { id:'oi-docs-open', label:'Documents SAP has not closed', value:kpi(m, co, 'oi-docs-open'), unit:'count',
      sub: num(rows.length) + ' of them are on this page' },
    { id:'oi-coverage-pct', label:'Share of the open value on this page', value:kpi(m, co, 'oi-coverage-pct'), unit:'pct',
      sub:'the rest is capped away — see below', tone:'warn' }
  ]));

  add(h(
    '<div class="caveat">' +
      '<b>Two sentences hold this page up, and neither is optional.</b> ' +
      '<b>One.</b> ' + cv('C-0019') + ' — at JIVO a document keeps <code>DocStatus = O</code> long after ' +
      'the money moved, because settlements are posted as journal entries and as on-account payments ' +
      'nobody reconciles. So <b>' + esc(inr(coOpenAll)) + ' of “open” documents is a document backlog, ' +
      'not a debt</b>; the same parties’ ledgers net to ' + esc(inr(Number(R0.CO_OCRD_NET))) + '. ' +
      'What JIVO is actually owed and actually owes is on ' +
      '<a href="' + esc(hrefSection('receivables', co)) + '">receivables</a> and ' +
      '<a href="' + esc(hrefSection('payables', co)) + '">payables</a>, which anchor on the ledger. ' +
      '<b>Two.</b> This list is a <b>top-N slice</b>: ' + num(rows.length) + ' of ' + num(coItemsAll) +
      ' documents. Add up the table and you understate the book.' +
    '</div>'
  ));

  /* ── 3.2 the truncation, stated rather than implied ──────────────────── */
  {
    const c = card('How much of the book you are actually looking at',
      'CO_OPEN_SHOWN / CO_OPEN_ALL · CO_ITEMS_SHOWN / CO_ITEMS_ALL');
    if (coOpenAll > 0) {
      c.appendChild(meter(Number(R0.CO_OPEN_SHOWN), coOpenAll, {
        title: 'Face value carried by the rows on this page',
        label: 'on this page', maxLabel: 'in the book',
        warnAt: 0.9, badAt: 0.75
      }));
      c.appendChild(cap(
        '<b>' + esc(num(rows.length)) + ' of ' + esc(num(coItemsAll)) + ' open documents are published ' +
        'here — ' + esc(pct(rows.length, coItemsAll)) + ' of the documents, carrying ' +
        esc(pct(Number(R0.CO_OPEN_SHOWN), coOpenAll)) + ' of the value.</b> ' +
        'The cut is not random: a document is delivered only if it still has ₹10,000 or more open AND it ' +
        'ranks in the company’s biggest 1,500 or in its own document type’s biggest 400. Because the cap ' +
        'can only ever drop the SMALLEST items, every figure computed from the rows on this page is a ' +
        'floor, never a total — and the uncapped truth is in the broadcast <code>DT_*</code> and ' +
        '<code>CO_*</code> columns, which is what the charts below are built from.'
      ));

      const compRows = DOCTYPES.filter(t => byType.has(t.key)).map(function (t) {
        const b = byType.get(t.key);
        const all = Number(b.first.DT_OPEN_ALL) || 0;
        const shown = Number(b.first.DT_OPEN_SHOWN) || 0;
        return {
          NAME: t.label + ' (' + b.rows.length + ' of ' + num(Number(b.first.DT_ITEMS_ALL)) + ')',
          SHOWN: shown,
          REST: Math.max(0, all - shown)
        };
      });
      c.appendChild(stackedBars(compRows, {
        labelKey: 'NAME', sort: false, scheme: 'cat', top: 6,
        keys: [
          { key:'SHOWN', label:'listed on this page', color:'--c1' },
          { key:'REST',  label:'capped away',         color:'--c3' }
        ],
        title: 'Each document type: what is on this page against what is in the book'
      }));
      c.appendChild(cap(
        'Bar length is the type’s UNCAPPED open value (<code>DT_OPEN_ALL</code>); the darker segment is ' +
        'the part this page lists (<code>DT_OPEN_SHOWN</code>). This is the chart v1 got wrong the other ' +
        'way round — it drew the sum of the shown rows under an uncapped headline, so ₹2,516 Cr of bars ' +
        'sat beneath a ₹2,582 Cr number with nothing on screen to explain the difference. ' +
        (missingTypes.length
          ? '<b>' + esc(missingTypes.map(t => t.label).join(' and ')) + ' could not be drawn</b> — see below.'
          : 'All six types survived the cap in this book, so all six can be drawn.')
      ));
      missingTypes.forEach(function (t) {
        c.appendChild(empty({
          what: 'No ' + t.label.toLowerCase() + ' (' + t.key + ') survived the ₹10,000 floor and the size cap.',
          why: 'Its uncapped total is not carried in the delivered rows at all — DT_OPEN_ALL only exists ' +
               'broadcast onto rows of that type, so with no row there is no figure to read. This is not ' +
               'a zero: ' + t.tbl + ' may still hold open documents worth less than the floor. ' +
               'Beverages carries exactly two open A/P credit notes in the whole book, so this type is ' +
               'the section’s canary.'
        }));
      });
    } else {
      c.appendChild(empty({
        what: 'The share of the book on this page cannot be shown.',
        why: 'CO_OPEN_ALL is zero or missing on the delivered rows, so there is no denominator. That is a ' +
             'broken build, not an empty book.'
      }));
    }
    add(c);
  }

  /* ── 3.3 THE chart: face value → claim → ledger ──────────────────────── */
  {
    const c = card('From face value to what the ledgers actually say',
      'DT_OPEN_ALL × SGN → CO_OPEN_NET → CO_OCRD_NET');
    const steps = [];
    DOCTYPES.forEach(function (t, i) {
      const v = dtOpen(t.key);
      if (v === null) return;
      steps.push({
        label: t.label + (t.sgn > 0 ? ' (+)' : ' (−)'),
        value: v,
        kind: steps.length === 0 ? 'base' : (t.sgn > 0 ? 'add' : 'sub'),
        k: t.kpi
      });
    });
    if (steps.length) {
      steps.push({ label:'What the documents claim, netted', value:Number(R0.CO_OPEN_NET), kind:'total', k:'oi-open-net' });
      const gap = Number(R0.CO_STALE_GAP);
      steps.push({
        label: gap >= 0 ? 'Settled in the ledger, never closed in SAP' : 'Ledger movement not yet on a document',
        value: Math.abs(gap), kind: gap >= 0 ? 'sub' : 'add', k:'oi-stale-gap'
      });
      steps.push({ label:'What those parties’ ledgers net to', value:Number(R0.CO_OCRD_NET), kind:'total', k:'oi-ledger-net' });

      c.appendChild(waterfall(steps, {
        title: 'Every open document, netted down to the ledger — ' + companyLabel(co),
        href: s => { const o = (s && s.src) || s; return (o && o.k) ? hrefDerivation(o.k, co) : null; }
      }));
      c.appendChild(cap(
        'Read it as one sentence. The six document types add and subtract to <b>' +
        esc(inr(Number(R0.CO_OPEN_NET))) + '</b> — that is what the open documents CLAIM the parties ' +
        'owe JIVO on balance. Take off the <b>' + esc(inr(Math.abs(Number(R0.CO_STALE_GAP)))) +
        '</b> that the general ledger says was already settled but SAP never closed, and what is left is ' +
        '<b>' + esc(inr(Number(R0.CO_OCRD_NET))) + '</b>: the actual net position of exactly these ' +
        'parties. <b>Every bar is the UNCAPPED figure</b> — <code>DT_OPEN_ALL</code> read once off the ' +
        'first row of each type, never the sum of the rows on this page. The six sign-weighted values ' +
        'reproduce <code>CO_OPEN_NET</code> to the paisa in all three books, which is why the checkpoint ' +
        'bar and the arithmetic above it agree.' +
        (missingTypes.length
          ? ' <b>Caution:</b> ' + esc(missingTypes.map(t => t.key).join(', ')) + ' has no delivered row ' +
            'in this book, so its uncapped value is unreadable and the steps will not close on the total.'
          : '')
      ));
      c.appendChild(cap(
        'The last two steps are a different kind of thing from the first six. The first six are ' +
        'documents. The gap is <b>bookkeeping debris</b>: ' + cv('C-0019') + ' — settlements posted as ' +
        'manual journal entries and on-account receipts and payments that were never matched to the ' +
        'document they paid. SAP’s own journal-level match state is empty at JIVO, which is why nothing ' +
        'closes automatically.'
      ));
    } else {
      c.appendChild(empty({
        what: 'The waterfall cannot be drawn for this book.',
        why: 'No document type carries a readable uncapped total (DT_OPEN_ALL). Without it the only ' +
             'honest alternative would be summing the capped rows, which is the exact mistake this ' +
             'section exists to prevent.'
      }));
    }
    add(c);
  }

  /* ── 3.4 the six types, as figures ───────────────────────────────────── */
  {
    const c = card('The six document types, uncapped', 'DT_OPEN_ALL, one read per type');
    c.appendChild(kpiRow(DOCTYPES.slice(0, 3).map(function (t) {
      return {
        id: t.kpi, label: t.label, value: kpi(m, co, t.kpi), unit:'INR',
        sub: t.plain + ' · ' + (dtItems(t.key) === null ? 'count unreadable' : num(dtItems(t.key)) + ' documents')
      };
    })));
    c.appendChild(kpiRow(DOCTYPES.slice(3).map(function (t) {
      return {
        id: t.kpi, label: t.label, value: kpi(m, co, t.kpi), unit:'INR',
        sub: t.plain + ' · ' + (dtItems(t.key) === null ? 'count unreadable' : num(dtItems(t.key)) + ' documents')
      };
    })));
    c.appendChild(cap(
      '<b>Two of these six are not debts at all.</b> The unapplied receipts and payments are money that ' +
      'has already moved — cash JIVO banked, and cash JIVO paid — sitting against no particular ' +
      'document. In Oil the unapplied payments alone are ' +
      esc(inr(dtOpen('AP_PMT'))) + ', which is ' + esc(pct(dtOpen('AP_PMT'), coOpenAll)) +
      ' of the whole face value, and almost all of it is the go-live opening load. That is why the face ' +
      'value at the top of this page is the most dangerous number on the board: most of it is not owed ' +
      'by anybody. Each figure links to its derivation; the dot beside it is the cross-check against a ' +
      'second, independent query.'
    ));
    add(c);
  }

  /* ── 3.5 the cross-section proof ─────────────────────────────────────── */
  add(agreementCard(co, R0, byType, rows, ca, va));

  /* ── 3.6 the broadcast columns, and the trap they set ────────────────── */
  {
    const c = card('The whole-book columns carried on every row', 'broadcast CO_* columns, read off one row');
    const grid = h('<div class="minikpis"></div>');
    CO_EXTRA.forEach(function (x) {
      const col = x[0], label = x[1], why = x[2];
      const v = R0[col];
      if (v === null || v === undefined) return;
      const isMoney = col === 'CO_OPEN_SHOWN';
      const isCount = col === 'CO_ITEMS_SHOWN' || col === 'CO_ITEMS_ALL';
      const shown = isMoney ? inr(Number(v)) : (isCount ? num(Number(v)) : String(v));
      grid.appendChild(mk(label, shown, esc(why) + ' <code class="mono brk">' + esc(col) + '</code>'));
    });
    c.appendChild(grid);
    c.appendChild(cap(
      '<b>Twenty-two of the fifty-one columns are broadcast aggregates.</b> <code>CO_*</code> repeats ' +
      'the company on every row, <code>DT_*</code> repeats the document type on every row of that type, ' +
      'and <code>CARD_*</code> repeats the party on every row of that party. Read them ONCE. ' +
      'Summing <code>CO_OPEN_ALL</code> down this book’s ' + num(rows.length) + ' rows gives <b>' +
      esc(inr(coOpenAll * rows.length)) + '</b> instead of ' + esc(inr(coOpenAll)) + ' — the company ' +
      'multiplied by the row count. That is why none of them is in the table below, and why the ' +
      'per-party columns that ARE in the table (<code>' + esc(COLS.CARD_BALANCE[0]) + '</code> and its ' +
      'neighbours) are excluded from its totals row.'
    ));
    c.appendChild(cap(
      'The only per-row money columns — the ones it is safe to add — are ' +
      '<code>DOC_TOTAL</code>, <code>APPLIED</code>, <code>OPEN_AMT</code>, <code>SIGNED_OPEN</code>, ' +
      '<code>OITR_RECON_AMT</code> and <code>ITEM_REAL_EST</code>. <code>OPEN_AMT_FC</code> is per-row ' +
      'but is <b>not addable</b>: different rows are different currencies.'
    ));
    add(c);
  }

  /* ── 3.7 age of the open value ───────────────────────────────────────── */
  {
    const c = card('How old the open value is, and what it is made of', 'AGE_BUCKET × DOCTYPE × OPEN_AMT');
    const typeKeys = DOCTYPES.filter(t => byType.has(t.key));
    const bucketRows = BUCKETS.map(function (b) {
      const o = { BUCKET: b.label };
      let t = 0;
      typeKeys.forEach(function (dt) {
        const v = rows.filter(r => r.AGE_BUCKET === b.key && r.DOCTYPE === dt.key)
                      .reduce((a, r) => a + (Number(scale(r.OPEN_AMT, 'OPEN_AMT')) || 0), 0);
        o[dt.key] = v; t += v;
      });
      o.__t = t;
      return o;
    });
    if (bucketRows.some(r => r.__t > 0)) {
      c.appendChild(stackedBars(bucketRows, {
        labelKey:'BUCKET', sort:false, top:7, scheme:'cat',
        keys: typeKeys.map(t => ({ key:t.key, label:t.short })),
        title: 'Open value by age, stacked by document type (rows on this page only)'
      }));
      const oldest = rows.filter(r => r.AGE_BUCKET === '6_365+');
      const oldestVal = total(oldest, 'OPEN_AMT');
      c.appendChild(cap(
        '<b>Ages are counted from the DUE date, not the document date, and on the go-live openings the ' +
        'two disagree by years.</b> Oil’s worst row was written on 2024-09-30 — 691 days ago — with a ' +
        'true original due date of 2020-02-19, which is ' + esc(num(kpi(m, co, 'oi-worst-days-overdue'))) +
        ' days overdue. Both numbers are correct; they answer different questions. On the two payment ' +
        'types the due date is the payment’s own and means nothing as a deadline — for those rows read ' +
        '“days since it was written” instead. ' +
        (oldest.length
          ? 'In this book <b>' + esc(inr(oldestVal)) + '</b> across ' + num(oldest.length) +
            ' documents is more than a year past due, ' + esc(pct(oldestVal, shownOpen)) +
            ' of what is listed here.'
          : 'Nothing in this book is more than a year past due.')
      ));

      const cells = [];
      typeKeys.forEach(function (t) {
        BUCKETS.forEach(function (b) {
          const v = rows.filter(r => r.DOCTYPE === t.key && r.AGE_BUCKET === b.key)
                        .reduce((a, r) => a + (Number(scale(r.OPEN_AMT, 'OPEN_AMT')) || 0), 0);
          cells.push({ row: t.short, col: b.label, value: v });
        });
      });
      c.appendChild(heatmap(cells, {
        title: 'The same money the other way round: each type’s own ageing profile',
        cellH: 30
      }));
      c.appendChild(cap(
        'The stack above answers “what is inside each age band”. This answers the reverse — “how does ' +
        'each document type age” — and that is where process failures show. A receipts row that is ' +
        'heaviest at 181–365 days does not mean customers are slow; it means cash sat in the bank for ' +
        'months before anyone applied it to an invoice. That is a matching-discipline problem, and no ' +
        'amount of collection effort touches it. Colour is depth only — every cell also carries its ' +
        'value, and the full grid is in the disclosure beneath it.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No open value to age.',
        why: 'Every bucket is empty across the delivered rows. With rows on the page this can only be a ' +
             'broken AGE_BUCKET column, not a clean book.'
      }));
    }
    add(c);
  }

  /* ── 3.8 whose money this is ─────────────────────────────────────────── */
  {
    const c = card('Whose money this is', 'ACCT_KIND × OPEN_AMT — a total partition of the rows');
    const slices = KINDS.map(function (k) {
      return { key: k.key, label: k.label, value: total(byKind[k.key], 'OPEN_AMT'), n: byKind[k.key].length };
    });
    const live = slices.filter(s => s.value > 0);
    const partition = slices.reduce((a, s) => a + s.value, 0);
    if (live.length) {
      c.appendChild(donut(live.map(s => ({ label: s.label + ' (' + s.n + ')', value: s.value })), {
        title: 'The listed open value, by kind of account',
        centerLabel: 'listed here'
      }));
      const grp = total(groupRows, 'OPEN_AMT');
      c.appendChild(cap(
        '<b>' + esc(pct(grp, shownOpen)) + ' of what is listed here is JIVO trading with itself</b> — ' +
        esc(inr(grp)) + ' across ' + num(groupRows.length) + ' documents on ' +
        num(new Set(groupRows.map(r => r.CARD_CODE)).size) + ' branch and group-company cards ' +
        '(' + cv('C-0005') + ', ' + cv('C-0020') + '). Those rows are <b>flagged and kept, never ' +
        'dropped</b>: the reader subtracts them consciously, using the “Kind” chip on the table below. ' +
        'The four kinds are a total partition — they cross-foot to ' + esc(inr(partition)) + ' against ' +
        'the ' + esc(inr(Number(R0.CO_OPEN_SHOWN))) + ' the query reports for the delivered rows' +
        (Math.abs(partition - Number(R0.CO_OPEN_SHOWN)) > 1
          ? ', and <b>they do not agree — a new BP group name has slipped past the CASE</b>.'
          : ', and they agree.') +
        ' Intercompany vendors hide outside the branch groups, which is why the kind is worked out from ' +
        'the card NAME as well as its group.'
      ));
      if (!byKind.STAFF.length) {
        c.appendChild(empty({
          what: 'No employee imprest card carries an open document in this book.',
          why: 'STAFF is a group-name test only. A handful of imprest cards filed under a geography ' +
               'group read as TRADE instead — measured at 11 items / ₹1.27 L in Oil, 2 in Mart, 6 in ' +
               'Bev. So this is “none in the STAFF group”, not “no staff money”.'
        }));
      }
    } else {
      c.appendChild(empty({
        what: 'No open value on any kind of account.',
        why: 'Every one of the four kinds totals zero across the delivered rows — impossible with rows ' +
             'on the page. Check the build before reading it as a clean book.'
      }));
    }
    add(c);
  }

  /* ── 3.9 concentration ───────────────────────────────────────────────── */
  {
    const c = card('How few parties this is really about', 'OPEN_AMT by CARD_CODE, rows on this page');
    const byCard = new Map();
    rows.forEach(function (r) {
      const k = r.CARD_CODE || '(no card)';
      const cur = byCard.get(k) || { card:k, name:r.CARD_NAME || k, kind:r.ACCT_KIND, value:0, n:0 };
      cur.value += Number(scale(r.OPEN_AMT, 'OPEN_AMT')) || 0;
      cur.n += 1;
      byCard.set(k, cur);
    });
    const parties = Array.from(byCard.values()).filter(p => p.value > 0).sort((a, b) => b.value - a.value);
    if (parties.length) {
      c.appendChild(pareto(parties.map(function (p) {
        return {
          label: p.name + (p.kind && p.kind !== 'TRADE' ? ' · ' + (KINDS.find(k => k.key === p.kind) || {}).label : ''),
          value: p.value, CARD_CODE: p.card
        };
      }), {
        title: 'Ranked by open value, with the running share',
        top: 15,
        href: it => { const o = (it && it.src) || it; return (o && o.CARD_CODE) ? hrefParty(o.CARD_CODE, co) : null; }
      }));
      let run = 0, n80 = 0;
      for (const p of parties) { run += p.value; n80++; if (run >= 0.8 * shownOpen) break; }
      c.appendChild(cap(
        '<b>' + num(n80) + ' of ' + num(parties.length) + ' parties are 80% of the listed value</b>, and ' +
        'the largest single one — ' + esc(parties[0].name) + ' — is ' + esc(inr(parties[0].value)) +
        ' across ' + num(parties[0].n) + ' documents. That ratio is the whole difference between the ' +
        'three books: Oil’s list is three names, Beverages’ is spread across dozens. ' +
        'A party that is not outside trade carries its kind in the label, because a chart of “the ' +
        'biggest open items” that quietly leads with an intercompany account has told the reader ' +
        'nothing useful. Every bar links to the party’s own ledger page.'
      ));

      const big = rows.slice().sort((a, b) => Number(b.OPEN_AMT) - Number(a.OPEN_AMT)).slice(0, 12);
      c.appendChild(hbars(big.map(function (r) {
        return {
          name: (r.DOC_NUM || r.DOC_ENTRY) + ' · ' + (r.CARD_NAME || r.CARD_CODE),
          value: Number(scale(r.OPEN_AMT, 'OPEN_AMT')) || 0,
          OBJ_TYPE: r.OBJ_TYPE, DOC_ENTRY: r.DOC_ENTRY
        };
      }), {
        title: 'The twelve biggest single open documents', top: 12, color:'--c3',
        href: it => {
          const o = (it && it.src) || it;

            ? hrefDocument(String(o.OBJ_TYPE), String(o.DOC_ENTRY), co) : null;
        }
      }));
      c.appendChild(cap(
        'One bar per DOCUMENT, not per party — the individual items an accountant would open first. ' +
        'Each links to the document page by <code>OBJ_TYPE</code> + <code>DOC_ENTRY</code>, which is the ' +
        'only reliable identity here: the document number is not unique across numbering series or ' +
        'across the six tables, and it must never be used as a key.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No party carries any open value.',
        why: 'Every delivered row sums to zero by party — impossible, since a row only exists when at ' +
             'least ₹10,000 is still open. Check the build.'
      }));
    }
    add(c);
  }

  /* ── 3.10 age against size ───────────────────────────────────────────── */
  {
    const c = card('Age against size — the big old ones', 'DAYS_OVERDUE × OPEN_AMT, one dot per document');
    const CAP = 600;
    const ranked = rows.slice().sort((a, b) => Number(b.OPEN_AMT) - Number(a.OPEN_AMT));
    const plotted = ranked.slice(0, CAP);
    const pts = plotted.filter(r => r.DAYS_OVERDUE !== null && r.DAYS_OVERDUE !== undefined)
      .map(function (r) {
        const side = r.SIDE === 'AP' ? 'Vendor side' : 'Customer side';
        return {
          x: Number(r.DAYS_OVERDUE),
          y: Number(scale(r.OPEN_AMT, 'OPEN_AMT')) || 0,
          label: (r.DOC_NUM || r.DOC_ENTRY) + ' ' + (r.CARD_NAME || r.CARD_CODE),
          group: side + (Number(r.IS_MIGRATED) === 1 ? ' · go-live opening' : ''),
          OBJ_TYPE: r.OBJ_TYPE, DOC_ENTRY: r.DOC_ENTRY
        };
      });
    if (pts.length) {
      c.appendChild(scatter(pts, {
        title: 'The ' + num(pts.length) + ' biggest open documents on this page',
        xLabel: 'days past the document’s due date',
        yLabel: 'still open',
        href: p => (p && p.DOC_ENTRY !== undefined)
          ? hrefDocument(String(p.OBJ_TYPE), String(p.DOC_ENTRY), co) : null
      }));
      c.appendChild(cap(
        'The top-right corner is the working list: large, and long past due. ' +
        (ranked.length > CAP
          ? 'Only the ' + num(CAP) + ' biggest of this page’s ' + num(rows.length) + ' rows are plotted — ' +
            'below that the dots are inseparable from the axis, and the axis is not where they belong. '
          : 'Every row on this page is plotted. ') +
        'Colour separates the two ledger sides <b>and</b> marks the go-live openings, because on this ' +
        'book they are the entire far-right cluster: those documents carry their true pre-migration due ' +
        'dates, so they are genuinely years overdue on paper while being an opening-balance load in ' +
        'fact. Left of zero on the x-axis means not yet due. Each dot opens its document.'
      ));
    } else {
      c.appendChild(empty({
        what: 'Nothing to plot.',
        why: 'No delivered row carries a due date, so no dot has an x position. DUE_DATE is NULL on zero ' +
             'rows in all six tables in all three books, so this state means the column did not arrive.'
      }));
    }
    add(c);
  }

  /* ── 3.11 the smoking gun: SAP itself says these are settled ─────────── */
  {
    const c = card('SAP’s own reconciliation says settled — the document still reads open',
      'RECON_STATE, from ITR1 / OITR');
    const grid = h('<div class="minikpis"></div>');
    grid.appendChild(mk('Reconciled in full, still open',
      num(reconFull.length) + (reconFull.length ? '' : ' — none in this book'),
      'SAP’s own reconciliation covers the whole document value and <code>DocStatus</code> is still ' +
      '<code>O</code>. <code class="mono brk">FULL_PER_OITR</code>',
      reconFull.length ? 'bad' : ''));
    grid.appendChild(mk('Partly reconciled', num(reconPart.length),
      'Some ITR1 lines touch it, not enough to cover it. <code class="mono brk">PARTIAL</code>'));
    grid.appendChild(mk('Never reconciled at all', num(reconNone.length),
      'No ITR1 row exists — SAP’s reconciliation never saw the document. ' +
      '<code class="mono brk">NONE</code>'));
    grid.appendChild(mk('Value behind the full ones', reconFull.length ? inr(total(reconFull, 'OPEN_AMT')) : '₹0',
      'Still counted as open by every SAP report. Read it as evidence, not as a recovery.'));
    c.appendChild(grid);
    c.appendChild(cap(
      'This is the cleanest single piece of evidence for the whole page. These are documents where ' +
      '<b>SAP’s own internal reconciliation covers the full value</b> and the document is still flagged ' +
      'open — nothing inferred, nothing modelled. ' + cv('C-0019') + ' in one column. ' +
      'The counts are over the rows on this page, not the whole book: ' +
      '<b>the build’s manifest carries no value for this KPI (it is <code>null</code> in all three ' +
      'books), so the figures here are computed live from the delivered rows</b> and are a floor. ' +
      '<a href="' + esc(hrefDerivation('oi-oitr-settled-docs', co)) + '">The derivation record</a> ' +
      'carries the section’s own live measurement for comparison.'
    ));
    if (reconFull.length) {
      const list = reconFull.slice().sort((a, b) => Number(b.OPEN_AMT) - Number(a.OPEN_AMT)).slice(0, 25);
      c.appendChild(table(list, {
        co: co,
        cols: ['DOCTYPE','DOC_NUM','CARD_NAME','DOC_DATE','DOC_TOTAL','OPEN_AMT','OITR_RECON_AMT','OITR_LINES'],
        labels: {
          DOCTYPE: COLS.DOCTYPE[0], DOC_NUM: COLS.DOC_NUM[0], CARD_NAME: COLS.CARD_NAME[0],
          DOC_DATE: COLS.DOC_DATE[0], DOC_TOTAL: COLS.DOC_TOTAL[0], OPEN_AMT: COLS.OPEN_AMT[0],
          OITR_RECON_AMT: COLS.OITR_RECON_AMT[0], OITR_LINES: COLS.OITR_LINES[0]
        },
        units: { DOC_TOTAL:'INR', OPEN_AMT:'INR', OITR_RECON_AMT:'INR', OITR_LINES:'count', DOC_DATE:'date' },
        links: { DOC_NUM:'document', CARD_NAME:{ kind:'party', card:'CARD_CODE' } },
        sort: '-OPEN_AMT', page: false,
        caption: 'Documents SAP has reconciled in full and left open'
      }));
      c.appendChild(cap(
        'The biggest ' + num(list.length) + ' of them. <b>The reconciled amount can legitimately exceed ' +
        'the document’s own value</b> — SAP writes account-level system reconciliations that stamp the ' +
        'whole reconciliation total onto every participating line, so 87 Oil / 14 Mart / 1 Bev documents ' +
        'carry more reconciliation than value. It is a diagnostic and is never used to compute what is ' +
        'still open.'
      ));
    } else {
      c.appendChild(cap(
        '<b>None in this book</b> — a true zero, not a missing measurement: every delivered row is ' +
        'either partly reconciled or was never touched by SAP’s reconciliation at all. It does not mean ' +
        'the book is clean; the gap between the documents and the ledgers at the top of this page is ' +
        'the same size either way. It means the evidence for it is not written in ITR1 here.'
      ));
    }
    add(c);
  }

  /* ── 3.12 currency ───────────────────────────────────────────────────── */
  {
    const c = card('Currency exposure', 'CURRENCY × OPEN_AMT · OPEN_AMT_FC is not rupees');
    const byCcy = new Map();
    rows.forEach(function (r) {
      const k = r.CURRENCY || '(none)';
      const cur = byCcy.get(k) || { ccy:k, value:0, n:0, fc:0 };
      cur.value += Number(scale(r.OPEN_AMT, 'OPEN_AMT')) || 0;
      cur.fc += Number(r.OPEN_AMT_FC) || 0;
      cur.n += 1;
      byCcy.set(k, cur);
    });
    const ccy = Array.from(byCcy.values()).sort((a, b) => b.value - a.value);
    const fxVal = total(fxRows, 'OPEN_AMT');
    if (fxRows.length) {
      c.appendChild(table(ccy.map(function (x) {
        return {
          CURRENCY: x.ccy, N_DOCS: x.n,
          OPEN_AMT: x.value,
          SHARE: shownOpen ? 100 * x.value / shownOpen : null,
          OPEN_AMT_FC: x.fc
        };
      }), {
        co: co,
        cols: ['CURRENCY','N_DOCS','OPEN_AMT','SHARE','OPEN_AMT_FC'],
        labels: {
          CURRENCY:'Currency', N_DOCS:'Documents', OPEN_AMT:'Still open, in rupees',
          SHARE:'Share of this page', OPEN_AMT_FC:'Same money in its own currency'
        },
        units: { N_DOCS:'count', OPEN_AMT:'INR', SHARE:'pct', OPEN_AMT_FC:'count' },
        page: false,
        caption: 'Open value by document currency'
      }));
      c.appendChild(cap(
        '<b>' + esc(inr(fxVal)) + ' of the ' + esc(inr(shownOpen)) + ' listed here — ' +
        esc(pct(fxVal, shownOpen)) + ' — is booked in a foreign currency</b>, across ' +
        num(fxRows.length) + ' documents. The rupee column is always the local INR figure, whatever the ' +
        'document currency; the last column is the same money in its own units and <b>is not rupees and ' +
        'cannot be totalled</b> — adding it down would add dollars to euros. It is here for one reason: ' +
        'it is the only way to catch a rotten exchange rate. Oil’s OVPM 26317 books USD 44.34 lakh as ' +
        '₹443.40 — about 87,000× too small — and a row like that sinks below the ₹10,000 floor and ' +
        'disappears from this page entirely. One was found; no systematic sweep has been run.'
      ));
    } else {
      c.appendChild(mk('Booked in foreign currency', '— none in this book',
        'Every delivered row in ' + esc(companyLabel(co)) + ' is in INR, so there is no exposure to ' +
        'split out. That is a measured nil, not a missing figure — and it is why the foreign-currency ' +
        'KPI prints nothing rather than ₹0.'));
      c.appendChild(cap(
        'The <code>OPEN_AMT_FC</code> column still exists on every row and is zero throughout. It is ' +
        'never addable in any book — different rows would be different units — which is why no total is ' +
        'offered for it anywhere on this page.'
      ));
    }
    add(c);
  }

  /* ── 3.13 the shown-set figures, labelled as such ────────────────────── */
  {
    const c = card('Figures measured on the rows this page carries', 'SHOWN-SET — a floor, never a total');
    c.appendChild(kpiRow([
      { id:'oi-group-open-shown', label:'Of the listed rows, JIVO’s own branches and group companies',
        value:kpi(m, co, 'oi-group-open-shown'), unit:'INR',
        sub:'flagged and kept — never dropped, never silently included', tone:'warn' },
      { id:'oi-365plus-shown', label:'Of the listed rows, more than a year past due',
        value:kpi(m, co, 'oi-365plus-shown'), unit:'INR', sub:'cut on the due date, so the go-live load lands here' },
      { id:'oi-fx-open-shown', label:'Of the listed rows, booked in foreign currency',
        value:kpi(m, co, 'oi-fx-open-shown'), unit:'INR',
        sub: fxRows.length
          ? num(fxRows.length) + ' document' + (fxRows.length === 1 ? '' : 's')
          : 'none in this book' },
      { id:'oi-worst-days-overdue', label:'Oldest thing on the list, past its due date',
        value:kpi(m, co, 'oi-worst-days-overdue'), unit:'days',
        sub:'from the DUE date — on a go-live opening that pre-dates the book' },
      { id:'oi-migrated-open', label:'Still open from the go-live opening load',
        value:kpi(m, co, 'oi-migrated-open'), unit:'INR',
        sub:'documents dated 2024-09-30, uncapped' }
    ]));
    if (Number(kpi(m, co, 'oi-migrated-open')) === 0) {
      c.appendChild(cap(
        '<b>The go-live figure is ₹0 and that is the true answer, not a gap.</b> Only Oil loaded its ' +
        'opening balances in as documents, on 2024-09-30. Mart’s book opens 2025-01-01 and Beverages’ ' +
        '2024-10-01, and neither carried openings that are still material. It is printed as a zero ' +
        'rather than hidden because hiding it would read as “not measured”.'
      ));
    } else {
      c.appendChild(cap(
        '<b>' + esc(pct(kpi(m, co, 'oi-migrated-open'), coOpenAll)) + ' of this book’s entire face value ' +
        'is the go-live opening load</b> — documents dated 2024-09-30, the day the books were migrated ' +
        'into SAP. They are opening balances, not transactions, and ' + num(migRows.length) +
        ' of them are on this page. Any “what do we chase” reading of the face value has to take them ' +
        'out first; the chip on the table below does it in one click.'
      ));
    }
    c.appendChild(cap(
      'Every figure in this card is measured over the ' + num(rows.length) + ' delivered rows, not the ' +
      num(coItemsAll) + ' in the book, because there is no uncapped equivalent in the output for any of ' +
      'them. They are floors. The five headline figures at the top of the page are the uncapped ones.'
    ));
    add(c);
  }

  /* ── 3.14 the table ──────────────────────────────────────────────────── */
  add(tableCard(co, rows, byType, st, R0, shownOpen, crossSide, sideMismatch));

  /* ── 3.15 how to read this ───────────────────────────────────────────── */
  {
    const c = card('How to read this', 'every way a naive version of this page goes wrong');
    c.appendChild(h(
      '<p class="blurb">These are not caveats in the small-print sense. Each one is a specific, ' +
      'measured way that the obvious reading of this data produces a wrong number, found by attacking ' +
      'the query against live SAP.</p>'
    ));
    const ol = h('<div class="prose"><ol></ol></div>');
    const list = ol.querySelector('ol');
    TRAPS.forEach(function (t) { list.appendChild(h('<li>' + esc(rupee(t)) + '</li>')); });
    c.appendChild(ol);
    c.appendChild(h(
      '<p class="tnote">The corrections behind them: ' +
      ['C-0019','C-0021','C-0005','C-0020','C-0022','C-0023'].map(cv).join(' ') +
      ' — each links to the full record on the methodology page.</p>'
    ));
    // ui.note() reads notes/<id>.md (the copy published inside site-v2) and asks
    // notes/_index.json first, so a section without a note costs no 404.
    c.appendChild(note(SECTION));
    add(c);
  }

  /* ── 3.16 the SQL ────────────────────────────────────────────────────── */
  add(await sqlCard(der, co));

  paintFoot(m, co, asOf);
}

/* ══ 4. pieces ═══════════════════════════════════════════════════════════ */

/**
 * The strongest verification on the board: the six uncapped per-type totals in
 * this section, against the SAME universe computed by two other sections' SQL
 * files, with different CTEs, different grouping and a different party
 * classification. Four types must tie to the paisa; the two payment types must
 * differ by EXACTLY the cross-side refunds this section carries and the ageings
 * do not (spec trap 4, defect D1).
 */
function agreementCard(co, R0, byType, rows, ca, va) {
  const c = card('Does this agree with the two ageings?',
    'customer-ageing.sql · vendor-ageing.sql — different queries, same six tables');

  const caTot = (ca.summary || []).find(r => String(r.KIND || '').indexOf('ZZ') === 0) || null;
  const vaRow = (va.summary || [])[0] || null;

  if (!caTot && !vaRow) {
    c.appendChild(empty({
      what: 'The cross-check could not be run for this book.',
      why: 'Neither customer-ageing nor vendor-ageing returned rows to compare against' +
           (ca.error ? ' (' + ca.error + ')' : '') + (va.error ? ' (' + va.error + ')' : '') +
           '. The figures on this page are unchanged; what is missing is the second opinion on them.',
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    return c;
  }

  const OTHER = {
    AR_INV: caTot ? [Number(scale(caTot.RAW_OPEN_INR, 'RAW_OPEN_INR')), 'customer-ageing · ZZ_TOTAL.RAW_OPEN_INR', true] : null,
    AR_CN:  caTot ? [Number(scale(caTot.OPEN_CREDIT_NOTES_INR, 'OPEN_CREDIT_NOTES_INR')), 'customer-ageing · ZZ_TOTAL.OPEN_CREDIT_NOTES_INR', true] : null,
    AR_RCT: caTot ? [Number(scale(caTot.UNAPPLIED_RECEIPTS_INR, 'UNAPPLIED_RECEIPTS_INR')), 'customer-ageing · ZZ_TOTAL.UNAPPLIED_RECEIPTS_INR', false] : null,
    AP_INV: vaRow ? [Number(scale(vaRow.CO_RAW_OPEN, 'CO_RAW_OPEN')), 'vendor-ageing · CO_RAW_OPEN', true] : null,
    AP_CN:  vaRow ? [Number(scale(vaRow.CO_OPEN_CN, 'CO_OPEN_CN')), 'vendor-ageing · CO_OPEN_CN', true] : null,
    AP_PMT: vaRow ? [Number(scale(vaRow.CO_UNAPPLIED_PAY, 'CO_UNAPPLIED_PAY')), 'vendor-ageing · CO_UNAPPLIED_PAY', false] : null
  };

  const cmp = [];
  DOCTYPES.forEach(function (t) {
    const b = byType.get(t.key);
    const o = OTHER[t.key];
    if (!b || !o || !isFinite(o[0])) return;
    const here = Number(b.first.DT_OPEN_ALL);
    const delta = here - o[0];
    cmp.push({
      TYPE: t.label, HERE: here, THERE: o[0], SOURCE: o[1],
      DELTA: delta, DELTA_PCT: o[0] ? 100 * delta / o[0] : null,
      VERDICT: o[2]
        ? (Math.abs(delta) < 0.005 ? 'ties to the paisa' : 'DISAGREES — investigate')
        : 'differs by the cross-side refunds, by design',
      __exact: o[2]
    });
  });

  if (!cmp.length) {
    c.appendChild(empty({
      what: 'Nothing could be compared.',
      why: 'The two ageing sections loaded but carry none of the six columns this check reads. Either ' +
           'their shape changed or this book delivered no row for any document type.'
    }));
    return c;
  }

  c.appendChild(table(cmp, {
    co: co,
    cols: ['TYPE','HERE','THERE','DELTA','DELTA_PCT','SOURCE','VERDICT'],
    labels: {
      TYPE:'Document type', HERE:'This section (DT_OPEN_ALL)', THERE:'The other section',
      DELTA:'Difference', DELTA_PCT:'Difference %', SOURCE:'Where the other figure comes from',
      VERDICT:'Verdict'
    },
    units: { HERE:'INR', THERE:'INR', DELTA:'INR', DELTA_PCT:'pct' },
    page: false, sort: false,
    caption: 'Open item list against customer-ageing and vendor-ageing'
  }));

  const exact = cmp.filter(x => x.__exact);
  const tied = exact.filter(x => Math.abs(x.DELTA) < 0.005);
  const xs = rows.filter(r =>
    (r.DOCTYPE === 'AR_RCT' && r.SIDE === 'AP') || (r.DOCTYPE === 'AP_PMT' && r.SIDE === 'AR'));

  const worst = exact.reduce(function (a, x) {
    const p = Math.abs(Number(x.DELTA_PCT));
    return isFinite(p) && p > a ? p : a;
  }, 0);
  c.appendChild(cap(
    '<b>' + (tied.length === exact.length
      ? 'All ' + num(exact.length) + ' types that must tie exactly do tie'
      : num(tied.length) + ' of the ' + num(exact.length) + ' types that must tie exactly do tie') +
    ' — the widest disagreement among them is ' + esc(worst.toFixed(4)) + '%.</b> ' +
    'These are not two readings of one number. <code>customer-ageing.sql</code> and ' +
    '<code>vendor-ageing.sql</code> are separate files with their own CTE chains, their own party ' +
    'classification and their own predicates; this section unions the six tables and broadcasts a ' +
    'window total. They agree because the same money is really there. ' +
    (tied.length === exact.length
      ? 'If one of these rows ever stops tying, the union has lost or duplicated a table — that is what ' +
        'this panel is for.'
      : '<b>One or more rows do not tie. Do not use either figure until that is explained.</b>')
  ));
  c.appendChild(cap(
    '<b>The two payment rows are supposed to differ, and by a specific amount.</b> The ageings scope ' +
    'ORCT to customer cards and OVPM to vendor cards; this section reads the payment’s own DocType ' +
    'instead, so it also carries cash received back FROM a vendor and refunds paid TO a customer. ' +
    (xs.length
      ? 'This page lists ' + num(xs.length) + ' such rows worth ' + esc(inr(total(xs, 'OPEN_AMT'))) +
        ' — a floor on the true difference, since the cap drops the smallest. In Oil the full difference ' +
        'is ₹2.25 Cr of vendor refunds across 146 receipts and ₹25.86 L of customer refunds across 26 ' +
        'payments.'
      : 'This book’s delivered rows carry none of them, so the small residual sits entirely in documents ' +
        'below the ₹10,000 floor.') +
    ' Filing those under the wrong side was defect D1, and it is why <b>DOCTYPE and SIDE are different ' +
    'axes</b> and the table below offers both.'
  ));
  return c;
}

/**
 * Every open document. Chips pick the document type; any filter another page
 * arrived with is shown as a clearable pill. The broadcast columns are not in
 * the table at all, and the totals row covers only the four per-row money
 * columns.
 */
function tableCard(co, rows, byType, st, R0, shownOpen, crossSide, sideMismatch) {
  const c = card('Every open document on this page', SECTION + '.' + co + '.json · ' + num(rows.length) + ' rows');

  /* chips: which document type */
  const chips = h('<div class="chips" role="group" aria-label="Which document type to show"></div>');
  const cur = st.filters.find(f => f.def.col === 'DOCTYPE');
  const allOn = !cur;
  const allChip = h('<button type="button" class="chip" aria-pressed="' + (allOn ? 'true' : 'false') + '">' +
    'All types <span class="n">' + num(rows.length) + '</span></button>');
  allChip.title = 'Every document type in this book';
  allChip.addEventListener('click', function () { setParam('doctype', '', 'DOCTYPE'); });
  chips.appendChild(allChip);
  DOCTYPES.forEach(function (t) {
    const b = byType.get(t.key);
    if (!b) return;
    const on = !!cur && cur.want === t.key;
    const b2 = h('<button type="button" class="chip" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      esc(t.label) + ' <span class="n">' + num(b.rows.length) + '</span></button>');
    b2.title = t.label + ' (' + t.key + ', ' + t.tbl + '): ' + num(b.rows.length) + ' of ' +
      num(Number(b.first.DT_ITEMS_ALL)) + ' documents, ' + inr(b.shownOpen) + ' listed of ' +
      inr(Number(b.first.DT_OPEN_ALL)) + ' in the book';
    b2.addEventListener('click', function () { setParam('doctype', t.key, 'DOCTYPE'); });
    chips.appendChild(b2);
  });
  const bar = h('<div class="toolbar"></div>');
  bar.appendChild(chips);
  c.appendChild(bar);

  /* every active filter as a clearable pill */
  let shown = rows;
  st.filters.forEach(function (f) {
    shown = shown.filter(f.test);
    const pill = h('<div class="toolbar"><span class="pill info">only ' + esc(filterLabel(f)) +
      '</span> <button type="button" class="btn sm">clear</button></div>');
    pill.querySelector('button').addEventListener('click', function () {
      setParam(f.def.param, '', f.def.col);
    });
    c.appendChild(pill);
  });
  if (st.filters.length) {
    c.appendChild(cap(
      'You arrived here with a filter, so <b>the table is scoped and the charts above are not</b> — ' +
      'every chart on this page always describes the whole book. Clear the pill to see all ' +
      num(rows.length) + ' delivered rows.'
    ));
  }

  const labels = {}, units = {};
  TABLE_COLS.forEach(function (k) { labels[k] = COLS[k][0]; units[k] = COLS[k][1]; });

  /* The board's cell formatter prints a percentage to TWO decimals, and this is
     the one column where that is a defect rather than a rounding: Oil's
     AL GHURAIR card is 0.0014% real and would print "0.00%" beside a non-zero
     estimate, which reads as a bug. So this column is rendered as pre-formatted
     text at four decimals, on a COPY of the rows — the delivered data is never
     mutated, because other pages read the same cached slice. */
  const view = shown.map(function (r) {
    const o = Object.assign({}, r);
    const p = Number(r.CARD_REAL_PCT);
    o.CARD_REAL_PCT = isFinite(p) ? p.toFixed(4) + '%' : null;
    return o;
  });
  units.CARD_REAL_PCT = 'text';

  const sortCol = (st.sort && TABLE_COLS.indexOf(st.sort) >= 0) ? st.sort : 'OPEN_AMT';
  const tbl = table(view, {
    co: co,
    cols: TABLE_COLS,
    labels: labels,
    units: units,
    links: {
      CARD_CODE: 'party',
      CARD_NAME: { kind:'party', card:'CARD_CODE' },
      DOC_NUM:   'document',
      DOC_ENTRY: 'document'
    },
    sort: (st.dir === 'asc' ? '' : '-') + sortCol,
    filter: 'Find a document by number, party, reference or branch…',
    facets: ['DOCTYPE','AGE_BUCKET','ACCT_KIND'],
    total: TOTAL_COLS,
    empty: {
      what: 'No document matches this cut.',
      why: 'The chips and pills above filter a real, non-empty table — nothing matched this ' +
           'combination. That is not an empty book; widen the filter to see the rows that exist.'
    },
    caption: 'Open item list — one row per open SAP document'
  });

  /* the spec's `meaning` on the header it belongs to */
  try {
    tbl.querySelectorAll('thead th[data-c]').forEach(function (th) {
      const k = th.getAttribute('data-c');
      if (COLS[k]) th.title = k + ' — ' + COLS[k][2];
    });
  } catch (e) { /* an older browser keeps the default header tooltip */ }
  c.appendChild(tbl);

  c.appendChild(cap(
    '<b>The totals row adds up only the rows currently in view, and only four columns.</b> With ' +
    'everything shown the open column comes to ' + esc(inr(shownOpen)) + ' — which is the ' +
    esc(pct(shownOpen, Number(R0.CO_OPEN_ALL))) + ' of the book this page carries, not the book. ' +
    'The per-party columns (ledger balance, the party’s net, its gap, its “% real”) are BROADCAST: ' +
    'identical on every row of that party, so they are shown for context and deliberately left out of ' +
    'the totals. The pro-rata “really open” column is an INFERRED estimate and must be summed signed or ' +
    'not at all — gross-summing it over Mart’s rows yields ₹505.88 Cr against a ledger net of −₹9.39 Cr. ' +
    'The “% real” column is printed to <b>four</b> decimals on purpose: Oil’s AL GHURAIR card is ' +
    '0.0014% real, and rounded to two it would read 0.00% beside a non-zero estimate, which looks like ' +
    'a broken cell rather than a very small number.'
  ));
  c.appendChild(cap(
    '<b>Type and ledger side are different axes.</b> The chips filter the SAP table the row came from; ' +
    'the “Ledger side” column says whose ledger it lands on, read off the document’s own DocType. ' +
    (crossSide.length
      ? 'They disagree on ' + num(crossSide.length) + ' rows here — receipts that are money back from a ' +
        'vendor, and payments that are refunds to a customer. Filtering on the type when you meant the ' +
        'side puts those in the wrong list.'
      : 'They agree on every delivered row in this book, but the distinction still holds: in Oil, 146 ' +
        'receipts are money back from a vendor.') +
    ' The side is cross-checked against the party master on every row' +
    (sideMismatch.length
      ? ' and <b>' + num(sideMismatch.length) + ' rows disagree with it — that is a hard defect signal, ' +
        'not noise</b>.'
      : ', and it agrees on all ' + num(rows.length) + ' of them.') +
    ' Where “their reference” reads <code>n/c</code> the counterparty’s reference is genuinely absent ' +
    'from the books — it is the only nullable column in the section, and it is null on every payment ' +
    'row by construction and on ' + num(rows.filter(r => r.EXT_REF === null || r.EXT_REF === undefined).length) +
    ' of these ' + num(rows.length) + ' rows in total.'
  ));

  const glossary = h('<details class="sqlbox-host"><summary class="btn sm">What each column means</summary></details>');
  const gl = h('<div class="prose" style="margin-top:12px"><dl></dl></div>');
  const dl = gl.querySelector('dl');
  TABLE_COLS.forEach(function (k) {
    if (!COLS[k]) return;
    dl.appendChild(h('<dt><b>' + esc(COLS[k][0]) + '</b> <code class="mono brk">' + esc(k) + '</code></dt>'));
    dl.appendChild(h('<dd>' + esc(rupee(COLS[k][2])) + '</dd>'));
  });
  glossary.appendChild(gl);
  c.appendChild(glossary);
  return c;
}

/**
 * The query itself, behind a disclosure. The index is consulted first so a
 * missing file costs no console 404 (CONTRACT §2); a derivation record's
 * embedded excerpt is the fallback.
 */
async function sqlCard(der, co) {
  const c = card('The query behind this page', SQL_FILE);
  const box = h('<details class="sqlbox-host"><summary class="btn sm">Show the SQL</summary></details>');
  box.style.margin = '0';
  const body = h('<div style="margin-top:12px"></div>');
  box.appendChild(body);
  c.appendChild(box);
  c.appendChild(h(
    '<p class="tnote">Read-only, and reviewed adversarially before it was allowed near the board — two ' +
    'real defects were found and fixed in that review, both recorded in the working note above. ' +
    'Money columns are plain rupees: no <code>_L</code> or <code>_CR</code> suffix appears anywhere in ' +
    'the 51, so nothing on this page is scaled. This file is not edited by the dashboard ' +
    '(CONTRACT §0.6): changing one of these queries silently changes the books.</p>'
  ));

  let text = null, from = null;
  try {
    const idx = await fetch(SQL_INDEX, { cache: 'no-cache' });
    const have = idx.ok ? await idx.json() : null;
    if (Array.isArray(have) && have.indexOf(SECTION) >= 0) {
      const r = await fetch(SQL_FILE, { cache: 'no-cache' });
      if (r.ok) { text = await r.text(); from = 'the query as published with this build'; }
    }
  } catch (e) { /* fall through to the derivation excerpt */ }

  if (!text) {
    const ids = ['oi-face-value','oi-open-net','oi-ar-inv-open','oi-stale-gap'];
    for (const id of ids) {
      const rec = der && der[id];
      if (rec && rec.sql && rec.sql.text) {
        text = rec.sql.text;
        from = 'the excerpt carried in the ' + id + ' derivation record' +
               (Array.isArray(rec.sql.lines) ? ' (lines ' + rec.sql.lines[0] + '–' + rec.sql.lines[1] + ')' : '');
        break;
      }
    }
  }

  if (!text) {
    body.appendChild(empty({
      what: 'The query text is not published with this build.',
      why: 'The published index does not list this section’s query and no derivation record carried an ' +
           'excerpt. The query itself is in the repo at pipeline/sql/open-item-list.sql.'
    }));
    return c;
  }

  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const html = lines.map(function (ln, i) {
    return '<span class="ln">' + (i + 1) + '</span>' + esc(ln);
  }).join('\n');
  body.appendChild(h('<div class="sqlbox"><pre><code>' + html + '</code></pre></div>'));
  body.appendChild(h('<div class="sqlfoot"><span>' + esc(from) + '</span><span>' +
    num(lines.length) + ' lines</span><span>reads OINV · ORIN · ORCT · OPCH · ORPC · OVPM · OCRD · OCRG · ITR1 · OITR</span></div>'));
  return c;
}

/** The page footer: where the numbers came from, and how old they are. */
function paintFoot(m, co, asOf) {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
      '<div><b>Section</b> — open-item-list, one row per open SAP document, unioned across ' +
        '<code>OINV</code> and <code>ORIN</code> (customer invoices and credit notes), <code>ORCT</code> ' +
        '(receipts), <code>OPCH</code> and <code>ORPC</code> (vendor bills and credit notes) and ' +
        '<code>OVPM</code> (payments), with <code>OCRD</code>/<code>OCRG</code> for the party and ' +
        '<code>ITR1</code>/<code>OITR</code> as a reconciliation diagnostic only.</div>' +
      '<div><b>Coverage</b> — the row set is CAPPED and FLOORED. Only documents with ₹10,000 or more ' +
        'still open, ranking in the company’s biggest 1,500 or their own type’s biggest 400, are ' +
        'published. Uncapped totals live in the broadcast <code>DT_*</code> and <code>CO_*</code> ' +
        'columns and are read once, never summed.</div>' +
      '<div><b>Book</b> — ' + esc(companyLabel(co)) + '. Figures from one company are not comparable ' +
        'with another’s, and adding the three together double counts JIVO’s inter-book trading.</div>' +
      '<div><b>Freshness</b> — ' + (asOf ? 'as of ' + esc(asOf) + '. ' : '') +
        (gen ? 'Built ' + esc(ago(gen)) + ' (' + esc(gen) + '). ' : 'Build time unknown. ') +
        'The as-of date filters the document date only: settlement state and party balances are always ' +
        'live, so a back-dated run is never a historical position.</div>' +
      '<div><b>Read-only</b> — this board issues no write to SAP, ever (CONTRACT §0.2).</div>' +
    '</div>' +
    '<p><a href="' + esc(hrefSection('methodology.html', co)) + '">Methodology and the corrections</a> · ' +
    '<a href="' + esc(hrefSection('receivables', co)) + '">What customers really owe</a> · ' +
    '<a href="' + esc(hrefSection('payables', co)) + '">What JIVO really owes</a> · ' +
    '<a href="' + esc(hrefDerivation('oi-stale-gap', co)) + '">How the gap is derived</a> · ' +
    '<a href="' + esc(hrefSection('health', co)) + '">Build health</a></p>';
}

/* ══ 5. boot ═════════════════════════════════════════════════════════════ */

shell({
  title: 'Open items',
  subtitle: 'Every document SAP still calls open — and what the ledgers say instead',
  section: SECTION
});

render().catch(function (e) {
  const main = document.getElementById('main');
  if (main) {
    main.innerHTML = '';
    main.appendChild(empty({
      what: 'This page could not be rendered.',
      why: 'The data files loaded but the page failed while drawing them: ' +
           ((e && e.message) ? e.message : String(e)) +
           '. No figure on screen should be trusted until this is fixed.'
    }));
  }
  try { console.error('[open-items]', e); } catch (e2) { /* ignore */ }
});

onRefresh(render);
</script>
