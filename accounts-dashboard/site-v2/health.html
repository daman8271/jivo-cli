<script type="module">
/* ────────────────────────────────────────────────────────────────────────────
   health.html — the pipeline instrument panel.

   On 2026-08-22 this board served 13:42 figures as though they were live for
   five hours. A darwin/arm64 hana-sql binary was pulled onto the Linux VPS,
   every 2-minute build died with "Exec format error", the publish guards
   correctly refused to ship a broken build, and the last good deployment kept
   serving. Every guard worked. Nothing was watching what the operator actually
   sees. This page is that watch.

   The one thing to understand about it: this page is built and published BY the
   pipeline it reports on. If the pipeline freezes, this page freezes with it and
   every panel below will keep saying "ok" — because they are the last good
   build's answers. Only the freshness clock, which compares the build stamp
   against the reader's own clock in the browser, can catch a frozen pipeline.
   That is why the clock is first, largest, and explains itself.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */
import {
  shell, crumb, empty, checkDot,
  manifest, isStale, refreshNow, company, companyLabel,
  money, num, pct, ago, esc,
  hrefSection, hrefDerivation, hrefCaveat, onRefresh
} from './assets/core.js';
import { hbars, lineArea } from './assets/charts.js';

/* ══ 1. constants — the pipeline's own settings, named where they are used ══ */

/** core.isStale(): older than this many minutes, inside office hours, is stale. */
const STALE_MIN = 30;
/** The window in which the stale rule fires at all (core.js OFFICE_FROM/TO). */
const OFFICE_FROM = 7, OFFICE_TO = 23;
/** pipeline/live-refresh.sh cron cadence, in minutes. */
const CADENCE_MIN = 2;
/** pipeline/live-refresh.sh escalates to notify-fleet.sh on this streak. */
const ALERT_STREAK = 3;
/** pipeline/history.py records at most one point per this many minutes. */
const HISTORY_GAP_MIN = 30;
/** Fewer distinct publishes than this and a trend line would be a lie. */
const MIN_POINTS_TO_PLOT = 4;
/** CONTRACT §8. verify.py looks for each of these in the SQL and the Python. */
const CORRECTIONS = ['C-0001', 'C-0005', 'C-0019', 'C-0020', 'C-0021', 'C-0022', 'C-0023'];

/* ══ 2. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + esc(src) + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a panel: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/** `<span class="pill ok">OK</span>` — the word is always in the pill. */
function pill(text, tone) {
  return '<span class="pill ' + esc(tone || 'dead') + '">' + esc(text) + '</span>';
}

/** A scrolling table host. Wide content scrolls in here, never the page body. */
function tablewrap(inner, cls) {
  return h('<div class="tablewrap ' + (cls || '') + '">' + inner + '</div>');
}

/** One mini-KPI tile. `null` value renders the reason, never a zero. */
function mk(label, value, sub, tone) {
  const v = (value === null || value === undefined) ? 'not computed' : value;
  return '<div class="mk"><div class="lab">' + esc(label) + '</div>' +
         '<div class="val' + (tone ? ' ' + esc(tone) : '') + '">' + v + '</div>' +
         (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
}

/** Format a KPI value by its declared unit. Returns null when nothing computed. */
function fmtVal(v, unit) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  if (!isFinite(n)) return null;
  switch (unit) {
    /* A difference of forty paise is not ₹0 — that is exactly the confident zero
       CONTRACT §0.3 forbids. Say "under ₹1" and let the reader move on. */
    case 'INR':   return (n !== 0 && Math.abs(n) < 0.5) ? 'under ₹1' : money(n);
    case 'pct':   return (Math.abs(n) >= 1000 ? num(n) : n.toFixed(2)) + '%';
    case 'days':  return num(n) + (Math.abs(n) === 1 ? ' day' : ' days');
    case 'count': return num(n);
    default:      return money(n);
  }
}

/** A figure, or the honest words. Never a bare dash — nil and unknown differ. */
function val(v, unit) { const s = fmtVal(v, unit); return s === null ? 'not computed' : s; }

/** this board − the second route, in the KPI's own unit. */
function deltaOf(v, a) {
  if (v === null || v === undefined || a === null || a === undefined) return null;
  const nv = Number(v), na = Number(a);
  return (isFinite(nv) && isFinite(na)) ? nv - na : null;
}

/**
 * The relative gap. verify.py stores `delta_pct` already multiplied by 100, and
 * a unit mismatch can make it eight zeroes long — at that size a ratio ("87
 * lakh times") is readable where a percentage is not.
 */
function gapTxt(dp, v, a) {
  if (dp === null || dp === undefined || isNaN(Number(dp))) {
    return { txt: 'not comparable',
             title: 'One of the two routes produced no figure, so there is no percentage between them.' };
  }
  const n = Number(dp);
  const na = Number(a);
  if (Math.abs(n) >= 1000 && isFinite(na) && na !== 0) {
    const r = Number(v) / na;
    return { txt: num(r) + '×',
             title: 'This board’s figure is ' + num(r) + ' times the second route’s (' +
                    n.toFixed(2) + '%).' };
  }
  return { txt: (n > 0 ? '+' : '') + n.toFixed(2) + '%',
           title: 'Relative difference against the second route.' };
}

/** "3 h 43 min" — a gap an operator can feel. */
function dur(min) {
  if (min === null || min === undefined || !isFinite(min)) return 'unknown';
  const m = Math.round(min);
  if (m < 60) return m + ' min';
  const hh = Math.floor(m / 60), mm = m % 60;
  if (hh < 24) return hh + ' h' + (mm ? ' ' + mm + ' min' : '');
  return Math.floor(hh / 24) + ' d ' + (hh % 24) + ' h';
}

/**
 * The hour off the stamp's OWN clock. Every pipeline stamp carries +05:30, so
 * reading the two digits after the T gives IST without any timezone arithmetic
 * and without assuming the reader is sitting in the office.
 */
function istHour(iso) {
  const m = /^\d{4}-\d\d-\d\dT(\d\d)/.exec(String(iso || ''));
  return m ? Number(m[1]) : null;
}

/** `2026-08-22T22:48:02+05:30` → `22:48 IST`. */
function istClock(iso) {
  const m = /^\d{4}-\d\d-\d\d[T ](\d\d:\d\d)/.exec(String(iso || ''));
  return m ? m[1] + ' IST' : String(iso || 'unknown');
}

/** `2026-08-22T22:48:02+05:30` → `22 Aug 22:48 IST`. */
function istStamp(iso) {
  const m = /^(\d{4})-(\d\d)-(\d\d)[T ](\d\d:\d\d)/.exec(String(iso || ''));
  if (!m) return String(iso || 'unknown');
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return Number(m[3]) + ' ' + (MON[Number(m[2]) - 1] || m[2]) + ' ' + m[4] + ' IST';
}

/** The reader's own clock, which is what staleness is actually measured against. */
function browserClock() {
  try {
    const d = new Date();
    const off = -d.getTimezoneOffset();
    const sign = off < 0 ? '−' : '+';
    const hh = String(Math.floor(Math.abs(off) / 60)).padStart(2, '0');
    const mm = String(Math.abs(off) % 60).padStart(2, '0');
    return d.toLocaleString() + ' (UTC' + sign + hh + ':' + mm + ')';
  } catch (e) { return 'unknown'; }
}

/* ══ 3. the two files core.js does not load ══════════════════════════════ */

/*
 * audit.json and history.jsonl are published with every build (CONTRACT §2) and
 * only this page reads them, so core.js has no loader for either. Both are
 * fetched with the build stamp appended, so a new build is never served from the
 * HTTP cache. A failure here is a REAL failure — these files are guaranteed by
 * the pipeline — so it renders as a reason, never as a silent empty panel.
 */
function stamped(path, m) {
  const g = (m && m.generated_at) || '0';
  return path + '?v=' + encodeURIComponent(g);
}

async function loadAudit(m) {
  try {
    const r = await fetch(stamped('data/audit.json', m), { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (!j || typeof j !== 'object') throw new Error('the file did not parse as an object');
    return j;
  } catch (e) {
    return { __error: 'data/audit.json could not be read (' +
             ((e && e.message) ? e.message : String(e)) + ')' };
  }
}

async function loadHistory(m) {
  try {
    const r = await fetch(stamped('data/history.jsonl', m), { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return parseHistory(await r.text());
  } catch (e) {
    return { __error: 'data/history.jsonl could not be read (' +
             ((e && e.message) ? e.message : String(e)) + ')' };
  }
}

/**
 * One JSON object per line. history.py dedupes on the BUILD stamp, so two lines
 * carrying the same `t` are the same publish recorded twice — counted once, and
 * the repeat count is reported rather than hidden. A line that will not parse
 * costs one point, never the series (history.py's own rule).
 */
function parseHistory(text) {
  const seen = new Map();
  let raw = 0, bad = 0;
  String(text).split(/\r?\n/).forEach(function (ln) {
    const s = ln.trim();
    if (!s) return;
    raw += 1;
    let o = null;
    try { o = JSON.parse(s); } catch (e) { bad += 1; return; }
    if (!o || !o.t) { bad += 1; return; }
    seen.set(o.t, o);                       // last write of a stamp wins
  });
  const points = Array.from(seen.values())
    .sort(function (a, b) { return Date.parse(a.t) - Date.parse(b.t); });
  return { raw: raw, bad: bad, repeats: Math.max(0, raw - bad - points.length), points: points };
}

/** Total rows across every section and book in one history point. */
function pointRows(p) {
  let t = 0;
  const rows = (p && p.rows) || {};
  for (const sec in rows) {
    const per = rows[sec] || {};
    for (const co in per) { const n = Number(per[co]); if (isFinite(n)) t += n; }
  }
  return t;
}

/* ══ 4. render ═══════════════════════════════════════════════════════════ */

let LAST_MANIFEST = null;

async function render() {
  const co = company();
  const main = document.getElementById('main');
  const m = await manifest();
  LAST_MANIFEST = m;
  const [audit, hist] = await Promise.all([loadAudit(m), loadHistory(m)]);

  main.innerHTML = '';
  const add = n => { if (n) main.appendChild(n); return n; };

  add(crumb([
    { label: 'Board', href: hrefSection('index.html', co) },
    { label: 'Pipeline health' }
  ]));

  add(clockCard(m));
  add(sectionsCard(m, co));
  add(timingCard(m, hist));
  add(auditCard(m, audit));
  add(failuresCard(m));
  add(crossSectionCard(audit));
  add(rollupCard(audit));
  add(correctionsCard(m, audit));
  add(historyCard(m, hist));
  add(alertsCard(m));

  paintFoot(m);
}

/* ── 4.1 the freshness clock ─────────────────────────────────────────────── */

/**
 * First and largest, because it is the only panel on this page that can catch a
 * frozen pipeline: every other panel is an artefact OF the build, and a build
 * that never ran leaves the last good one on screen looking healthy.
 *
 * Repainted on a 30-second timer so the minutes tick up without a rebuild — a
 * clock that only moves when the page is reloaded is not a clock.
 */
function clockCard(m) {
  const host = h('<div class="hz-clock" id="hzClock"></div>');
  paintClock(host, m);
  return host;
}

function paintClock(host, m) {
  if (!host) return;
  const s = isStale(m);
  /* Four states, not two. "Past 30 minutes but the overnight rule is not firing"
     is a real and common state, and calling it "Live" would be the same kind of
     confident half-truth this page exists to prevent. */
  const overdue = !s.unknown && !s.stale && s.minutes !== null && s.minutes > STALE_MIN;
  const state = s.unknown ? 'unknown' : s.stale ? 'stale' : overdue ? 'quiet' : 'live';
  host.className = 'hz-clock' + (state === 'live' ? '' : ' is-' + state);

  const big = s.unknown ? 'unknown'
            : (s.minutes === 0 ? 'just now' : num(s.minutes) + ' min');
  const since = s.unknown ? 'the build stamp could not be read'
                          : 'since the last published build';
  const word = state === 'live' ? 'Live'
             : state === 'stale' ? 'Stale'
             : state === 'quiet' ? 'Quiet hours'
             : 'Freshness unknown';
  const tone = state === 'live' ? 'ok' : state === 'stale' ? 'bad' : 'warn';

  const gen = m && m.generated_at;
  const secs = (m && typeof m.build_seconds === 'number') ? m.build_seconds : null;

  const why = state === 'live'
    ? 'The build that produced every figure on this board landed <b>' + esc(ago(gen)) +
      '</b>. Nothing on this page is older than that stamp.'
    : state === 'stale'
      ? '<b>These numbers are ' +
        esc(s.minutes === null ? 'of unknown age' : num(s.minutes) + ' minutes old') + '.</b> ' +
        esc(s.reason || 'the pipeline marked this build stale') +
        '. The figures stay on screen — they are simply no longer presented as live.'
      : state === 'quiet'
        ? '<b>These numbers are ' + esc(num(s.minutes)) + ' minutes old</b> — past the ' +
          STALE_MIN + '-minute mark, but your clock reads outside ' +
          String(OFFICE_FROM).padStart(2, '0') + ':00–' + String(OFFICE_TO).padStart(2, '0') +
          ':00, so the stale rule is deliberately not firing. Overnight the refresh loop only ' +
          'builds on the half hour and the books are not moving. <b>If anyone is actually posting ' +
          'in SAP right now, read this as stale.</b>'
        : '<b>The age of these numbers cannot be established.</b> ' +
          esc(s.reason || 'no readable build stamp') +
          '. Treat every figure on this board as unverified until this clears.';

  host.innerHTML =
    '<div>' +
      '<div class="hz-state">' + esc(word) + '</div>' +
      '<div class="hz-face">' +
        '<span class="hz-big">' + esc(big) + '</span>' +
        '<span class="hz-since">' + esc(since) + '</span>' +
        (state === 'live' ? '' : pill(state === 'stale' ? 'STALE'
                                    : state === 'quiet' ? 'PAST 30 MIN' : 'UNKNOWN', tone)) +
      '</div>' +
    '</div>' +
    '<p class="hz-why">' + why + '</p>' +
    '<div class="kv">' +
      '<div><div class="k">Build stamp</div><div class="v"><span class="hz-mono">' +
        esc(gen || 'none published') + '</span></div></div>' +
      '<div><div class="k">Books as of</div><div class="v">' +
        esc((m && m.as_of) || 'not stated') + '</div></div>' +
      '<div><div class="k">Build took</div><div class="v">' +
        (secs === null ? 'not recorded' : esc(secs.toFixed(1) + ' s')) + '</div></div>' +
      '<div><div class="k">Your clock</div><div class="v"><span class="hz-mono">' +
        esc(browserClock()) + '</span></div></div>' +
    '</div>' +
    '<p class="hz-rule"><b>The rule, in words.</b> This board counts as stale when the build ' +
      'stamp is more than <b>' + STALE_MIN + ' minutes old</b> and your clock reads between ' +
      '<b>' + String(OFFICE_FROM).padStart(2, '0') + ':00 and ' + String(OFFICE_TO).padStart(2, '0') + ':00</b>, ' +
      'or when the pipeline itself set <code>stale: true</code> in the manifest. ' +
      'Right now your clock is <b>' + (s.officeHours ? 'inside' : 'outside') + '</b> that window' +
      (s.officeHours ? '' : ', so the age rule is not being applied') + '. ' +
      'It deliberately does not fire overnight: the books do not move at 04:00, the refresh loop ' +
      'only runs on the half hour outside working time, and a red banner that cries wolf every ' +
      'night teaches people to ignore the one that matters. ' +
      'The refresh loop itself ticks every ' + CADENCE_MIN + ' minutes and forces a build if ' +
      'nothing has published for ' + STALE_MIN + '.</p>' +
    '<p class="hz-rule"><b>What this clock alone can catch.</b> Every other panel on this page ' +
      'is an artefact of the build — published by the pipeline it reports on. If the pipeline ' +
      'dies, they all freeze mid-sentence saying “ok”, exactly as they did through the five-hour ' +
      'freeze on 22 August 2026. Only this clock, which compares the build stamp against your own ' +
      'browser clock, notices. If your machine’s clock is wrong, this reading is wrong too — that ' +
      'is why the exact stamp and your clock are both printed above.</p>' +
    '<div class="hz-acts">' +
      '<button class="btn sm" type="button" id="hzCheck">Check for a new build now</button>' +
      '<a class="btn sm" href="' + esc(hrefSection('index.html', company())) + '">Back to the board</a>' +
      (m && m.history_points ? '<span class="tnote" style="margin:0">' +
        esc(num(m.history_points)) + ' points in the publish history</span>' : '') +
    '</div>';

  const btn = host.querySelector('#hzCheck');
  if (btn) {
    btn.addEventListener('click', async function () {
      btn.disabled = true;
      const was = btn.textContent;
      btn.textContent = 'Checking…';
      try { await refreshNow(); } catch (e) { /* the clock below tells the truth anyway */ }
      const fresh = await manifest({ force: true });
      LAST_MANIFEST = fresh;
      paintClock(document.getElementById('hzClock'), fresh);
      const b2 = document.getElementById('hzClock') &&
                 document.getElementById('hzClock').querySelector('#hzCheck');
      if (b2) { b2.disabled = false; b2.textContent = was; }
    });
  }
}

/* ── 4.2 section status ──────────────────────────────────────────────────── */

function sectionsCard(m, co) {
  const c = card('Every section of the build', 'manifest.sections');
  const secs = (m && m.sections) || {};
  const ids = Object.keys(secs).sort();
  const cos = ((m && m.companies) || []).map(x => x.key);
  const keys = cos.length ? cos : ['oil', 'mart', 'bev'];

  if (!ids.length) {
    c.appendChild(empty({
      what: 'The manifest lists no sections at all.',
      why: 'That is not an empty board — it means data/manifest.json was unreadable or was ' +
           'written by a build that failed before it got to the sections. Nothing else on this ' +
           'page can be trusted while this is true.'
    }));
    return c;
  }

  const ok = ids.filter(id => secs[id].status === 'ok');
  const bad = ids.filter(id => secs[id].status === 'error');
  const emptySec = ids.filter(id => secs[id].status === 'empty');
  const zeroBooks = [];
  ids.forEach(function (id) {
    keys.forEach(function (k) {
      const n = ((secs[id].rows) || {})[k];
      if (n === 0) zeroBooks.push(id + ' / ' + k);
    });
  });
  const totalRows = ids.reduce(function (t, id) {
    return t + keys.reduce(function (s, k) {
      const n = Number(((secs[id].rows) || {})[k]);
      return s + (isFinite(n) ? n : 0);
    }, 0);
  }, 0);

  c.appendChild(h('<div class="minikpis">' +
    mk('Sections in this build', esc(num(ids.length)), 'the splitter is section-agnostic — this is however many the pipeline produced') +
    mk('Built cleanly', esc(num(ok.length)), 'status ok', ok.length === ids.length ? 'ok' : '') +
    mk('Failed', esc(num(bad.length)), bad.length ? 'shown in red below, with the reader’s error' : 'no section reported an error',
       bad.length ? 'bad' : '') +
    mk('Returned nothing', esc(num(emptySec.length)), 'no rows in any book', emptySec.length ? 'warn' : '') +
    mk('Rows published', esc(num(totalRows)), 'summary rows across all books') +
  '</div>'));

  let head = '<table><thead><tr><th>Section</th><th>Status</th>';
  keys.forEach(k => { head += '<th class="num">' + esc(companyLabel(k)) + '</th>'; });
  head += '<th class="num">Build time</th></tr></thead><tbody>';

  let body = '';
  ids.forEach(function (id) {
    const s = secs[id] || {};
    const tone = s.status === 'ok' ? 'ok' : s.status === 'error' ? 'bad' : 'warn';
    const label = String(id).replace(/-/g, ' ');
    body += '<tr>' +
      '<td class="nm"><a href="' + esc(hrefSection(id, co)) + '">' + esc(label) + '</a></td>' +
      '<td>' + pill(String(s.status || 'unknown').toUpperCase(), tone) + '</td>';
    keys.forEach(function (k) {
      const n = ((s.rows) || {})[k];
      if (n === null || n === undefined) {
        body += '<td class="num" title="the manifest carries no row count for this book">—</td>';
      } else if (Number(n) === 0) {
        body += '<td class="num"><span class="hz-zero" title="no rows in this book. Read the ' +
                'section page before taking this as nil — an empty book and a failed query look ' +
                'identical in a row count">0</span></td>';
      } else {
        body += '<td class="num">' + esc(num(n)) + '</td>';
      }
    });
    /* CONTRACT: seconds is null for every section in this build. "not recorded"
       is the truth; a zero here would read as an instant query. */
    const persec = (s.seconds) || {};
    const times = keys.map(k => persec[k]).filter(v => typeof v === 'number');
    body += '<td class="num">' + (times.length
      ? esc(times.reduce((a, b) => a + b, 0).toFixed(1) + ' s')
      : '<span class="muted" title="the manifest publishes sections[].seconds as null">not recorded</span>') +
      '</td></tr>';

    if (s.status !== 'ok') {
      body += '<tr><td class="hz-secerr" colspan="' + (keys.length + 3) + '">' +
        '<b>' + esc(label) + '</b> — ' +
        esc(s.error || 'the manifest records the failure but carries no error text, which is ' +
                       'itself a gap: the reason is only in the build log on the VPS.') +
        '</td></tr>';
    }
  });
  c.appendChild(tablewrap(head + body + '</tbody></table>'));

  c.appendChild(cap(
    'Row counts are <b>summary</b> rows per book, straight from the manifest. A count is not a ' +
    'health check — a section can publish the right number of rows with the wrong figures in them, ' +
    'which is what the verification audit below is for.' +
    (zeroBooks.length
      ? ' <b>' + esc(num(zeroBooks.length)) + ' book' + (zeroBooks.length === 1 ? '' : 's') +
        ' returned no rows at all</b> (' + esc(zeroBooks.join(', ')) + '). The pipeline scores ' +
        'that “ok” because at least one book had rows; open the section before reading it as nil.'
      : '')
  ));
  return c;
}

/* ── 4.3 build timing ────────────────────────────────────────────────────── */

function timingCard(m, hist) {
  const c = card('How long the build takes', 'manifest.sections[].seconds · history.jsonl');
  const secs = (m && m.sections) || {};
  const cos = ((m && m.companies) || []).map(x => x.key);
  const keys = cos.length ? cos : ['oil', 'mart', 'bev'];

  const items = [];
  Object.keys(secs).sort().forEach(function (id) {
    const per = (secs[id].seconds) || {};
    keys.forEach(function (k) {
      const v = per[k];
      if (typeof v === 'number' && isFinite(v)) {
        items.push({ name: String(id).replace(/-/g, ' ') + ' · ' + k, value: v });
      }
    });
  });

  if (items.length) {
    c.appendChild(hbars(items, {
      title: 'Seconds per section query, slowest first',
      sort: true, top: 20, color: '--c2',
      format: v => v.toFixed(1) + ' s'
    }));
    c.appendChild(cap('Per-query timings, as the builder recorded them. A query that suddenly ' +
      'doubles is the earliest warning that HANA is under load or a filter has stopped using ' +
      'an index.'));
  } else {
    c.appendChild(empty({
      what: 'Per-section build timings are not recorded in this build.',
      why: 'Every one of the ' + num(Object.keys(secs).length) + ' sections publishes ' +
           'seconds = null in all three books. That is “not recorded”, not zero — the builder ' +
           'does time each query, it simply does not reach the manifest, so there is nothing ' +
           'honest to plot. The moment the pipeline records it, this panel fills itself in.',
      hint: 'The whole-build figure IS recorded, and it is charted below.'
    }));
  }

  /* The whole-build duration is real, published, and the only timing this build
     actually carries. One bar per distinct publish — not a trend line. */
  if (hist && !hist.__error && hist.points && hist.points.length) {
    const bars = hist.points
      .filter(p => typeof p.build_seconds === 'number')
      .slice(-12)
      .map(p => ({ name: istStamp(p.t), value: p.build_seconds }));
    if (bars.length) {
      c.appendChild(hbars(bars, {
        title: 'Whole-build duration, per published build',
        sort: false, top: 12, color: '--c1',
        format: v => v.toFixed(1) + ' s'
      }));
      c.appendChild(cap('<b>' + esc(num(bars.length)) + '</b> published build' +
        (bars.length === 1 ? '' : 's') + ' with a recorded duration. The cron ticks every ' +
        CADENCE_MIN + ' minutes; a tick that finds nothing changed does not publish and does not ' +
        'appear here.'));
    }
  } else if (hist && hist.__error) {
    c.appendChild(empty({ what: 'The publish history could not be read.', why: hist.__error }));
  }
  return c;
}

/* ── 4.4 the verification audit ──────────────────────────────────────────── */

/** Flatten manifest.kpis into one list of {co, id, ...} for the whole build. */
function allChecks(m) {
  const out = [];
  const kpis = (m && m.kpis) || {};
  Object.keys(kpis).forEach(function (co) {
    const per = kpis[co] || {};
    Object.keys(per).forEach(function (id) {
      const k = per[id] || {};
      const chk = k.check || {};
      out.push({
        co: co, id: id,
        label: k.label || id,
        section: k.section || null,
        unit: k.unit || null,
        value: (k.value !== undefined) ? k.value : null,
        ok: (chk.ok === undefined) ? null : chk.ok,
        alt: (chk.alt_value === undefined) ? null : chk.alt_value,
        dpct: (chk.delta_pct === undefined) ? null : chk.delta_pct,
        method: chk.method || null
      });
    });
  });
  return out;
}

function auditCard(m, audit) {
  const c = card('The verification audit', 'manifest.audit_summary · verify.py');
  const sum = (m && m.audit_summary) || null;
  const checks = allChecks(m);
  const green = checks.filter(x => x.ok === true).length;
  const red = checks.filter(x => x.ok === false).length;
  const amber = checks.filter(x => x.ok === null).length;

  c.appendChild(h('<p class="blurb">Every headline figure is derived twice, by two different ' +
    'routes, from the same build — so the comparison measures the query and not the clock. This ' +
    'panel is the result of that comparison, run again on every build. It was a one-off review ' +
    'in v1; here it is a heartbeat.</p>'));

  if (!checks.length) {
    c.appendChild(empty({
      what: 'The manifest carries no KPI checks.',
      why: 'manifest.kpis is empty, so either derive.py or verify.py did not run in this build. ' +
           'No figure on this board has been corroborated by a second route — that is not the ' +
           'same as every figure being right.'
    }));
    return c;
  }

  const rollOk = sum && typeof sum.rollup_disagreements === 'number' ? sum.rollup_disagreements : null;
  const rollTotal = (audit && !audit.__error && audit.rollup_disagreements)
    ? Object.keys(audit.rollup_disagreements).reduce(
        (t, co) => t + (audit.rollup_disagreements[co] || []).length, 0)
    : null;
  const xs = (audit && !audit.__error && audit.cross_section) ? audit.cross_section : null;
  const xsAll = xs ? Object.keys(xs).reduce((a, co) => a.concat(xs[co] || []), []) : [];
  const xsOk = xsAll.filter(x => x.ok).length;
  const unver = sum && Array.isArray(sum.corrections_unverified) ? sum.corrections_unverified : null;

  c.appendChild(h('<div class="minikpis">' +
    mk('KPIs checked', esc(num(checks.length)),
       esc(num(checks.length / Math.max(1, Object.keys((m && m.kpis) || {}).length)) + ' per book, across ' +
           num(Object.keys((m && m.kpis) || {}).length) + ' books')) +
    mk('Corroborated', esc(num(green)), esc(pct(green, checks.length) + ' of them'), 'ok') +
    mk('Disagreeing', esc(num(red)), red ? 'listed in full below' : 'no two routes disagree', red ? 'bad' : 'ok') +
    mk('No second route', esc(num(amber)), 'a gap, not a contradiction', amber ? 'warn' : '') +
    mk('Roll-up reconciliation', rollOk === null ? null : (rollOk === 0 ? 'clean' : esc(num(rollOk))),
       rollTotal === null ? 'audit.json unreadable'
         : (rollOk === 0
             ? 'no exhaustive facet disagreed with its own total; ' + esc(num(rollTotal)) +
               ' top-N slices recorded, which are not expected to'
             : esc(num(rollOk)) + ' of ' + esc(num(rollTotal)) + ' recorded mismatches are real'),
       rollOk === 0 ? 'ok' : 'bad') +
    mk('Cross-section', xsAll.length ? (xsOk === xsAll.length ? 'agrees' : 'DISAGREES') : null,
       xsAll.length ? esc(num(xsOk) + ' of ' + num(xsAll.length) + ' second-query re-derivations agree')
                    : 'audit.json unreadable',
       xsAll.length && xsOk === xsAll.length ? 'ok' : 'bad') +
    mk('Corrections unverified', unver === null ? null : esc(num(unver.length)),
       unver === null ? 'the manifest carries no summary'
         : (unver.length ? esc(unver.join(', ')) : 'all ' + CORRECTIONS.length + ' located in the code'),
       (unver && unver.length) ? 'bad' : 'ok') +
  '</div>'));

  /* The three states, said plainly. This is the paragraph that stops someone
     reading 133 amber dots as 133 broken numbers. */
  c.appendChild(h('<div class="hz-legend">' +
    '<div><span>' + pill('GREEN', 'ok') + '</span><span><b>Corroborated.</b> A second, ' +
      'independent route produced the same figure. ' + esc(num(green)) + ' of ' +
      esc(num(checks.length)) + '.</span></div>' +
    '<div><span>' + pill('RED', 'bad') + '</span><span><b>The two routes disagree.</b> The number ' +
      'is still shown, everywhere, with the red dot beside it — “two routes disagree, go and look”, ' +
      'not “this is wrong”. ' + esc(num(red)) + ' of ' + esc(num(checks.length)) + '.</span></div>' +
    '<div><span>' + pill('AMBER', 'warn') + '</span><span><b>No independent route exists for that ' +
      'KPI</b>, or the difference is consistent with movement in a live book between the two ' +
      'measurements. That is a <b>gap in the checking</b>, not a contradiction in the figure, and ' +
      'it is never counted as a failure. ' + esc(num(amber)) + ' of ' + esc(num(checks.length)) +
      '.</span></div>' +
  '</div>'));

  /* This page reports the summary AND recounts it. If they ever part company,
     say so on the page rather than quietly trusting one of them. */
  if (sum && typeof sum.kpi_checks_failing === 'number' && sum.kpi_checks_failing !== red) {
    c.appendChild(h('<div class="caveat" style="margin-top:12px"><b>The summary and the detail ' +
      'do not agree.</b> manifest.audit_summary says ' + esc(num(sum.kpi_checks_failing)) +
      ' failing check' + (sum.kpi_checks_failing === 1 ? '' : 's') + '; counting the per-KPI ' +
      'verdicts in the same manifest gives ' + esc(num(red)) + '. The list below is the count ' +
      'of the verdicts themselves, which is the one you can click through to.</div>'));
  }
  if (sum && typeof sum.kpi_checks_total === 'number' && sum.kpi_checks_total !== checks.length) {
    c.appendChild(h('<div class="caveat" style="margin-top:12px"><b>Check count mismatch.</b> ' +
      'The summary says ' + esc(num(sum.kpi_checks_total)) + ' checks; the manifest carries ' +
      esc(num(checks.length)) + '.</div>'));
  }
  return c;
}

/** One row of the failing / amber tables. */
function checkRow(x, withDot) {
  const d = deltaOf(x.value, x.alt);
  const g = gapTxt(x.dpct, x.value, x.alt);
  const href = hrefDerivation(x.id, x.co);
  return '<tr>' +
    '<td class="nm"><a href="' + esc(href) + '" data-k="' + esc(x.id) + '">' + esc(x.label) + '</a>' +
      '<div class="hz-mono muted">' + esc(x.id) + '</div></td>' +
    '<td>' + esc(x.co) + '</td>' +
    '<td>' + (x.section
      ? '<a href="' + esc(hrefSection(x.section, x.co)) + '">' + esc(String(x.section).replace(/-/g, ' ')) + '</a>'
      : '<span class="muted">not stated</span>') + '</td>' +
    '<td class="num">' + esc(val(x.value, x.unit)) + '</td>' +
    '<td class="num">' + esc(val(x.alt, x.unit)) + '</td>' +
    '<td class="num' + (d !== null && d < 0 ? ' neg' : '') + '">' +
      esc(d === null ? 'not comparable' : val(d, x.unit)) + '</td>' +
    '<td class="num" title="' + esc(g.title) + '">' + esc(g.txt) + '</td>' +
    (withDot ? '<td class="hz-dot" data-dot="' + esc(x.co) + '|' + esc(x.id) + '"></td>' : '') +
    '</tr>';
}

const CHECK_HEAD =
  '<thead><tr><th>KPI</th><th>Book</th><th>Section</th>' +
  '<th class="num">This board</th><th class="num">Second route</th>' +
  '<th class="num">Difference</th><th class="num">Gap</th>';

function failuresCard(m) {
  const checks = allChecks(m).filter(x => x.ok === false);
  const c = card('Where the two routes disagree',
                 'manifest.kpis[<book>][<id>].check.ok === false');

  if (!checks.length) {
    c.appendChild(empty({
      what: 'No KPI on this build failed its cross-check.',
      why: 'Every figure that has a second route reproduced it. That is a clean result from a ' +
           'check that ran, not an absence of checking — the amber group below names the figures ' +
           'that have no second route at all.'
    }));
    /* the amber group belongs here either way: what disagrees, then what was
       never checked at all. */
    const a0 = amberCard(m);
    if (a0) c.appendChild(a0);
    return c;
  }

  /* Worst first, and "worst" is the relative gap: an eight-figure percentage is
     a unit mismatch, and those are the ones to fix before anything else. */
  checks.sort(function (a, b) {
    const av = (a.dpct === null || isNaN(Number(a.dpct))) ? -1 : Math.abs(Number(a.dpct));
    const bv = (b.dpct === null || isNaN(Number(b.dpct))) ? -1 : Math.abs(Number(b.dpct));
    return bv - av;
  });

  const bySec = {};
  checks.forEach(x => { bySec[x.section || '(none)'] = (bySec[x.section || '(none)'] || 0) + 1; });
  const secList = Object.keys(bySec).sort((a, b) => bySec[b] - bySec[a])
    .map(s => String(s).replace(/-/g, ' ') + ' (' + bySec[s] + ')');

  c.appendChild(h('<p class="blurb"><b>' + esc(num(checks.length)) + '</b> figure' +
    (checks.length === 1 ? '' : 's') + ' came out differently by the second route. Worst gap ' +
    'first. Every one of them is still shown on its own page, with a red dot beside it — the ' +
    'board does not withhold a number, it says the routes disagree and hands you the derivation. ' +
    'Concentrated in: ' + esc(secList.join(', ')) + '.</p>'));

  c.appendChild(tablewrap(
    '<table>' + CHECK_HEAD + '<th></th></tr></thead><tbody>' +
    checks.map(x => checkRow(x, true)).join('') +
    '</tbody></table>', 'tall'));

  /* The dot resolves from the manifest alone for these rows (both figures are
     present), so it costs no derivations fetch — see ui.js resolveCheck. */
  c.querySelectorAll('td.hz-dot').forEach(function (td) {
    const parts = String(td.dataset.dot || '').split('|');
    if (parts.length === 2) td.appendChild(checkDot(parts[1], parts[0]));
  });

  c.appendChild(cap(
    '<b>“Second route”</b> is the figure the section was independently measured at when its SQL ' +
    'was catalogued, re-measured from the same build. <b>Gap</b> is shown as a percentage up to ' +
    '1,000% and as a multiple beyond it — a figure that is millions of times its second route is ' +
    'a unit mismatch (a share stored as rupees, a percentage stored as a count), not a business ' +
    'disagreement, and reads as nonsense written as a percentage. Click any KPI for the full ' +
    'derivation: the formula, the terms, the exclusions and the exact SQL lines.'));

  /* Then, and only then, the amber group: what disagrees first, what was never
     checked second. Amber is never folded into the count above. */
  const a = amberCard(m);
  if (a) c.appendChild(a);
  return c;
}

/** The amber group — collapsed, counted separately, never folded into failures. */
function amberCard(m) {
  const checks = allChecks(m).filter(x => x.ok === null);
  if (!checks.length) return null;
  checks.sort(function (a, b) {
    const s = String(a.section || '').localeCompare(String(b.section || ''));
    return s || String(a.id).localeCompare(String(b.id)) || String(a.co).localeCompare(String(b.co));
  });
  const noValue = checks.filter(x => x.value === null || x.value === undefined).length;

  const d = h('<details class="hz-fold"><summary>' + esc(num(checks.length)) +
    ' figures with no second route (amber) — open the list</summary></details>');
  d.appendChild(h('<p class="tnote" style="margin-top:10px"><b>Amber is a gap in the checking, ' +
    'not a fault in the figure.</b> It means one of two things: no independent route exists for ' +
    'that KPI at all, or the two routes differ by an amount consistent with the books moving ' +
    'between the two measurements. Neither is a contradiction, and neither is counted among the ' +
    'failures above. ' +
    (noValue ? esc(num(noValue)) + ' of them have no value on this build either — those are ' +
                '“not computed”, which is the honest word for a figure the query did not produce. '
              : '') +
    'Reading amber as red is how a board full of working numbers gets abandoned.</p>'));
  d.appendChild(tablewrap(
    '<table>' + CHECK_HEAD + '</tr></thead><tbody>' +
    checks.map(x => checkRow(x, false)).join('') +
    '</tbody></table>', 'tall'));
  return d;
}

function crossSectionCard(audit) {
  const c = card('A/R and A/P, re-derived by a second query', 'audit.json cross_section');
  if (audit && audit.__error) {
    c.appendChild(empty({ what: 'The audit file could not be read.', why: audit.__error }));
    return c;
  }
  const xs = (audit && audit.cross_section) || null;
  const cos = xs ? Object.keys(xs).sort() : [];
  const rows = cos.reduce((a, co) => a.concat((xs[co] || []).map(x => Object.assign({ co: co }, x))), []);

  if (!rows.length) {
    c.appendChild(empty({
      what: 'No cross-section comparison ran on this build.',
      why: 'audit.json carries an empty cross_section block. The ageing sections were therefore ' +
           'not tied out against the open-item list, which is the check that catches a whole ' +
           'section drifting rather than one figure.'
    }));
    return c;
  }

  c.appendChild(h('<p class="blurb">The two biggest numbers on the board — what customers owe and ' +
    'what JIVO owes — recomputed from a completely different query: the open-item list, one row ' +
    'per open document, different joins. Both figures come from the same build, so any difference ' +
    'is the query and not the half hour between two database reads.</p>'));

  let t = '<table><thead><tr><th>Book</th><th>Figure</th><th class="num">Ageing section</th>' +
          '<th class="num">Open-item list</th><th class="num">Difference</th><th class="num">Gap</th>' +
          '<th>Verdict</th></tr></thead><tbody>';
  rows.forEach(function (x) {
    const d = deltaOf(x.primary, x.alt);
    const g = gapTxt(x.delta_pct, x.primary, x.alt);
    t += '<tr>' +
      '<td>' + esc(x.co) + '</td>' +
      '<td class="nm">' + esc(x.kpi) + '<div class="tnote" style="margin:2px 0 0">' +
        esc(x.method || '') + '</div></td>' +
      '<td class="num">' + esc(val(x.primary, 'INR')) + '</td>' +
      '<td class="num">' + esc(val(x.alt, 'INR')) + '</td>' +
      '<td class="num' + (d !== null && d < 0 ? ' neg' : '') + '">' +
        esc(d === null ? 'not comparable' : val(d, 'INR')) + '</td>' +
      '<td class="num" title="' + esc(g.title) + '">' + esc(g.txt) + '</td>' +
      '<td>' + pill(x.ok ? 'AGREE' : 'DISAGREE', x.ok ? 'ok' : 'bad') + '</td>' +
      '</tr>';
  });
  c.appendChild(tablewrap(t + '</tbody></table>'));
  c.appendChild(cap('The open-item list publishes only a top-N slice of open documents, so its ' +
    'visible rows understate the book by 20–35%. The comparison uses its <code>DT_OPEN_ALL</code> ' +
    'column, the untruncated total per document type. Getting that wrong the first time produced ' +
    'a confident 640% “disagreement” that was entirely an artefact of the check.'));
  return c;
}


function rollupCard(audit) {
  const c = card('Each faceted section against its own roll-up', 'audit.json rollup_disagreements');
  if (audit && audit.__error) {
    c.appendChild(empty({ what: 'The audit file could not be read.', why: audit.__error }));
    return c;
  }
  const rd = (audit && audit.rollup_disagreements) || null;
  if (!rd) {
    c.appendChild(empty({
      what: 'No roll-up reconciliation ran on this build.',
      why: 'audit.json carries no rollup_disagreements block, so the broadest automatic check ' +
           'there is — does each facet of a section still add up to that section’s own total — ' +
           'did not run.'
    }));
    return c;
  }

  const all = Object.keys(rd).sort()
    .reduce((a, co) => a.concat((rd[co] || []).map(x => Object.assign({ co: co }, x))), []);
  const real = all.filter(x => x.severity === 'disagreement');
  const partial = all.filter(x => x.severity !== 'disagreement');

  c.appendChild(h('<p class="blurb">Several sections stack a roll-up row and several independent ' +
    'facets of the same data in one result set — goods-return carries TOTAL, CLASS, MONTH, ' +
    'CREDIT_NOTE and VENDOR together. Summing every non-total row counts the section four times ' +
    'over. So each facet is reconciled to the total <b>on its own</b>. This is the single most ' +
    'common way a board like this goes quietly wrong.</p>'));

  c.appendChild(h('<div class="minikpis">' +
    mk('Mismatches recorded', esc(num(all.length)),
       'a facet is only written down when it differs from its total by more than a basis point — ' +
       'this is the exception list, not the number of comparisons run') +
    mk('Real disagreements', esc(num(real.length)),
       real.length ? 'listed below' : 'no exhaustive facet (CLASS, KIND, MONTH, STATUS, AGE_BUCKET, TYPE) disagreed',
       real.length ? 'bad' : 'ok') +
    mk('Top-N facets', esc(num(partial.length)),
       'not expected to reconcile — see below', partial.length ? 'warn' : '') +
  '</div>'));

  if (real.length) {
    let t = '<table><thead><tr><th>Book</th><th>Section</th><th>Facet</th><th>Column</th>' +
            '<th class="num">Roll-up</th><th class="num">Facet sum</th><th class="num">Gap</th>' +
            '</tr></thead><tbody>';
    real.sort((a, b) => Math.abs(b.delta_pct) - Math.abs(a.delta_pct)).forEach(function (x) {
      const g = gapTxt(x.delta_pct, x.facet_sum, x.rollup);
      t += '<tr><td>' + esc(x.co) + '</td><td class="nm">' + esc(String(x.section).replace(/-/g, ' ')) +
        '</td><td>' + esc(x.facet) + '</td><td class="code">' + esc(x.column) + '</td>' +
        '<td class="num">' + esc(val(x.rollup, 'INR')) + '</td>' +
        '<td class="num">' + esc(val(x.facet_sum, 'INR')) + '</td>' +
        '<td class="num" title="' + esc(g.title) + '">' + esc(g.txt) + '</td></tr>';
    });
    c.appendChild(tablewrap(t + '</tbody></table>', 'tall'));
  } else {
    c.appendChild(h('<p class="tnote"><b>Not one exhaustive facet disagreed with its own ' +
      'total.</b> Every facet that is supposed to account for the whole section — CLASS, KIND, ' +
      'MONTH, CREDIT_NOTE, STATUS, AGE_BUCKET, TYPE — reconciled to within a basis point in all ' +
      'three books. The ' + esc(num(all.length)) + ' entries recorded are all top-N slices, ' +
      'which are not expected to reconcile and are listed below rather than counted as faults. ' +
      'Note what this panel is not: only a mismatch gets written down, so it is the exception ' +
      'list, and the number of comparisons actually run is not published.</p>'));
  }

  if (partial.length) {
    const d = h('<details class="hz-fold"><summary>' + esc(num(partial.length)) +
      ' top-N facets that do not reconcile by design — open the list</summary></details>');
    d.appendChild(h('<p class="tnote" style="margin-top:10px">A VENDOR, PARTY, ACCOUNT or ITEM ' +
      'facet publishes the biggest N rows, not every row, so its sum is <i>supposed</i> to fall ' +
      'short of the section total. Flagging these would be crying wolf, so they are recorded as ' +
      'partial coverage and kept out of the disagreement count. They are listed because a facet ' +
      'that is <i>larger</i> than its roll-up, or wildly off on a column that should be complete, ' +
      'is worth someone’s eye.</p>'));
    let t = '<table><thead><tr><th>Book</th><th>Section</th><th>Facet</th><th>Column</th>' +
            '<th class="num">Roll-up</th><th class="num">Facet sum</th><th class="num">Gap</th>' +
            '</tr></thead><tbody>';
    partial.sort((a, b) => Math.abs(b.delta_pct) - Math.abs(a.delta_pct)).forEach(function (x) {
      const g = gapTxt(x.delta_pct, x.facet_sum, x.rollup);
      t += '<tr><td>' + esc(x.co) + '</td><td class="nm">' + esc(String(x.section).replace(/-/g, ' ')) +
        '</td><td>' + esc(x.facet) + '</td><td class="code">' + esc(x.column) + '</td>' +
        '<td class="num">' + esc(val(x.rollup, 'INR')) + '</td>' +
        '<td class="num">' + esc(val(x.facet_sum, 'INR')) + '</td>' +
        '<td class="num" title="' + esc(g.title) + '">' + esc(g.txt) + '</td></tr>';
    });
    d.appendChild(tablewrap(t + '</tbody></table>', 'tall'));
    c.appendChild(d);
  }
  return c;
}

/* ── 4.5 corrections compliance ──────────────────────────────────────────── */

function correctionsCard(m, audit) {
  const c = card('Are the corrections actually honoured?', 'audit.json corrections · CONTRACT §8');
  c.appendChild(h('<p class="blurb">The corrections are law on this board (CONTRACT §8): they are ' +
    'settled truths recorded by operators who checked against live SAP, and they override every ' +
    'default. This is the check that they are still in the code, not just in a document — every ' +
    'build greps the SQL, the Python and the specs for each code. <b>A correction that cannot be ' +
    'located is reported UNVERIFIED, never as passing.</b></p>'));

  if (audit && audit.__error) {
    c.appendChild(empty({ what: 'The audit file could not be read.', why: audit.__error }));
    return c;
  }
  const corr = (audit && audit.corrections) || null;
  if (!corr || !Object.keys(corr).length) {
    c.appendChild(empty({
      what: 'No correction compliance was recorded on this build.',
      why: 'audit.json carries no corrections block. Every one of the ' + CORRECTIONS.length +
           ' corrections is therefore UNVERIFIED on this build — not passing, not failing: ' +
           'unchecked.'
    }));
    return c;
  }

  const ids = CORRECTIONS.slice();
  Object.keys(corr).forEach(id => { if (ids.indexOf(id) < 0) ids.push(id); });

  const host = h('<div class="hz-corr"></div>');
  ids.forEach(function (id) {
    const rec = corr[id];
    const where = (rec && Array.isArray(rec.honoured_at)) ? rec.honoured_at : [];
    const found = !!(rec && rec.status === 'referenced' && where.length);
    const row = h('<div class="row"></div>');
    row.appendChild(h('<a class="cvcode" href="' + esc(hrefCaveat(id)) + '">' + esc(id) + '</a>'));
    row.appendChild(h(pill(found ? 'HONOURED' : 'UNVERIFIED', found ? 'ok' : 'bad')));
    row.appendChild(h('<div class="ttl">' + (found
      ? 'located in ' + esc(num(where.length)) + ' file' + (where.length === 1 ? '' : 's') +
        ' of the pipeline'
      : 'not found anywhere in the SQL, the Python or the specs on this build') + '</div>'));
    row.appendChild(h('<div class="where">' + (where.length
      ? '<div class="hz-chips">' + where.map(w => '<code>' + esc(w) + '</code>').join('') + '</div>'
      : '<div class="tnote" style="margin:2px 0 0">Reported UNVERIFIED. It may still be honoured ' +
        'in spirit somewhere the grep does not reach — but on the evidence this build carries, ' +
        'nobody should claim it is.</div>') + '</div>'));
    host.appendChild(row);
  });
  c.appendChild(host);

  const sum = (m && m.audit_summary) || {};
  const unver = Array.isArray(sum.corrections_unverified) ? sum.corrections_unverified : [];
  c.appendChild(cap('The check is a text search for the code across <code>pipeline/sql/*.sql</code>, ' +
    '<code>pipeline/*.py</code> and <code>specs/*.json</code>, keeping the first hit per file. ' +
    'It proves the correction is <b>referenced</b> where the work happens. It does not prove the ' +
    'line still does what the correction says — only a test can do that, and this build has none. ' +
    (unver.length
      ? '<b>' + esc(num(unver.length)) + ' unverified on this build: ' + esc(unver.join(', ')) + '.</b>'
      : 'The manifest agrees: none unverified on this build.')));
  return c;
}

/* ── 4.6 publish history, and the holes in it ────────────────────────────── */

function historyCard(m, hist) {
  const c = card('Publish history — and the gaps', 'data/history.jsonl');

  if (hist && hist.__error) {
    c.appendChild(empty({
      what: 'The publish history could not be read.',
      why: hist.__error + '. Without it there is no way to tell a board that has been publishing ' +
           'every two minutes from one that published once and stopped.'
    }));
    return c;
  }
  const pts = (hist && hist.points) || [];
  if (!pts.length) {
    c.appendChild(empty({
      what: 'No publish has been recorded yet.',
      why: 'history.jsonl is present but carries no usable point. Every KPI trend and every gap ' +
           'on this page comes from that file, so both are unavailable — not flat, unavailable.'
    }));
    return c;
  }

  /* Gaps between consecutive publishes, judged on the build stamp's own IST
     clock so the verdict does not depend on where the reader is sitting. */
  const spans = [];
  for (let i = 1; i < pts.length; i++) {
    const t0 = Date.parse(pts[i - 1].t), t1 = Date.parse(pts[i].t);
    const gap = (isFinite(t0) && isFinite(t1)) ? (t1 - t0) / 60000 : null;
    const hr = istHour(pts[i - 1].t);
    const office = hr === null ? null : (hr >= OFFICE_FROM && hr < OFFICE_TO);
    spans.push({ gap: gap, office: office, from: pts[i - 1].t, to: pts[i].t });
  }
  const holes = spans.filter(s => s.gap !== null && s.gap > STALE_MIN && s.office === true);
  const worst = holes.slice().sort((a, b) => b.gap - a.gap)[0] || null;
  const last = pts[pts.length - 1];
  const sinceLast = isFinite(Date.parse(last.t)) ? (Date.now() - Date.parse(last.t)) / 60000 : null;

  c.appendChild(h('<div class="minikpis">' +
    mk('Distinct publishes', esc(num(pts.length)),
       esc(num(hist.raw)) + ' lines in the file' +
       (hist.repeats ? ', ' + esc(num(hist.repeats)) + ' of them repeating a stamp already recorded' : '') +
       (hist.bad ? ', ' + esc(num(hist.bad)) + ' unreadable' : '')) +
    mk('First recorded', esc(istStamp(pts[0].t)), 'the oldest point still in the file') +
    mk('Last recorded', esc(istStamp(last.t)),
       sinceLast === null ? 'age unknown' : esc(dur(sinceLast)) + ' ago',
       (sinceLast !== null && sinceLast > STALE_MIN) ? 'warn' : 'ok') +
    mk('Working-hours gaps', esc(num(holes.length)),
       holes.length ? 'longer than ' + STALE_MIN + ' min between publishes' : 'no hole longer than ' + STALE_MIN + ' min',
       holes.length ? 'bad' : 'ok') +
    mk('Longest gap', worst ? esc(dur(worst.gap)) : (spans.length ? 'none over ' + STALE_MIN + ' min' : null),
       worst ? esc(istStamp(worst.from)) + ' → ' + esc(istStamp(worst.to))
             : (spans.length ? 'across ' + esc(num(spans.length)) + ' intervals' : 'only one publish recorded — there is no interval to measure'),
       worst ? 'bad' : '') +
  '</div>'));

  /* A trend line drawn through two points is a straight line by construction —
     it would look like a healthy flat series and mean nothing. Say the number. */
  if (pts.length >= MIN_POINTS_TO_PLOT) {
    const series = pts.filter(p => typeof p.build_seconds === 'number')
      .map(p => ({ x: istClock(p.t), y: p.build_seconds }));
    if (series.length >= MIN_POINTS_TO_PLOT) {
      c.appendChild(lineArea([{ name: 'Build duration', points: series }], {
        title: 'How long each published build took', height: 200, unit: 's',
        format: v => v.toFixed(1) + ' s'
      }));
    }
    const rowSeries = pts.map(p => ({ x: istClock(p.t), y: pointRows(p) }))
      .filter(p => isFinite(p.y) && p.y > 0);
    if (rowSeries.length >= MIN_POINTS_TO_PLOT) {
      c.appendChild(lineArea([{ name: 'Rows published', points: rowSeries }], {
        title: 'Rows published, every book and section', height: 200, unit: 'n'
      }));
      c.appendChild(cap('A step in this line is the books moving. A <b>flat</b> line across many ' +
        'builds while the clock keeps ticking is the shape of a pipeline that is running and ' +
        'fetching nothing.'));
    }
  } else {
    c.appendChild(empty({
      what: 'Too few publishes to plot a trend: ' + num(pts.length) +
            (pts.length === 1 ? ' point.' : ' points.'),
      why: 'A line through ' + num(pts.length) + ' point' + (pts.length === 1 ? '' : 's') +
           ' is a straight line by construction — it would look like a healthy, steady series and ' +
           'mean nothing at all. The publishes are listed below instead. history.py records at ' +
           'most one point every ' + HISTORY_GAP_MIN + ' minutes, so a full working day is about ' +
           Math.round((OFFICE_TO - OFFICE_FROM) * 60 / HISTORY_GAP_MIN) + ' points.'
    }));
  }

  let t = '<table><thead><tr><th>Published</th><th class="num">Gap before it</th>' +
          '<th class="num">Build took</th><th class="num">Rows</th><th>Books as of</th>' +
          '<th>Flagged stale</th></tr></thead><tbody>';
  pts.slice().reverse().forEach(function (p, i) {
    const idx = pts.length - 1 - i;
    const sp = idx > 0 ? spans[idx - 1] : null;
    const hole = sp && sp.gap !== null && sp.gap > STALE_MIN && sp.office === true;
    const rows = pointRows(p);
    t += '<tr>' +
      '<td class="nm" title="' + esc(p.t) + '">' + esc(istStamp(p.t)) + '</td>' +
      '<td class="num">' + (sp === null
        ? '<span class="muted">first point</span>'
        : (hole ? '<span class="tone-bad"><b>' + esc(dur(sp.gap)) + '</b></span> ' + pill('GAP', 'bad')
                : esc(dur(sp.gap)) +
                  (sp.office === false ? ' <span class="muted">(overnight)</span>' : ''))) + '</td>' +
      '<td class="num">' + (typeof p.build_seconds === 'number'
        ? esc(p.build_seconds.toFixed(1) + ' s') : '<span class="muted">not recorded</span>') + '</td>' +
      '<td class="num">' + (rows ? esc(num(rows)) : '<span class="muted">not recorded</span>') + '</td>' +
      '<td>' + esc(p.as_of || 'not stated') + '</td>' +
      '<td>' + (p.stale ? pill('STALE', 'bad') : pill('no', 'ok')) + '</td>' +
      '</tr>';
  });
  c.appendChild(tablewrap(t + '</tbody></table>', 'tall'));

  const bits = [];
  bits.push('A gap <b>is</b> the story on this page. The five-hour freeze on 22 August 2026 left ' +
    'no error anywhere — just a hole between two publishes while the last good deployment kept ' +
    'serving 13:42 figures as though they were live.');
  if (worst) {
    bits.push('The longest hole in this file is <b>' + esc(dur(worst.gap)) + '</b>, from ' +
      esc(istStamp(worst.from)) + ' to ' + esc(istStamp(worst.to)) + ', entirely inside working ' +
      'hours. At a ' + CADENCE_MIN + '-minute cadence that is roughly ' +
      esc(num(Math.round(worst.gap / CADENCE_MIN))) + ' ticks that produced nothing publishable.');
  } else if (spans.length) {
    bits.push('No working-hours hole longer than ' + STALE_MIN + ' minutes in the ' +
      esc(num(spans.length)) + ' interval' + (spans.length === 1 ? '' : 's') + ' recorded here.');
  }
  bits.push('Read a gap with care: a tick that finds nothing changed does <b>not</b> publish, and ' +
    'outside ' + String(OFFICE_FROM).padStart(2, '0') + ':00–' + String(OFFICE_TO).padStart(2, '0') +
    ':00 the full build is skipped except on the half hour. A quiet lunchtime and a dead binary ' +
    'both look like a hole here — which is why the clock at the top of this page, not this table, ' +
    'is the alarm.');
  if (hist.repeats) {
    bits.push('<b>' + esc(num(hist.repeats)) + ' line' + (hist.repeats === 1 ? '' : 's') +
      ' in the file repeat a build stamp that was already recorded</b>, and are counted once. ' +
      'The appender is meant to skip a stamp it has already seen, so the repeats are themselves ' +
      'worth a look — they inflate <code>history_points</code> in the manifest (' +
      esc(num((m && m.history_points) || 0)) + ') well above the ' + esc(num(pts.length)) +
      ' publishes that actually happened.');
  }
  if (hist.bad) {
    bits.push(esc(num(hist.bad)) + ' line' + (hist.bad === 1 ? '' : 's') + ' would not parse and ' +
      'were skipped. A torn line costs one point, never the series.');
  }
  c.appendChild(cap(bits.join(' ')));
  return c;
}

/* ── 4.7 operational alerts ──────────────────────────────────────────────── */

function alertsCard(m) {
  const c = card('Operational alerts', 'manifest.alerts · pipeline/notify-fleet.sh');
  const list = (m && Array.isArray(m.alerts)) ? m.alerts.slice() : [];

  list.sort(function (a, b) {
    const ta = Date.parse((a && a.t) || ''), tb = Date.parse((b && b.t) || '');
    return (isFinite(tb) ? tb : 0) - (isFinite(ta) ? ta : 0);      // newest first
  });

  if (list.length) {
    let t = '<table><thead><tr><th>Raised</th><th>Alert</th></tr></thead><tbody>';
    list.forEach(function (a) {
      t += '<tr><td class="nm" title="' + esc(a.t || '') + '">' + esc(istStamp(a.t)) +
        '<div class="tnote" style="margin:2px 0 0">' + esc(ago(a.t)) + '</div></td>' +
        '<td class="nm" style="white-space:normal">' + esc(a.msg || '(no message)') + '</td></tr>';
    });
    c.appendChild(tablewrap(t + '</tbody></table>'));
  } else {
    c.appendChild(empty({
      what: 'No alert is recorded against this build.',
      why: 'The refresh loop counts consecutive build failures and raises an alert on the ' +
           ALERT_STREAK + 'rd, then every 30th after that. The manifest carries the five most ' +
           'recent, and it is carrying none. That means no streak was recorded in the state file ' +
           'this build read — it is NOT independent proof that the pipeline is healthy, because a ' +
           'build that never runs never writes an alert either.',
      hint: 'The freshness clock at the top of this page is the evidence that matters.'
    }));
  }

  c.appendChild(cap('Alerts are raised by <code>pipeline/notify-fleet.sh</code>, which deliberately ' +
    'invents no push channel: it writes the alert log, syslog, and a small JSON state file that ' +
    'the next successful build folds into the manifest for this panel. The alert that reaches a ' +
    'human with no infrastructure at all is the board’s own freshness banner, computed in the ' +
    'browser from the build stamp. This panel is the second layer, for diagnosis — and it has the ' +
    'same blind spot as everything else here: it can only show what a build managed to publish.'));
  return c;
}

/* ── 4.8 footer ──────────────────────────────────────────────────────────── */

function paintFoot(m) {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  const co = company();
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
      '<div><b>This page</b> — reads three files and nothing else: ' +
        '<code>data/manifest.json</code> (the build stamp, the sections, every KPI and its ' +
        'cross-check), <code>data/audit.json</code> (roll-ups, cross-section, corrections) and ' +
        '<code>data/history.jsonl</code> (one line per publish). It issues no query.</div>' +
      '<div><b>Its blind spot</b> — all three are published BY the build. A build that never ran ' +
        'leaves yesterday’s answers on screen looking healthy. Only the clock at the top, which ' +
        'compares the build stamp against your browser, can see that.</div>' +
      '<div><b>What it cannot see</b> — the cron log on the VPS, whether Vercel accepted the ' +
        'deploy, and whether HANA is reachable right now. Those live on the box; this page sees ' +
        'only what the last successful build wrote down.</div>' +
      '<div><b>Freshness</b> — ' + (gen ? 'built ' + esc(ago(gen)) + ' (' + esc(gen) + '). ' : 'build time unknown. ') +
        'The page re-reads the manifest every minute and redraws itself when the build moves; the ' +
        'clock reticks every 30 seconds regardless.</div>' +
      '<div><b>Read-only</b> — this board issues no write to SAP, ever (CONTRACT §0.2).</div>' +
    '</div>' +
    '<p><a href="' + esc(hrefSection('methodology.html', co)) + '">Methodology and the corrections</a> · ' +
    '<a href="' + esc(hrefSection('index.html', co)) + '">The board</a> · ' +
    '<a href="' + esc(hrefSection('search.html', co)) + '">Search</a></p>';
}

/* ══ 5. boot ═════════════════════════════════════════════════════════════ */

shell({
  title: 'Pipeline health',
  subtitle: 'Is this board live, does it add up, and when did it last actually publish?',
  section: 'health'
});

render().catch(function (e) {
  const main = document.getElementById('main');
  if (main) {
    main.innerHTML = '';
    main.appendChild(empty({
      what: 'The health page could not be rendered.',
      why: 'The files loaded but this page failed while drawing them: ' +
           ((e && e.message) ? e.message : String(e)) +
           '. That means the board is now unmonitored — check the build stamp in the masthead ' +
           'above, which is computed by the shell and does not depend on this page.'
    }));
  }
  try { console.error('[health]', e); } catch (e2) { /* ignore */ }
});

/* The minutes must move on their own. A clock that only ticks on reload is not
   a clock, and this one is the whole reason the page exists. */
setInterval(function () {
  paintClock(document.getElementById('hzClock'), LAST_MANIFEST);
}, 30000);

onRefresh(render);
</script>
