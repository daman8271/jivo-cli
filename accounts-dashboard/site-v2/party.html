<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party · JIVO Accounts</title>
<script>(function(){var t;try{t=localStorage.getItem('jivo-theme')}catch(e){}
 document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')})();</script>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="assets/board.css">
</head><body>
<div id="shell"></div>
<main class="wrap" id="main"><div class="empty" id="boot">Loading SAP data…</div></main>
<div class="wrap"><footer id="foot"></footer></div>

<script type="module">
/* ───────────────────────────────────────────────────────────────────────────
   party.html — ONE customer or vendor, taken apart.

   The board's other pages answer "how much". This one answers "why is the
   number not what SAP says". Everything here hangs off one identity:
   ?co=<oil|mart|bev>&card=<CardCode>.

   Sources, all read through core.js (never fetched directly):
     parties.<co>.json            the directory: name, group, side, kind, balance
     vendor-ageing.<co>.json      summary — ONE row per vendor card
     customer-ageing.<co>.json    detail  — ONE row per customer card
     open-item-list.<co>.json     summary — one row per OPEN DOCUMENT, but only
                                  a TOP-N SLICE per doctype (see §6 below)
     derivations.<co>.json        the caveat records, read live, never retyped
   ─────────────────────────────────────────────────────────────────────────── */

import {
  shell, crumb, table, empty, kpiRow,
  company, companyLabel, manifest, parties, slice, derivations,
  money, moneyFull, num, pct, scale, esc, ago,
  hrefParty, hrefSection, hrefDerivation, hrefCaveat,
  onRefresh
} from './assets/core.js';
import * as charts from './assets/charts.js';

/* ══ small helpers ═══════════════════════════════════════════════════════ */

const MAIN = document.getElementById('main');

/** Build one element from HTML. */
function el(html) {
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

/** ?name from the query string. */
function qs(name) {
  try { return new URLSearchParams(window.location.search).get(name); }
  catch (e) { return null; }
}

/**
 * One cell of a source table, lifted to rupees by its own column suffix
 * (CONTRACT §4) BEFORE anything is added to anything else. Returns null —
 * never 0 — when the column is absent or unusable, so the caller can say
 * "not computed" instead of printing a confident zero.
 */
function V(row, col) {
  if (!row) return null;
  const raw = row[col];
  if (raw === null || raw === undefined || raw === '') return null;
  const n = scale(raw, col);
  return (typeof n === 'number' && isFinite(n)) ? n : null;
}

/** An integer count from a source column; null when absent. */
function N(row, col) {
  if (!row) return null;
  const raw = row[col];
  if (raw === null || raw === undefined || raw === '') return null;
  const n = Number(raw);
  return isFinite(n) ? n : null;
}

/** The "never a confident zero" inline marker. */
function nc(why) {
  return '<span class="nc" title="' + esc(why) + '">not computed</span>';
}

/** Money as HTML: abbreviated for reading, exact in the tooltip. */
function m(n, why) {
  const s = money(n);
  if (s === null) return nc(why || 'this column was not in the source row');
  const full = moneyFull(n);
  return '<span title="' + esc(full === null ? s : full) + '">' + esc(s) + '</span>';
}

/** A .card frame with its head and its source line. */
function card(title, src) {
  const c = el('<section class="card"></section>');
  c.appendChild(el(
    '<div class="card-head"><h2>' + esc(title) + '</h2>' +
    (src ? '<div class="src">' + esc(src) + '</div>' : '') + '</div>'));
  return c;
}

/** A paragraph of plain English under a card head. */
function blurb(html) { return el('<p class="blurb">' + html + '</p>'); }

/**
 * A grid of small facts. An item with `value:null` renders "not computed"
 * plus its reason — it is NEVER dropped and never becomes a zero.
 */
function facts(items) {
  const host = el('<div class="minikpis"></div>');
  items.forEach(function (it) {
    if (!it) return;
    const val = (it.value === null || it.value === undefined)
      ? nc(it.why || 'not present in this row')
      : it.value;
    host.appendChild(el(
      '<div class="mk"><div class="lab">' + esc(it.label) + '</div>' +
      '<div class="val' + (it.tone ? ' ' + it.tone : '') + '">' + val + '</div>' +
      (it.sub ? '<div class="sub">' + it.sub + '</div>' : '') + '</div>'));
  });
  return host;
}

/** A link to a correction's entry in methodology.html. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}

const FMT = function (v) { const s = money(v); return s === null ? '—' : s; };

/* ══ vocabulary — SAP column names in plain English ══════════════════════ */

const DOCTYPE_LABEL = {
  AR_INV: 'Invoice to customer',
  AP_INV: 'Bill from vendor',
  AR_RCT: 'Money received',
  AP_PMT: 'Money paid out',
  AR_CN:  'Credit note issued',
  AP_CN:  'Credit note received'
};
const DOCTYPE_SIDE = { AR_INV: 'C', AR_RCT: 'C', AR_CN: 'C', AP_INV: 'V', AP_PMT: 'V', AP_CN: 'V' };
const BUCKET_LABEL = {
  '0_NOTDUE': 'Not due', '1_1-30': '1–30 d', '2_31-60': '31–60 d', '3_61-90': '61–90 d',
  '4_91-180': '91–180 d', '5_181-365': '181–365 d', '6_365+': '365 d +'
};
const RECON_LABEL = {
  NONE: 'Never matched', PARTIAL: 'Part-matched', FULL_PER_OITR: 'Matched in OITR'
};
const AGE_KEYS = ['B0_NOTDUE', 'B1_1_30', 'B2_31_60', 'B3_61_90', 'B4_91_180', 'B5_181_365', 'B6_365PLUS'];
const AGE_WORDS = {
  B0_NOTDUE: 'Not due yet', B1_1_30: 'Overdue 1–30 days', B2_31_60: 'Overdue 31–60 days',
  B3_61_90: 'Overdue 61–90 days', B4_91_180: 'Overdue 91–180 days',
  B5_181_365: 'Overdue 181–365 days', B6_365PLUS: 'Overdue more than a year'
};

/** What each non-TRADE account kind actually is, and what it is kept out of. */
const KIND_NOTE = {
  BRANCH: {
    what: 'JIVO’s own state GST registration.',
    why: 'SAP carries each registration as a business partner so stock moving between ' +
         'JIVO’s own states can be invoiced. The balance on this card is JIVO’s money ' +
         'sitting on JIVO’s other side of the same books — it is not trade, and nobody ' +
         'outside JIVO owes or is owed any part of it.',
    codes: ['C-0005', 'C-0020']
  },
  INTERCO: {
    what: 'Another company inside the JIVO group.',
    why: 'Counting it as trade books JIVO’s own money as outside business. There are 23 ' +
         'related-party customer cards across the three companies, and on the vendor side ' +
         'several of them sit inside ordinary trading groups where a group-name test misses them.',
    codes: ['C-0005', 'C-0020']
  },
  STAFF: {
    what: 'An employee imprest card, not a trading party.',
    why: 'The balance is cash floated to a person and settled against their expense claims. ' +
         'It is a staff advance, never a receivable from a customer or a payable to a supplier.',
    codes: []
  }
};

/* ══ page ════════════════════════════════════════════════════════════════ */

shell({ title: 'Party', subtitle: 'One customer or vendor, taken apart' });
render();
onRefresh(render);

async function render() {
  const co = company();
  const wanted = String(qs('card') || '').trim();
  const cardCode = wanted.toUpperCase();

  MAIN.innerHTML = '';
  MAIN.appendChild(el('<div class="empty">Reading SAP data…</div>'));

  /* No card at all — say so, do not render a blank page. */
  if (!cardCode) {
    const m0 = await manifest().catch(function () { return null; });
    MAIN.innerHTML = '';
    MAIN.appendChild(crumb([
      { label: 'Board', href: 'index.html?co=' + encodeURIComponent(co) },
      { label: 'Party' }
    ]));
    MAIN.appendChild(empty({
      what: 'No account was asked for.',
      why: 'This page needs a CardCode: party.html?co=' + co + '&card=<CardCode>. ' +
           'Nothing was passed in ?card=, so there is nothing to look up.',
      hint: 'Every party name and code on this board links here. Search for one by name or code.',
      href: 'search.html?co=' + encodeURIComponent(co),
      hrefLabel: 'Search every party in ' + companyLabel(co)
    }));
    paintFoot(co, m0);
    return;
  }

  const [man, plist, vend, cust, oi, derivs] = await Promise.all([
    manifest().catch(function () { return null; }),
    parties(co),
    slice('vendor-ageing', co),
    slice('customer-ageing', co),
    slice('open-item-list', co),
    derivations(co).catch(function () { return {}; })
  ]);

  const dir = (plist || []).find(function (p) {
    return String(p && p.card || '').toUpperCase() === cardCode;
  }) || null;

  const vRow = (vend.summary || []).find(function (r) {
    return String(r.CARD_CODE || '').toUpperCase() === cardCode;
  }) || null;
  const cRow = (cust.detail || []).find(function (r) {
    return String(r.CARD_CODE || '').toUpperCase() === cardCode;
  }) || null;

  const docs = (oi.summary || []).filter(function (r) {
    return String(r.CARD_CODE || '').toUpperCase() === cardCode;
  });

  MAIN.innerHTML = '';

  /* Nothing anywhere — name every place that was searched. */
  if (!dir && !vRow && !cRow && !docs.length) {
    MAIN.appendChild(crumb([
      { label: 'Board', href: 'index.html?co=' + encodeURIComponent(co) },
      { label: 'Party' }
    ]));
    MAIN.appendChild(await notFound(cardCode, co, plist, vend, cust, oi));
    paintFoot(co, man);
    return;
  }

  /* ── who this is ─────────────────────────────────────────────────────── */
  const age = vRow || cRow;                      // the ageing row, either side
  const side = vRow ? 'V' : (cRow ? 'C' : (dir ? dir.side : sideFromDocs(docs)));
  const isV = side === 'V';
  const name = (dir && dir.name) || (age && age.CARD_NAME) ||
               (docs.length && docs[0].CARD_NAME) || cardCode;
  const group = (dir && dir.group) ||
                (age && (age.VENDOR_GROUP || age.CUSTOMER_GROUP)) ||
                (docs.length && docs[0].BP_GROUP) || null;
  const dirKind = dir ? String(dir.kind || '').toUpperCase() : null;
  const ageKind = age ? String(age.ACCT_KIND || '').toUpperCase() : null;
  const kind = dirKind || ageKind;
  const excluded = age ? (Number(age.IS_EXCLUDED) === 1) : null;
  const section = isV ? 'vendor-ageing' : 'customer-ageing';

  shell({
    title: name,
    subtitle: (isV ? 'Vendor' : 'Customer') + ' · ' + cardCode + ' · ' + companyLabel(co),
    section: section
  });

  MAIN.appendChild(crumb([
    { label: 'Board', href: 'index.html?co=' + encodeURIComponent(co) },
    { label: isV ? 'Payables' : 'Receivables', href: hrefSection(section, co) },
    { label: name }
  ]));

  MAIN.appendChild(identityCard({
    cardCode, name, group, side, kind, dirKind, ageKind, excluded, dir, age, docs, co
  }));

  /* ── the waterfall: SAP's number, then every step to the truth ───────── */
  MAIN.appendChild(waterfallCard(age, isV, cardCode, co));

  /* ── ledger vs documents, with the gap named ─────────────────────────── */
  MAIN.appendChild(ledgerCard(age, dir, isV, co));

  /* ── ageing ──────────────────────────────────────────────────────────── */
  MAIN.appendChild(ageingCard(age, isV));

  /* ── the plain-English facts ─────────────────────────────────────────── */
  MAIN.appendChild(factsCard(age, isV, co));

  /* ── every open document we hold for this card ───────────────────────── */
  MAIN.appendChild(docsCard(docs, oi, age, isV, co, cardCode));

  /* ── money that exists but was never matched to a document ───────────── */
  MAIN.appendChild(unappliedCard(age, isV, docs));

  /* ── which corrections touch this party ──────────────────────────────── */
  MAIN.appendChild(caveatCard(derivs, { isV, kind, dirKind, ageKind, name, docs }));

  paintFoot(co, man);
}

/** Best guess at the side when only documents exist. */
function sideFromDocs(docs) {
  if (!docs.length) return 'C';
  const t = String(docs[0].CARD_TYPE || '').toUpperCase();
  if (t === 'S') return 'V';
  if (t === 'C') return 'C';
  return String(docs[0].SIDE || '') === 'AP' ? 'V' : 'C';
}

/* ══ 0. the card code did not resolve ════════════════════════════════════ */

async function notFound(cardCode, co, plist, vend, cust, oi) {
  const host = document.createElement('div');

  const searched =
    'Searched for ' + cardCode + ' in ' + companyLabel(co) + ': the party directory (' +
    num((plist || []).length) + ' cards), vendor ageing (' + num((vend.summary || []).length) +
    ' vendors), customer ageing (' + num((cust.detail || []).length) + ' customers) and the ' +
    'open-item list (' + num((oi.summary || []).length) + ' open documents). It is in none of them.';

  /* It may simply be in another company's book — that is worth saying. */
  let elsewhere = [];
  try {
    const others = ['oil', 'mart', 'bev'].filter(function (k) { return k !== co; });
    const lists = await Promise.all(others.map(function (k) { return parties(k); }));
    lists.forEach(function (list, i) {
      const hit = (list || []).find(function (p) {
        return String(p && p.card || '').toUpperCase() === cardCode;
      });
      if (hit) elsewhere.push({ co: others[i], name: hit.name });
    });
  } catch (e) { elsewhere = []; }

  host.appendChild(empty({
    what: 'No account ' + cardCode + ' in ' + companyLabel(co) + '.',
    why: searched,
    hint: elsewhere.length
      ? 'It does exist in ' + elsewhere.map(function (x) { return companyLabel(x.co); }).join(' and ') +
        ' — the three companies keep separate books and separate CardCodes.'
      : 'Check the code, or search by name — a party can hold several cards ' +
        '(a customer card and a staff imprest vendor card are different accounts).',
    href: 'search.html?co=' + encodeURIComponent(co) + '&q=' + encodeURIComponent(cardCode),
    hrefLabel: 'Search for “' + cardCode + '”'
  }));

  if (elsewhere.length) {
    const links = el('<div class="chips" style="margin-top:12px"></div>');
    elsewhere.forEach(function (x) {
      links.appendChild(el('<a class="chip" href="' + esc(hrefParty(cardCode, x.co)) + '">' +
        esc(x.name) + ' · ' + esc(companyLabel(x.co)) + '</a>'));
    });
    host.appendChild(links);
  }
  return host;
}

/* ══ 1. identity ═════════════════════════════════════════════════════════ */

function identityCard(o) {
  const c = card('Who this account is', 'parties.' + o.co + '.json · ' +
    (o.side === 'V' ? 'vendor-ageing' : 'customer-ageing') + '.' + o.co + '.json');

  const bal = o.dir ? V(o.dir, 'balance') : (o.age ? V(o.age, 'OCRD_BALANCE') : null);
  const balWord = bal === null ? null
    : (bal > 0 ? 'DEBIT — they owe JIVO, or JIVO is holding an advance with them'
      : bal < 0 ? 'CREDIT — JIVO owes them'
        : 'square — the ledger nets to nothing');

  const kv = el('<dl class="kv"></dl>');
  function row(k, v) {
    kv.appendChild(el('<div><dt>' + esc(k) + '</dt><dd>' + v + '</dd></div>'));
  }
  row('Card code', '<span class="badge">' + esc(o.cardCode) + '</span>');
  row('Name', '<span class="brk">' + esc(o.name) + '</span>');
  row('Side of the book', o.side === 'V'
    ? 'Vendor — JIVO buys from them'
    : 'Customer — JIVO sells to them');
  row('SAP business-partner group', o.group ? '<span class="brk">' + esc(o.group) + '</span>'
    : nc('no group on the directory row or the ageing row'));
  row('Account kind', kindPill(o.kind) + (o.kind === 'TRADE'
    ? ' <span class="muted">an outside party</span>' : ''));
  row('Ledger balance · OCRD.Balance',
    (bal === null ? nc('no balance on the directory row') : m(bal)) +
    (balWord ? '<div class="sub muted" style="font-weight:400;font-size:12px;margin-top:3px">' +
      esc(balWord) + '</div>' : ''));
  c.appendChild(kv);

  /* NOT TRADE — say it loudly, and say what it is kept out of. */
  const note = KIND_NOTE[o.kind];
  if (note) {
    const box = el('<div class="excl" style="margin-top:14px"></div>');
    box.appendChild(el('<h3>Not a trade account — ' + (o.excluded === false
      ? 'and yet it was NOT excluded'
      : 'excluded from every trade headline') + '</h3>'));
    box.appendChild(el('<div class="excl-row"><div class="lab">' + esc(o.kind) + ' — ' +
      esc(note.what) + '</div><div class="amt" title="ADJ_OPEN — the per-card figure the trade ' +
      'headline sums over TRADE cards">' +
      (o.age ? m(V(o.age, 'ADJ_OPEN'), 'no ageing row') : nc('no ageing row for this card')) +
      '</div><div class="why">' + note.why +
      (note.codes.length ? ' ' + note.codes.map(cv).join(' ') : '') + '</div></div>'));
    box.appendChild(el('<div class="excl-row"><div class="lab">' +
      (o.excluded === false ? 'Where this SHOULD be kept out' : 'Where this is kept out') +
      '</div><div class="amt"></div><div class="why">Both trade headlines — ' +
      '<a href="' + esc(hrefDerivation('ar-trade-open', o.co)) + '">customers owe JIVO</a> and ' +
      '<a href="' + esc(hrefDerivation('ap-trade-open', o.co)) + '">JIVO owes its suppliers</a> — ' +
      'are summed over TRADE cards only. This account still appears in the whole-book totals ' +
      '(<a href="' + esc(hrefDerivation(o.side === 'V' ? 'ap-book-open' : 'ar-book-open-total', o.co)) +
      '">book open</a>), where it belongs.</div></div>'));
    c.appendChild(box);
  } else if (o.kind === 'TRADE') {
    c.appendChild(el('<p class="blurb" style="margin-top:12px">An outside party. This account ' +
      'IS inside the trade headline on <a href="' + esc(hrefSection(
        o.side === 'V' ? 'vendor-ageing' : 'customer-ageing', o.co)) + '">' +
      (o.side === 'V' ? 'Payables' : 'Receivables') + '</a>.</p>'));
  }

  /* The directory and the ageing SQL do not always agree about what this is. */
  if (o.dirKind && o.ageKind && o.dirKind !== o.ageKind) {
    c.appendChild(el('<div class="caveat"><b>The two sources disagree about what this account is.</b> ' +
      'The party directory calls it <b>' + esc(o.dirKind) + '</b>; the ageing query classified it as <b>' +
      esc(o.ageKind) + '</b>. What actually happened is settled by the ageing row’s own exclusion flag: ' +
      'this card was <b>' + (o.excluded ? 'EXCLUDED from' : 'COUNTED INSIDE') + '</b> the trade headline ' +
      'for ' + (o.side === 'V' ? 'payables' : 'receivables') + '. ' +
      (o.excluded ? '' : 'So its balance is sitting in a figure the directory says it should not be in. ') +
      'Treat the headline as ' + (o.excluded ? 'correct here' : 'overstated by this card’s share') +
      ' until the classification is reconciled. ' + cv('C-0020') + '</div>'));
  } else if (o.age && o.kind === 'TRADE' && o.excluded === true) {
    c.appendChild(el('<div class="caveat"><b>Classified TRADE but excluded anyway.</b> ' +
      'The ageing query set IS_EXCLUDED on this card, so it is NOT in the trade headline ' +
      'even though nothing here says it is a group or staff account. ' + cv('C-0020') + '</div>'));
  }

  /* Where this card sits in the company total. */
  if (o.age) {
    const adj = V(o.age, 'ADJ_OPEN');
    const coTrade = V(o.age, 'CO_ADJ_OPEN_TRADE');
    const coBook = V(o.age, 'CO_ADJ_OPEN');
    const kpiTrade = o.side === 'V' ? 'ap-trade-open' : 'ar-trade-open';
    const kpiBook = o.side === 'V' ? 'ap-book-open' : 'ar-book-open-total';
    const inTrade = o.excluded === false;
    const denom = inTrade ? coTrade : coBook;
    const kpi = inTrade ? kpiTrade : kpiBook;
    if (adj !== null && denom) {
      c.appendChild(el('<p class="tnote">This account is <b data-k="' + esc(kpi) + '">' +
        esc(pct(adj, denom)) + '</b> of the ' + m(denom) + ' ' +
        (inTrade
          ? (o.side === 'V' ? 'JIVO owes its <b>trade</b> vendors' : 'JIVO’s <b>trade</b> customers owe it')
          : (o.side === 'V' ? 'open across the <b>whole</b> purchase book' : 'open across the <b>whole</b> sales book')) +
        ' — <a href="' + esc(hrefDerivation(kpi, o.co)) + '">see how that total is built</a>.</p>'));
    }
  }

  return c;
}

function kindPill(kind) {
  const tone = kind === 'TRADE' ? 'ok' : (kind === 'STAFF' ? 'dead' : 'info');
  return '<span class="pill ' + tone + '">' + esc(kind || 'UNKNOWN') + '</span>';
}

/* ══ 2. the waterfall ════════════════════════════════════════════════════ */

function waterfallCard(age, isV, cardCode, co) {
  const c = card('SAP says one number. Here is every step to the real one.',
    (isV ? 'vendor-ageing' : 'customer-ageing') + '.' + co + '.json · RAW_OPEN → CREDIT_APPLIED → ADJ_OPEN');

  if (!age) {
    c.appendChild(empty({
      what: 'No ageing row for ' + cardCode + '.',
      why: 'This card is in the party directory but the ' + (isV ? 'vendor' : 'customer') +
           '-ageing query returned no row for it, so there is nothing to take apart. ' +
           'That normally means the card has never carried an open document or a balance.',
      hint: 'The open documents below (if any) are read from a different query and are still shown.'
    }));
    return c;
  }

  const raw = V(age, 'RAW_OPEN');
  const applied = V(age, 'CREDIT_APPLIED');
  const adj = V(age, 'ADJ_OPEN');
  const unbacked = V(age, 'UNBACKED_CREDIT');
  const ledger = V(age, isV ? 'PAYABLE' : 'RECEIVABLE');
  const advance = V(age, isV ? 'VENDOR_ADVANCE' : 'CUSTOMER_ADVANCE');

  const any = [raw, applied, unbacked, ledger].some(function (x) { return x !== null && x !== 0; });
  if (!any) {
    c.appendChild(empty({
      what: 'Nothing is open on this account.',
      why: 'Every step of the correction is nil for this card: no open ' +
           (isV ? 'bills' : 'invoices') + ', no credit applied, no unbacked credit, and the ledger ' +
           'shows nothing ' + (isV ? 'payable' : 'receivable') + '. There is no gap to draw.' +
           (advance ? ' The one live figure is the advance below.' : ''),
      hint: advance
        ? (isV ? 'JIVO is holding an advance with this vendor of ' : 'This customer is in advance by ') +
          (money(advance) || '—') + '.'
        : 'A blank waterfall here is a real nil, not a missing number.'
    }));
    if (advance) c.appendChild(advanceNote(advance, isV));
    return c;
  }

  c.appendChild(blurb(
    'SAP calls a document “open” until someone reconciles it inside SAP. At JIVO that ' +
    'reconciliation mostly never happens — settlements go in as journal entries and as ' +
    'on-account receipts and payments that are never matched to the document. So the open-document ' +
    'total is the wrong number, and this is the arithmetic that turns it into the right one. ' + cv('C-0019')));

  /* The steps keep a constant shape from party to party so two accounts can be
     read against each other; a step that came out nil says so in its own label,
     because a zero on a "deduction" row is otherwise easy to misread. */
  const steps = [
    { label: isV ? 'Bills SAP still calls open' : 'Invoices SAP still calls open',
      value: raw === null ? 0 : raw, kind: 'base' },
    { label: 'Credit the ledger proves was already given' + (applied ? '' : ' — none'),
      value: applied === null ? 0 : applied, kind: 'sub' },
    { label: 'Open after that credit', value: adj === null ? 0 : adj, kind: 'total' },
    { label: (isV ? 'Owed with no open bill behind it' : 'Owed with no open invoice behind it') +
        (unbacked ? '' : ' — none'),
      value: unbacked === null ? 0 : unbacked, kind: 'add' },
    { label: isV ? 'What the ledger says JIVO owes' : 'What the ledger says they owe',
      value: ledger === null ? 0 : ledger, kind: 'total' }
  ];

  c.appendChild(charts.waterfall(steps, {
    format: FMT,
    ariaLabel: 'From the open-document total to the ledger position for ' + cardCode,
    note: 'The two “=” rows are checkpoints, not new numbers: RAW_OPEN − CREDIT_APPLIED = ' +
          'ADJ_OPEN, and ADJ_OPEN + UNBACKED_CREDIT = ' + (isV ? 'PAYABLE' : 'RECEIVABLE') +
          '. Both identities hold on every card in all three books. Note what CREDIT_APPLIED ' +
          'actually is: it is DERIVED from the ledger — RAW_OPEN minus the ledger position, ' +
          'floored at zero — not read off receipts matched to documents inside SAP. ' +
          'Equivalently ADJ_OPEN = min(RAW_OPEN, ' + (isV ? 'PAYABLE' : 'RECEIVABLE') + ').'
  }));

  /* Say in words what each step was — including the ones that came out nil. */
  const said = [];
  if (raw !== null && ledger !== null && ledger > 0 && raw > ledger * 1.005) {
    said.push('<b>SAP’s open-document total overstates this account by ' +
      m(raw - ledger) + ' (' + (raw / ledger).toFixed(2) + '×).</b>');
  } else if (raw !== null && ledger !== null && Math.abs(raw - ledger) <= Math.max(1, ledger * 0.005)) {
    said.push('<b>For this account the open documents and the ledger agree.</b> ' +
      'That is the exception on these books, not the rule.');
  }
  if (raw !== null && ledger !== null && ledger === 0 && raw > 0) {
    said.push('<b>The ledger says nothing is owed here at all, yet SAP still shows ' + m(raw) +
      ' of open ' + (isV ? 'bills' : 'invoices') + '.</b> Every rupee of that open-document total ' +
      'is stale — this account is settled.');
  }
  if (applied === 0) said.push('The ledger backs the open documents in full, so no credit had to be ' +
    'taken off them.');
  if (unbacked === 0) said.push('Nothing is owed here without a document behind it.');
  else if (unbacked) {
    said.push(m(unbacked) + ' of the ledger position has <b>no open document explaining it</b> — ' +
      'it was posted as a journal entry, or as a receipt/payment SAP never matched to anything, ' +
      'so it cannot be aged.');
  }
  if (said.length) c.appendChild(el('<p class="tnote">' + said.join(' ') + '</p>'));
  if (advance) c.appendChild(advanceNote(advance, isV));

  return c;
}

function advanceNote(advance, isV) {
  return el('<div class="caveat"><b>' + (isV
    ? 'JIVO is in advance with this vendor: ' : 'This customer is in advance: ') + m(advance) +
    '.</b> The ledger sits on the opposite side to the documents — ' + (isV
      ? 'JIVO has paid ahead of the bills raised, so nothing here is a payable.'
      : 'they have paid ahead of the invoices raised, so nothing here is a receivable.') +
    ' It is a ' + (isV ? 'VENDOR_ADVANCE' : 'CUSTOMER_ADVANCE') + ', and it is deliberately not ' +
    'in the waterfall above: an advance is not a step between the open documents and the exposure, ' +
    'it is the other side of the account.</div>');
}

/* ══ 3. the ledger beside the documents, gap named ═══════════════════════ */

function ledgerCard(age, dir, isV, co) {
  const c = card('The ledger, beside what the documents say',
    'OCRD.Balance vs the open-document extract');

  const ocrd = age ? V(age, 'OCRD_BALANCE') : (dir ? V(dir, 'balance') : null);
  if (ocrd === null && !age) {
    c.appendChild(empty({
      what: 'No ledger balance for this card.',
      why: 'Neither the party directory nor the ageing query returned OCRD.Balance for it, ' +
           'so the ground-truth figure is missing and there is nothing to compare against.'
    }));
    return c;
  }

  const adj = age ? V(age, 'ADJ_OPEN') : null;
  const raw = age ? V(age, 'RAW_OPEN') : null;
  const ledger = age ? V(age, isV ? 'PAYABLE' : 'RECEIVABLE') : null;
  const gap = (ledger !== null && adj !== null) ? (ledger - adj) : null;

  c.appendChild(blurb(
    '<b>OCRD.Balance is the ground truth for what this party owes or is owed.</b> The document ' +
    'extract is not — a document at JIVO stays open long after the money moved. Where the two ' +
    'disagree, the ledger wins and the gap has a name. ' +
    '<a href="' + esc(hrefCaveat('C-0019')) + '">Read C-0019</a>.'));

  const rows = [
    { label: 'SAP’s open documents say', value: raw, why: 'RAW_OPEN missing on this row',
      sub: 'RAW_OPEN — every ' + (isV ? 'bill' : 'invoice') + ' still flagged open, uncapped' },
    { label: 'After the credit the ledger implies', value: adj, why: 'ADJ_OPEN missing on this row',
      sub: 'ADJ_OPEN = min(RAW_OPEN, ' + (isV ? 'PAYABLE' : 'RECEIVABLE') +
           ') — what the ageing buckets below add up to' },
    { label: 'The ledger says', value: ledger, why: 'no ledger figure on this row',
      sub: (isV ? 'PAYABLE' : 'RECEIVABLE') + ' — the ' + (isV ? 'credit' : 'debit') +
           ' side of OCRD.Balance, and the number to act on' }
  ];

  c.appendChild(facts(rows.map(function (r) {
    return {
      label: r.label,
      value: r.value === null ? null : m(r.value),
      why: r.why,
      sub: '<span class="mono">' + esc(r.sub) + '</span>'
    };
  })));

  /* Name the gap. */
  if (gap === null) {
    c.appendChild(empty({
      what: 'The gap between the two could not be measured.',
      why: 'One of ADJ_OPEN / ' + (isV ? 'PAYABLE' : 'RECEIVABLE') + ' is missing from this row, ' +
           'so subtracting them would invent a number.'
    }));
  } else if (Math.abs(gap) < 1) {
    c.appendChild(el('<p class="tnote"><b>No gap.</b> The ledger and the credit-adjusted documents ' +
      'agree to the rupee on this card, so every rupee of the exposure can be pointed at a document ' +
      'and aged. Across the book that is unusual — the whole-book gap is ' +
      '<a href="' + esc(hrefDerivation(isV ? 'ap-unbacked-credit' : 'ar-trade-unbacked-debit', co)) +
      '">measured here</a>.</p>'));
  } else {
    c.appendChild(el('<div class="caveat"><b>The gap: ' + m(gap) + '.</b> ' +
      'The ledger says ' + m(ledger) + ' but only ' + m(adj) + ' of it can be pointed at an open ' +
      (isV ? 'bill' : 'invoice') + '. The remainder — <span class="mono">UNBACKED_CREDIT</span> — ' +
      'came in as a journal entry or as an unmatched on-account ' +
      (isV ? 'payment' : 'receipt') + ', so it exists in the balance but cannot be aged and does not ' +
      'appear in any bucket below. ' + cv('C-0019') + ' ' +
      '<a href="' + esc(hrefDerivation(isV ? 'ap-unbacked-credit' : 'ar-trade-unbacked-debit', co)) +
      '">The same gap, company-wide</a>.</div>'));
  }

  /* The naive overstatement, stated as a multiple. */
  if (raw !== null && ledger !== null && ledger > 0) {
    const mult = raw / ledger;
    if (mult > 1.005) {
      c.appendChild(el('<p class="tnote">Read naively — “sum the open documents” — this account ' +
        'would be reported at ' + m(raw) + ' instead of ' + m(ledger) + '. That is <b>' +
        mult.toFixed(2) + '×</b> the real exposure. Company-wide the same naive read overstates ' +
        'by 1.3× to 7.5×, which is exactly why this board does not use it.</p>'));
    }
  }

  return c;
}

/* ══ 4. ageing ═══════════════════════════════════════════════════════════ */

function ageingCard(age, isV) {
  const c = card('How old the exposure is', 'B0_NOTDUE … B6_365PLUS');

  if (!age) {
    c.appendChild(empty({
      what: 'No ageing row, so no buckets.',
      why: 'The ' + (isV ? 'vendor' : 'customer') + '-ageing query returned no row for this card. ' +
           'Buckets are only meaningful against that row’s ADJ_OPEN.'
    }));
    return c;
  }

  const vals = AGE_KEYS.map(function (k) { return V(age, k); });
  const known = vals.filter(function (x) { return x !== null; });
  const total = known.reduce(function (a, b) { return a + b; }, 0);

  if (!known.length) {
    c.appendChild(empty({
      what: 'The bucket columns are missing from this row.',
      why: 'None of ' + AGE_KEYS.join(', ') + ' was present, so there is nothing to stack.'
    }));
    return c;
  }
  if (total === 0) {
    const unbacked = V(age, 'UNBACKED_CREDIT');
    c.appendChild(empty({
      what: 'Every ageing bucket is nil on this account.',
      why: 'Nothing is open against a document, so there is nothing to age. This is a real nil: ' +
           'all seven buckets returned 0, they were not missing.',
      hint: unbacked
        ? 'The ' + (money(unbacked) || '') + ' the ledger shows is unbacked credit — by ' +
          'definition it has no document and therefore no due date, so it can never appear in a bucket.'
        : 'The ledger agrees: nothing outstanding either way.'
    }));
    return c;
  }

  c.appendChild(blurb(
    'Buckets are cut on the <b>due</b> date, not the document date, and they add up to ADJ_OPEN — ' +
    'the credit-adjusted figure, not SAP’s raw open total. “Not due” is drawn as a state (green), ' +
    'not as the mildest step of the overdue ramp.'));

  c.appendChild(charts.stackedBars(age, {
    keys: AGE_KEYS,
    format: FMT,
    labelKey: 'CARD_NAME',
    ariaLabel: 'Ageing buckets for ' + (age.CARD_NAME || age.CARD_CODE),
    tableNote: 'Every bucket in rupees. The stack totals ADJ_OPEN.'
  }));

  /* Every bucket, in words, with its value — no reliance on the ramp. */
  const grid = facts(AGE_KEYS.map(function (k, i) {
    return {
      label: AGE_WORDS[k],
      value: vals[i] === null ? null : m(vals[i]),
      why: k + ' was not on this row',
      tone: (vals[i] && (k === 'B5_181_365' || k === 'B6_365PLUS')) ? 'bad' : '',
      sub: vals[i] === null ? '' : '<span class="mono">' + esc(k) + '</span> · ' +
           esc(pct(vals[i], total)) + ' of the open amount'
    };
  }));
  c.appendChild(grid);

  const old = (V(age, 'B5_181_365') || 0) + (V(age, 'B6_365PLUS') || 0);
  const over60 = V(age, 'ADJ_OVERDUE_60PLUS');
  const bits = [];
  if (over60 !== null) {
    bits.push('<b>' + m(over60) + '</b> of this is more than 60 days overdue (' +
      esc(pct(over60, total)) + ' of the open amount) — the cut this board uses for ' +
      (isV ? 'a bill that should have been paid' : 'a debt that has stopped behaving'));
  }
  if (old > 0) {
    bits.push('<b>' + m(old) + '</b> has been outstanding more than six months');
  }
  if (bits.length) c.appendChild(el('<p class="tnote">' + bits.join('. ') + '.</p>'));

  return c;
}

/* ══ 5. the plain-English facts ══════════════════════════════════════════ */

function factsCard(age, isV, co) {
  const c = card('The facts, in words', (isV ? 'vendor-ageing' : 'customer-ageing') + '.' + co + '.json');

  if (!age) {
    c.appendChild(empty({
      what: 'No ageing row, so none of these facts exist.',
      why: 'Oldest due date, document counts, go-live carry-over and backdated dues all come ' +
           'from the ' + (isV ? 'vendor' : 'customer') + '-ageing row, and this card has none.'
    }));
    return c;
  }

  const oldest = age.OLDEST_DUE || null;
  const days = N(age, 'DAYS_OLDEST');
  const nOpen = N(age, isV ? 'N_OPEN_BILLS' : 'N_OPEN_INV');
  const migrated = V(age, 'MIGRATED_OPEN');
  const backdated = V(age, 'BACKDATED_DUE_OPEN');
  const adj = V(age, 'ADJ_OPEN');

  c.appendChild(facts([
    {
      label: 'Oldest thing still unpaid',
      value: oldest ? '<span class="mono">' + esc(oldest) + '</span>' : null,
      why: 'OLDEST_DUE is empty — nothing on this card has a due date still outstanding',
      sub: 'the earliest DUE date among the open documents'
    },
    {
      label: 'How long it has sat there',
      value: days === null ? null : esc(num(days)) + ' days',
      why: 'DAYS_OLDEST is empty, which goes with having nothing overdue',
      tone: (days !== null && days > 365) ? 'bad' : (days !== null && days > 90 ? 'warn' : ''),
      sub: days === null ? '' : (days > 365 ? 'more than a year' : 'as at the board’s as-of date')
    },
    {
      label: isV ? 'Open bills from them' : 'Open invoices to them',
      value: nOpen === null ? null : esc(num(nOpen)),
      why: (isV ? 'N_OPEN_BILLS' : 'N_OPEN_INV') + ' is missing from this row',
      sub: 'documents, not rupees — the list further down is a slice of these'
    },
    {
      label: 'Carried over from the old system',
      value: migrated === null ? null : m(migrated),
      why: 'MIGRATED_OPEN is missing from this row',
      tone: migrated ? 'warn' : '',
      sub: migrated
        ? 'go-live opening ' + (isV ? 'bills' : 'invoices') + ' still unpaid — never real trading ' +
          'documents, and ' + esc(pct(migrated, adj)) + ' of what is open here'
        : 'nothing on this card came from the migration'
    },
    {
      label: 'Due before it was raised',
      value: backdated === null ? null : m(backdated),
      why: 'BACKDATED_DUE_OPEN is missing from this row',
      tone: backdated ? 'warn' : '',
      sub: backdated
        ? 'open amount whose due date falls BEFORE its own document date — it lands in the oldest ' +
          'bucket on day one and makes the ageing look worse than the trading is'
        : 'every open document here is dated before its due date, as it should be'
    },
    {
      label: 'More than 60 days overdue',
      value: V(age, 'ADJ_OVERDUE_60PLUS') === null ? null : m(V(age, 'ADJ_OVERDUE_60PLUS')),
      why: 'ADJ_OVERDUE_60PLUS is missing from this row',
      tone: V(age, 'ADJ_OVERDUE_60PLUS') ? 'bad' : '',
      sub: 'the board’s cut for ' + (isV ? 'an overdue payable' : 'a debt that has stopped behaving')
    }
  ]));

  if (migrated) {
    c.appendChild(el('<p class="tnote">The migrated amount is a <b>go-live opening balance</b>, not ' +
      'a purchase or a sale. It was loaded on the cut-over date carrying its original due date, which ' +
      'is why it is both “carried over” and “due before it was raised”. ' +
      '<a href="' + esc(hrefDerivation(isV ? 'ap-migrated-open' : 'ar-migrated-open', co)) +
      '">The same figure, company-wide</a>.</p>'));
  }

  return c;
}

/* ══ 6. every open document we hold ══════════════════════════════════════ */

function docsCard(docs, oi, age, isV, co, cardCode) {
  const c = card('Every open document on this card', 'open-item-list.' + co + '.json');

  if (oi.error) {
    c.appendChild(empty({
      what: 'The open-item list could not be read.',
      why: String(oi.error)
    }));
    return c;
  }

  /* What the ageing row says SHOULD be here, doctype by doctype. */
  const expect = isV
    ? { AP_INV: 'N_OPEN_BILLS', AP_CN: 'N_OPEN_CN', AP_PMT: 'N_UNAPPLIED_PAY' }
    : { AR_INV: 'N_OPEN_INV', AR_CN: 'N_OPEN_CN', AR_RCT: 'N_UNAPPLIED_RCPT' };

  const shownBy = {};
  docs.forEach(function (r) {
    const k = String(r.DOCTYPE || '?');
    shownBy[k] = (shownBy[k] || 0) + 1;
  });

  const missing = [];      // doctypes where the slice is short
  const complete = [];     // doctypes proven complete
  let expectedTotal = 0, expectedKnown = false;
  Object.keys(expect).forEach(function (dt) {
    const want = age ? N(age, expect[dt]) : null;
    const got = shownBy[dt] || 0;
    if (want === null) return;
    expectedKnown = true;
    expectedTotal += want;
    if (want > got) missing.push({ dt: dt, want: want, got: got });
    else if (want > 0) complete.push({ dt: dt, want: want });
  });
  const crossSide = Object.keys(shownBy).filter(function (dt) {
    return DOCTYPE_SIDE[dt] && DOCTYPE_SIDE[dt] !== (isV ? 'V' : 'C');
  });

  if (!docs.length) {
    c.appendChild(empty({
      what: 'None of this card’s open documents are in the published list.',
      why: expectedKnown && expectedTotal > 0
        ? 'The ageing row says this card has ' + num(expectedTotal) + ' open document' +
          (expectedTotal === 1 ? '' : 's') + ', but the open-item list publishes only the largest ' +
          'few per document type across the whole company, and none of this card’s made the cut. ' +
          'This is a publishing limit, NOT a nil.'
        : 'The open-item list holds ' + num((oi.summary || []).length) + ' rows for ' +
          companyLabel(co) + ' and none of them is ' + cardCode + '. The list is a top-N slice per ' +
          'document type, so absence here does not prove the card has nothing open.',
      hint: 'The figures above come from the ageing query, which covers every document — they are ' +
            'unaffected by this slice.',
      href: hrefSection('open-item-list', co, { card: cardCode }),
      hrefLabel: 'Open the full open-item section'
    }));
    return c;
  }

  /* Truncation: say it before the table, not after. */
  if (missing.length) {
    c.appendChild(el('<div class="caveat"><b>This list is incomplete — ' + num(docs.length) +
      ' document' + (docs.length === 1 ? '' : 's') + ' shown of ' + num(expectedTotal) +
      ' this card has open.</b> The open-item list publishes only a top-N slice per document type ' +
      'for the whole company, so the biggest items are here and the rest are not: ' +
      missing.map(function (x) {
        return esc((DOCTYPE_LABEL[x.dt] || x.dt).toLowerCase()) + ' — ' + num(x.got) + ' of ' + num(x.want);
      }).join('; ') + '. <b>Do not total this table and call it the exposure</b>; the figures above ' +
      'come from the ageing query, which reads every document.</div>'));
  } else if (expectedKnown && complete.length) {
    c.appendChild(el('<p class="tnote"><b>This list is complete for this card.</b> The ageing row ' +
      'counts ' + num(expectedTotal) + ' open document' + (expectedTotal === 1 ? '' : 's') +
      ' and all ' + num(expectedTotal) + ' are here — the company-wide top-N slice did not cut ' +
      'anything off this account.</p>'));
  } else {
    c.appendChild(el('<p class="tnote">The open-item list is a <b>top-N slice per document type</b> ' +
      'across the whole company. This card has no count in the ageing row to check it against, so ' +
      'treat the list as possibly partial.</p>'));
  }

  if (crossSide.length) {
    c.appendChild(el('<div class="caveat">' + num(crossSide.reduce(function (a, dt) {
      return a + shownBy[dt];
    }, 0)) + ' document' + (crossSide.reduce(function (a, dt) { return a + shownBy[dt]; }, 0) === 1 ? '' : 's') +
      ' here are from the <b>other side of the book</b> (' +
      crossSide.map(function (dt) { return esc(DOCTYPE_LABEL[dt] || dt); }).join(', ') +
      ') sitting on a ' + (isV ? 'vendor' : 'customer') + ' card. That happens at JIVO and it is real, ' +
      'not a bug in this page — but the ' + (isV ? 'vendor' : 'customer') + '-ageing row has no count ' +
      'column for them, so their completeness cannot be checked.</div>'));
  }

  const anyFC = docs.some(function (r) { return String(r.CURRENCY || 'INR') !== 'INR'; });

  const rows = docs.map(function (r) {
    return {
      DOC_KIND: DOCTYPE_LABEL[r.DOCTYPE] || r.DOCTYPE,
      DOC_NUM: r.DOC_NUM,
      DOC_DATE: r.DOC_DATE,
      DUE_DATE: r.DUE_DATE,
      DAYS_OVERDUE: r.DAYS_OVERDUE,
      AGE_BUCKET: BUCKET_LABEL[r.AGE_BUCKET] || r.AGE_BUCKET,
      OPEN_AMT: r.OPEN_AMT,
      DOC_TOTAL: r.DOC_TOTAL,
      APPLIED: r.APPLIED,
      SIGNED_OPEN: r.SIGNED_OPEN,
      CURRENCY: r.CURRENCY,
      OPEN_AMT_FC: r.OPEN_AMT_FC,
      RECON_STATE: RECON_LABEL[r.RECON_STATE] || r.RECON_STATE,
      FROM_MIGRATION: Number(r.IS_MIGRATED) === 1 ? 'yes' : 'no',
      BPL_NAME: r.BPL_NAME,
      EXT_REF: r.EXT_REF,
      /* carried for the link, not displayed */
      OBJ_TYPE: r.OBJ_TYPE,
      DOC_ENTRY: r.DOC_ENTRY
    };
  });

  const cols = ['DOC_KIND', 'DOC_NUM', 'DOC_DATE', 'DUE_DATE', 'DAYS_OVERDUE', 'AGE_BUCKET',
    'OPEN_AMT', 'SIGNED_OPEN', 'DOC_TOTAL', 'APPLIED', 'RECON_STATE', 'FROM_MIGRATION',
    'BPL_NAME', 'EXT_REF'];
  if (anyFC) cols.splice(8, 0, 'CURRENCY', 'OPEN_AMT_FC');

  c.appendChild(table(rows, {
    co: co,
    cols: cols,
    labels: {
      DOC_KIND: 'Document', DOC_NUM: 'Number', DOC_DATE: 'Dated', DUE_DATE: 'Due',
      DAYS_OVERDUE: 'Days overdue', AGE_BUCKET: 'Bucket', OPEN_AMT: 'Still open',
      SIGNED_OPEN: 'Effect on the balance', DOC_TOTAL: 'Document total',
      APPLIED: 'Already applied', CURRENCY: 'Currency', OPEN_AMT_FC: 'Open (their currency)',
      RECON_STATE: 'Reconciled?', FROM_MIGRATION: 'From migration', BPL_NAME: 'Branch',
      EXT_REF: 'Their reference'
    },
    units: {
      OPEN_AMT: 'INR', SIGNED_OPEN: 'INR', DOC_TOTAL: 'INR', APPLIED: 'INR',
      OPEN_AMT_FC: 'count', DAYS_OVERDUE: 'days', DOC_NUM: 'code',
      AGE_BUCKET: 'text', RECON_STATE: 'text', DOC_KIND: 'text', FROM_MIGRATION: 'text'
    },
    links: { DOC_NUM: 'document', DOC_KIND: 'document' },
    sort: '-OPEN_AMT',
    filter: 'Filter these documents…',
    facets: ['DOC_KIND', 'AGE_BUCKET', 'RECON_STATE'],
    total: ['OPEN_AMT', 'SIGNED_OPEN'],
    caption: 'Open documents on ' + cardCode,
    empty: { what: 'No open documents in the published slice for this card.' },
    note: '“Still open” is the rupee amount SAP has not marked settled. “Effect on the balance” is ' +
          'the same amount signed the way it moves OCRD.Balance, so a receipt sitting unmatched ' +
          'pulls the other way from an invoice. “Reconciled?” reads OITR — “Never matched” is ' +
          'the normal state at JIVO and is exactly why the open-document total cannot be trusted. ' +
          (missing.length ? 'The total row covers only the rows shown, which is not this card’s exposure. '
                          : 'The total row covers every row shown. ') +
          (anyFC ? 'Some of these documents are not in rupees: the money columns are the rupee ' +
                   '(local) amount, and “Open (their currency)” is the same item in the currency ' +
                   'beside it — digit-grouped Indian-style like everything else on this board, so ' +
                   'read it against the Currency column, not as rupees.' : '')
  }));

  return c;
}

/* ══ 7. money that exists but was never matched ══════════════════════════ */

function unappliedCard(age, isV, docs) {
  const c = card('Money that exists but was never matched to a document',
    isV ? 'UNAPPLIED_PAY · OPEN_CN' : 'UNAPPLIED_RCPT · OPEN_CN');

  if (!age) {
    c.appendChild(empty({
      what: 'No ageing row, so unapplied money cannot be measured.',
      why: 'The unapplied counts and amounts live on the ' + (isV ? 'vendor' : 'customer') +
           '-ageing row, and this card has none.'
    }));
    return c;
  }

  const nUn = N(age, isV ? 'N_UNAPPLIED_PAY' : 'N_UNAPPLIED_RCPT');
  const vUn = V(age, isV ? 'UNAPPLIED_PAY' : 'UNAPPLIED_RCPT');
  const nCn = N(age, 'N_OPEN_CN');
  const vCn = V(age, 'OPEN_CN');

  const nothing = (!nUn && !vUn && !nCn && !vCn);
  if (nothing && nUn !== null && nCn !== null) {
    c.appendChild(empty({
      what: 'Nothing unmatched on this account.',
      why: 'No unapplied ' + (isV ? 'payments' : 'receipts') + ' and no open credit notes — every ' +
           (isV ? 'payment' : 'receipt') + ' on this card was matched to a document inside SAP. ' +
           'This is a real nil: the counts came back as 0, they were not missing.',
      hint: 'That is why this card’s ledger and its documents agree.'
    }));
    return c;
  }

  c.appendChild(blurb(
    'This is the reason the naive figure is wrong. A ' + (isV ? 'payment' : 'receipt') +
    ' that was posted but never matched to the ' + (isV ? 'bill' : 'invoice') + ' it settles leaves ' +
    'BOTH sides sitting open: the ' + (isV ? 'bill' : 'invoice') + ' still says unpaid, and the ' +
    (isV ? 'payment' : 'receipt') + ' still says unapplied. Sum the open documents and you count ' +
    'the same money twice, in opposite directions. ' + cv('C-0019')));

  c.appendChild(facts([
    {
      label: isV ? 'Payments out, never applied' : 'Receipts in, never applied',
      value: vUn === null ? null : m(vUn),
      why: (isV ? 'UNAPPLIED_PAY' : 'UNAPPLIED_RCPT') + ' is missing from this row',
      tone: vUn ? 'warn' : '',
      sub: nUn === null ? nc('count column missing')
        : esc(num(nUn)) + ' document' + (nUn === 1 ? '' : 's') + ' <span class="mono">' +
          esc(isV ? 'N_UNAPPLIED_PAY' : 'N_UNAPPLIED_RCPT') + '</span>'
    },
    {
      label: 'Open credit notes',
      value: vCn === null ? null : m(vCn),
      why: 'OPEN_CN is missing from this row',
      tone: vCn ? 'warn' : '',
      sub: nCn === null ? nc('count column missing')
        : esc(num(nCn)) + ' note' + (nCn === 1 ? '' : 's') + ' <span class="mono">N_OPEN_CN</span>'
    },
    {
      label: 'Credit the ledger required',
      value: V(age, 'CREDIT_APPLIED') === null ? null : m(V(age, 'CREDIT_APPLIED')),
      why: 'CREDIT_APPLIED is missing from this row',
      sub: 'taken off in the waterfall above <span class="mono">CREDIT_APPLIED</span> — derived as ' +
           'RAW_OPEN minus the ledger, not by matching the documents on the left'
    }
  ]));

  /* These two figures are NOT the same measurement, and saying so is the point. */
  const applied = V(age, 'CREDIT_APPLIED');
  const identified = (vUn || 0) + (vCn || 0);
  if (applied !== null && vUn !== null && vCn !== null) {
    let verdict;
    if (Math.abs(identified - applied) < 1) {
      verdict = 'On this card the two agree: the on-account money sitting here is exactly the credit ' +
        'the ledger required. That is a coincidence worth noting, not the rule.';
    } else if (identified > applied) {
      verdict = 'There is <b>' + m(identified - applied) + ' more</b> on-account money on this card ' +
        'than the ageing needed to consume. The ledger already reflects the rest — it went against ' +
        'documents that are no longer open, or it is the reason the balance sits where it does.';
    } else {
      verdict = 'The ledger required <b>' + m(applied - identified) + ' more</b> credit than these ' +
        'documents can explain. That much of the settlement did not arrive as a ' +
        (isV ? 'payment' : 'receipt') + ' or a credit note at all — it was posted as a journal entry, ' +
        'which no document extract can show. ' + cv('C-0023');
    }
    c.appendChild(el('<p class="tnote"><b>These are two different measurements.</b> ' +
      m(identified) + ' of unapplied ' + (isV ? 'payments' : 'receipts') + ' and open credit notes ' +
      'is what is <i>identifiable</i> on this card; ' + m(applied) + ' is what the ledger <i>required</i>. ' +
      verdict + '</p>'));
  }

  const shownUn = docs.filter(function (r) {
    return r.DOCTYPE === (isV ? 'AP_PMT' : 'AR_RCT') || r.DOCTYPE === (isV ? 'AP_CN' : 'AR_CN');
  }).length;
  if (shownUn) {
    c.appendChild(el('<p class="tnote">' + num(shownUn) + ' of these ' +
      (shownUn === 1 ? 'appears' : 'appear') + ' individually in the document list above — the ' +
      'slice publishes the largest few, so the rest are counted here but not listed.</p>'));
  }

  return c;
}

/* ══ 8. which corrections touch this party ═══════════════════════════════ */

function caveatCard(derivs, ctx) {
  const c = card('The corrections that touch this account', 'derivations · harness/corrections');

  /* Read the caveat text live out of the derivation records — never retyped here. */
  const pool = {};
  const sources = ctx.isV
    ? ['ap-trade-open', 'ap-unbacked-credit', 'ap-migrated-open', 'oi-ap-inv-open', 'ap-book-open']
    : ['ar-trade-open', 'ar-trade-unbacked-debit', 'ar-migrated-open', 'oi-ar-inv-open', 'ar-book-open-total'];
  sources.forEach(function (id) {
    const rec = derivs && derivs[id];
    const list = rec && Array.isArray(rec.caveats) ? rec.caveats : [];
    list.forEach(function (cvt) {
      const code = typeof cvt === 'string' ? cvt : (cvt && cvt.id);
      if (!code || pool[code]) return;
      pool[code] = (typeof cvt === 'object') ? cvt : { id: code };
    });
  });

  const isGroupAccount = ctx.kind === 'INTERCO' || ctx.kind === 'BRANCH' ||
    ctx.dirKind === 'INTERCO' || ctx.dirKind === 'BRANCH' ||
    ctx.ageKind === 'INTERCO' || ctx.ageKind === 'BRANCH' ||
    /\b(JIVO|AKAL)\b/i.test(String(ctx.name || ''));

  /* Why each one touches THIS party — written here, because the correction
     record says what the rule is, not what it means on one card. */
  const why = {
    'C-0019': 'Every figure on this page. The exposure is taken from OCRD.Balance and the ' +
              'documents are aged underneath it, never the other way round.',
    'C-0023': 'The document list on this page is a document extract, so it is <b>not a statement ' +
              'of account</b>. A real party ledger comes from JDT1 and includes journal entries, ' +
              'cancellations and pre-cutover postings that no document extract can show.',
    'C-0021': 'Cancelled documents are excluded by testing CANCELED = ‘N’. SAP posts a cancellation ' +
              'as a matching mirror pair, so the loose test would have counted this card’s ' +
              'cancelled documents twice.',
    'C-0022': 'This is a vendor. An A/P bill’s date is not its GRPO’s date on roughly half of Oil’s ' +
              'pairs, so nothing here should be read as when the goods arrived.',
    'C-0005': 'This account is a JIVO group or branch card, and C-0005 is the list of all 23 of them. ' +
              'It is why the trade headlines exclude it.',
    'C-0020': 'Group accounts hide inside ordinary trading groups on the vendor side, so the ' +
              'classification on this card was made on the name as well as the group.'
  };

  const applies = ['C-0019', 'C-0023', 'C-0021'];
  if (ctx.isV) applies.push('C-0022');
  if (isGroupAccount) { applies.push('C-0005'); applies.push('C-0020'); }

  const box = el('<div class="excl"></div>');
  box.appendChild(el('<h3>Applied to this page</h3>'));
  let rendered = 0;
  applies.forEach(function (code) {
    const rec = pool[code];
    const title = rec && rec.title ? rec.title : null;
    const rule = rec && rec.rule ? rec.rule : null;
    box.appendChild(el(
      '<div class="excl-row">' +
        '<div class="lab">' + cv(code) + ' ' + (title ? esc(title) : '') + '</div>' +
        '<div class="amt"></div>' +
        '<div class="why">' + (why[code] || '') +
        (rule ? ' <span class="muted">Rule as recorded: ' + esc(rule) + '</span>'
              : ' <span class="muted">The rule text could not be read from this company’s ' +
                'derivation file; the code links to the full record.</span>') +
        '</div>' +
      '</div>'));
    rendered++;
  });
  c.appendChild(box);

  if (!rendered) {
    c.appendChild(empty({
      what: 'No corrections could be attached to this account.',
      why: 'The derivation records for this company carried no caveat list, so nothing can be ' +
           'shown here honestly. That is a gap in the data, not a clean bill of health.'
    }));
  }

  c.appendChild(el('<p class="tnote">Corrections are recorded by JIVO operators against live data ' +
    'and override anything this board would otherwise assume. Full text: ' +
    '<a href="methodology.html">methodology</a>.</p>'));

  return c;
}

        '.json</code> — one row per card: the waterfall, the buckets, the counts</div>' +

    ' · figures are INR, read-only, and nothing on this page writes to SAP.</div>';
}
