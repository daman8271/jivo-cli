/**
 * Coverage over time, from `data/history.jsonl`. Points that share a build
 * timestamp are collapsed to the last one: a rebuild writes several lines for
 * the same instant and drawing them as a series would invent a movement.
 */
async function historyCard(co) {
  const c = card('Days since the last reconciliation, over time', 'data/history.jsonl');
  let points = [];
  try {
    const r = await fetch('data/history.jsonl', { cache: 'no-cache' });
    if (r.ok) {
      const by = new Map();
      (await r.text()).split('\n').forEach(function (ln) {
        if (!ln.trim()) return;
        let o = null;
        try { o = JSON.parse(ln); } catch (e) { return; }
        const v = o && o.kpis && o.kpis[co] ? o.kpis[co]['reco-days-since-last'] : null;
        if (v === null || v === undefined || isNaN(Number(v))) return;
        by.set(String(o.t || ''), Number(v));
      });
      points = Array.from(by.entries()).sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
    }
  } catch (e) { points = []; }

  if (points.length < 2) {
    c.appendChild(empty({
      what: 'No history yet for this figure.',
      why: 'The trend needs at least two builds that both recorded a days-since-last for ' +
           companyLabel(co) + '; this file carries ' + points.length + '. It is worth watching: ' +
           'this number should SAWTOOTH — climbing through a month, dropping when the month’s ' +
           'reconciliation is keyed. A straight rising line through a month end means a ' +
           'reconciliation was missed, and that is the finding, not a rendering gap.'
    }));
    return c;
  }
  c.appendChild(sparkline(points.map(function (p) { return { x: p[0], y: p[1] }; }), {
    title: 'Days since the last reconciliation, one point per build',
    unit: 'days', table: true, extremes: true, height: 64
  }));
  c.appendChild(cap(
    'One point per build, not per day. It should sawtooth monthly; a straight climb through a ' +
    'month end is a missed reconciliation. Remember what the figure is: a MIN across the book, so ' +
    'it tracks the book’s <b>best</b> account, and the worst account can be a year behind while ' +
    'this line looks healthy.'
  ));
  return c;
}

/**
 * The account table. ACCOUNT rows only — the roll-up is exactly additive and
 * including it would double every total. The CO_* book constants are kept out
 * entirely rather than totalled, and MOVEMENT_SINCE_RECON_L is shown but never
 * totalled, because it is the one money column that does not re-total.
 */
function accountTable(FIG, co, asOf) {
  const rows = FIG.accounts;
  const c = card('Every bank, cash and bank-facility account',
    SECTION + '.' + co + '.json · ' + num(rows.length) + ' account rows (the roll-up is excluded)');

  const view = rows.map(function (r) {
    const days = numOrNull(r, 'DAYS_SINCE_RECON_N');
    const lastReco = r.LAST_RECON_DATE
      ? r.LAST_RECON_DATE + (days === null ? '' : ' · ' + num(days) + ' d ago')
      : 'never reconciled';

    const atReco = r.LAST_RECON_DATE
      ? 'book ' + inr(rupOrNull(r, 'GL_BAL_AT_LAST_RECON_L')) +
        ' · gap ' + inr(rupOrNull(r, 'GAP_AT_LAST_RECON_L')) +
        ' · moved ' + inr(rupOrNull(r, 'MOVEMENT_SINCE_RECON_L')) + ' since'
      : 'never reconciled';

    let outstanding;
    if (r.OLDEST_UNREC_DATE) {
      const age = asOf ? daysBetween(r.OLDEST_UNREC_DATE, asOf) : null;
      outstanding = 'oldest ' + r.OLDEST_UNREC_DATE + (age === null ? '' : ' · ' + num(age) + ' d');
    } else if (Number(r.GL_LINES_N) > 0) {
      outstanding = 'nothing outstanding';
    } else {
      outstanding = 'never posted';
    }

    return Object.assign({}, r, {
      RECO_PLAIN: STATUS_PLAIN[r.RECO_STATUS] || r.RECO_STATUS || 'no status',
      ACCT_KIND_PLAIN: KIND_PLAIN[r.ACCT_KIND] || r.ACCT_KIND || 'unmapped',
      LAST_RECON: lastReco,
      AT_LAST_RECON: atReco,
      OUTSTANDING: outstanding,
      HOUSE_BANK_PLAIN: r.IS_HOUSE_BANK === 'Y' ? 'DSC1 row exists (decorative)' : 'no DSC1 row'
    });
  });

  const cols = [
    'ACCT_CODE', 'ACCT_NAME', 'ACCT_KIND_PLAIN', 'DRAWER_NAME',
    'RECO_PLAIN', 'RECONS_DONE_N', 'LAST_RECON', 'FIRST_RECON_DATE', 'LAST_RECON_DATE',
    'DAYS_SINCE_RECON_N', 'LAST_RECON_NO',
    'GL_LINES_N', 'REC_LINES_N', 'UNREC_LINES_N', 'RECONCILED_LINES_PCT',
    'GL_BAL_L', 'CURRTOTAL_XCHECK_L', 'RECONCILED_BAL_L', 'BANK_SIDE_BAL_L',
    'RECON_TIEOUT_DIFF_L', 'UNRECONCILED_DIFF_L', 'THROUGHPUT_L',
    'AT_LAST_RECON', 'GL_BAL_AT_LAST_RECON_L', 'GAP_AT_LAST_RECON_L', 'MOVEMENT_SINCE_RECON_L',
    'OUTSTANDING', 'OLDEST_UNREC_DATE',
    'UNREC_0_30_N', 'UNREC_0_30_L', 'UNREC_31_60_N', 'UNREC_31_60_L',
    'UNREC_61_90_N', 'UNREC_61_90_L', 'UNREC_90PLUS_N', 'UNREC_90PLUS_L',
    'UNREC_90PLUS_PAYMENTS_L',
    'UNREC_RECEIPTS_N', 'UNREC_RECEIPTS_L', 'UNREC_PAYMENTS_N', 'UNREC_PAYMENTS_L',
    'REC_RECEIPTS_N', 'REC_RECEIPTS_L', 'REC_PAYMENTS_N', 'REC_PAYMENTS_L',
    'STALE_PRE_RECON_N', 'STALE_PRE_RECON_L', 'HOUSE_BANK_PLAIN'
  ];

  const labels = {}, units = {};
  cols.forEach(function (k) {
    if (DERIVED_COLS[k]) { labels[k] = DERIVED_COLS[k][0]; return; }
    if (k === 'ACCT_KIND_PLAIN') { labels[k] = 'Kind'; return; }
    labels[k] = LABEL_OVERRIDE[k] || (SPEC_COLS[k] && SPEC_COLS[k].label) || k;
  });
  units.RECONCILED_LINES_PCT = 'pct';
  units.DAYS_SINCE_RECON_N = 'days';
  units.LAST_RECON_NO = 'text';        // an IDENTIFIER, not a count and not an amount
  units.RECO_PLAIN = 'text'; units.ACCT_KIND_PLAIN = 'text'; units.DRAWER_NAME = 'text';
  units.LAST_RECON = 'text'; units.AT_LAST_RECON = 'text'; units.OUTSTANDING = 'text';
  units.HOUSE_BANK_PLAIN = 'text'; units.ACCT_NAME = 'text';

  const tbl = table(view, {
    co: co,
    cols: cols,
    labels: labels,
    units: units,
    links: {
      ACCT_CODE: 'bank',
      ACCT_NAME: function (v, r, company) { return hrefGL(r.ACCT_CODE, company); }
    },
    sort: '-THROUGHPUT_L',
    filter: 'Find an account by name, code, kind or status…',
    facets: ['RECO_PLAIN', 'ACCT_KIND_PLAIN'],
    /* every column here is a per-account figure with no fan-out, so these do
       sum. The three that must never be totalled are absent by design:
       MOVEMENT_SINCE_RECON_L (does not re-total), RECONCILED_LINES_PCT (a
       ratio) and every CO_* book constant (repeated on every row). */
    total: ['GL_LINES_N', 'REC_LINES_N', 'UNREC_LINES_N',
            'GL_BAL_L', 'CURRTOTAL_XCHECK_L', 'RECONCILED_BAL_L', 'BANK_SIDE_BAL_L',
            'RECON_TIEOUT_DIFF_L', 'UNRECONCILED_DIFF_L', 'THROUGHPUT_L',
            'UNREC_0_30_N', 'UNREC_0_30_L', 'UNREC_31_60_N', 'UNREC_31_60_L',
            'UNREC_61_90_N', 'UNREC_61_90_L', 'UNREC_90PLUS_N', 'UNREC_90PLUS_L',
            'UNREC_90PLUS_PAYMENTS_L',
            'UNREC_RECEIPTS_N', 'UNREC_RECEIPTS_L', 'UNREC_PAYMENTS_N', 'UNREC_PAYMENTS_L',
            'REC_RECEIPTS_N', 'REC_RECEIPTS_L', 'REC_PAYMENTS_N', 'REC_PAYMENTS_L',
            'STALE_PRE_RECON_N', 'STALE_PRE_RECON_L', 'RECONS_DONE_N'],
    empty: {
      what: 'No account matches this cut.',
      why: 'The chips above filter a real, non-empty table — nothing matched this combination. ' +
           'That is not an empty book; widen the filter to see the rows that exist.'
    },
    caption: 'Bank reconciliation status — one row per G/L account'
  });

  /* the spec's `meaning` for each column, on the header it belongs to */
  try {
    tbl.querySelectorAll('thead th[data-c]').forEach(function (th) {
      const k = th.getAttribute('data-c');
      const meaning = DERIVED_COLS[k] ? DERIVED_COLS[k][1]
        : (k === 'ACCT_KIND_PLAIN' ? (SPEC_COLS.ACCT_KIND && SPEC_COLS.ACCT_KIND.meaning)
                                   : (SPEC_COLS[k] && SPEC_COLS[k].meaning));
      if (meaning) th.title = k + ' — ' + meaning;
    });
  } catch (e) { /* an older browser keeps the default header tooltip */ }

  c.appendChild(h(
    '<p class="tnote"><b>The chips filter on the exact status literal and on the kind.</b> ' +
    STATUS_ORDER.map(function (s) {
      return '<code>' + esc(s) + '</code> ' + esc(String(STATUS_PLAIN[s]).toLowerCase());
    }).join(' · ') + '. The two “never” statuses are separate on purpose: one is a live account ' +
    'nobody has reconciled, the other an empty head that cannot be. The kind follows the ' +
    'chart-of-accounts drawer, never the account name or the code prefix.</p>'
  ));
  c.appendChild(tbl);

  c.appendChild(cap(
    '<b>The roll-up row is not in this table, and that is the section’s worst trap.</b> The slice ' +
    'ships ' + num(rows.length) + ' account rows plus one <code>ROW_TYPE = \'TOTAL\'</code> ' +
    'row that is exactly additive, so a totals row computed over the whole array would report ' +
    'precisely <b>2.00×</b> the truth. The <code>CO_*</code> book constants are absent for the ' +
    'opposite reason: they are the same figure repeated on every row, and summing one gives ' +
    num(rows.length + 1) + '× — they are shown once, above.'
  ));
  c.appendChild(cap(
    '<b>Three columns in the totals row need reading carefully.</b> The tie-out totalling nil is ' +
    'a tautology SAP enforces, not a control that passed. The gap at the last reconciliation is ' +
    'book-against-book-derived, never against a statement. And <b>movement since the last ' +
    'reconciliation is deliberately NOT totalled</b>: it is NULL on ' + num(FIG.moveNullRows) +
    ' never-reconciled row' + (FIG.moveNullRows === 1 ? '' : 's') + ' here while the roll-up folds ' +
    'those accounts’ whole balance in, so a column total would disagree with the book by ' +
    esc(inr(FIG.moveNullBal)) + '. Where a cell reads <code>n/c</code> on any of the seven ' +
    'reconciliation columns the account has <b>never been reconciled</b> — the “Last reconciled” ' +
    'and “At that last reconciliation” columns beside it say so in words, and a zero there would ' +
    'read as “reconciled today”.'
  ));
  c.appendChild(cap(
    'The account code drills to <a href="' + esc(hrefBank(rows[0] ? rows[0].ACCT_CODE : '', co)) +
    '">the bank account page</a>; the name drills to the G/L account. <b>There is no line-level ' +
    'grain below this.</b> The section publishes account rows and reconciliation events and ' +
    'nothing under them, so no drill to an individual uncleared transaction, a journal memo or a ' +
    'per-item ageing list exists — and none is offered here rather than linking to a page that ' +
    'would have to invent one. The most granular question this data answers is “which event ' +
    'cleared how many lines on which account, and when was it keyed”, which is the log below. ' +
    'What each account HOLDS and what moves through it is ' +
    '<a href="' + esc(hrefSection('banks', co)) + '">the bank register’s</a> job, not this one’s.'
  ));

  const glossary = h('<details class="sqlbox-host"><summary class="btn sm">What each column means</summary></details>');
  const gl = h('<div class="prose" style="margin-top:12px"><dl></dl></div>');
  const dl = gl.querySelector('dl');
  cols.forEach(function (k) {
    const meaning = DERIVED_COLS[k] ? DERIVED_COLS[k][1]
      : (k === 'ACCT_KIND_PLAIN' ? (SPEC_COLS.ACCT_KIND && SPEC_COLS.ACCT_KIND.meaning)
                                 : (SPEC_COLS[k] && SPEC_COLS[k].meaning));
    if (!meaning) return;
    dl.appendChild(h('<dt><b>' + esc(labels[k]) + '</b> <code>' + esc(k) + '</code></dt>'));
    dl.appendChild(h('<dd>' + esc(rupee(meaning)) + '</dd>'));
  });
  glossary.appendChild(gl);
  c.appendChild(glossary);

  return c;
}

/** The event log: one row per reconciliation SAP has on record. */
function eventTable(FIG, co) {
  const c = card('Every reconciliation event on record',
    SECTION + '-detail · ' + num(FIG.detail.length) + ' events');

  if (!FIG.detail.length) {
    c.appendChild(empty({
      what: 'No bank reconciliation has ever been recorded in this book.',
      why: 'OBNK holds no row for any account in ' + companyLabel(co) + '. There is no event to ' +
           'list — that is the coverage failure above, stated once more at the grain where it ' +
           'would otherwise look like a missing table.'
    }));
    return c;
  }

  const cols = ['ACCT_CODE', 'ACCT_NAME', 'RECON_NO', 'STMT_DATE', 'PERFORMED_DATE', 'LAG_DAYS_N',
                'LINES_CLEARED_N', 'CLEARED_RECEIPTS_N', 'CLEARED_RECEIPTS_L',
                'CLEARED_PAYMENTS_N', 'CLEARED_PAYMENTS_L', 'CLEARED_NET_L', 'BANK_SIDE_L',
                'TIEOUT_DIFF_L', 'OLDEST_ITEM_DATE', 'MAX_ITEM_AGE_AT_STMT_N'];
  const labels = {}, units = {};
  cols.forEach(function (k) {
    labels[k] = LABEL_OVERRIDE[k] || (SPEC_COLS[k] && SPEC_COLS[k].label) || k;
  });
  units.RECON_NO = 'text';
  units.LAG_DAYS_N = 'days';
  units.MAX_ITEM_AGE_AT_STMT_N = 'days';
  units.ACCT_NAME = 'text';

  const tbl = table(FIG.detail, {
    co: co, cols: cols, labels: labels, units: units,
    links: {
      ACCT_CODE: 'bank',
      ACCT_NAME: function (v, r, company) { return hrefGL(r.ACCT_CODE, company); }
    },
    sort: '-STMT_DATE',
    filter: 'Find an event by account or date…',
    facets: ['ACCT_CODE'],
    total: ['LINES_CLEARED_N', 'CLEARED_RECEIPTS_N', 'CLEARED_RECEIPTS_L',
            'CLEARED_PAYMENTS_N', 'CLEARED_PAYMENTS_L', 'CLEARED_NET_L', 'BANK_SIDE_L',
            'TIEOUT_DIFF_L'],
    empty: {
      what: 'No event matches this cut.',
      why: 'The filter above narrows a real, non-empty log. Widen it to see the events that exist.'
    },
    caption: 'Reconciliation event log — one row per OBNK reconciliation'
  });

  try {
    tbl.querySelectorAll('thead th[data-c]').forEach(function (th) {
      const k = th.getAttribute('data-c');
      const meaning = SPEC_COLS[k] && SPEC_COLS[k].meaning;
      if (meaning) th.title = k + ' — ' + meaning;
    });
  } catch (e) { /* older browser */ }

  c.appendChild(tbl);
  c.appendChild(cap(
    '<b>One row is one reconciliation event, not one statement line.</b> The tie-out column ' +
    'reads nil on every row and that is guaranteed by SAP, not achieved by anyone — the software ' +
    'will not close a reconciliation whose two sides disagree. The “bank side” column is derived ' +
    'from <code>OBNK.DebAmount</code> and <code>CredAmnt</code>, <b>not</b> from a bank statement: ' +
    '<code>OBNK."balance"</code> is 0.000000 on all 259 rows across the three books. ' +
    'Signs are ledger-native throughout.'
  ));
  c.appendChild(cap(
    'The detail query’s ledger CTE is deliberately not bounded by the as-of. That is safe today ' +
    'because not one reconciled line in any book is dated after its own statement date — batches ' +
    'reach backwards only, by up to 547 days — so the ordering holds automatically. If that ' +
    'invariant ever breaks, the tie-out column here goes non-zero first, which is why it was left ' +
    'unbounded rather than silently clipped. Do not “fix” it without also removing that alarm.'
  ));
  return c;
}

/**
 * The query itself, behind a disclosure. `sql/_index.json` is asked first: a
 * fetch-and-fail logs a console 404 the page cannot suppress, and the browser
 * check counts console errors as failures (CONTRACT §2).
 */
async function sqlCard(der, co) {
  const c = card('The query behind this page', SQL_FILE);
  const box = h('<details class="sqlbox-host"><summary class="btn sm">Show the SQL</summary></details>');
  box.style.margin = '0';
  const body = h('<div style="margin-top:12px"></div>');
  box.appendChild(body);
  c.appendChild(box);
  c.appendChild(h(
    '<p class="tnote">Read-only, and reviewed adversarially before it was allowed near the board. ' +
    'Money columns are plain lakhs — the display multiplies by a lakh, the query never does. ' +
    'The event log has a second file of its own, <code>sql/bank-reco-detail.sql</code>. ' +
    'These files are not edited by the dashboard (CONTRACT §0.6): changing one of these queries ' +
    'silently changes the books.</p>'
  ));

  let text = null, from = null;
  try {
    const idx = await fetch('sql/_index.json', { cache: 'no-cache' });
    const have = idx.ok ? await idx.json() : null;
    if (Array.isArray(have) && have.indexOf(SECTION) >= 0) {
      const r = await fetch(SQL_FILE, { cache: 'no-cache' });
      if (r.ok) { text = await r.text(); from = 'the full query, ' + SQL_FILE; }
    }
  } catch (e) { /* fall back to the derivation excerpt below */ }

  if (!text) {
    const d = der && (der['reco-unagreed-balance'] || der['reco-90plus-gross']);
    if (d && d.sql && d.sql.text) {
      text = d.sql.text;
      from = 'the excerpt carried in the derivation record' +
             (Array.isArray(d.sql.lines) ? ' (lines ' + d.sql.lines[0] + '–' + d.sql.lines[1] + ')' : '');
    }
  }

  if (!text) {
    body.appendChild(empty({
      what: 'The query text is not published with this build.',
      why: 'sql/_index.json does not list this section and no derivation record carried an ' +
           'excerpt. The file itself is in the repo at ' + SQL_FILE + '.'
    }));
    return c;
  }

  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const html = lines.map(function (ln, i) {
    return '<span class="ln">' + (i + 1) + '</span>' + esc(ln);
  }).join('\n');
  body.appendChild(h('<div class="sqlbox"><pre><code>' + html + '</code></pre></div>'));
  body.appendChild(h('<div class="sqlfoot"><span>' + esc(from) + '</span><span>' +
    num(lines.length) + ' lines</span><span>reads OBNK · JDT1 · OACT · DSC1</span></div>'));
  return c;
}

/** The page footer: where the numbers came from, and how old they are. */
function paintFoot(m, co, asOf, FIG) {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
      '<div><b>Section</b> — bank-reco, one row per postable balance-sheet G/L account in the ' +
        'bank / cash / bank-facility universe, plus exactly one roll-up row. The universe is the ' +
        'postable children of eight named chart-of-accounts drawers walked through ' +
        '<code>OACT.FatherNum</code>, never a name or code-prefix match — <code>%BANK%</code> ' +
        'also catches BANK CHARGES, and the code prefix lies.</div>' +
      '<div><b>Sources</b> — <code>OBNK</code> (the reconciliation LOG, one row per event), ' +
        '<code>JDT1</code> (the ledger), <code>OACT</code> (the chart of accounts) and ' +
        '<code>DSC1</code> for the decorative house-bank marker. <code>BNK1</code>, ' +
        '<code>BNK2</code>, <code>RCT1</code>, <code>VPM1</code>, <code>OCHO</code>, ' +
        '<code>OITR</code> and <code>ITR1</code> are read <b>only to prove they are empty or ' +
        'irrelevant</b>, and their counts ship as the <code>CO_*</code> columns. No figure here ' +
        'comes from a payment document or a bank statement line.</div>' +
      '<div><b>What it cannot say</b> — no bank statement has ever entered SAP and ' +
        '<code>OBNK."balance"</code> is 0.000000 on all 259 reconciliation rows, so this section ' +
        'can report WHETHER and WHEN a reconciliation happened and what was never reconciled. ' +
        '<b>It can never say whether one was right.</b> The tie-out is a tautology SAP enforces; ' +
        'the gap at the last reconciliation is book against book-derived. Neither is ' +
        'statement-versus-books, and there is nothing in this system that is.</div>' +
      '<div><b>Book</b> — ' + esc(companyLabel(co)) + '. These figures cannot be added to any ' +
        'other section, and none of them is a trade figure: gross movement counts a rupee in and ' +
        'back out twice, and branch and intercompany money is deliberately included.</div>' +
      '<div><b>Freshness</b> — ' + (asOf ? 'as of ' + esc(asOf) + '. ' : '') +
        (gen ? 'Built ' + esc(ago(gen)) + ' (' + esc(gen) + '). ' : 'Build time unknown. ') +
        'The page re-reads the manifest every minute and redraws itself when the build moves.</div>' +
      '<div><b>Read-only</b> — this board issues no write to SAP, ever (CONTRACT §0.2). ' +
        'Nothing on this page reconciles anything; it reports what SAP already recorded.</div>' +
    '</div>' +
    '<p><a href="' + esc(hrefSection('methodology.html', co)) + '">Methodology and the corrections</a> · ' +
    '<a href="' + esc(hrefDerivation('reco-coverage-pct', co)) + '">How coverage is derived</a> · ' +
    '<a href="' + esc(hrefSection('banks', co)) + '">Bank &amp; cash register</a> · ' +
    '<a href="' + esc(hrefSection('health', co)) + '">Build health</a></p>';
}

shell({
  title: 'Bank reconciliation',
  subtitle: 'Whether and when each account was reconciled — SAP-side only, never bank versus books',
  section: SECTION
});

render().catch(function (e) {
  const main = document.getElementById('main');
  if (main) {
    main.innerHTML = '';
    main.appendChild(empty({

    }));
  }
  try { console.error('[bank-reco]', e); } catch (e2) { /* ignore */ }
});

onRefresh(render);
</script>
