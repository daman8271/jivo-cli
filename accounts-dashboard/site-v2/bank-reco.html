/* ══ 2. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** `Rs 85.95 Cr` in the spec's prose → `₹85.95 Cr` on the page. */
function rupee(s) {
  return String(s).replace(/\bRs\s(?=[\d,])/g, '₹').replace(/(\d)x\b/g, '$1×');
}

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }

/** A percentage, one decimal, or the honest word. */
function pc(v, dp) {
  return (v === null || v === undefined || isNaN(Number(v))) ? 'not computed'
    : Number(v).toFixed(dp === undefined ? 1 : dp) + '%';
}

/** A `<a class="cvcode">C-0005</a>` linked to methodology.html. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}

/** The standing "this is not assurance" link, used in a dozen captions. */
function methodLink(text) {
  return '<a href="' + esc(hrefSection('methodology.html', company())) + '">' + text + '</a>';
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + src + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a chart: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/** A row inside an `.excl` block: label, amount, and the reason underneath. */
function exclRow(lab, amt, why) {
  return h('<div class="excl-row"><div class="lab">' + esc(lab) + '</div>' +
           '<div class="amt">' + esc(amt) + '</div>' +
           '<div class="why">' + why + '</div></div>');
}

/**
 * Lift one cell to RUPEES by its column suffix (CONTRACT §4), NULL → 0.
 *
 * `core.scale()` anchors the suffix match at the END of the name and that is
 * the whole point in this section: five columns here contain `_L` in the
 * middle because the word LINES does — GL_LINES_N, REC_LINES_N, UNREC_LINES_N,
 * RECONCILED_LINES_PCT and the detail's LINES_CLEARED_N. A "contains _L" test
 * would render RECONCILED_LINES_PCT 78.0 as ₹78,00,000 (trap 7). Never
 * hand-roll it.
 */
function rup(r, col) {
  const raw = r ? r[col] : null;
  if (raw === null || raw === undefined || raw === '' || isNaN(raw)) return 0;
  const n = Number(scale(raw, col));
  return isFinite(n) ? n : 0;
}

/**
 * The same lift, but a NULL STAYS NULL. Seven columns are NULL on every
 * never-reconciled row and coercing one to zero says "reconciled today", which
 * is the exact opposite of the truth (trap 21).
 */
function rupOrNull(r, col) {
  const raw = r ? r[col] : null;
  if (raw === null || raw === undefined || raw === '' || isNaN(raw)) return null;
  const n = Number(scale(raw, col));
  return isFinite(n) ? n : null;
}

/** A count / day figure, NULL preserved. */
function numOrNull(r, col) {
  const raw = r ? r[col] : null;
  if (raw === null || raw === undefined || raw === '' || isNaN(raw)) return null;
  const n = Number(raw);
  return isFinite(n) ? n : null;
}

/** Sum one per-account column over ACCOUNT rows only, in rupees. */
function sumCol(rows, col) {
  let t = 0;
  for (const r of rows) t += rup(r, col);
  return t;
}

/** Sum a count column over ACCOUNT rows only. */
function sumN(rows, col) {
  let t = 0;
  for (const r of rows) { const n = Number(r[col]); if (isFinite(n)) t += n; }
  return t;
}

/** Whole days between two ISO dates, UTC, b − a. */
function daysBetween(aIso, bIso) {
  const a = Date.parse(String(aIso).slice(0, 10) + 'T00:00:00Z');
  const b = Date.parse(String(bIso).slice(0, 10) + 'T00:00:00Z');
  if (!isFinite(a) || !isFinite(b)) return null;
  return Math.round((b - a) / 86400000);
}

/** `2026-07-31` → `Jul 26`, for an axis that has to fit at 390px. */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(ym) {
  const m = /^(\d{4})-(\d{2})/.exec(String(ym || ''));
  if (!m) return String(ym || '');
  return MON[Number(m[2]) - 1] + ' ' + m[1].slice(2);
}

/** Every `YYYY-MM` slot from `from` to `to`, inclusive. */
function monthRange(from, to) {
  const out = [];
  let y = Number(String(from).slice(0, 4)), mo = Number(String(from).slice(5, 7));
  const ey = Number(String(to).slice(0, 4)), em = Number(String(to).slice(5, 7));
  if (!isFinite(y) || !isFinite(mo) || !isFinite(ey) || !isFinite(em)) return out;
  let guard = 0;
  while ((y < ey || (y === ey && mo <= em)) && guard++ < 400) {
    out.push(String(y) + '-' + (mo < 10 ? '0' : '') + mo);
    mo++; if (mo > 12) { mo = 1; y++; }
  }
  return out;
}

/** Median of a numeric array, or null. */
function median(xs) {
  const a = xs.filter(function (x) { return isFinite(x); }).slice().sort(function (p, q) { return p - q; });
  if (!a.length) return null;
  const mid = a.length >> 1;
  return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
}

/** Manifest KPI value, accepting both `{value}` and the older short `{v}` shape. */
function regVal(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  if (!k) return null;
  const v = (k.value !== undefined) ? k.value : k.v;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/** Manifest KPI cross-check block, or null. */
function regCheck(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  return (k && k.check && typeof k.check === 'object') ? k.check : null;
}

/* ── the RECO_STATUS predicates. EXACT, never `includes` (trap 24). ─────── */
const isNever    = function (r) { return r.RECO_STATUS === 'NEVER_RECONCILED'; };
const isDormant  = function (r) { return r.RECO_STATUS === 'DORMANT_NEVER_RECONCILED'; };
/** The spec's own filter for the exception list: RECO_STATUS LIKE 'RECONCILED%'. */
const isReconciledFamily = function (r) {
  return String(r.RECO_STATUS || '').indexOf('RECONCILED') === 0;
};
/**
 * "Nobody has ever reconciled this account" — the union of NEVER_RECONCILED and
 * DORMANT_NEVER_RECONCILED. This IS the spec's containment test, and it is
 * correct HERE and nowhere else: reco-never-throughput asks how much money has
 * moved through an unchecked account, and a dormant account contributes zero.
 * The FAILURE COUNT uses the exact match instead.
 */
const isEverUnreconciled = function (r) {
  return String(r.RECO_STATUS || '').indexOf('NEVER_RECONCILED') >= 0;
};
const isReconcilable = function (r) { return RECONCILABLE_KINDS.indexOf(r.ACCT_KIND) >= 0; };
const isCashOrWallet = function (r) { return r.ACCT_KIND === 'CASH' || r.ACCT_KIND === 'WALLET'; };

/* ══ 3. the figures — computed here, from the slice ══════════════════════ */

/**
 * Every KPI in the section, evaluated from the rows the page is holding.
 *
 * The board's registry is the other route, not this one: it is read back in
 * §4.13 and any material disagreement is printed there rather than buried. As
 * of this build the registry stores a flat 50.0 for BOTH coverage ids in all
 * three books and stores nothing at all for three more, so a page that
 * rendered `manifest.value` blindly would publish a 50% coverage figure for a
 * book that is at 4.5%.
 */
function figures(rows, detail, asOf, co) {
  const accounts = rows.filter(function (r) { return r.ROW_TYPE === 'ACCOUNT'; });
  const TOT = rows.filter(function (r) { return r.ROW_TYPE === 'TOTAL'; })[0] || null;

  const never       = accounts.filter(isNever);
  const dormant     = accounts.filter(isDormant);
  const reconciled  = accounts.filter(isReconciledFamily);
  const everUnrec   = accounts.filter(isEverUnreconciled);
  const withLines   = accounts.filter(function (r) { return Number(r.GL_LINES_N) > 0; });
  const everDone    = accounts.filter(function (r) { return Number(r.RECONS_DONE_N) > 0; });
  const activeDone  = withLines.filter(function (r) { return Number(r.RECONS_DONE_N) > 0; });
  const bankish     = accounts.filter(isReconcilable);
  const cashWallet  = accounts.filter(isCashOrWallet);
  const houseBanks  = accounts.filter(function (r) { return r.IS_HOUSE_BANK === 'Y'; });
  const unmapped    = accounts.filter(function (r) { return r.ACCT_KIND === 'OTHER' || !r.ACCT_KIND; });

  /* days since, on accounts that have ever been reconciled. NULL rows are
     excluded rather than read as zero (trap 21). */
  const sinceDays = everDone
    .map(function (r) { return numOrNull(r, 'DAYS_SINCE_RECON_N'); })
    .filter(function (n) { return n !== null; });

  /* the oldest unagreed item: the TOTAL row publishes the DATE, not the age. */
  const oldestDates = accounts.map(function (r) { return r.OLDEST_UNREC_DATE; })
                              .filter(Boolean).sort();
  const oldestDate = (TOT && TOT.OLDEST_UNREC_DATE) || (oldestDates.length ? oldestDates[0] : null);

  const lags = (detail || []).map(function (d) { return numOrNull(d, 'LAG_DAYS_N'); })
                             .filter(function (n) { return n !== null; });
  const reach = (detail || []).map(function (d) { return numOrNull(d, 'MAX_ITEM_AGE_AT_STMT_N'); })
                              .filter(function (n) { return n !== null; });

  /* the 90-day-plus blend, split the one way that matters (trap 10) */
  const excValue = sumCol(reconciled, 'UNREC_90PLUS_L');
  const excItems = sumN(reconciled, 'UNREC_90PLUS_N');
  const covValue = sumCol(everUnrec, 'UNREC_90PLUS_L');
  const covItems = sumN(everUnrec, 'UNREC_90PLUS_N');

  /* MOVEMENT_SINCE_RECON_L is the ONE money column that does not re-total
     (trap 6): NULL on every never-reconciled row while the TOTAL folds those
     accounts' whole GL_BAL in through IFNULL(...,0). Both numbers are carried
     so the card can show the gap rather than pick a side. */
  const moveRows  = accounts.filter(function (r) { return r.MOVEMENT_SINCE_RECON_L !== null &&
                                                          r.MOVEMENT_SINCE_RECON_L !== undefined; });
  const moveFromRows = sumCol(moveRows, 'MOVEMENT_SINCE_RECON_L');
  const moveTotal = TOT ? rupOrNull(TOT, 'MOVEMENT_SINCE_RECON_L') : null;
  const moveNullBal = sumCol(accounts.filter(function (r) {
    return r.MOVEMENT_SINCE_RECON_L === null || r.MOVEMENT_SINCE_RECON_L === undefined;
  }), 'GL_BAL_L');

  const glLines  = TOT ? Number(TOT.GL_LINES_N)  : sumN(accounts, 'GL_LINES_N');
  const recLines = TOT ? Number(TOT.REC_LINES_N) : sumN(accounts, 'REC_LINES_N');

  const v = {
    /* coverage — two honest denominators that disagree by 3.7x in Mart */
    'reco-coverage-pct':        accounts.length ? 100 * everDone.length / accounts.length : null,
    'reco-coverage-pct-active': withLines.length ? 100 * activeDone.length / withLines.length : null,
    'reco-never-reconciled-n':  never.length,

    /* recency */
    'reco-days-since-last':  TOT ? numOrNull(TOT, 'DAYS_SINCE_RECON_N') : null,
    'reco-days-since-worst': sinceDays.length ? Math.max.apply(null, sinceDays) : null,
    'reco-events-n':         TOT ? numOrNull(TOT, 'RECONS_DONE_N') : sumN(accounts, 'RECONS_DONE_N'),
    'reco-keying-lag-days':  median(lags),

    /* what is agreed, and what is not */
    'reco-lines-agreed-pct': TOT ? numOrNull(TOT, 'RECONCILED_LINES_PCT')
                                 : (glLines ? 100 * recLines / glLines : null),
    'reco-unagreed-balance': TOT ? rupOrNull(TOT, 'UNRECONCILED_DIFF_L') : null,
    'reco-unrec-lines-n':    TOT ? numOrNull(TOT, 'UNREC_LINES_N') : sumN(accounts, 'UNREC_LINES_N'),

    /* the 90-day-plus family */
    'reco-90plus-gross':      TOT ? rupOrNull(TOT, 'UNREC_90PLUS_L') : sumCol(accounts, 'UNREC_90PLUS_L'),
    'reco-90plus-exceptions': excValue,
    'reco-90plus-bank-only':  sumCol(bankish, 'UNREC_90PLUS_L'),
    'reco-90plus-payments':   TOT ? rupOrNull(TOT, 'UNREC_90PLUS_PAYMENTS_L')
                                  : sumCol(accounts, 'UNREC_90PLUS_PAYMENTS_L'),

    /* exposure to an unchecked account */
    'reco-never-throughput':  sumCol(everUnrec, 'THROUGHPUT_L'),
    'reco-oldest-unrec-days': oldestDate && asOf ? daysBetween(oldestDate, asOf) : null,

    /* the three measured zeros, and the one that is a tautology */
    'reco-stale-pre-recon-n':          TOT ? numOrNull(TOT, 'STALE_PRE_RECON_N') : sumN(accounts, 'STALE_PRE_RECON_N'),
    'reco-tieout-internal':            TOT ? rupOrNull(TOT, 'RECON_TIEOUT_DIFF_L') : sumCol(accounts, 'RECON_TIEOUT_DIFF_L'),
    'reco-gap-at-last-recon-internal': TOT ? rupOrNull(TOT, 'GAP_AT_LAST_RECON_L') : null,
    'reco-statement-lines-loaded':     TOT ? numOrNull(TOT, 'CO_STMT_IMPORT_ROWS_N')
                                           : (accounts[0] ? numOrNull(accounts[0], 'CO_STMT_IMPORT_ROWS_N') : null)
  };

  return {
    co: co, TOT: TOT, accounts: accounts, detail: detail || [],
    never: never, dormant: dormant, reconciled: reconciled, everUnrec: everUnrec,
    withLines: withLines, everDone: everDone, activeDone: activeDone,
    bankish: bankish, cashWallet: cashWallet, houseBanks: houseBanks, unmapped: unmapped,
    lags: lags, reach: reach, sinceDays: sinceDays, oldestDate: oldestDate,
    excValue: excValue, excItems: excItems, covValue: covValue, covItems: covItems,
    moveFromRows: moveFromRows, moveTotal: moveTotal, moveNullBal: moveNullBal,
    moveNullRows: accounts.length - moveRows.length,
    glLines: glLines, recLines: recLines,
    glBal:   TOT ? rupOrNull(TOT, 'GL_BAL_L') : null,
    recBal:  TOT ? rupOrNull(TOT, 'RECONCILED_BAL_L') : null,
    bankSide: TOT ? rupOrNull(TOT, 'BANK_SIDE_BAL_L') : null,
    currTot: TOT ? rupOrNull(TOT, 'CURRTOTAL_XCHECK_L') : null,
    throughput: TOT ? rupOrNull(TOT, 'THROUGHPUT_L') : sumCol(accounts, 'THROUGHPUT_L'),
    staleValue: TOT ? rupOrNull(TOT, 'STALE_PRE_RECON_L') : sumCol(accounts, 'STALE_PRE_RECON_L'),
    coCheques:  TOT ? numOrNull(TOT, 'CO_CHEQUE_DOCS_N') : null,
    coIntRecon: TOT ? numOrNull(TOT, 'CO_INTERNAL_RECONS_N') : null,
    coIntOnBank: TOT ? numOrNull(TOT, 'CO_INTRECON_ON_BANK_N') : null,
    cwItems: sumN(cashWallet, 'UNREC_90PLUS_N'),
    cwValue: sumCol(cashWallet, 'UNREC_90PLUS_L'),
    bankItems: sumN(bankish, 'UNREC_90PLUS_N'),
    allItems: TOT ? Number(TOT.UNREC_90PLUS_N) : sumN(accounts, 'UNREC_90PLUS_N'),
    v: v
  };
}

/** Build one kpiRow item from the computed figure plus whatever the caller adds. */
function kitem(FIG, id, extra) {
  const meta = KPI[id] || {};
  const val = FIG.v[id];
  return Object.assign({
    id: id,
    label: meta.label || id,
    unit: meta.unit,
    value: (val === undefined ? null : val)
  }, extra || {});
}

/**
 * Where the page and the board's registry disagree about the same id.
 * Tolerance is deliberately loose on money: every `_L` column is ROUND(x/1e5, 2)
 * = ₹1,000 granularity and up to 260 rounded values get combined, so exact
 * equality would false-alarm on every book (trap 28). Counts, by contrast,
 * reconcile EXACTLY — a count mismatch is always a real defect.
 */
function agrees(a, b, unit, rowCount) {
  if (a === null || a === undefined || b === null || b === undefined) return false;
  if (isNaN(Number(a)) || isNaN(Number(b))) return false;
  let tol;
  if (unit === 'INR') tol = Math.max(1000 * (rowCount + 1), Math.abs(Number(b)) * 0.005);
  else if (unit === 'pct') tol = Math.max(0.05, Math.abs(Number(b)) * 0.005);
  else if (unit === 'count') tol = 0;
  else tol = 0.5;
  return Math.abs(Number(a) - Number(b)) <= tol;
}

function disagreements(m, co, FIG) {
  const out = [];
  const n = FIG.accounts.length;
  Object.keys(KPI).forEach(function (id) {
    const mine = FIG.v[id];
    const reg  = regVal(m, co, id);
    const unit = KPI[id].unit;
    const chk  = regCheck(m, co, id);
    if (mine === null || mine === undefined || isNaN(Number(mine))) return;
    if (reg !== null && agrees(mine, reg, unit, n)) return;
    const altRaw = (chk && chk.alt_value !== undefined && chk.alt_value !== null &&
                    !isNaN(Number(chk.alt_value))) ? Number(chk.alt_value) : null;
    out.push({
      id: id, unit: unit, mine: mine, reg: reg, chk: chk, alt: altRaw,
      altAgrees: altRaw !== null && agrees(mine, altRaw, unit, n)
    });
  });
  return out;
}

/** Format a figure by its declared unit, for the disagreement table. */
function byUnit(v, unit) {
  if (v === null || v === undefined || isNaN(Number(v))) return 'not computed';
  if (unit === 'pct') return Number(v).toFixed(1) + '%';
  if (unit === 'count') return num(v);
  if (unit === 'days') return num(v) + ' days';
  return inr(Number(v));
}

/* ══ 4. render ═══════════════════════════════════════════════════════════ */

async function render() {
  const co = company();
  const main = document.getElementById('main');
  const [m, d, der] = await Promise.all([manifest(), slice(SECTION, co), derivations(co)]);
  const rows = d.summary || [];
  const detail = d.detail || [];
  const asOf = d.as_of || (m && m.as_of) || null;

  main.innerHTML = '';
  const add = function (n) { if (n) main.appendChild(n); return n; };

  add(crumb([
    { label: 'Board', href: hrefSection('index.html', co) },
    { label: 'Bank reconciliation' }
  ]));

  add(h(
    '<div class="pagehead">' +
      '<div class="ctx">Reconciliation status <span class="sep">·</span> ' +
      'OBNK · JDT1 · OACT · DSC1' +
        (asOf ? ' <span class="sep">·</span> as of ' + esc(asOf) : '') + '</div>' +
      '<h1>What has been reconciled, when, and what never has</h1>' +
      '<p class="lede">One row per bank, cash and bank-facility G/L account: whether it has ever ' +
      'been reconciled, when it last was, how much of the book balance a reconciliation covers, ' +
      'and the size and age of everything nobody has agreed. <b>This is a reconciliation STATUS ' +
      'report, not a reconciliation</b> — everything here is SAP’s own record of its own work.</p>' +
    '</div>'
  ));

  /* -- the section could not be read: say so, never print a zero ---------- */
  const secStatus = m && m.sections && m.sections[SECTION];
  if (d.error || !rows.length) {
    add(empty({
      what: 'SAP returned no bank, cash or bank-facility account for this book.',
      why: 'That would mean the eight-drawer walk resolved nothing, which has never happened — ' +
           'all eight drawer names exist with identical spelling AND identical account codes in ' +
           'all three books. Treat it as a build failure, not an empty panel.' +
           (d.error ? ' Reader’s error: ' + d.error : '') +
           (secStatus && secStatus.error ? ' Build error: ' + secStatus.error : ''),
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, asOf, null);
    return;
  }

  const FIG = figures(rows, detail, asOf, co);

  /* -- an as-of before the book opened returns clean zeros, not a clean book */
  if (!FIG.glLines && !FIG.v['reco-events-n']) {
    add(empty({
      what: 'No bank ledger activity existed at this as-of date.',
      why: 'Every account in this book returns zero ledger lines and zero reconciliations at ' +
           (asOf ? asOf : 'this date') + '. The query answers cleanly with no error and no ' +
           'divide-by-zero, so a full row of ₹0 KPIs here would read as a reconciled book. It is ' +
           'an as-of before the book opened.',
      href: hrefSection('banks', co),
      hrefLabel: 'The bank register, which carries each book’s opening date'
    }));
    paintFoot(m, co, asOf, FIG);
    return;
  }

  /* ── 4.0 the standing banner. Not a footnote — the frame. ─────────────── */
  add(statementBanner(FIG, co));

  /* ── 4.1 the headline: coverage, and how long since anyone looked ─────── */
  add(kpiRow([
    kitem(FIG, 'reco-coverage-pct', {
      tone: (FIG.v['reco-coverage-pct'] !== null && FIG.v['reco-coverage-pct'] < 50) ? 'bad' : undefined,
      sub: num(FIG.everDone.length) + ' of ' + num(FIG.accounts.length) +
           ' accounts have ever been reconciled — every account in the book is the denominator',
      title: 'The other honest denominator, accounts that actually move, is beside it.'
    }),
    kitem(FIG, 'reco-coverage-pct-active', {
      tone: (FIG.v['reco-coverage-pct-active'] !== null && FIG.v['reco-coverage-pct-active'] < 50) ? 'warn' : undefined,
      sub: num(FIG.activeDone.length) + ' of ' + num(FIG.withLines.length) +
           ' accounts that carry a ledger line — an empty head cannot be reconciled'
    }),
    kitem(FIG, 'reco-never-reconciled-n', {
      tone: FIG.never.length ? 'bad' : 'ok',
      sub: FIG.never.length
        ? 'accounts with ledger lines and no reconciliation event, ever — the ' +
          num(FIG.dormant.length) + ' empty heads are counted separately'
        : 'measured nil: every live account in this book has been reconciled at least once'
    }),
    kitem(FIG, 'reco-days-since-last', {
      tone: 'warn',
      sub: 'a MIN across the book — this is the BEST account, not the book'
    }),
    kitem(FIG, 'reco-days-since-worst', {
      tone: 'bad',
      sub: 'the longest any once-reconciled account has been left'
    })
  ]));

  add(h(
    '<div class="caveat">' +
      '<b>Three things hold this page up.</b> First, <b>this section is SAP-side only</b>: no ' +
      'bank statement has ever entered SAP, so it can say whether and when a reconciliation ' +
      'happened and what has never been reconciled — <b>never whether one was right</b>. Second, ' +
      'the slice carries <b>' + num(FIG.accounts.length) + ' account rows plus one roll-up</b> ' +
      'in the same array, and the roll-up is exactly additive: summing a column without ' +
      'filtering <code>ROW_TYPE</code> returns exactly <b>2.00×</b> the truth. Every total here ' +
      'is read off the <code>TOTAL</code> row or computed over <code>ACCOUNT</code> rows only. ' +
      'Third, the <code>CO_*</code> columns are the opposite hazard — book constants repeated on ' +
      'every row, so summing one gives ' + num(FIG.accounts.length + 1) + '× — and they are read ' +
      'off one row. Nothing on this page is a trade figure: gross movement counts a rupee in and ' +
      'back out twice, and branch and intercompany money is <b>deliberately included</b> ' +
      '(' + cv('C-0005') + ' is a party-side test and cannot be applied to a G/L row).' +
    '</div>'
  ));

  /* ── 4.2 the two honest denominators, drawn ──────────────────────────── */
  add(coverageCard(FIG, co));

  /* ── 4.3 who is being reconciled, and who is not ─────────────────────── */
  add(matrixCard(FIG, co));

  /* ── 4.4 the 90-day-plus number is two different problems ────────────── */
  add(splitCard(FIG, co));

  /* ── 4.5 the ageing of the unagreed items ────────────────────────────── */
  add(ageingCard(FIG, co));

  /* ── 4.6 how much rides on each account against how long since a check ─ */
  add(exposureCard(FIG, co));

  /* ── 4.7 the chase list: money through accounts nobody has checked ───── */
  add(neverCard(FIG, co));

  /* ── 4.8 book, agreed, never agreed — and what that middle step is not ─ */
  add(waterfallCard(FIG, co, asOf));

  /* ── 4.9 every reconciliation ever recorded ──────────────────────────── */
  add(timelineCard(FIG, co, asOf));

  /* ── 4.10 when they do reconcile, how fast is it keyed ───────────────── */
  add(lagCard(FIG, co));

  /* ── 4.11 the checks that are not checks ─────────────────────────────── */
  add(internalChecksCard(FIG, co, asOf));

  /* ── 4.12 coverage over time ─────────────────────────────────────────── */
  add(await historyCard(co));

  /* ── 4.13 where this page and the registry disagree ──────────────────── */
  {
    const gaps = disagreements(m, co, FIG);
    if (gaps.length) {
      const c = card('Where this page and the board’s registry disagree',
        'manifest.kpis.' + co + ' against the figures above');
      c.appendChild(h(
        '<p class="blurb">Every figure on this page is evaluated here, from the rows this page ' +
        'is holding, following the formula the section was specified with. The board’s KPI ' +
        'registry is a second route. Where the two differ the difference is printed rather than ' +
        'hidden — and where the registry carries its own independent re-derivation, that third ' +
        'figure is shown too, because on this section it agrees with the page every time.</p>'
      ));
      const box = h('<div class="excl"><h3>' + gaps.length + ' of the section’s 20 figures differ</h3></div>');
      gaps.forEach(function (g) {
        const alt = (g.alt === null || g.alt === undefined) ? null : byUnit(g.alt, g.unit);
        box.appendChild(exclRow(
          (KPI[g.id] || {}).label || g.id,
          byUnit(g.mine, g.unit),
          'This page: <b>' + esc(byUnit(g.mine, g.unit)) + '</b> · registry: <b>' +
          esc(g.reg === null ? 'nothing stored' : byUnit(g.reg, g.unit)) + '</b>' +
          (alt ? ' · the registry’s own second route: <b>' + esc(alt) + '</b>' : '') +
          ' — <a href="' + esc(hrefDerivation(g.id, co)) + '">open the derivation</a>. ' +
          (g.reg === null
            ? 'The registry stores no primary figure for this id; the page computes it from the ' +
              'rows rather than leaving the card blank.'
            : (g.unit === 'pct' && g.reg === 50
                ? 'The registry stores a flat 50.0 here in every book, which is not a coverage ' +
                  'figure at all — it is a count-ratio the registry cannot express, defaulted. ' +
                  'The page counts the accounts.'
                : g.altAgrees
                  ? 'The registry’s stored primary route reads one column of a formula that ' +
                    'spans several; its own second route reproduces the figure on this page.'
                  : 'The two routes evaluate this id differently and neither reproduces the ' +
                    'other. Open the derivation and judge it yourself before quoting either.'))
        ));
      });
      c.appendChild(box);
      c.appendChild(cap(
        'A red dot beside a figure above says exactly this: two routes disagree, go and look. It ' +
        'never hides the number. This card exists because the alternative — rendering ' +
        '<code>manifest.value</code> whatever it says — would publish a 50% reconciliation ' +
        'coverage for a book measured at ' + esc(pc(FIG.v['reco-coverage-pct'])) + '. It is ' +
        'generated from whatever the manifest says right now, never from a hardcoded list, so it ' +
        'shrinks as the registry is fixed.'
      ));
      add(c);
    }
  }

  /* ── 4.14 the account table ──────────────────────────────────────────── */
  add(accountTable(FIG, co, asOf));

  /* ── 4.15 the event log ──────────────────────────────────────────────── */
  add(eventTable(FIG, co));

  /* ── 4.16 how to read this ───────────────────────────────────────────── */
  {
    const c = card('How to read this', 'every way a naive version of this page goes wrong');
    c.appendChild(h(
      '<p class="blurb">These are not caveats in the small-print sense. Each one is a specific, ' +
      'measured way that the obvious reading of this data produces a wrong number or a false ' +
      'assurance, found by attacking the query against live SAP.</p>'
    ));
    const ol = h('<div class="prose"><ol></ol></div>');
    const list = ol.querySelector('ol');
    TRAPS.forEach(function (t) { list.appendChild(h('<li>' + esc(rupee(t)) + '</li>')); });
    c.appendChild(ol);
    c.appendChild(h(
      '<p class="tnote">The global corrections that touch this section: ' +
      ['C-0005', 'C-0021'].map(cv).join(' ') + '. ' + cv('C-0005') + '’s 23 intercompany ' +
      'CardCodes and the <code>OCRG \'%BRANCH%\'</code> test are <b>party-side</b> tests and ' +
      'cannot be applied to a G/L row, which is why nothing is excluded here on that ground — ' +
      'a bank account is reconciled as one account against one statement, not per branch. ' +
      'Storno pairs (' + cv('C-0021') + ') are likewise kept: both legs post to the ledger and ' +
      'dropping one would break the exact tie to <code>OACT.CurrTotal</code>.</p>'
    ));
    c.appendChild(note(SECTION));
    add(c);
  }

  /* ── 4.17 the SQL ────────────────────────────────────────────────────── */
  add(await sqlCard(der, co));

  paintFoot(m, co, asOf, FIG);
}

/* ══ 5. pieces ═══════════════════════════════════════════════════════════ */

/**
 * The standing banner (spec empty_state 8). CO_STMT_IMPORT_ROWS_N = 0 must NOT
 * be rendered as a quiet zero KPI: it is the fact that decides what every other
 * number on the page can mean. If it ever goes non-zero the section's whole
 * framing changes and the caveats have to be rewritten before it is trusted.
 */
function statementBanner(FIG, co) {
  const loaded = FIG.v['reco-statement-lines-loaded'];
  const box = h('<div class="excl"></div>');

  if (loaded === null || loaded === undefined) {
    box.appendChild(h('<h3>The statement count could not be read</h3>'));
    box.appendChild(exclRow(
      'Bank statement lines in SAP', 'not computed',
      '<code>CO_STMT_IMPORT_ROWS_N</code> is missing from this slice, so the page cannot state ' +
      'whether a statement has ever been loaded. Until it can, treat nothing here as assurance.'
    ));
    return box;
  }

  if (Number(loaded) > 0) {
    box.appendChild(h('<h3>Statement lines have appeared in SAP — this page needs rewriting</h3>'));
    box.appendChild(exclRow(
      'Bank statement lines loaded', num(loaded),
      '<b>This has never been non-zero before.</b> <code>BNK1</code> and <code>BNK2</code> were ' +
      'empty in all three books when this section was built, which is why every caption here says ' +
      'the section cannot compare the bank against the books. With statement lines present that ' +
      'framing is out of date and the caveats must be revised before this number is trusted.'
    ));
    return box;
  }

  box.appendChild(h('<h3>No bank statement has ever been loaded into SAP</h3>'));
  box.appendChild(exclRow(
    'Bank statement lines in SAP', '0 — measured, not unknown',
    '<code>BNK1</code> = 0 rows and <code>BNK2</code> = 0 rows in ' + esc(companyLabel(co)) +
    '. There is not one statement line in the system to match anything against, and ' +
    '<code>OBNK."balance"</code> — the field that would hold a bank-supplied closing balance — is ' +
    '<b>0.000000 on all 259 OBNK rows across all three books</b>, verified exhaustively rather ' +
    'than sampled. <code>OBNK</code> here is not a statement table: it is a reconciliation ' +
    '<b>log</b>, one row per event, carrying a single lump figure that SAP itself derived from ' +
    'the ledger.'
  ));
  box.appendChild(exclRow(
    'So what this page can and cannot say', 'status, not assurance',
    '<b>It can say</b> whether an account has ever been reconciled, when it last was, how many ' +
    'ledger lines a reconciliation covers, and what has never been agreed at all. <b>It can ' +
    'never say whether a reconciliation was right.</b> Any caption implying otherwise is false. ' +
    'The two figures that look most like assurance — the tie-out and the gap at the last ' +
    'reconciliation — are both book-against-book, and the tie-out is a tautology SAP enforces. ' +
    'Both are set out in full further down and in ' + methodLink('the methodology') + '.'
  ));
  box.appendChild(exclRow(
    'And there are no cheques to age', (FIG.coCheques === 0 ? '0 cheque documents' : num(FIG.coCheques)),
    'RCT1, VPM1, OCHO, OCHH, ODPS and DPS1 are 0 rows in all three books and <code>CheckSum</code> ' +
    'is non-zero on no uncancelled receipt or payment. JIVO banks by transfer plus a little cash. ' +
    '<b>There is therefore no “uncleared cheque ageing” anywhere in this data</b> — an earlier ' +
    'version of this dashboard captioned the 90-day-plus money-out figure “cheques likely stale” ' +
    'under ₹101 Cr, and that caption was false on the section’s own data. What is aged here is ' +
    'unreconciled bank <b>ledger items</b>, which is the correct equivalent.'
  ));
  return box;
}

/**
 * Coverage, on both denominators. They disagree by 3.7× in Mart, and publishing
 * one lets the reader pick whichever suits the argument (trap 26).
 */
function coverageCard(FIG, co) {
  const c = card('Coverage, on both honest denominators', 'RECONS_DONE_N over the ACCOUNT rows');

  if (!FIG.accounts.length) {
    c.appendChild(empty({
      what: 'No account rows to measure coverage against.',
      why: 'The slice carried a roll-up row and nothing else, which is a build failure rather ' +
           'than an empty book.'
    }));
    return c;
  }

  c.appendChild(meter(FIG.everDone.length, FIG.accounts.length, {
    title: 'Against EVERY account in the universe',
    label: 'ever reconciled', maxLabel: 'accounts in the book',
    unit: 'count', warnAt: 0.8, badAt: 0.5, invert: false, table: false
  }));
  c.appendChild(meter(FIG.activeDone.length, FIG.withLines.length, {
    title: 'Against accounts that actually carry a ledger line',
    label: 'ever reconciled', maxLabel: 'accounts that move',
    unit: 'count', warnAt: 0.8, badAt: 0.5, invert: false, table: false
  }));

  const gapPct = (FIG.v['reco-coverage-pct'] && FIG.v['reco-coverage-pct-active'])
    ? (FIG.v['reco-coverage-pct-active'] / FIG.v['reco-coverage-pct']) : null;

  c.appendChild(cap(
    '<b>Two denominators, both honest, and they disagree.</b> Against every account in the ' +
    'universe ' + esc(companyLabel(co)) + ' is at <b>' + esc(pc(FIG.v['reco-coverage-pct'])) +
    '</b>; against accounts that actually carry a ledger line it is <b>' +
    esc(pc(FIG.v['reco-coverage-pct-active'])) + '</b>' +
    (gapPct && gapPct > 1.2 ? ', a factor of ' + esc(gapPct.toFixed(1)) + '×' : '') + '. The gap ' +
    'is ' + num(FIG.accounts.length - FIG.withLines.length) + ' account' +
    (FIG.accounts.length - FIG.withLines.length === 1 ? '' : 's') + ' with no ledger line at all — ' +
    'empty deposit, loan and card heads that <b>cannot</b> be reconciled and are not a control ' +
    'failure. The number that IS a failure is the exact status count: <b>' +
    num(FIG.never.length) + ' live account' + (FIG.never.length === 1 ? '' : 's') +
    ' with ledger lines and no reconciliation event, ever.</b>'
  ));
  c.appendChild(cap(
    '<b>The status literal must be matched exactly.</b> The five values are ' +
    STATUS_ORDER.map(function (s) { return '<code>' + esc(s) + '</code>'; }).join(' · ') +
    ' — and <code>NEVER_RECONCILED</code> is a substring of ' +
    '<code>DORMANT_NEVER_RECONCILED</code>, so a naive containment test folds this book’s ' +
    num(FIG.dormant.length) + ' empty account' + (FIG.dormant.length === 1 ? '' : 's') +
    ' into the failure count and reports ' + num(FIG.everUnrec.length) + ' instead of ' +
    num(FIG.never.length) + '. An earlier renderer compared against <code>NEVER</code> and ' +
    '<code>CURRENT</code>, neither of which has ever been emitted, and painted all 132 accounts ' +
    'across the three books amber.'
  ));
  return c;
}

/**
 * The matrix. Coverage is not thin evenly — it is thin exactly where the money
 * is, and there is not one RECONCILED_CURRENT cell in any of the three books.
 * Dormant rows are drawn as what they are, never as a failure.
 */
function matrixCard(FIG, co) {
  const c = card('Who is being reconciled, and who is not', 'RECO_STATUS × ACCT_KIND, account count');

  const kinds = KIND_ORDER.filter(function (k) {
    return FIG.accounts.some(function (r) { return r.ACCT_KIND === k; });
  });
  if (!kinds.length) {
    c.appendChild(empty({
      what: 'No account in this book carries a recognised kind.',
      why: 'ACCT_KIND follows the chart-of-accounts drawer, and every account resolved to none ' +
           'of the six known values. That is a broken drawer walk, not an empty book.'
    }));
    return c;
  }

  /* every status gets a row, including RECONCILED_CURRENT: a MEASURED zero
     everywhere is the finding, and leaving the row out would hide it. */
  const cells = [];
  STATUS_ORDER.forEach(function (st) {
    kinds.forEach(function (k) {
      const set = FIG.accounts.filter(function (r) { return r.RECO_STATUS === st && r.ACCT_KIND === k; });
      cells.push({ row: STATUS_SHORT[st] || st, col: KIND_SHORT[k] || k, value: set.length });
    });
  });
  c.appendChild(heatmap(cells, {
    title: 'Accounts by status and kind, ' + companyLabel(co),
    unit: 'count', cellH: 30, table: true,
    tableNote: 'Every status gets a row even where it is empty — a status with no accounts ' +
               'anywhere is a finding, not a gap.'
  }));
  c.appendChild(h(
    '<p class="tnote"><b>The axes are abbreviated so they survive a narrow screen.</b> Rows: ' +
    STATUS_ORDER.map(function (s) {
      return '<b>' + esc(STATUS_SHORT[s]) + '</b> ' + esc(String(STATUS_PLAIN[s]).toLowerCase());
    }).join(' · ') + '. Columns: ' +
    kinds.map(function (k) {
      return '<b>' + esc(KIND_SHORT[k] || k) + '</b> ' + esc(String(KIND_PLAIN[k] || k).toLowerCase());
    }).join(' · ') + '.</p>'
  ));

  /* where the money sits inside that grid — the cell can only carry one number,
     so the money view is stated rather than shaded. */
  const byStatus = STATUS_ORDER.map(function (st) {
    const set = FIG.accounts.filter(function (r) { return r.RECO_STATUS === st; });
    return { st: st, n: set.length, thru: sumCol(set, 'THROUGHPUT_L') };
  }).filter(function (x) { return x.n > 0; });
  const worst = byStatus.filter(function (x) { return x.st.indexOf('RECONCILED') !== 0; })
                        .sort(function (a, b) { return b.thru - a.thru; })[0];
  const topNever = FIG.everUnrec.slice().sort(function (a, b) {
    return rup(b, 'THROUGHPUT_L') - rup(a, 'THROUGHPUT_L');
  })[0];

  const current = FIG.accounts.filter(function (r) { return r.RECO_STATUS === 'RECONCILED_CURRENT'; });

  c.appendChild(cap(
    '<b>The cell is the account count.</b> The money view is the two charts below, because a ' +
    'heat cell can carry one number and the count is the one that answers “who”. ' +
    (worst
      ? 'The unchecked side of this grid is not small: <b>' + esc(inr(worst.thru)) +
        '</b> of gross movement has run through the ' + num(worst.n) + ' account' +
        (worst.n === 1 ? '' : 's') + ' in “' + esc(STATUS_PLAIN[worst.st]) + '”' +
        (topNever ? ', ' + esc(inr(rup(topNever, 'THROUGHPUT_L'))) + ' of it through ' +
                    '<code>' + esc(topNever.ACCT_CODE) + '</code> ' + esc(topNever.ACCT_NAME) +
                    ' alone' : '') + '. '
      : '') +
    '<b>There is not one “' + esc(STATUS_PLAIN.RECONCILED_CURRENT) + '” account in this book' +
    (current.length ? '' : ', and none in any of the three') + '.</b> ' +
    'The empty row is a measured zero, drawn rather than omitted.'
  ));
  c.appendChild(cap(
    '<b>Dormant is not a failure and is never drawn as one.</b> ' + num(FIG.dormant.length) +
    ' account' + (FIG.dormant.length === 1 ? '' : 's') + ' in this book ' +
    (FIG.dormant.length === 1 ? 'has' : 'have') + ' no ledger line at all — an empty deposit, ' +
    'loan or card head cannot be reconciled. <b>Cash and wallets are the other thing this grid ' +
    'shows honestly:</b> a till or a payment-gateway wallet needs a cash count or a settlement ' +
    'report, neither of which is in SAP, so they are in the universe but they are not ' +
    'bank-reconcilable. ' +
    'The kind comes from the chart-of-accounts DRAWER, never from the account name or the code ' +
    'prefix — <code>%BANK%</code> also catches BANK CHARGES and TDS RECOVERABLE FROM BANK, and ' +
    'the prefix lies (accounts numbered 1104* hang under BANK CASH CREDIT LOAN and 1103* under ' +
    'FDR). The cost of doing it right is that Oil’s <code>1103115 R &amp; D WHEAT GRASS</code> is ' +
    'classified DEPOSIT; it is plainly not a bank account and is left in on purpose, because ' +
    'filtering it out by name would be exactly the trap.'
  ));

  if (FIG.unmapped.length) {
    const box = h('<div class="excl"><h3>Data-quality warning: an account escaped its category</h3></div>');
    FIG.unmapped.forEach(function (r) {
      box.appendChild(exclRow(
        (r.ACCT_CODE || '—') + ' ' + (r.ACCT_NAME || ''), String(r.ACCT_KIND || 'no kind'),
        'The drawer walk hit a parent it does not map: <code>' + esc(r.DRAWER_NAME || 'no drawer') +
        '</code>. This is surfaced rather than bucketed quietly into “other”, because the ' +
        'cash-and-wallet exclusion filters on this page depend on the six known kinds ' +
        'partitioning the universe.'
      ));
    });
    c.appendChild(box);
  }
  return c;
}

/**
 * The section's most misreadable figure, drawn so it cannot be misread. The
 * small segment is a list of items to chase; the large one is a list of
 * accounts nobody has ever opened.
 */
function splitCard(FIG, co) {
  const c = card('The 90-day-plus number is two different problems',
    'UNREC_90PLUS_L split on RECO_STATUS LIKE \'RECONCILED%\'');

  const gross = FIG.v['reco-90plus-gross'];
  if (gross === null || (!FIG.excValue && !FIG.covValue)) {
    c.appendChild(empty({
      what: 'Nothing in this book has been unagreed for more than 90 days.',
      why: 'Every UNREC_90PLUS_L is nil. Read it against the unagreed line count of ' +
           num(FIG.v['reco-unrec-lines-n']) + ' before treating it as a clean book — a nil here ' +
           'with unagreed lines present would mean every one of them is under 90 days old.'
    }));
    return c;
  }

  /* one bar, two segments. The keys carry RUPEES, not lakhs: charts.js never
     scales — it renders what it is handed — so the lift happens once, here. */
  c.appendChild(stackedBars([{
    LABEL: companyLabel(co),
    EXC: FIG.excValue,
    COV: FIG.covValue
  }], {
    labelKey: 'LABEL',
    keys: [
      { key: 'EXC', label: 'Items to chase (' + num(FIG.excItems) + ')', color: '--c3' },
      { key: 'COV', label: 'Accounts never opened (' + num(FIG.covItems) + ')', color: '--c4' }
    ],
    scheme: 'cat', title: 'Where the 90-day-plus money actually sits', height: 130, table: true
  }));

  const covShare = (FIG.excValue + FIG.covValue) ? 100 * FIG.covValue / (FIG.excValue + FIG.covValue) : null;

  c.appendChild(kpiRow([
    kitem(FIG, 'reco-90plus-gross', {
      tone: 'warn',
      sub: 'the blend — ' + num(FIG.allItems) + ' items, and quoting it sends someone chasing ' +
           'all of them'
    }),
    kitem(FIG, 'reco-90plus-exceptions', {
      tone: FIG.excValue > 0 ? 'bad' : 'ok',
      sub: FIG.excValue > 0
        ? num(FIG.excItems) + ' item' + (FIG.excItems === 1 ? '' : 's') +
          ' on the ' + num(FIG.everDone.length) + ' accounts JIVO does reconcile — this is the list'
        : 'a MEASURED zero: nothing older than 90 days on the ' + num(FIG.everDone.length) +
          ' account' + (FIG.everDone.length === 1 ? '' : 's') + ' this book reconciles. ' +
          'Not an em dash, not “not computed” — nil items.'
    }),
    kitem(FIG, 'reco-90plus-bank-only', {
      sub: num(FIG.bankItems) + ' items once cash tills and payment wallets come out — they ' +
           'dominate the count and are trivial in money'
    }),
    kitem(FIG, 'reco-90plus-payments', {
      tone: 'warn',
      sub: 'the one-sided read: credits on a bank account, i.e. money that LEFT'
    })
  ]));

  c.appendChild(cap(
    '<b>The smaller half is the one worth acting on.</b> ' +
    (FIG.excValue > 0
      ? esc(inr(FIG.excValue)) + ' across <b>' + num(FIG.excItems) + ' item' +
        (FIG.excItems === 1 ? '' : 's') + '</b> sits on accounts this book actually reconciles: ' +
        'that is an exception list a person can work through in a morning. '
      : 'This book has <b>nothing</b> older than 90 days on an account it reconciles — a measured ' +
        'zero, with the coverage figure beside it. ') +
    (FIG.covValue > 0
      ? 'The other ' + esc(inr(FIG.covValue)) + ' across ' + num(FIG.covItems) + ' items — ' +
        esc(covShare === null ? '' : pc(covShare)) + ' of the total — is not an exception list at ' +
        'all. <b>It is a coverage failure:</b> items on accounts nobody has ever opened a ' +
        'reconciliation on. They are not overdue, they are unlooked-at, and the fix is a ' +
        'reconciliation, not a chase. '
      : '') +
    'This is the single most useful distinction on the page, and it is one filter away.'
  ));
  c.appendChild(cap(
    '<b>Gross movement, not exposure.</b> The bucket sums <code>Debit + Credit</code>, so a ' +
    'debit/credit pair that nets to zero still contributes both legs, and a busy current account ' +
    'shows a quarter of throughput rather than an amount at risk. It is deliberate — an uncleared ' +
    'item has a size whichever way it points — but it means <b>storno pairs inflate it</b>: ' +
    'measured inside this book’s 90-day-plus bucket on 2026-08-21, ' +
    num(REVIEWED[co] ? REVIEWED[co].stornoLines : null) + ' lines worth ' +
    esc(REVIEWED[co] ? inr(REVIEWED[co].stornoLakhs * 1e5) : 'not measured') + ', or ' +
    esc(REVIEWED[co] ? pc(REVIEWED[co].stornoPct) : '') + ' of it. Each pair nets to zero, so the ' +
    'net position is untouched; only the gross ageing and the line counts are inflated. They are ' +
    'kept because both legs post to the ledger and dropping one would break the exact tie to ' +
    '<code>OACT.CurrTotal</code> (' + cv('C-0021') + '). Read <b>' +
    esc(inr(FIG.v['reco-unagreed-balance'])) + '</b> for the net position instead.'
  ));
  c.appendChild(cap(
    '<b>And money out unagreed for more than 90 days is never “stale cheques”.</b> There are no ' +
    'cheques anywhere in SAP: ' + (FIG.coCheques === 0 ? 'nil cheque documents in this book' :
      num(FIG.coCheques) + ' cheque documents') + ', and RCT1, VPM1, OCHO, OCHH, ODPS and DPS1 are ' +
    'all empty in all three books. ' + esc(inr(FIG.v['reco-90plus-payments'])) + ' of unagreed ' +
    'money out is exactly that — bank ledger credits nobody has reconciled — and it is the closest ' +
    'thing this section has to stale outgoing items.'
  ));
  return c;
}

/** The ageing of the unagreed items, banks and facilities only. */
function ageingCard(FIG, co) {
  const c = card('Age of the unagreed items, banks and facilities only',
    'UNREC_0_30_L · UNREC_31_60_L · UNREC_61_90_L · UNREC_90PLUS_L');

  const live = FIG.bankish.filter(function (r) {
    return BUCKETS.some(function (b) { return rup(r, b) > 0; });
  }).sort(function (a, b) { return rup(b, 'UNREC_90PLUS_L') - rup(a, 'UNREC_90PLUS_L'); });

  if (!live.length) {
    c.appendChild(empty({
      what: 'No bank, cash-credit, deposit or loan account in this book carries an unagreed item.',
      why: 'Every one of the four buckets is nil across ' + num(FIG.bankish.length) +
           ' account' + (FIG.bankish.length === 1 ? '' : 's') + '. That is a measured nil rather ' +
           'than a missing bucket — the four buckets sum exactly to unagreed receipts plus ' +
           'unagreed payments on every row, so a gap would show as a mismatch, not a blank.'
    }));
    return c;
  }

  /* the bar rows carry RUPEES under the bucket column names, because charts.js
     keys its ageing labels and colours off those names and never scales. */
  c.appendChild(stackedBars(live.slice(0, 14).map(function (r) {
    const o = { ACCT: (r.ACCT_CODE || '') + ' ' + String(r.ACCT_NAME || '').slice(0, 26) };
    BUCKETS.forEach(function (b) { o[b] = rup(r, b); });
    return o;
  }), {
    labelKey: 'ACCT', keys: BUCKETS, table: true,
    title: 'Unagreed gross movement by age, ' + companyLabel(co),
    tableNote: 'Gross movement (Debit + Credit), not exposure. Ordered by the 90-day-plus segment.'
  }));

  const shown = Math.min(14, live.length);
  c.appendChild(cap(
    '<b>Excluding cash tills and payment wallets is what makes this readable.</b> They are in the ' +
    'universe and they are not bank-reconcilable: this book’s ' + num(FIG.cashWallet.length) +
    ' cash and wallet account' + (FIG.cashWallet.length === 1 ? '' : 's') + ' carry <b>' +
    num(FIG.cwItems) + ' of the ' + num(FIG.allItems) + ' 90-day-plus items</b> — ' +
    esc(pc(FIG.allItems ? 100 * FIG.cwItems / FIG.allItems : null)) + ' of the count — worth only ' +
    esc(inr(FIG.cwValue)) + '. With them in, the micro-items from a payment gateway bury the ' +
    'genuinely large balances. Filtering to bank, cash-credit, deposit and loan leaves <b>' +
    num(FIG.bankItems) + ' items worth ' + esc(inr(FIG.v['reco-90plus-bank-only'])) + '</b>. ' +
    'A till needs a cash count and a wallet needs a settlement report; treating either as a ' +
    'bank-reconciliation failure is simply wrong.'
  ));
  c.appendChild(cap(
    'These four buckets are the <b>only additive set</b> in the section: they sum exactly to ' +
    'unagreed receipts plus unagreed payments, and their counts to <code>UNREC_LINES_N</code>, ' +
    'verified on all 132 account rows and all three roll-ups with a maximum per-row delta of ' +
    '₹1,000. That is the check to run against a changed bucket boundary — an overlap or a gap ' +
    'shows up as a mismatch here first. ' +
    (live.length > shown
      ? num(live.length - shown) + ' further account' + (live.length - shown === 1 ? '' : 's') +
        ' with unagreed items ' + (live.length - shown === 1 ? 'is' : 'are') +
        ' below the cut and ' + (live.length - shown === 1 ? 'is' : 'are') +
        ' in the account table.'
      : 'Every bank-side account with an unagreed item is drawn.')
  ));
  return c;
}

/**
 * How much rides on each account against how long since anyone checked it.
 * Never-reconciled accounts have NO x value — plotting them at zero days would
 * say "reconciled today" — so they get their own band, in words, beside the
 * chart rather than at a made-up coordinate.
 */
function exposureCard(FIG, co) {
  const c = card('How much rides on each account against how long since anyone checked it',
    'DAYS_SINCE_RECON_N × THROUGHPUT_L');

  const pts = FIG.everDone.filter(function (r) {
    return numOrNull(r, 'DAYS_SINCE_RECON_N') !== null;
  }).map(function (r) {
    return {
      x: Number(r.DAYS_SINCE_RECON_N),
      y: rup(r, 'THROUGHPUT_L'),
      label: (r.ACCT_CODE || '') + ' ' + String(r.ACCT_NAME || '').slice(0, 24),
      group: KIND_PLAIN[r.ACCT_KIND] || r.ACCT_KIND,
      ACCT_CODE: r.ACCT_CODE
    };
  });

  if (pts.length) {
    c.appendChild(scatter(pts, {
      title: 'One dot per account that has ever been reconciled',
      xLabel: 'days since its last reconciliation', yLabel: '₹ moved',
      height: 250,
      href: function (p) { return (p && p.src && p.src.ACCT_CODE) ? hrefBank(p.src.ACCT_CODE, co) : null; }
    }));
  } else {
    c.appendChild(empty({
      what: 'No account in this book has ever been reconciled, so there is no “days since” to plot.',
      why: 'Every account is NEVER_RECONCILED or DORMANT_NEVER_RECONCILED, which means ' +
           'DAYS_SINCE_RECON_N is NULL on all of them. A NULL here is not zero — zero would read ' +
           'as “reconciled today”, the exact opposite. The whole book is the band below.'
    }));
  }

  /* the never band. These rows ARE the finding; dropping them removes the
     largest exposures in every book from the page (trap 21, empty_state 7). */
  const band = FIG.everUnrec.filter(function (r) { return rup(r, 'THROUGHPUT_L') > 0; })
    .sort(function (a, b) { return rup(b, 'THROUGHPUT_L') - rup(a, 'THROUGHPUT_L'); });

  const box = h('<div class="excl"><h3>The “never” band — no x value at all, and the whole point</h3></div>');
  if (band.length) {
    band.slice(0, 8).forEach(function (r) {
      const bal = rupOrNull(r, 'GL_BAL_L');
      box.appendChild(exclRow(
        (r.ACCT_CODE || '—') + ' ' + (r.ACCT_NAME || ''),
        inr(rup(r, 'THROUGHPUT_L')),
        (KIND_PLAIN[r.ACCT_KIND] || r.ACCT_KIND) + ' · ' + num(r.GL_LINES_N) + ' ledger lines · ' +
        'book balance ' + esc(bal === null ? 'not computed' : inr(bal)) +
        ' · <b>never reconciled, not once</b> · ' +
        '<a href="' + esc(hrefBank(r.ACCT_CODE, co)) + '">open the account</a>'
      ));
    });
    if (band.length > 8) {
      box.appendChild(exclRow(
        num(band.length - 8) + ' more never-reconciled accounts with movement', '',
        'They are in the chase list below and in the account table, filtered on the ' +
        '<code>' + esc(STATUS_PLAIN.NEVER_RECONCILED) + '</code> chip.'
      ));
    }
  } else {
    box.appendChild(exclRow(
      'Nothing in the band', 'none',
      'Every account with movement in this book has been reconciled at least once — a measured ' +
      'nil, and the only good state this section has.'
    ));
  }
  c.appendChild(box);

  c.appendChild(cap(
    '<b>Why they are not dots.</b> A never-reconciled account has no “days since” — the column is ' +
    'NULL, not zero — and drawing it at x = 0 would put the worst accounts in the book where ' +
    '“reconciled today” lives. Dropping them would be worse still: they hold the largest ' +
    (band.length ? 'exposure here, ' + esc(inr(rup(band[0], 'THROUGHPUT_L'))) + ' through ' +
      '<code>' + esc(band[0].ACCT_CODE) + '</code> ' + esc(band[0].ACCT_NAME) + ' alone. '
                 : 'exposures in the other two books. ') +
    'So they sit beside the chart, named, with the reason. ' +
    'The dots that ARE drawn read top-right first: busy and unchecked for a long time. ' +
    '<span class="faint">(The y axis is linear, so one very busy account flattens the rest ' +
    'against the floor; the disclosure under the chart carries every point with its figures.)</span>'
  ));
  c.appendChild(cap(
    '<b>Gross movement is not turnover and must never be read as one.</b> It is ' +
    '<code>SUM(Debit + Credit)</code> on a bank account, so a rupee in and back out counts twice, ' +
    'and it includes intercompany transfers — measured on 2026-08-21, ' +
    (REVIEWED[co]
      ? num(REVIEWED[co].intercoLines) + ' lines and ' + esc(inr(REVIEWED[co].intercoGrossCr * 1e7)) +
        ' gross in this book'
      : 'large in both of the trading books') +
    '. This book’s whole-universe figure of ' + esc(inr(FIG.throughput)) + ' is bank traffic, not ' +
    'sales. It is useful for exactly one thing: sizing how much rides on an account nobody has ' +
    'checked.'
  ));
  return c;
}

/** The ranked chase list behind reco-never-throughput. */
function neverCard(FIG, co) {
  const c = card('Money that has moved through accounts nobody has ever reconciled',
    'THROUGHPUT_L where RECO_STATUS carries NEVER_RECONCILED');

  const list = FIG.everUnrec.filter(function (r) { return rup(r, 'THROUGHPUT_L') > 0; });

  if (!list.length) {
    c.appendChild(empty({
      what: 'Every account with movement in this book has been reconciled at least once.',
      why: 'A measured nil: no account carrying gross movement is NEVER_RECONCILED or ' +
           'DORMANT_NEVER_RECONCILED. That has not been true of any of the three books at this ' +
           'build — check the coverage figures above before reading it as a clean sheet.'
    }));
    return c;
  }

  /* A pareto rather than a plain ranked list: the cumulative line answers the
     question this card exists for — how much of the unchecked exposure sits on
     how few accounts. charts.js paints every pareto bar `--c1`, so the KIND
     leads each label instead of being carried by colour (CONTRACT §5: no chart
     may rely on colour alone, and here the difference between a bank account
     and a cash till is the difference between a finding and a category error). */
  c.appendChild(pareto(list.map(function (r) {
    return {
      label: (KIND_PLAIN[r.ACCT_KIND] || r.ACCT_KIND) + ' · ' + (r.ACCT_CODE || '') + ' ' +
             String(r.ACCT_NAME || '').slice(0, 24),
      value: rup(r, 'THROUGHPUT_L'),
      ACCT_CODE: r.ACCT_CODE
    };
  }), {
    title: 'Gross movement on unreconciled accounts, ' + companyLabel(co),
    top: 10, threshold: 80, table: true,
    href: function (it) {
      return (it && it.src && it.src.ACCT_CODE) ? hrefBank(it.src.ACCT_CODE, co) : null;
    }
  }));

  c.appendChild(kpiRow([
    kitem(FIG, 'reco-never-throughput', {
      tone: 'bad',
      sub: 'across ' + num(FIG.everUnrec.length) + ' account' +
           (FIG.everUnrec.length === 1 ? '' : 's') + ' with no reconciliation event, ever'
    }),
    kitem(FIG, 'reco-unrec-lines-n', {
      sub: 'ledger LINES, so both legs of a storno pair count as two items'
    }),
    kitem(FIG, 'reco-oldest-unrec-days', {
      tone: 'warn',
      sub: FIG.oldestDate ? 'the earliest unagreed item in the book, dated ' + FIG.oldestDate
                          : 'no unagreed item in this book carries a date'
    })
  ]));

  const bars = list.slice().sort(function (a, b) { return rup(b, 'THROUGHPUT_L') - rup(a, 'THROUGHPUT_L'); });
  const tills = bars.filter(isCashOrWallet);
  const totalThru = FIG.v['reco-never-throughput'];
  let run = 0, n80 = 0;
  for (const r of bars) { run += rup(r, 'THROUGHPUT_L'); n80++; if (totalThru && run >= 0.8 * totalThru) break; }
  const top1 = bars.length ? rup(bars[0], 'THROUGHPUT_L') : 0;

  c.appendChild(cap(
    '<b>The kind leads every label, because the top of this list is not all the same problem.</b> ' +
    (tills.length
      ? num(tills.length) + ' of these ' + (tills.length === 1 ? 'is' : 'are') + ' a cash till or ' +
        'a payment wallet' +
        (tills[0] ? ' — the largest is <code>' + esc(tills[0].ACCT_CODE) + '</code> ' +
                    esc(tills[0].ACCT_NAME) + ' at ' + esc(inr(rup(tills[0], 'THROUGHPUT_L'))) : '') +
        ' — and belongs to a cash count or a settlement report, not to a bank reconciliation. ' +
        'The bank and facility bars are the real chase list. '
      : 'Every account here is a bank, facility, deposit or loan account — all of them genuinely ' +
        'bank-reconcilable. ') +
    (totalThru
      ? '<b>The cumulative line is why this is a short list, not a programme:</b> the single ' +
        'largest account carries ' + esc(pc(100 * top1 / totalThru)) + ' of the unchecked ' +
        'movement in this book, and ' + num(n80) + ' account' + (n80 === 1 ? '' : 's') + ' of ' +
        num(bars.length) + ' account' + (bars.length === 1 ? '' : 's') + ' for 80% of it. '
      : '')
  ));
  c.appendChild(cap(
    'The oldest unagreed item in this book is <b>' + esc(num(FIG.v['reco-oldest-unrec-days'])) +
    ' days old</b>, dated ' + esc(String(FIG.oldestDate || 'not computed')) + '. In all three ' +
    'books that date falls on, or within days of, the ledger’s own first line — the migration ' +
    'entry that opened the book, whose date the ' +
    '<a href="' + esc(hrefSection('banks', co)) + '">bank register</a> carries per book. Read it ' +
    'as the starting position rather than a lost transaction: it has never been reconciled ' +
    'because there is nothing before it to reconcile it against. It is still the number that ' +
    'sets the age of the ageing.'
  ));
  return c;
}

/** Book, agreed, never agreed — and the caption that stops it reading as assurance. */
function waterfallCard(FIG, co, asOf) {
  const c = card('What the book says, what SAP records as agreed, what nobody has ever agreed',
    'GL_BAL_L → RECONCILED_BAL_L → UNRECONCILED_DIFF_L, TOTAL row');

  if (FIG.glBal === null || FIG.recBal === null) {
    c.appendChild(empty({
      what: 'The roll-up row is missing a balance, so the walk cannot be drawn.',
      why: 'GL_BAL_L or RECONCILED_BAL_L is absent from the TOTAL row. Exactly one TOTAL row is ' +
           'emitted per company by construction, so this is a broken build rather than a nil ' +
           'position.'
    }));
    return c;
  }

  /* book − agreed = never agreed. The middle step's DELTA is therefore MINUS
     the agreed balance: removing a credit balance moves the walk UP. `kind` is
     left off so the sign decides, which keeps it right in a book where the
     agreed balance is a debit (Mart, Beverages) as well as one where it is a
     credit (Oil). */
  c.appendChild(waterfall([
    { label: 'Book balance, whole universe', value: FIG.glBal, kind: 'base' },
    { label: 'Agreed balance removed', value: -FIG.recBal, k: 'reco-unagreed-balance' },
    { label: 'Never agreed', value: FIG.v['reco-unagreed-balance'], kind: 'total',
      k: 'reco-unagreed-balance' }
  ], {
    title: 'Ledger-native signs: a negative bar is an overdraft or a loan, not a shortfall',
    table: true,
    href: function (s) { return (s && s.src && s.src.k) ? hrefDerivation(s.src.k, co) : null; }
  }));

  c.appendChild(kpiRow([
    kitem(FIG, 'reco-unagreed-balance', {
      tone: 'warn',
      sub: 'signed, ledger convention — positive is money the books say is in the bank, ' +
           'negative is an overdraft or a loan drawn'
    }),
    kitem(FIG, 'reco-lines-agreed-pct', {
      sub: num(FIG.recLines) + ' of ' + num(FIG.glLines) + ' bank ledger lines carry a live ' +
           'external reconciliation'
    }),
    kitem(FIG, 'reco-events-n', {
      sub: 'COUNT(DISTINCT OBNK.BankMatch) — one row per reconciliation event, not per statement line'
    })
  ]));

  c.appendChild(cap(
    '<b>Read the middle bar as a removal, not a balance.</b> The arithmetic is <i>book balance ' +
    'less agreed balance = never agreed</i>, so the bar shows what taking the agreed balance out ' +
    'DOES to the walk, not the agreed balance itself. On this book that agreed balance is <b>' +
    esc(inr(FIG.recBal)) + '</b>' +
    (FIG.recBal < 0
      ? ', a credit — and removing a credit moves the walk upward, which is why the bar points ' +
        'the opposite way from the figure it removes.'
      : ', a debit, so removing it moves the walk down.') +
    ' The closing figure is ' + esc(inr(FIG.v['reco-unagreed-balance'])) + '.'
  ));
  c.appendChild(cap(
    '<b>What SAP records as agreed is not what a bank agreed — SAP forces it to equal the ledger.</b> ' +
    'No bank statement has ever entered SAP (<code>BNK1</code> = <code>BNK2</code> = 0 rows in all ' +
    'three books) and <code>OBNK."balance"</code> is 0.000000 on all 259 reconciliation rows, so ' +
    'the “agreed balance” is derived from <code>OBNK.DebAmount</code> and <code>CredAmnt</code> — ' +
    'SAP’s own record of its own arithmetic. <b>It is not a bank confirmation.</b> Read this walk ' +
    'as “how much of the book has anybody even looked at”, never as “how much the bank agrees ' +
    'with”. ' + methodLink('The methodology page') + ' carries the full statement.'
  ));
  c.appendChild(cap(
    '<b>The signs are the ledger’s, not a shortfall.</b> Positive is debit — money the books say ' +
    'is in the bank. Negative is credit — an overdraft drawn or a loan outstanding. ' +
    esc(companyLabel(co)) + '’s book-wide ' + esc(inr(FIG.glBal)) +
    (FIG.glBal < 0 ? ' is mostly borrowings and cash-credit facilities, not a missing ' +
                     esc(inr(Math.abs(FIG.glBal))) + '. ' : '. ') +
    'Plotting it raw draws every term loan as a deficit. The same convention runs through the ' +
    'agreed balance, the OBNK side, the never-agreed figure and every “at last reconciliation” ' +
    'column.'
  ));
  c.appendChild(cap(
    '<b>The lines-agreed share is a share of LINES, not of value.</b> A line counts as reconciled ' +
    'when its <code>(Account, ExtrMatch)</code> matches a reconciliation whose own statement date ' +
    'is on or before the as-of. That guard is not decoration: reconciliation batches reach ' +
    '<i>backwards</i> — the furthest in this data reached 547 days — so testing ' +
    '<code>ExtrMatch &gt; 0</code> alone would call items “reconciled” five months before the ' +
    'batch that cleared them existed. It was caught by the tie-out going non-zero at a back-dated ' +
    'as-of, and re-running at a past date and checking the tie-out is still nil is the only ' +
    'self-check in this section that has ever found a real defect.'
  ));

  /* MOVEMENT_SINCE_RECON_L: the one money column that does not re-total. */
  if (FIG.moveTotal !== null || FIG.moveNullRows) {
    const box = h('<div class="excl"><h3>One money column here does not add up, on purpose</h3></div>');
    const sameSign = (FIG.moveTotal !== null && FIG.moveFromRows !== null &&
                      (FIG.moveTotal < 0) === (FIG.moveFromRows < 0));
    box.appendChild(exclRow(
      'Movement since the last reconciliation', inr(FIG.moveTotal),
      '<b>Do not rebuild this from the account rows.</b> <code>MOVEMENT_SINCE_RECON_L</code> is ' +
      'NULL on every never-reconciled account — ' + num(FIG.moveNullRows) + ' row' +
      (FIG.moveNullRows === 1 ? '' : 's') + ' in this book — while the roll-up folds those ' +
      'accounts’ whole book balance in through <code>IFNULL(balance at reco, 0)</code>. Adding ' +
      'the account rows gives <b>' + esc(inr(FIG.moveFromRows)) + '</b> against the roll-up’s <b>' +
      esc(inr(FIG.moveTotal)) + '</b>, and the difference is exactly the ' +
      esc(inr(FIG.moveNullBal)) + ' of book balance sitting on those NULL rows' +
      (sameSign ? '. ' : ' — <b>which comes out with the opposite sign</b>. ') +
      'It is the only money column in the section that behaves this way, and it is why every ' +
      'other total here is read off the roll-up row or summed over ACCOUNT rows deliberately.'
    ));
    c.appendChild(box);
  }
  return c;
}

/**
 * Every reconciliation ever recorded, as an account × month grid. charts.js
 * ships no dot-plot timeline; a heat grid answers the same question and draws
 * the same cliff — the empty columns on the right ARE the gap to today.
 */
function timelineCard(FIG, co, asOf) {
  const c = card('Every reconciliation ever recorded, by account',
    'bank-reco detail — one OBNK row is one event');

  if (!FIG.detail.length) {
    c.appendChild(empty({
      what: 'No bank reconciliation has ever been recorded in this book.',
      why: 'The event log is empty: OBNK holds no row for any account in ' + companyLabel(co) +
           '. Not a rendering gap and not a missing join — there is nothing to draw. The coverage ' +
           'figures above are the whole story for this book.'
    }));
    return c;
  }

  const dates = FIG.detail.map(function (d) { return String(d.STMT_DATE || ''); }).filter(Boolean).sort();
  const first = dates[0], last = dates[dates.length - 1];
  const months = monthRange(first, asOf || last);

  /* one row per account that has ever been reconciled, one column per month
     from the first event to the as-of. Zero-filled: an empty cell is a month
     with no reconciliation, which is exactly the finding. */
  const byAcct = new Map();
  FIG.detail.forEach(function (d) {
    const key = (d.ACCT_CODE || '') + ' ' + String(d.ACCT_NAME || '').slice(0, 22);
    if (!byAcct.has(key)) byAcct.set(key, { key: key, last: '', cells: {} });
    const rec = byAcct.get(key);
    const ym = String(d.STMT_DATE || '').slice(0, 7);
    rec.cells[ym] = (rec.cells[ym] || 0) + (Number(d.LINES_CLEARED_N) || 0);
    if (ym > rec.last) rec.last = ym;
  });
  const accts = Array.from(byAcct.values()).sort(function (a, b) {
    return a.last === b.last ? (a.key < b.key ? -1 : 1) : (a.last < b.last ? -1 : 1);
  });

  const cells = [];
  accts.forEach(function (a) {
    months.forEach(function (ym) {
      cells.push({ row: a.key, col: monthLabel(ym), value: a.cells[ym] || 0 });
    });
  });

  c.appendChild(heatmap(cells, {
    title: 'Ledger lines cleared, by account and month · ' + companyLabel(co),
    unit: 'count', cellH: 26, table: true,
    tableNote: 'Zero-filled by construction: an empty cell is a month in which nobody reconciled ' +
               'that account, never a missing measurement.'
  }));

  const lastMonth = months.length ? months[months.length - 1] : null;
  const stopped = accts.filter(function (a) { return a.last < String(asOf || '').slice(0, 7); });
  const worstStop = accts.slice().sort(function (a, b) { return a.last < b.last ? -1 : 1; })[0];

  c.appendChild(cap(
    '<b>The right-hand edge is the finding.</b> The grid runs to the as-of month ' +
    (lastMonth ? '(' + esc(monthLabel(lastMonth)) + ')' : '') + ', so the empty columns after ' +
    'each account’s last cell are the distance between the last reconciliation and today — a ' +
    'visible gap rather than a number in a column. ' +
    (stopped.length
      ? '<b>' + num(stopped.length) + ' of ' + num(accts.length) + ' account' +
        (accts.length === 1 ? '' : 's') + ' stop before the as-of month</b>' +
        (worstStop ? ', the earliest at ' + esc(monthLabel(worstStop.last)) + ' — ' +
                     esc(worstStop.key) : '') + '. '
      : 'Every account here reaches the as-of month. ') +
    num(FIG.detail.length) + ' event' + (FIG.detail.length === 1 ? '' : 's') + ' on ' +
    num(accts.length) + ' account' + (accts.length === 1 ? '' : 's') + ', from ' + esc(first) +
    ' to ' + esc(last) + '.'
  ));
  c.appendChild(cap(
    '<b>One row of the log is one reconciliation, not one statement line.</b> ' +
    '<code>COUNT(*)</code> equals <code>COUNT(DISTINCT BankMatch)</code> on every account in ' +
    'every book, and the count used everywhere on this page is the DISTINCT one. Two identifiers ' +
    'nearby will not do the job: <code>OBNK."Sequence"</code> is not the reconciliation number ' +
    'and <code>OACT."ExtrMatch"</code> is not a count — they coincide on 22 of the 23 reconciled ' +
    'accounts, which is what makes them dangerous. Oil’s <code>2201104</code> has 9 events with a ' +
    'last reconciliation number of 13, and the naive read reports 13 statements where there are ' +
    'nine. <code>BankMatch</code> itself is a <b>per-account counter</b>, not a global id — Oil ' +
    'has 201 rows and only 30 distinct values, and <code>BankMatch = 1</code> appears on 18 ' +
    'unrelated accounts — so the join key is <code>(AcctCode, BankMatch)</code>. Joining on ' +
    '<code>BankMatch</code> alone fans the ledger out about 6.7×.'
  ));
  return c;
}

/** When they do reconcile, how fast is it keyed — the section's one good finding. */
function lagCard(FIG, co) {
  const c = card('When they do reconcile, how fast is it keyed?',
    'bank-reco detail · LAG_DAYS_N and MAX_ITEM_AGE_AT_STMT_N');

  if (!FIG.lags.length) {
    c.appendChild(empty({
      what: 'No reconciliation event in this book carries a keying lag.',
      why: FIG.detail.length
        ? 'The event log holds ' + num(FIG.detail.length) + ' event' +
          (FIG.detail.length === 1 ? '' : 's') + ' but no LAG_DAYS_N on any of them, which is a ' +
          'build defect rather than an instant reconciliation.'
        : 'There are no reconciliation events at all in ' + companyLabel(co) + ', so there is no ' +
          'lag to measure. That is the coverage failure above, not a rendering gap.'
    }));
    return c;
  }

  const bins = [
    { lab: 'same day – 3 d', lo: 0,  hi: 3 },
    { lab: '4 – 7 d',        lo: 4,  hi: 7 },
    { lab: '8 – 14 d',       lo: 8,  hi: 14 },
    { lab: '15 – 30 d',      lo: 15, hi: 30 },
    { lab: 'over 30 d',      lo: 31, hi: Infinity }
  ];
  c.appendChild(hbars(bins.map(function (b) {
    return {
      name: b.lab,
      value: FIG.lags.filter(function (n) { return n >= b.lo && n <= b.hi; }).length,
      color: b.lo >= 31 ? '--c3' : '--c1'
    };
  }), {
    title: 'Days from statement date to the day it was keyed · ' + num(FIG.lags.length) + ' events',
    unit: 'count', sort: false, top: 0, table: true
  }));

  c.appendChild(kpiRow([
    kitem(FIG, 'reco-keying-lag-days', {
      tone: 'ok',
      sub: 'median across ' + num(FIG.lags.length) + ' event' + (FIG.lags.length === 1 ? '' : 's') +
           ' · mean ' + esc((FIG.lags.reduce(function (a, b) { return a + b; }, 0) / FIG.lags.length).toFixed(1)) +
           ' d · longest ' + num(Math.max.apply(null, FIG.lags)) + ' d'
    })
  ]));

  const over30 = FIG.lags.filter(function (n) { return n > 30; }).length;
  const reach60 = FIG.reach.filter(function (n) { return n > 60; }).length;
  const maxReach = FIG.reach.length ? Math.max.apply(null, FIG.reach) : null;

  c.appendChild(cap(
    '<b>This is the section’s one genuinely good finding, and it reframes everything else: the ' +
    'team is not slow, it is absent.</b> Half of this book’s reconciliations were keyed within ' +
    esc(num(FIG.v['reco-keying-lag-days'])) + ' days of the statement date, and only ' +
    num(over30) + ' of ' + num(FIG.lags.length) + ' took more than a month. The problem this page ' +
    'documents is not slow work on the accounts that get reconciled — it is the ' +
    num(FIG.never.length) + ' live account' + (FIG.never.length === 1 ? '' : 's') +
    ' that never get reconciled at all. ' +
    (FIG.lags.length < 10
      ? '<b>Read the median cautiously here:</b> it is drawn from ' + num(FIG.lags.length) +
        ' event' + (FIG.lags.length === 1 ? '' : 's') + ', which is a handful, not a distribution.'
      : '')
  ));

  if (FIG.reach.length) {
    c.appendChild(hbars([
      { name: 'reached back ≤ 30 d', value: FIG.reach.filter(function (n) { return n <= 30; }).length, color: '--c1' },
      { name: '31 – 60 d',           value: FIG.reach.filter(function (n) { return n > 30 && n <= 60; }).length, color: '--c2' },
      { name: '61 – 180 d',          value: FIG.reach.filter(function (n) { return n > 60 && n <= 180; }).length, color: '--c3' },
      { name: 'over 180 d',          value: FIG.reach.filter(function (n) { return n > 180; }).length, color: '--c4' }
    ], {
      title: 'How far back each batch reached · MAX_ITEM_AGE_AT_STMT_N',
      unit: 'count', sort: false, top: 0, table: true
    }));
    c.appendChild(cap(
      '<b>A reconciliation is not date-sequential, so “everything before the last statement date ' +
      'is clear” is false in general.</b> ' + num(reach60) + ' of this book’s batches reached back ' +
      'more than 60 days' + (maxReach !== null ? ', the furthest by ' + num(maxReach) + ' days' : '') +
      ' — catch-up sweeps, not routine months. What IS true is measured separately, as the ' +
      '“should have cleared” count below.'
    ));
  }
  return c;
}

      tone: 'info',
      sub: 'book against BOOK-DERIVED, never book against statement'
    }),

        ' gross' + (REVIEWED[co].intercoNetCr !== null
