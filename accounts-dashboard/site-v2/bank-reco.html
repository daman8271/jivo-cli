/* ────────────────────────────────────────────────────────────────────────────
   bank-reco.html — the Bank Reconciliation STATUS report.

   The one thing this page exists to prevent is being read as assurance.

     · No bank statement has ever entered SAP. BNK1 = 0 rows and BNK2 = 0 rows
       in all three books, and OBNK."balance" is 0.000000 on all 259 OBNK rows.
       SAP holds no bank-supplied closing balance anywhere.
     · So the section can say WHETHER and WHEN a reconciliation happened, and
       what has never been reconciled at all. It can NEVER say whether one was
       RIGHT. Every panel here carries that boundary rather than footnoting it.
     · RECON_TIEOUT_DIFF_L = 0 is a SAP-ENFORCED TAUTOLOGY (the software refuses
       to close an unbalanced reconciliation), and GAP_AT_LAST_RECON_L compares
       the book against a BOOK-DERIVED figure. Neither is bank-versus-books.

   Two shapes in one slice: ROW_TYPE 'ACCOUNT' (70/44/18) and exactly one
   'TOTAL' roll-up. Summing without filtering returns exactly 2.00x. The CO_*
   columns are the opposite hazard — book constants repeated on every row.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */
import {
  shell, crumb, kpiRow, table, empty, note,
  manifest, slice, derivations, company, companyLabel,
  money, num, scale, ago, esc,
  hrefDerivation, hrefSection, hrefCaveat, hrefBank, hrefGL,
  onRefresh
} from './assets/core.js';
import { waterfall, stackedBars, hbars, pareto, scatter, heatmap, meter, sparkline }
  from './assets/charts.js';

/* ══ 1. section constants — straight out of specs/bank-reco.json ══════════ */

const SECTION  = 'bank-reco';
const SQL_FILE = 'sql/bank-reco.sql';

/** col -> {label, unit, meaning}, verbatim from the spec's columns[]. */
const SPEC_COLS = {"ROW_TYPE":{"label":"Row kind","unit":"text","meaning":"'ACCOUNT' or 'TOTAL'. THE most important column in the slice: it is the ONLY thing separating the 70/44/18 per-account rows from the single roll-up. Filter on it before any aggregation — summing without it returns exactly 2.00x."},"ACCT_CODE":{"label":"G/L account","unit":"text","meaning":"OACT.AcctCode. Unique within a company. NULL on the TOTAL row (which is how you can spot the roll-up even if ROW_TYPE were dropped). An identifier, never an amount."},"ACCT_NAME":{"label":"Account name","unit":"text","meaning":"OACT.AcctName. On the TOTAL row it reads 'ALL BANK / CASH / BANK-FACILITY ACCOUNTS'. Names carry the real bank account number (e.g. INDIAN BANK CC A/C 7007270527) — treat as sensitive when publishing."},"DRAWER_NAME":{"label":"Chart-of-accounts drawer","unit":"text","meaning":"Name of the OACT.FatherNum parent that put this account in the universe: one of BANK ACCOUNTS, PAYMENT BANK ONLINE, CASH IN HAND, BANK CASH CREDIT LOAN, FDR, TERM LOAN, VEHICLE LOAN, CREDIT CARD. All eight exist with identical spelling AND identical account codes in all three books. NULL on the TOTAL row."},"ACCT_KIND":{"label":"Kind","unit":"text","meaning":"BANK / WALLET / CASH / CASH_CREDIT / DEPOSIT / BORROWING, derived ENTIRELY from DRAWER_NAME (sql 266-275) and never from the account name. Live counts Oil 6/2/3/9/32/18, Mart 13/2/3/2/17/7, Bev 8/2/3/0/1/4. The value 'OTHER' exists in the SQL but 0 rows carry it in any book. Because it follows the drawer, Oil 1103115 R & D WHEAT GRASS (Rs 134.05 L) is classified DEPOSIT."},"IS_HOUSE_BANK":{"label":"House bank","unit":"text","meaning":"'Y' when the account appears as DSC1.GLAccount. DECORATIVE ONLY. DSC1 has 5 rows in Oil, 1 in Bev and effectively none usable in Mart: live flags are Oil 5 of 70, Mart 0 of 44, Bev 1 of 18 — and Bev's single flag sits on a DORMANT account. It defines nothing and must never be used to select bank accounts."},"RECO_STATUS":{"label":"Reconciliation status","unit":"text","meaning":"DORMANT_NEVER_RECONCILED (no ledger lines at all) / NEVER_RECONCILED / RECONCILED_CURRENT (<= 45 days) / RECONCILED_LAGGING (<= 120) / RECONCILED_STALE. Live Oil 4/47/0/17/2, Mart 32/10/0/1/1, Bev 12/4/0/2/0. NOTE: no account in any book is CURRENT today. Must be matched by SUBSTRING, and note that 'NEVER_RECONCILED' is a substring of 'DORMANT_NEVER_RECONCILED'."},"RECONS_DONE_N":{"label":"Reconciliations","unit":"count","meaning":"COUNT(DISTINCT OBNK.BankMatch) for the account, bounded by DueDate <= as_of. NOT COUNT(*) of OBNK rows read naively and NOT OACT.ExtrMatch. On the TOTAL row it is the SUM: 201 / 7 / 51 events."},"FIRST_RECON_DATE":{"label":"First reconciliation","unit":"date","meaning":"MIN(OBNK.DueDate). NULL when never reconciled. Book-wide 2024-10-30 Oil / 2025-07-01 Mart / 2024-12-31 Bev."},"LAST_RECON_DATE":{"label":"Last reconciliation","unit":"date","meaning":"MAX(OBNK.DueDate) — the statement CUT-OFF date, always a month-end, not the day the work was done (that is PERFORMED_DATE in the detail). NULL when never reconciled."},"DAYS_SINCE_RECON_N":{"label":"Days since reconciled","unit":"days","meaning":"as_of minus LAST_RECON_DATE. NULL on 51 Oil / 42 Mart / 16 Bev rows — must not be coerced to 0. On the TOTAL row this is a MIN (sql 456), i.e. the BEST account in the book, not the book's position."},"LAST_RECON_NO":{"label":"Last reconciliation number","unit":"text","meaning":"MAX(OBNK.BankMatch) for the account. AN IDENTIFIER, NOT A COUNT and not an amount, despite ending in _NO. It equals RECONS_DONE_N on 22 of the 23 reconciled accounts, which is what makes the exception dangerous: Oil 2201104 reads 13 against 9 actual events."},"GL_LINES_N":{"label":"Ledger lines","unit":"count","meaning":"COUNT(JDT1 lines on the account with RefDate <= as_of). Counts BOTH legs of storno reversals, so it is posting volume, not transaction count. 0 marks a dormant account."},"GL_BAL_L":{"label":"Book balance","unit":"INR","meaning":"LAKHS, SIGNED, ledger convention: POSITIVE = DEBIT (money the books say is in the bank / a deposit held), NEGATIVE = CREDIT (overdraft drawn, loan outstanding). Oil's book total of -5,994.98 L is mostly borrowings and cash-credit facilities, NOT a missing Rs 60 Cr."},"THROUGHPUT_L":{"label":"Gross movement","unit":"INR","meaning":"LAKHS. SUM(Debit + Credit) to as_of, so a rupee in and back out counts twice. It measures how much traffic an account carries and therefore how much is riding on it being checked. It is NOT turnover, NOT a trade figure and includes intercompany transfers."},"CURRTOTAL_XCHECK_L":{"label":"SAP's own stored balance","unit":"INR","meaning":"LAKHS, SIGNED. OACT.CurrTotal. LIFETIME-TO-TODAY, NOT bounded by as_of. It matched GL_BAL_L to 0.000000 lakh on all 132 accounts in the live run, which is the section's cleanest cross-check — but only because there are no future-dated bank lines. At any historical as_of it legitimately differs."},"REC_LINES_N":{"label":"Lines agreed","unit":"count","meaning":"Lines whose (Account, ExtrMatch) matches an OBNK reconciliation with DueDate <= as_of (CTE reckey). 24,118 / 6,084 / 4,262. REC_LINES_N + UNREC_LINES_N = GL_LINES_N on every row, verified 0 violations."},"RECONCILED_LINES_PCT":{"label":"Lines agreed %","unit":"pct","meaning":"100 x REC_LINES_N / GL_LINES_N, one decimal. NULL when GL_LINES_N = 0 (4 Oil / 32 Mart / 12 Bev dormant rows) — an explicit divide-by-zero guard, not missing data. Beware: the name contains '_L' inside 'LINES', so a substring-based money test scales it by 1e5."},"REC_RECEIPTS_N":{"label":"Agreed receipts","unit":"count","meaning":"Reconciled lines carrying a non-zero Debit. Receipts = ledger DEBITS = money in."},"REC_RECEIPTS_L":{"label":"Agreed receipts","unit":"INR","meaning":"LAKHS, positive magnitude. SUM(Debit) over reconciled lines."},"REC_PAYMENTS_N":{"label":"Agreed payments","unit":"count","meaning":"Reconciled lines carrying a non-zero Credit. Payments = ledger CREDITS = money out. A single line can be counted in both _RECEIPTS_N and _PAYMENTS_N only if it carried both a Debit and a Credit, which SAP does not do — but the two counts are computed independently, so do not assume they sum to REC_LINES_N."},"REC_PAYMENTS_L":{"label":"Agreed payments","unit":"INR","meaning":"LAKHS, positive magnitude. SUM(Credit) over reconciled lines."},"RECONCILED_BAL_L":{"label":"Agreed balance (ledger side)","unit":"INR","meaning":"LAKHS, SIGNED. Net Debit-Credit of the reconciled lines. Oil -4,364.41 / Mart 220.55 / Bev 88.26."},"BANK_SIDE_BAL_L":{"label":"Agreed balance (OBNK side)","unit":"INR","meaning":"LAKHS, SIGNED. -(SUM(OBNK.DebAmount - OBNK.CredAmnt)). Identical to RECONCILED_BAL_L on every account BY SAP'S CONSTRUCTION, not by agreement with any bank. It is NOT the bank's closing balance: OBNK.balance is 0.000000 on all 259 OBNK rows in all three books."},"RECON_TIEOUT_DIFF_L":{"label":"Tie-out diff (internal)","unit":"INR","meaning":"LAKHS. RECONCILED_BAL_L - BANK_SIDE_BAL_L. 0.00 on all 132 account rows and all 3 TOTAL rows because SAP refuses to close an unbalanced external reconciliation. A QUERY SELF-CHECK. Rendering it as a plain column with no caveat makes it read like a passed control — it is not."},"UNREC_LINES_N":{"label":"Unagreed items","unit":"count","meaning":"GL_LINES_N - REC_LINES_N. 6,800 Oil / 9,510 Mart / 2,470 Bev. Mart has more unagreed items than agreed ones."},"UNREC_RECEIPTS_N":{"label":"Unagreed receipts","unit":"count","meaning":"Unreconciled lines with a non-zero Debit."},"UNREC_RECEIPTS_L":{"label":"Unagreed receipts","unit":"INR","meaning":"LAKHS, positive magnitude. SUM(Debit) over unreconciled lines."},"UNREC_PAYMENTS_N":{"label":"Unagreed payments","unit":"count","meaning":"Unreconciled lines with a non-zero Credit."},"UNREC_PAYMENTS_L":{"label":"Unagreed payments","unit":"INR","meaning":"LAKHS, positive magnitude. SUM(Credit) over unreconciled lines. UNREC_RECEIPTS_L + UNREC_PAYMENTS_L equals the four ageing buckets exactly — that is the ageing reconciliation check."},"UNRECONCILED_DIFF_L":{"label":"Balance never agreed","unit":"INR","meaning":"LAKHS, SIGNED. GL_BAL_L - RECONCILED_BAL_L. The net position no reconciliation covers: Oil -1,630.58 L, Mart -125.33 L, Bev -42.35 L. This is the NET figure to quote; the ageing buckets are gross."},"GL_BAL_AT_LAST_RECON_L":{"label":"Book balance at the last statement date","unit":"INR","meaning":"LAKHS, SIGNED. Every ledger line dated on or before LAST_RECON_DATE, reconciled or not. NULL when the account has never been reconciled (51 / 42 / 16 rows) — but the TOTAL row folds those in as 0 via IFNULL (sql 473)."},"GAP_AT_LAST_RECON_L":{"label":"Gap at last reconciliation (internal)","unit":"INR","meaning":"LAKHS. GL_BAL_AT_LAST_RECON_L - BANK_SIDE_BAL_L. THIS IS NOT 'balance per bank statement vs balance per books'. The bank's closing balance is not in SAP anywhere (OBNK.balance = 0.000000 on all 259 rows), so this compares the book balance against a BOOK-DERIVED agreed balance. It is arithmetically the NET of the STALE_PRE_RECON items, and it is 0 on every account in all three books. NULL where never reconciled."},"MOVEMENT_SINCE_RECON_L":{"label":"Movement since the last reconciliation","unit":"INR","meaning":"LAKHS, SIGNED. GL_BAL_L - GL_BAL_AT_LAST_RECON_L. NULL on every never-reconciled row, which is why this column does NOT re-total: sum(ACCOUNT rows) is Oil +2,297.11 / Mart -220.84 / Bev -45.75 against TOTAL -1,630.58 / -125.33 / -42.35. On reconciled accounts it equals UNRECONCILED_DIFF_L exactly (verified 0 divergences), because GAP_AT_LAST_RECON_L is 0."},"UNREC_0_30_N":{"label":"0-30 d items","unit":"count","meaning":"Unreconciled lines whose RefDate is within 30 days of as_of."},"UNREC_0_30_L":{"label":"0-30 d value","unit":"INR","meaning":"LAKHS. GROSS movement (Debit + Credit) of those lines, not net exposure."},"UNREC_31_60_N":{"label":"31-60 d items","unit":"count","meaning":"Unreconciled lines aged 31-60 days."},"UNREC_31_60_L":{"label":"31-60 d value","unit":"INR","meaning":"LAKHS, gross."},"UNREC_61_90_N":{"label":"61-90 d items","unit":"count","meaning":"Unreconciled lines aged 61-90 days."},"UNREC_61_90_L":{"label":"61-90 d value","unit":"INR","meaning":"LAKHS, gross."},"UNREC_90PLUS_N":{"label":"90 d + items","unit":"count","meaning":"Unreconciled lines older than 90 days. Oil 3,986 / Mart 7,387 / Bev 1,340 — but 3,570 / 6,856 / 1,335 of those are CASH and WALLET micro-entries."},"UNREC_90PLUS_L":{"label":"90 d + value","unit":"INR","meaning":"LAKHS, gross. The four bucket _L columns sum exactly to UNREC_RECEIPTS_L + UNREC_PAYMENTS_L and the four _N columns to UNREC_LINES_N — verified on all 132 account rows and all 3 TOTAL rows, max per-row delta 0.01 L."},"UNREC_90PLUS_PAYMENTS_L":{"label":"90 d + money out","unit":"INR","meaning":"LAKHS. SUM(Credit) only, over the 90-day-plus unreconciled lines. The one-sided read of the bucket. NEVER caption it 'stale cheques' — there are no cheques in any JIVO book."},"OLDEST_UNREC_DATE":{"label":"Oldest unagreed item","unit":"date","meaning":"MIN(JDT1.RefDate) over unreconciled lines. NULL on 5 Oil / 32 Mart / 12 Bev rows — 4/32/12 of those are dormant and ONE (Oil 1104103, 100% reconciled) genuinely has nothing outstanding. Oil's book-wide 2024-09-30 is the SAP go-live migration date, not 691 days of neglect."},"STALE_PRE_RECON_N":{"label":"Should have cleared","unit":"count","meaning":"Unreconciled lines dated on or before the account's own LAST_RECON_DATE. 2 Oil / 0 Mart / 0 Bev. Structurally impossible on the 61 accounts that have never been reconciled, so 0 is not a clean bill of health."},"STALE_PRE_RECON_L":{"label":"Should have cleared, value","unit":"INR","meaning":"LAKHS, GROSS. Oil's 140.00 L is a single Rs 70,00,000 journal and its exact reversal on 2201105 (TransId 219567 / 220018, both TransType 30, both 2026-04-07). The NET is zero — which is why GAP_AT_LAST_RECON_L reads 0."},"CO_STMT_IMPORT_ROWS_N":{"label":"Statement rows in SAP","unit":"count","meaning":"BOOK-LEVEL CONSTANT repeated on every row (MAX() on the TOTAL row). COUNT(BNK1) + COUNT(BNK2) = 0 in Oil, Mart and Beverages. Summing this column gives 71x / 45x / 19x. It is the fact that caps everything this section can claim."},"CO_CHEQUE_DOCS_N":{"label":"Cheque documents in SAP","unit":"count","meaning":"BOOK-LEVEL CONSTANT. RCT1 + VPM1 + OCHO + uncancelled ORCT/OVPM with CheckSum <> 0 = 0 everywhere. JIVO banks 100% by transfer plus a little cash."},"CO_INTERNAL_RECONS_N":{"label":"Internal reconciliations in the book","unit":"count","meaning":"BOOK-LEVEL CONSTANT. Uncancelled OITR headers: 29,093 Oil / 12,933 Mart / 6,127 Bev. Internal reconciliation IS heavily used at JIVO — it just does not touch bank accounts. Published so nobody repeats the wrong conclusion drawn from JDT1.IntrnMatch = 0."},"CO_INTRECON_ON_BANK_N":{"label":"Internal reconciliations touching a bank account","unit":"count","meaning":"BOOK-LEVEL CONSTANT. ITR1 rows sitting on an account in this universe: 2 Oil / 0 Mart / 0 Bev, out of 122,801 Oil ITR1 rows. This is the number that proves OITR/ITR1 is the wrong table for bank reconciliation."},"RECON_NO":{"label":"Reconciliation number","unit":"text","meaning":"DETAIL SLICE. OBNK.BankMatch — the value JDT1.ExtrMatch carries. A PER-ACCOUNT counter, not a global id: Oil has 201 events but only 30 distinct BankMatch values, and BankMatch = 1 appears on 18 different accounts with 10 different statement dates. (ACCT_CODE, RECON_NO) is unique on every row (201/201, 7/7, 51/51). Joining on BankMatch alone would be catastrophic."},"STMT_DATE":{"label":"Statement date","unit":"date","meaning":"DETAIL SLICE. OBNK.DueDate — the statement cut-off, always a month-end. Range: Oil 2024-10-30..2026-06-30 over 21 months, Mart 2025-07-01..2026-05-31 over 5, Bev 2024-12-31..2026-05-31 over 14."},"PERFORMED_DATE":{"label":"Keyed on","unit":"date","meaning":"DETAIL SLICE. OBNK.CreateDate — the day the reconciliation was actually entered into SAP."},"LAG_DAYS_N":{"label":"Keying lag","unit":"days","meaning":"DETAIL SLICE. PERFORMED_DATE minus STMT_DATE. Median 6 Oil / 13 Mart / 5 Bev, mean 10.0 / 14.1 / 6.6, max 53 / 32 / 31. When JIVO reconciles it reconciles promptly; the problem is missed months, not slow months."},"LINES_CLEARED_N":{"label":"Lines cleared by this event","unit":"count","meaning":"DETAIL SLICE. JDT1 lines with this (Account, ExtrMatch). Sums to REC_LINES_N exactly (24,118 / 6,084 / 4,262) and 0 events in any book cleared nothing."},"CLEARED_RECEIPTS_N":{"label":"Receipts cleared","unit":"count","meaning":"DETAIL SLICE. Lines in the event with a non-zero Debit."},"CLEARED_RECEIPTS_L":{"label":"Receipts cleared","unit":"INR","meaning":"DETAIL SLICE. LAKHS, positive magnitude."},"CLEARED_PAYMENTS_N":{"label":"Payments cleared","unit":"count","meaning":"DETAIL SLICE. Lines in the event with a non-zero Credit."},"CLEARED_PAYMENTS_L":{"label":"Payments cleared","unit":"INR","meaning":"DETAIL SLICE. LAKHS, positive magnitude."},"CLEARED_NET_L":{"label":"Net cleared","unit":"INR","meaning":"DETAIL SLICE. LAKHS, SIGNED, ledger convention (positive = net debit). Sums to RECONCILED_BAL_L within rounding."},"BANK_SIDE_L":{"label":"Bank side of this event","unit":"INR","meaning":"DETAIL SLICE. LAKHS, SIGNED. -(OBNK.DebAmount - OBNK.CredAmnt) for the event. Equal and opposite to CLEARED_NET_L by SAP's construction."},"TIEOUT_DIFF_L":{"label":"Tie-out diff (internal)","unit":"INR","meaning":"DETAIL SLICE. LAKHS. CLEARED_NET_L + OBNK net. 0.00 on all 259 events in all three books. It is the ALARM for the detail query's deliberately unbounded `led` CTE: if a reconciled line ever gets dated after its own statement date, this goes non-zero first."},"OLDEST_ITEM_DATE":{"label":"Oldest item in the batch","unit":"date","meaning":"DETAIL SLICE. MIN(JDT1.RefDate) among the lines the event cleared."},"MAX_ITEM_AGE_AT_STMT_N":{"label":"How far back the batch reached","unit":"days","meaning":"DETAIL SLICE. STMT_DATE minus OLDEST_ITEM_DATE. Max 547 Oil / 360 Mart / 166 Bev days; 29 / 5 / 3 events reached back more than 60 days. A large value means a CATCH-UP SWEEP, not clean month-on-month work — and it is why 'everything before LAST_RECON_DATE is clear' is false."}};

/** specs/bank-reco.json -> traps[]. All thirty, verbatim. */
const TRAPS = ["THIS SECTION IS SAP-SIDE ONLY AND CANNOT SAY A RECONCILIATION WAS RIGHT. No bank statement has ever entered SAP: BNK1 = 0 rows and BNK2 = 0 rows in Oil, Mart and Beverages (shipped as CO_STMT_IMPORT_ROWS_N = 0 on every row). OBNK is not a statement table here, it is a reconciliation LOG - one row per event, carrying a single lump bank-side figure. So the section can say WHETHER and WHEN a reconciliation happened and what has never been reconciled at all. It can never say whether one was right. Any caption implying assurance is false.","OBNK.\"balance\" IS 0.000000 ON ALL 259 OBNK ROWS ACROSS ALL THREE BOOKS (verified exhaustively, not sampled). SAP holds no bank-supplied closing balance anywhere. Therefore GAP_AT_LAST_RECON_L compares the book balance at the statement date against a BOOK-DERIVED agreed balance (BANK_SIDE_BAL_L, from OBNK.DebAmount/CredAmnt). It is an INTERNAL CONSISTENCY CHECK, NOT the classic 'balance per bank statement vs balance per books' line. Getting the real thing needs the bank statement files, which are not available. Say this next to the number every single time it is shown.","RECON_TIEOUT_DIFF_L = 0.00 IS A TAUTOLOGY, NOT A PASSED CONTROL. SAP refuses to close an external reconciliation whose ledger side and bank side do not balance, so SUM(reconciled JDT1 net) = -SUM(OBNK Deb-Cred) is guaranteed by the software. It printed 0.00 on all 132 account rows and all 259 detail events - which proves the query joins correctly and proves nothing whatever about the bank. It currently sits on the account table as a plain 'tie-out diff' column with no caveat, which reads exactly like a control that passed. Never show it to an auditor as assurance.","ROW_TYPE = 'TOTAL' AND ROW_TYPE = 'ACCOUNT' SHARE ONE RESULT SET AND THE TOTAL IS EXACTLY ADDITIVE. Any consumer that sums a column without filtering ROW_TYPE gets exactly 2.00x the truth - measured on UNREC_90PLUS_L: Oil 38,929.38 vs 19,464.68, Mart 14,947.40 vs 7,473.70, Bev 1,625.32 vs 812.66. The roll-up is identified by ROW_TYPE == 'TOTAL' (also ACCT_CODE null, ACCT_NAME 'ALL BANK / CASH / BANK-FACILITY ACCOUNTS'), exactly one row per company.","THE CO_* COLUMNS ARE THE OPPOSITE HAZARD: book-level constants repeated on every row and aggregated with MAX() on the TOTAL row. Summing CO_INTERNAL_RECONS_N gives 2,065,603 against 29,093 in Oil (71x), 581,985 against 12,933 in Mart (45x) and 116,413 against 6,127 in Bev (19x). Read them off one row, or off TOTAL, never SUM them.","MOVEMENT_SINCE_RECON_L DOES NOT RE-TOTAL, AND IT IS THE ONLY MONEY COLUMN THAT DOES NOT. It is NULL on every never-reconciled account row (51 Oil / 42 Mart / 16 Bev) because GL_BAL_AT_LAST_RECON_L is NULL there, but the TOTAL row folds those accounts' whole GL_BAL in via IFNULL(BAL_AT_RECON,0) at sql 475. Measured: sum of ACCOUNT rows +2,297.11 / -220.84 / -45.75 against TOTAL -1,630.58 / -125.33 / -42.35, and the gap is exactly the GL_BAL_L of the NULL rows (-3,927.71 / +95.51 / +3.40 L). Rebuilding the book total from the account rows silently gives the wrong sign in Oil.","MONEY COLUMNS END IN _L AND ARE LAKHS (x 1e5). ANCHOR THE TEST ON THE END OF THE NAME, NEVER A SUBSTRING. A 'contains _L' test wrongly scales five columns by 100,000: GL_LINES_N, REC_LINES_N, UNREC_LINES_N, RECONCILED_LINES_PCT and (in the detail) LINES_CLEARED_N - the word LINES contains '_L'. RECONCILED_LINES_PCT 78.0 would render as Rs 78,00,000. Counts end _N; percentages end _PCT; LAST_RECON_NO ends _NO and is an IDENTIFIER, not a count and not an amount; ACCT_CODE and RECON_NO are identifiers too.","V1'S SQL HEADER CLAIMED BRANCH AND INTERCOMPANY 'DO NOT APPLY BECAUSE THESE ARE G/L ACCOUNTS'. THAT WAS FACTUALLY WRONG and it was a hand-wave, not a measurement. (a) JDT1.\"BPLId\" IS populated on every bank ledger line: Oil spreads over 7 branches (DELHI 16,582 lines / -6,169.25 L, FACTORY 13,459 / -4,402.98 L, PUNJAB 579 / +4,571.41 L, HARYANA SALES 215, DELHI ISD 11, DELHI INFO 9, HIMACHAL PRADESH 8), Mart over 7, Beverages over 5, and one physical bank account is shared by several branches. (b) Intercompany money DOES flow through these accounts and it is large: Oil 532 lines Rs 306.75 Cr gross / +Rs 271.10 Cr net, Mart 486 lines Rs 336.96 Cr gross / -Rs 247.31 Cr net, Beverages 3 lines Rs 0.40 Cr - the two large ones mirror each other, Oil receiving what Mart pays. Both are INCLUDED on purpose: a bank account is reconciled as one account against one statement, not per branch, and a reconciliation that netted intercompany out would stop tying to the bank. C-0005's 23 group CardCodes and the OCRG '%BRANCH%' test are BP-side tests and cannot be applied to a G/L row. Nothing is dropped on either ground - so flag it, and note that nothing in this section is a trade figure.","THE AGEING BUCKETS ARE GROSS MOVEMENT, NOT NET EXPOSURE. UNREC_0_30_L and friends sum Debit + Credit, so a busy current account shows a month of throughput rather than an amount at risk, and a Dr/Cr pair netting to zero still contributes both legs. Deliberate - an uncleared item has a size whichever way it points. Read UNRECONCILED_DIFF_L for the net position (Oil -1,630.58 L) and UNREC_90PLUS_PAYMENTS_L for stale money out. The four buckets sum EXACTLY to UNREC_RECEIPTS_L + UNREC_PAYMENTS_L and their counts to UNREC_LINES_N (verified on all 132 account rows and all 3 TOTAL rows, max per-row delta 0.01 L) - make that the check, and it will catch a bucket boundary that overlaps or leaves a gap.","UNREC_90PLUS_L ON THE TOTAL ROW BLENDS AN EXCEPTION LIST WITH A COVERAGE FAILURE, AND THE SMALLER HALF IS THE ONE WORTH ACTING ON. Items on accounts JIVO does reconcile: Oil 15 items / Rs 16.78 Cr, Mart 142 / Rs 2.91 Cr, Bev 0 / Rs 0. Items on accounts nobody has ever reconciled: Oil 3,971 / Rs 177.87 Cr (91.4%), Mart 7,245 / Rs 71.83 Cr (96.1%), Bev 1,340 / Rs 8.13 Cr (100%). Quoting the blend sends someone chasing 3,986 transactions when Oil's real exception list is 15. The split is one filter away: RECO_STATUS LIKE 'RECONCILED%'.","CASH AND WALLET ACCOUNTS ARE IN THE UNIVERSE AND ARE NOT BANK-RECONCILABLE. They dominate the item COUNTS and are trivial in money: of Oil's 3,986 90-day-plus items, 3,570 are CASH/WALLET worth only Rs 7.22 Cr (1104201 PAYTM alone is 1,877 items / Rs 4.13 Cr); of Mart's 7,387, 6,856 are CASH/WALLET worth Rs 8.98 Cr; of Bev's 1,340, 1,335 are worth Rs 7.85 Cr. Filtering to ACCT_KIND in BANK/CASH_CREDIT/DEPOSIT/BORROWING leaves 416 / 531 / 5 items worth Rs 187.42 Cr / Rs 65.76 Cr / Rs 0.28 Cr. A till or a payment-gateway wallet needs a cash count or a settlement report, which is not in SAP - treating them as bank-reco failures is simply wrong.","STORNO / REVERSAL PAIRS ARE NOT REMOVED AND THEY INFLATE THE GROSS AGEING. Measured inside the 90-day-plus bucket: Oil 209 lines / 2,881.31 L of 19,464 L (14.8%), Mart 284 / 598.08 L (8.1%), Beverages 44 / 27.86 L (3.4%). Each pair nets to zero so UNRECONCILED_DIFF_L is untouched; only the gross ageing and the line COUNTS are inflated. They are kept because both legs post to the ledger and dropping one would break the exact tie to OACT.CurrTotal. GL_LINES_N is therefore posting volume, not transaction count.","OBNK.\"Sequence\" IS NOT THE RECONCILIATION NUMBER AND OACT.\"ExtrMatch\" IS NOT A COUNT. They coincide on 22 of the 23 reconciled accounts, which is what makes this dangerous. Live today: Oil 2201104 LOAN TERM INDIAN BANK 8021303333 has 9 events but LAST_RECON_NO = 13 (Sequence runs 1..9, BankMatch runs 5..13, OACT.ExtrMatch = 13). The naive read reports 13 statements where there are 9 and attaches ledger line ExtrMatch=5 to the wrong statement date. The query counts COUNT(DISTINCT BankMatch) and joins on BankMatch.","OBNK.\"BankMatch\" IS A PER-ACCOUNT COUNTER, NOT A GLOBAL ID. Oil has 201 OBNK rows but only 30 distinct BankMatch values; BankMatch = 1 appears on 18 different accounts with 10 different DueDates spanning 2024-10-30 to 2026-03-31 - 18 unrelated first-reconciliations. The join key is (AcctCode, BankMatch), which is unique on every row (201/201, 7/7, 51/51). Joining on BankMatch alone would fan the ledger out by roughly 6.7x in Oil.","'JIVO DOES NO INTERNAL RECONCILIATION' IS A WRONG CONCLUSION DRAWN FROM A RIGHT FACT. JDT1.\"IntrnMatch\" is 0 and JDT1.\"Closed\" is 'N' on 100% of lines - verified over all 526,820 / 344,144 / 86,414 lines, not a sample. But SAP 9.x/10 keeps internal reconciliation in OITR/ITR1 and leaves the legacy JDT1 field at 0: there are 29,093 / 12,933 / 6,127 uncancelled OITR headers (Oil 122,801 ITR1 rows). It is simply the wrong table for bank reconciliation - only 2 of Oil's 122,801 ITR1 rows sit on an account OBNK reconciles, and 0 in Mart and Bev. Shipped as CO_INTERNAL_RECONS_N / CO_INTRECON_ON_BANK_N precisely so nobody repeats the wrong version.","THERE ARE NO CHEQUES ANYWHERE IN SAP, SO THERE IS NO 'UNCLEARED CHEQUE AGEING'. RCT1, VPM1, OCHO, OCHH, ODPS and DPS1 are 0 rows in all three books and \"CheckSum\" <> 0 on ZERO uncancelled receipts or payments (CO_CHEQUE_DOCS_N = 0 on every row). JIVO banks 100% by transfer plus a little cash. A previous version of this dashboard captioned UNREC_90PLUS_PAYMENTS_L 'cheques likely stale' under Rs 101 Cr - that caption was false on the section's own data. What is aged here is unreconciled bank LEDGER ITEMS, which is the correct equivalent.","DAYS_SINCE_RECON_N ON THE TOTAL ROW IS A MIN, SO IT REPORTS THE BOOK'S BEST ACCOUNT, NOT THE BOOK. Oil's headline 53 days comes from ONE account (2201101, statement 2026-06-30); every other Oil account stops at 2026-05-31 = 83 days, and two stopped long ago - 1104103 at 355 days and 2201103 INDIAN BANK ADHOC-OCC at 537 days. Mart's 1104111 is at 295 days. Always publish the MAX alongside it (537 / 295 / 83).","A RECONCILIATION IS NOT DATE-SEQUENTIAL, SO 'EVERYTHING BEFORE THE LAST STATEMENT DATE IS CLEAR' IS FALSE IN GENERAL. Batches reach backwards: Oil's furthest reached 547 days, Mart's 360, Bev's 166, and 29 / 5 / 3 events reached back more than 60 days. What IS true is measured separately as STALE_PRE_RECON_N/_L - items still unreconciled although dated on or before their own account's last statement. Live that is 2 items in Oil (a Rs 70,00,000 journal and its exact reversal on 2201105, netting to zero) and 0 in Mart and Bev. But 0 is not a clean bill of health: the metric is structurally impossible on the 61 of 132 accounts that have never been reconciled.","A BACK-DATED RUN WILL LIE UNLESS THE reckey GUARD IS INTACT. Because batches reach backwards, testing JDT1.\"ExtrMatch\" > 0 alone calls Oil 2201101's 2025-12-26 items 'reconciled' at an as_of of 2025-12-31 - five months before the batch that cleared them existed. It was caught by the tie-out going to -42.09 lakh at that date. The fix (sql 303-309, 349) requires the line's (Account, ExtrMatch) to match an OBNK reconciliation whose own DueDate is <= as_of. At as_of = today it changes nothing; on any historical run it is the difference between a true answer and a wrong one. Re-running at a past as_of and checking the tie-out is still 0 is the only version of this section's self-check that has ever caught a real defect.","CURRTOTAL_XCHECK_L IS LIFETIME-TO-TODAY AND IS NOT BOUNDED BY as_of. It matched GL_BAL_L to 0.000000 lakh on all 132 accounts in the live run, which is the strongest cross-check in the section - but that only holds because there are no future-dated bank lines. On any historical as_of it will legitimately differ, and the check dot must read 'not applicable at this as-of' rather than red.","SEVEN COLUMNS ARE NULL ON EVERY NEVER-RECONCILED ROW AND MUST NOT BE COERCED TO ZERO: LAST_RECON_DATE, FIRST_RECON_DATE, DAYS_SINCE_RECON_N, LAST_RECON_NO, GL_BAL_AT_LAST_RECON_L, GAP_AT_LAST_RECON_L, MOVEMENT_SINCE_RECON_L - 51 rows in Oil, 42 in Mart, 16 in Bev. DAYS_SINCE_RECON_N read as 0 means 'reconciled today', which is the exact opposite of the truth and would destroy both the MIN on the TOTAL row and any 'days since' chart. RECONCILED_LINES_PCT is separately NULL on the 4 / 32 / 12 dormant rows (explicit divide-by-zero guard), and OLDEST_UNREC_DATE is NULL on 5 / 32 / 12 - the extra Oil row is 1104103, which is 100% reconciled and genuinely has nothing outstanding.","PICKING BANK ACCOUNTS BY NAME OR CODE PREFIX IS WRONG AND THE UNIVERSE DELIBERATELY DOES NOT. '%BANK%' also catches BANK CHARGES and TDS RECOVERABLE FROM BANK; the code prefix lies (Oil 1104106/1104107 carry 1104* codes but hang under 2201100 BANK CASH CREDIT LOAN, and 1103114/1103116/1103117 carry 1103* codes but hang under FDR); and OACT.\"ActType\"/\"CashBox\" are useless selectors because every bank account here is ActType='N', CashBox='N'. The universe is the postable children of eight named drawers walked through OACT.FatherNum. The cost of doing it right: ACCT_KIND follows the drawer, so Oil 1103115 R & D WHEAT GRASS (Rs 134.05 L) is classified DEPOSIT. It is plainly not a bank account and is left in on purpose - filtering it by name would be exactly the trap. Worth an operator raising with whoever maintains the chart of accounts.","IS_HOUSE_BANK IS DECORATIVE AND MUST NEVER BE USED AS A SELECTOR. It comes from DSC1, which has 5 usable rows in Oil, effectively none in Mart and 1 in Bev against 13-30 live bank accounts per book. Live: Oil flags 5 of 70 (one of them, 1104102, has NEVER been reconciled), Mart flags 0 of 44 despite 13 BANK-kind accounts, and Bev's single flag sits on a DORMANT account. An empty house-bank panel in Mart is data, not a failure.","RECO_STATUS MUST BE MATCHED BY SUBSTRING, AND ONE SUBSTRING IS A SUBSET OF ANOTHER. The five literals are DORMANT_NEVER_RECONCILED / NEVER_RECONCILED / RECONCILED_CURRENT / RECONCILED_LAGGING / RECONCILED_STALE. A previous renderer compared against 'NEVER' and 'CURRENT', neither of which has ever been emitted, so all 132 accounts across the three books rendered amber - including the 61 never reconciled once. And 'NEVER_RECONCILED' is a substring of 'DORMANT_NEVER_RECONCILED', so a naive `in` test folds the 4 / 32 / 12 dormant accounts into the failure count. Live today NO account in any book is RECONCILED_CURRENT.","GL_BAL_L IS SIGNED IN THE LEDGER'S CONVENTION: POSITIVE = DEBIT (money in the bank), NEGATIVE = CREDIT (overdraft drawn, loan outstanding). Oil's book-wide -5,994.98 L is mostly borrowings and cash-credit facilities, NOT a missing Rs 60 Cr. Plotting it raw draws every term loan as a deficit. Same convention on RECONCILED_BAL_L, BANK_SIDE_BAL_L, UNRECONCILED_DIFF_L, GL_BAL_AT_LAST_RECON_L, MOVEMENT_SINCE_RECON_L, CURRTOTAL_XCHECK_L and the detail's CLEARED_NET_L / BANK_SIDE_L.","COVERAGE HAS TWO HONEST DENOMINATORS AND THEY DISAGREE BY A LOT. Against every account in the universe: 27.1% Oil / 4.5% Mart / 11.1% Bev. Against accounts that actually have ledger lines: 28.8% / 16.7% / 33.3%. Mart's 4.5% is mostly 32 empty FDR, loan and card heads, not 32 neglected bank accounts. Publish both or the reader picks whichever suits the argument. The failure count that matters is RECO_STATUS = 'NEVER_RECONCILED' exactly: 47 / 10 / 4.","THROUGHPUT_L IS NOT A TRADE FIGURE AND MUST NEVER BE READ AS TURNOVER. It is SUM(Debit + Credit) on bank accounts, so a rupee in and back out counts twice, and it includes the intercompany transfers above (Rs 306.75 Cr Oil / Rs 336.96 Cr Mart gross). Oil's 417,444.20 L is Rs 4,174 Cr of bank traffic, not sales. It is useful for exactly one thing: sizing how much rides on an account nobody has checked.","ROUNDING IS COARSE AND EXACT EQUALITY WILL FALSE-ALARM. Every _L column is ROUND(x/100000, 2) = Rs 1,000 granularity, and up to 260 rounded values get combined. Measured route-vs-route deltas on today's data: reco-unagreed-balance Rs 6,000 (Oil), reco-90plus-exceptions Rs 2,000 (Oil), reco-90plus-gross Rs 1,000 (Mart), reco-never-throughput Rs 1,000; per-account bucket-vs-gross up to Rs 1,000. Every check needs a tolerance of about Rs 1,000 x rows touched. Counts, by contrast, reconcile EXACTLY - a count mismatch is always a real defect.","THE DETAIL QUERY'S `led` CTE IS DELIBERATELY NOT BOUNDED BY as_of. That is safe today because ZERO of the 24,118 / 6,084 / 4,262 reconciled lines is dated after its own statement date (they reach backwards only, by up to 547 / 360 / 166 days), so RefDate <= DueDate <= as_of holds automatically. If that invariant ever breaks, TIEOUT_DIFF_L on the detail goes non-zero first - which is why it was left unbounded rather than silently clipped. Do not 'fix' it without also removing that alarm.","THERE IS NO LINE-LEVEL GRAIN. The section publishes 70/44/18 account rows and 201/7/51 event rows and nothing below that, so no page may offer a drill to an individual uncleared transaction, a journal memo, or a per-item ageing list. The most granular question this data can answer is 'which reconciliation event cleared how many lines on which account, and when was it keyed'."];

/**
 * The five account-level RECO_STATUS literals, in plain English and in a fixed
 * reading order. They are matched EXACTLY, never with `in`/`includes`:
 * 'NEVER_RECONCILED' is a substring of 'DORMANT_NEVER_RECONCILED', and a naive
 * containment test folds the 4 / 32 / 12 empty accounts into the failure count
 * (trap 24). The TOTAL row carries a SIXTH value of its own shape —
 * '19_OF_70_ACCOUNTS_RECONCILED' — which is not an account status at all.
 */
const STATUS_PLAIN = {
  RECONCILED_CURRENT:       'Reconciled and current',
  RECONCILED_LAGGING:       'Reconciled, but behind',

  DORMANT_NEVER_RECONCILED: 'Empty account, nothing to reconcile'
};
const STATUS_ORDER = ['RECONCILED_CURRENT', 'RECONCILED_LAGGING', 'RECONCILED_STALE',
                      'NEVER_RECONCILED', 'DORMANT_NEVER_RECONCILED'];
