           'that is not there logs a console error that would hide a real one. Both queries are in ' +
           'the repository at pipeline/' + SQL_FILE + ' and pipeline/' + SQL_DETAIL + '.'
    }));
    return c;
  }

  c.appendChild(h(
    '<p class="tnote">Read-only, and reviewed adversarially before either was allowed near the board ' +
    '— ten attacks, no wrong numbers, and <b>two claims the query’s own header made about its ' +
    'figures were withdrawn as factually wrong</b>. One of them told operators to discard a column ' +
    'that turned out to be exactly right: the stock-cost figure was said to be “a floor, not a ' +
    'total” because some returns carry no journal entry. They do carry inventory receipts, SAP ' +
    'valued every one of them at zero, and three independent routes reproduce the published figure ' +
    'to the paisa. The advice was corrected rather than trusted, and it is not repeated anywhere on ' +
    'this page. Money is plain rupees throughout: no column here ends in <code>_L</code> or ' +
    '<code>_CR</code>, so the display divides by a lakh or a crore and the query never does. The ' +
    'register comes from a <b>second</b> file that aggregates per document rather than per group, ' +
    'which is why it is a genuine cross-check on the summary — and also why the two can differ by a ' +
    'paisa per document from independent rounding. These files are not edited by the dashboard ' +
    '(CONTRACT §0.6): changing one silently changes the books.</p>'
  ));
  return c;
}

/** The page footer: where the numbers came from, and how old they are. */
function paintFoot(m, co, asOf, rows, det) {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
      '<div><b>Section</b> — return-note, from <code>ORDN</code>/<code>RDN1</code> (the customer ' +
        'return and its lines), valued through <code>JDT1</code> (the return’s own journal entry), ' +
        'and measured against <code>ODLN</code> (the delivery it came from), <code>OINV</code> (was ' +
        'that delivery ever invoiced) and <code>ORIN</code>/<code>RIN1</code> (was a credit note ' +
        'raised), with <code>OCRD</code>/<code>OCRG</code> for the customer and its group. Live ' +
        'documents only — <code>CANCELED = &apos;N&apos;</code>.</div>' +
      '<div><b>Shape</b> — the summary is faceted: ' + num((rows || []).length) + ' rows stacked into ' +
        'six aggregates of the same book, and every total on this page is read from the one row ' +
        'where <code>SCOPE = &apos;TOTAL&apos;</code>. The register is ' + num((det || []).length) +
        ' documents ranked by exception, and it is a work list rather than a complete file wherever ' +
        'it reaches its cap.</div>' +
      '<div><b>Money</b> — the stock cost is what SAP put back into <i>inventory</i>; the header ' +
        'value is what the return document itself was written for; neither is what the customer was ' +
        'charged. Where SAP costed a return at nil the goods are still in the warehouse, and only ' +
        'the piece count can see them.</div>' +
      '<div><b>Book</b> — ' + esc(companyLabel(co)) + '. Figures from one company are not comparable ' +
        'with another’s, and the same CardCode is a different party in a different book.</div>' +
      '<div><b>Freshness</b> — ' + (asOf ? 'as of ' + esc(asOf) + '. ' : '') +
        (gen ? 'Built ' + esc(ago(gen)) + ' (' + esc(gen) + '). ' : 'Build time unknown. ') +
        'The underlying extract is rewritten every couple of minutes, so never mix a figure from ' +
        'this page with one read at a different time. The page re-reads the manifest every minute ' +
        'and redraws itself when the build moves.</div>' +
      '<div><b>Read-only</b> — this board issues no write to SAP, ever (CONTRACT §0.2).</div>' +
    '</div>' +
    '<p><a href="' + esc(hrefSection('methodology.html', co)) + '">Methodology and the corrections</a> · ' +
    '<a href="' + esc(hrefDerivation('rn-billed-uncredited-docs', co)) + '">How the headline is derived</a> · ' +
    '<a href="' + esc(hrefSection('receivables', co)) + '">Receivables — is the invoice still open?</a> · ' +
    '<a href="' + esc(hrefSection('goods-return', co)) + '">Goods returns (what JIVO sends BACK to vendors)</a> · ' +
    '<a href="' + esc(hrefSection('health', co)) + '">Build health</a></p>';
}

/* ══ 5. boot ═════════════════════════════════════════════════════════════ */

shell({
  title: 'Customer returns',
  subtitle: 'Stock handed back, and whether a credit note was ever raised for it',
  section: SECTION
});

render().catch(function (e) {
  const main = document.getElementById('main');
  if (main) {
    main.innerHTML = '';
    main.appendChild(empty({
      what: 'This page could not be rendered.',
      why: 'The data files loaded but the page failed while drawing them: ' +
           ((e && e.message) ? e.message : String(e)) +
           '. No figure on screen should be trusted until this is fixed.'
    }));
  }
  try { console.error('[return-note]', e); } catch (e2) { /* ignore */ }
});

onRefresh(render);
</script>
