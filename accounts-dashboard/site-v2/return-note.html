/* ────────────────────────────────────────────────────────────────────────────
   return-note.html — customer returns coming back INTO JIVO, and whether a
   credit note was ever raised against them.

   The question this page exists for: stock came back from a customer, the
   customer had already been billed for it, and no credit note was raised. That
   is money the customer has been charged for goods they no longer have. On
   this page it is RET_DOCS_NO_CN_BILLED and its cost twin, and everything else
   is arranged to stop that figure being read wrongly in either direction.

   Four things make a naive version of this page wrong, and all four are drawn
   on it rather than filed away:

     • The summary is FACETED. Six scopes (TOTAL, CLASS, CREDIT_NOTE,
       NO_CN_REASON, MONTH, CUSTOMER) are stacked in one array. Summing every
       row counts each return about four times. Every total on this page comes
       from the single row where SCOPE='TOTAL' and GRP_KEY='ALL'.
     • "No credit note" is THREE different things, and only one is an
       exception. NO_CN_REASON splits it: the delivery was invoiced (real work
       list), the delivery was never invoiced (no credit is due at all), or the
       return cites no base document (unanswerable from SAP's links). Counting
       the whole uncredited population as missing credits overstates the
       exception about 2x in Oil.
     • RET_GROSS is not the size of the return. Most return notes carry
       DocTotal = 0 — they are stock-movement documents and the money is
       settled on a separate credit note. RET_STOCK_COST is the size measure,
       and it is what SAP put back into INVENTORY, never what the goods were
       worth. The two answer different questions and both are labelled as such
       everywhere they appear.
     • CANCELED is three-valued (C-0021). The detail keeps all three states and
       decodes them into CANCEL_STATUS; this page shows LIVE rows by default
       and never lets a cancellation mirror pass as a real document.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */

/* ══ 2. small helpers ════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** `Rs 4.41 Cr` in the spec's prose → `₹4.41 Cr` on the page; `2x` → `2×`. */
function rupee(s) {
  return String(s).replace(/\bRs\s(?=[\d,])/g, '₹').replace(/(\d)x\b/g, '$1×');
}

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }

/** A count, or the honest word. */
function cnt(v) {
  return (v === null || v === undefined || isNaN(Number(v))) ? 'not computed' : num(Number(v));
}

/** A piece count, always named as pieces — single bottles, never cartons (C-0001). */
function pcs(v) {
  return (v === null || v === undefined || isNaN(Number(v)))
    ? 'not computed' : num(Number(v)) + ' pieces';
}

/** A percentage on the 0-100 scale the query already produced. */
function pc(v, dp) {
  return (v === null || v === undefined || isNaN(Number(v)))
    ? 'not computed' : Number(v).toFixed(dp === undefined ? 2 : dp) + '%';
}

/** A share worked out here, with an honest denominator test. */
function share(a, b, dp) {
  const x = Number(a), y = Number(b);
  if (!isFinite(x) || !isFinite(y) || y === 0) return null;
  return (100 * x / y).toFixed(dp === undefined ? 1 : dp) + '%';
}

/** Sum one column over rows, lifted to rupees by its unit suffix first (§4). */
function total(rows, col) {
  let t = 0;
  for (const r of (rows || [])) {
    const v = Number(scale(r[col], col));
    if (isFinite(v)) t += v;
  }
  return t;
}

/** Manifest KPI value, accepting both `{value}` and the short `{v}` shape. */
function kpi(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  if (!k) return null;
  const v = (k.value !== undefined) ? k.value : k.v;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/** A `<a class="cvcode">C-0021</a>` linked to the methodology page. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}

/** A section-local trap code, linked to its record further down THIS page. */
function rn(code) {
  return '<a class="cvcode" href="#' + esc(code) + '">' + esc(code) + '</a>';
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + src + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a chart: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/** Nil test that keeps 0 — a zero return count is data, a missing one is not. */
function nil(v) { return v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v)); }

/**
 * THE facet rule (trap 1). One stack of the result set, never the whole array.
 * `TOTAL` is the only stack with exactly one row, and its GRP_KEY is 'ALL' —
 * both tests, because a future stack could be named TOTAL_SOMETHING.
 */
function facet(rows, scope) {
  return (rows || []).filter(r => r && r.SCOPE === scope);
}
function totalRow(rows) {
  return (rows || []).find(r => r && r.SCOPE === 'TOTAL' && r.GRP_KEY === 'ALL') || null;
}
/** One row out of a stack, by key. Returns null when the GROUP BY omitted it. */
function facetRow(rows, scope, key) {
  return (rows || []).find(r => r && r.SCOPE === scope && r.GRP_KEY === key) || null;
}

/** ISO date for the browser's today, to test the build's as-of against it. */
function todayISO() {
  const d = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/**
 * The completeness rule for the capped register (trap 17, empty state 4).
 * The detail query orders by EXC_RANK and cuts at 500, so the cap eats the
 * HIGHEST rank first. A rank is therefore a complete population if and only if
 * a strictly higher rank also survived, or the file came back short of the cap.
 */
function rankComplete(det, rank) {
  if (!det || det.length < DETAIL_CAP) return true;
  return det.some(r => Number(r.EXC_RANK) > Number(rank));
}
/** Is every rank represented in `set` a complete population? */
function setComplete(det, set) {
  const seen = {};
  (set || []).forEach(r => { seen[Number(r.EXC_RANK)] = true; });
  return Object.keys(seen).every(k => rankComplete(det, Number(k)));
}

/** Read the page's own URL state: which rows, which cut, which sort. */
function urlState() {
  let p;
  try { p = new URLSearchParams(window.location.search); } catch (e) { p = new URLSearchParams(); }
  const st = String(p.get('state') || '').toUpperCase();
  const fl = String(p.get('flag') || '').toUpperCase();
  const rs = String(p.get('reason') || '').toUpperCase();
  const pcl = String(p.get('party_class') || '').toUpperCase();
  return {
    state:  CANCEL_SETS.some(s => s.key === st) ? st : 'LIVE',
    flag:   (fl === 'Y' || fl === 'N') ? fl : '',
    reason: (rs && REASON_LABEL[rs]) ? rs : '',
    pc:     (pcl && CLASS_LABEL[pcl]) ? pcl : '',
    billed: p.get('billed') === 'true' || p.get('billed') === '1',
    nilcost:p.get('nil_cost') === 'true' || p.get('nil_cost') === '1',
    facet:  String(p.get('facet') || '').toUpperCase(),
    sort:   p.get('sort') || '',
    dir:    p.get('dir') || 'desc'
  };
}

/** Rewrite one query parameter in place and re-render. No navigation. */
function setParam(name, value) {
  try {
    const url = new URL(window.location.href);
    if (value === null || value === '' || value === false) url.searchParams.delete(name);
    else url.searchParams.set(name, value);
    window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
  } catch (e) { /* a browser without URL still re-renders below */ }
  render();
}

/** A chip button that flips one URL parameter. */
function chip(label, on, n, title, onClick) {
  const b = h('<button type="button" class="chip" aria-pressed="' + (on ? 'true' : 'false') + '">' +
    esc(label) + (n === null || n === undefined ? '' : ' <span class="n">' + num(n) + '</span>') +
    '</button>');
  if (title) b.title = title;
  b.addEventListener('click', onClick);
  return b;
}

/** `{COL:[label,kind,meaning]}` → the `labels` map `table()` wants. */
function labelsFor(defs) {
  const o = {};
  Object.keys(defs).forEach(k => { o[k] = defs[k][0]; });
  return o;
}
/** `{COL:[label,kind,meaning]}` → the `units` map `table()` wants. */
function unitsFor(defs) {
  const o = {};
  Object.keys(defs).forEach(k => { o[k] = defs[k][1]; });
  return o;
}
/** The column glossary: what every header on the table below actually means. */
function glossary(defs, cols, title) {
  const box = h('<details class="note-box"><summary>' + esc(title) + '</summary></details>');
  const body = h('<div class="note-body prose" style="overflow-x:auto;max-width:100%"></div>');
  const dl = h('<dl></dl>');
  (cols || Object.keys(defs)).forEach(function (k) {
    if (!defs[k]) return;
    dl.appendChild(h('<dt><b>' + esc(defs[k][0]) + '</b> <code>' + esc(k) + '</code></dt>'));
    dl.appendChild(h('<dd>' + esc(rupee(defs[k][2])) + '</dd>'));
  });
  body.appendChild(dl);
  box.appendChild(body);
  return box;
}

/**
 * One detail row, decoded for a human. The raw columns keep their SAP names
 * (CONTRACT §2) — what changes is the VALUE of the four columns that ship as
 * codes: the three-valued cancel state, the Y/N uncredited flag, the reason
 * code and the 1/0 delivery-invoiced flag. Every logical test on this page
 * runs on the RAW rows; only the rows handed to `table()` are decoded, so a
 * filter can never disagree with what is drawn.
 */
function displayRow(r) {
  const o = {};
  for (const k in r) if (Object.prototype.hasOwnProperty.call(r, k)) o[k] = r[k];
  const live = r.CANCEL_STATUS === 'LIVE';
  o.CANCEL_STATUS = CANCEL_LABEL[r.CANCEL_STATUS] || r.CANCEL_STATUS;
  o.FLAG_NO_CREDIT_NOTE = !live ? 'not a live return'
    : (r.FLAG_NO_CREDIT_NOTE === 'Y' ? 'No credit note' : 'Credited');
  o.NO_CN_REASON = nil(r.NO_CN_REASON) ? null : (REASON_SHORT[r.NO_CN_REASON] || r.NO_CN_REASON);
  o.PARTY_CLASS = CLASS_LABEL[r.PARTY_CLASS] || r.PARTY_CLASS;
  o.BASE_DLN_INVOICED = !(Number(r.BASE_DLN_COUNT) > 0) ? 'No delivery cited'
    : (Number(r.BASE_DLN_INVOICED) === 1 ? 'Invoiced' : 'Never invoiced');
  o.DOC_STATUS = r.DOC_STATUS === 'O' ? 'O — SAP says open'
    : (r.DOC_STATUS === 'C' ? 'C — SAP says closed' : r.DOC_STATUS);
  /* SAP hands these over as an int when there is one and a string when there
     are several; forced to text so a document number is never formatted as a
     figure and never mangled by a comma-grouping. */
  o.BASE_DLN_DOCNUMS = nil(r.BASE_DLN_DOCNUMS) ? null : String(r.BASE_DLN_DOCNUMS);
  o.CN_DOCNUMS = nil(r.CN_DOCNUMS) ? null : String(r.CN_DOCNUMS);
  o.REASON = nil(r.REASON) ? null : String(r.REASON);
  return o;
}

/* ══ 3. render ═══════════════════════════════════════════════════════════ */

async function render() {
  const co   = company();
  const main = document.getElementById('main');
  const [m, d] = await Promise.all([manifest(), slice(SECTION, co)]);
  const rows = d.summary || [];
  const det  = d.detail  || [];
  const asOf = d.as_of || (m && m.as_of) || null;
  const sec  = (m && m.sections && m.sections[SECTION]) || null;

  main.innerHTML = '';
  const add = n => { if (n) main.appendChild(n); return n; };

  add(crumb([
    { label: 'Board', href: hrefSection('index.html', co) },
    { label: 'Customer returns' }
  ]));

  add(h(
    '<div class="pagehead">' +
      '<div class="ctx">Return note <span class="sep">·</span> ORDN · RDN1 · ODLN · OINV · ORIN · RIN1 · JDT1 · OCRD · OCRG' +
        (asOf ? ' <span class="sep">·</span> as of ' + esc(asOf) : '') + '</div>' +
      '<h1>Stock came back. Was the customer credited?</h1>' +
      '<p class="lede">Every customer return SAP put back on the shelf, and which of those returns ' +
      'the customer was <b>billed for and never credited</b>. That last set is the point of the page: ' +
      'the goods are back in JIVO’s warehouse and the invoice that charged for them still stands. ' +
      'Everything else here exists to stop that figure being read too big or too small.</p>' +
    '</div>'
  ));

  /* -- the section could not be read: say so, never print a zero ---------- */
  if (d.error || (sec && sec.status === 'error')) {
    add(empty({
      what: 'The return-note query did not return for ' + companyLabel(co) + '.',
      why: 'This is not “nothing came back” — it is unknown, and the other two books are not shown ' +
           'in its place. ' +
           (d.error ? 'Reader’s error: ' + d.error + ' ' : '') +
           ((sec && sec.error) ? 'Build error: ' + sec.error : ''),
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, asOf, rows, det);
    return;
  }

  const T = totalRow(rows);
  if (!rows.length || !T) {
    add(empty({
      what: 'The faceted total row is missing for ' + companyLabel(co) + '.',
      why: 'Every figure on this page is read from the single row where SCOPE = “TOTAL” and ' +
           'GRP_KEY = “ALL”, and all three books have always returned exactly one. Its absence means ' +
           'the build is incomplete — not that no customer ever sent anything back.',
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, asOf, rows, det);
    return;
  }

  /* Empty state 1 — a book before its first return note. Every SUM-derived
     column comes back NULL, not 0, so the page must not print a zero. */
  if (!(Number(T.RET_DOCS) > 0)) {
    add(empty({
      what: 'No return note has been raised in this book as at ' + (asOf || 'the build date') + '.',
      why: 'The total row exists but carries no live return, so every summed column is NULL rather ' +
           'than zero. Nothing on this page can be computed from an empty register, and a ₹0 ' +
           'headline would read as “nothing is uncredited”, which is a different statement. Invoiced ' +
           'sales in the same period were ' + inr(Number(T.SALES_NET)) + '.'
    }));
    paintFoot(m, co, asOf, rows, det);
    return;
  }

  const st        = urlState();
  const classes   = facet(rows, 'CLASS');
  const cnScope   = facet(rows, 'CREDIT_NOTE');
  const reasons   = facet(rows, 'NO_CN_REASON');
  const months    = facet(rows, 'MONTH').slice().sort((a, b) => String(a.GRP_KEY).localeCompare(String(b.GRP_KEY)));
  const customers = facet(rows, 'CUSTOMER');
  const hasCN     = facetRow(rows, 'CREDIT_NOTE', 'HAS_CREDIT_NOTE');
  const noCN      = facetRow(rows, 'CREDIT_NOTE', 'NO_CREDIT_NOTE');

  const live      = det.filter(r => r.CANCEL_STATUS === 'LIVE');
  const liveUncr  = live.filter(r => r.FLAG_NO_CREDIT_NOTE === 'Y');
  const liveCred  = live.filter(r => r.FLAG_NO_CREDIT_NOTE === 'N');
  const truncated = det.length >= DETAIL_CAP;

  /* -- freshness: this build is not today ------------------------------- */
  if (asOf && asOf !== todayISO()) {
    add(h(
      '<div class="caveat">' +
        '<b>This build is dated ' + esc(asOf) + ', not today.</b> Everything below is a snapshot of ' +
        'that moment. The underlying extract is rewritten every two minutes and the sales ' +
        'denominator moved 0.04% between two reads while this section was being specified, so never ' +
        'mix a figure from this page with one read at a different time.' +
      '</div>'
    ));
  }

  /* ── 3.1 the headline: billed, came back, never credited ─────────────── */
  const billedDocs = kpi(m, co, 'rn-billed-uncredited-docs');
  const uncrDocs   = kpi(m, co, 'rn-uncredited-docs');
  const uncrCost   = kpi(m, co, 'rn-uncredited-cost');

  add(kpiRow([
    { id:'rn-billed-uncredited-docs', label:'Billed, goods came back, never credited',
      value: billedDocs, unit:'count', tone:'bad',
      sub: uncrDocs === null ? 'the only actionable subset of the uncredited returns'
           : 'of ' + cnt(uncrDocs) + ' returns with no credit note linked at all',
      title:'RET_DOCS_NO_CN_BILLED on the single SCOPE=TOTAL row. The cited delivery WAS consumed by a live A/R invoice.' },
    { id:'rn-billed-uncredited-cost', label:'What that stock cost JIVO',
      value: kpi(m, co, 'rn-billed-uncredited-cost'), unit:'INR', tone:'bad',
      sub:'inventory cost of the work list — NOT what those goods were sold for' },
    { id:'rn-uncredited-docs', label:'Returns with no credit note linked in SAP',
      value: uncrDocs, unit:'count', tone:'warn',
      sub:'the whole work list; most of it turns out not to be an exception' },
    { id:'rn-uncredited-cost', label:'All uncredited returns, at cost',
      value: uncrCost, unit:'INR', tone:'warn',
      sub:'and the actionable part of it is the far smaller figure above' },
    { id:'rn-docs', label:'Live return notes in this book',
      value: kpi(m, co, 'rn-docs'), unit:'count',
      sub:'cancelled returns and their SAP mirrors are not in this count' },
    { id:'rn-stock-cost', label:'Stock value handed back',
      value: kpi(m, co, 'rn-stock-cost'), unit:'INR',
      sub:'what SAP put back into inventory — never what the goods were worth' }
  ]));

  add(h(
    '<div class="caveat">' +
      '<b>“No credit note” means no credit note LINKED in SAP.</b> ' + rn('RN-WORK-LIST-NOT-LOSS') +
      ' — thousands of JIVO’s live credit notes carry no base document on any line, so a customer ' +
      'who WAS credited by a standalone note still lands in this population. Treat it as a work ' +
      'list to check, never as a proven loss. It is also why the headline is the <i>billed</i> ' +
      'subset and not the whole of it: only there is it certain the customer was charged. ' +
      cv('C-0021') + ' — <code>ORDN.CANCELED</code> is three-valued (<code>N</code> live, ' +
      '<code>Y</code> the cancelled original, <code>C</code> SAP’s mirror of it), and every figure ' +
      'above counts <code>N</code> only; a “not equal to Y” filter would double-count every ' +
      'cancellation. ' + cv('C-0005') + ' ' + cv('C-0020') +
      ' — the biggest returner in the Oil book is JIVO’s own Mart company, sitting in card group ' +
      '“DELHI”, so the party class is decided on the group name <i>and</i> the card name.' +
    '</div>'
  ));

  /* ── 3.2 THE chart: the section's whole argument, drawn once ──────────── */
  {
    const c = card('Where the returned stock went, and how much of it is actually an exception',
      'RET_STOCK_COST → CREDIT_NOTE → NO_CN_REASON');

    const stock = Number(T.RET_STOCK_COST);
    const credited = hasCN ? Number(scale(hasCN.RET_STOCK_COST, 'RET_STOCK_COST')) : null;
    const rInv = facetRow(rows, 'NO_CN_REASON', 'FROM_DELIVERY_INVOICED');
    const rUnb = facetRow(rows, 'NO_CN_REASON', 'FROM_DELIVERY_UNBILLED');
    const rStd = facetRow(rows, 'NO_CN_REASON', 'STANDALONE_NO_LINK');

    if (isFinite(stock) && stock > 0 && credited !== null && noCN) {
      const steps = [
        { label:'Stock handed back, everything', value: stock, kind:'base', k:'rn-stock-cost' },
        { label:'Credited — a credit note exists', value: credited, kind:'sub' },
        { label:'Never credited', value: Number(scale(noCN.RET_STOCK_COST, 'RET_STOCK_COST')),
          kind:'total', k:'rn-uncredited-cost' }
      ];
      if (rUnb) steps.push({ label:'Never invoiced — no credit due',
        value: Number(scale(rUnb.RET_STOCK_COST, 'RET_STOCK_COST')), kind:'sub' });
      if (rStd) steps.push({ label:'No base link — unanswerable',
        value: Number(scale(rStd.RET_STOCK_COST, 'RET_STOCK_COST')), kind:'sub',
        k:'rn-standalone-cost' });
      steps.push({ label:'Billed and uncredited — the work list',
        value: rInv ? Number(scale(rInv.RET_STOCK_COST, 'RET_STOCK_COST')) : null,
        kind:'total', k:'rn-billed-uncredited-cost' });

      c.appendChild(waterfall(steps, {
        title: 'From every rupee of returned stock to the work list, ' + companyLabel(co),
        format: money,
        href: s => (s && s.src && s.src.k) ? hrefDerivation(s.src.k, co) : null
      }));

      const uncredShare = share(Number(noCN.RET_STOCK_COST), stock);
      const workShare = rInv ? share(Number(rInv.RET_STOCK_COST), Number(noCN.RET_STOCK_COST)) : null;
      c.appendChild(cap(
        'Read it as one sentence. SAP put <b>' + esc(inr(stock)) + '</b> of stock back on the shelf ' +
        'from customer returns in this book. ' +
        (uncredShare ? 'A credit note exists for all but <b>' + esc(uncredShare) + '</b> of it. ' : '') +
        'What is left splits three ways, and <b>only the last one is an exception</b>: goods that ' +
        'were never invoiced (no credit is due at all), returns citing no base document (SAP’s links ' +
        'cannot answer the question either way), and the work list — the customer was billed, the ' +
        'goods came back, and no credit note was raised. ' +
        (rInv ? 'That work list is <b>' + esc(inr(Number(rInv.RET_STOCK_COST))) + '</b> across ' +
                esc(cnt(rInv.RET_DOCS)) + ' documents' +
                (workShare ? ', ' + esc(workShare) + ' of the uncredited money' : '') + '. ' : '') +
        '<b>Every rupee here is inventory cost, not sales value.</b> ' + rn('RN-COST-OVER-REVENUE') +
        ' — what the customer was charged for the same goods is larger by the gross margin, and this ' +
        'section does not carry it.'
      ));
    } else {
      c.appendChild(empty({
        what: 'The stock-cost waterfall cannot be drawn for ' + companyLabel(co) + '.',
        why: 'It needs the TOTAL row, both credit-note rows and the reason split. ' +
             (credited === null ? 'The credited row is missing. ' : '') +
             (!noCN ? 'The uncredited row is missing. ' : '') +
             (!(stock > 0) ? 'The book’s total stock cost is ' + inr(stock) + ' — SAP valued every ' +
              'return in it at nil, so there is no money to take apart; read the piece counts below ' +
              'instead. ' : '') +
             'Nothing is drawn at zero in its place.'
      }));
    }
    add(c);
  }

  /* ── 3.3 the three reasons, in plain English ─────────────────────────── */
  {
    const c = card('Why those returns have no credit note',
      'NO_CN_REASON facet · a partition of the uncredited row ONLY');

    const grid = h('<div class="reasons"></div>');
    grid.style.display = 'grid';
    grid.style.gap = '14px';
    grid.style.gridTemplateColumns = 'repeat(auto-fit,minmax(min(100%,280px),1fr))';

    let drawn = 0;
    const missing = [];
    REASON_ORDER.forEach(function (key) {
      const r = facetRow(rows, 'NO_CN_REASON', key);
      if (!r) { missing.push(key); return; }
      drawn++;
      const cost = Number(scale(r.RET_STOCK_COST, 'RET_STOCK_COST'));
      const isWork = key === 'FROM_DELIVERY_INVOICED';
      const cell = h('<div class="mk' + (isWork ? ' is-bad' : '') + '"></div>');
      cell.appendChild(h('<div class="lab">' + esc(REASON_LABEL[key]) + '</div>'));
      cell.appendChild(h('<div class="val">' + esc(cnt(r.RET_DOCS)) + ' returns</div>'));
      cell.appendChild(h(
        '<div class="sub"><b>' + esc(inr(cost)) + '</b> at cost · ' + esc(pcs(r.RET_QTY_PCS)) +
        ' back<br>' + esc(rupee(REASON_WHY[key])) + '</div>'
      ));
      grid.appendChild(cell);
    });

    if (drawn) c.appendChild(grid);
    if (missing.length) {
      /* Empty state 7 — an absent row and a zero row are different statements. */
      c.appendChild(empty({
        what: missing.map(k => REASON_LABEL[k]).join('; ') + ' — no returns in this category.',
        why: 'The GROUP BY simply omits a bucket that is empty, so this row is absent rather than ' +
             'zero. It is not a build failure and it is not a figure: nothing in ' + companyLabel(co) +
             ' fell into it.'
      }));
    }

    c.appendChild(kpiRow([
      { id:'rn-standalone-cost', label:'Uncredited with no base link at all',
        value: kpi(m, co, 'rn-standalone-cost'), unit:'INR', tone:'warn',
        sub:'SAP’s document links cannot say whether credit was due' }
    ]));

    const sumDocs = reasons.reduce((a, r) => a + (Number(r.RET_DOCS) || 0), 0);
    c.appendChild(cap(
      '<b>These three add up to the uncredited row, not to the book.</b> ' +
      esc(cnt(sumDocs)) + ' documents here against ' + esc(cnt(noCN ? noCN.RET_DOCS : null)) +
      ' uncredited and ' + esc(cnt(T.RET_DOCS)) + ' live returns in total — adding this stack to the ' +
      'class rows to “get the total” counts the uncredited population twice. ' +
      'The middle bucket is the one that stops this page overstating itself: those goods were never ' +
      'invoiced, so no credit is owed on them at all. ' + rn('RN-FREETEXT-INVOICE-REF') +
      ' — many of the third bucket do name an invoice, but they name it in the free-text comments ' +
      'field in several incompatible formats, and this section deliberately never parses it. ' +
      'The work-list documents themselves are in the register at the bottom of this page: filter it ' +
      'to <i>' + esc(REASON_SHORT.FROM_DELIVERY_INVOICED) + '</i>.'
    ));
    add(c);
  }

  /* ── 3.4 who sent it back ────────────────────────────────────────────── */
  {
    const c = card('Who sent the stock back', 'CLASS facet · pieces and rupees on separate scales');
    const withReturns = classes.filter(r => Number(r.RET_DOCS) > 0);
    const noReturns   = classes.filter(r => !(Number(r.RET_DOCS) > 0));

    if (withReturns.length) {
      const g = h('<div class="classpair"></div>');
      g.style.display = 'grid';
      g.style.gap = '14px';
      g.style.gridTemplateColumns = 'repeat(auto-fit,minmax(min(100%,300px),1fr))';

      const left = h('<div></div>');
      left.appendChild(hbars(withReturns.map(r => ({
        name: CLASS_LABEL[r.GRP_KEY] || r.GRP_KEY,
        value: Number(r.RET_QTY_PCS) || 0
      })), { title:'Pieces handed back', unit:'n', format: num, sort:true, color:'--c2' }));
      const right = h('<div></div>');
      right.appendChild(hbars(withReturns.map(r => ({
        name: CLASS_LABEL[r.GRP_KEY] || r.GRP_KEY,
        value: Number(scale(r.RET_STOCK_COST, 'RET_STOCK_COST')) || 0
      })), { title:'Stock cost SAP booked back', format: money, sort:true, color:'--c1' }));
      g.appendChild(left); g.appendChild(right);
      c.appendChild(g);

      const nilCost = withReturns.filter(r => Number(r.RET_QTY_PCS) > 0 && !(Number(r.RET_STOCK_COST) > 0));
      c.appendChild(cap(
        '<b>Two bars per class on two independent scales, never one.</b> Pieces are single bottles ' +
        '(' + cv('C-0001') + ' — the “20 PCS” in an item name is carton configuration, not a pack ' +
        'count), and rupees are what SAP debited back into inventory. <b>Where the two disagree, ' +
        'real goods were costed at nil</b>: SAP values a return at the item’s moving-average cost in ' +
        'that warehouse, and where that average is zero the goods come back at book value zero. ' +
        rn('RN-ZERO-VALUATION') + ' — in Beverages that is 87.3% of everything returned, by pieces. ' +
        (nilCost.length
          ? '<b>Here: ' + esc(nilCost.map(r => CLASS_LABEL[r.GRP_KEY] || r.GRP_KEY).join(', ')) +
            ' returned goods that cost nothing at all in the books.</b> '
          : 'In this book every class that returned goods also carries a cost for them. ') +
        'Read the pieces first whenever the rupees look small.'
      ));

      /* Empty state 3 — returns with a nil valuation are not "nothing came back". */
      nilCost.forEach(function (r) {
        c.appendChild(empty({
          what: (CLASS_LABEL[r.GRP_KEY] || r.GRP_KEY) + ': SAP valued this at nil.',
          why: num(r.RET_DOCS) + ' return note(s) brought back ' + pcs(r.RET_QTY_PCS) +
               ' and SAP costed the receipt at zero, because the item’s moving-average cost in that ' +
               'warehouse is zero. A bare ₹0 in the cost column would read as “nothing came back”, ' +
               'which is false — the goods are physically in the warehouse.'
        }));
      });
    } else {
      c.appendChild(empty({
        what: 'No class in this book has a return against it.',
        why: 'The class stack re-totals to the whole book on every measure, so an entirely empty one ' +
             'contradicts the ' + cnt(T.RET_DOCS) + ' live returns on the total row. That is a ' +
             'disagreement inside the build, not a clean book.',
        href: hrefSection('health', co),
        hrefLabel: 'Check the build’s health'
      }));
    }

    c.appendChild(kpiRow([
      { id:'rn-external-cost', label:'Outside customers’ returns, at cost',
        value: kpi(m, co, 'rn-external-cost'), unit:'INR',
        sub:'the only class where a missing credit note can cost JIVO money' },
      { id:'rn-interco-cost', label:'Sister companies’ returns, at cost',
        value: kpi(m, co, 'rn-interco-cost'), unit:'INR',
        sub:'JIVO’s own stock coming back between its own books' }
    ]));

    /* Trap 11 — a class row can carry a real sales denominator and no returns. */
    if (noReturns.length) {
      c.appendChild(empty({
        what: noReturns.map(r => CLASS_LABEL[r.GRP_KEY] || r.GRP_KEY).join(', ') +
              ': no returns at all, but invoiced sales of ' +
              noReturns.map(r => inr(Number(scale(r.SALES_NET, 'SALES_NET')))).join(' / ') + '.',
        why: 'The return side and the sales side are joined with a FULL OUTER JOIN, so a class can ' +
             'appear with a real sales figure and an empty return column. It is not a fault, and it ' +
             'is not “a 0% return rate” worth celebrating either — nothing was measured. The row is ' +
             'shown rather than dropped so nobody rebuilds the sales denominator without it.'
      }));
    }
    add(c);
  }

  /* ── 3.5 month by month, credited against not ────────────────────────── */
  {
    const c = card('Stock returned each month, credited against never credited',
      'MONTH facet · RET_STOCK_COST split by RET_STOCK_COST_NO_CN');

    if (months.length > 1) {
      const bars = months.map(function (r) {
        const all = Number(scale(r.RET_STOCK_COST, 'RET_STOCK_COST')) || 0;
        const un  = Number(scale(r.RET_STOCK_COST_NO_CN, 'RET_STOCK_COST_NO_CN')) || 0;
        return {
          MONTH: String(r.GRP_KEY),
          CREDITED: Math.max(0, all - un),
          UNCREDITED: un
        };
      });
      c.appendChild(stackedBars(bars, {
        labelKey: 'MONTH', sort: false, top: 0, scheme: 'cat', format: money,
        keys: [
          { key:'CREDITED',   label:'A credit note was raised' },
          { key:'UNCREDITED', label:'Never credited' }
        ],
        title: 'Returned stock by month, ' + companyLabel(co)
      }));

      /* Trap 12 — the chart drops a bar whose total is zero, so name them. */
      const zeroDocs = months.filter(r => !(Number(r.RET_DOCS) > 0));
      const nilCost  = months.filter(r => Number(r.RET_DOCS) > 0 && !(Number(r.RET_STOCK_COST) > 0));
      const worst = bars.slice().sort((a, b) => b.UNCREDITED - a.UNCREDITED)[0];
      c.appendChild(cap(
        'The dark band is stock that came back and was credited; the second band is stock that came ' +
        'back and was not. <b>The stack is genuinely additive</b> — the month rows carry both the ' +
        'total and the uncredited part, so the credited band is the difference and nothing is ' +
        'inferred. ' +
        (worst && worst.UNCREDITED > 0
          ? 'The heaviest uncredited month is <b>' + esc(worst.MONTH) + '</b> at ' +
            esc(inr(worst.UNCREDITED)) + '. ' : '') +
        '<b>A bar with nothing in it is not drawn, and that is worth reading rather than ignoring.</b> ' +
        (zeroDocs.length
          ? esc(zeroDocs.map(r => r.GRP_KEY).join(', ')) + ' carr' + (zeroDocs.length === 1 ? 'ies' : 'y') +
            ' no return at all yet still appear' + (zeroDocs.length === 1 ? 's' : '') +
            ' in the data with real invoiced sales — the two sides are joined with a FULL OUTER JOIN. '
          : 'Every month in range carries at least one return. ') +
        (nilCost.length
          ? '<b>' + esc(num(nilCost.length)) + ' month(s) — ' + esc(nilCost.map(r => r.GRP_KEY).join(', ')) +
            ' — do have returns but no cost at all</b> (' +
            esc(cnt(nilCost.reduce((a, r) => a + (Number(r.RET_DOCS) || 0), 0))) + ' documents, ' +
            esc(pcs(nilCost.reduce((a, r) => a + (Number(r.RET_QTY_PCS) || 0), 0))) +
            '), because SAP valued every one of them at nil. They are missing from this chart and ' +
            'they are not missing from the warehouse. ' + rn('RN-ZERO-VALUATION') + ' '
          : '') +
        'Sorting is chronological, never by size.'
      ));
    } else if (months.length === 1) {
      c.appendChild(empty({
        what: 'This book has returns in only one month.',
        why: 'A single bar implies a trend that does not exist, so none is drawn: ' +
             String(months[0].GRP_KEY) + ' carries ' + inr(Number(months[0].RET_STOCK_COST)) +
             ' across ' + cnt(months[0].RET_DOCS) + ' returns.'
      }));
    } else {
      c.appendChild(empty({
        what: 'The month stack returned no rows.',
        why: 'MONTH re-totals to the whole book on every measure except the credit-note count, so an ' +
             'empty stack means the build is incomplete rather than that nothing was ever returned.'
      }));
    }
    add(c);
  }

  /* ── 3.6 the two rates, normalised ───────────────────────────────────── */
  {
    const c = card('Returns per rupee invoiced, month by month',
      'MONTH facet · RET_COST_PCT_OF_SALES and CN_PCT_OF_SALES');
    const usable = months.filter(r => Number(r.SALES_NET) > 0);

    if (usable.length > 1) {
      c.appendChild(lineArea([
        { name:'Returned stock, at cost', points: usable.map(r => ({ x: r.GRP_KEY, y: Number(r.RET_COST_PCT_OF_SALES) || 0 })) },
        { name:'Credited against returns', points: usable.map(r => ({ x: r.GRP_KEY, y: Number(r.CN_PCT_OF_SALES) || 0 })) }
      ], {
        title:'Both as a percentage of that month’s invoiced sales, ' + companyLabel(co),
        unit:'pct', dp:2, height: 240
      }));
      c.appendChild(cap(
        'Absolute return cost mostly tracks how big the month was; this normalises it, so a spike ' +
        'here is a real change in behaviour and not a busy month. <b>When the two lines diverge, ' +
        'the gap is the credit-note backlog</b> — stock coming back faster than credit notes are ' +
        'being raised against it. Both series are already percentages in the query and nothing is ' +
        'recomputed. ' + rn('RN-COST-OVER-REVENUE') + ' — the first line is inventory COST over ' +
        'sales REVENUE, which is the right way to size the stock coming back and the wrong number to ' +
        'quote as “x% of our sales came back”. ' + rn('RN-CN-PCT-IS-NARROW') +
        ' — the second counts ONLY credit notes raised against a return note, so it is far smaller ' +
        'than JIVO’s whole credit-note rate; invoice-based and standalone notes are outside it by ' +
        'definition. ' + rn('RN-SALES-IS-NOT-TURNOVER') + ' — the denominator is invoices BEFORE ' +
        'credit notes are deducted, deliberately, because netting them off would make the ratio ' +
        'circular. It is not JIVO turnover.' +
        (usable.length < months.length
          ? ' ' + esc(num(months.length - usable.length)) + ' month(s) have no invoiced sales and ' +
            'carry no ratio at all; they are left out rather than drawn at zero.'
          : '')
      ));
    } else {
      c.appendChild(empty({
        what: 'There is no rate to plot for ' + companyLabel(co) + '.',
        why: 'A ratio needs a denominator: fewer than two months in this book carry invoiced sales, ' +
             'and dividing by a missing or zero sales figure would print a confident 0.00% where ' +
             'there is no measurement at all.'
      }));
    }

    c.appendChild(kpiRow([
      { id:'rn-cost-pct-sales', label:'Returned stock at cost, per rupee invoiced',
        value: kpi(m, co, 'rn-cost-pct-sales'), unit:'pct',
        sub:'inventory cost ÷ invoiced sales — unlike over unlike, on purpose' },
      { id:'rn-cn-pct-sales', label:'Credit notes on returns, per rupee invoiced',
        value: kpi(m, co, 'rn-cn-pct-sales'), unit:'pct',
        sub:'only notes raised against a return note, not all sales returns' },
      { id:'rn-cn-net', label:'Credited against returns, ex-GST',
        value: kpi(m, co, 'rn-cn-net'), unit:'INR',
        sub:'summed line by line — one return here carries 82 separate credit notes' },
      { id:'rn-sales-net', label:'Invoiced sales — the denominator',
        value: kpi(m, co, 'rn-sales-net'), unit:'INR',
        sub:'before credit notes are deducted; deliberately not JIVO turnover' }
    ]));
    add(c);
  }

  /* ── 3.7 which customers ─────────────────────────────────────────────── */
  {
    const c = card('Which customers the returns come from',
      'CUSTOMER facet · top 40 by stock cost, with the tail restored');

    const items = customers.map(r => ({
      label: String(r.GRP_LABEL || r.GRP_KEY),
      value: Number(scale(r.RET_STOCK_COST, 'RET_STOCK_COST')) || 0,
      CARD: r.GRP_KEY
    })).filter(i => i.value > 0);

    const shown40 = items.reduce((a, b) => a + b.value, 0);
    const book = Number(T.RET_STOCK_COST);
    const rest = isFinite(book) ? book - shown40 : 0;
    const coverage = share(shown40, book);

    if (items.length) {
      /* Empty state 9 — without the remainder bar the cumulative line runs to
         100% and silently claims the top 40 are the whole book. */
      const withTail = items.slice();
      if (rest > Math.max(1, book * 0.0005)) {
        withTail.push({ label:'All other customers (not in the top 40)', value: rest, CARD: null });
      }
      c.appendChild(pareto(withTail, {
        title:'Ranked by stock cost returned, with the running share of the whole book',
        top: 12, format: money,
        href: it => (it && it.src && it.src.CARD) ? hrefParty(it.src.CARD, co) : null
      }));
      const sorted = items.slice().sort((a, b) => b.value - a.value);
      const top1 = sorted[0];
      const t5 = sorted.slice(0, 5).reduce((a, b) => a + b.value, 0);
      c.appendChild(cap(
        'Bars are each card’s share, the line is the running total, and <b>the running total is ' +
        'measured against the whole book and not against the forty cards drawn</b> — ' +
        (rest > Math.max(1, book * 0.0005)
          ? 'the tail is restored as a labelled remainder bar of ' + esc(inr(rest)) + ', because ' +
            'without it the line would reach 100% and claim the top forty are everything. '
          : 'here the top forty are ' + esc(coverage || 'effectively all') + ' of it, so the ' +
            'remainder is too small to draw and none is added. ') +
        (top1 ? '<b>' + esc(top1.label) + '</b> alone is ' + esc(share(top1.value, book) || '—') +
                ' of the book’s returned stock. ' : '') +
        '<b>The class is inside each label, in square brackets</b> — a bar reading ' +
        '<code>[INTERCOMPANY]</code> is JIVO’s own stock coming back and no customer will ever be ' +
        'credited for it. The top five together are ' + esc(share(t5, book) || '—') + '. ' +
        'Every bar links to that party’s ledger. ' + rn('RN-RAW-MATERIAL-DOCS') +
        ' — a card at the top of this list with no pieces and no sales beside it is usually a ' +
        'job-worker raw-material return booked on a customer-return document, not a customer at all.'
      ));
    } else {
      c.appendChild(empty({
        what: 'No customer in this book carries a costed return.',
        why: 'The customer stack ranks by stock cost, so it is empty when SAP valued every return at ' +
             'nil. That is not “nobody returned anything” — ' + cnt(T.RET_DOCS) + ' live returns ' +
             'brought back ' + pcs(T.RET_QTY_PCS) + '. Read the piece columns instead.'
      }));
    }
    add(c);
  }

  /* ── 3.8 returns against what the customer actually buys ─────────────── */
  {
    const c = card('Returns against sales, one dot per customer',
      'CUSTOMER facet · SALES_NET × RET_STOCK_COST');
    const plot = [], gutter = [];
    customers.forEach(function (r) {
      const x = Number(scale(r.SALES_NET, 'SALES_NET'));
      const y = Number(scale(r.RET_STOCK_COST, 'RET_STOCK_COST'));
      if (!(x > 0) || !isFinite(y)) { gutter.push(r); return; }
      plot.push({
        x: x, y: y,
        label: String(r.GRP_LABEL || r.GRP_KEY),
        group: Number(r.RET_DOCS_NO_CN) > 0 ? 'Has uncredited returns' : 'All credited',
        CARD: r.GRP_KEY
      });
    });

    if (plot.length > 1) {
      c.appendChild(scatter(plot, {
        title:'One dot per returning customer',
        xLabel:'invoiced sales', yLabel:'returned stock, at cost',
        xUnit:'INR', format: money, xFormat: money,
        href: p => (p && p.src && p.src.CARD) ? hrefParty(p.src.CARD, co) : null
      }));
      const rate = share(Number(T.RET_STOCK_COST), Number(T.SALES_NET), 2);
      c.appendChild(cap(
        'This finds the customer who returns a lot <i>relative to what they actually buy</i>, which ' +
        'no ranked list can. The company average is ' + esc(rate || 'not computed') +
        ' of invoiced sales; a dot well above that slope is worth a call even when its absolute ' +
        'figure is small. <b>Dots are marked by whether that customer has any uncredited return</b>, ' +
        'so the credit-note gap and the return rate are on the same picture. Every dot links to the ' +
        'party ledger. Both axes are the summary’s own columns — sales revenue on one and inventory ' +
        'cost on the other, which is exactly why the slope is not a margin.'
      ));
    } else {
      c.appendChild(empty({
        what: 'There are not enough plottable customers to draw this.',
        why: 'A scatter needs at least two cards carrying both invoiced sales and a return cost. ' +
             'This book has ' + num(plot.length) + '.'
      }));
    }

    /* Empty state 2 / trap 13 — a customer with returns and no invoiced sales
       cannot sit on this plot, and must never be drawn at x = 0. */
    if (gutter.length) {
      c.appendChild(empty({
        what: num(gutter.length) + ' returning customer(s) have no invoiced sales at all and cannot ' +
              'be plotted: ' + gutter.map(r => String(r.GRP_LABEL || r.GRP_KEY)).join('; ') + '.',
        why: 'Their sales denominator is missing or zero, so no ratio can be formed for them — and ' +
             'drawing them at x = 0 would put them on the chart’s left edge as if they bought ' +
             'nothing, which is a claim the data does not make. Between them they returned ' +
             inr(gutter.reduce((a, r) => a + (Number(scale(r.RET_STOCK_COST, 'RET_STOCK_COST')) || 0), 0)) +
             ' of stock across ' + num(gutter.reduce((a, r) => a + (Number(r.RET_DOCS) || 0), 0)) +
             ' returns. A card like this is often a job-worker or an internal account rather than a ' +
             'customer.'
      }));
    }
    add(c);
  }

  /* ── 3.9 how much of this page is value-blind ────────────────────────── */
  {
    const c = card('How much of this section is value-blind',
      'RET_DOCS_ZERO_VALUE over RET_DOCS · the honesty gauge');
    const zero = Number(T.RET_DOCS_ZERO_VALUE), docs = Number(T.RET_DOCS);

    if (docs > 0 && isFinite(zero)) {
      c.appendChild(meter(zero, docs, {
        title:'Return notes booked with no value on them, ' + companyLabel(co),
        label:'carry DocTotal = 0', maxLabel:'live return notes',
        unit:'n', format: num, invert: true, warnAt: 0.25, badAt: 0.5
      }));
      c.appendChild(kpiRow([
        { id:'rn-gross', label:'Header value of all returns',
          value: kpi(m, co, 'rn-gross'), unit:'INR',
          sub:'what the documents say — NOT the size of the return' },
        { id:'rn-zero-value-docs', label:'Return notes booked at zero value',
          value: kpi(m, co, 'rn-zero-value-docs'), unit:'count', tone:'warn',
          sub: share(zero, docs) ? share(zero, docs) + ' of every live return in this book' : undefined },
        { id:'rn-qty-pcs', label:'Pieces handed back',
          value: kpi(m, co, 'rn-qty-pcs'), unit:'count',
          sub:'single bottles, never cartons — the size measure that always works' }
      ]));
      const ratio = (Number(T.RET_GROSS) > 0)
        ? (Number(T.RET_STOCK_COST) / Number(T.RET_GROSS)).toFixed(2) + '×' : null;
      c.appendChild(cap(
        '<b>The higher this gauge reads, the less any header-value figure on this page means.</b> ' +
        esc(cnt(zero)) + ' of ' + esc(cnt(docs)) + ' live returns carry <code>DocTotal = 0</code>: ' +
        'the note was used as a pure stock-movement document and the money was settled on a separate ' +
        'credit note. ' + rn('RN-GROSS-IS-NOT-SIZE') + ' — reading the header value as “value ' +
        'returned” understates the position badly' +
        (ratio ? ', and here the stock cost is <b>' + esc(ratio) + '</b> the header value' : '') +
        '. The two are published side by side precisely so the gap is visible. ' +
        '<b>And they are different questions, not two estimates of one.</b> The stock cost is what ' +
        'SAP debited back into inventory; the header value is what the return document itself was ' +
        'written for. Neither is what the customer was charged — that lives on the invoice. ' +
        'Where both money columns fail, the piece count does not: ' + esc(pcs(T.RET_QTY_PCS)) +
        ' came back. ' + rn('RN-MIXED-UOM') + ' — a further ' +
        esc(cnt(T.RET_QTY_OTHER_UOM)) + ' units of quantity sit on lines measured in something ' +
        'other than pieces (grams, litres, sets), and the two must never be added.'
      ));
    } else {
      c.appendChild(empty({
        what: 'The value-blind gauge cannot be drawn.',
        why: 'It needs a live return count as its denominator and this book reports ' + cnt(docs) +
             '. A meter against a zero denominator would draw an empty bar that reads as “none”, ' +
             'which is not the same as “not measured”.'
      }));
    }
    add(c);
  }

  /* ── 3.10 how old the uncredited returns are ─────────────────────────── */
  {
    const c = card('How old the uncredited returns are',
      'register · AGE_DAYS banded, split by why it is uncredited');
    const complete = setComplete(det, liveUncr);

    if (liveUncr.length && complete) {
      const bars = AGE_BANDS.map(function (b) {
        const set = liveUncr.filter(r => !nil(r.AGE_DAYS) && b[1](Number(r.AGE_DAYS)));
        const row = { BAND: b[0] };
        REASON_ORDER.forEach(function (k) {
          row[k] = set.filter(r => r.NO_CN_REASON === k)
                      .reduce((a, r) => a + (Number(scale(r.STOCK_COST, 'STOCK_COST')) || 0), 0);
        });
        return row;
      });
      c.appendChild(stackedBars(bars, {
        labelKey:'BAND', sort:false, top:0, scheme:'cat', format: money,
        keys: REASON_ORDER.map(k => ({ key: k, label: REASON_SHORT[k] })),
        title:'Uncredited returns by age, ' + companyLabel(co)
      }));
      const oldest = liveUncr.slice().sort((a, b) => Number(b.AGE_DAYS) - Number(a.AGE_DAYS))[0];
      const old90 = liveUncr.filter(r => Number(r.AGE_DAYS) > 90);
      c.appendChild(cap(
        'Each band prints its rupee value inside the bar and its total at the right, so nothing here ' +
        'depends on colour. <b>Age is the age of the DOCUMENT, not of an outstanding balance</b> — a ' +
        'return note carries no balance and nothing in this section is overdue in the receivables ' +
        'sense. What age does say is how long a credit note has been not-raised: ' +
        esc(num(old90.length)) + ' of these ' + esc(num(liveUncr.length)) +
        ' are more than ninety days old, worth ' +
        esc(inr(old90.reduce((a, r) => a + (Number(scale(r.STOCK_COST, 'STOCK_COST')) || 0), 0))) +
        ' at cost' +
        (oldest ? ', and the oldest was raised on ' + esc(String(oldest.DOC_DATE)) + ' — ' +
                  esc(num(oldest.AGE_DAYS)) + ' days ago' : '') + '. ' +
        '<b>Only the first band colour is an exception.</b> The other two are returns where no credit ' +
        'is due, or where SAP cannot say. This chart is built from the register rather than the ' +
        'summary because the summary crosses age with nothing at all — and it is only drawn where ' +
        'the uncredited population survived the row cap intact.'
      ));
    } else if (liveUncr.length) {
      /* Empty state 4 — a total over a truncated register is not a total. */
      c.appendChild(empty({
        what: 'The uncredited register for ' + companyLabel(co) + ' is truncated, so it cannot be aged here.',
        why: 'The detail query is capped at ' + num(DETAIL_CAP) + ' rows and ordered by exception ' +
             'rank, so the cap eats the highest rank first. This book came back with ' +
             num(det.length) + ' rows and no rank above the ones on screen, which means the ' +
             'uncredited population itself is cut — the ' + num(liveUncr.length) +
             ' rows here are the largest of a bigger set, and banding them by age would draw a ' +
             'shape that is an artefact of the cap. The reason split for the whole book is in the ' +
             'summary facet at the bottom of this page.'
      }));
    } else {
      c.appendChild(empty({
        what: 'No uncredited return survived into this book’s register.',
        why: 'The summary reports ' + cnt(T.RET_DOCS_NO_CN) + ' uncredited returns, so an empty ' +
             'register here is a disagreement between the two queries rather than a clean book.',
        href: hrefSection('health', co),
        hrefLabel: 'Check the build’s health'
      }));
    }
    add(c);
  }

  /* ── 3.11 uncredited by month and reason ─────────────────────────────── */
  {
    const c = card('Uncredited returns by month and reason',
      'register · the only place month and reason meet');
    const complete = setComplete(det, liveUncr);
    const reasonsSeen = REASON_ORDER.filter(k => liveUncr.some(r => r.NO_CN_REASON === k));
    const monthsSeen = [];
    liveUncr.forEach(function (r) {
      const k = String(r.DOC_MONTH || '');
      if (k && monthsSeen.indexOf(k) < 0) monthsSeen.push(k);
    });
    monthsSeen.sort();

    if (complete && reasonsSeen.length > 1 && monthsSeen.length) {
      const values = reasonsSeen.map(function (k) {
        return monthsSeen.map(function (mn) {
          return liveUncr.filter(r => r.NO_CN_REASON === k && String(r.DOC_MONTH) === mn).length;
        });
      });
      c.appendChild(heatmap({
        rows: reasonsSeen.map(k => REASON_SHORT[k]),
        cols: monthsSeen,
        values: values
      }, { title:'How many uncredited returns, by month and reason', unit:'n', format: num, cellH: 34 }));

      let peak = null;
      reasonsSeen.forEach(function (k, ri) {
        monthsSeen.forEach(function (mn, ci) {
          if (!peak || values[ri][ci] > peak.n) peak = { n: values[ri][ci], r: REASON_SHORT[k], mn: mn };
        });
      });
      c.appendChild(cap(
        'The summary crosses month with nothing and reason with nothing, so this grid is the only ' +
        'place the two meet. <b>A solid block of cells is a one-off event; an even wash across every ' +
        'month is a standing process problem</b>, and the two want completely different responses. ' +
        (peak && peak.n > 0
          ? 'The heaviest cell is <b>' + esc(peak.r) + '</b> in ' + esc(peak.mn) + ' at ' +
            esc(num(peak.n)) + ' returns. ' : '') +
        'Cells count documents, not rupees, because the point here is how often it happens. It is ' +
        'built from the register, which is legitimate only because the uncredited ranks survived ' +
        'the row cap in this book — where they do not, this panel says so instead of drawing a ' +
        'shape made by the cap.'
      ));
    } else if (!complete) {
      /* Empty state 5 — verbatim in intent: a truncated register makes this a lie. */
      c.appendChild(empty({
        what: 'This grid cannot be drawn for ' + companyLabel(co) + '.',
        why: 'Its register is the ' + num(det.length) + ' largest rows of a bigger set and is ' +
             'truncated inside a single exception rank, so the reason axis has effectively one ' +
             'populated value. The picture would be a solid stripe implying this book has only one ' +
             'kind of uncredited return, which is false — the real split is in the NO_CN_REASON ' +
             'facet above and in the summary explorer below.',
        href: hrefSection(SECTION, co, { facet: 'NO_CN_REASON' }),
        hrefLabel: 'Open the reason facet'
      }));
    } else {
      c.appendChild(empty({
        what: 'There is only one kind of uncredited return in this book’s register.',
        why: 'A grid with a single row is a list, and a list of ' + num(monthsSeen.length) +
             ' months is already in the month chart above. Nothing is hidden: the reason split for ' +
             'the whole book is in the facet at the bottom of this page.'
      }));
    }
    add(c);
  }

  /* ── 3.12 how long a credit note takes when one IS raised ────────────── */
  {
    const c = card('When a credit note IS raised, how long does it take?',
      'register · CN_LAG_DAYS on live credited returns');
    const lags = liveCred.filter(r => !nil(r.CN_LAG_DAYS)).map(r => Number(r.CN_LAG_DAYS))
                         .filter(v => isFinite(v));
    const creditedInBook = hasCN ? Number(hasCN.RET_DOCS) : null;
    const sample = !(creditedInBook !== null && lags.length >= creditedInBook);

    if (lags.length) {
      const bands = LAG_BANDS.map(b => ({ name: b[0], value: lags.filter(b[1]).length }))
                             .filter(b => b.value > 0);
      c.appendChild(hbars(bands, {
        title:'How long from the return to its first credit note',
        unit:'n', format: num, sort:false, top: 0, color:'--c5'
      }));
      const sorted = lags.slice().sort((a, b) => a - b);
      const med = sorted.length % 2
        ? sorted[(sorted.length - 1) / 2]
        : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
      const mean = lags.reduce((a, b) => a + b, 0) / lags.length;
      c.appendChild(cap(
        '<b>Median ' + esc(num(med)) + ' day(s) from the return to its first credit note, mean ' +
        esc(num(mean)) + '</b>, over ' + esc(num(lags.length)) + ' credited returns' +
        (sample && creditedInBook !== null
          ? ' — and this is a <b>SAMPLE, not the population</b>. ' + rn('RN-DETAIL-CAP') +
            ': the register is capped and the credited returns are the first thing the cap eats, so ' +
            'these ' + esc(num(lags.length)) + ' are drawn from ' + esc(cnt(creditedInBook)) +
            ' credited returns in the book. Read the shape, not the exact median'
          : ' — the complete set for this book, because its whole register came back inside the cap') +
        '. <b>The lag is NULL, never zero, on every uncredited return</b>, so a median taken without ' +
        'dropping those nulls would report a same-day credit note on documents that have none at all. ' +
        'Same-day is the normal case at JIVO: the credit note is usually raised on the return itself. ' +
        'A long tail here is the same failure the top of this page counts, caught earlier.'
      ));
    } else {
      /* Empty state 6 — Mart's register holds no credited return at all. */
      c.appendChild(empty({
        what: 'No credited return is inside ' + companyLabel(co) + '’s register slice.',
        why: 'The lag is measured from the return to its first credit note, and every row that ' +
             'survived the ' + num(DETAIL_CAP) + '-row cap in this book is an uncredited one — the ' +
             'query ranks exceptions first, so credited returns are the first thing to be cut. ' +
             (creditedInBook ? 'The book itself has ' + cnt(creditedInBook) + ' credited returns; ' +
              'none of them is in this slice. ' : '') +
             'A median of 0 days would be a confident lie about documents that are not here.'
      }));
    }
    add(c);
  }

  /* ── 3.13 the register ───────────────────────────────────────────────── */
  {
    const c = card('Every return note in the register',
      SECTION + '.' + co + '.json · detail · ' + num(det.length) + ' rows');

    if (!det.length) {
      c.appendChild(empty({
        what: 'The register could not be built.',
        why: 'The summary reports ' + cnt(T.RET_DOCS) + ' live returns and ' +
             cnt(T.RET_DOCS_NO_CN) + ' of them uncredited, yet the detail query returned nothing. ' +
             'The two queries disagree — that is a build failure, not an empty book, and no empty ' +
             'table is drawn beside a non-zero figure.',
        href: hrefSection('health', co),
        hrefLabel: 'Check the build’s health'
      }));
      add(c);
    } else {
      /* state chips: C-0021 made operable */
      const bar1 = h('<div class="toolbar"></div>');
      const chips1 = h('<div class="chips" role="group" aria-label="Which documents"></div>');
      CANCEL_SETS.forEach(function (s) {
        const set = s.key === 'ALL' ? det : det.filter(r => r.CANCEL_STATUS === s.key);
        if (!set.length) return;
        chips1.appendChild(chip(s.label, st.state === s.key, set.length, s.why,
          () => setParam('state', s.key === 'LIVE' ? '' : s.key)));
      });
      bar1.appendChild(chips1);
      c.appendChild(bar1);

      /* credited / uncredited */
      const base = st.state === 'ALL' ? det : det.filter(r => r.CANCEL_STATUS === st.state);
      const bar2 = h('<div class="toolbar"></div>');
      const chips2 = h('<div class="chips" role="group" aria-label="Credited or not"></div>');
      chips2.appendChild(chip('Both', st.flag === '', base.length,
        'No credit-note filter.', () => setParam('flag', '')));
      chips2.appendChild(chip('No credit note', st.flag === 'Y',
        base.filter(r => r.FLAG_NO_CREDIT_NOTE === 'Y').length,
        'FLAG_NO_CREDIT_NOTE = “Y”. Computed for LIVE documents only — on a cancelled return this ' +
        'flag reads “N”, and that is not the same as credited.',
        () => setParam('flag', st.flag === 'Y' ? '' : 'Y')));
      chips2.appendChild(chip('Credited', st.flag === 'N',
        base.filter(r => r.FLAG_NO_CREDIT_NOTE === 'N').length,
        'At least one live credit note points at this return.',
        () => setParam('flag', st.flag === 'N' ? '' : 'N')));
      bar2.appendChild(chips2);
      c.appendChild(bar2);

      /* reason chips, in plain English */
      const bar3 = h('<div class="toolbar"></div>');
      const chips3 = h('<div class="chips" role="group" aria-label="Why it is uncredited"></div>');
      chips3.appendChild(chip('Any reason', st.reason === '', null,
        'No reason filter.', () => setParam('reason', '')));
      REASON_ORDER.forEach(function (k) {
        const set = base.filter(r => r.NO_CN_REASON === k);
        if (!set.length) return;
        chips3.appendChild(chip(REASON_SHORT[k], st.reason === k, set.length,
          REASON_WHY[k] + ' Worth ' + inr(total(set, 'STOCK_COST')) + ' at cost.',
          () => setParam('reason', st.reason === k ? '' : k)));
      });
      bar3.appendChild(chips3);
      c.appendChild(bar3);

      /* class + the extra cuts */
      const bar4 = h('<div class="toolbar"></div>');
      const chips4 = h('<div class="chips" role="group" aria-label="Extra cuts"></div>');
      const present = [];
      det.forEach(r => { if (r.PARTY_CLASS && present.indexOf(r.PARTY_CLASS) < 0) present.push(r.PARTY_CLASS); });
      present.forEach(function (k) {
        const set = base.filter(r => r.PARTY_CLASS === k);
        if (!set.length) return;
        chips4.appendChild(chip(CLASS_LABEL[k] || k, st.pc === k, set.length,
          CLASS_WHY[k] || '', () => setParam('party_class', st.pc === k ? '' : k)));
      });
      chips4.appendChild(chip('The delivery was invoiced', st.billed,
        base.filter(r => Number(r.BASE_DLN_COUNT) > 0 && Number(r.BASE_DLN_INVOICED) === 1).length,
        'The cited delivery was consumed by a live A/R invoice, so the customer was billed for these ' +
        'goods. It is a MAX across the cited deliveries, not an ALL — a return citing two deliveries ' +
        'where only one was invoiced reads as invoiced.',
        () => setParam('billed', st.billed ? '' : 'true')));
      chips4.appendChild(chip('SAP costed it at nil', st.nilcost,
        base.filter(r => Number(r.QTY_PCS) > 0 && !(Number(r.STOCK_COST) > 0)).length,
        'Real goods came back and the stock cost is zero, because the item’s moving-average cost in ' +
        'that warehouse is zero. Read the piece column on these rows, never the money.',
        () => setParam('nil_cost', st.nilcost ? '' : 'true')));
      bar4.appendChild(chips4);
      c.appendChild(bar4);

      /* apply — every test runs on the RAW rows */
      let shown = base.slice();
      const active = [];
      if (st.flag)    { shown = shown.filter(r => r.FLAG_NO_CREDIT_NOTE === st.flag); active.push(st.flag === 'Y' ? 'no credit note' : 'credited'); }
      if (st.reason)  { shown = shown.filter(r => r.NO_CN_REASON === st.reason); active.push(REASON_SHORT[st.reason]); }
      if (st.pc)      { shown = shown.filter(r => r.PARTY_CLASS === st.pc); active.push(CLASS_LABEL[st.pc] || st.pc); }
      if (st.billed)  { shown = shown.filter(r => Number(r.BASE_DLN_COUNT) > 0 && Number(r.BASE_DLN_INVOICED) === 1); active.push('the delivery was invoiced'); }
      if (st.nilcost) { shown = shown.filter(r => Number(r.QTY_PCS) > 0 && !(Number(r.STOCK_COST) > 0)); active.push('SAP costed it at nil'); }

      if (active.length) {
        const pill = h('<div class="toolbar"><span class="pill info">' + esc(active.join(' · ')) +
          '</span> <button type="button" class="btn sm">clear these filters</button></div>');
        pill.querySelector('button').addEventListener('click', function () {
          try {
            const url = new URL(window.location.href);
            ['flag','reason','party_class','billed','nil_cost'].forEach(k => url.searchParams.delete(k));
            window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
          } catch (e) { /* still re-renders */ }
          render();
        });
        c.appendChild(pill);
      }

      /* Empty state 4 in operation: a totals row is offered ONLY where the
         ranks on screen are complete populations. Filtering to the exception
         ranks makes it legal again on Oil, and never on Mart. */
      const complete = setComplete(det, shown);
      const detCols = Object.keys(DET_COLS);
      const sortCol = (st.sort && detCols.indexOf(st.sort) >= 0) ? st.sort : 'STOCK_COST';

      c.appendChild(table(shown.map(displayRow), {
        co: co,
        cols: detCols,
        labels: labelsFor(DET_COLS),
        units: unitsFor(DET_COLS),
        links: {
          CARD_CODE: 'party',
          CARD_NAME: { kind:'party', card:'CARD_CODE' },
          DOC_NUM:   (v, r, cc) => (nil(r.DOC_ENTRY) ? null : hrefDocument(OBJ_RETURN, r.DOC_ENTRY, cc)),
          DOC_ENTRY: (v, r, cc) => (nil(v) ? null : hrefDocument(OBJ_RETURN, v, cc))
        },
        sort: (st.dir === 'asc' ? '' : '-') + sortCol,
        filter: 'Find a return by customer, document number or what the comment says…',
        facets: ['PARTY_CLASS','FLAG_NO_CREDIT_NOTE','NO_CN_REASON'],
        total: complete
          ? ['QTY_PCS','NET_AMT','GST_AMT','GROSS_AMT','STOCK_COST','CN_NET',
             'NUM_LINES','NUM_ITEMS','CN_COUNT','BASE_DLN_COUNT']
          : false,
        empty: {
          what: 'No return matches this cut.',
          why: 'The chips above filter a real, non-empty register — nothing matched this ' +
               'combination. That is not a zero; widen the filter to see the rows that exist.'
        },
        caption: 'Customer return notes — one row per document'
      }));

      c.appendChild(cap(
        (complete
          ? '<b>A totals row is shown because every exception rank on screen is a complete population</b> ' +
            'in this cut — either the whole register came back inside the ' + esc(num(DETAIL_CAP)) +
            '-row cap, or a strictly higher rank survived beside these rows, which is the only proof ' +
            'the cap did not eat any of them. '
          : '<b>No totals row is shown, on purpose.</b> This cut contains an exception rank the ' +
            'row cap truncated, so adding the column up would produce a figure that looks like a ' +
            'company total and is a partial one. ' + rn('RN-DETAIL-CAP') +
            ' — filter to the uncredited rows and it becomes legal again where the data supports it. ') +
        'The column to read is <code>Stock value back</code> — what SAP put into inventory — and ' +
        '<b>a zero there means SAP costed the goods at nil, not that nothing came back</b>: check ' +
        'the piece column beside it. <b>“Was the delivery invoiced?” is the column that turns a ' +
        'missing credit note into real money</b>, and ' + rn('RN-MULTI-DELIVERY-MAX') +
        ' — it is a MAX across the deliveries a return cites, not an ALL, so a return drawing on two ' +
        'deliveries where only one was invoiced reads as invoiced. <b>“Credited?” is decoded, not raw</b>: a cancelled return ' +
        'carries the raw flag “N”, which does not mean credited, so those rows read “not a live ' +
        'return” instead. Delivery and credit-note numbers are shown as text on purpose — SAP hands ' +
        'them over as a number when there is one and a comma-separated string when there are ' +
        'several, and the credit-note list is truncated at 200 characters, so counting its commas ' +
        'does not recover the credit-note count. They are <code>DocNum</code>s and not ' +
        '<code>DocEntry</code>s, so neither can be linked to its own document from here; the return ' +
        'note itself can. ' + cv('C-0019') + ' — the SAP status column is a labelled diagnostic and ' +
        'drives nothing.'
      ));

      c.appendChild(glossary(DET_COLS, detCols, 'What every column on this table means'));

      if (truncated) {
        const ranks = {};
        det.forEach(r => { ranks[Number(r.EXC_RANK)] = (ranks[Number(r.EXC_RANK)] || 0) + 1; });
        const desc = Object.keys(ranks).sort().map(function (k) {
          return 'rank ' + k + ': ' + num(ranks[k]) + ' row(s), ' +
                 (rankComplete(det, Number(k)) ? 'complete' : 'TRUNCATED');
        }).join(' · ');
        c.appendChild(empty({
          what: 'This register is truncated at the query cap of ' + num(DETAIL_CAP) + ' rows.',
          why: 'The detail query is hard-capped and ordered by exception rank, so the cap eats the ' +
               'HIGHEST rank first — the ordinary, already-credited returns go before any exception ' +
               'does. In this book: ' + desc + '. A rank is a complete population only when a ' +
               'strictly higher rank is present beside it. Every figure in the KPI rows and charts ' +
               'above that is not explicitly built from this register comes from the summary query, ' +
               'which aggregates in SQL before any cap applies and is therefore unaffected.'
        }));
      }
      add(c);
    }
  }

  /* ── 3.14 the facet explorer ─────────────────────────────────────────── */
  {
    const c = card('The same book, cut six ways', 'the faceted summary · ' + num(rows.length) + ' rows');
    c.appendChild(h(
      '<p class="blurb">This one result set stacks six independent aggregates of the same company. ' +
      '<b>Adding every row together counts each return about four times</b> — it is the single ' +
      'biggest mistake available on this page. Pick one stack, and read what it does and does not ' +
      're-total to before rebuilding anything from it.</p>'
    ));
    const barF = h('<div class="toolbar"></div>');
    const chipsF = h('<div class="chips" role="group" aria-label="Which facet"></div>');
    const current = FACETS.some(f => f[0] === st.facet) ? st.facet : 'CLASS';
    FACETS.forEach(function (f) {
      const set = facet(rows, f[0]);
      if (!set.length) return;
      chipsF.appendChild(chip(f[1], current === f[0], set.length, f[2],
        () => setParam('facet', f[0])));
    });
    barF.appendChild(chipsF);
    c.appendChild(barF);

    const fRows = facet(rows, current);
    const meta = FACETS.find(f => f[0] === current);
    const sumCols = ['GRP_KEY','GRP_LABEL','RET_DOCS','RET_DOCS_ZERO_VALUE','RET_QTY_PCS',
                     'RET_QTY_OTHER_UOM','RET_GROSS','RET_STOCK_COST','RET_DOCS_FROM_DELIVERY',
                     'RET_DOCS_NO_CN','RET_DOCS_NO_CN_BILLED','RET_QTY_PCS_NO_CN',
                     'RET_STOCK_COST_NO_CN','CN_DOCS','CN_NET','SALES_NET','CN_PCT_OF_SALES',
                     'RET_COST_PCT_OF_SALES','RET_DOCS_OPEN']
                    .filter(k => k in SUM_COLS);
    /* CLASS and MONTH re-total to the book; MONTH does so on every measure
       EXCEPT the credit-note count, which is a distinct count inside each
       group and legitimately counts one note in two months. */
    const totalCols = (current === 'CLASS')
      ? ['RET_DOCS','RET_DOCS_ZERO_VALUE','RET_QTY_PCS','RET_GROSS','RET_STOCK_COST',
         'RET_DOCS_FROM_DELIVERY','RET_DOCS_NO_CN','RET_DOCS_NO_CN_BILLED','RET_QTY_PCS_NO_CN',
         'RET_STOCK_COST_NO_CN','CN_NET','SALES_NET']
      : (current === 'MONTH')
        ? ['RET_DOCS','RET_DOCS_ZERO_VALUE','RET_QTY_PCS','RET_GROSS','RET_STOCK_COST',
           'RET_DOCS_FROM_DELIVERY','RET_DOCS_NO_CN','RET_DOCS_NO_CN_BILLED','RET_QTY_PCS_NO_CN',
           'RET_STOCK_COST_NO_CN','CN_NET','SALES_NET']
        : false;

    c.appendChild(table(fRows, {
      co: co,
      cols: sumCols,
      labels: labelsFor(SUM_COLS),
      units: unitsFor(SUM_COLS),
      links: (current === 'CUSTOMER')
        ? { GRP_KEY: 'party', GRP_LABEL: { kind:'party', card:'GRP_KEY' } } : {},
      sort: current === 'MONTH' ? 'GRP_KEY' : '-RET_STOCK_COST',
      filter: 'Find a row in this stack…',
      total: totalCols,
      empty: { what:'This stack is empty in ' + companyLabel(co) + '.',
               why:'The query produced no rows for this facet in this book.' },
      caption: 'Summary facet: ' + (meta ? meta[1] : current)
    }));

    c.appendChild(cap(
      (meta ? '<b>' + esc(meta[1]) + '</b> — ' + esc(meta[2]) + ' ' : '') +
      (current === 'CLASS'
        ? 'A totals row is shown: this stack re-totals to the whole book to the paisa on every measure.'
        : current === 'MONTH'
          ? 'A totals row is shown, <b>but the credit-note count is deliberately left out of it</b>. ' +
            'That column is a distinct count computed inside each month, and one credit note can ' +
            'credit returns dated in two different months — it is rightly counted in both, so its ' +
            'column sum is legitimately larger than the book’s.'
          : current === 'TOTAL'
            ? '<b>No totals row: this stack is the whole book already</b>, and every headline figure ' +
              'on this page is read from it.'
            : current === 'CREDIT_NOTE'
              ? '<b>No totals row.</b> The two rows do add up to the book on the document and stock ' +
                'measures, but the sales denominator and both ratios are NULL here by construction, ' +
                'and a totals row that silently treats those NULLs as zero would print a confident ₹0 ' +
                'of sales.'
              : current === 'NO_CN_REASON'
                ? '<b>No totals row, and this is the trap the whole page turns on.</b> These rows ' +
                  'partition the UNCREDITED row, not the book. They sum to ' +
                  esc(cnt(noCN ? noCN.RET_DOCS : null)) + ' uncredited returns, never to the ' +
                  esc(cnt(T.RET_DOCS)) + ' live returns this book holds.'
                : '<b>No totals row: this stack is the top 40 by stock cost only.</b> Re-totalling ' +
                  'from it silently understates — here it covers ' +
                  esc(share(total(customers, 'RET_STOCK_COST'), Number(T.RET_STOCK_COST)) || 'an unknown share') +
                  ' of the book’s returned stock, and the customer chart above restores the ' +
                  'remainder as a labelled bar rather than letting a cumulative line reach 100%.') +
      ' Both ratio columns and the sales denominator are NULL wherever there are no invoiced sales; ' +
      'they are shown empty rather than as 0.00%.'
    ));
    c.appendChild(glossary(SUM_COLS, sumCols, 'What every column on this table means'));

    if (rows.length >= SUMMARY_CAP) {
      c.appendChild(empty({
        what: 'The summary is truncated at the query cap of ' + num(SUMMARY_CAP) + ' rows.',
        why: 'One of the bounded stacks has grown past its own limit, so this explorer is not showing ' +
             'every row the book has. The TOTAL row and the re-totalling stacks are unaffected.'
      }));
    }
    add(c);
  }

  /* ── 3.15 how to read this ───────────────────────────────────────────── */
  {
    const c = card('How to read this', 'every way a naive version of this page goes wrong');
    c.appendChild(h(
      '<p class="blurb">These are not caveats in the small-print sense. Each one is a specific, ' +
      'measured way that the obvious reading of this data produces a wrong number, found by ' +
      'attacking the query against live SAP. The figures inside them are from the ' +
      '2026-08-22 19:05 build and are quoted as they were measured.</p>'
    ));
    const ol = h('<div class="prose"><ol></ol></div>');
    const list = ol.querySelector('ol');
    TRAPS.forEach(function (t) { list.appendChild(h('<li>' + esc(rupee(t)) + '</li>')); });
    c.appendChild(ol);

    /* The section-local trap codes referenced above resolve here. */
    const dl = h('<div class="prose"><h3>The section’s own caveat codes</h3><dl></dl></div>');
    const dld = dl.querySelector('dl');
    Object.keys(RN_CAVEATS).forEach(function (code) {
      dld.appendChild(h('<dt id="' + esc(code) + '"><b>' + esc(code) + '</b></dt>'));
      dld.appendChild(h('<dd>' + esc(rupee(RN_CAVEATS[code])) + '</dd>'));
    });
    c.appendChild(dl);

    c.appendChild(h(
      '<p class="tnote">The global corrections behind this page: ' +
      ['C-0001','C-0005','C-0019','C-0020','C-0021'].map(cv).join(' ') +
      ' — each links to its full record on the methodology page. ' + cv('C-0001') +
      ' is why every quantity here is in <b>pieces</b>, single bottles, and never cartons: the ' +
      '“20 PCS” in an item name is carton configuration only. Lines measured in anything else — ' +
      'grams, litres, sets — are carried in their own column and the two are never added.</p>'
    ));
    c.appendChild(h(
      '<p class="tnote"><b>What this section cannot answer.</b> It cannot tell you whether a customer ' +
      'was credited by a standalone credit note that names no base document — thousands of JIVO’s ' +
      'live credit notes are exactly that, and a proximity probe suggested roughly half of Oil’s ' +
      'billed-uncredited returns may be credited that way. That probe is an inference and is ' +
      'deliberately not a column on this page. It also cannot value the goods at what the customer ' +
      'paid: the stock cost is SAP’s inventory posting, and the invoice that charged for the same ' +
      'goods is in receivables. And it carries no account code, so the inventory and cost-of-sales ' +
      'accounts these postings land on (the 1103xxx and 5000xxx families) are named on the ' +
      'methodology page rather than linked per row — a per-row general-ledger link here would be ' +
      'invented.</p>'
    ));
    /* ui.js note() gives its own scroller, and this second one costs nothing —
       an OPEN disclosure full of unbreakable column names must not push the
       page sideways at 390px, and assets/ belongs to another agent. */
    const noteHost = h('<div style="overflow-x:auto;max-width:100%"></div>');
    noteHost.appendChild(note(SECTION));
    c.appendChild(noteHost);
    add(c);
  }

  /* ── 3.16 the SQL ────────────────────────────────────────────────────── */
  add(await sqlCard());

  paintFoot(m, co, asOf, rows, det);
}

/* ══ 4. pieces ═══════════════════════════════════════════════════════════ */

/**
 * The two queries behind this page, behind disclosures. `site-v2/` is the
 * deploy root, so `../pipeline/sql/...` 404s in production; the build copies
 * the queries to `sql/`. The index is consulted BEFORE the fetch — a
 * fetch-and-fail logs a console 404 the page cannot suppress, and the browser
 * gate counts console errors as failures, so a benign one would drown a real
 * one. No derivation record is fetched as a fallback: that file is 1.6 MB and
 * both queries are published beside the site.
 */
async function sqlCard() {
  const c = card('The queries behind this page', SQL_FILE + ' · ' + SQL_DETAIL);

  let idx = null;
  try {
    idx = await fetch(SQL_INDEX, { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null));
  } catch (e) { idx = null; }

  const wanted = [
    [SECTION, SQL_FILE, 'The summary query',
     'reads ORDN · RDN1 · ODLN · OINV · INV1 · ORIN · RIN1 · JDT1 · OCRD · OCRG'],
    [SECTION + '-detail', SQL_DETAIL, 'The register query',
     'the same sources, aggregated per DOCUMENT instead of per group']
  ];

  let any = false;
  for (const w of wanted) {
    if (!Array.isArray(idx) || idx.indexOf(w[0]) < 0) continue;
    let text = null;
    try {
      const r = await fetch(w[1], { cache: 'no-cache' });
      if (r.ok) text = await r.text();
    } catch (e) { text = null; }
    if (!text) continue;
    any = true;

    const box = h('<details class="sqlbox-host"><summary class="btn sm">' + esc(w[2]) +
      ' — show the SQL</summary></details>');
    box.style.margin = '0 0 12px';
    const body = h('<div style="margin-top:12px"></div>');
    const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    const html = lines.map(function (ln, i) {
      return '<span class="ln">' + (i + 1) + '</span>' + esc(ln);
    }).join('\n');
    body.appendChild(h('<div class="sqlbox"><pre><code>' + html + '</code></pre></div>'));
    body.appendChild(h('<div class="sqlfoot"><span>' + esc(w[1]) + '</span><span>' +
      num(lines.length) + ' lines</span><span>' + esc(w[3]) + '</span></div>'));
    box.appendChild(body);
    c.appendChild(box);
  }

  if (!any) {
    c.appendChild(empty({
      what: 'The query text is not published with this build.',
      why: 'Neither file is listed in ' + SQL_INDEX + ', so nothing was fetched — asking for a file ' +
