<script type="module">
/**
 * derivation.html — one template, every KPI.
 *
 * ?k=<kpi-id>&co=<company> resolves against data/derivations.<co>.json and
 * answers one question completely: where did this number come from? The value,
 * its cross-check, the formula as a waterfall, every term, what was excluded
 * and why, the SQL, the caveats and the rows underneath.
 *
 * Nothing here is invented. Every figure on the page is read from the
 * derivation record or recomputed in front of you from the section slice, and
 * anything the pipeline did not compute says so instead of printing a zero.
 */
import {
  shell, crumb, table, empty, checkDot,
  manifest, slice, derivations, company, companyLabel, onRefresh,
  money, moneyFull, num, esc, ago,
  hrefParty, hrefDocument, hrefSection, hrefCaveat, hrefDerivation
} from './assets/core.js';
import { waterfall, meter } from './assets/charts.js';

/* ══ 0. page constants ═══════════════════════════════════════════════════ */

const QS  = new URLSearchParams(location.search);
const KID = (QS.get('k') || '').trim();
const CO  = company();
const TOP = 50;

/** section id → the human name used in the breadcrumb and the nav. */
const SECTION_LABEL = {
  'customer-ageing': 'Receivables',
  'vendor-ageing':   'Payables',
  'open-item-list':  'Open items',
  'grpo':            'Goods receipts',
  'goods-return':    'Goods returns',
  'return-note':     'Sales returns',
  'provisions':      'Provisions',
  'cash-sale':       'Cash sales',
  'bank-accounts':   'Banks',
  'bank-reco':       'Bank reconciliation',
  'transporter':     'Transport'
};

/**
 * Columns worth showing for the contributing-rows table, per section and row
 * kind. Identity first, then the money. Anything not listed here is filled in
 * from the row itself, minus the `CO_*` broadcast columns (they are the same
 * number on every row — see the traps).
 */
const SECTION_COLS = {
  'vendor-ageing': {
    summary: ['CARD_CODE', 'CARD_NAME', 'VENDOR_GROUP', 'ACCT_KIND', 'ADJ_OPEN',
              'ADJ_OVERDUE_60PLUS', 'RAW_OPEN', 'CREDIT_APPLIED', 'OCRD_BALANCE', 'DAYS_OLDEST']
  },
  'customer-ageing': {
    summary: ['KIND', 'N_CUSTOMERS', 'N_OPEN_INV', 'RAW_OPEN_INR', 'UNAPPLIED_CREDIT_INR',
              'EFF_OPEN_INR', 'OD60P_INR', 'NOTDUE_INR', 'MIGRATED_OPEN_INR'],
    detail:  ['CARD_CODE', 'CARD_NAME', 'CUSTOMER_GROUP', 'ACCT_KIND', 'ADJ_OPEN',
              'ADJ_OVERDUE_60PLUS', 'RAW_OPEN', 'CREDIT_APPLIED', 'OCRD_BALANCE', 'DAYS_OLDEST']
  },
  'open-item-list': {
    summary: ['CARD_CODE', 'CARD_NAME', 'DOCTYPE', 'DOC_NUM', 'DOC_DATE', 'DUE_DATE',
              'AGE_BUCKET', 'DAYS_OVERDUE', 'OPEN_AMT', 'DOC_TOTAL', 'CURRENCY']
  },
  'grpo': {
    summary: ['SCOPE', 'GRP_KEY', 'GRP_LABEL', 'GRPO_DOCS', 'GRPO_GROSS', 'UNBILLED_GROSS',
              'UB_90PLUS_GROSS', 'EXT_UNBILLED_GROSS', 'OLDEST_UB_DAYS'],
    detail:  ['CARD_CODE', 'CARD_NAME', 'DOC_NUM', 'DOC_DATE', 'DOC_GROSS', 'OPEN_GROSS',
              'DAYS_OPEN', 'HAS_AP_INVOICE', 'PARTY_CLASS', 'BRANCH_NAME']
  },
  'goods-return': {
    summary: ['SCOPE', 'GRP_KEY', 'GRP_LABEL', 'RET_DOCS', 'RET_GROSS', 'RET_NET',
              'RET_GROSS_NO_CN', 'RET_NOCN_EXT_GROSS', 'RET_PCT_OF_GRPO'],
    detail:  ['CARD_CODE', 'CARD_NAME', 'DOC_NUM', 'DOC_DATE', 'GROSS_AMT', 'CN_GROSS',
              'CN_LAG_DAYS', 'AGE_DAYS', 'FLAG_NO_CREDIT_NOTE', 'PARTY_CLASS']
  },
  'return-note': {
    summary: ['SCOPE', 'GRP_KEY', 'GRP_LABEL', 'RET_DOCS', 'RET_GROSS', 'RET_NET',
              'RET_STOCK_COST', 'CN_NET', 'CN_PCT_OF_SALES', 'SALES_NET'],
    detail:  ['CARD_CODE', 'CARD_NAME', 'DOC_NUM', 'DOC_DATE', 'GROSS_AMT', 'NET_AMT',
              'STOCK_COST', 'CN_NET', 'CN_LAG_DAYS', 'FLAG_NO_CREDIT_NOTE']
  },
  'provisions': {
    summary: ['ACCT_CODE', 'ACCT_NAME', 'FAMILY', 'OUTSTANDING_CR_L', 'CREATED_FYTD_L',
              'REVERSED_FYTD_L', 'AGE_365P_L', 'OLDEST_OPEN_DAYS', 'DAYS_SINCE_LAST_POST']
  },
  'cash-sale': {
    summary: ['SECTION', 'ROW_KEY', 'ROW_LABEL', 'ROW_NOTE', 'INV_CNT', 'INV_GROSS_INR',
              'TURNOVER_NET_INR', 'CASH_TENDER_INR', 'LEDGER_BAL_INR', 'OPEN_INR']
  },
  'bank-accounts': {
    summary: ['BANK_NAME', 'ACCT_NO_MASKED', 'CATEGORY', 'BALANCE_L', 'FUNDS_AVAILABLE_L',
              'AMOUNT_DRAWN_L', 'RECEIPTS_IN_12M_L', 'PAYMENTS_OUT_12M_L', 'NET_12M_L',
              'DAYS_SINCE_LAST_MOVE', 'GL_ACCT_CODE']
  },
  'bank-reco': {
    summary: ['ACCT_CODE', 'ACCT_NAME', 'ACCT_KIND', 'RECO_STATUS', 'GL_BAL_L',
              'UNRECONCILED_DIFF_L', 'UNREC_90PLUS_L', 'UNREC_LINES_N', 'RECONS_DONE_N',
              'DAYS_SINCE_RECON_N'],
    detail:  ['ACCT_CODE', 'ACCT_NAME', 'RECON_NO', 'STMT_DATE', 'PERFORMED_DATE',
              'LAG_DAYS_N', 'CLEARED_NET_L', 'LINES_CLEARED_N', 'TIEOUT_DIFF_L']
  },
  'transporter': {
    summary: ['SCOPE', 'GRP_KEY', 'GRP_LABEL', 'VENDOR_CODE', 'VENDOR_NAME', 'DISP_DOCS',
              'DISP_VAL_L', 'EXT_DISP_VAL_L', 'FRT_SPEND_L', 'FILLED', 'FILL_PCT', 'NOTE'],
    detail:  ['VENDOR_NAME', 'YM', 'DISP_DOCS', 'DISP_VAL_L', 'EXT_DISP_VAL_L',
              'FRT_DOCS', 'FRT_SPEND_L', 'FRT_PCT_OF_DISP', 'LR_PCT', 'VEH_PCT']
  }
};

/** Aggregations this page will reproduce in the browser. Anything else is left alone. */
const REPRODUCIBLE_AGG = { sum: 1, max: 1, min: 1, first: 1, count: 1 };

/* ══ 1. tiny DOM + text helpers ══════════════════════════════════════════ */

/** @param {string} html @returns {HTMLElement} */
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}
/** @param {*} v @returns {boolean} */
function isNil(v) { return v === null || v === undefined || v === ''; }

/** Title-case a section or page id for a breadcrumb. */
function prettySection(id) {
  if (!id) return 'Section';
  if (SECTION_LABEL[id]) return SECTION_LABEL[id];
  const s = String(id).replace(/[-_]+/g, ' ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/**
 * Format a value the way its KPI unit says to. Money goes through `money()`,
 * which returns **null** for nil — that is how "not computed" stays visibly
 * different from a zero (CONTRACT §0.3).
 * @param {*} v @param {string} unit
 * @returns {string|null}
 */
function fmtUnit(v, unit) {
  if (isNil(v) || isNaN(Number(v))) return null;
  const n = Number(v);
  switch (unit) {
    case 'INR':   return money(n);
    case 'pct':   return n.toFixed(2) + '%';
    case 'days':  return num(n) + (Math.abs(n) === 1 ? ' day' : ' days');
    case 'count': return num(n);
    default:      return money(n);
  }
}

/**
 * Format one derivation TERM. The pipeline has already lifted every term to
 * rupees — `TOT_BANK_CURRENT_L` reads 5.52 in the section slice and 552000 in
 * the record — so `scale()` must NOT be applied here. It is applied to the raw
 * slice rows further down the page, where the column really is in lakhs.
 * @param {Object} t a terms[] entry @param {Object} d the derivation
 * @returns {string|null}
 */
function fmtTerm(t, d) {
  const v = t && t.value;
  if (isNil(v) || isNaN(Number(v))) return null;
  const n = Number(v), col = String(t.col || '');
  if (/_PCT$|_PCT_|^PCT_|_SHARE$/i.test(col)) return n.toFixed(2) + '%';
  if (/_L$|_CR$|_INR$/i.test(col)) return money(n);
  if (d.unit === 'INR') return money(n);
  if (/^N_|_N$|_DOCS$|_CNT$|_COUNT$|^FILLED$|^VARIANTS$/i.test(col)) return num(n);
  if (d.unit === 'days') return num(n) + ' d';
  return num(n);
}

/**
 * Turn correction codes inside free prose into links. `C-0019` and the like go
 * to methodology.html; a section-local code (`B-BROADCAST`, `TRN-TOPN`) links
 * to its own trap further down this page.
 *
 * Only two things are linked: `C-nnnn`, and codes this record actually carries
 * as a caveat. A looser pattern was tried and rejected — JIVO's prose is full
 * of hyphenated capitals (`E-COMMERCE`, `TOP-N`, `DOC-TYPE`, `YYYY-MM`) and it
 * turned 444 ordinary words into dead links to methodology anchors that do not
 * exist.
 *
 * @param {string} s raw prose @param {Set<string>} local this record's own codes
 * @returns {string} escaped HTML
 */
function linkCodes(s, local) {
  let out = esc(s == null ? '' : s);
  out = out.replace(/\bC-\d{4}\b/g, function (code) {
    return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + code + '</a>';
  });
  if (local && local.size) {
    const codes = Array.from(local)
      .filter(function (c) { return /^[A-Z][A-Z0-9-]{2,}$/.test(c); })
      .sort(function (a, b) { return b.length - a.length; });   // longest first
    if (codes.length) {
      // ONE pass, not one pass per code: a second pass would re-match a code
      // inside the markup the first pass just inserted.
      const re = new RegExp('\\b(?:' + codes.join('|') + ')\\b', 'g');
      out = out.replace(re, function (code) {
        return '<a class="cvcode" href="#' + esc(code) + '">' + esc(code) + '</a>';
      });
    }
  }
  return out;
}

/* ══ 2. the recorded row filter — parsed, never eval'd ════════════════════
   `rows.filter` is a Python expression written by the pipeline, e.g.
     r.get('ACCT_KIND') == 'TRADE' and (r.get('ADJ_OPEN') or 0) > 0
   The page re-applies it to the section slice so the rows underneath a figure
   are the rows that actually made it. It is parsed into a closure — no eval,
   no new Function — and a filter this parser cannot read is reported as
   unapplied rather than silently ignored.                                    */

function lex(src) {
  const s = String(src == null ? '' : src);
  const out = [];
  const NAME = /[A-Za-z_][A-Za-z_0-9]*/y, NUM = /[0-9]+(?:\.[0-9]+)?/y;
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === '#') break;                       // trailing comment
    if (/\s/.test(c)) { i++; continue; }
    if (c === '"' || c === "'") {
      const q = c; let j = i + 1, v = '';
      while (j < s.length && s[j] !== q) {
        if (s[j] === '\\') { v += s[j + 1]; j += 2; } else { v += s[j++]; }
      }
      if (j >= s.length) throw new Error('unterminated string');
      out.push({ t: 'str', v: v }); i = j + 1; continue;
    }
    NUM.lastIndex = i;
    const mn = NUM.exec(s);
    if (mn && mn.index === i) { out.push({ t: 'num', v: Number(mn[0]) }); i += mn[0].length; continue; }
    NAME.lastIndex = i;
    const mw = NAME.exec(s);
    if (mw && mw.index === i) { out.push({ t: 'name', v: mw[0] }); i += mw[0].length; continue; }
    const two = s.substr(i, 2);
    if (two === '==' || two === '!=' || two === '>=' || two === '<=') {
      out.push({ t: 'op', v: two }); i += 2; continue;
    }
    if ('<>+-*/()[],.'.indexOf(c) >= 0) { out.push({ t: 'op', v: c }); i++; continue; }
    throw new Error('unexpected character ' + JSON.stringify(c));
  }
  return out;
}

/** Python truthiness, which is not JavaScript's: `0`, `''`, `[]`, None are false. */
function truthy(v) {
  if (v === null || v === undefined || v === false) return false;
  if (typeof v === 'number') return v !== 0 && !isNaN(v);
  if (typeof v === 'string') return v.length > 0;
  if (Array.isArray(v)) return v.length > 0;
  return true;
}
function numOf(v) { const n = Number(v); return isNaN(n) ? NaN : n; }
function bothNum(a, b) {
  return !isNil(a) && !isNil(b) && !isNaN(Number(a)) && !isNaN(Number(b));
}
/** Python `==` — `None == 'x'` is False, `1 == '1'` is False unless both read numeric. */
function pyEq(a, b) {
  const an = a === null || a === undefined, bn = b === null || b === undefined;
  if (an || bn) return an && bn;
  if (typeof a === 'number' && typeof b === 'number') return a === b;
  if (typeof a === 'boolean' || typeof b === 'boolean') return a === b;
  if (bothNum(a, b) && (typeof a === 'number' || typeof b === 'number')) return Number(a) === Number(b);
  return String(a) === String(b);
}
function compare(op, a, b) {
  switch (op) {
    case '==': return pyEq(a, b);
    case '!=': return !pyEq(a, b);
    case 'is': return (a === null || a === undefined) && (b === null || b === undefined)
                    ? true : a === b;
    case 'is not': return !compare('is', a, b);
    case 'in': {
      if (Array.isArray(b)) return b.some(function (x) { return pyEq(x, a); });
      if (b === null || b === undefined) return false;
      return String(b).indexOf(String(a === null || a === undefined ? '' : a)) >= 0;
    }
    case 'not in': return !compare('in', a, b);
    default: {
      if (bothNum(a, b)) {
        const x = Number(a), y = Number(b);
        return op === '<' ? x < y : op === '>' ? x > y : op === '<=' ? x <= y : x >= y;
      }
      if (isNil(a) || isNil(b)) return false;
      const c = String(a).localeCompare(String(b));
      return op === '<' ? c < 0 : op === '>' ? c > 0 : op === '<=' ? c <= 0 : c >= 0;
    }
  }
}
function callMethod(name, obj, args) {
  const s = obj === null || obj === undefined ? '' : String(obj);
  switch (name) {
    case 'get': {
      if (!obj || typeof obj !== 'object') return null;
      const k = String(args[0]);
      if (Object.prototype.hasOwnProperty.call(obj, k)) {
        const v = obj[k];
        return v === undefined ? null : v;
      }
      return args.length > 1 ? args[1] : null;
    }
    case 'startswith': return s.indexOf(String(args[0])) === 0;
    case 'endswith':   return s.length >= String(args[0]).length &&
                              s.lastIndexOf(String(args[0])) === s.length - String(args[0]).length;
    case 'upper':      return s.toUpperCase();
    case 'lower':      return s.toLowerCase();
    case 'strip':      return s.trim();
    default: throw new Error('unsupported method .' + name + '()');
  }
}

/**
 * @param {string} src the Python expression from `rows.filter`
 * @returns {function(Object):boolean}
 * @throws {Error} when the expression uses something this parser does not know
 */
function parseFilter(src) {
  const T = lex(src);
  let p = 0;
  const peek = function () { return T[p]; };
  const next = function () { return T[p++]; };
  const isName = function (v) { const t = peek(); return !!t && t.t === 'name' && t.v === v; };
  const isOp = function (v) { const t = peek(); return !!t && t.t === 'op' && t.v === v; };
  const eatOp = function (v) {
    if (!isOp(v)) throw new Error('expected "' + v + '"');
    return next();
  };

  function args() {
    eatOp('(');
    const list = [];
    if (!isOp(')')) {
      list.push(orE());
      while (isOp(',')) { next(); list.push(orE()); }
    }
    eatOp(')');
    return list;
  }

  function primary() {
    const t = peek();
    if (!t) throw new Error('unexpected end of expression');
    if (t.t === 'num') { next(); return function () { return t.v; }; }
    if (t.t === 'str') { next(); return function () { return t.v; }; }
    if (t.t === 'name') {
      next();
      if (t.v === 'True')  return function () { return true; };
      if (t.v === 'False') return function () { return false; };
      if (t.v === 'None')  return function () { return null; };
      if (t.v === 'r')     return function (row) { return row; };
      if (t.v === 'float' || t.v === 'int' || t.v === 'str' || t.v === 'abs' || t.v === 'len') {
        const a = args();
        if (!a.length) throw new Error(t.v + '() needs an argument');
        const f = a[0], kind = t.v;
        return function (row) {
          const v = f(row);
          if (kind === 'str') return v === null || v === undefined ? '' : String(v);
          if (kind === 'len') return v === null || v === undefined ? 0 :
                                     (Array.isArray(v) ? v.length : String(v).length);
          const n = numOf(v);
          if (kind === 'int') return isNaN(n) ? NaN : Math.trunc(n);
          if (kind === 'abs') return isNaN(n) ? NaN : Math.abs(n);
          return n;
        };
      }
      throw new Error('unknown name "' + t.v + '"');
    }
    if (isOp('(')) {
      next();
      const first = orE();
      if (isOp(',')) {                       // a tuple, as in `in (None,'','INR')`
        const items = [first];
        while (isOp(',')) {
          next();
          if (isOp(')')) break;
          items.push(orE());
        }
        eatOp(')');
        return function (row) { return items.map(function (f) { return f(row); }); };
      }
      eatOp(')');
      return first;
    }
    throw new Error('unexpected token "' + t.v + '"');
  }

  function postfix() {
    let e = primary();
    for (;;) {
      if (isOp('.')) {
        next();
        const nm = next();
        if (!nm || nm.t !== 'name') throw new Error('method name expected after "."');
        const a = args(), base = e, meth = nm.v;
        e = function (row) {
          return callMethod(meth, base(row), a.map(function (f) { return f(row); }));
        };
      } else if (isOp('[')) {
        next();
        const ix = orE();
        eatOp(']');
        const base = e;
        e = function (row) {
          const o = base(row), k = ix(row);
          if (!o || typeof o !== 'object') return null;
          const v = o[String(k)];
          return v === undefined ? null : v;
        };
      } else break;
    }
    return e;
  }

  function unary() {
    if (isOp('-')) { next(); const e = unary(); return function (row) { return -numOf(e(row)); }; }
    if (isOp('+')) { next(); return unary(); }
    return postfix();
  }
  function term() {
    let l = unary();
    while (isOp('*') || isOp('/')) {
      const o = next().v, r = unary(), a = l;
      l = function (row) {
        const x = numOf(a(row)), y = numOf(r(row));
        return o === '*' ? x * y : (y === 0 ? NaN : x / y);
      };
    }
    return l;
  }
  function arith() {
    let l = term();
    while (isOp('+') || isOp('-')) {
      const o = next().v, r = term(), a = l;
      l = function (row) {
        const x = a(row), y = r(row);
        if (o === '+' && typeof x === 'string' && typeof y === 'string') return x + y;
        return o === '+' ? numOf(x) + numOf(y) : numOf(x) - numOf(y);
      };
    }
    return l;
  }
  function cmpE() {
    let l = arith();
    for (;;) {
      let op = null;
      const t = peek();
      if (t && t.t === 'op' && ['==', '!=', '>=', '<=', '>', '<'].indexOf(t.v) >= 0) op = next().v;
      else if (isName('in')) { next(); op = 'in'; }
      else if (isName('not') && T[p + 1] && T[p + 1].t === 'name' && T[p + 1].v === 'in') {
        next(); next(); op = 'not in';
      } else if (isName('is')) {
        next();
        if (isName('not')) { next(); op = 'is not'; } else op = 'is';
      } else break;
      const r = arith(), a = l, o = op;
      l = function (row) { return compare(o, a(row), r(row)); };
    }
    return l;
  }
  function notE() {
    if (isName('not')) { next(); const e = notE(); return function (row) { return !truthy(e(row)); }; }
    return cmpE();
  }
  function andE() {
    let l = notE();
    while (isName('and')) {
      next();
      const r = notE(), a = l;
      l = function (row) { const x = a(row); return truthy(x) ? r(row) : x; };
    }
    return l;
  }
  function orE() {
    let l = andE();
    while (isName('or')) {
      next();
      const r = andE(), a = l;
      l = function (row) { const x = a(row); return truthy(x) ? x : r(row); };
    }
    return l;
  }

  const fn = orE();
  if (p < T.length) throw new Error('unexpected trailing token "' + T[p].v + '"');
  return function (row) { return truthy(fn(row)); };
}

/** CONTRACT §4: the column suffix carries the unit. Raw slice rows only. */
function scaleRaw(v, col) {
  if (isNil(v) || isNaN(Number(v))) return null;
  if (/_CR$/i.test(col)) return Number(v) * 1e7;
  if (/_L$/i.test(col)) return Number(v) * 1e5;
  return Number(v);
}

/* ══ 3. panels ═══════════════════════════════════════════════════════════ */

/**
 * Which of green / amber / red this figure earned, and why in one sentence.
 * `check.ok` is genuinely three-valued in the data: true = a second route
 * reproduced it, false = the two routes disagree, null = there was no second
 * route, or the difference is live-book movement, or the value is corroborated
 * and only its term decomposition does not add up.
 * @param {Object} d @returns {{state:string, word:string, why:string}}
 */
function verdict(d) {
  const c = d.check || {};
  const m = String(c.method || '');
  if (c.ok === true) {
    return { state: 'ok', word: 'Corroborated',
             why: 'A second, independent route reproduced this figure.' };
  }
  if (c.ok === false) {
    return { state: 'bad', word: 'Routes disagree',
             why: 'The independent re-derivation did not reproduce this figure, and the gap is ' +
                  'too large to be movement in a live book. The number below is this board’s ' +
                  'derivation; judge it against the second figure yourself.' };
  }
  if (/no independent measurement/i.test(m)) {
    return { state: 'warn', word: 'No second route',
             why: 'Nothing else in the pipeline computes this figure, so there is nothing to ' +
                  'check it against. It is shown exactly as the query produced it.' };
  }
  if (/consistent with movement/i.test(m)) {
    return { state: 'warn', word: 'Moved since it was catalogued',
             why: 'The two routes differ by an amount consistent with movement in a live book ' +
                  'between the catalogue run and this build — close, but not corroborated.' };
  }
  if (/term decomposition/i.test(m)) {
    return { state: 'warn', word: 'Value corroborated, terms do not add up',
             why: 'The figure itself reproduces the independent measurement. What does not add ' +
                  'up is the published term list: those terms describe how the query was built, ' +
                  'they are not addends over a row set.' };
  }
  return { state: 'warn', word: 'Not corroborated',
           why: 'This build recorded no verdict for the cross-check.' };
}

/** The red banner. Only ever rendered when the two routes genuinely disagree. */
function panelDisagreement(d) {
  const c = d.check || {};
  const mine = fmtUnit(d.value, d.unit) || 'not computed';
  const alt  = fmtUnit(c.alt_value, d.unit) || 'not computed';
  const delta = isNil(c.delta) ? null : fmtUnit(c.delta, d.unit);
  const dpct = isNil(c.delta_pct) || isNaN(Number(c.delta_pct)) ? null
             : (Math.abs(Number(c.delta_pct)) >= 1000
                 ? num(Math.round(Number(c.delta_pct))) + '%'
                 : Number(c.delta_pct).toFixed(2) + '%');
  return el(
    '<div class="err" role="alert">' +
      '<b>Two routes to this figure disagree — it is shown anyway.</b>' +
      '<div>This board’s derivation: <b>' + esc(mine) + '</b>' +
        ' · the independent re-derivation: <b>' + esc(alt) + '</b>' +
        (delta ? ' · difference <b>' + esc(delta) + '</b>' : '') +
        (dpct ? ' (' + esc(dpct) + ')' : '') + '.</div>' +
      '<div>' + esc(String(c.method || 'No method was recorded for the check.')) + '</div>' +
      '<div>Nothing is hidden here: the figure below is the one the board publishes. ' +
        'Read the formula, the exclusions and the caveats before quoting it.</div>' +
    '</div>');
}

/** The figure itself, large, with its unit, as-of and check dot. */
function panelValue(d, m) {
  const v = verdict(d);
  const shown = fmtUnit(d.value, d.unit);
  const card = el('<section class="card" id="figure"></section>');

  const head = el(
    '<div class="card-head">' +
      '<h2>' + esc(d.label || d.id) + '</h2>' +
      '<span class="src">' + esc(d.id) + ' · ' + esc(companyLabel(CO) || CO) + '</span>' +
    '</div>');
  card.appendChild(head);

  const hero = el('<div class="dv-hero"></div>');
  if (shown === null) {
    hero.appendChild(el(
      '<span class="dv-val"><span class="nc" title="' +
      esc('The pipeline recorded no value for this KPI in this company. That is not a zero.') +
      '">not computed</span></span>'));
  } else {
    const neg = Number(d.value) < 0;
    hero.appendChild(el('<span class="dv-val' + (neg ? ' neg' : '') + '">' + esc(shown) + '</span>'));
  }
  const dot = el('<span class="dotlink"></span>');
  dot.appendChild(checkDot(d.id, CO));
  hero.appendChild(dot);
  hero.appendChild(el('<span class="pill ' + v.state + '">' + esc(v.word) + '</span>'));
  card.appendChild(hero);

  const bits = [];
  if (d.unit === 'INR' && !isNil(d.value)) {
    bits.push('<span class="dv-exact">' + esc(moneyFull(d.value)) + '</span>');
  }
  bits.push('unit <b>' + esc(d.unit || 'INR') + '</b>');
  if (m && m.as_of) bits.push('as of <b>' + esc(m.as_of) + '</b>');
  if (m && m.generated_at) {
    bits.push('built <b>' + esc(ago(m.generated_at)) + '</b>');
  }
  bits.push('<a href="' + esc(hrefSection(d.section, CO)) + '">' +
            esc(prettySection(d.section)) + '</a>');
  card.appendChild(el('<div class="dv-side">' + bits.join('<span aria-hidden="true">·</span>') + '</div>'));

  if (shown === null) {
    card.appendChild(empty({
      what: 'This figure was not computed for ' + (companyLabel(CO) || CO) + '.',
      why: 'The derivation record exists — its filter, SQL and caveats are all below — but its ' +
           'value is null in this build. A null here is not a zero and must never be read as one. ' +
           'The rows the filter selects are listed at the bottom of the page, so you can see ' +
           'what the query had to work with.',
      href: hrefSection(d.section, CO),
      hrefLabel: 'Open the ' + prettySection(d.section) + ' section'
    }));
  }
  return card;
}

/** The formula: the waterfall where the terms really are addends, then the terms table. */
function panelFormula(d, localCodes) {
  const card = el('<section class="card" id="formula"></section>');
  card.appendChild(el(
    '<div class="card-head"><h2>The formula</h2>' +
    '<span class="src">' + esc(d.method || 'direct') + '</span></div>'));

  if (d.formula) card.appendChild(el('<div class="formula">' + esc(d.formula) + '</div>'));

  const terms = Array.isArray(d.terms) ? d.terms : [];
  if (!terms.length) {
    card.appendChild(empty({
      what: 'No term decomposition was published for this figure.',
      why: 'The record carries a formula and a source column but no terms, so there is nothing ' +
           'to add up here. The SQL below is the whole derivation.'
    }));
    return card;
  }

  /* ── the chart, but only where the arithmetic is real ── */
  const arith = terms.filter(function (t) { return ['+', '-', '='].indexOf(t.op) >= 0; });
  const moves = arith.filter(function (t) { return t.op === '+' || t.op === '-'; });
  const chartable = arith.length >= 2 && moves.length >= 2 &&
                    arith[0].op === '+' &&
                    arith.every(function (t) { return !isNil(t.value) && !isNaN(Number(t.value)); });

  if (chartable) {
    const steps = arith.map(function (t, i) {
      return {
        label: String(t.label || t.col || ('Term ' + (i + 1))),
        value: Number(t.value),
        kind: t.op === '=' ? 'total' : (i === 0 ? 'base' : (t.op === '-' ? 'sub' : 'add'))
      };
    });
    // `table:false` on purpose, and only here: charts.js emits its disclosure
    // table so the numbers are reachable without colour, and the .terms table
    // immediately below carries exactly those numbers with their columns and
    // sources. Two identical tables would be noise, not access.
    card.appendChild(waterfall(steps, {
      title: d.label || d.id,
      format: function (v) { return fmtUnit(v, d.unit === 'pct' ? 'INR' : d.unit); },
      table: false
    }));
  } else {
    const why = moves.length < 2
      ? 'A single term is not a decomposition, so there is nothing to chart — the table below is the whole story.'
      : 'These terms are not addends over one row set, so charting them as a running balance would be a lie. The table below shows each term exactly as the record states it.';
    card.appendChild(el('<div class="note">' + esc(why) + '</div>'));
  }

  /* ── the terms table ── */
  const OPGLYPH = { '+': '+', '-': '−', '=': '=', 'x': '×', '/': '÷', 'info': '' };
  const rows = terms.map(function (t) {
    const op = String(t.op || '');
    const cls = op === '=' ? ' class="is-total"' : (op === '-' ? ' class="is-sub"' : '');
    const amt = fmtTerm(t, d);
    const neg = !isNil(t.value) && Number(t.value) < 0;
    const src = [];
    if (t.col && t.col !== '-') src.push(esc(t.col));
    if (t.source) src.push('<span class="muted">' + esc(t.source) + '</span>');
    return '<tr' + cls + '>' +
      '<td class="lab">' + esc(t.label || t.col || 'Term') +
        (op === 'info' ? ' <span class="pill info">context</span>' : '') +
        (t.note ? '<span class="why">' + linkCodes(t.note, localCodes) + '</span>' : '') +
      '</td>' +
      '<td class="op">' + esc(OPGLYPH[op] === undefined ? op : OPGLYPH[op]) + '</td>' +
      '<td class="amt' + (neg ? ' neg' : '') + '"' +
        (isNil(t.value) ? '' : ' title="' + esc(String(t.value)) + '"') + '>' +
        (amt === null
          ? '<span class="nc" title="' + esc('this term carries no value in the record') + '">not computed</span>'
          : esc(amt)) +
      '</td>' +
      '<td class="src">' + (src.length ? src.join('<br>') : '—') + '</td>' +
    '</tr>';
  }).join('');

  const scroll = el('<div class="dv-scroll"></div>');
  scroll.appendChild(el(
    '<table class="terms"><thead><tr>' +
      '<th class="lab" scope="col">Term</th>' +
      '<th scope="col"><span class="sr-only">Operator</span></th>' +
      '<th class="amt" scope="col">Value</th>' +
      '<th scope="col">Column · SAP source</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>'));
  card.appendChild(scroll);

  card.appendChild(el(
    '<div class="note">Term values are already in <b>rupees</b>. A column named <code>' +
    '…_L</code> or <code>…_CR</code> is in lakhs or crores <i>in the section slice</i>; the ' +
    'pipeline lifted it before writing this record, so nothing here needs scaling again.</div>'));

  /* ── closure ── */
  const cl = d.closure;
  if (cl && typeof cl === 'object') {
    const sum = fmtUnit(cl.terms_sum, d.unit), close = fmtUnit(cl.closing_term, d.unit);
    const delta = fmtUnit(cl.delta, d.unit), tol = fmtUnit(cl.tolerance, d.unit);
    if (cl.ok === true) {
      card.appendChild(el(
        '<div class="note"><b>The terms close.</b> They add to ' + esc(sum || '—') +
        ' against a stated closing term of ' + esc(close || '—') + ' — a difference of ' +
        esc(delta || '—') + ', inside a tolerance of ' + esc(tol || '—') + '.</div>'));
    } else {
      const note = d.closure_note ||
        ((d.check && /term decomposition/i.test(String(d.check.method || '')))
          ? String(d.check.method)
          : 'The published terms describe how the query built this figure; they are not addends ' +
            'over a row set, so they do not foot to the closing term.');
      card.appendChild(el(
        '<div class="caveat" id="closure"><b>The terms do not foot.</b> They add to ' +
        esc(sum || '—') + ' against a stated closing term of ' + esc(close || '—') +
        ' — a difference of ' + esc(delta || '—') + ' against a tolerance of ' + esc(tol || '—') +
        '. ' + esc(note) +
        ' This is a statement about the term list, not about the figure: the value itself is ' +
        'judged by the independent check below.</div>'));
    }
  } else if (d.closure_note) {
    card.appendChild(el('<div class="note">' + esc(d.closure_note) + '</div>'));
  }

  /* ── a division cannot be a waterfall, so a ratio gets a meter instead.
        Which term is the numerator is read from `method` ("ratio: A / B x 100"),
        never from the op glyph: the pipeline uses '/' for the numerator in one
        section and for the denominator in another. ── */
  const rm = /^ratio:\s*([A-Za-z0-9_]+)\s*\/\s*([A-Za-z0-9_]+)/i.exec(String(d.method || ''));
  if (rm) {
    const find = function (col) {
      return terms.filter(function (t) { return String(t.col) === col; })[0] || null;
    };
    const tn = find(rm[1]), td = find(rm[2]);
    if (tn && td && !isNil(tn.value) && !isNil(td.value) && Number(td.value) > 0) {
      // table:false for the same reason as the waterfall: both sides of the
      // ratio are already in the .terms table above, with their columns.
      card.appendChild(meter(Number(tn.value), Number(td.value), {
        title: rm[1] + ' as a share of ' + rm[2],
        label: '(' + String(tn.label || rm[1]) + ')',
        format: function (v) { return fmtTerm({ col: tn.col, value: v }, d); },
        table: false
      }));
    } else {
      card.appendChild(el('<div class="note">The ratio ' + esc(rm[1]) + ' / ' + esc(rm[2]) +
        ' cannot be drawn: one of its two sides is missing from the term list, or the ' +
        'denominator is not positive.</div>'));
    }
  }
  return card;
}

/** What was taken out — never silent, always named, always priced. */
function panelExcludes(d, localCodes) {
  const ex = Array.isArray(d.excludes) ? d.excludes : [];
  if (!ex.length) {
    return el('<div class="note" id="excluded"><b>Nothing was excluded.</b> This figure is the ' +
              'whole of what its filter selects — no branch, intercompany or staff cut was ' +
              'applied on top.</div>');
  }
  const host = el('<div class="excl" id="excluded"><h3>What was excluded</h3></div>');
  ex.forEach(function (e, i) {
    const amt = money(e.amount);
    const cards = Array.isArray(e.cards) ? e.cards : [];
    const row = el('<div class="excl-row"></div>');
    row.appendChild(el('<span class="lab">' + esc(e.label || 'Excluded') + '</span>'));
    row.appendChild(el('<span class="amt">' +
      (amt === null
        ? '<span class="nc" title="' + esc('no amount recorded for this exclusion') + '">not priced</span>'
        : esc(amt)) + '</span>'));
    const nrows = isNil(e.n_rows) ? null : num(e.n_rows);
    row.appendChild(el('<span class="why">' +
      (nrows ? '<b>' + esc(nrows) + ' row' + (Number(e.n_rows) === 1 ? '' : 's') + '</b> · ' : '') +
      linkCodes(e.why || 'no reason recorded', localCodes) + '</span>'));
    if (cards.length) {
      const det = el('<details><summary>' + esc(num(cards.length)) + ' card code' +
        (cards.length === 1 ? '' : 's') +
        (nrows && Number(e.n_rows) > cards.length
          ? ' named of ' + esc(nrows) + ' rows'
          : '') + '</summary><div class="codes"></div></details>');
      const codes = det.querySelector('.codes');
      cards.forEach(function (c) {
        codes.appendChild(el('<a href="' + esc(hrefParty(c, CO)) + '">' + esc(c) + '</a>'));
      });
      row.appendChild(det);
    }
    host.appendChild(row);
    if (i === ex.length - 1 && cards.length && !isNil(e.n_rows) && cards.length < Number(e.n_rows)) {
      host.appendChild(el('<div class="excl-row"><span class="why">The record names the cards it ' +
        'could name; where fewer codes are listed than rows, the rest are unnamed in this build ' +
        'and the amount still covers all of them.</span></div>'));
    }
  });
  return host;
}

/** The independent check, in words, with both figures and what the colours mean. */
function panelCheck(d) {
  const c = d.check || {};
  const v = verdict(d);
  const card = el('<section class="card" id="check"></section>');
  card.appendChild(el(
    '<div class="card-head"><h2>The independent check</h2>' +
    '<span class="src"><span class="pill ' + v.state + '">' + esc(v.word) + '</span></span></div>'));
  card.appendChild(el('<p class="blurb">' + esc(v.why) + '</p>'));

  const routes = el('<div class="dv-routes"></div>');
  const mine = fmtUnit(d.value, d.unit);
  const alt  = fmtUnit(c.alt_value, d.unit);
  routes.appendChild(el(
    '<div class="mk"><div class="lab">This board’s derivation</div><div class="val">' +
    (mine === null ? '<span class="nc">not computed</span>' : esc(mine)) +
    '</div><div class="sub">' + esc(d.method || 'direct') +
    (d.column ? ' · column ' + esc(d.column) : '') + '</div></div>'));
  routes.appendChild(el(
    '<div class="mk"><div class="lab">The second route</div><div class="val' +
    (v.state === 'bad' ? ' bad' : '') + '">' +
    (alt === null ? '<span class="nc" title="' +
       esc('no independent measurement exists for this KPI') + '">none exists</span>' : esc(alt)) +
    '</div><div class="sub">measured from the SQL when the section was catalogued</div></div>'));
  card.appendChild(routes);

  const delta = isNil(c.delta) ? null : fmtUnit(c.delta, d.unit);
  const dpct = isNil(c.delta_pct) || isNaN(Number(c.delta_pct)) ? null
             : (Math.abs(Number(c.delta_pct)) >= 1000
                 ? num(Math.round(Number(c.delta_pct))) + '%'
                 : Number(c.delta_pct).toFixed(4) + '%');
  card.appendChild(el(
    '<div class="kv">' +
      '<div><div class="k">Difference</div><div class="v">' +
        (delta === null ? '<span class="nc">not comparable</span>' : esc(delta)) +
        (dpct ? ' <span class="muted">(' + esc(dpct) + ')</span>' : '') + '</div></div>' +
      '<div><div class="k">Method</div><div class="v">' +
        esc(c.method || 'no method recorded') + '</div></div>' +
      '<div><div class="k">Reproduces the catalogued measurement</div><div class="v">' +
        (d.reproduces_spec_measurement === true ? 'yes'
          : d.reproduces_spec_measurement === false ? 'no' : 'not stated') + '</div></div>' +
      '<div><div class="k">Same figure in the other books</div><div class="v dv-key">' +
        ['oil', 'mart', 'bev'].map(function (k) {
          const sv = d.spec_live && (k in d.spec_live) ? fmtUnit(d.spec_live[k], d.unit) : null;
          return esc(k) + ' ' + (sv === null ? '—' : esc(sv));
        }).join(' · ') +
      '</div></div>' +
    '</div>'));

  card.appendChild(el(
    '<div class="dv-legend">' +
      '<div><span class="sw ok" aria-hidden="true"></span><span><b>Green</b> — a second, ' +
        'independent route reproduced the figure.</span></div>' +
      '<div><span class="sw warn" aria-hidden="true"></span><span><b>Amber</b> — no independent ' +
        'route exists, or the two differ by an amount consistent with movement in a live book. ' +
        'Amber is not a warning about the number; it is the absence of a corroboration.</span></div>' +
      '<div><span class="sw bad" aria-hidden="true"></span><span><b>Red</b> — the two routes ' +
        'genuinely disagree. The figure is still shown; go and look before quoting it.</span></div>' +
    '</div>'));
  return card;
}

/**
 * How it was computed — and, where the aggregation is one this page can honestly
 * repeat, the same sum done again in the browser from the section slice.
 * @param {Object} d @param {{rows:Object[], error:?string, filterError:?string}} sel
 */
function panelMethod(d, sel) {
  const card = el('<section class="card" id="how"></section>');
  card.appendChild(el('<div class="card-head"><h2>How it was computed</h2>' +
    '<span class="src">' + esc(d.row_source || '') + '</span></div>'));

  const kv = el('<div class="kv"></div>');
  function pair(k, v, mono) {
    kv.appendChild(el('<div><div class="k">' + esc(k) + '</div><div class="v' +
      (mono ? ' dv-key' : '') + '">' + v + '</div></div>'));
  }
  pair('Method', esc(d.method || 'direct'));
  pair('Aggregation', esc(d.agg || '—') + ' over <code>' + esc(d.column || '—') + '</code>');
  pair('Row source', esc(d.rows && d.rows.kind ? d.rows.kind : (d.row_source || '—')) +
       ' of <a href="' + esc(hrefSection(d.section, CO)) + '">' +
       esc(d.rows && d.rows.section ? d.rows.section : d.section) + '</a>');
  pair('Rows behind the figure', isNil(d.n_rows) ? '<span class="nc">not stated</span>' : esc(num(d.n_rows)));
  pair('Raw column value', isNil(d.raw_column_value)
        ? '<span class="nc">not computed</span>'
        : esc(fmtUnit(d.raw_column_value, d.unit) || String(d.raw_column_value)));
  card.appendChild(kv);

  card.appendChild(el('<div class="note"><b>The row filter, exactly as recorded:</b><br>' +
    '<code class="dv-key">' + esc((d.rows && d.rows.filter) || 'True') + '</code></div>'));

  /* the same aggregation, repeated here, from the same slice */
  const agg = String(d.agg || '');
  if (sel.error) {
    card.appendChild(el('<div class="note">The section slice could not be read, so the figure ' +
      'could not be recomputed here: ' + esc(sel.error) + '</div>'));
  } else if (sel.filterError) {
    card.appendChild(el('<div class="note">This page could not re-apply the recorded filter (' +
      esc(sel.filterError) + '), so it did not attempt to repeat the aggregation. The published ' +
      'figure is unaffected.</div>'));
  } else if (!REPRODUCIBLE_AGG[agg]) {
    card.appendChild(el('<div class="note">The aggregation <code>' + esc(agg || '—') +
      '</code> is not one this page repeats, so no browser-side recomputation is shown. ' +
      'The SQL below is the authority.</div>'));
  } else if (!d.column) {
    card.appendChild(el('<div class="note">No source column is recorded, so there is nothing to ' +
      're-aggregate here.</div>'));
  } else {
    const col = d.column;
    const vals = [];
    sel.rows.forEach(function (r) {
      const s = scaleRaw(r[col], col);
      if (s !== null) vals.push(s);
    });
    let got = null;
    if (agg === 'first') got = sel.rows.length ? scaleRaw(sel.rows[0][col], col) : null;
    else if (agg === 'count') got = sel.rows.length;
    else if (vals.length) {
      got = agg === 'sum' ? vals.reduce(function (a, b) { return a + b; }, 0)
          : agg === 'max' ? Math.max.apply(null, vals)
          : Math.min.apply(null, vals);
    }
    const expected = isNil(d.raw_column_value) ? null : Number(d.raw_column_value);
    let tone = 'info', word = 'recomputed here';
    if (got === null || expected === null) {
      tone = 'warn';
      word = got === null ? 'nothing to aggregate' : 'no published raw value to compare';
    } else {
      const tol = Math.max(1, Math.abs(expected) * 0.005);
      const agrees = Math.abs(got - expected) <= tol;
      tone = agrees ? 'ok' : 'bad';
      word = agrees ? 'agrees with the published figure' : 'does NOT match the published figure';
    }
    card.appendChild(el(
      '<div class="note"><b>Repeated in your browser, from <code>data/' +
      esc((d.rows && d.rows.section) || d.section) + '.' + esc(CO) + '.json</code>:</b> ' +
      esc(agg) + ' of <code>' + esc(col) + '</code> over ' + esc(num(sel.rows.length)) +
      ' filtered row' + (sel.rows.length === 1 ? '' : 's') + ' = <b>' +
      (got === null ? '—' : esc(fmtUnit(got, d.unit) || String(got))) + '</b>' +
      (expected === null ? '' : ' against a published raw column value of <b>' +
        esc(fmtUnit(expected, d.unit) || String(expected)) + '</b>') +
      ' <span class="pill ' + tone + '">' + esc(word) + '</span>' +
      (tone === 'bad'
        ? ' The published figure is the one the board stands behind; this line exists so a ' +
          'disagreement cannot hide.'
        : '') +
      '</div>'));
  }
  return card;
}

/** The query. Shown in full, with its real line numbers. */
function panelSql(d) {
  const sql = d.sql || {};
  const card = el('<section class="card" id="sql"></section>');
  card.appendChild(el('<div class="card-head"><h2>The SQL</h2>' +
    '<span class="src">' + esc(sql.file || 'no file recorded') + '</span></div>'));

  if (!sql.text) {
    card.appendChild(empty({
      what: 'No SQL was recorded for this figure.',
      why: 'The derivation names no query text, so the arithmetic above and the section slice ' +
           'are the whole audit trail.'
    }));
    return card;
  }
  const from = Array.isArray(sql.lines) && sql.lines.length ? Number(sql.lines[0]) : 1;
  const col = d.column ? String(d.column) : null;
  const lines = String(sql.text).replace(/\r\n?/g, '\n').split('\n');
  const body = lines.map(function (ln, i) {
    const n = from + i;
    const hit = col && ln.indexOf(col) >= 0;
    const html = '<span class="ln">' + n + '</span>' + esc(ln === '' ? ' ' : ln);
    return hit ? '<mark>' + html + '</mark>' : html;
  }).join('\n');

  card.appendChild(el('<div class="sqlbox"><pre><code>' + body + '</code></pre></div>'));
  const to = Array.isArray(sql.lines) && sql.lines.length > 1 ? sql.lines[1] : from + lines.length - 1;
  card.appendChild(el('<div class="sqlfoot">' +
    '<span>' + esc(sql.file || '—') + '</span>' +
    '<span>lines ' + esc(String(from)) + '–' + esc(String(to)) + '</span>' +
    (col ? '<span>highlighted: every line naming <code>' + esc(col) + '</code></span>' : '') +
  '</div>'));
  return card;
}

/** Caveats: the global corrections in full, then this section's own traps. */
function panelCaveats(d, localCodes) {
  const card = el('<section class="card" id="caveats"></section>');
  const cav = Array.isArray(d.caveats) ? d.caveats : [];
  const globals = cav.filter(function (c) { return c && c.scope === 'global'; });
  const locals = cav.filter(function (c) { return c && c.scope !== 'global'; });
  const traps = Array.isArray(d.section_traps) ? d.section_traps : [];

  card.appendChild(el('<div class="card-head"><h2>Caveats and traps</h2>' +
    '<span class="src">' + esc(num(globals.length)) + ' global · ' +
    esc(num(traps.length)) + ' section</span></div>'));

  if (!globals.length && !locals.length && !traps.length) {
    card.appendChild(empty({
      what: 'No caveat is recorded against this figure.',
      why: 'That means none was written down, not that none exists. The section traps and the ' +
           'corrections index are still worth reading.',
      href: 'methodology.html',
      hrefLabel: 'Open the methodology'
    }));
    return card;
  }

  globals.forEach(function (c) {
    const box = el('<div class="caveat" id="' + esc(c.id || '') + '"></div>');
    box.appendChild(el('<div><a class="cvcode" href="' + esc(hrefCaveat(c.id)) + '">' +
      esc(c.id || 'C-????') + '</a> <b>' + esc(c.title || '') + '</b></div>'));
    if (c.rule) box.appendChild(el('<div>' + linkCodes(c.rule, localCodes) + '</div>'));
    if (c.wrong || c.right) {
      const det = el('<details><summary>What was got wrong, and what is right</summary></details>');
      if (c.wrong) det.appendChild(el('<p><b>Wrong:</b> <s>' + esc(c.wrong) + '</s></p>'));
      if (c.right) det.appendChild(el('<p><b>Right:</b> ' + linkCodes(c.right, localCodes) + '</p>'));
      box.appendChild(det);
    }
    card.appendChild(box);
  });

  if (locals.length) {
    const chips = el('<div class="note"><b>Section-local codes on this figure.</b> ' +
      'Their prose is in the traps below.<div class="dv-codes"></div></div>');
    const host = chips.querySelector('.dv-codes');
    locals.forEach(function (c) {
      const id = String(c.id || c.title || '');
      host.appendChild(el('<a class="cvcode" href="#' + esc(id) + '">' + esc(id) + '</a>'));
    });
    card.appendChild(chips);
  }

  if (traps.length) {
    const box = el('<div class="note"><h3>What makes a naive version of this figure wrong</h3>' +
                   '<ol class="dv-list"></ol></div>');
    const list = box.querySelector('.dv-list');
    traps.forEach(function (t, i) {
      const text = String(t);
      const code = (text.match(/^([A-Z]{1,4}-[A-Z][A-Z0-9-]*)/) || [])[1] ||
                   (Array.from(localCodes).filter(function (c) { return text.indexOf(c) === 0; })[0]);
      const li = el('<li id="' + esc(code || ('trap-' + (i + 1))) + '">' +
                    linkCodes(text, localCodes) + '</li>');
      list.appendChild(li);
    });
    card.appendChild(box);
  }
  return card;
}

/** The rows the figure is made of — the top of them, linked out. */
function panelRows(d, sel) {
  const card = el('<section class="card" id="rows"></section>');
  const secId = (d.rows && d.rows.section) || d.section;
  const kind = (d.rows && d.rows.kind) || 'summary';
  const top = (d.rows && Number(d.rows.top)) || TOP;

  card.appendChild(el('<div class="card-head"><h2>The rows underneath</h2>' +
    '<span class="src">' + esc(secId) + ' · ' + esc(kind) + '</span></div>'));

  if (sel.error) {
    card.appendChild(empty({
      what: 'The section slice could not be read.',
      why: sel.error,
      href: hrefSection(secId, CO),
      hrefLabel: 'Open the ' + prettySection(secId) + ' section'
    }));
    return card;
  }
  if (!sel.all.length) {
    card.appendChild(empty({
      what: 'This section returned no ' + kind + ' rows for ' + (companyLabel(CO) || CO) + '.',
      why: 'That is the pipeline reporting an empty slice, which is not the same as a zero — ' +
           'the section may not run for this company, or the query returned nothing.',
      href: hrefSection(secId, CO),
      hrefLabel: 'Open the ' + prettySection(secId) + ' section'
    }));
    return card;
  }

  const rows = sel.rows;
  if (!rows.length) {
    card.appendChild(empty({
      what: 'No row in this slice matches the recorded filter.',
      why: 'The filter is ' + ((d.rows && d.rows.filter) || 'True') + ' over ' +
           num(sel.all.length) + ' ' + kind + ' rows. A figure with no rows behind it is worth ' +
           'questioning; the published value is still shown above, unchanged.'
    }));
    return card;
  }

  const cols = pickCols(rows, d);
  const sortCol = (d.column && cols.indexOf(d.column) >= 0) ? d.column : pickMoneyCol(rows, cols);
  const links = {};
  if (cols.indexOf('CARD_CODE') >= 0) links.CARD_CODE = 'party';
  if (cols.indexOf('VENDOR_CODE') >= 0) links.VENDOR_CODE = 'party';
  if (cols.indexOf('CARD_NAME') >= 0 && rows[0].CARD_CODE !== undefined) {
    links.CARD_NAME = { kind: 'party', card: 'CARD_CODE' };
  }
  if (cols.indexOf('DOC_NUM') >= 0 && rows[0].DOC_ENTRY !== undefined) {
    links.DOC_NUM = function (v, r) {
      const ot = r.OBJ_TYPE !== undefined ? r.OBJ_TYPE : objTypeFor(secId, r);
      return isNil(ot) || isNil(r.DOC_ENTRY) ? null : hrefDocument(ot, r.DOC_ENTRY, CO);
    };
  }
  if (cols.indexOf('GL_ACCT_CODE') >= 0) links.GL_ACCT_CODE = 'gl';
  if (cols.indexOf('ACCT_CODE') >= 0) {
    links.ACCT_CODE = secId === 'bank-reco' ? 'bank' : 'gl';
  }

  /* biggest money first, nulls last, then the top N — the same order the note
     and the shown-versus-all subtotal describe */
  const sorted = rows.slice().sort(function (a, b) {
    if (!sortCol) return 0;
    const x = scaleRaw(a[sortCol], sortCol), y = scaleRaw(b[sortCol], sortCol);
    if (x === null && y === null) return 0;
    if (x === null) return 1;
    if (y === null) return -1;
    return y - x;
  });
  const shown = sorted.slice(0, top);

  const notes = [];
  notes.push('Top ' + num(shown.length) + ' of ' + num(rows.length) +
             ' row' + (rows.length === 1 ? '' : 's') + ' matching the filter, out of ' +
             num(sel.all.length) + ' in the slice' +
             (sortCol ? ', ordered by ' + sortCol + ' descending' : '') + '.');
  // No totals row: it would foot only the rows on screen and read like the
  // headline figure. Both numbers are named instead.
  if (sortCol && !/^CO_/.test(sortCol) && d.agg === 'sum' && rows.length > shown.length) {
    let shownSum = 0, allSum = 0;
    sorted.forEach(function (r, i) {
      const v = scaleRaw(r[sortCol], sortCol);
      if (v === null) return;
      allSum += v;
      if (i < top) shownSum += v;
    });
    notes.push('Those ' + num(shown.length) + ' rows carry ' +
               (fmtUnit(shownSum, d.unit) || '—') + ' of the ' +
               (fmtUnit(allSum, d.unit) || '—') + ' the filter selects; the remainder is spread ' +
               'across the ' + num(rows.length - shown.length) + ' rows not shown.');
  }
  if (sortCol && /^CO_/.test(sortCol)) {
    notes.push('CO_* is a broadcast company total repeated identically on every row — read it ' +
               'off one row, never sum it down the table.');
  }
  if (sel.filterError) {
    notes.push('The recorded filter could not be parsed here (' + sel.filterError +
               '), so every row in the slice is listed. The published figure is unaffected.');
  }
  notes.push('Columns are unchanged from SAP and the SQL; CO_* broadcast columns are hidden ' +
             'unless the figure itself reads one.');

  card.appendChild(table(shown, {
    cols: cols,
    links: links,
    co: CO,
    sort: sortCol ? '-' + sortCol : undefined,
    filter: 'Filter these rows…',
    page: false,
    dense: true,
    total: false,
    note: notes.join(' '),
    caption: 'Rows behind ' + (d.label || d.id)
  }));

  const drill = drillHref(d);
  card.appendChild(el('<p class="blurb">' +
    '<a href="' + esc(hrefSection(secId, CO)) + '">Open the whole ' +
    esc(prettySection(secId)) + ' section</a>' +
    (drill ? ' · <a href="' + esc(drill) + '">the cut this figure came from</a>' : '') +
    '</p>'));
  return card;
}

/** SAP ObjType for a document row, where the section implies one and the row omits it. */
function objTypeFor(section, row) {
  if (row && row.DOCTYPE) {
    const map = { AR_INV: 13, AP_INV: 18, AR_CN: 14, AP_CN: 19, AR_RCT: 24, AP_PMT: 46 };
    if (map[row.DOCTYPE]) return map[row.DOCTYPE];
  }
  if (section === 'grpo') return 20;
  if (section === 'goods-return') return 21;
  if (section === 'return-note') return 16;
  return null;
}

/** Columns for the row table: the section's own order, then the figure's column. */
function pickCols(rows, d) {
  const keys = Object.keys(rows[0] || {});
  const sec = (d.rows && d.rows.section) || d.section;
  const kind = (d.rows && d.rows.kind) || 'summary';
  const pref = (SECTION_COLS[sec] || {})[kind] || [];
  const out = [];
  pref.forEach(function (c) { if (keys.indexOf(c) >= 0 && out.indexOf(c) < 0) out.push(c); });
  if (d.column && keys.indexOf(d.column) >= 0 && out.indexOf(d.column) < 0) out.push(d.column);
  for (let i = 0; i < keys.length && out.length < 11; i++) {
    const c = keys[i];
    if (/^CO_/.test(c) || /^DT_/.test(c)) continue;
    if (out.indexOf(c) < 0) out.push(c);
  }
  return out;
}

/** The money column to order by, when the figure's own column is not in the table. */
function pickMoneyCol(rows, cols) {
  const MONEY = /(_L|_CR|_INR|GROSS|NET|AMT|AMOUNT|VALUE|VAL|SPEND|BALANCE|OPEN|COST|TOTAL|PAYABLE|DRAWN)$/i;
  for (let i = 0; i < cols.length; i++) {
    const c = cols[i];
    if (/^CO_/.test(c)) continue;
    if (!MONEY.test(c)) continue;
    for (let j = 0; j < rows.length && j < 30; j++) {
      const v = rows[j][c];
      if (!isNil(v) && !isNaN(Number(v))) return c;
    }
  }
  return null;
}

/**
 * The record's own drill target, with the placeholders it could not fill
 * dropped rather than emitted as `?card=<CARD_CODE>`.
 * @param {Object} d @returns {string|null}
 */
function drillHref(d) {
  const dr = d.drill;
  if (!dr || !dr.page) return null;
  const page = String(dr.page);
  if (page === 'derivation.html') {
    const k = dr.params && dr.params.k;
    if (!k || k === d.id) return null;         // never link a page to itself
  }
  const params = {};
  let dropped = false;
  const src = dr.params || {};
  for (const key in src) {
    if (!Object.prototype.hasOwnProperty.call(src, key)) continue;
    let v = src[key];
    if (typeof v === 'string' && /^<.*>$/.test(v.trim())) {
      if (v.trim() === '<company>') v = CO; else { dropped = true; continue; }
    }
    params[key] = v;
  }
  params.co = CO;
  const NEEDS = { 'party.html': 'card', 'document.html': 'entry',
                  'bank-account.html': 'acct', 'gl-account.html': 'acct' };
  if (NEEDS[page] && isNil(params[NEEDS[page]])) return null;   // an unresolved identifier
  if (dropped && !NEEDS[page]) { /* the page still resolves without the extra filter */ }
  return hrefSection(page, CO, params);
}

/** Every valid id for this company, grouped by section — the answer to a bad ?k=. */
function panelIndex(ders) {
  const ids = Object.keys(ders || {}).sort();
  const bySection = {};
  ids.forEach(function (id) {
    const s = (ders[id] && ders[id].section) || 'other';
    (bySection[s] = bySection[s] || []).push(id);
  });
  const host = el('<section class="card" id="index"></section>');
  host.appendChild(el('<div class="card-head"><h2>Every figure this board can explain</h2>' +
    '<span class="src">' + esc(num(ids.length)) + ' in ' + esc(companyLabel(CO) || CO) + '</span></div>'));
  Object.keys(bySection).sort().forEach(function (s) {
    const box = el('<div class="dv-idxsec"><h4>' + esc(prettySection(s)) + '</h4>' +
                   '<div class="dv-idx"></div></div>');
    const list = box.querySelector('.dv-idx');
    bySection[s].forEach(function (id) {
      list.appendChild(el('<a href="' + esc(hrefDerivation(id, CO)) + '">' +
        esc(id) + ' — ' + esc((ders[id] && ders[id].label) || '') + '</a>'));
    });
    host.appendChild(box);
  });
  return host;
}

/* ══ 4. the page ═════════════════════════════════════════════════════════ */

let _shelled = '';

/** @returns {Promise<void>} */
async function render() {
  const main = document.getElementById('main');
  const foot = document.getElementById('foot');
  main.innerHTML = '';
  foot.innerHTML = '';

  let m = null, ders = null;
  try { m = await manifest(); } catch (e) { m = null; }
  try { ders = await derivations(CO); } catch (e) { ders = null; }

  const d = (ders && KID && Object.prototype.hasOwnProperty.call(ders, KID)) ? ders[KID] : null;

  /* ── unknown, missing or unreadable ── */
  if (!d) {
    const ids = ders ? Object.keys(ders) : [];
    main.appendChild(crumb([
      { label: 'Overview', href: hrefSection('index', CO) },
      { label: 'Derivation' }
    ]));
    if (!ders || (!ids.length && ders.__error)) {
      main.appendChild(empty({
        what: 'The derivation registry for ' + (companyLabel(CO) || CO) + ' could not be read.',
        why: String((ders && ders.__error) || 'data/derivations.' + CO + '.json was unreachable.') +
             ' Nothing on this page can be shown without it.',
        href: 'health.html',
        hrefLabel: 'Check the build'
      }));
    } else if (!KID) {
      main.appendChild(empty({
        what: 'No figure was named in the address.',
        why: 'This page explains one number at a time and expects ?k=<kpi-id>. Every id this ' +
             'board can explain for ' + (companyLabel(CO) || CO) + ' is listed below.'
      }));
      main.appendChild(panelIndex(ders));
    } else {
      const inManifest = m && m.kpis && m.kpis[CO] &&
        Object.prototype.hasOwnProperty.call(m.kpis[CO], KID);
      main.appendChild(empty({
        what: '“' + KID + '” is not a figure in ' + (companyLabel(CO) || CO) + '.',
        why: inManifest
          ? 'The manifest carries this id but this build wrote no derivation record for it, so ' +
            'there is nothing to explain here yet. Try another company, or pick from the list below.'
          : 'No derivation record carries that id. It may belong to another company, or the id ' +
            'may be stale. Every valid id is listed below.'
      }));
      main.appendChild(panelIndex(ders));
    }
    foot.appendChild(footerEl(m, null));
    return;
  }

  /* ── the shell, once we know which section we are in ── */
  const shellKey = d.section + '|' + d.id;
  if (_shelled !== shellKey) {
    shell({
      title: d.label || d.id,
      subtitle: 'Derivation of ' + d.id + ' · every step from SAP to the figure',
      section: d.section
    });
    _shelled = shellKey;
  }

  const localCodes = new Set(
    (Array.isArray(d.caveats) ? d.caveats : [])
      .filter(function (c) { return c && c.scope !== 'global' && c.id; })
      .map(function (c) { return String(c.id); }));

  main.appendChild(crumb([
    { label: 'Overview', href: hrefSection('index', CO) },
    { label: prettySection(d.section), href: hrefSection(d.section, CO) },
    { label: d.label || d.id }
  ]));

  if (d.check && d.check.ok === false) main.appendChild(panelDisagreement(d));

  main.appendChild(panelValue(d, m));
  main.appendChild(panelFormula(d, localCodes));
  main.appendChild(panelExcludes(d, localCodes));
  main.appendChild(panelCheck(d));

  /* one read of the section slice serves both the recomputation and the rows */
  const sel = await selectRows(d);
  main.appendChild(panelMethod(d, sel));
  main.appendChild(panelSql(d));
  main.appendChild(panelCaveats(d, localCodes));
  main.appendChild(panelRows(d, sel));

  foot.appendChild(footerEl(m, d));
}

/**
 * The slice rows this figure is made of.
 * @param {Object} d
 * @returns {Promise<{all:Object[], rows:Object[], error:?string, filterError:?string}>}
 */
async function selectRows(d) {
  const secId = (d.rows && d.rows.section) || d.section;
  const kind = (d.rows && d.rows.kind) || 'summary';
  let s = null;
  try { s = await slice(secId, CO); } catch (e) { s = null; }
  if (!s) return { all: [], rows: [], error: 'data/' + secId + '.' + CO + '.json could not be read.', filterError: null };
  if (s.error) return { all: [], rows: [], error: s.error, filterError: null };

  const all = (kind === 'detail' ? s.detail : s.summary) || [];
  const src = (d.rows && d.rows.filter) || 'True';
  let fn = null, filterError = null;
  try { fn = parseFilter(src); } catch (e) { filterError = e && e.message ? e.message : String(e); }
  let rows = all;
  if (fn) {
    try {
      rows = all.filter(function (r) { return fn(r); });
    } catch (e) {
      filterError = e && e.message ? e.message : String(e);
      rows = all;
    }
  }
  return { all: all, rows: rows, error: null, filterError: filterError };
}

/** Where every number on this page came from, named. */
function footerEl(m, d) {
  const f = el('<div class="lineage"></div>');
  const bits = [];
  bits.push('<div><b>This page reads</b> <code>data/derivations.' + esc(CO) + '.json</code>' +
    (d ? ' · <code>data/' + esc((d.rows && d.rows.section) || d.section) + '.' + esc(CO) +
         '.json</code>' : '') +
    ' · <code>data/manifest.json</code>. Nothing is fetched from SAP by this page.</div>');
  if (d && d.sql && d.sql.file) {
    bits.push('<div><b>The query</b> <code>' + esc(d.sql.file) + '</code>' +
      (Array.isArray(d.sql.lines) && d.sql.lines.length
        ? ' lines ' + esc(String(d.sql.lines[0])) + '–' + esc(String(d.sql.lines[1])) : '') +
      '</div>');
  }
  if (m) {
    bits.push('<div><b>Build</b> ' + esc(m.generated_at || 'unknown') +
      ' (' + esc(ago(m.generated_at)) + ')' +
      (m.as_of ? ' · position as of ' + esc(m.as_of) : '') +
      (m.stale ? ' · <b>stale:</b> ' + esc(String(m.stale_reason || 'the build is behind')) : '') +
      '</div>');
  }
  bits.push('<div>Every figure on this board is read-only. ' +
    '<a href="methodology.html">Methodology and corrections</a> · ' +
    '<a href="health.html">Build health</a></div>');
  f.innerHTML = bits.join('');
  return f;
}

/* ── boot (CONTRACT §7) ── */
shell({ title: 'Derivation', subtitle: 'How one number was made', section: 'methodology' });
render();
onRefresh(render);
</script>
