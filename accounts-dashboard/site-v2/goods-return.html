<script type="module">
/* ────────────────────────────────────────────────────────────────────────────
   goods-return.html — stock sent back to a vendor, and whether the money ever
   came back on paper.

   The question: a goods return (SAP ORPD, ObjType 21) takes stock out of the
   warehouse and debits GRNI — "goods received but not invoiced". It does NOT
   touch the vendor's A/P account. The vendor's liability only moves when the
   follow-on A/P credit note (ORPC, ObjType 19) is raised. So a return with no
   credit note is value parked in GRNI that nobody has ever billed back to the
   supplier. THAT is the page: FLAG_NO_CREDIT_NOTE, aged, ranked by vendor.

   Three things make a naive version of this page wrong, and all three are drawn
   on it rather than filed away:

     • The summary is FACETED across FIVE scopes (TOTAL, CLASS, CREDIT_NOTE,
       MONTH, VENDOR) stacked in one array. Summing every row multiplies the
       book by about five — Oil's 61 rows add to ₹3.73 Cr against a real ₹74.61
       lakh. Every total here comes from the one row where SCOPE='TOTAL'.
     • The plain uncredited total is mostly JIVO writing off its own shortage.
       92% of Beverages' RET_GROSS_NO_CN is the STOCK GOODS ISSUE card and 94%
       of Mart's is intercompany. The headline is RET_NOCN_EXT_GROSS.
     • CANCELED is three-valued (C-0021) and the register deliberately KEEPS the
       cancelled rows so they can be seen. Summing GROSS_AMT down the file
       counts every cancellation twice.

   Owns nothing but this file. Data, formatting, linking, shell, tables and
   charts all come from assets/ (CONTRACT §3, §5).
   ──────────────────────────────────────────────────────────────────────────── */
import {
  shell, crumb, kpiRow, table, empty, note,
  manifest, slice, derivations, parties, company, companyLabel,
  money, num, scale, ago, esc,
  hrefParty, hrefDerivation, hrefSection, hrefCaveat, hrefDocument,
  onRefresh

import { waterfall, stackedBars, pareto, scatter, lineArea, donut, heatmap, meter }
  from './assets/charts.js';

/** The cuts the register offers. `test` runs over a detail row. */

};
