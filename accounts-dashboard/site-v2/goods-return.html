/* ══ 2. small helpers ═════════════════════════════════════════════════════ */

/** HTML string → element. */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

/** `Rs 4.41 Cr` in the spec's prose → `₹4.41 Cr` on the page. */
function rupee(s) {
  return String(s).replace(/\bRs\s(?=[\d,])/g, '₹').replace(/(\d)x\b/g, '$1×');
}

/** A figure, or the honest word. `money()` returns null for nil/unknown. */
function inr(v) { const s = money(v); return s === null ? 'not computed' : s; }

/** A count, or the honest word. */
function cnt(v) {
  return (v === null || v === undefined || isNaN(Number(v))) ? 'not computed' : num(Number(v));
}

/** A percentage at the spec's four decimals, or the honest word. */
function pc(v, dp) {
  return (v === null || v === undefined || isNaN(Number(v)))
    ? 'not computed'
    : Number(v).toFixed(dp === undefined ? 2 : dp) + '%';
}

/** Nil test that KEEPS 0 — a zero return count is data, a missing one is not. */
function nil(v) {
  return v === null || v === undefined || v === '' ||
         (typeof v === 'number' && isNaN(v));
}

/** SAP writes some free-text fields out as the literal string "None". */
function blank(v) { return nil(v) || String(v).trim() === '' || String(v).trim() === 'None'; }

/** Sum one column over rows, lifted to rupees by its unit suffix first (§4). */
function total(rows, col) {
  let t = 0;
  for (const r of (rows || [])) {
    const v = Number(scale(r[col], col));
    if (isFinite(v)) t += v;
  }
  return t;
}

/** A numeric column off one row, lifted to rupees, or null when absent. */
function val(row, col) {
  if (!row || nil(row[col])) return null;
  const v = Number(scale(row[col], col));
  return isFinite(v) ? v : null;
}

/** Manifest KPI value, accepting both `{value}` and the short `{v}` shape. */
function kpi(m, co, id) {
  const k = m && m.kpis && m.kpis[co] ? m.kpis[co][id] : null;
  if (!k) return null;
  const v = (k.value !== undefined) ? k.value : k.v;
  return (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
}

/** A `<a class="cvcode">C-0021</a>` linked to methodology.html. */
function cv(code) {
  return '<a class="cvcode" href="' + esc(hrefCaveat(code)) + '">' + esc(code) + '</a>';
}

/** A titled card. `src` is the small provenance line on the right. */
function card(title, src) {
  const c = h('<section class="card"></section>');
  if (title) {
    c.appendChild(h(
      '<div class="card-head"><h2>' + esc(title) + '</h2>' +
      (src ? '<div class="src">' + src + '</div>' : '') + '</div>'
    ));
  }
  return c;
}

/** The one-line caption under a chart: what it shows, in plain words. */
function cap(html) { return h('<p class="tnote">' + html + '</p>'); }

/**
 * THE facet rule (spec trap 1). One stack of the result set, never the whole
 * array. `TOTAL` is the only stack with exactly one row and its key is 'ALL' —
 * both tests, because a future stack could be named TOTAL_SOMETHING.
 */
function facet(rows, scope) {
  return (rows || []).filter(r => r && r.SCOPE === scope);
}
function totalRow(rows) {
  return (rows || []).find(r => r && r.SCOPE === 'TOTAL' && r.GRP_KEY === 'ALL') || null;
}
/** One CLASS row by key, or null when that class does not exist in this book. */
function classRow(rows, key) {
  return facet(rows, 'CLASS').find(r => r.GRP_KEY === key) || null;
}

/** ISO date for the browser's today, to test the build's as-of against it. */
function todayISO() {
  const d = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/** Which age band a day count falls in. */
function ageKey(days) {
  const d = Number(days);
  if (!isFinite(d)) return null;
  for (const b of AGE_KEYS) { if (d <= b.max) return b.key; }
  return AGE_KEYS[AGE_KEYS.length - 1].key;
}

/** Which credit-note lag band a detail row falls in. */
function lagKey(r) {
  if (nil(r.CN_LAG_DAYS)) return 'LAG_NEVER';
  const d = Number(r.CN_LAG_DAYS);
  if (!isFinite(d)) return 'LAG_NEVER';
  if (d < 0)   return 'LAG_NEG';
  if (d === 0) return 'LAG_0';
  if (d <= 30) return 'LAG_1_30';
  if (d <= 90) return 'LAG_31_90';
  return 'LAG_91';
}

/** Read the page's own URL state: which rows, which cut, which facet. */
function urlState() {
  let p;
  try { p = new URLSearchParams(window.location.search); } catch (e) { p = new URLSearchParams(); }
  const cs = String(p.get('cancel') || '').toUpperCase();
  const pc2 = String(p.get('party_class') || '').toUpperCase();
  const f = String(p.get('filter') || '').toLowerCase();
  return {
    cancel:  CANCEL_SETS.some(k => k.key === cs) ? cs : 'LIVE',
    pc:      (pc2 && pc2 in CLASS_LABEL) ? pc2 : '',
    uncred:  p.get('uncredited') === 'true' || p.get('uncredited') === '1' ||
             f === 'uncredited-external',
    extOnly: f === 'uncredited-external',
    status:  String(p.get('status') || '').toUpperCase(),
    facet:   String(p.get('scope') || '').toUpperCase(),
    view:    String(p.get('view') || '').toLowerCase(),
    sort:    p.get('sort') || '',
    dir:     p.get('dir') || 'desc'
  };
}

/* A KPI drill-down can arrive with ?view=register and be answered by a panel
   two thirds of the way down the page. It is scrolled to ONCE, on the first
   render only: the page redraws itself every time the build moves, and yanking
   an operator's scroll position out from under them each minute is worse than
   not scrolling at all. */
let _jumped = false;
function jumpTo(id) {
  if (_jumped) return;
  _jumped = true;
  try {
    const t = document.getElementById(id);
    if (t && typeof t.scrollIntoView === 'function') t.scrollIntoView({ block: 'start' });
  } catch (e) { /* an older browser simply stays at the top */ }
}

/** Rewrite one query parameter in place and re-render. No navigation. */
function setParam(name, value) {
  try {
    const url = new URL(window.location.href);
    if (value === null || value === '' || value === false) url.searchParams.delete(name);
    else url.searchParams.set(name, value);
    window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
  } catch (e) { /* a browser without URL still re-renders below */ }
  render();
}

/** A chip button that flips one URL parameter. */
function chip(label, on, n, title, onClick) {
  const b = h('<button type="button" class="chip" aria-pressed="' + (on ? 'true' : 'false') + '">' +
    esc(label) + (n === null || n === undefined ? '' : ' <span class="n">' + num(n) + '</span>') +
    '</button>');
  if (title) b.title = title;
  b.addEventListener('click', onClick);
  return b;
}

/** `{COL:[label,kind,meaning]}` → the `labels` map `table()` wants. */
function labelsFor(defs) {
  const o = {};
  Object.keys(defs).forEach(k => { o[k] = defs[k][0]; });
  return o;
}
/** `{COL:[label,kind,meaning]}` → the `units` map `table()` wants. */
function unitsFor(defs) {
  const o = {};
  Object.keys(defs).forEach(k => { o[k] = defs[k][1]; });
  return o;
}
/** The column glossary: what every header on the table below actually means. */
function glossary(defs, cols, title) {
  const box = h('<details class="note-box"><summary>' + esc(title) + '</summary></details>');
  const body = h('<div class="note-body prose" style="overflow-x:auto;max-width:100%"></div>');
  const dl = h('<dl></dl>');
  (cols || Object.keys(defs)).forEach(function (k) {
    if (!defs[k]) return;
    dl.appendChild(h('<dt><b>' + esc(defs[k][0]) + '</b> <code>' + esc(k) + '</code></dt>'));
    dl.appendChild(h('<dd>' + esc(rupee(defs[k][2])) + '</dd>'));
  });
  body.appendChild(dl);
  box.appendChild(body);
  return box;
}

/* ══ 3. render ════════════════════════════════════════════════════════════ */

async function render() {
  const co   = company();
  const main = document.getElementById('main');
  const [m, d, der, plist] = await Promise.all([
    manifest(), slice(SECTION, co), derivations(co),
    parties(co).catch(function () { return []; })
  ]);
  const rows = d.summary || [];
  const det  = d.detail  || [];
  const asOf = d.as_of || (m && m.as_of) || null;
  const sec  = (m && m.sections && m.sections[SECTION]) || null;

  /* Which vendor cards the party page can actually resolve (spec empty state
     12, trap 21). Many goods-return cards carry no open balance and so appear
     in no ageing section; the directory is the only thing that decides. */
  const known = {};
  (plist || []).forEach(function (p) {
    if (p && p.card) known[String(p.card).toUpperCase()] = p;
  });
  const resolves = c => !nil(c) && Object.prototype.hasOwnProperty.call(known, String(c).toUpperCase());
  const partyHref = (c, cc) => (resolves(c) ? hrefParty(c, cc || co) : null);

  main.innerHTML = '';
  const add = n => { if (n) main.appendChild(n); return n; };

  add(crumb([
    { label: 'Board', href: hrefSection('index.html', co) },
    { label: 'Goods returns' }
  ]));

  add(h(
    '<div class="pagehead">' +
      '<div class="ctx">GOODS RETURN <span class="sep">·</span> ORPD · RPD1 · ORPC · OPDN · OCRD · OCRG' +
        (asOf ? ' <span class="sep">·</span> as of ' + esc(asOf) : '') + '</div>' +
      '<h1>Sent back to the supplier, never credited</h1>' +
      '<p class="lede">A goods return takes stock out of the warehouse and debits <b>GRNI</b> — goods ' +
      'received but not invoiced. It does <b>not</b> touch the vendor’s account. The supplier’s ' +
      'liability only moves when the follow-on <b>A/P credit note</b> is raised. So a return with no ' +
      'credit note is value JIVO handed back in goods and never recovered on paper — parked in GRNI, ' +
      'with nobody billed. That is what this page counts, ages, and puts a vendor’s name against.</p>' +
    '</div>'
  ));

  /* -- the section could not be read: say so, never print a zero ---------- */
  if (d.error || (sec && sec.status === 'error')) {
    add(empty({
      what: 'The goods-return query did not return for ' + companyLabel(co) + '.',
      why: 'This is not “nothing was returned” — it is unknown. ' +
           (d.error ? 'Reader’s error: ' + d.error + ' ' : '') +
           ((sec && sec.error) ? 'Build error: ' + sec.error : ''),
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, asOf, rows, det);
    return;
  }

  const T = totalRow(rows);
  if (!rows.length || !T) {
    add(empty({
      what: 'The faceted TOTAL row is missing from this book.',
      why: 'Every figure on this page is read from the one row where SCOPE = “TOTAL” and ' +
           'GRP_KEY = “ALL”, and the query wraps its totals in IFNULL precisely so that a book with ' +
           'no returns still emits one clean row rather than nothing. Its absence means the build is ' +
           'broken, not that no stock was ever sent back.',
      href: hrefSection('health', co),
      hrefLabel: 'Check the build’s health'
    }));
    paintFoot(m, co, asOf, rows, det);
    return;
  }

  /* -- a book with no live returns at all (spec empty state 2) ------------ */
  if (!(Number(T.RET_DOCS) > 0)) {
    add(empty({
      what: 'No goods returns in this book.',
      why: 'The TOTAL row exists and reports ' + cnt(T.RET_DOCS) + ' live return documents, so this ' +
           'is a real nil and not a failed read — but it is still not a set of zeros. Nothing has ' +
           'been sent back to a supplier in ' + companyLabel(co) + ' on or before ' +
           (asOf ? asOf : 'the build date') + ', so there is no uncredited exposure, no ageing and ' +
           'no return rate to draw. Every panel below would be an empty frame.',
      href: hrefSection('grpo', co),
      hrefLabel: 'Goods coming the other way'
    }));
    paintFoot(m, co, asOf, rows, det);
    return;
  }

  const st       = urlState();
  const classes  = facet(rows, 'CLASS');
  const cnScope  = facet(rows, 'CREDIT_NOTE');
  const months   = facet(rows, 'MONTH').slice()
                     .sort((a, b) => String(a.GRP_KEY).localeCompare(String(b.GRP_KEY)));
  const vendors  = facet(rows, 'VENDOR');
  const live     = det.filter(r => r.CANCEL_STATUS === 'LIVE');
  const uncred   = live.filter(r => r.FLAG_NO_CREDIT_NOTE === 'Y');
  const uncredEx = uncred.filter(r => r.PARTY_CLASS === 'EXTERNAL');
  const extRow   = classRow(rows, 'EXTERNAL');

  /* -- freshness: the denominator moves during the working day (trap 24) -- */
  if (asOf && asOf !== todayISO()) {
    add(h(
      '<div class="caveat">' +
        '<b>This build is dated ' + esc(asOf) + ', not today.</b> Ages on this page are computed at ' +
        'build time, not in the browser, so every “days old” below is measured to ' + esc(asOf) +
        ' and is now that much out of date. The return rate moves too: its denominator is live goods ' +
        'receipts, and Mart’s rate read 0.4250% at 18:58 and 0.4246% at 19:05 on the same day because ' +
        '₹28.8 L of receipts landed in between. Read every figure here as stamped to one build.' +
      '</div>'
    ));
  }

  /* ── 3.1 the headline: what a supplier still owes ────────────────────── */
  const extGross   = kpi(m, co, 'gret-uncredited-ext-gross');
  const extDocs    = kpi(m, co, 'gret-uncredited-ext-docs');
  const allUncred  = kpi(m, co, 'gret-uncredited-all-gross');
  const oldestDays = kpi(m, co, 'gret-oldest-uncredited-ext-days');
  const hasUncredEx = Number(T.RET_NOCN_EXT_DOCS) > 0;

  add(kpiRow([
    { id:'gret-uncredited-ext-gross', label:'Returned to a supplier, never credited',
      value: extGross, unit:'INR', tone:'bad',
      corr: (allUncred !== null && extGross !== null && allUncred !== extGross) ? allUncred : undefined,
      sub:'is the uncredited total with JIVO’s own cards left in',
      title:'RET_NOCN_EXT_GROSS on the single SCOPE=TOTAL row. Live returns to an EXTERNAL party ' +
            'with no live A/P credit note linked at or before as_of.' },
    { id:'gret-uncredited-ext-docs', label:'Supplier returns with no credit note',
      value: extDocs, unit:'count', tone:'warn',
      sub:'of ' + cnt(T.RET_DOCS) + ' returns this book has raised' },
    { id:'gret-oldest-uncredited-ext-days',
      label:'Oldest uncredited supplier return',
      value: hasUncredEx ? oldestDays : null, unit:'days', tone:'bad',
      sub:'measured to the build date, not to today' },
    { id:'gret-uncredited-all-gross', label:'Uncredited returns, every party',
      value: allUncred, unit:'INR',
      sub:'includes write-offs and sister companies — not a claim on anyone' },
    { id:'gret-returned-gross', label:'Stock sent back to vendors',
      value: kpi(m, co, 'gret-returned-gross'), unit:'INR',
      sub:'GST-inclusive, live documents, lifetime' },
    { id:'gret-return-rate-pct', label:'Share of goods received that came back',
      value: kpi(m, co, 'gret-return-rate-pct'), unit:'pct',
      sub: nil(T.GRPO_NET) ? 'no denominator on this build'
           : 'of ' + inr(val(T, 'GRPO_NET')) + ' of item goods receipts' }
  ]));

  if (!hasUncredEx) {
    add(empty({
      what: 'Nothing external is uncredited in ' + companyLabel(co) + ', so there is no oldest one.',
      why: 'RET_NOCN_EXT_DOCS is 0. The age of the oldest uncredited supplier return is therefore ' +
           'not computed rather than 0 days — a zero here would read as “returned and credited ' +
           'today”, which is the opposite of what an empty population means. The uncredited total ' +
           'across every party is still ' + inr(allUncred) + '; that money is on JIVO’s own cards.'
    }));
  }

  add(h(
    '<div class="caveat">' +
      '<b>Four corrections hold this page up.</b> ' + cv('C-0021') +
      ' — <code>CANCELED</code> is three-valued: <code>N</code> live, <code>Y</code> the cancelled ' +
      'original, <code>C</code> SAP’s cancellation mirror, and <code>Y</code> and <code>C</code> ' +
      'carry identical totals. Every figure above counts <code>N</code> only; the register below ' +
      'deliberately shows all three so a mirror can be recognised, and never adds them up. ' +
      cv('C-0019') + ' — <code>DocStatus</code> is not the measure. ' + cnt(T.RET_DOCS_OPEN) +
      ' returns here read “open”, but Oil carries 12 <i>closed</i> returns worth ₹11.45 L with no ' +
      'credit note at all and one <i>open</i> return that has one. Whether the money came back is ' +
      'the credit-note link, never the status flag. ' + cv('C-0005') + ' ' + cv('C-0020') +
      ' — the uncredited total is largely JIVO owing itself, and the sister-company card can sit in ' +
      'an ordinary trading group, so the class is decided from the group name <i>and</i> the card ' +
      'name. ' + cv('C-0001') + ' — quantities on the register are <b>pieces</b>, single bottles, ' +
      'summed across mixed units of measure. They are a size hint and nothing more.' +
    '</div>'
  ));

  /* ── 3.2 THE headline chart: the correction, drawn ───────────────────── */
  {
    const c = card('From everything sent back to what a supplier still owes',
      'RET_GROSS → RET_NOCN_EXT_GROSS · TOTAL and CLASS scopes');

    const retTotal = val(T, 'RET_GROSS');
    const nonExt = classes.filter(r => r.GRP_KEY !== 'EXTERNAL' && val(r, 'RET_GROSS') > 0);
    const extTotal = extRow ? val(extRow, 'RET_GROSS') : null;
    const extUncred = extRow ? val(extRow, 'RET_GROSS_NO_CN') : val(T, 'RET_NOCN_EXT_GROSS');
    const extCredited = (extTotal === null || extUncred === null) ? null : extTotal - extUncred;

    if (retTotal !== null && extTotal !== null) {
      const steps = [{ label:'Everything sent back', value: retTotal, kind:'base',
                       k:'gret-returned-gross' }];
      nonExt.forEach(function (r) {
        steps.push({ label: CLASS_LABEL[r.GRP_KEY] || r.GRP_KEY, value: val(r, 'RET_GROSS'),
          kind:'sub', k: r.GRP_KEY === 'INTERNAL_ADJ' ? 'gret-internal-writeoff-gross'
                                                      : 'gret-nontrade-gross' });
      });
      steps.push({ label:'Sent back to an outside supplier', value: extTotal, kind:'total' });
      if (extCredited !== null && extCredited > 0) {
        steps.push({ label:'Already credited by a credit note', value: extCredited, kind:'sub' });
      }
      steps.push({ label:'Never credited — the claim', value: val(T, 'RET_NOCN_EXT_GROSS'),
                   kind:'total', k:'gret-uncredited-ext-gross' });

      c.appendChild(waterfall(steps, {
        title: 'Goods returns → the supplier claim, ' + companyLabel(co),
        format: money,
        href: s => (s && s.src && s.src.k) ? hrefDerivation(s.src.k, co) : null
      }));

      const nonExtSum = nonExt.reduce((a, r) => a + (val(r, 'RET_GROSS') || 0), 0);
      const shareInt = retTotal ? 100 * nonExtSum / retTotal : null;
      const biggest = nonExt.slice().sort((a, b) => val(b, 'RET_GROSS') - val(a, 'RET_GROSS'))[0];
      c.appendChild(cap(
        'Read it as one sentence. <b>' + esc(inr(retTotal)) + '</b> of stock went back out of the ' +
        'gate. ' +
        (shareInt === null ? '' :
          '<b>' + esc(shareInt.toFixed(1)) + '% of it never went to a supplier at all</b>' +
          (biggest ? ' — mostly ' + esc((CLASS_LABEL[biggest.GRP_KEY] || biggest.GRP_KEY).toLowerCase()) +
                     ' at ' + esc(inr(val(biggest, 'RET_GROSS'))) : '') + ', ') +
        'so no credit note was ever going to arrive for it: stock moving between JIVO’s own GST ' +
        'registrations, a sister company, or the dummy card used to write off physical shortage. ' +
        'Of the <b>' + esc(inr(extTotal)) + '</b> that did go to an outside supplier, ' +
        esc(inr(extCredited)) + ' came back as a credit note. What is left, <b>' +
        esc(inr(val(T, 'RET_NOCN_EXT_GROSS'))) + '</b> over ' + esc(cnt(T.RET_NOCN_EXT_DOCS)) +
        ' documents, is the only figure on this page that is a claim on anybody. ' +
        '<b>This chart exists because a table of the same rows lets a reader take ' +
        '<code>RET_GROSS_NO_CN</code> as the claim</b> — on Beverages that would be 12.7× too big.'
      ));
    } else {
      c.appendChild(empty({
        what: 'The deduction cannot be drawn for ' + companyLabel(co) + '.',
        why: (extRow ? 'The TOTAL row carries no returned value.' :
              'There is no CLASS row for EXTERNAL in this book, so there is no outside-supplier ' +
              'figure to land the waterfall on.') +
             ' The uncredited total across every party is ' + inr(allUncred) + ', and it is NOT ' +
             'shown as the claim in its place: most of it is normally JIVO’s own cards.'
      }));
    }
    add(c);
  }

  /* ── 3.3 how old the uncredited returns are ──────────────────────────── */
  {
    const c = card('How long the uncredited returns have been sitting there',
      'register · live rows where FLAG_NO_CREDIT_NOTE = “Y”');

    if (uncred.length) {
      const byClass = {};
      const order = [];
      uncred.forEach(function (r) {
        const k = r.PARTY_CLASS || '(unclassified)';
        if (!byClass[k]) { byClass[k] = { CLASS: k, DOCS: 0 }; AGE_KEYS.forEach(b => { byClass[k][b.key] = 0; }); order.push(k); }
        const bk = ageKey(r.AGE_DAYS);
        if (bk) byClass[k][bk] += (Number(scale(r.GROSS_AMT, 'GROSS_AMT')) || 0);
        byClass[k].DOCS++;
      });
      /* EXTERNAL first: it is the only class where the age means money at risk. */
      order.sort((a, b) => (a === 'EXTERNAL' ? -1 : b === 'EXTERNAL' ? 1 : 0));
      const bars = order.map(function (k) {
        const o = Object.assign({}, byClass[k]);
        o.CLASS = (CLASS_LABEL[k] || k) + ' (' + num(byClass[k].DOCS) + ')';
        return o;
      });

      c.appendChild(stackedBars(bars, {
        labelKey:'CLASS', keys: AGE_KEYS.map(b => ({ key: b.key, label: b.label })),
        scheme:'age', sort:false, format: money,
        title:'Uncredited returns by age, ' + companyLabel(co)
      }));

      const old90 = uncredEx.filter(r => Number(r.AGE_DAYS) > 90);
      const old90v = old90.reduce((a, r) => a + (Number(scale(r.GROSS_AMT, 'GROSS_AMT')) || 0), 0);
      const fresh = uncredEx.length - old90.length;
      c.appendChild(cap(
        'One bar per party class, split across five age bands on the return’s own date, every band ' +
        'printing its rupee value in the legend so nothing depends on colour. <b>The ramp runs cool ' +
        '→ hot with age.</b> This is the chart that separates ordinary flow from a real problem: a ' +
        'return raised last week whose credit note has not been keyed yet sits in the first band and ' +
        'clears itself; anything past three months is a credit note that is never coming unless ' +
        'somebody asks for it. ' +
        (uncredEx.length
          ? 'On outside suppliers today, <b>' + esc(num(old90.length)) + ' of ' +
            esc(num(uncredEx.length)) + ' uncredited returns are over 90 days old, worth ' +
            esc(inr(old90v)) + '</b>' + (fresh ? ', and ' + esc(num(fresh)) + ' are newer than that' : '') + '. '
          : 'No outside supplier has an uncredited return in this book. ') +
        'The internal bars are here for scale, not for chasing — a stock write-off can never attract ' +
        'a credit note, so its age says nothing about anybody’s discipline.'
      ));
    } else {
      c.appendChild(empty({
        what: 'Every live return in this book carries a credit note.',
        why: 'No register row has FLAG_NO_CREDIT_NOTE = “Y”, so there is no uncredited population ' +
             'to age. Read that against the summary, which reports ' + cnt(T.RET_DOCS_NO_CN) +
             ' uncredited returns worth ' + inr(val(T, 'RET_GROSS_NO_CN')) + ' — if those two ' +
             'disagree, the two queries have drifted apart and the build is wrong, not the book.',
        href: hrefSection('health', co),
        hrefLabel: 'Check the build’s health'
      }));
    }
    add(c);
  }

  /* ── 3.4 who to phone ────────────────────────────────────────────────── */
  {
    const c = card('Who is sitting on an uncredited return',
      'register · one bar per vendor card, built from the live rows');

    if (uncred.length) {
      const byCard = {}, cards = [];
      uncred.forEach(function (r) {
        const k = String(r.CARD_CODE || '(no card)');
        if (!byCard[k]) {
          byCard[k] = { card: k, name: String(r.CARD_NAME || k), cls: r.PARTY_CLASS || '', v: 0, n: 0 };
          cards.push(k);
        }
        byCard[k].v += (Number(scale(r.GROSS_AMT, 'GROSS_AMT')) || 0);
        byCard[k].n++;
      });
      const items = cards.map(k => ({
        label: byCard[k].name + ' [' + (byCard[k].cls || '?') + ']',
        value: byCard[k].v, CARD: byCard[k].card, N: byCard[k].n
      })).filter(i => i.value > 0);

      if (items.length) {
        c.appendChild(pareto(items, {
          title: 'Uncredited returns by vendor, with the running share',
          top: 12, format: money,
          href: it => (it && it.src && it.src.CARD) ? partyHref(it.src.CARD) : null
        }));
        const sorted = items.slice().sort((a, b) => b.value - a.value);
        const sum = sorted.reduce((a, b) => a + b.value, 0);
        const t3  = sorted.slice(0, 3).reduce((a, b) => a + b.value, 0);
        const share = sum ? 100 * t3 / sum : null;
        const unresolved = items.filter(i => !resolves(i.CARD));
        c.appendChild(cap(
          'Bars are each card’s share of the uncredited value; the line is the running total. ' +
          (share === null ? '' : '<b>The top three names are ' + esc(share.toFixed(1)) +
            '% of it</b>, so this is three phone calls, not ' + esc(num(uncred.length)) +
            ' documents to read. ') +
          'Each name carries its class in square brackets — a bar labelled ' +
          '<code>[INTERNAL_ADJ]</code> or <code>[INTERCOMPANY]</code> is JIVO, and no call will ' +
          'produce a credit note. <b>This is built from the register, not from the VENDOR facet</b>, ' +
          'because that facet is capped at about forty cards and carries the party class only inside ' +
          'its label. ' +
          (unresolved.length
            ? '<b>' + esc(num(unresolved.length)) + ' of these cards have no party page</b> and are ' +
              'drawn as plain text rather than a dead link: they carry no open balance, so they ' +
              'appear in no ageing section and in no party directory. '
            : 'Every card here resolves to a party page. ') +
          'The rest of each name is a click away.'
        ));
      } else {
        c.appendChild(empty({
          what: 'No vendor carries a positive uncredited value.',
          why: 'Every uncredited row in the register has a zero or missing gross, which cannot be ' +
               'ranked. The summary reports ' + inr(val(T, 'RET_GROSS_NO_CN')) + ' uncredited, so ' +
               'the two queries disagree rather than the book being clean.'
        }));
      }
    } else {
      c.appendChild(empty({
        what: 'There is nobody to phone.',
        why: 'No live return in this book is missing its credit note, so there is no ranking to ' +
             'draw. That is a genuine absence, not a zero — see the uncredited figure above.'
      }));
    }
    add(c);
  }

  /* ── 3.5 age against size, one dot per document ──────────────────────── */
  {
    const c = card('The uncredited supplier returns, one dot each',
      'AGE_DAYS × GROSS_AMT · live, EXTERNAL, no credit note');

    const pts = uncredEx.filter(r => !nil(r.AGE_DAYS) && !nil(r.GROSS_AMT))
      .map(r => ({
        x: Number(r.AGE_DAYS),
        y: Number(scale(r.GROSS_AMT, 'GROSS_AMT')),
        label: (r.CARD_NAME || r.CARD_CODE) + ' · ' + r.DOC_NUM,
        group: Number(r.AGE_DAYS) > 90 ? 'Over 90 days' : 'Within 90 days',
        ENTRY: r.DOC_ENTRY
      }));
    const dropped = uncredEx.length - pts.length;

    if (pts.length) {
      c.appendChild(scatter(pts, {
        title: 'Uncredited supplier returns: how old, how big',
        xLabel: 'days since the stock went back', yLabel: 'value returned', format: money,
        href: p => (p && p.ENTRY) ? hrefDocument(OBJ_RETURN, p.ENTRY, co) : null
      }));
      const worst = pts.slice().sort((a, b) => (b.x * b.y) - (a.x * a.y))[0];
      c.appendChild(cap(
        'The top-right corner is the work queue: large <i>and</i> long uncredited. This is the only ' +
        'view that finds it at a glance — a table sorted by value buries the ancient scraps and a ' +
        'table sorted by age buries the big recent one. ' +
        (worst ? 'Furthest out today: <b>' + esc(worst.label) + '</b> at ' + esc(num(worst.x)) +
                 ' days and ' + esc(inr(worst.y)) + '. ' : '') +
        '<b>Every dot links to the return document itself.</b> Dots are split at ninety days rather ' +
        'than coloured by vendor, because a vendor split folds anything past the sixth name into ' +
        '“Other” and the point of the chart is the age, not the name — the name is on every dot’s ' +
        'label and in the ranking above. Only EXTERNAL rows are plotted: an internal write-off has ' +
        'no counterparty and would sit in the same corner meaning nothing.' +
        (dropped > 0 ? ' ' + num(dropped) + ' uncredited supplier row(s) carry no age or no value ' +
          'and are left out rather than drawn at zero.' : '')
      ));
    } else {
      c.appendChild(empty({
        what: hasUncredEx ? 'There is nothing to plot.' :
              'No outside supplier has an uncredited return in ' + companyLabel(co) + '.',
        why: hasUncredEx
          ? 'The summary reports ' + cnt(T.RET_NOCN_EXT_DOCS) + ' uncredited supplier returns, but ' +
            'no register row carries both an age and a value. The two queries disagree.'
          : 'RET_NOCN_EXT_DOCS is 0. Every return to an outside supplier in this book has a live ' +
            'credit note against it, so there is no exposure to plot. The uncredited value that ' +
            'does exist, ' + inr(val(T, 'RET_GROSS_NO_CN')) + ', is all on JIVO’s own cards.'
      }));
    }
    add(c);
  }

  /* ── 3.6 the rhythm: returns and credit notes by month ───────────────── */
  {
    const c = card('Returns and credit notes by month, and the rate behind them',
      'MONTH facet · RET_GROSS, credited value, RET_PCT_OF_GRPO');

    if (months.length > 1) {
      const credited = months.map(r => {
        const g = val(r, 'RET_GROSS'), u = val(r, 'RET_GROSS_NO_CN');
        return (g === null) ? 0 : g - (u || 0);
      });
      c.appendChild(lineArea([
        { name:'Sent back', points: months.map(r => ({ x: r.GRP_KEY, y: val(r, 'RET_GROSS') || 0 })) },
        { name:'Credited back', points: months.map((r, i) => ({ x: r.GRP_KEY, y: credited[i] })) }
      ], {
        title:'Returned value against the part a credit note recovered, ' + companyLabel(co),
        format: money, height: 240
      }));

      /* The rate is a different scale, so it gets its own axis — a second axis
         on the chart above would invent a correlation (CONTRACT §5). Months with
         no GRPO denominator are omitted, never plotted at 0% (empty state 11). */
      const rated = months.filter(r => val(r, 'GRPO_NET') > 0 && !nil(r.RET_PCT_OF_GRPO));
      const noDen = months.length - rated.length;
      if (rated.length > 1) {
        c.appendChild(lineArea([
          { name:'Return rate', points: rated.map(r => ({ x: r.GRP_KEY, y: Number(r.RET_PCT_OF_GRPO) })) }
        ], {
          title:'Returned value as a share of that month’s item goods receipts',
          unit:'pct', dp: 2, format: v => Number(v).toFixed(2) + '%', height: 200
        }));
      }

      const gap = months.reduce((a, r, i) => a + ((val(r, 'RET_GROSS') || 0) - credited[i]), 0);
      const quiet = months.filter(r => !(val(r, 'RET_GROSS') > 0));
      c.appendChild(cap(
        'The gap between the two lines is the money that went out in goods and never came back on ' +
        'paper — <b>' + esc(inr(gap)) + '</b> across ' + esc(num(months.length)) + ' months, which ' +
        'is the uncredited total above, spread over time. <b>The two charts are stacked rather than ' +
        'sharing an axis on purpose:</b> rupees and a percentage on one y-axis would draw a ' +
        'correlation that is not in the data. They genuinely do not move together — a month can be ' +
        'small in money and enormous in rate off two documents. ' +
        (noDen ? '<b>' + esc(num(noDen)) + ' month(s) carry no item goods receipt</b>, so their rate ' +
                 'is not computed rather than plotted at 0%. ' : '') +
        (quiet.length ? '<b>' + esc(num(quiet.length)) + ' month(s) carry a goods receipt and no ' +
                        'return at all</b> — the month join is a FULL OUTER, so those rows are real ' +
                        'zeros for returns and say nothing about anything else. ' : '') +
        cv('C-0022') + ' — the rate divides goods returned in a month by goods received in the same ' +
        'month, and they are not the same physical goods. It is stable at the whole-book and ' +
        'party-class level and shaky here; that is why it is drawn as a trend and never quoted as a ' +
        'month’s reject rate.'
      ));
    } else if (months.length === 1) {
      c.appendChild(empty({
        what: 'This book has activity in only one month.',
        why: 'A single point is not a trend, so no line is drawn: ' + esc(String(months[0].GRP_KEY)) +
             ' carries ' + inr(val(months[0], 'RET_GROSS')) + ' returned across ' +
             cnt(months[0].RET_DOCS) + ' documents.'
      }));
    } else {
      c.appendChild(empty({
        what: 'The month facet returned no rows.',
        why: 'MONTH re-totals to the TOTAL row to the paisa, so an empty stack means the build is ' +
             'incomplete — not that nothing was ever returned.'
      }));
    }
    add(c);
  }

  /* ── 3.7 how long a credit note takes ────────────────────────────────── */
  {
    const c = card('How long a credit note takes, when it comes at all',
      'register · CN_LAG_DAYS bucketed, live rows only');

    if (live.length) {
      const byClass = {}, order = [];
      live.forEach(function (r) {
        const k = r.PARTY_CLASS || '(unclassified)';
        if (!byClass[k]) { byClass[k] = { CLASS: k, N: 0 }; LAG_KEYS.forEach(b => { byClass[k][b.key] = 0; }); order.push(k); }
        byClass[k][lagKey(r)]++;
        byClass[k].N++;
      });
      order.sort((a, b) => (a === 'EXTERNAL' ? -1 : b === 'EXTERNAL' ? 1 : 0));
      const bars = order.map(function (k) {
        const o = Object.assign({}, byClass[k]);
        o.CLASS = (CLASS_LABEL[k] || k) + ' (' + num(byClass[k].N) + ')';
        return o;
      });

      c.appendChild(stackedBars(bars, {
        labelKey:'CLASS', keys: LAG_KEYS.map(b => ({ key: b.key, label: b.label })),
        scheme:'cat', sort:false, unit:'n', format: num,
        title:'Live returns by how long the credit note took, ' + companyLabel(co)
      }));

      const lags = live.filter(r => !nil(r.CN_LAG_DAYS)).map(r => Number(r.CN_LAG_DAYS))
                       .filter(v => isFinite(v)).sort((a, b) => a - b);
      const med = lags.length ? (lags.length % 2
        ? lags[(lags.length - 1) / 2]
        : (lags[lags.length / 2 - 1] + lags[lags.length / 2]) / 2) : null;
      const neg = lags.filter(v => v < 0);
      const never = live.filter(r => nil(r.CN_LAG_DAYS)).length;

      c.appendChild(cap(
        'Segments are <b>document counts, not rupees</b> — this chart is about behaviour, not size. ' +
        (lags.length
          ? 'The median wait is <b>' + esc(num(med)) + ' day' + (Math.abs(med) === 1 ? '' : 's') +
            '</b> and the slowest is ' + esc(cnt(kpi(m, co, 'gret-credit-lag-max-days'))) + ' days. '
          : 'Nothing in this book has been credited at all, so there is no wait to measure. ') +
        '<b>A mean would hide two things this shows.</b> The first is the “never” segment: ' +
        esc(num(never)) + ' live return(s) here have no credit note at any lag, and an average over ' +
        'the credited ones silently drops them. The second is the leftmost segment — ' +
        (neg.length
          ? '<b>' + esc(num(neg.length)) + ' credit note(s) are dated BEFORE the return they ' +
            'answer</b>, the earliest by ' + esc(num(Math.abs(Math.min.apply(null, neg)))) +
            ' days. That is a dating problem in the books, not a fast credit note, and an average ' +
            'treating them as same-day absorbs it entirely.'
          : 'no credit note in this book predates its return, which is what a clean set of dates ' +
            'looks like. Oil carries five that do and Beverages one, so the segment is drawn ' +
            'whether or not it is occupied.')
      ));
    } else {
      c.appendChild(empty({
        what: 'The register carries no live rows.',
        why: 'Every row in the detail is a cancelled document or its mirror, yet the summary reports ' +
             cnt(T.RET_DOCS) + ' live returns. The two queries disagree.'
      }));
    }
    add(c);
  }

  /* ── 3.8 is this a supplier return at all, and did the cycle complete ── */
  {
    const c = card('Is this a supplier return at all — and did the money come back?',
      'CLASS facet · RET_GROSS and the credited share of it');

    const grid = h('<div class="split"></div>');
    grid.style.display = 'grid';
    grid.style.gap = '18px';
    grid.style.gridTemplateColumns = 'repeat(auto-fit,minmax(min(100%,300px),1fr))';

    /* left: the class split */
    const left = h('<div></div>');
    const slices = classes.filter(r => val(r, 'RET_GROSS') > 0)
      .map(r => ({ label: CLASS_LABEL[r.GRP_KEY] || r.GRP_KEY, value: val(r, 'RET_GROSS') }));
    if (slices.length > 1) {
      left.appendChild(donut(slices, {
        title:'Where the returned stock went, ' + companyLabel(co),
        centerLabel:'sent back', format: money
      }));
    } else if (slices.length === 1) {
      left.appendChild(empty({
        what: 'Every return in this book is one party class: ' + esc(slices[0].label) + '.',
        why: 'A one-slice donut is a circle, not a split. The whole ' + inr(slices[0].value) +
             ' sits in that class, and the classes that exist in this book with no return at all ' +
             'are listed below rather than drawn as empty wedges.'
      }));
    } else {
      left.appendChild(empty({
        what: 'The class facet carries no returned value.',
        why: 'CLASS re-totals to the TOTAL row exactly, so this cannot happen beside a non-zero ' +
             'returned total of ' + inr(val(T, 'RET_GROSS')) + '. The build has drifted.'
      }));
    }
    grid.appendChild(left);

    /* right: did the external cycle complete */
    const right = h('<div></div>');
    const extG = extRow ? val(extRow, 'RET_GROSS') : null;
    const extU = extRow ? val(extRow, 'RET_GROSS_NO_CN') : null;
    if (extG !== null && extG > 0 && extU !== null) {
      right.appendChild(meter(extG - extU, extG, {
        title:'Supplier returns recovered on paper',
        label:'credited by an A/P credit note', maxLabel:'sent back to outside suppliers',
        format: money, okAt: 0.95, warnAt: 0.8, badAt: 0.5
      }));
      const rate = 100 * (extG - extU) / extG;
      right.appendChild(h(
        '<p class="tnote">' + esc(inr(extG - extU)) + ' of ' + esc(inr(extG)) +
        ' — <b>' + esc(rate.toFixed(1)) + '%</b> of what JIVO sent back to an outside supplier has ' +
        'a live credit note against it. The bar is drawn against the full external total on purpose: ' +
        'a KPI card printing “0%” beside a small rupee figure reads like a rounding artefact, while ' +
        'a bar with nothing in it against a visible whole does not. ' +
        (rate < 1 ? '<b>This book has never once completed the cycle.</b>' : '') +
        '</p>'
      ));
    } else {
      right.appendChild(empty({
        what: 'No outside supplier return to measure in ' + companyLabel(co) + '.',
        why: extRow
          ? 'The EXTERNAL class row exists but carries no returned value, so there is no denominator ' +
            'and a recovery rate would be a division by zero dressed up as 0%.'
          : 'There is no EXTERNAL row in the CLASS facet at all — not a zero, an absence. Every ' +
            'return in this book went to one of JIVO’s own cards.'
      }));
    }
    grid.appendChild(right);
    c.appendChild(grid);

    /* which classes are absent, and which exist but never had a return */
    const present = classes.map(r => r.GRP_KEY);
    const absent = Object.keys(CLASS_LABEL).filter(k => present.indexOf(k) < 0);
    const idle = classes.filter(r => !(val(r, 'RET_GROSS') > 0));
    c.appendChild(cap(
      'The whole reason this section’s headline is <code>RET_NOCN_EXT_GROSS</code> and not the ' +
      'plain uncredited total is that this split is invisible in the raw figures. ' +
      'Mart’s external slice is 1.8% of its returns and Beverages’ is 59.8%; a single number ' +
      'covering both would mean two different things in two books. ' +
      '<b>Only “EXTERNAL versus not” is portable.</b> The BRANCH / INTERCOMPANY line is drawn by a ' +
      'CASE that tests BRANCH first, so Beverages’ JIVO WELLNESS PVT LTD - PB lands in BRANCH where ' +
      'another book would call the same relationship intercompany (' + cv('C-0020') + ').'
    ));
    if (idle.length) {
      c.appendChild(empty({
        what: num(idle.length) + ' party class(es) exist in this book with no return at all: ' +
              idle.map(r => (CLASS_LABEL[r.GRP_KEY] || r.GRP_KEY)).join(', ') + '.',
        why: 'Those rows are real — the class has goods receipts against it (' +
             idle.map(r => (CLASS_LABEL[r.GRP_KEY] || r.GRP_KEY) + ' ' + inr(val(r, 'GRPO_NET'))).join(', ') +
             ') — but nothing was ever sent back on that card, so they are drawn as an absence ' +
             'rather than an empty wedge in the chart above.'
      }));
    }
    if (absent.length) {
      c.appendChild(empty({
        what: 'No such party class in this book: ' +
              absent.map(k => CLASS_LABEL[k]).join(', ') + '.',
        why: 'The row is not present in the CLASS facet at all, which is a structural nil and not a ' +
             'zero — Mart has no stock write-off card and Beverages has no intercompany one. ' +
             'Rendering ₹0 here would claim the card exists and simply had no activity, and the four ' +
             'classes are deliberately NOT synthesised to line up across the three books.'
      }));
    }
    add(c);
  }

  /* ── 3.9 month against party class ───────────────────────────────────── */
  {
    const c = card('When the returns happen, and to whom',
      'register · SUM(GROSS_AMT) by DOC_MONTH × PARTY_CLASS, live rows');

    const mKeys = [], cKeys = [], grid = {};
    live.forEach(function (r) {
      const mk = String(r.DOC_MONTH || '(no month)');
      const ck = String(r.PARTY_CLASS || '(unclassified)');
      if (mKeys.indexOf(mk) < 0) mKeys.push(mk);
      if (cKeys.indexOf(ck) < 0) cKeys.push(ck);
      const key = ck + '|' + mk;
      grid[key] = (grid[key] || 0) + (Number(scale(r.GROSS_AMT, 'GROSS_AMT')) || 0);
    });
    mKeys.sort();
    cKeys.sort((a, b) => (a === 'EXTERNAL' ? -1 : b === 'EXTERNAL' ? 1 : 0));

    if (mKeys.length && cKeys.length) {
      c.appendChild(heatmap({
        rows: cKeys.map(k => CLASS_LABEL[k] || k),
        cols: mKeys,
        values: cKeys.map(ck => mKeys.map(mk => grid[ck + '|' + mk] || 0))
      }, { title:'Returned value by month and party class', format: money, cellH: 34 }));
      c.appendChild(cap(
        'This crosses two cuts the summary can only show one at a time — its MONTH scope is not ' +
        'crossed with class — so a cell answers “<i>when did we start writing stock off</i>” rather ' +
        'than “which month was big”. <b>It is built from the live register rows, so it counts ' +
        'documents the summary counts and no cancelled ones.</b> The pattern worth looking for is ' +
        'clustering: a write-off row that fires in two months and is empty in twenty is a stock ' +
        'count, not a leak, while a continuous intercompany row is ordinary group logistics. A cell ' +
        'that could not be computed is drawn empty with a dot, never as a zero.'
      ));
    } else {
      c.appendChild(empty({
        what: 'There is no month-by-class grid to draw.',
        why: 'No live register row carries both a month and a party class, yet the summary reports ' +
             cnt(T.RET_DOCS) + ' live returns. That is a disagreement between the two queries.'
      }));
    }
    add(c);
  }

  /* ── 3.10 the rest of the measured figures ───────────────────────────── */
  {
    const c = card('The rest of the measured figures', 'every figure links to its derivation');

    c.appendChild(kpiRow([
      { id:'gret-returned-net', label:'Stock sent back, net of GST',
        value: kpi(m, co, 'gret-returned-net'), unit:'INR',
        sub:'the numerator of the return rate' },
      { id:'gret-returned-docs', label:'Goods return documents',
        value: kpi(m, co, 'gret-returned-docs'), unit:'count',
        sub:'live headers only — the register also shows the cancelled ones' },
      { id:'gret-grpo-item-net', label:'Item goods received — the denominator',
        value: kpi(m, co, 'gret-grpo-item-net'), unit:'INR',
        sub:'header-level, DocType “I” only. NOT the GRPO section’s figure' },
      { id:'gret-open-docs', label:'Returns still flagged open in SAP',
        value: kpi(m, co, 'gret-open-docs'), unit:'count', tone:'info',
        sub:'context only — this is not the uncredited measure' }
    ]));

    /* Written off as shortage — absent entirely in a book with no such card. */
    const writeoff = kpi(m, co, 'gret-internal-writeoff-gross');
    const woRow = classRow(rows, 'INTERNAL_ADJ');
    c.appendChild(kpiRow([
      { id:'gret-nontrade-gross', label:'Returns that are not a supplier at all',
        value: kpi(m, co, 'gret-nontrade-gross'), unit:'INR', tone:'warn',
        sub:'branch + sister company + write-off; no credit note will ever come' },
      { id:'gret-internal-writeoff-gross', label:'Written off as physical shortage',
        value: writeoff, unit:'INR', tone:'warn',
        sub:'the dummy “STOCK GOODS ISSUE” card — never a claim on anyone' },
      { id:'gret-credit-lag-max-days', label:'Slowest credit note',
        value: kpi(m, co, 'gret-credit-lag-max-days'), unit:'days',
        sub: 'the longest wait this book has recorded' }
    ]));

    if (writeoff === null && !woRow) {
      c.appendChild(empty({
        what: companyLabel(co) + ' has no stock write-off card.',
        why: 'The INTERNAL_ADJ class does not exist in this book — there is no “STOCK GOODS ISSUE” ' +
             'vendor card to book a physical shortage against — so the figure is not computed rather ' +
             'than ₹0. A zero would claim the card exists and was never used.'
      }));
    }

    if (Number(T.RET_DOCS) === Number(T.RET_DOCS_NO_CN)) {
      c.appendChild(empty({
        what: 'Nothing in this book has been credited yet, so there is no wait to report.',
        why: 'All ' + cnt(T.RET_DOCS) + ' live returns are uncredited, so the population behind ' +
             '“slowest credit note” is empty and the figure is not computed. Zero days would read as ' +
             '“credited immediately”, which is the exact opposite.'
      }));
    }

    /* The shortfall: only computable while the return→credit-note link is 1:1
       (spec trap 14, empty state 10). Prove it here rather than trusting it. */
    {
      const cnMap = {};
      let fanOut = live.some(r => Number(r.CN_COUNT) > 1);
      live.forEach(function (r) {
        if (blank(r.CN_DOCNUMS)) return;
        String(r.CN_DOCNUMS).split(',').forEach(function (n) {
          const k = n.trim();
          if (!k) return;
          cnMap[k] = (cnMap[k] || 0) + 1;
          if (cnMap[k] > 1) fanOut = true;
        });
      });
      const shortfall = kpi(m, co, 'gret-credit-shortfall-ext');
      const pop = live.filter(r => r.PARTY_CLASS === 'EXTERNAL' && Number(r.CN_COUNT) === 1);
      const short = pop.filter(r => (Number(scale(r.GROSS_AMT, 'GROSS_AMT')) || 0) -
                                    (Number(scale(r.CN_GROSS, 'CN_GROSS')) || 0) >= 1);

      if (fanOut) {
        c.appendChild(empty({
          what: 'A credit note now covers more than one return; the shortfall cannot be attributed.',
          why: 'CN_GROSS is the credit note’s whole DocTotal, not the part applied to this return, ' +
               'so a shortfall is only computable while the link is exactly one-to-one. That ' +
               'assertion just failed on this build, and the figure is withheld rather than falling ' +
               'back to an aggregate difference that would blame the wrong document.'
        }));
      } else if (!pop.length) {
        c.appendChild(empty({
          what: 'No credited supplier return in ' + companyLabel(co) + ' to compare against.',
          why: 'Every external return in this book is uncredited, so there is no credit note to ' +
               'measure a shortfall against. The figure is not computed rather than ₹0 — a zero here ' +
               'would read as “every credit note matched the return in full”, which is the opposite ' +
               'of a book that has never issued one.'
        }));
      } else {
        c.appendChild(kpiRow([
          { id:'gret-credit-shortfall-ext', label:'Credited for less than we sent back',
            value: shortfall, unit:'INR', tone:'bad',
            sub: short.length + ' of ' + pop.length + ' credited supplier returns came back short' }
        ]));
        if (short.length) {
          const list = short.slice().sort(function (a, b) {
            return ((Number(b.GROSS_AMT) - Number(b.CN_GROSS)) -
                    (Number(a.GROSS_AMT) - Number(a.CN_GROSS)));
          }).slice(0, 5).map(function (r) {
            const gapv = (Number(scale(r.GROSS_AMT, 'GROSS_AMT')) || 0) -
                         (Number(scale(r.CN_GROSS, 'CN_GROSS')) || 0);
            const href = hrefDocument(OBJ_RETURN, r.DOC_ENTRY, co);
            return '<a href="' + esc(href) + '">' + esc(String(r.DOC_NUM)) + '</a> ' +
                   esc(String(r.CARD_NAME || r.CARD_CODE)) + ' — ' + esc(inr(gapv)) + ' short';
          }).join(' · ');
          c.appendChild(cap(
            'Where a credit note came back smaller than the return it answers. <b>The one-to-one ' +
            'assumption was checked before this was computed</b>, not assumed: no credit note in ' +
            'this book is cited by two returns and no return cites two credit notes, which is what ' +
            'makes the difference attributable to a single document. It is not structural — the ' +
            'query is written for fan-out — so the moment that stops being true this figure ' +
            'disappears rather than blaming the wrong document. ' + list
          ));
        }
      }
    }

    c.appendChild(cap(
      'The dot beside each label is the cross-check: green means a second independent route ' +
      'reproduced the figure, amber means no second route ran, red means the two disagree — and a ' +
      'red dot never hides the number. Hover it for both routes and the gap between them. ' +
      '<b>Two of these are not a claim on anybody</b> and are toned amber for that reason: a stock ' +
      'write-off is JIVO’s own shortage, and a branch or sister-company return is stock moving ' +
      'inside the group. Adding either to the headline would inflate a recoverable ₹1.68 L into a ' +
      '₹21.26 L “claim” on Beverages.'
    ));
    add(c);
  }

  /* ── 3.11 raw source columns off the TOTAL row ───────────────────────── */
  {
    const c = card('The rest of the TOTAL row', 'raw columns, read off the single SCOPE=TOTAL row');
    const EXTRA = [
      ['RET_DOCS',           'Returns raised, ever'],
      ['RET_NET',            'Sent back, ex-GST'],
      ['RET_GST',            'GST on those returns'],
      ['RET_GROSS',          'Sent back, GST-inclusive'],
      ['RET_DOCS_OPEN',      'Still flagged open in SAP'],
      ['RET_DOCS_NO_CN',     'Returns with no credit note'],
      ['RET_GROSS_NO_CN',    'Their value — all parties'],
      ['RET_NOCN_EXT_DOCS',  'Of those, to an outside supplier'],
      ['RET_NOCN_EXT_GROSS', 'Their value — the claim'],
      ['GRPO_DOCS',          'Item goods receipts'],
      ['GRPO_NET',           'Item goods received, ex-GST'],
      ['RET_PCT_OF_GRPO',    'Return rate']
    ];
    const mk = h('<div class="minikpis"></div>');
    let n = 0;
    EXTRA.forEach(function (x) {
      const col = x[0], label = x[1];
      const v = T[col];
      if (nil(v)) return;
      const def = SUM_COLS[col];
      const kind = def ? def[1] : 'text';
      const shown = kind === 'INR' ? inr(Number(scale(v, col)))
                  : kind === 'pct' ? pc(v, 4)
                  : cnt(v);
      mk.appendChild(h(
        '<div class="mk"><div class="lab">' + esc(label) + '</div>' +
        '<div class="val">' + esc(shown) + '</div>' +
        '<div class="sub">' + esc(rupee(def ? def[2] : '')) + ' <code class="mono">' + esc(col) +
        '</code></div></div>'
      ));
      n++;
    });
    if (n) c.appendChild(mk);
    else c.appendChild(empty({
      what:'The TOTAL row carries none of these columns.',
      why:'Every one of them came back empty, which means the summary query shape changed under ' +
          'this page.'
    }));
    c.appendChild(cap(
      'Raw source columns, not derived figures — every one is read off the <b>single</b> row where ' +
      '<code>SCOPE = “TOTAL”</code> and <code>GRP_KEY = “ALL”</code>. ' +
      '<b>Three of them are formatted here by hand because their names lie about what they hold.</b> ' +
      '<code>RET_DOCS_OPEN</code> is a document count whose name ends in “OPEN”, which the board’s ' +
      'money heuristic matches — left alone it renders as “₹' + esc(cnt(T.RET_DOCS_OPEN)) + '”. ' +
      '<code>RET_GROSS_NO_CN</code> is real money whose name ends in “_CN”, which that heuristic ' +
      'does NOT match, so it would print as a bare integer beside formatted money. ' +
      '<code>RET_PCT_OF_GRPO</code> carries four decimals and an integer formatter turns Oil’s ' +
      '0.0868% into “0”. None of these is scaled: no column in this section ends in <code>_L</code> ' +
      'or <code>_CR</code>, so every figure here is raw rupees.'
    ));
    add(c);
  }

  /* ── 3.12 the register ───────────────────────────────────────────────── */
  {
    const c = card('Every goods return in this book',
      SECTION + '.' + co + '.json · detail · ' + num(det.length) + ' rows');
    c.id = 'register';

    if (!det.length) {
      c.appendChild(empty({
        what: 'The register could not be built.',
        why: 'The summary reports ' + cnt(T.RET_DOCS) + ' live returns worth ' +
             inr(val(T, 'RET_GROSS')) + ', yet the detail query returned nothing. The two queries ' +
             'disagree — that is a build failure, not an empty book, and no empty table is shown ' +
             'beside a non-zero figure.',
        href: hrefSection('health', co),
        hrefLabel: 'Check the build’s health'
      }));
      add(c);
    } else {
      /* cancellation cut — the register keeps all three states on purpose */
      const bar1 = h('<div class="toolbar"></div>');
      const chips1 = h('<div class="chips" role="group" aria-label="Which documents"></div>');
      CANCEL_SETS.forEach(function (k) {
        const set = det.filter(k.test);
        if (!set.length) return;
        chips1.appendChild(chip(k.label, st.cancel === k.key, set.length, k.why,
          () => setParam('cancel', k.key === 'LIVE' ? '' : k.key)));
      });
      bar1.appendChild(chips1);
      c.appendChild(bar1);

      /* party class */
      const present = [];
      det.forEach(r => { if (r.PARTY_CLASS && present.indexOf(r.PARTY_CLASS) < 0) present.push(r.PARTY_CLASS); });
      if (present.length > 1) {
        const bar2 = h('<div class="toolbar"></div>');
        const chips2 = h('<div class="chips" role="group" aria-label="Who the party is"></div>');
        chips2.appendChild(chip('Every party', st.pc === '', det.length,
          'No class filter.', () => setParam('party_class', '')));
        present.forEach(function (k) {
          const set = det.filter(r => r.PARTY_CLASS === k && r.CANCEL_STATUS === 'LIVE');
          chips2.appendChild(chip(CLASS_LABEL[k] || k, st.pc === k, set.length,
            (CLASS_WHY[k] || '') + ' Live rows worth ' + inr(total(set, 'GROSS_AMT')) + '.',
            () => setParam('party_class', st.pc === k ? '' : k)));
        });
        bar2.appendChild(chips2);
        c.appendChild(bar2);
      }

      /* the cuts the KPI drill-downs hand over */
      const bar3 = h('<div class="toolbar"></div>');
      const chips3 = h('<div class="chips" role="group" aria-label="Extra cuts"></div>');
      chips3.appendChild(chip('Never credited', st.uncred,
        det.filter(r => r.FLAG_NO_CREDIT_NOTE === 'Y').length,
        'FLAG_NO_CREDIT_NOTE = “Y”. This is the only column in the file that is safe to count ' +
        'without a cancellation filter: it is “Y” only when the document is LIVE and has no live ' +
        'linked credit note, and every cancelled row reads “N”.',
        () => setParam('uncredited', st.uncred ? '' : 'true')));
      chips3.appendChild(chip('Open in SAP', st.status === 'O',
        det.filter(r => r.DOC_STATUS === 'O' && r.CANCEL_STATUS === 'LIVE').length,
        'DocStatus = “O”. Shown because SAP shows it, and it is NOT the uncredited test (' +
        'C-0019) — a closed return can be entirely unrecovered.',
        () => setParam('status', st.status === 'O' ? '' : 'O')));
      bar3.appendChild(chips3);
      c.appendChild(bar3);

      /* apply */
      const set = CANCEL_SETS.find(k => k.key === st.cancel) || CANCEL_SETS[0];
      let shown = det.filter(set.test);
      const active = [];
      if (st.pc)      { shown = shown.filter(r => r.PARTY_CLASS === st.pc); active.push(CLASS_LABEL[st.pc] || st.pc); }
      if (st.uncred)  { shown = shown.filter(r => r.FLAG_NO_CREDIT_NOTE === 'Y'); active.push('never credited'); }
      if (st.extOnly) { shown = shown.filter(r => r.PARTY_CLASS === 'EXTERNAL'); active.push('outside suppliers only'); }
      if (st.status)  { shown = shown.filter(r => r.DOC_STATUS === st.status); active.push('SAP status ' + st.status); }
      if (active.length) {
        const pill = h('<div class="toolbar"><span class="pill info">' + esc(active.join(' · ')) +
          '</span> <button type="button" class="btn sm">clear these filters</button></div>');
        pill.querySelector('button').addEventListener('click', function () {
          try {
            const url = new URL(window.location.href);
            ['party_class','uncredited','status','filter'].forEach(k => url.searchParams.delete(k));
            window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
          } catch (e) { /* still re-renders */ }
          render();
        });
        c.appendChild(pill);
      }

      const detCols = Object.keys(DET_COLS);
      const sortCol = (st.sort && detCols.indexOf(st.sort) >= 0) ? st.sort : 'GROSS_AMT';
      c.appendChild(table(shown, {
        co: co,
        cols: detCols,
        labels: labelsFor(DET_COLS),
        units: unitsFor(DET_COLS),
        links: {
          CARD_CODE: (v) => partyHref(v),
          CARD_NAME: (v, r) => partyHref(r.CARD_CODE),
          DOC_NUM:   (v, r, cc) => (nil(r.DOC_ENTRY) ? null : hrefDocument(OBJ_RETURN, r.DOC_ENTRY, cc)),
          DOC_ENTRY: (v, r, cc) => (nil(v) ? null : hrefDocument(OBJ_RETURN, v, cc))
        },
        sort: (st.dir === 'asc' ? '' : '-') + sortCol,
        filter: 'Find a return by vendor, number, reason or the vendor’s own ref…',
        facets: ['PARTY_CLASS','FLAG_NO_CREDIT_NOTE'],
        total: ['NET_AMT','GST_AMT','GROSS_AMT','CN_GROSS','NUM_LINES','NUM_ITEMS','CN_COUNT'],
        empty: {
          what: 'No return matches this cut.',
          why: 'The chips above filter a real, non-empty register — nothing matched this ' +
               'combination. That is not a zero exposure; widen the filter to see the rows that exist.'
        },
        caption: 'Goods returns — one row per document'
      }));

      const cancelled = det.filter(r => r.CANCEL_STATUS === 'CANCELLED').length;
      const mirrors   = det.filter(r => r.CANCEL_STATUS === 'CANCELLATION_DOC').length;
      c.appendChild(cap(
        '<b>The totals row adds up only the rows currently in view</b>, which is why the register ' +
        'opens on live documents. This book carries ' + esc(num(cancelled)) + ' cancelled original(s) ' +
        'and ' + esc(num(mirrors)) + ' cancellation mirror(s) alongside its ' + esc(num(live.length)) +
        ' live returns; the mirror is SAP’s own reversing document and carries an <i>identical</i> ' +
        'total to the original it cancels, so a sum over “including cancelled” counts every ' +
        'cancellation twice. ' + cv('C-0021') + ' — that is exactly why a <code>&lt;&gt; “Y”</code> ' +
        'filter is wrong rather than merely untidy. ' +
        '<b>Quantity is in pieces</b> and is deliberately left out of the totals row: it sums single ' +
        'bottles, tonnes of oil and packaging across mixed units of measure, so its total is a size ' +
        'hint and not a volume (' + cv('C-0001') + '). Credit-note and base-receipt numbers are shown ' +
        'as text on purpose — SAP hands them over as a number when there is one and as a ' +
        'comma-separated string when there are several, and they are <code>DocNum</code>s rather than ' +
        '<code>DocEntry</code>s, so neither can be linked to its document from here.'
      ));

      c.appendChild(glossary(DET_COLS, detCols, 'What every column on this table means'));

      if (det.length >= 500) {
        c.appendChild(empty({
          what: 'This register is truncated at the query cap of 500 rows.',
          why: 'The detail query is hard-capped, so the smallest returns are missing and any total ' +
               'taken from this table is a LOWER BOUND. The summary figures above are unaffected — ' +
               'they are aggregated in SQL before the cap applies.'
        }));
      }
      add(c);
    }
  }

  /* ── 3.13 the facet explorer ─────────────────────────────────────────── */
  {
    const c = card('The same book, cut five ways', 'the faceted summary · ' + num(rows.length) + ' rows');
    c.id = 'facets';
    c.appendChild(h(
      '<p class="blurb">This one result set stacks five independent aggregates of the same ' +
      'documents. <b>Adding every row together multiplies the book by about five</b> — Oil’s 61 rows ' +
      'add to ₹3.73 Cr against a real ₹74.61 lakh. It is the single biggest mistake available on this ' +
      'page. Pick one stack.</p>'
    ));
    const barF = h('<div class="toolbar"></div>');
    const chipsF = h('<div class="chips" role="group" aria-label="Which facet"></div>');
    const current = FACETS.some(f => f[0] === st.facet) ? st.facet : 'CLASS';
    FACETS.forEach(function (f) {
      const s2 = facet(rows, f[0]);
      if (!s2.length) return;
      chipsF.appendChild(chip(f[1], current === f[0], s2.length, f[2],
        () => setParam('scope', f[0])));
    });
    barF.appendChild(chipsF);
    c.appendChild(barF);

    const fRows = facet(rows, current);
    const meta = FACETS.find(f => f[0] === current);
    const sumCols = ['GRP_KEY','GRP_LABEL','RET_DOCS','RET_GROSS','RET_NET','RET_GST',
                     'RET_DOCS_NO_CN','RET_GROSS_NO_CN','RET_NOCN_EXT_DOCS','RET_NOCN_EXT_GROSS',
                     'RET_DOCS_OPEN','GRPO_DOCS','GRPO_NET','RET_PCT_OF_GRPO']
                    .filter(k => k in SUM_COLS);
    const isVendor = current === 'VENDOR';
    const retCols = ['RET_DOCS','RET_GROSS','RET_NET','RET_GST','RET_DOCS_NO_CN','RET_GROSS_NO_CN',
                     'RET_NOCN_EXT_DOCS','RET_NOCN_EXT_GROSS','RET_DOCS_OPEN'];

    c.appendChild(table(fRows, {
      co: co,
      cols: sumCols,
      labels: labelsFor(SUM_COLS),
      units: unitsFor(SUM_COLS),
      links: isVendor
        ? { GRP_KEY: (v) => partyHref(v), GRP_LABEL: (v, r) => partyHref(r.GRP_KEY) }
        : {},
      sort: '-RET_GROSS',
      filter: 'Find a row in this stack…',
      /* Totals cover the RETURN measures only. The GRPO columns do not fold back
         on VENDOR (a LEFT JOIN restricted to cards that had a return) and are
         NULL on every CREDIT_NOTE row, so they are never totalled. */
      total: current === 'TOTAL' ? false : retCols,
      empty: { what:'This stack is empty in ' + companyLabel(co) + '.',
               why:'The query produced no rows for this facet in this book.' },
      caption: 'Summary facet: ' + (meta ? meta[1] : current)
    }));

    /* Say, from the live data, whether this stack actually re-totals. */
    let recon = '';
    if (current !== 'TOTAL' && fRows.length) {
      const dRet = Math.abs(total(fRows, 'RET_GROSS') - (val(T, 'RET_GROSS') || 0));
      const gSum = total(fRows, 'GRPO_NET'), gTot = val(T, 'GRPO_NET');
      const gShare = (gTot ? 100 * gSum / gTot : null);
      recon = '<b>On this build the nine return measures re-total to ' +
        (dRet < 1 ? 'the TOTAL row exactly' : 'within ' + esc(inr(dRet)) + ' of the TOTAL row') +
        '.</b> ' +
        (current === 'CREDIT_NOTE'
          ? 'The goods-receipt columns are NULL on every row of this stack by design: splitting ' +
            'returns by whether they were credited says nothing about goods received, and a ' +
            'formatter that coerced those NULLs to 0 would print a 0.000% return rate that looks ' +
            'like a reading. '
          : gShare === null ? ''
            : 'The goods-receipt columns are a different matter: this stack covers ' +
              esc(gShare.toFixed(1)) + '% of the book’s ' + esc(inr(gTot)) + ' of item receipts' +
              (isVendor ? ', because the GRPO side is LEFT JOINed only to cards that had a return' : '') +
              '. ');
    }
    c.appendChild(cap(
      (meta ? '<b>' + esc(meta[1]) + '</b> — ' + esc(meta[2]) + ' ' : '') + recon +
      (isVendor
        ? '<b>VENDOR is a capped stack</b> — about forty cards, biggest returns first — so it must ' +
          'never be <i>assumed</i> to re-total even when, as here, nothing was truncated. It also ' +
          'carries no party-class column at all: the class is embedded in the label as a ' +
          '“[CLASS]” suffix, which is why the vendor ranking further up this page is built from the ' +
          'register instead. And its return rate is not a return rate — BEE HIVE FARMS reads ' +
          '2,867.52% because goods are received on one card and returned on another. '
        : current === 'TOTAL'
          ? 'This stack is the whole book already, so no totals row is shown. '
          : '') +
      (current === 'MONTH'
        ? 'Rows exist for months carrying a goods receipt and no return, because the month join is a ' +
          'FULL OUTER — those zeros are real for returns and are not evidence the month was examined ' +
          'for anything else. '
        : '') +
      'A cell that could not be computed reads <code>n/c</code>, never 0.'
    ));
    c.appendChild(glossary(SUM_COLS, sumCols, 'What every column on this table means'));

    if (rows.length >= 200) {
      c.appendChild(empty({
        what: 'The summary is truncated at the query cap of 200 rows.',
        why: 'The cap bites the smallest VENDOR rows first, so that stack is no longer complete and ' +
             'must not be re-totalled. The TOTAL, CLASS, CREDIT_NOTE and MONTH stacks are unaffected.'
      }));
    }
    add(c);
  }

  /* ── 3.14 what this section cannot see ───────────────────────────────── */
  {
    const c = card('What this section cannot see', 'the honest edges of the measurement');
    const standalone = live.filter(r => !(Number(r.BASE_GRPO_COUNT) > 0)).length;
    c.appendChild(empty({
      what: '“No credit note” means no LINKED credit note.',
      why: 'The test is SAP’s own document link (RPD1.TargetType = 19). A credit note raised ' +
           'standalone, or copied from the A/P invoice instead of from the return, is invisible to ' +
           'it and the return still reads uncredited. An amount-and-date sweep during the review ' +
           'found one Oil return (₹13,806, 2.1% of its headline) and one Mart return (₹79,134, 35% ' +
           'of its headline) that were probably already recovered that way. Neither is netted off ' +
           'the figure above, because an amount match is a hint and not a link — the headline is ' +
           'therefore an upper bound on what is genuinely unrecovered.'
    }));
    c.appendChild(empty({
      what: 'The chain back to the goods receipt does not exist at JIVO.',
      why: num(standalone) + ' of ' + num(live.length) + ' live returns in this book were raised ' +
           'standalone, with no copy-from link to the receipt they came out of. So this section ' +
           'cannot say which delivery a return belongs to, and the GRPO section’s own ' +
           '“returned” columns — which count receipts a return was copied FROM — are near-empty by ' +
           'construction and must never be used to cross-check the figures here.',
      href: hrefSection('grpo', co),
      hrefLabel: 'Goods coming the other way'
    }));
    c.appendChild(empty({
      what: 'This is a document register, not the GRNI account.',
      why: 'A goods return debits GRNI at moving-average cost while the document moves at the ' +
           'return price, and four Oil returns carry no journal entry at all (₹22,207 combined), so ' +
           'the register and the general-ledger balance can never tie one to one. The GL is ' +
           'corroboration for this section, not a reconciliation, and no figure here is presented as ' +
           'a GRNI balance.',
      href: hrefSection('provisions', co),
      hrefLabel: 'Ledger-side accruals'
    }));
    add(c);
  }

  /* ── 3.15 how to read this ───────────────────────────────────────────── */
  {
    const c = card('How to read this', 'every way a naive version of this page goes wrong');
    c.appendChild(h(
      '<p class="blurb">These are not caveats in the small-print sense. Each one is a specific, ' +
      'measured way that the obvious reading of this data produces a wrong number, found by ' +
      'attacking the query against live SAP.</p>'
    ));
    const ol = h('<div class="prose"><ol></ol></div>');
    const list = ol.querySelector('ol');
    TRAPS.forEach(function (t) { list.appendChild(h('<li>' + esc(rupee(t)) + '</li>')); });
    c.appendChild(ol);
    c.appendChild(h(
      '<p class="tnote">The corrections behind them: ' +
      ['C-0001','C-0005','C-0019','C-0020','C-0021','C-0022'].map(cv).join(' ') +
      ' — each links to the full record on the methodology page. ' + cv('C-0001') +
      ' is why the one quantity column on this page is labelled <b>pieces</b> and is kept out of ' +
      'every total: it adds single bottles to tonnes of oil to packaging across mixed units of ' +
      'measure. Beverages’ 2.26 crore against Mart’s 42,260 is a unit artefact, not a volume ' +
      'difference, and converting it to tonnes or cartons would be wrong by roughly twenty times.</p>'
    ));
    /* ui.js note() renders the working note's fenced code and pipe tables with
       no scroller of their own, so at 390px an OPEN disclosure would push the
       whole page sideways. assets/ belongs to another agent, so the scroller
       goes here. */
    const noteHost = h('<div style="overflow-x:auto;max-width:100%"></div>');
    noteHost.appendChild(note(SECTION));
    c.appendChild(noteHost);
    add(c);
  }

  /* ── 3.16 the SQL ────────────────────────────────────────────────────── */
  add(await sqlCard(der, co));

  paintFoot(m, co, asOf, rows, det);

  /* A drill-down that named a panel lands on it (once — see jumpTo). */
  if (st.view === 'register') jumpTo('register');
  else if (st.facet) jumpTo('facets');
}

/* ══ 4. pieces ════════════════════════════════════════════════════════════ */

/**
 * Fetch one published query, having asked the index first. `site-v2/` is the
 * deploy root, so `../pipeline/sql/...` 404s in production; the build copies the
 * queries to `sql/`. The index is consulted BEFORE the fetch — a fetch-and-fail
 * logs a console 404 the page cannot suppress, and the browser gate counts
 * console errors as failures, so a benign 404 would drown a real one.
 */
async function fetchSql(idx, file, id) {
  if (!Array.isArray(idx) || idx.indexOf(id) < 0) return null;
  try {
    const r = await fetch(file, { cache: 'no-cache' });
    if (!r.ok) return null;
    return await r.text();
  } catch (e) { return null; }
}

/** One `<details>` holding a numbered query. */
function sqlBlock(title, text, from, reads) {
  const box = h('<details class="sqlbox-host"><summary class="btn sm">' + esc(title) + '</summary></details>');
  box.style.margin = '0 0 12px';
  const body = h('<div style="margin-top:12px"></div>');
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const html = lines.map(function (ln, i) {
    return '<span class="ln">' + (i + 1) + '</span>' + esc(ln);
  }).join('\n');
  body.appendChild(h('<div class="sqlbox"><pre><code>' + html + '</code></pre></div>'));
  body.appendChild(h('<div class="sqlfoot"><span>' + esc(from) + '</span><span>' +
    num(lines.length) + ' lines</span><span>' + esc(reads) + '</span></div>'));
  box.appendChild(body);
  return box;
}

/** The two queries behind this page, behind disclosures. */
async function sqlCard(der, co) {
  const c = card('The queries behind this page', SQL_FILE + ' · ' + SQL_DETAIL);

  let idx = null;
  try {
    idx = await fetch(SQL_INDEX, { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null));
  } catch (e) { idx = null; }

  const [sumText, detText] = await Promise.all([
    fetchSql(idx, SQL_FILE, SECTION),
    fetchSql(idx, SQL_DETAIL, SECTION + '-detail')
  ]);

  if (sumText) {
    c.appendChild(sqlBlock('Show the summary query', sumText,
      'the full query, ' + SQL_FILE, 'reads ORPD · RPD1 · ORPC · OPDN · OCRD · OCRG'));
  } else {
    const d = der && (der['gret-uncredited-ext-gross'] || der['gret-returned-gross']);
    if (d && d.sql && d.sql.text) {
      c.appendChild(sqlBlock('Show the summary query', d.sql.text,
        'the excerpt carried in the derivation record' +
        (Array.isArray(d.sql.lines) ? ' (lines ' + d.sql.lines[0] + '–' + d.sql.lines[1] + ')' : ''),
        'reads ORPD · RPD1 · ORPC · OPDN'));
    } else {
      c.appendChild(empty({
        what: 'The summary query text is not published with this build.',
        why: 'It is not listed in ' + SQL_INDEX + ', and no derivation record carried an excerpt. ' +
             'The file itself is in the repo at pipeline/' + SQL_FILE + '.'
      }));
    }
  }

  if (detText) {
    c.appendChild(sqlBlock('Show the register query', detText,
      'the full query, ' + SQL_DETAIL, 'reads ORPD · RPD1 · ORPC · OPDN · OCRD · OCRG'));
  }

  c.appendChild(h(
    '<p class="tnote">Read-only, and reviewed adversarially before it was allowed near the board — ' +
    'four defects found and fixed, two of them material to the headline. ' +
    '<b>They are two separate files, and that is what makes the cross-checks real.</b> The summary ' +
    'aggregates in HANA through a chain of CTEs; the register emits one row per document with its ' +
    'own credit-note join and no aggregation over documents, so re-adding the register and landing ' +
    'on the summary is a genuinely independent route rather than the same arithmetic twice. ' +
    'Money columns are plain rupees: no column in this section ends in <code>_L</code> or ' +
    '<code>_CR</code>, so the display divides by a lakh or a crore and the query never does. ' +
    'Neither file is edited by the dashboard (CONTRACT §0.6): changing one of these queries ' +
    'silently changes the books.</p>'
  ));
  return c;
}

/** The page footer: where the numbers came from, and how old they are. */
function paintFoot(m, co, asOf, rows, det) {
  const foot = document.getElementById('foot');
  if (!foot) return;
  const gen = m && m.generated_at;
  const live = (det || []).filter(r => r && r.CANCEL_STATUS === 'LIVE').length;
  foot.innerHTML =
    '<h3>Where these numbers come from</h3>' +
    '<div class="lineage">' +
      '<div><b>Section</b> — goods-return, from <code>ORPD</code>/<code>RPD1</code> (the return and ' +
        'its lines) matched against <code>ORPC</code> (the A/P credit note that recovers the money) ' +
        'and <code>OPDN</code> (item goods receipts, the denominator), with <code>OCRD</code>/' +
        '<code>OCRG</code> for the vendor and its group. Every summary figure counts live documents ' +
        'only — <code>CANCELED = “N”</code>.</div>' +
      '<div><b>Shape</b> — the summary is faceted: ' + num((rows || []).length) + ' rows stacked into ' +
        'five aggregates of the same documents, and every total on this page is read from the one ' +
        'row where <code>SCOPE = “TOTAL”</code>. The register is ' + num((det || []).length) +
        ' rows, of which ' + num(live) + ' are live — it deliberately keeps the cancelled originals ' +
        'and SAP’s cancellation mirrors so a mirror can be recognised rather than silently added.</div>' +
      '<div><b>Book</b> — ' + esc(companyLabel(co)) + '. Figures from one company are not comparable ' +
        'with another’s, and adding the three together double counts JIVO’s inter-book trading.</div>' +
      '<div><b>Freshness</b> — ' + (asOf ? 'as of ' + esc(asOf) + '. ' : '') +
        (gen ? 'Built ' + esc(ago(gen)) + ' (' + esc(gen) + '). ' : 'Build time unknown. ') +
        'Ages are computed at build time, not in the browser, and the return rate’s denominator ' +
        'moves during the working day — Mart read 0.4250% at 18:58 and 0.4246% at 19:05 on the same ' +
        'afternoon. Never mix figures read at different times. The page re-reads the manifest every ' +
        'minute and redraws itself when the build moves.</div>' +
      '<div><b>Read-only</b> — this board issues no write to SAP, ever (CONTRACT §0.2).</div>' +
