version: 2
project_name: jivo-pp-cli
changelog:
  disable: true
builds:
  - id: jivo-pp-cli
    main: ./cmd/jivo-pp-cli
    binary: jivo-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X jivo-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: jivo-pp-mcp
    main: ./cmd/jivo-pp-mcp
    binary: jivo-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: jivo-pp-cli
    repository:
      owner: daman8271
      name: homebrew-tap
    homepage: "https://github.com/daman8271/jivo-pp-cli"
    description: "Jivo Group — Control Panel"
    install: |
      bin.install "jivo-pp-cli"
      bin.install "jivo-pp-mcp"
