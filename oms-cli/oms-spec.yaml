name: oms
description: "JIVO OMS (Order Management System) CLI — READ-ONLY. Orders, quotations, schemes, approvals, party & product assignments, the SAP Business One mirror, live SAP HANA stock and pricing, the invoice review queue, FSSAI label compliance, and the invoice tracker at oms.jivo.in. Every command is a GET; no mutating endpoint is wrapped. HANA commands require --branch (OIL or BEVERAGE) — it picks the SAP company database."
version: "0.2.0"
base_url: "https://oms.jivo.in"
health_check_path: "/api/auth/profile/"

auth:
  type: bearer_token
  header: "Authorization"
  format: "Bearer {token}"
  env_vars:
    - OMS_TOKEN

config:
  format: toml
  path: "~/.config/oms-pp-cli/config.toml"


resources:
  account:
    description: "Authenticated account, users, roles, permissions and reference master data (companies, states, categories, main groups), plus the device registry and UI label config"
    endpoints:
      profile:
        method: GET
        path: "/api/auth/profile/"
        description: "Show the authenticated user (role, company, main groups, states, category, page permissions)"
        response:
          type: object
      users:
        method: GET
        path: "/api/auth/users/list/"
        description: "List app users"
        response:
          type: object
      user-parties:
        method: GET
        path: "/api/auth/users/{id}/parties/"
        description: "Parties (customers) assigned to a user"
        params:
          - name: id
            type: int
            required: true
            positional: true
            description: "User id"
          - name: category
            type: string
            description: "string, optional, query. Enum `OIL` | `BEVERAGES` | `MART`."
        response:
          type: object
      user-page-permissions:
        method: GET
        path: "/api/auth/users/{id}/page-permissions/"
        description: "Page-permission grants for a user"
        params:
          - name: id
            type: int
            required: true
            positional: true
            description: "User id"
        response:
          type: object
      roles:
        method: GET
        path: "/api/auth/roles/"
        description: "List roles (admin, auditor, billing, rate approver, manager, etc.)"
        response:
          type: object
      companies:
        method: GET
        path: "/api/auth/companies/"
        description: "List companies (Jivo Mart, Jivo Wellness)"
        response:
          type: object
      states:
        method: GET
        path: "/api/auth/states/"
        description: "List states"
        response:
          type: object
      categories:
        method: GET
        path: "/api/auth/categories/"
        description: "List product categories (e.g. OIL)"
        response:
          type: object
      main-groups:
        method: GET
        path: "/api/auth/mainGroup/"
        description: "List main groups (ROI, GT, MT, BRANCH, ...)"
        response:
          type: object
      party-products:
        method: GET
        path: "/api/auth/parties/{card_code}/products/"
        description: "Products assigned to a party (argument is the SAP card_code, not a numeric id)"
        params:
          - name: card_code
            type: string
            required: true
            positional: true
            description: "SAP party card code, e.g. CUSTA000596"
          - name: category
            type: string
            description: "string, optional, query. Enum `OIL` | `BEVERAGES` | `MART`"
        response:
          type: object
      my-devices:
        method: GET
        path: "/api/devices/me/"
        description: "Push-notification devices registered to the calling user. Returns an empty list if you have never enrolled a browser or handset."
        response:
          type: object
      devices:
        method: GET
        path: "/api/admin/devices/"
        description: "The device registry — every browser and phone that has logged into OMS, who was on it, and when it was last seen. This is how you find out which app build a salesperson is actually running before you believe a bug report from the field."
        params:
          - name: search
            type: string
            description: "string, optional, query. Free text. Server-side matches user name"
          - name: status
            type: string
            description: "string, optional, query. Enum **`online` | `idle` | `offline` |"
          - name: build_number
            type: int
            description: "int, optional, query. Verified live: `?build_number=3` →"
          - name: ordering
            type: string
            description: "string, optional, query. Django-style; prefix `-` for"
          - name: page
            type: int
            description: "int, optional, query, default 1."
          - name: page_size
            type: int
            description: "int, optional, query, default 25 (`ege=25` in the bundle),"
        response:
          type: object
      device-analytics:
        method: GET
        path: "/api/admin/devices/analytics/"
        description: "One-screen rollout health for the OMS apps — how many devices are on each Android/iOS/web build, and how many have been seen recently. Use it to answer \"has everyone updated?\" before blaming the backend."
        params:
          - name: days
            type: int
            description: "int, optional, query, **default 14**. Controls only the length of"
        response:
          type: object
      device:
        method: GET
        path: "/api/admin/devices/{id}/"
        description: "Full record for one enrolled device — model, OS, app build, first and last login — for when you need to confirm exactly what a specific user was running."
        params:
          - name: id
            type: int
            required: true
            positional: true
            description: "int, required, positional. The registry row id, **not** `device_id`"
        response:
          type: object
      ui-label-config:
        method: GET
        path: "/api/ui-config/admin/labels/"
        description: "The editable definitions behind OMS's renameable field labels — the admin view, with the description and the active flag."
        response:
          type: object
      ui-labels:
        method: GET
        path: "/api/ui-config/labels/"
        description: "The resolved label map the app renders with — what the UI currently calls each renameable field. Useful when a user's screenshot says something your data dictionary doesn't."
        response:
          type: object
  orders:
    description: "Sales orders, quotations, schemes, dispatches, approval flows and the order dashboard"
    endpoints:
      list:
        method: GET
        path: "/api/orders/list/"
        description: "All orders (admin-wide). Filter by status/stage. TRAPS: bare `orders list` is NOT the order book - it returns one slice (263 of 2,163 orders). `status` accepts a comma-separated list and unions them. `billing=true` DISCARDS any `status` you also pass (proven: six query strings, byte-identical bodies). `approval_pending=true` alone is a no-op."
        params:
          - name: status
            type: string
            description: "One of: ORDER_CREATED | RATE_APPROVAL | BILLING | NEED_APPROVAL | BILLING_PENDING | APPROVED | REJECTED | BILLING_REJECTED | COMPLETED | AUDITOR_APPROVAL | DRAFT. Filter by status code (e.g. BILLING, AUDITOR_APPROVAL)"
          - name: billing
            type: bool
            description: "Only billing-stage orders"
          - name: approval_pending
            type: bool
            description: "Only approval-pending orders"
        response:
          type: array
      by-user:
        method: GET
        path: "/api/orders/ordersbyuser/{user_id}/"
        description: "Orders raised by a specific user (source for View Orders / Order Tracking)"
        params:
          - name: user_id
            type: int
            required: true
            positional: true
            description: "User id"
        response:
          type: array
      detail:
        method: GET
        path: "/api/orders/orderdetailsbyid/{id}/"
        description: "Full order with line items, addresses, rate approvals, SAP doc number"
        params:
          - name: id
            type: int
            required: true
            positional: true
            description: "Order id"
        response:
          type: object
      logs:
        method: GET
        path: "/api/orders/{id}/orderlogs/"
        description: "Status-change audit trail for an order (drives the tracking timeline)"
        params:
          - name: id
            type: int
            required: true
            positional: true
            description: "Order id"
        response:
          type: array
      status:
        method: GET
        path: "/api/orders/status/"
        description: "Order status master (id -> name)"
        response:
          type: array
      status-tracking:
        method: GET
        path: "/api/orders/status-tracking/"
        description: "Approval queue for a stage. Requires --mode."
        params:
          - name: mode
            type: string
            required: true
            description: "Approval stage"
        response:
          type: array
      stock-check:
        method: GET
        path: "/api/orders/stock-check/"
        description: "Per-order required-qty vs available-stock (legacy view)"
        response:
          type: array
      dispatches:
        method: GET
        path: "/api/orders/dispatches/"
        description: "Dispatch-from locations"
        response:
          type: array
      notifications:
        method: GET
        path: "/api/orders/notifications/"
        description: "Order-status notifications for the current user"
        response:
          type: array
      addresses:
        method: GET
        path: "/api/orders/addresses/"
        description: "Bill-to / ship-to addresses for a party. Requires --card-code."
        params:
          - name: card_code
            type: string
            required: true
            description: "SAP party card code"
          - name: category
            type: string
            description: "Optional category filter"
        response:
          type: object
      branch:
        method: GET
        path: "/api/orders/branch/"
        description: "SAP branch / BPL list"
        response:
          type: array
      parties:
        method: GET
        path: "/api/orders/parties/"
        description: "Assigned-party dropdown (card_code -> card_name) for the current user"
        response:
          type: array
      products:
        method: GET
        path: "/api/orders/products/"
        description: "Global product list"
        response:
          type: array
      staff-products:
        method: GET
        path: "/api/orders/staff-products/"
        description: "Staff-assigned products"
        response:
          type: array
      party-products:
        method: GET
        path: "/api/orders/party-products/{card_code}/"
        description: "Products (with rates) assigned to a party, for the order product selector"
        params:
          - name: card_code
            type: string
            required: true
            positional: true
            description: "SAP party card code"
        response:
          type: array
      schemes:
        method: GET
        path: "/api/orders/schemes/"
        description: "Sales schemes / promotions"
        params:
          - name: state_code
            type: string
            description: "string, optional, query. **Not in the shipped spec.** Source:"
        response:
          type: array
      flow-config:
        method: GET
        path: "/api/orders/flow-config/"
        description: "Global order approval-flow configuration"
        params:
          - name: flow_type
            type: string
            description: "string, optional, query. Enum **`ASM` | `BILLING`**. Source:"
        response:
          type: object
      party-flow-config:
        method: GET
        path: "/api/orders/party-flow-config/"
        description: "Per-party approval-flow configuration"
        response:
          type: object
      dashboard:
        method: GET
        path: "/api/orders/dashboard/"
        description: "Order dashboard headline counters. Note this is a DIFFERENT endpoint from the shipped `orders dashboardW`, which the web app uses; both are live."
        response:
          type: object
      dashboard-charts:
        method: GET
        path: "/api/orders/dashboard/charts/"
        description: "Chart series behind the order dashboard. Large — 268 KB in one unpaginated response; use --compact or --csv."
        response:
          type: object
      product-filters:
        method: GET
        path: "/api/orders/product-filters/"
        description: "The filter options (brand, variety, pack size) offered by the order product selector."
        response:
          type: object
      template-parties:
        method: GET
        path: "/api/orders/templates/parties/"
        description: "Parties available as an order template — the 'repeat a previous order' picker. Empty for a user with no assigned parties."
        response:
          type: array
      template-orders:
        method: GET
        path: "/api/orders/templates/orders/"
        description: "Previous orders for one party, offered as templates for a new order."
        params:
          - name: card_code
            type: string
            required: true
            description: "SAP party card code. Server-named requirement; values from `sap parties`."
        response:
          type: object
      by-item:
        method: GET
        path: "/api/orders/orders-by-item/"
        description: "Every order line for one FG item — who ordered it, how much, and in what state."
        params:
          - name: item_code
            type: string
            required: true
            description: "SAP item code. Server-named requirement; values from `hana fg-items --branch OIL`."
        response:
          type: object
      notifications-history:
        method: GET
        path: "/api/orders/notifications/history/"
        description: "The full notification feed for the current user, paged — including alerts already read, which the live `orders notifications` call drops."
        params:
          - name: limit
            type: int
            description: "int, optional, query. Source: app call site"
          - name: offset
            type: int
            description: "int, optional, query. Same source; the app pages by"
          - name: filter
            type: string
            description: "string, optional, query. Enum **`all` | `unread`**. Source: the"
        response:
          type: object
      schemes-manage:
        method: GET
        path: "/api/orders/schemes/manage/"
        description: "The full scheme table behind the scheme admin screen — each scheme joined to the SKU it applies to, its pack size, its state, and whether it is switched on."
        params:
          - name: state_code
            type: string
            description: "string, optional, query. Source: app call site"
          - name: search
            type: string
            description: "string, optional, query. Same source."
          - name: include_inactive
            type: string
            description: "string `\"true\"`, optional, query. Same source; the app"
        response:
          type: object
      web-push-key:
        method: GET
        path: "/api/orders/web-push/public-key/"
        description: "The VAPID public key the browser needs to register for OMS push notifications. Infrastructure, not business data."
        response:
          type: object
  quotations:
    description: "Quotation overview and per-order quotation status"
    endpoints:
      overview:
        method: GET
        path: "/api/orders/quotation-overview/"
        description: "All quotations with SAP doc numbers and cancellation state The SAP doc numbers here are real: sampled (doc_num, doc_entry) pairs resolve exactly to SAP OQUT quotations. Note doc_num is NOT unique across companies - the same number exists in Oil and Beverages, so always pair it with the branch."
        response:
          type: object
      status:
        method: GET
        path: "/api/orders/quotation-status/"
        description: "Open/closed SAP status badges for specific quotations"
        params:
          - name: order_ids
            type: string
            description: "Comma-separated order ids, e.g. 1,2,3"
        response:
          type: object
  dashboard:
    description: "Order dashboard widgets and charts"
    endpoints:
      summary:
        method: GET
        path: "/api/orders/dashboardW/"
        description: "Dashboard KPI block (total orders, total sales, completion)"
        params:
          - name: year
            type: int
            description: "int, optional, query. Source: app call site"
          - name: month
            type: int
            description: "int, optional, query. Source: same call site. `0` = all months"
        response:
          type: object
      charts:
        method: GET
        path: "/api/orders/dashboardW/charts/"
        description: "Dashboard chart series (visual overview, statewise)"
        params:
          - name: status
            type: string
            description: "Optional status filter for the series"
          - name: line_year
            type: int
            description: "int, optional, query. Source: app call site"
          - name: year
            type: int
            description: "int, optional, query. Same source."
          - name: month
            type: int
            description: "int, optional, query. Same source; `0` = all months."
        response:
          type: object
  sap:
    description: "The SAP Business One mirror inside OMS: synced parties, products, addresses, branches and sync logs. Covers all three SAP companies"
    endpoints:
      logs:
        method: GET
        path: "/api/sap/logs/"
        description: "SAP sync history (sync_type, status, records processed/created/updated, duration)"
        response:
          type: array
      branches:
        method: GET
        path: "/api/sap/branches/"
        description: "SAP branches"
        response:
          type: array
      parties:
        method: GET
        path: "/api/sap/parties/"
        description: "SAP parties (business partners)"
        response:
          type: array
      party-categories:
        method: GET
        path: "/api/sap/parties/category/"
        description: "SAP parties filtered by category"
        params:
          - name: category
            type: string
            description: "Category filter"
        response:
          type: object
      products:
        method: GET
        path: "/api/sap/products/"
        description: "SAP products"
        response:
          type: array
      product-varieties:
        method: GET
        path: "/api/sap/product-varieties/"
        description: "SAP product varieties"
        response:
          type: object
      addresses:
        method: GET
        path: "/api/sap/addresses/"
        description: "SAP addresses"
        response:
          type: array
      quotation-log:
        method: GET
        path: "/api/sap/quotation-log/{id}/"
        description: "Per-order SAP quotation push record"
        params:
          - name: id
            type: int
            required: true
            positional: true
            description: "Order id"
        response:
          type: object
      sync-status:
        method: GET
        path: "/api/sap/status/"
        description: "Current state of the SAP mirror sync: what ran, when, and whether it finished."
        response:
          type: object
      schedules:
        method: GET
        path: "/api/sap/schedules/"
        description: "Configured SAP sync schedules. Read-only view; the toggle that enables one is a write and is not wrapped."
        response:
          type: object
  hana:
    description: "Live SAP HANA reads. EVERY command needs --branch (OIL or BEVERAGE) - it selects the SAP company database and the answer is meaningless without it"
    endpoints:
      product-stock:
        method: GET
        path: "/api/hana/product-stock/"
        description: "BROKEN UPSTREAM (2026-08-04): the OMS backend raises \"name 'unique_schemas' is not defined\" and returns HTTP 502 on every call, for both branches. Reported to the OMS team. | Live product stock from SAP HANA"
        params:
          - name: branch
            type: string
            required: true
            description: "SAP company database to read. One of: OIL | BEVERAGE. Required by the server on every hana endpoint; the figures differ per branch, so an answer without it is meaningless."
        response:
          type: object
      product-so:
        method: GET
        path: "/api/hana/product-so/"
        description: "BROKEN UPSTREAM (2026-08-04): the OMS backend raises \"get_sales_orders_for_product() takes 1 positional argument but 2 were given\" and returns HTTP 500 on every call. Reported to the OMS team. | Product sales-order data for an item. Requires --item-code."
        params:
          - name: branch
            type: string
            required: true
            description: "SAP company database to read. One of: OIL | BEVERAGE. Required by the server on every hana endpoint; the figures differ per branch, so an answer without it is meaningless."
          - name: item_code
            type: string
            required: true
            description: "SAP item code"
        response:
          type: object
      so:
        method: GET
        path: "/api/hana/so/"
        description: "Sales orders for a party. Requires --card-code."
        params:
          - name: card_code
            type: string
            required: true
            description: "SAP party card code"
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      open-parties:
        method: GET
        path: "/api/hana/open-parties/"
        description: "Parties with open transactions"
        params:
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      all-customers:
        method: GET
        path: "/api/hana/all-customers/"
        description: "All customers from SAP HANA"
        params:
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      fg-items:
        method: GET
        path: "/api/hana/fg-items/"
        description: "Finished-goods items"
        params:
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      freight-masters:
        method: GET
        path: "/api/hana/freight-masters/"
        description: "Freight master records"
        params:
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      inventory-details:
        method: GET
        path: "/api/hana/inventory-details/"
        description: "Per-warehouse inventory for an item. Requires --item-code."
        params:
          - name: item_code
            type: string
            required: true
            description: "SAP item code"
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      batch-details:
        method: GET
        path: "/api/hana/batch-details/"
        description: "Batch details for an item in a warehouse. Requires --item-code and --whs-code."
        params:
          - name: item_code
            type: string
            required: true
            description: "SAP item code"
          - name: whs_code
            type: string
            required: true
            description: "Warehouse code"
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      customer-details:
        method: GET
        path: "/api/hana/customer-details/"
        description: "Customer master detail. Requires --card-code."
        params:
          - name: card_code
            type: string
            required: true
            description: "SAP card code"
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      address:
        method: GET
        path: "/api/hana/address/"
        description: "Addresses for a customer. Requires --card-code."
        params:
          - name: card_code
            type: string
            required: true
            description: "SAP card code"
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      item-price:
        method: GET
        path: "/api/hana/item-price/"
        description: "Price for an item on a price list. Requires --item-code and --price-list."
        params:
          - name: item_code
            type: string
            required: true
            description: "SAP item code"
          - name: price_list
            type: string
            required: true
            description: "Price list id"
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      next-doc-number:
        method: GET
        path: "/api/hana/next-doc-number/"
        description: "Next document number for a document type. Requires --doc-type."
        params:
          - name: doc_type
            type: string
            required: true
            description: "Document type"
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      salesperson-details:
        method: GET
        path: "/api/hana/salesperson-details/"
        description: "Salesperson detail. Requires --slp-code."
        params:
          - name: slp_code
            type: string
            required: true
            description: "Salesperson code"
          - name: branch
            type: string
            required: true
            description: "One of: OIL | BEVERAGE. string, required, not positional. `OIL | BEVERAGE`. Source: server 400."
        response:
          type: array
      series:
        method: GET
        path: "/api/hana/series/"
        description: "SAP document numbering series for a branch — the series a document will draw its number from."
        params:
          - name: branch
            type: string
            required: true
            description: "SAP company database to read. One of: OIL | BEVERAGE. Required by the server on every hana endpoint; the figures differ per branch, so an answer without it is meaningless."
        response:
          type: array
      warehouse-details:
        method: GET
        path: "/api/hana/warehouse-details/"
        description: "Warehouse master for a branch: codes, names and locations behind every WhsCode you see in stock and batch data."
        params:
          - name: branch
            type: string
            required: true
            description: "SAP company database to read. One of: OIL | BEVERAGE. Required by the server on every hana endpoint; the figures differ per branch, so an answer without it is meaningless."
        response:
          type: array
      vendor-states:
        method: GET
        path: "/api/hana/vendor-states/"
        description: "States JIVO's vendors operate in, per branch — used to work out interstate vs intrastate GST."
